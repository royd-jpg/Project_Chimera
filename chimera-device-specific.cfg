# chimera-device-specific.cfg
# Chimera Mk9 — device-specific Kconfig deltas only.
#
# Verified by diffing royd-jpg/Project_Chimera@chimera-mk8 defconfig against
# gavdoc38/android_kernel_samsung_exynos9810@lineage-23.2-ksun3-susfs2
# defconfig directly. Everything here is a genuine addition/override on top
# of the gavdoc38 base — it is NOT KSU/SUSFS Kconfig (that lives in
# chimera-ksu-susfs.cfg and is merged separately).
#
# Note: CONFIG_NET_ACT_BPF is already =y in the gavdoc38 base defconfig —
# it is NOT part of the chimera-mk8 delta and is not repeated here.
# CONFIG_EXYNOS_HOTPLUG_GOVERNOR is likewise already =y in gavdoc38 base
# and not part of the chimera delta.
#
# Merge alongside chimera-ksu-susfs.cfg in the same merge_config.sh
# invocation, e.g.:
#   scripts/kconfig/merge_config.sh -m -O "$ABS_OUT" "$ABS_OUT/.config" \
#     /tmp/chimera-ksu-susfs.cfg /tmp/chimera-device-specific.cfg

# Madera (Cirrus Logic cs47l9x) codec MFD core + SPI bus glue + GPIO child.
# Required for the cs47l93 speaker amp/codec on this board
# (spi@10470000/cs47l93@0 in the device tree) -- without these,
# madera-spi.c and madera-core.c are not compiled in at all, so the SPI
# core has no driver to bind the device to and the codec never probes
# (silent speaker, no Madera strings anywhere in dmesg). The matching
# cs47l93@0 devicetree node also needs status = "okay", which the
# Chimera overlay script's DTS section adds separately.
CONFIG_MFD_MADERA=y
CONFIG_MFD_MADERA_SPI=y
CONFIG_MFD_CS47L92=y
CONFIG_PINCTRL_MADERA=y
CONFIG_GPIO_MADERA=y
CONFIG_MFD_CS47L92_GPIO=y

# gavdoc38 base defaults to CONFIG_HZ_100; Chimera overrides to HZ_300 for
# UI latency on Exynos 9810 (locked non-negotiable per prior KCFLAGS tuning
# work — do not revert to HZ_100).
CONFIG_HZ_300=y
# CONFIG_HZ_100 is not set

# TCP BBR congestion control + CRC32 ARMv8 acceleration.
CONFIG_TCP_CONG_ADVANCED=y
CONFIG_TCP_CONG_BBR=y
CONFIG_TCP_CONG_CUBIC=y
CONFIG_DEFAULT_BBR=y
CONFIG_CRC32_ARMV8_CRC=y
CONFIG_NET_SCHED=y
CONFIG_NET_SCH_FQ=y
CONFIG_NET_SCH_FQ_CODEL=y
CONFIG_DEFAULT_FQ_CODEL=y
CONFIG_DEFAULT_NET_SCH="fq_codel"
CONFIG_TCP_CONG_ADVANCED=y

# Scheduler debug on (Chimera keeps this enabled; gavdoc38 base disables it).
CONFIG_SCHED_DEBUG=y

# Security log exposure / debug stripping — prevents panics from verbose
# lock/preempt debug paths in production builds.
CONFIG_KSU_DEBUG=n
# CONFIG_DEBUG_PREEMPT is not set
# CONFIG_PROVE_LOCKING is not set
# CONFIG_LOCKDEP is not set

# Knox / Samsung heavy restrictions — must stay off for root+SUSFS to
# function (see audit: RKP/KDP, TIMA, and SEC_RESTRICT_* are separate from
# these but these three are the ones Chimera has historically needed off).
CONFIG_SECURITY_DEFEX=n
# CONFIG_TIMA is not set
# CONFIG_KNOX_KAP is not set
