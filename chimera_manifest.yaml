patches_metadata:
  target_branch: "chimera-mk6l"
  base_commit: "HEAD"

pipeline_sequence:
  - id: P01
    title: "Low Latency Schedutil Rate Limits"
    source_type: "git_patch"
    path: "patches/0001-schedutil-low-latency.patch"
    verify_post_build:
      command: "grep -n 'up_rate_limit_us' drivers/cpufreq/cpufreq_schedutil.c"
      expected: "1500"

  - id: P02
    title: "Deactivate UFC Notifier Subsystem"
    source_type: "git_patch"
    path: "patches/0002-ufc-deactivate.patch"
    verify_post_build:
      command: "grep -n 'CONFIG_UFC' arch/arm64/configs/exynos9810_defconfig"
      expected: "is not set"
