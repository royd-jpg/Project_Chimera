# chimera-ksu-susfs.cfg
# SUSFS overlay fragment. Merge ON TOP of chimera-ksu-manual.cfg OR
# chimera-ksu-kprobe.cfg (SUSFS requires KSU enabled).
#
# Affects: SUSFS (combined with manual or kprobe mode).
# SUSFS is included due to device age and lack of ongoing Google Play / vendor
#   support, to maintain compatibility on user-owned legacy hardware. Strictly
#   for legitimate use (filesystem visibility / namespace testing).
#
# Verified Kconfig symbols: gavdoc38/KernelSU-Next @ 242f245b (see chimera-ksu-manual.cfg
#   for why this replaces the originally-specified, nonexistent 685b4a6 pin), kernel/Kconfig
#   "KernelSU - SUSFS" menu. CONFIG_KSU_SUSFS depends on KSU && THREAD_INFO_IN_TASK
#   (THREAD_INFO_IN_TASK is selected unconditionally by arch/arm64/Kconfig -- VERIFIED
#   against the actual lineage-24.0 tree, not assumed).
#
# SUSFS implementation (fs/susfs.c, include/linux/susfs*.h) is NOT vendored in
#   KernelSU-Next; it comes from royd-jpg/Project_Chimera, branch
#   lineage-23.2-ksun3-susfs2 (commit 6752be5bb08dccfc58d9bc98c51199515aa19abc --
#   VERIFIED: this branch and commit exist). Reference layout VERIFIED by direct clone:
#   fs/susfs.c, include/linux/susfs.h, include/linux/susfs_def.h,
#   patches/apply_ksu_susfs_patches_v00.sh, and fs/Makefile line
#   `obj-$(CONFIG_KSU_SUSFS) += susfs.o`. KSU's own Kconfig SUSFS sub-options
#   (SUS_PATH, SUS_MOUNT, etc.) below are unaffected by the KSU-source pin correction --
#   they live in KernelSU-Next's kernel/Kconfig, not in fs/susfs.c.
#
# UNVERIFIED — REQUIRES CONFIRMATION: royd-jpg/Project_Chimera has no lineage-24.0
#   SUSFS branch yet (its lineage-24.0 HEAD, c1f4f76a (2026-09-15), is a clean/stock
#   tree -- VERIFIED by direct clone: no drivers/kernelsu, no fs/susfs.c, no KSU
#   references in drivers/Kconfig or drivers/Makefile). Whether fs/susfs.c from the
#   23.2 branch applies to lineage-24.0 fs/*.c without further changes is UNTESTED;
#   this workflow copies fs/susfs.c + headers verbatim and wires fs/Makefile, but
#   does NOT run patches/apply_ksu_susfs_patches_v00.sh (its sed anchors target 23.2
#   fs/*.c and were not verified against 24.0). CI verifies fs/susfs.c presence at
#   build time and fails closed if absent or if it fails to compile.

CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_ENABLE_LOG=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_SUS_MEMFD=y
