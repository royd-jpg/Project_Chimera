# chimera-ksu-kprobe.cfg
# KernelSU kprobe/tracepoint hook mode (SUSFS OFF).
# Merge on top of an exynos9810-*_defconfig via scripts/kconfig/merge_config.sh.
#
# Affects: kprobe mode only. Use only if manual mode (chimera-ksu-manual.cfg) is
#   unavailable/undesired -- manual mode remains preferred on this tree, see there.
#
# VERIFIED against the actual lineage-24.0 tree (not assumed):
#   - arch/arm64/Kconfig: `select HAVE_SYSCALL_TRACEPOINTS`, `select HAVE_KPROBES`,
#     `select HAVE_KRETPROBES if HAVE_KPROBES`, `select THREAD_INFO_IN_TASK`.
#   - CONFIG_KPROBES=y is present in all three defconfigs: exynos9810-star2lte,
#     exynos9810-starlte, exynos9810-crownlte (line 48 in each).
#   - KernelSU-Next kernel/Kconfig help text (both @ 242f245b and current `legacy`
#     HEAD): "This should not be used on kernel below 5.10." This tree is 4.9.337.
#
# CORRECTION to the original comment's RKP/DEFEX claim:
#   `grep`-ing the exynos9810-star2lte_defconfig for RKP/DEFEX/UH symbols found none
#   (only an unrelated CONFIG_UHID false-positive match on "UH"). That does NOT mean
#   RKP/TIMA/DEFEX are absent on-device: on Samsung Exynos, RKP/TIMA are typically
#   enforced by an EL2/TrustZone hypervisor blob loaded from the bootloader, outside
#   Kconfig-visible symbols entirely, so their presence/absence cannot be confirmed or
#   ruled out from this defconfig alone. UNVERIFIED — REQUIRES CONFIRMATION: physical-
#   device boot test. Treat the "kprobe mode may conflict with Samsung
#   RKP/DEFEX" warning as still standing.
#
# UNVERIFIED — REQUIRES CONFIRMATION: runtime stability of kretprobe-on-syscall
#   tracepoint on Linux 4.9.337 arm64 with Samsung security; boot/root untested.
#   Also note: the kprobe/tracepoint hook_manager.c implementation is generation-
#   specific to whichever KSU source you pin (242f245b vs. current `legacy` HEAD use
#   different internal layouts -- kernel/hook/hook_manager.c exists in both, but paired
#   with different policy/runtime modules). Pin a single, tested commit; do not mix.
#
# STATUS PER USER REPORT: kprobe mode has not worked in prior attempts on this
#   device family. Neither this .cfg fragment nor the Mk9 workflow can diagnose why
#   from source alone -- root cause is one of: (a) RKP/TIMA blocking the kretprobe
#   attach or the resulting hook's privilege-escalation path at runtime (EL2/
#   TrustZone-enforced, invisible to Kconfig or dmesg in many Samsung configs),
#   (b) a KSU-generation mismatch between the pinned commit's hook_manager.c and its
#   paired runtime/policy module (see caveat above), or (c) a kernel-config
#   dependency this fragment doesn't independently verify (e.g. HAVE_REGS_AND_STACK_
#   ACCESS_API, stack-unwinder support for kretprobes on this arm64 tree -- NOT
#   checked here). UNVERIFIED — REQUIRES CONFIRMATION: pull dmesg / last_kmsg from a
#   failed boot attempt to distinguish (a) from (b)/(c) before re-attempting.

CONFIG_KPROBES=y
CONFIG_KRETPROBES=y
CONFIG_KSU=y
# CONFIG_KSU_MANUAL_HOOK is not set
CONFIG_KSU_KPROBES_HOOK=y
# CONFIG_KSU_SUSFS is not set
