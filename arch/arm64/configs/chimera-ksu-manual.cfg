# chimera-ksu-manual.cfg
# KernelSU manual-hook mode (SUSFS OFF).
# Merge on top of an exynos9810-*_defconfig via scripts/kconfig/merge_config.sh.
#
# Affects: manual mode only.
# Rationale: KSU_MANUAL_HOOK is preferred on Exynos 9810 / Linux 4.9.337 (kprobe mode's
#   own Kconfig help text says "should not be used on kernel below 5.10" -- VERIFIED,
#   gavdoc38/KernelSU-Next kernel/Kconfig, both at the pin below and at current HEAD).
#   Requires real KSU call sites patched into the base tree (fs/exec.c, fs/open.c,
#   fs/stat.c, fs/read_write.c, drivers/input/input.c, kernel/reboot.c) -- see
#   manual-hooks.patch. CI greps for them and fails closed if absent.
#
# CORRECTED PIN -- READ BEFORE USE:
#   The commit originally specified in the task brief,
#   685b4a6ba3d2befdf40b3c67cf096d050c7aa6cb, DOES NOT EXIST in gavdoc38/KernelSU-Next
#   (checked with `git log --all` / `git rev-list --all`across every branch and PR ref;
#   zero matches). It cannot be pinned or built. UNVERIFIED — REQUIRES CONFIRMATION with
#   whoever supplied that SHA; it may be a typo'd or hallucinated hash.
#
#   The real, working commit is 242f245b2c971eb5c1cc4a689e01dcdeaff4c939 -- this is the
#   exact SHA pinned as a git submodule in royd-jpg/Project_Chimera's OWN production
#   branch lineage-23.2-ksun3-susfs2 (.gitmodules, path "KernelSU-Next"), and it is the
#   source that manual-hooks.patch (fs/exec.c etc.) was verified against. It contains
#   working ksu_handle_execveat / ksu_handle_faccessat / ksu_handle_stat /
#   ksu_handle_sys_reboot / ksu_handle_input_handle_event definitions.
#
#   CAVEAT: 242f245b is NOT reachable from any current branch tip in the KSU repo
#   (`git branch --all --contains` returns nothing) -- it is a dangling commit, only
#   fetchable by direct SHA (`git fetch origin 242f245b...`). It survived a later
#   history rewrite but GitHub does not guarantee unreferenced objects are retained
#   indefinitely. Mitigation: mirror this exact commit into a branch/tag in your own
#   fork (e.g. royd-jpg/KernelSU-Next-pins) the first time CI succeeds, and repoint
#   ksu_repo/ksu_ref at that mirror.
#
#   Do NOT track KernelSU-Next's `legacy` branch HEAD as a moving target for manual
#   mode: current HEAD (fc33995..., 2026-04-20) still DECLARES CONFIG_KSU_MANUAL_HOOK
#   in kernel/Kconfig but the macro is unused anywhere in the C sources on that branch
#   (verified: `grep -rn KSU_MANUAL_HOOK` outside Kconfig returns nothing) -- selecting
#   it compiles CONFIG_KSU=y with NO working hook mechanism (root silently does not
#   work). That branch generation (same lineage as commit 86e21a3, referenced in an
#   earlier session's prompt) replaced manual call-site hooks with kprobes + LSM hooks
#   + a separate setuid_hook.c; it is a structurally different, newer KSU generation
#   and is NOT a drop-in replacement for 242f245b on this task.
#
# ksu_handle_sys_read SIGNATURE FIX (see manual-hooks.patch, fs/read_write.c):
#   At 242f245b, kernel/runtime/ksud_integration.c defines
#     void ksu_handle_sys_read(unsigned int fd)      // 1 arg, void
#   The historical Project_Chimera 23.2 fs/read_write.c patch instead declares/calls
#     int ksu_handle_sys_read(unsigned int fd, char **buf, size_t *count)   // 3 args
#   These do not match (conflicting types -- will not link cleanly). manual-hooks.patch
#   uses the RECONCILED 1-arg/void signature that actually matches this pin.
#
# Verified Kconfig symbols (kernel/Kconfig @ 242f245b): CONFIG_KSU (tristate, default y),
#   CONFIG_KSU_MANUAL_HOOK (bool, depends on KSU && KSU != m, default y),
#   CONFIG_KSU_KPROBES_HOOK (bool, depends on KSU && !KSU_MANUAL_HOOK, default n).
#
# SUSFS note: CONFIG_KSU_SUSFS depends on KSU && THREAD_INFO_IN_TASK. THREAD_INFO_IN_TASK
#   is selected unconditionally by arch/arm64/Kconfig on this tree -- VERIFIED.

CONFIG_KSU=y
CONFIG_KSU_MANUAL_HOOK=y
# CONFIG_KSU_KPROBES_HOOK is not set
# CONFIG_KSU_SUSFS is not set
