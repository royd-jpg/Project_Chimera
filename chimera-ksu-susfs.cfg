# Chimera Mk9 — KSU-Next + SUSFS Kconfig fragment
# Applied via: scripts/kconfig/merge_config.sh -m -O <outdir> <outdir>/.config chimera-ksu-susfs.cfg
# followed by `make olddefconfig` to resolve dependents.

# --- KernelSU-Next core (non-kprobe call-site mode) ---
CONFIG_KSU=y
CONFIG_KSU_NON_KPROBE=y
# CONFIG_KSU_KPROBES_HOOK is not set

# --- SUSFS core + sub-features actually wired in this tree ---
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
# CONFIG_KSU_SUSFS_SUS_MEMFD is not set
# CONFIG_KSU_SUSFS_SPOOF_UNAME is not set
# CONFIG_KSU_SUSFS_SPOOF_SELINUX is not set

# --- Samsung rooting-restriction / integrity guards: keep hard-disabled ---
# CONFIG_SEC_RESTRICT_ROOTING is not set
# CONFIG_SEC_RESTRICT_SETUID is not set
# CONFIG_RKP_KDP is not set
# CONFIG_UH_RKP is not set
# CONFIG_TIMA is not set
# CONFIG_TIMA_LKMAUTH is not set
# CONFIG_FIVE is not set
# CONFIG_DEFEX is not set
