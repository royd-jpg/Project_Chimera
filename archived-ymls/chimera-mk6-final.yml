name: Project Chimera MK6 — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true

      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Allow patching even if KSU/SUSFS already present in tree"
        required: false
        type: boolean
        default: false

      enable_zeromount:
        description: "Enable ZeroMount compatibility probe"
        required: false
        type: boolean
        default: true

      enable_susfs_open_redirect:
        description: "Enable SUSFS OPEN_REDIRECT"
        required: false
        type: boolean
        default: true

      enable_susfs_hide_symbols:
        description: "Enable SUSFS symbol hiding"
        required: false
        type: boolean
        default: true

      enable_susfs_try_umount:
        description: "Enable SUSFS TRY_UMOUNT"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO: "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6"

      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.9"

      KERNEL_DIR: "kernel"
      OUT_DIR: "kernel-out"
      LOG_DIR: "logs"

      NEUTRON_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY: "neutron-clang-10032024-pinned-v2"

    steps:

      # ════════════════════════════════════════════════
      # 0. Workspace
      # ════════════════════════════════════════════════

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"
          mkdir -p "$OUT_DIR"

      # ════════════════════════════════════════════════
      # 1. Dependencies
      # ════════════════════════════════════════════════

      - name: Install dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -yqq \
            git \
            curl \
            wget \
            bc \
            flex \
            bison \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            build-essential \
            zip \
            unzip \
            zstd \
            lz4 \
            rsync \
            jq \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ════════════════════════════════════════════════
      # 2. Neutron Toolchain
      # ════════════════════════════════════════════════

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          mkdir -p neutron-clang

          echo "Downloading pinned Neutron Clang: $NEUTRON_URL" \
            | tee "$LOG_DIR/toolchain.log"

          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"

          tar \
            --use-compress-program=unzstd \
            -xf /tmp/neutron.tar.zst \
            -C neutron-clang \
            --strip-components=1

          test -x neutron-clang/bin/clang

          neutron-clang/bin/clang --version \
            | tee -a "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: |
          set -Eeuo pipefail

          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ════════════════════════════════════════════════
      # 3. Clone kernel
      # ════════════════════════════════════════════════

      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail

          git clone \
            --depth=1 \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          git -C "$KERNEL_DIR" log --oneline -3 \
            | tee "$LOG_DIR/kernel-revision.log"

      # ════════════════════════════════════════════════
      # 4. Clone SUSFS
      # ════════════════════════════════════════════════

      - name: Clone SUSFS
        run: |
          set -Eeuo pipefail

          git clone \
            --depth=1 \
            -b "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/susfs_def.h

          git -C susfs4ksu rev-parse HEAD \
            | tee "$LOG_DIR/susfs-revision.log"

      # ════════════════════════════════════════════════
      # 5. KernelSU-Next
      # ════════════════════════════════════════════════

      - name: Set up KernelSU-Next
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          git rm -r --cached KernelSU-Next 2>/dev/null || true

          rm -rf .git/modules/KernelSU-Next
          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          KSU_URL="$(git config --file .gitmodules submodule.KernelSU-Next.url 2>/dev/null || true)"
          KSU_COMMIT="$(git ls-tree HEAD KernelSU-Next 2>/dev/null | awk '{print $3}' || true)"

          echo "Submodule URL: ${KSU_URL:-not found}" \
            | tee "../$LOG_DIR/ksu-submodule.log"

          echo "Pinned commit: ${KSU_COMMIT:-not found}" \
            | tee -a "../$LOG_DIR/ksu-submodule.log"

          if [[ -n "$KSU_URL" && -n "$KSU_COMMIT" ]]; then
            git clone "$KSU_URL" KernelSU-Next
            git -C KernelSU-Next checkout "$KSU_COMMIT"
          elif [[ -n "$KSU_URL" ]]; then
            git clone --depth=1 "$KSU_URL" KernelSU-Next
          else
            git clone \
              --depth=1 \
              https://github.com/gavdoc38/KernelSU-Next.git \
              KernelSU-Next
          fi

          test -f KernelSU-Next/kernel/Kconfig

          git -C KernelSU-Next log --oneline -1 \
            | tee -a "../$LOG_DIR/ksu-submodule.log"

          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

          test -f drivers/kernelsu/Kconfig

      # ════════════════════════════════════════════════
      # 6. SUSFS ABI Fix
      # ════════════════════════════════════════════════

      - name: Apply Samsung 4.9 syscall ABI fix
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"

          test -f "$HOOK_H"

          if grep -Fq 'typedef long (*syscall_fn_t)' "$HOOK_H"; then
            echo "ABI typedef already present"
            exit 0
          fi

          cat > /tmp/fix_syscall_typedef.py <<'PYEOF'
          from pathlib import Path
          import re

          path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")

          text = path.read_text()

          typedef_block = r"""
          /* syscall_fn_t: Samsung 4.9 BSP compatibility */
          typedef long (*syscall_fn_t)(
              unsigned long,
              unsigned long,
              unsigned long,
              unsigned long,
              unsigned long,
              unsigned long
          );
          """

          pos = 0

          for match in re.finditer(
              r'^#(include|pragma|ifndef|define)[^\n]*\n',
              text,
              re.MULTILINE
          ):
              pos = match.end()

          if "typedef long (*syscall_fn_t)" not in text:
              text = text[:pos] + typedef_block + "\n" + text[pos:]
              path.write_text(text)
              print("typedef injected")
          else:
              print("typedef already exists")
          PYEOF

          python3 - <<'PYEOF'
          import textwrap

          path = "/tmp/fix_syscall_typedef.py"

          with open(path, "r", encoding="utf-8") as f:
              data = f.read()

          with open(path, "w", encoding="utf-8") as f:
              f.write(textwrap.dedent(data))
          PYEOF

          python3 /tmp/fix_syscall_typedef.py

      # ════════════════════════════════════════════════
      # 7. Preflight
      # ════════════════════════════════════════════════

      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          {
            echo "=== git status ==="
            git status --short

            echo
            echo "=== KSU/SUSFS markers ==="

            grep -RsnE \
              'KernelSU|kernelsu|CONFIG_KSU|KSU_SUSFS|ksu_handle_faccessat|susfs_task_state|susfs_is_inode_sus_path' \
              fs include kernel arch/arm64/configs \
              2>/dev/null || true

          } | tee "../$LOG_DIR/preflight.log"

          ALREADY_PATCHED=false

          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs \
            2>/dev/null; then
            ALREADY_PATCHED=true
          fi

          echo "ALREADY_PATCHED=$ALREADY_PATCHED" \
            | tee -a "../$LOG_DIR/preflight.log"

          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ════════════════════════════════════════════════
      # 8. Wire KernelSU
      # ════════════════════════════════════════════════

      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig

          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi

          sed -i \
            '/^endmenu/i source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"

          [[ "$COUNT" -eq 1 ]]

      # ════════════════════════════════════════════════
      # 9. Apply SUSFS
      # ════════════════════════════════════════════════

      - name: Apply SUSFS patch
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          set +e

          git apply \
            --reject \
            --whitespace=fix \
            "$PATCH" \
            > "../$LOG_DIR/susfs-apply.log" 2>&1

          APPLY_RC=$?

          set -e

          echo "Apply RC=$APPLY_RC" \
            | tee -a "../$LOG_DIR/susfs-apply.log"

          find . -name '*.rej' -print \
            | sort \
            > "../$LOG_DIR/susfs-rejects.log" || true

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" \
            fs/susfs.c

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" \
            fs/sus_su.c

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" \
            include/linux/susfs_def.h

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" \
            include/linux/sus_su.h

          grep -q 'susfs.o' fs/Makefile || \
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

      # ════════════════════════════════════════════════
      # 10. ZeroMount probe
      # ════════════════════════════════════════════════

      - name: ZeroMount compatibility probe
        if: ${{ inputs.enable_zeromount }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          {
            echo "=== ZeroMount compatibility probe ==="

            echo
            echo "== kernel markers =="

            grep -RsnE \
              'CONFIG_KSU_SUSFS|susfs_task_state|INODE_STATE_SUS_PATH|susfs_is_inode_sus_path|CONFIG_KSU_SUSFS_OPEN_REDIRECT' \
              fs include kernel \
              2>/dev/null || true

            echo
            echo "== SUSFS markers =="

            grep -RsnE \
              'ShowVersion|supercall|SUSFS|susfs' \
              "$GITHUB_WORKSPACE/susfs4ksu" \
              2>/dev/null || true

          } | tee "../$LOG_DIR/zeromount-compat.log"

      # ════════════════════════════════════════════════
      # 11. AVC-safe SUSFS config
      # ════════════════════════════════════════════════

      - name: Apply AVC-safe SUSFS config
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"

          test -f "$DEFCONFIG"

          set_cfg() {
            sed -i "/^$1=.*/d" "$DEFCONFIG"
            sed -i "/^# $1 is not set/d" "$DEFCONFIG"
            echo "$1=$2" >> "$DEFCONFIG"
          }

          unset_cfg() {
            sed -i "/^$1=.*/d" "$DEFCONFIG"
            sed -i "/^# $1 is not set/d" "$DEFCONFIG"
            echo "# $1 is not set" >> "$DEFCONFIG"
          }

          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
          set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y

          if [[ "${{ inputs.enable_susfs_open_redirect }}" == "true" ]]; then
            set_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          else
            unset_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT
          fi

          if [[ "${{ inputs.enable_susfs_hide_symbols }}" == "true" ]]; then
            set_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          else
            unset_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          fi

          if [[ "${{ inputs.enable_susfs_try_umount }}" == "true" ]]; then
            set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          else
            unset_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT
          fi

          unset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT
          unset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME
          unset_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF
          unset_cfg CONFIG_KSU_SUSFS_AVC_LOG_SPOOF
          unset_cfg CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK
          unset_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX

      # ════════════════════════════════════════════════
      # 12. Dry Run
      # ════════════════════════════════════════════════

      - name: Dry run complete
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run passed"
          echo "Check logs and artifacts"
          exit 0

      # ════════════════════════════════════════════════
      # 13. Build kernel
      # ════════════════════════════════════════════════

      - name: Build kernel
        if: ${{ !inputs.dry_run }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          BUILD_NUM="$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")"
          LOCALVERSION="-Chimera_Mk6r2-${BUILD_NUM}"

          export KBUILD_BUILD_USER="X"
          export KBUILD_BUILD_HOST="AegisDevLabs"

          MAKE=(
            make
            -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld"
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KCFLAGS="-fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig

          cp \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          "${MAKE[@]}" \
            LOCALVERSION="$LOCALVERSION" \
            Image dtbs \
            2>&1 | tee build.log

          test -f "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image"

          du -h "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"

      # ════════════════════════════════════════════════
      # 14. Package AnyKernel3
      # ════════════════════════════════════════════════

      - name: Package flashable zip
        if: ${{ !inputs.dry_run }}
        run: |
          set -Eeuo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3 \
            AnyKernel3

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Project Chimera MK6r2
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star2lte
          device.name2=SM-G965F
          device.name3=SM-G965U
          device.name4=SM-G965N
          device.name5=SM-G9650
          '; }

          block=boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          sed -i 's/^[[:space:]]*//' AnyKernel3/anykernel.sh

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            AnyKernel3/

          find \
            "$OUT_DIR/arch/arm64/boot/dts/exynos" \
            -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \;

          ZIP="chimera-mk6r2-$(date +%Y%m%d-%H%M).zip"

          (
            cd AnyKernel3
            zip -r9 "../$ZIP" . -x '*.git*'
          )

          test -f "$ZIP"

      # ════════════════════════════════════════════════
      # 15. Upload artifacts
      # ════════════════════════════════════════════════

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-logs-${{ github.run_number }}
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload flashable zip
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6-${{ github.run_number }}
          path: chimera-*.zip
          if-no-files-found: error
          retention-days: 30

      # ════════════════════════════════════════════════
      # 16. GitHub Release
      # ════════════════════════════════════════════════

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6-${{ github.run_number }}

          name: >-
            Project Chimera MK6 —
            Lineage 23.2 Build #${{ github.run_number }}

          body: |
            ## Project Chimera MK6 — Exynos 9810 / star2lte

            Base:
            Project_Chimera @ chimera-mk6

            ### Integrated

            - KernelSU Next
            - SUSFS safe config
            - Samsung 4.9 syscall ABI fix
            - ZeroMount compatibility probe
            - OPEN_REDIRECT enabled
            - BPF enabled
            - HZ_300 / PREEMPT
            - Camera ION tuned / CMA 768MB

            ### Flash order

            1. Flash LineageOS 23.2 + recovery
            2. Sideload this zip
            3. Install KernelSU Next manager
            4. Install SUSFS module
            5. Reboot

          files: chimera-*.zip
