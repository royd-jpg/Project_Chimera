# Kernel — Android 17 (KernelSU-Next + SUSFS) — Exynos 9810 — Mk10 (diagnostic)
#
# "Android 17 compatibility here means building the modified Exynos 9810
# vendor kernel for potential use with a compatible LineageOS 24 userspace.
# Runtime compatibility requires physical-device testing."
#
# ─────────────────────────────────────────────────────────────────────────
# STATUS OF THIS REVISION — READ BEFORE RUNNING
#
# CONFIRMED FIXED (verified directly against the committed source):
#   1. d7b09c39c still had the null-coercion bug (`inputs.*` is null on
#      push/pull_request; `null||true`/`null!=false` disagree) — fixed here
#      the same way as the prior "Resolve build inputs" revision: every
#      input resolved once, explicitly, keyed on github.event_name.
#   2. A SEPARATE, previously-uncaught bug: `ENABLE_SUSFS: ${{ inputs.
#      enable_susfs || true }}` is a boolean OR, not a default-if-unset.
#      `false || true` is ALWAYS true. This meant SUSFS could never be
#      turned off even via an explicit workflow_dispatch enable_susfs=false.
#      Fixed by the same explicit resolve() function (no `||` on booleans
#      anywhere in this file now).
#
# NOT YET FIXED — ROOT CAUSE OF run 35324461860 / job 105534197323
# ("Build — aosp22 +susfs", commit 6b5c1b6):
#   That job was workflow_dispatch (toolchain=aosp22, non-default — only
#   dispatch can set that), so items 1 and 2 above are NOT what broke it;
#   inputs.* is genuinely populated on dispatch regardless of those bugs.
#   The real failure: KernelSU-Next's OWN build-time auto-patcher (the
#   "-- KSU_NEXT: ..." lines in the log) runs an INDEPENDENT check for
#   whether SUSFS is "integrated" — separate from CONFIG_KSU_SUSFS in
#   .config — and reports "You have not integrated susfs in your kernel
#   yet" immediately before drivers/kernelsu/core/init.c fails to find
#   linux/susfs.h. This workflow's SUSFS step only ever copies fs/susfs.c
#   + include/linux/susfs*.h + one avc.c symbol shim. It has never patched
#   anything inside the vendored drivers/kernelsu/ tree itself, and a real
#   susfs4ksu-for-KernelSU-Next integration (confirmed from a comparable
#   published patch) also touches the KSU-Next tree's own Kconfig/Makefile/
#   allowlist.c/apk_sign.c. That is the most likely real cause, but I do
#   NOT have read access to this pin's actual drivers/kernelsu/Kbuild
#   self-check logic (full CI log requires sign-in), so I am not
#   fabricating an exact fix against it. Instead, the "Diagnose SUSFS
#   self-check" step below dumps that Kbuild's actual SUSFS-detection
#   logic into the log BEFORE the build step runs, so the next run gives
#   ground truth instead of another guess. Do not merge a "fix" for this
#   until that step's output is read.
#
# CARRIED FORWARD UNCHANGED FROM THE PRIOR VERIFIED STATE (not re-verified
# by me this pass — I did not re-run these): the sibling uapi/ vendoring,
# the 6 anchor-based manual-hook call sites, the avc.c
# susfs_is_avc_log_spoofing_enabled shim, CONFIG_KSU_SUSFS_SUS_MEMFD forced
# off. See the original Mk9 header (preserved below in condensed form) for
# the detailed rationale on each.
#
# ADDITIONAL FIXES FROM THE ORIGINAL MK9 PASS (verified by direct
# compile/link testing against gavdoc38/KernelSU-Next @
# b3263c77975616d3c29d48aa600892263e7d75c9 on the real 4.9.337 tree):
#   1. This KSU-Next repo has a sibling uapi/ next to kernel/ at its root;
#      vendoring only kernel/ breaks #include "uapi/app_profile.h".
#   2. All 6 manual-hook call sites are required — this pin's own Kbuild
#      hard-gates on kernel/reboot.c's hook existing at all.
#   3. CONFIG_KSU_SUSFS_SUS_MEMFD defaults to y once CONFIG_KSU_SUSFS=y,
#      but the vendored SUSFS source (v2.2.0-era) predates
#      susfs_add_sus_memfd() — forced off explicitly.
#   4. fs/susfs.c requires extern bool susfs_is_avc_log_spoofing_enabled
#      unconditionally; defined (inert, defaults false) in
#      security/selinux/avc.c.
#   5/6. setup_selinux()/try_umount()/susfs_ksu_sid/susfs_priv_app_sid
#      already resolve from inside the vendored driver — no action needed.
#
# kprobe mode is not offered: this fork's kprobe path targets 5.10+ hook
# infrastructure and does not work on this 4.9.337 base. Manual mode only.

on:
  push:
    branches: [lineage-24.0]
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - ".github/workflows/kernel-android17-ksun-susfs-mk10.yml"
  pull_request:
    branches: [lineage-24.0]
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - ".github/workflows/kernel-android17-ksun-susfs-mk10.yml"
  workflow_dispatch:
    inputs:
      toolchain:
        description: "llvm22, llvm21, llvm20, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, or zyc_stable"
        type: string
        required: true
        default: llvm22
      enable_susfs:
        description: "Build with SUSFS on top of KernelSU-Next manual hooks. NOTE: currently fails at compile time — see workflow header. Leave false until the diagnose step's output is reviewed."
        type: boolean
        required: true
        default: false
      localversion:
        description: "Kernel localversion; must start with '-'"
        type: string
        required: true
        default: "-Chimera_Mk10"
      build_user:
        type: string
        required: true
        default: MTRXX
      build_host:
        type: string
        required: true
        default: CM9XNNNN
      build_version:
        type: string
        required: true
        default: "1"
      build_timestamp:
        type: string
        required: true
        default: "Wed Aug 19 03:26:19 UTC 2026"
      build_variants:
        description: "Comma-separated: star2lte,starlte,crownlte"
        type: string
        required: true
        default: "star2lte,starlte,crownlte"
      upload_dtbs:
        type: boolean
        required: true
        default: true
      enable_lto:
        type: boolean
        required: true
        default: false
      extra_cflags:
        type: string
        required: false
        default: ""
      ksu_repo:
        description: "KernelSU-Next fork repo (owner/repo)"
        type: string
        required: true
        default: "gavdoc38/KernelSU-Next"
      ksu_ref:
        description: "Full 40-hex commit SHA. Do NOT use a branch name."
        type: string
        required: true
        default: "b3263c77975616d3c29d48aa600892263e7d75c9"
      susfs_repo:
        description: "Source repo carrying fs/susfs.c + include/linux/susfs*.h (owner/repo)"
        type: string
        required: true
        default: "royd-jpg/Project_Chimera"
      susfs_ref:
        description: "SUSFS source ref/SHA (v2.2.0-era)"
        type: string
        required: true
        default: "6752be5bb08dccfc58d9bc98c51199515aa19abc"
      dry_run:
        type: boolean
        required: true
        default: false
      do_release:
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: kernel-exynos9810-${{ github.workflow }}-${{ github.ref }}-${{ inputs.toolchain || 'llvm22' }}
  cancel-in-progress: true

env:
  # Only static, non-input values. Everything derived from a
  # workflow_dispatch input is resolved exactly once, explicitly, by
  # "Resolve build inputs" below. Never combine a boolean input with `||`
  # anywhere in this file — `x || true` is a constant `true`, and
  # `inputs.x` is null (not false) on push/pull_request, so `null || true`
  # is also always `true`. Both variants of this bug are what this
  # revision fixes.
  ARCH: arm64
  CCACHE_MAXSIZE: 3G
  KERNEL_VERSION: 4.9.337

jobs:
  build:
    name: Build — ${{ inputs.toolchain || 'llvm22' }} (${{ github.event_name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Project_Chimera
        uses: actions/checkout@v5
        with:
          repository: royd-jpg/Project_Chimera
          ref: lineage-24.0
          fetch-depth: 1
          submodules: recursive

      # Explicit, single source of truth for every input, keyed on
      # github.event_name. inputs.* is only populated on workflow_dispatch;
      # on push/pull_request it is null regardless of declared defaults.
      # No other step in this file reads raw inputs.* in a shell or `if:`
      # condition. (job name:, concurrency.group:, and the toolchain cache
      # key: below are workflow/job-parse-time expressions that run before
      # any step's $GITHUB_ENV exists — harmless, display/cache-key only.)
      - name: Resolve build inputs
        run: |
          set -euo pipefail
          echo "::group::Resolve build inputs"
          is_dispatch=false
          [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && is_dispatch=true

          resolve() {
            # $1=env var  $2=raw input (empty on non-dispatch)  $3=declared default
            if [[ "$is_dispatch" == "true" ]]; then
              echo "${1}=${2}" >> "$GITHUB_ENV"
            else
              echo "${1}=${3}" >> "$GITHUB_ENV"
            fi
          }

          resolve ENABLE_SUSFS "${{ inputs.enable_susfs }}" "false"
          resolve UPLOAD_DTBS  "${{ inputs.upload_dtbs }}"  "true"
          resolve ENABLE_LTO   "${{ inputs.enable_lto }}"   "false"
          resolve DRY_RUN      "${{ inputs.dry_run }}"      "false"
          resolve DO_RELEASE   "${{ inputs.do_release }}"   "false"

          resolve TOOLCHAIN              "${{ inputs.toolchain }}"         "llvm22"
          resolve LOCALVERSION           "${{ inputs.localversion }}"      "-Chimera_Mk10"
          resolve KBUILD_BUILD_USER      "${{ inputs.build_user }}"        "MTRXX"
          resolve KBUILD_BUILD_HOST      "${{ inputs.build_host }}"        "CM9XNNNN"
          resolve KBUILD_BUILD_VERSION   "${{ inputs.build_version }}"     "1"
          resolve KBUILD_BUILD_TIMESTAMP "${{ inputs.build_timestamp }}"   "Wed Aug 19 03:26:19 UTC 2026"
          resolve BUILD_VARIANTS         "${{ inputs.build_variants }}"    "star2lte,starlte,crownlte"
          resolve EXTRA_CFLAGS           "${{ inputs.extra_cflags }}"      ""
          resolve KSU_REPO               "${{ inputs.ksu_repo }}"          "gavdoc38/KernelSU-Next"
          resolve KSU_REF                "${{ inputs.ksu_ref }}"           "b3263c77975616d3c29d48aa600892263e7d75c9"
          resolve SUSFS_REPO             "${{ inputs.susfs_repo }}"        "royd-jpg/Project_Chimera"
          resolve SUSFS_REF              "${{ inputs.susfs_ref }}"         "6752be5bb08dccfc58d9bc98c51199515aa19abc"

          echo "Resolved (event=${{ github.event_name }}, is_dispatch=$is_dispatch):"
          grep -E '^(ENABLE_SUSFS|UPLOAD_DTBS|ENABLE_LTO|DRY_RUN|DO_RELEASE|TOOLCHAIN|KSU_REF|SUSFS_REF)=' "$GITHUB_ENV"
          echo "::endgroup::"

      - name: Validate inputs
        run: |
          set -euo pipefail
          echo "::group::Validate inputs"
          fail=0
          [[ "$LOCALVERSION" == -* ]] || { echo "::error::localversion must start with '-'"; fail=1; }
          for v in KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_VERSION KBUILD_BUILD_TIMESTAMP BUILD_VARIANTS TOOLCHAIN KSU_REPO KSU_REF SUSFS_REPO SUSFS_REF; do
            [[ -n "${!v}" ]] || { echo "::error::$v must not be empty"; fail=1; }
          done
          [[ "$KSU_REPO" == */* ]] || { echo "::error::KSU_REPO must be 'owner/repo'"; fail=1; }
          [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::KSU_REF must be a full 40-hex commit SHA, never a branch"; fail=1; }
          [[ "$SUSFS_REPO" == */* ]] || { echo "::error::SUSFS_REPO must be 'owner/repo'"; fail=1; }
          [[ "$SUSFS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SUSFS_REF must be a full 40-hex commit SHA, never a branch"; fail=1; }
          case "$TOOLCHAIN" in
            llvm22|llvm21|llvm20|aosp22|aosp21|aosp20|aosp19|neutron19|neutron23|neutron24|zyc_stable) ;;
            *) echo "::error::Unsupported toolchain: $TOOLCHAIN"; fail=1 ;;
          esac
          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          [[ "${#variants[@]}" -gt 0 ]] || { echo "::error::No build variants supplied"; fail=1; }
          declare -A seen=()
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            case "$variant" in
              star2lte|starlte|crownlte) ;;
              *) echo "::error::Unsupported variant: $variant"; fail=1 ;;
            esac
            [[ -n "${seen[$variant]:-}" ]] && { echo "::error::Duplicate variant: $variant"; fail=1; }
            seen["$variant"]=1
          done
          echo "::endgroup::"
          [[ "$fail" -eq 0 ]]

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache device-tree-compiler \
            flex gcc-aarch64-linux-gnu git libelf-dev libncurses-dev \
            libssl-dev lzop python3 rsync wget zip zlib1g-dev zstd \
            binutils-aarch64-linux-gnu patch file dwarves

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      # ── KSUN/SUSFS wiring ────────────────────────────────────────────────
      - name: Guard — confirm tree has no pre-existing KernelSU/SUSFS integration
        run: |
          set -euo pipefail
          echo "::group::Pre-integration guard"
          for dc in exynos9810-star2lte_defconfig exynos9810-starlte_defconfig exynos9810-crownlte_defconfig; do
            if grep -q '^CONFIG_KSU=y$' "arch/arm64/configs/$dc" 2>/dev/null; then
              echo "::error::$dc already has CONFIG_KSU=y — this run assumes a clean tree."
              exit 1
            fi
          done
          if [[ -e drivers/kernelsu ]]; then
            echo "::error::drivers/kernelsu already exists — refusing to overwrite."
            exit 1
          fi
          if [[ -e fs/susfs.c ]]; then
            echo "::error::fs/susfs.c already exists — refusing to overwrite."
            exit 1
          fi
          if grep -q "CONFIG_KSU" fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c 2>/dev/null; then
            echo "::error::One of the six hook target files already references CONFIG_KSU."
            exit 1
          fi
          echo "::endgroup::"

      - name: Vendor KernelSU-Next at pinned commit (including sibling uapi/)
        run: |
          set -euo pipefail
          echo "::group::Vendor KernelSU-Next"
          rm -rf KernelSU-Next
          git clone "https://github.com/$KSU_REPO.git" KernelSU-Next
          cd KernelSU-Next
          git checkout --detach "$KSU_REF"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$KSU_REF" ]]; then
            echo "::error::Checked out commit ($actual) does not match pinned KSU_REF ($KSU_REF)"
            exit 1
          fi
          echo "KernelSU-Next pinned at: $actual"
          cd ..
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          rsync -a KernelSU-Next/kernel/ drivers/kernelsu/
          test -e drivers/kernelsu/Kconfig
          test -e drivers/kernelsu/Kbuild
          if [[ -d KernelSU-Next/uapi ]]; then
            rsync -a KernelSU-Next/uapi/ drivers/kernelsu/uapi/
            test -e drivers/kernelsu/uapi
          else
            echo "::error::KernelSU-Next@$KSU_REF has no top-level uapi/ directory — this ref's layout differs from what this workflow expects."
            exit 1
          fi
          echo "::endgroup::"

      # DIAGNOSTIC — new in this revision. Dumps the actual SUSFS
      # self-check logic that produced "You have not integrated susfs in
      # your kernel yet" in run 35324461860. This runs regardless of
      # ENABLE_SUSFS so it captures ground truth even on a dry investigative
      # dispatch. Read this step's output before trusting any future
      # "fix" for the SUSFS integration — including any I might propose —
      # since I have not been able to read this pin's Kbuild directly.
      - name: Diagnose SUSFS self-check in vendored KernelSU-Next
        run: |
          set -euo pipefail
          echo "::group::Diagnose SUSFS self-check"
          echo "--- drivers/kernelsu/Kbuild (full) ---"
          cat drivers/kernelsu/Kbuild || echo "::warning::no Kbuild at drivers/kernelsu/Kbuild"
          echo "--- files under drivers/kernelsu/ referencing 'susfs' (case-insensitive) ---"
          grep -RIn --include='*' -i 'susfs' drivers/kernelsu/ || echo "(no matches)"
          echo "--- any CMakeLists.txt / *.cmake / *.py under drivers/kernelsu/ (auto-patch scripts) ---"
          find drivers/kernelsu -iname 'CMakeLists.txt' -o -iname '*.cmake' -o -iname '*.py' | while read -r f; do
            echo "== $f =="; cat "$f"
          done
          echo "--- the exact string that appeared in the failing log ---"
          grep -RIn 'not integrated susfs' drivers/kernelsu/ || echo "::warning::string not found under drivers/kernelsu — it may be emitted from a build script invoked elsewhere (e.g. scripts/, a top-level CMakeLists.txt, or generated at configure time). Widening search:"
          grep -RIn 'not integrated susfs' . --include='*' 2>/dev/null | grep -v '^Binary' || true
          echo "::endgroup::"

      - name: Wire drivers/Makefile and drivers/Kconfig
        run: |
          set -euo pipefail
          echo "::group::Wire drivers/"
          grep -q 'obj-\$(CONFIG_KSU)' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu$/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          tail -5 drivers/Makefile
          tail -5 drivers/Kconfig
          echo "::endgroup::"

      - name: Apply KSU manual-hook call sites (anchor-based, not patch-based)
        run: |
          set -euo pipefail
          echo "::group::Apply manual-hook call sites"
          python3 << 'PYEOF'
          import sys, pathlib

          def patch(path, old, new, label):
              p = pathlib.Path(path)
              s = p.read_text()
              n = s.count(old)
              if n == 0:
                  print(f"FATAL: anchor not found in {path} :: {label}", file=sys.stderr)
                  sys.exit(1)
              if n > 1:
                  print(f"FATAL: anchor matched {n} times in {path} :: {label} (must be exactly 1)", file=sys.stderr)
                  sys.exit(1)
              p.write_text(s.replace(old, new))
              print(f"OK: {path} :: {label}")

          patch("fs/exec.c",
          "int do_execve(struct filename *filename,\n"
          "\tconst char __user *const __user *__argv,\n"
          "\tconst char __user *const __user *__envp)\n"
          "{\n"
          "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
          "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
          "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
          "}",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
          "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
          "#endif\n"
          "int do_execve(struct filename *filename,\n"
          "\tconst char __user *const __user *__argv,\n"
          "\tconst char __user *const __user *__envp)\n"
          "{\n"
          "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
          "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, NULL);\n"
          "#endif\n"
          "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
          "}",
          "do_execve")

          patch("fs/open.c",
          "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
          "{\n"
          "\tconst struct cred *old_cred;\n"
          "\tstruct cred *override_cred;\n"
          "\tstruct path path;\n"
          "\tstruct inode *inode;\n"
          "\tstruct vfsmount *mnt;\n"
          "\tint res;\n"
          "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
          "\n"
          "\tif (mode & ~S_IRWXO)",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
          "\t\t\t\tint *mode, int *flags);\n"
          "#endif\n"
          "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
          "{\n"
          "\tconst struct cred *old_cred;\n"
          "\tstruct cred *override_cred;\n"
          "\tstruct path path;\n"
          "\tstruct inode *inode;\n"
          "\tstruct vfsmount *mnt;\n"
          "\tint res;\n"
          "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
          "#endif\n"
          "\n"
          "\tif (mode & ~S_IRWXO)",
          "faccessat")

          patch("fs/stat.c",
          "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
          "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
          "\t\t\t\tint *flags);\n"
          "#endif\n"
          "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
          "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_stat(&dfd, &filename, &flag);\n"
          "#endif\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "newfstatat")

          patch("fs/stat.c",
          "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat64 __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat64 __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "#ifdef CONFIG_KSU // 32-bit su\n"
          "\tksu_handle_stat(&dfd, &filename, &flag);\n"
          "#endif\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "fstatat64")

          patch("fs/read_write.c",
          "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
          "{\n"
          "\tstruct fd f = fdget_pos(fd);\n"
          "\tssize_t ret = -EBADF;\n"
          "\n"
          "\tif (f.file) {",
          "#ifdef CONFIG_KSU\n"
          "extern void ksu_handle_sys_read(unsigned int fd);\n"
          "#endif\n"
          "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
          "{\n"
          "\tstruct fd f = fdget_pos(fd);\n"
          "\tssize_t ret = -EBADF;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_sys_read(fd);\n"
          "#endif\n"
          "\tif (f.file) {",
          "sys_read")

          patch("drivers/input/input.c",
          "static void input_handle_event(struct input_dev *dev,\n"
          "\t\t\t       unsigned int type, unsigned int code, int value)\n"
          "{\n"
          "\tint disposition = input_get_disposition(dev, type, code, &value);",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,\n"
          "\t\t\t\tint *value);\n"
          "#endif\n"
          "static void input_handle_event(struct input_dev *dev,\n"
          "\t\t\t       unsigned int type, unsigned int code, int value)\n"
          "{\n"
          "\tint disposition;\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_input_handle_event(&type, &code, &value);\n"
          "#endif\n"
          "\tdisposition = input_get_disposition(dev, type, code, &value);",
          "input_handle_event")

          patch("kernel/reboot.c",
          "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
          "\t\tvoid __user *, arg)\n"
          "{\n"
          "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
          "\tchar buffer[256];\n"
          "\tint ret = 0;\n"
          "\n"
          "\t/* We only trust the superuser with rebooting the system. */",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n"
          "\t\t\t\t  void __user **arg);\n"
          "#endif\n"
          "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
          "\t\tvoid __user *, arg)\n"
          "{\n"
          "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
          "\tchar buffer[256];\n"
          "\tint ret = 0;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tif (ksu_handle_sys_reboot(magic1, magic2, cmd, (void __user **)&arg))\n"
          "\t\treturn 0;\n"
          "#endif\n"
          "\t/* We only trust the superuser with rebooting the system. */",
          "reboot")

          print("all 6 hooks applied")
          PYEOF
          git diff --stat -- fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c
          echo "::endgroup::"

      - name: Vendor SUSFS core (if enabled)
        if: env.ENABLE_SUSFS == 'true'
        run: |
          set -euo pipefail
          echo "::group::Vendor SUSFS"
          echo "::warning::SUSFS is known to fail at compile time as of run 35324461860 — see workflow header. Proceeding anyway since ENABLE_SUSFS=true was explicitly requested; expect the same or a related failure until the Diagnose step's output has been reviewed."
          rm -rf /tmp/susfs-src
          git clone --no-checkout "https://github.com/$SUSFS_REPO.git" /tmp/susfs-src
          git -C /tmp/susfs-src fetch --no-tags --depth 1 origin "$SUSFS_REF"
          git -C /tmp/susfs-src checkout --force "$SUSFS_REF"
          resolved="$(git -C /tmp/susfs-src rev-parse HEAD)"
          if [[ "$resolved" != "$SUSFS_REF" ]]; then
            echo "::error::Resolved SUSFS commit ($resolved) does not match pinned SUSFS_REF ($SUSFS_REF)"
            exit 1
          fi
          for required in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -f "/tmp/susfs-src/$required" || {
              echo "::error::SUSFS ref $SUSFS_REF is missing $required"
              exit 1
            }
          done
          cp /tmp/susfs-src/fs/susfs.c fs/susfs.c
          mkdir -p include/linux
          cp /tmp/susfs-src/include/linux/susfs.h include/linux/susfs.h
          cp /tmp/susfs-src/include/linux/susfs_def.h include/linux/susfs_def.h
          echo "--- copied header, confirming presence and content ---"
          test -f include/linux/susfs.h
          ls -la include/linux/susfs.h
          head -20 include/linux/susfs.h
          grep -q 'obj-\$(CONFIG_KSU_SUSFS)' fs/Makefile || \
            printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile
          if ! grep -q 'susfs_is_avc_log_spoofing_enabled' security/selinux/avc.c; then
            python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path("security/selinux/avc.c")
          s = p.read_text()
          anchor = "#include <net/af_unix.h>\n#include <linux/ip.h>\n#include <linux/audit.h>"
          assert s.count(anchor) == 1, "avc.c include anchor not found/unique — resolve manually"
          insert = anchor + (
              "\n\n#ifdef CONFIG_KSU_SUSFS\n"
              "bool susfs_is_avc_log_spoofing_enabled = false;\n"
              "#endif"
          )
          p.write_text(s.replace(anchor, insert))
          print("OK: security/selinux/avc.c :: susfs_is_avc_log_spoofing_enabled")
          PYEOF
          fi
          echo "::endgroup::"

      - name: Resolve toolchain
        run: |
          set -euo pipefail
          echo "::group::Resolve toolchain"
          case "$TOOLCHAIN" in
            aosp19) echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            aosp20) echo "TC_URL=https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            aosp21) echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            aosp22) echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            llvm20) echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV" ;;
            llvm21) echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV" ;;
            llvm22) echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV" ;;
            neutron19) echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
            neutron23) echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
            neutron24) echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
            zyc_stable)
              zyc_url="$(curl -fsSL https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt)"
              [[ -n "$zyc_url" ]]
              echo "TC_URL=$zyc_url" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
          esac
          echo "::endgroup::"

      - name: Restore toolchain cache
        uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: toolchains/clang
          key: toolchain-${{ inputs.toolchain || 'llvm22' }}-ubuntu-24.04-v3-${{ env.TC_URL }}

      - name: Download and extract toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "::group::Download and extract toolchain"
          rm -rf toolchains/clang /tmp/clang-archive /tmp/clang.tar /tmp/clang-stage
          mkdir -p toolchains/clang /tmp/clang-stage
          aria2c --allow-overwrite=true --continue=true --dir=/tmp --file-allocation=none \
            --max-tries=5 --min-split-size=1M --out=clang-archive --retry-wait=5 --split=16 "$TC_URL"
          test -s /tmp/clang-archive
          archive_kind="$(file -b /tmp/clang-archive)"
          case "$archive_kind" in
            *gzip*) tar_extract=(tar -xzf /tmp/clang-archive -C /tmp/clang-stage) ;;
            *XZ*) tar_extract=(tar -xJf /tmp/clang-archive -C /tmp/clang-stage) ;;
            *Zstandard*)
              zstd -d -f /tmp/clang-archive -o /tmp/clang.tar
              tar_extract=(tar -xf /tmp/clang.tar -C /tmp/clang-stage) ;;
            *) echo "::error::Unsupported toolchain archive: $archive_kind"; exit 1 ;;
          esac
          "${tar_extract[@]}"
          clang_bin="$(find /tmp/clang-stage \( -type f -o -type l \) -path '*/bin/clang' -print -quit)"
          if [[ -z "$clang_bin" ]]; then
            echo "::error::clang was not found in extracted archive"
            find /tmp/clang-stage -maxdepth 6 -printf '%y %p\n' | sort | head -n 200
            exit 1
          fi
          toolchain_root="$(cd "$(dirname "$clang_bin")/.." && pwd)"
          rm -rf toolchains/clang
          mkdir -p toolchains/clang
          rsync -a "$toolchain_root"/ toolchains/clang/
          test -x toolchains/clang/bin/clang
          test -x toolchains/clang/bin/ld.lld
          find toolchains/clang/bin -maxdepth 1 \( -type f -o -type l \) -exec chmod +x {} +
          echo "Resolved toolchain root: $toolchain_root"
          echo "::endgroup::"

      - name: Configure and verify toolchain
        run: |
          set -euo pipefail
          echo "::group::Configure and verify toolchain"
          toolchain_bin="$PWD/toolchains/clang/bin"
          if [[ ! -x "$toolchain_bin/clang" ]]; then
            echo "::error::clang is missing from $toolchain_bin"
            find toolchains/clang -maxdepth 4 \( -type f -o -type l \) \( -name clang -o -name ld.lld -o -name llvm-ar \) -print | sort | head -n 200
            exit 1
          fi
          chmod +x "$toolchain_bin"/* 2>/dev/null || true
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          export PATH="$toolchain_bin:$PATH"
          for binary in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            command -v "$binary" >/dev/null 2>&1 || { echo "::error::Required tool missing: $binary"; exit 1; }
          done
          clang_version_line="$(clang --version | head -n1)"
          clang_major="$(sed -nE 's/.*clang version ([0-9]+)\..*/\1/p' <<< "$clang_version_line")"
          [[ -n "$clang_major" ]] || { echo "::error::Could not parse clang major version from: $clang_version_line"; exit 1; }
          echo "CLANG_LABEL=clang$clang_major" >> "$GITHUB_ENV"
          echo "CLANG_VERSION=$clang_version_line" >> "$GITHUB_ENV"
          mkdir -p artifacts
          {
            echo "Kernel: Linux $KERNEL_VERSION"
            echo "Toolchain: $(clang --version | head -n1)"
            echo "Linker: $(ld.lld --version | head -n1)"
            echo "KernelSU-Next: $KSU_REPO@$KSU_REF"
            echo "SUSFS: $SUSFS_REPO@$SUSFS_REF (enabled=$ENABLE_SUSFS)"
            echo "Commit: $(git rev-parse HEAD)"
          } > artifacts/toolchain.txt
          echo "::endgroup::"

      - name: Configure KSUN and SUSFS defconfigs
        run: |
          set -euo pipefail
          echo "::group::Configure KSUN and SUSFS defconfigs"
          configs=(
            arch/arm64/configs/exynos9810-star2lte_defconfig
            arch/arm64/configs/exynos9810-starlte_defconfig
            arch/arm64/configs/exynos9810-crownlte_defconfig
          )
          symbols=(KSU KSU_MANUAL_HOOK KSU_KPROBES_HOOK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_SUS_MEMFD)
          for config in "${configs[@]}"; do
            test -f "$config"
            for symbol in "${symbols[@]}"; do
              sed -i -E "/^(# )?CONFIG_${symbol}(=| is not set)/d" "$config"
            done
            {
              echo "# KernelSU-Next (manual hook — kprobe mode unsupported on this 4.9.337 base)"
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
              echo "# CONFIG_KSU_KPROBES_HOOK is not set"
              if [[ "$ENABLE_SUSFS" == "true" ]]; then
                echo "CONFIG_KSU_SUSFS=y"
                echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
                echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
                echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
                echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
                echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
                echo "# CONFIG_KSU_SUSFS_SUS_MEMFD is not set"
              else
                echo "# CONFIG_KSU_SUSFS is not set"
              fi
            } >> "$config"
          done
          echo "::endgroup::"

      - name: Clone AnyKernel3
        run: |
          set -euo pipefail
          rm -rf anykernel3
          git clone --depth=1 --branch master https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Build dtbTool
        run: |
          set -euo pipefail
          rm -rf dtbTool dtbTool-bin
          git clone --depth=1 https://github.com/rajatgupta1998/android_tools_system_dtbTool.git dtbTool
          source_file="$(find dtbTool -type f -name dtbtool.c -print -quit)"
          [[ -n "$source_file" ]] || { echo "::error::dtbtool.c was not found"; exit 1; }
          gcc "$source_file" -O2 -o dtbTool-bin
          chmod +x dtbTool-bin
          test -x dtbTool-bin

      - name: Build kernel variants
        id: build
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          echo "::group::Build kernel variants"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          export KCFLAGS="-Wno-unused-label $EXTRA_CFLAGS"
          export CLANG_TRIPLE="$CROSS_COMPILE"

          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          built_variants=()
          rm -rf out
          mkdir -p out

          make -C . O="out/_selinux_prime" ARCH="$ARCH" exynos9810-star2lte_defconfig >/dev/null
          make -C . -j"$(nproc)" O="out/_selinux_prime" ARCH="$ARCH" \
            CC="$CC" LD="$LD" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" \
            security/selinux/ >/dev/null 2>&1 || true

          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            output_dir="out/$variant"
            defconfig="exynos9810-${variant}_defconfig"
            mkdir -p "$output_dir"

            make -C . O="$output_dir" ARCH="$ARCH" "$defconfig"

            scripts/config --file "$output_dir/.config" \
              -e KSU -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
            if [[ "$ENABLE_SUSFS" == "true" ]]; then
              scripts/config --file "$output_dir/.config" \
                -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME \
                -d KSU_SUSFS_SUS_MEMFD
            else
              scripts/config --file "$output_dir/.config" -d KSU_SUSFS
            fi

            if [[ "$ENABLE_LTO" == "true" ]]; then
              grep -Rqs '^config LTO_CLANG$' arch drivers fs include kernel security || {
                echo "::error::enable_lto=true, but this kernel tree does not provide CONFIG_LTO_CLANG"; exit 1; }
              scripts/config --file "$output_dir/.config" -e LTO_CLANG
            fi

            make -C . O="$output_dir" ARCH="$ARCH" olddefconfig

            grep -qx 'CONFIG_KSU=y' "$output_dir/.config" || { echo "::error::CONFIG_KSU did not resolve to y for $variant"; exit 1; }
            grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$output_dir/.config" || { echo "::error::CONFIG_KSU_MANUAL_HOOK did not resolve to y for $variant"; exit 1; }
            grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' "$output_dir/.config" && { echo "::error::CONFIG_KSU_KPROBES_HOOK is enabled alongside manual hook for $variant"; exit 1; }
            if [[ "$ENABLE_SUSFS" == "true" ]]; then
              grep -qx 'CONFIG_KSU_SUSFS=y' "$output_dir/.config" || { echo "::error::CONFIG_KSU_SUSFS did not resolve to y for $variant"; exit 1; }
              grep -q '^CONFIG_KSU_SUSFS_SUS_MEMFD=y$' "$output_dir/.config" && { echo "::error::CONFIG_KSU_SUSFS_SUS_MEMFD is enabled for $variant despite the forced-off default"; exit 1; }
            fi
            [[ "$ENABLE_LTO" == "true" ]] && { grep -qx 'CONFIG_LTO_CLANG=y' "$output_dir/.config" || { echo "::error::CONFIG_LTO_CLANG did not resolve to y"; exit 1; }; }

            make -C . -j"$(nproc)" O="$output_dir" ARCH="$ARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" \
              CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
              KCFLAGS="$KCFLAGS" \
              Image.gz dtbs

            image="$output_dir/arch/arm64/boot/Image.gz"
            if [[ ! -s "$image" ]]; then
              echo "::error::$variant did not produce Image.gz"
              exit 1
            fi

            nm_bin="$(command -v llvm-nm)"
            "$nm_bin" "$output_dir/vmlinux" > "artifacts/vmlinux-symbols-$variant.log" 2>&1 || true
            grep -qE '^[0-9a-fA-F]+ [A-Za-z] ksu_handle_execveat$' "artifacts/vmlinux-symbols-$variant.log" || {
              echo "::error::ksu_handle_execveat not found in vmlinux for $variant — manual hook patch did not link"; exit 1; }
            grep -qE '^[0-9a-fA-F]+ [A-Za-z] ksu_handle_sys_reboot$' "artifacts/vmlinux-symbols-$variant.log" || {
              echo "::error::ksu_handle_sys_reboot not found in vmlinux for $variant"; exit 1; }
            if [[ "$ENABLE_SUSFS" == "true" ]]; then
              grep -qE '^[0-9a-fA-F]+ [A-Za-z] susfs_add_sus_path$' "artifacts/vmlinux-symbols-$variant.log" || {
                echo "::error::susfs_add_sus_path not found in vmlinux for $variant despite CONFIG_KSU_SUSFS=y"; exit 1; }
            fi

            git diff --stat -- fs/namespace.c fs/internal.h include/linux/seccomp.h security/selinux/ \
              > "artifacts/ksu-autopatch-diff-$variant.log" || true

            cp "$image" "out/Image.gz-$variant"
            built_variants+=("$variant")
          done

          {
            echo "variants=$(IFS=,; echo "${built_variants[*]}")"
            echo "clang_label=$CLANG_LABEL"
          } >> "$GITHUB_OUTPUT"
          ccache -s || true
          echo "::endgroup::"

      - name: Create per-variant DTB images
        if: env.DRY_RUN != 'true' && env.UPLOAD_DTBS == 'true'
        run: |
          set -euo pipefail
          echo "::group::Create per-variant DTB images"
          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            output_dir="out/$variant"
            dts_dir="$output_dir/arch/arm64/boot/dts/exynos"
            dtb_image="$output_dir/arch/arm64/boot/dtb.img"
            shopt -s nullglob
            dtbs=("$dts_dir"/*.dtb)
            shopt -u nullglob
            [[ "${#dtbs[@]}" -gt 0 ]] || { echo "::error::$variant produced no Exynos DTBs"; exit 1; }
            ./dtbTool-bin -s 2048 -o "$dtb_image" -p "$output_dir/scripts/dtc/" "${dtbs[@]}"
            test -s "$dtb_image"
            cp "$dtb_image" "out/dtb-$variant.img"
          done
          echo "::endgroup::"

      - name: Package AnyKernel3 ZIPs
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          echo "::group::Package device-checked AnyKernel3 ZIPs"
          rm -rf packages
          mkdir -p packages
          susfs_tag=""
          [[ "$ENABLE_SUSFS" == "true" ]] && susfs_tag="-SUSFS"
          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            staging_dir="packages/AnyKernel3-$variant"
            zip_name="Chimera-KSUN${susfs_tag}-${CLANG_LABEL}${LOCALVERSION}-$variant.zip"
            case "$variant" in
              star2lte) device_names=$'device.name1=star2lte\ndevice.name2=star2ltexx\ndevice.name3=SM-G965F\ndevice.name4=SM-G965U\ndevice.name5=SM-G965N' ;;
              starlte) device_names=$'device.name1=starlte\ndevice.name2=starltexx\ndevice.name3=SM-G960F\ndevice.name4=SM-G960U\ndevice.name5=SM-G960N' ;;
              crownlte) device_names=$'device.name1=crownlte\ndevice.name2=crownltexx\ndevice.name3=SM-N960F\ndevice.name4=SM-N960U\ndevice.name5=SM-N960N' ;;
              *) echo "::error::Unsupported AnyKernel3 variant: $variant"; exit 1 ;;
            esac
            mkdir -p "$staging_dir"
            rsync -a --delete --exclude=.git anykernel3/ "$staging_dir/"
            test -f "$staging_dir/tools/ak3-core.sh"
            test -s "out/Image.gz-$variant"
            cat > "$staging_dir/anykernel.sh" <<EOF
          #!/usr/bin/env bash
          properties() { '
          kernel.string=Chimera Linux $KERNEL_VERSION KSUN${susfs_tag} ($variant) | $CLANG_VERSION
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          $device_names
          supported.versions=17
          '; }
          BLOCK=/dev/block/by-name/BOOT
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOF
            chmod +x "$staging_dir/anykernel.sh"
            cp "out/Image.gz-$variant" "$staging_dir/Image.gz"
            if [[ "$UPLOAD_DTBS" == "true" && -s "out/dtb-$variant.img" ]]; then
              cp "out/dtb-$variant.img" "$staging_dir/dtb.img"
            fi
            ( cd "$staging_dir" && zip -r9 "../$zip_name" . -x ".git/*" ".github/*" )
            test -s "packages/$zip_name"
            rm -rf "$staging_dir"
          done
          echo "::endgroup::"

      - name: Upload build artifacts
        if: env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-KSUN-SUSFS-${{ inputs.toolchain || 'llvm22' }}-${{ github.run_number }}
          path: |
            packages/*.zip
            out/Image.gz-*
            out/dtb-*.img
            artifacts/toolchain.txt
            artifacts/vmlinux-symbols-*.log
            artifacts/ksu-autopatch-diff-*.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-KSUN-SUSFS-failure-diagnostics-${{ github.run_number }}
          path: |
            out/**/.config
            artifacts/**
            drivers/kernelsu/Kbuild
            drivers/kernelsu/Kconfig
          if-no-files-found: ignore

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && env.DO_RELEASE == 'true' && env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Chimera-KSUN-SUSFS-${{ github.run_number }}
          name: Chimera KSUN + SUSFS — Build ${{ github.run_number }}
          files: packages/*.zip
          body: |
            ## Exynos 9810 — KernelSU-Next + SUSFS
            - Kernel: Linux 4.9.337
            - Source: Project_Chimera / lineage-24.0
            - KernelSU-Next: ${{ inputs.ksu_repo }}@${{ inputs.ksu_ref }} (manual hook only)
            - SUSFS: ${{ inputs.susfs_repo }}@${{ inputs.susfs_ref }} (enabled: ${{ inputs.enable_susfs }})
            - Toolchain: ${{ inputs.toolchain }}
            - Variants: ${{ steps.build.outputs.variants }}
