# KernelSU-Next + SUSFS integration for Exynos 9810 (lineage-24.0) — Mk9 model.
#
# MK9 MODEL (unchanged from the prior revision of this file):
#   - The kernel repo (royd-jpg/Project_Chimera @ lineage-24.0) is NEVER modified in
#     Git. There is no patches/ directory dependency and no `git apply` of a tracked
#     patch file anywhere in this workflow. This is a DIFFERENT architecture from the
#     "chimera-mk9-merge-build.yml" workflow on lineage-23.2-ksun3-susfs2, which builds
#     from a separate pre-integrated base repo (gavdoc38/android_kernel_samsung_exynos9810)
#     with Project_Chimera supplying only an overlay. THIS file still checks out
#     Project_Chimera@lineage-24.0 directly as the kernel tree and does all KSU/SUSFS
#     integration itself, at compile time, in the runner only. The two are not merged.
#   - All KSU/SUSFS integration happens ONLY inside the ephemeral CI runner's working
#     copy, during the build: KSU is cloned at a pinned SHA into /tmp/ksu-src, then
#     vendored (rsync) into drivers/kernelsu/; drivers/Makefile and drivers/Kconfig are
#     wired via idempotent, runner-local appends (grep-guarded); SUSFS sources are
#     fetched into /tmp/susfs-src and copied into fs/ and include/linux/; defconfig
#     fragments (chimera-ksu-*.cfg) are merged via merge_config.sh. Nothing is
#     committed or pushed back.
#
# WHAT'S NEW IN THIS REVISION (ported from chimera-mk9-merge-build.yml at the user's
#   request — customization/toolchain OPTIONS only, not its kernel-source model):
#   - A resolvable toolchain matrix (llvm22/llvm21/llvm20/aosp22/aosp21/aosp20/aosp19/
#     neutron19/neutron23/neutron24/zyc_stable) with caching, download/extract, and PATH
#     configuration, replacing the prior fixed "apt install clang-18" step. `proton` is
#     intentionally NOT offered — kdrag0n/proton-clang's default branch has had no
#     commits since 2021-05-22 (frozen at Clang 13.0.0); this was flagged and removed
#     upstream for the same reason and that finding still holds.
#   - Build-identity customization (brand/LOCALVERSION, build_user, build_host,
#     build_version, build_date) with the same choice+"Other"+custom_* field pattern,
#     including the ROM-label-prefix-stripping logic for build_date.
#   - A base KCFLAGS string (BASE_KCFLAGS) in the same spirit as the other workflow's
#     CHIMERA_KCFLAGS, combined with the existing extra_kcflags input.
#   - Kernel identity generation (identity string + KCFLAGS SHA-256) folded into the
#     existing manifest.json, purely as metadata — does not change what gets built.
#
# CHIMERA PERFORMANCE OVERLAY (new in this revision):
#   Fetches patches/apply_chimera_overlay_patches.sh (+ its companion
#   madera-core.c patch file) verbatim from overlay_repo@overlay_ref, applies it to
#   the runner-only checkout (never committed), same compile-time-only spirit as the
#   KSU/SUSFS staging above. VERIFIED by actually running the real script against a
#   real royd-jpg/Project_Chimera@lineage-24.0 checkout before writing this step:
#     - Sections 1, 2, 4, 5, 6, 7, 8, 9 (UFC short-circuit, proc/base.c SUS_MAP guard,
#       fair.c min_granularity/migration_cost, 12-site board DTS tuning, sugov rate
#       limits + kthread SCHED_RR priority, madera-core settle delay) all applied
#       cleanly and unmodified, confirmed via git status + marker grep.
#     - Section 3/9 (fs/namei.c sus_path sub-path denial) FAILS on this base --
#       confirmed by direct execution: "FATAL: no susfs_is_inode_sus_path call sites
#       found — base regressed, primary sus_path hooks missing". This section is not
#       a performance feature -- it re-hardens an EXISTING susfs_is_inode_sus_path()
#       call site inside link_path_walk() that only exists when SUSFS is fully
#       source-integrated into fs/namei.c (e.g. gavdoc38's canonical base). This
#       workflow's SUSFS staging only compiles fs/susfs.c + headers in -- it does not
#       backport that namei.c caller site -- so section 3 has nothing to re-harden here.
#   RESOLUTION: the workflow fetches the vendor script byte-for-byte, then performs a
#   single boundary-matched excision of exactly the "# [3] fs/namei.c ..." block
#   (matched against the script's OWN "# [3] ..." / "# [4] ..." section-comment
#   markers) before executing -- sections 1/2/4-9's patch logic is never touched. If
#   upstream ever restructures the script so those exact markers no longer match, the
#   excision step fails loud instead of silently running an un-excised (and thus
#   fatally-failing) or wrongly-excised script.
#
# CRITICAL LIMITATION — MANUAL-HOOK MODE (unchanged, still applies):
#   This workflow does NOT patch fs/exec.c, fs/open.c, fs/stat.c, fs/read_write.c,
#   drivers/input/input.c, or kernel/reboot.c. It only verifies (greps for) the 6
#   ksu_handle_* call sites and FAILS CLOSED if they are absent.
#   royd-jpg/Project_Chimera@lineage-24.0 is a clean/stock tree (confirmed live, no
#   KSU code at all) — ksu_integration_mode=manual WILL fail verification on that ref
#   as-is. kprobe mode has no such limitation.
#
# KSU PIN CORRECTION (unchanged, still applies):
#   685b4a6ba3d2befdf40b3c67cf096d050c7aa6cb is a real, currently-fetchable-by-SHA
#   commit in gavdoc38/KernelSU-Next (re-verified live), but it is a DANGLING commit
#   (not reachable from any branch tip there) and is NOT what royd-jpg/Project_Chimera's
#   own lineage-23.2-ksun3-susfs2 branch pins as its KernelSU-Next submodule — that pin
#   is 242f245b2c971eb5c1cc4a689e01dcdeaff4c939, which remains this file's default.
#   Both exist and both are dangling; do not assume one supersedes the other without
#   re-verifying against whichever base you're actually building.
#
# SUSFS is included due to device age and lack of ongoing Google Play / vendor
# support, to maintain compatibility on user-owned legacy hardware. Strictly for
# legitimate use (filesystem visibility / namespace testing).
#
# "Android 17 compatibility" here means building the modified Exynos 9810 vendor
# kernel for potential use with a compatible LineageOS 24 userspace. Runtime
# compatibility (boot, root, SELinux, RKP/DEFEX, basic functionality) requires
# physical-device testing and is NOT claimed by a successful CI build alone.

name: Exynos9810 Kernel — KSUN + SUSFS (Mk9, Android 17 / LineageOS 24)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig to build (e.g. exynos9810-star2lte_defconfig)"
        type: string
        default: "exynos9810-star2lte_defconfig"
      ksu_integration_mode:
        description: "KernelSU integration mode: disabled / kprobe / manual (manual requires a checkout ref that already has the 6 hook call sites — Mk9 does not patch them)"
        type: choice
        options: ["disabled", "kprobe", "manual"]
        default: "kprobe"
      enable_susfs:
        description: "Enable SUSFS (requires a KSU mode != disabled)"
        type: boolean
        default: false
      ksu_repo:
        description: "KernelSU repo URL (used only if mode != disabled)"
        type: string
        default: "https://github.com/gavdoc38/KernelSU-Next"
      ksu_ref:
        description: "KernelSU ref (immutable SHA). See header comment re: dangling-pin caveats."
        type: string
        default: "242f245b2c971eb5c1cc4a689e01dcdeaff4c939"
      susfs_repo:
        description: "SUSFS source repo (used only if enable_susfs=true)"
        type: string
        default: "https://github.com/royd-jpg/Project_Chimera"
      susfs_ref:
        description: "SUSFS source ref/SHA (used only if enable_susfs=true)"
        type: string
        default: "6752be5bb08dccfc58d9bc98c51199515aa19abc"
      toolchain:
        description: "Toolchain matrix (proton removed — unmaintained since 2021-05-22, frozen at Clang 13.0.0)"
        type: choice
        options: [llvm22, llvm21, llvm20, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, zyc_stable]
        default: llvm22
      extra_kcflags:
        description: "Extra KCFLAGS appended on top of this workflow's BASE_KCFLAGS"
        type: string
        default: ""
      brand:
        description: "LOCALVERSION suffix (must start with '-'). Pick 'Other' to type a custom value."
        type: choice
        options:
          - "-Mk9_Exynos9810"
          - "-24463729"
          - "Other"
        default: "-Mk9_Exynos9810"
      custom_brand:
        description: "Custom brand — only used if 'brand' above is set to 'Other' (must start with '-')"
        type: string
        default: ""
      build_user:
        description: "KBUILD_BUILD_USER. Pick 'Other' to type a custom value."
        type: choice
        options: ["MTRXX", "EVOXV", "EVOXG", "DRPFST", "HLCYN", "LOS", "GA", "RC0", "Other"]
        default: "MTRXX"
      custom_build_user:
        description: "Custom build user — only used if 'build_user' above is set to 'Other'"
        type: string
        default: ""
      build_host:
        description: "KBUILD_BUILD_HOST"
        type: string
        default: "CM9XNNNN"
      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        type: string
        default: "1"
      build_date:
        description: "KBUILD_BUILD_TIMESTAMP — ROM label shown for reference only, stripped before use. Pick 'Other' to type a custom value."
        type: choice
        options:
          - "MTRXX: Wed Aug 19 03:26:19 UTC 2026"
          - "LOS24: Sun Sep 13 14:21:50 CEST 2026"
          - "Other"
        default: "MTRXX: Wed Aug 19 03:26:19 UTC 2026"
      custom_build_date:
        description: "Custom build timestamp — only used if 'build_date' above is set to 'Other' (no ROM prefix needed here)"
        type: string
        default: ""
      enable_chimera_overlay:
        description: "Apply the Chimera performance overlay (cpufreq/sugov/sched/DTS tuning). See header comment: the SUSFS-only section 3/9 is excised — it requires SUSFS fully source-integrated into fs/namei.c, which this workflow does not do."
        type: boolean
        default: true
      overlay_repo:
        description: "Repo the overlay script (patches/apply_chimera_overlay_patches.sh + madera patch) is fetched from, compile-time only"
        type: string
        default: "https://github.com/royd-jpg/Project_Chimera"
      overlay_ref:
        description: "Ref/branch/SHA the overlay script is fetched from"
        type: string
        default: "lineage-23.2-ksun3-susfs2"
      clean_build:
        description: "Clean build before compiling"
        type: boolean
        default: true
      publish_release:
        description: "Publish a GitHub release"
        type: boolean
        default: false
  push:
    branches: [lineage-24.0]
    paths:
      - ".github/workflows/kernel-android17-ksun-susfs-mk9.yml"
      - "arch/arm64/configs/**"
      - "arch/arm64/boot/dts/**"
      - "arch/arm64/Kconfig"
      - "Makefile"
      - "fs/**"
      - "kernel/**"
      - "drivers/**"
      - "include/**"
      - "security/**"
  pull_request:
    branches: [lineage-24.0]

permissions:
  contents: read
  actions: read

concurrency:
  group: kernel-mk9-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  BASE_KCFLAGS: "-O2 -fcommon -fno-strict-aliasing -Wno-error -Wno-error=unused-but-set-global -Wno-unknown-warning-option"
  KERNEL_VERSION_STR: "4.9.337"
  KERNEL_NAME: "Mk9 Exynos9810"
  KERNEL_DEVICE: "star2lte"
  KERNEL_PLATFORM: "Exynos 9810"

jobs:
  build:
    name: Build Mk9 (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ksu_integration_mode || 'disabled' }}${{ github.event_name == 'workflow_dispatch' && github.event.inputs.enable_susfs == 'true' && '+susfs' || '' }} / ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain || 'llvm22' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      mode_label: ${{ steps.meta.outputs.mode_label }}
      ksu_integration_mode: ${{ steps.meta.outputs.ksu_integration_mode }}
      enable_susfs: ${{ steps.meta.outputs.enable_susfs }}
      artifact_prefix: ${{ steps.meta.outputs.artifact_prefix }}
    steps:
      # ------------------------------------------------------------------ identity input resolution
      - name: Resolve build identity inputs (choice + Other + ROM-prefix strip)
        run: |
          set -Eeuo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]; then
            FINAL_BRAND="-mk9-ci"
            FINAL_BUILD_USER="ci"
            FINAL_BUILD_HOST="github-actions"
            FINAL_BUILD_VERSION="1"
            FINAL_BUILD_DATE="$(date -u)"
          else
            if [ "${{ github.event.inputs.brand }}" = "Other" ]; then
              FINAL_BRAND="${{ github.event.inputs.custom_brand }}"
            else
              FINAL_BRAND="${{ github.event.inputs.brand }}"
            fi
            case "${FINAL_BRAND}" in
              -*) ;;
              *) echo "::error::resolved brand must start with '-', got '${FINAL_BRAND}'"; exit 1 ;;
            esac
            if [ "${{ github.event.inputs.build_user }}" = "Other" ]; then
              FINAL_BUILD_USER="${{ github.event.inputs.custom_build_user }}"
            else
              FINAL_BUILD_USER="${{ github.event.inputs.build_user }}"
            fi
            FINAL_BUILD_HOST="${{ github.event.inputs.build_host }}"
            FINAL_BUILD_VERSION="${{ github.event.inputs.build_version }}"
            if [ "${{ github.event.inputs.build_date }}" = "Other" ]; then
              FINAL_BUILD_DATE="${{ github.event.inputs.custom_build_date }}"
            else
              RAW_DATE="${{ github.event.inputs.build_date }}"
              FINAL_BUILD_DATE="${RAW_DATE#*: }"
            fi
          fi
          for name in FINAL_BRAND FINAL_BUILD_USER FINAL_BUILD_HOST FINAL_BUILD_VERSION FINAL_BUILD_DATE; do
            val="${!name}"
            [ -n "${val}" ] || { echo "::error::${name} resolved empty — 'Other' selected with an empty custom_* field?"; exit 1; }
          done
          {
            echo "FINAL_BRAND=${FINAL_BRAND}"
            echo "FINAL_BUILD_USER=${FINAL_BUILD_USER}"
            echo "FINAL_BUILD_HOST=${FINAL_BUILD_HOST}"
            echo "FINAL_BUILD_VERSION=${FINAL_BUILD_VERSION}"
            echo "FINAL_BUILD_DATE=${FINAL_BUILD_DATE}"
          } >> "$GITHUB_ENV"
          echo "Resolved brand:         ${FINAL_BRAND}"
          echo "Resolved build_user:    ${FINAL_BUILD_USER}"
          echo "Resolved build_host:    ${FINAL_BUILD_HOST}"
          echo "Resolved build_version: ${FINAL_BUILD_VERSION}"
          echo "Resolved build_date:    ${FINAL_BUILD_DATE}"

      # ------------------------------------------------------------------ meta
      - name: Compute build metadata
        id: meta
        run: |
          set -Eeuo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] || [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            MODE="disabled"
            SUSFS="false"
            echo "Forced stock validation for ${GITHUB_EVENT_NAME} event." >&2
          else
            MODE="${{ github.event.inputs.ksu_integration_mode }}"
            SUSFS="${{ github.event.inputs.enable_susfs }}"
          fi
          case "${MODE}" in
            disabled|kprobe|manual) ;;
            *) echo "::error::Invalid ksu_integration_mode '${MODE}'"; exit 1 ;;
          esac
          if [ "${SUSFS}" = "true" ] && [ "${MODE}" = "disabled" ]; then
            echo "::error::enable_susfs=true requires ksu_integration_mode != disabled"
            exit 1
          fi
          if [ "${MODE}" = "manual" ]; then
            echo "::warning::Mk9 does not patch the 6 manual-hook call sites. This mode"
            echo "::warning::will fail the 'Verify KSU hook call sites' step unless the"
            echo "::warning::checked-out ref already contains them. See workflow header."
          fi
          if [ "${MODE}" = "manual" ]; then LABEL="ksu-manual"
          elif [ "${MODE}" = "kprobe" ]; then LABEL="ksu-kprobe"
          else LABEL="stock"; fi
          if [ "${SUSFS}" = "true" ]; then LABEL="${LABEL}+susfs"; fi
          echo "mode_label=${LABEL}"            >> "$GITHUB_OUTPUT"
          echo "ksu_integration_mode=${MODE}"   >> "$GITHUB_OUTPUT"
          echo "enable_susfs=${SUSFS}"          >> "$GITHUB_OUTPUT"
          echo "artifact_prefix=${LABEL}"       >> "$GITHUB_OUTPUT"
          echo "::notice::mode_label=${LABEL} ksu=${MODE} susfs=${SUSFS} (mk9)"

      # ------------------------------------------------------------------ checkout
      - name: Checkout kernel tree (lineage-24.0, pristine)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'lineage-24.0' || github.ref }}
          fetch-depth: 1
          clean: true

      # ------------------------------------------------------------------ deps (compiler now comes from the toolchain matrix below, not apt)
      - name: Install host build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            build-essential bc bison flex libncurses-dev libssl-dev \
            libelf-dev python3 rsync git curl aria2 zstd cpio xz-utils \
            file jq binutils-aarch64-linux-gnu

      # ------------------------------------------------------------------ toolchain matrix (ported from chimera-mk9-merge-build.yml)
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail
          TOOLCHAIN="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain || 'llvm22' }}"
          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_HOSTLDFLAGS=""
          case "${TOOLCHAIN}" in
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz"
              TC_CACHE_KEY="aosp-clang-r536225-ubuntu-24.04-v2"
              ;;
            aosp20)
              # UNPINNED MIRROR (carried over as-is): points at a third-party gitlab
              # `master` branch, not an immutable android.googlesource.com archive
              # like the other aosp entries. Treat aosp20 builds as non-reproducible
              # until this is re-pinned. See: git ls-remote https://gitlab.com/kei-space/clang/r547379.git master
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;
            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;
            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            llvm20)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="korg-clang-20.1.8-ubuntu-24.04-v1"
              ;;
            llvm21)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-21.1.0-ubuntu-24.04-v1"
              ;;
            llvm22)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-22.1.7-ubuntu-24.04-v1"
              ;;
            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;
            neutron23)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30062026-ubuntu-24.04-v2"
              ;;
            neutron24)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30072026-ubuntu-24.04-v2"
              ;;
            zyc_stable)
              TC_URL=$(curl -fsSL "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" || true)
              # Cache key derived from the resolved URL, not a static suffix, so the
              # cache self-busts whenever upstream updates Clang-main-link.txt.
              if [ -n "${TC_URL}" ]; then
                TC_CACHE_KEY="zyc-clang-ubuntu-24.04-$(printf '%s' "${TC_URL}" | sha256sum | cut -c1-16)"
              else
                TC_CACHE_KEY="zyc-clang-ubuntu-24.04-lookup-failed"
              fi
              ;;
            *)
              echo "::error::unsupported toolchain '${TOOLCHAIN}'"
              exit 1
              ;;
          esac
          {
            echo "TC_URL=${TC_URL}"
            echo "TC_ARCHIVE_FMT=${TC_ARCHIVE_FMT}"
            echo "TC_CACHE_KEY=${TC_CACHE_KEY}"
            echo "TC_HOSTLDFLAGS=${TC_HOSTLDFLAGS}"
            echo "ABS_TC=${GITHUB_WORKSPACE}/toolchains/clang"
          } >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=${TC_CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf "${ABS_TC}"
          mkdir -p "${ABS_TC}"
          if [ -z "${TC_URL}" ]; then
            echo "::error::TC_URL is empty (zyc_stable's dynamic lookup may have failed upstream)"
            exit 1
          fi
          ARCHIVE="/tmp/clang_archive"
          aria2c -x 16 -s 16 -k 1M -c --max-tries=5 --retry-wait=5 --timeout=60 \
            --dir="/tmp" --out="clang_archive" "${TC_URL}"
          [ -s "${ARCHIVE}" ] || { echo "::error::aria2c failed to download the toolchain archive, or it is empty."; exit 1; }
          case "${TC_ARCHIVE_FMT}" in
            tar.gz|tar) tar -C "${ABS_TC}" -xzf "${ARCHIVE}" ;;
            tar.xz)     tar -C "${ABS_TC}" -xJf "${ARCHIVE}" ;;
            tar.zst)    zstd -d "${ARCHIVE}" -o /tmp/clang.tar --force && tar -C "${ABS_TC}" -xf /tmp/clang.tar ;;
            *) echo "::error::unrecognized TC_ARCHIVE_FMT '${TC_ARCHIVE_FMT}'"; exit 1 ;;
          esac
          [ -n "$(find "${ABS_TC}" -type f -print -quit)" ] || { echo "::error::extraction reported success but ${ABS_TC} contains no files"; exit 1; }
          echo "Toolchain ready: $(find "${ABS_TC}" -type f | wc -l) file(s)"

      - name: Configure toolchain PATH
        run: |
          set -Eeuo pipefail
          ACTUAL_BIN=$(find "${ABS_TC}" -type d -name "bin" -printf "%d\t%p\n" | sort -n | cut -f2 | head -n 1)
          [ -n "${ACTUAL_BIN}" ] && [ -d "${ACTUAL_BIN}" ] || { echo "::error::could not find 'bin' directory inside extracted toolchain (${ABS_TC})"; exit 1; }
          chmod +x "${ACTUAL_BIN}"/* 2>/dev/null || true
          echo "${ACTUAL_BIN}" >> "$GITHUB_PATH"
          echo "Toolchain bin: ${ACTUAL_BIN}"

      - name: Verify toolchain and capture compiler identity
        id: toolchain
        run: |
          set -Eeuo pipefail
          for bin in clang llvm-nm llvm-objdump llvm-ar llvm-objcopy llvm-strip ld.lld; do
            command -v "${bin}" >/dev/null 2>&1 || { echo "::error::required toolchain binary '${bin}' not found in PATH"; exit 1; }
          done
          CLANG_VERSION="$(clang --version | head -1)"
          LLD_VERSION="$(ld.lld --version | head -1)"
          {
            echo "=== toolchain versions ==="
            echo "clang:  ${CLANG_VERSION}"
            echo "ld.lld: ${LLD_VERSION}"
            echo "aarch64-linux-gnu-ld: $(aarch64-linux-gnu-ld --version 2>&1 | head -1)"
            echo "make:   $(make --version 2>&1 | head -1)"
          } | tee toolchain-info.txt
          {
            echo "CLANG_VERSION=${CLANG_VERSION}"
            echo "clang=${CLANG_VERSION}"
            echo "ld_lld=${LLD_VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "CLANG_VERSION=${CLANG_VERSION}" >> "$GITHUB_ENV"

      - name: Validate requested defconfig exists
        run: |
          set -Eeuo pipefail
          DEF="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || 'exynos9810-star2lte_defconfig' }}"
          echo "Defconfig: ${DEF}"
          test -f "arch/arm64/configs/${DEF}"
          echo "Verified: arch/arm64/configs/${DEF} exists."

      # ------------------------------------------------------------------ AnyKernel3 (cloned early, packaged after build)
      - name: Clone AnyKernel3
        run: |
          set -Eeuo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -rf anykernel3/.git anykernel3/modules anykernel3/patch anykernel3/ramdisk
          echo "AK3_DIR=${GITHUB_WORKSPACE}/anykernel3" >> "$GITHUB_ENV"
          echo "AnyKernel3 cloned and stripped"

      # ------------------------------------------------------------------ Chimera performance overlay (compile-time, excises the SUSFS-only section 3/9 -- see header comment)
      - name: Fetch and apply Chimera performance overlay
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.enable_chimera_overlay == 'true'
        run: |
          set -Eeuo pipefail
          OVERLAY_REPO="${{ github.event.inputs.overlay_repo }}"
          OVERLAY_REF="${{ github.event.inputs.overlay_ref }}"
          echo "Fetching overlay script: ${OVERLAY_REPO} @ ${OVERLAY_REF}"
          git init -q /tmp/overlay-src
          git -C /tmp/overlay-src remote add origin "${OVERLAY_REPO}"
          git -C /tmp/overlay-src fetch --depth 1 origin "${OVERLAY_REF}"
          git -C /tmp/overlay-src checkout FETCH_HEAD -- \
            patches/apply_chimera_overlay_patches.sh \
            patches/0001-mfd-madera-core-settle-delay-after-reset-release.patch
          mkdir -p patches
          cp /tmp/overlay-src/patches/apply_chimera_overlay_patches.sh patches/
          cp /tmp/overlay-src/patches/0001-mfd-madera-core-settle-delay-after-reset-release.patch patches/
          chmod +x patches/apply_chimera_overlay_patches.sh

          # Boundary-matched excision of section 3/9 only (SUSFS-dependent -- see
          # header comment). Matched against the script's OWN section-comment
          # markers; fails loud if upstream has restructured since verification.
          python3 << 'PYEOF'
          import sys
          p = "patches/apply_chimera_overlay_patches.sh"
          lines = open(p).read().split("\n")
          try:
              start = next(i for i, l in enumerate(lines) if '# [3] fs/namei.c extra sus_path sub-path denial' in l)
              end = next(i for i, l in enumerate(lines) if '# [4] kernel/sched/fair.c scheduler tuning' in l)
          except StopIteration:
              print("FATAL: expected section [3]/[4] boundary comments not found in "
                    "apply_chimera_overlay_patches.sh -- upstream script structure has "
                    "changed since this excision was verified. Refusing to guess; "
                    "re-verify section 3's dependency on SUSFS namei.c backport before "
                    "proceeding.", file=sys.stderr)
              sys.exit(1)
          sep_start = start - 1
          new_lines = lines[:sep_start] + [
              '# [3] EXCISED: fs/namei.c sus_path sub-path denial requires SUSFS fully',
              '# source-integrated into fs/namei.c (susfs_is_inode_sus_path call sites).',
              '# This workflow only compiles fs/susfs.c + headers in -- it does not',
              '# backport that caller site -- so this section has nothing to re-harden',
              '# here. Excised at build time; see workflow header comment for the',
              '# verification that established this.',
              'log "=== [3/9] EXCISED (SUSFS not source-integrated into fs/namei.c on this base) ==="',
              ''
          ] + lines[end - 1:]
          open(p, "w").write("\n".join(new_lines))
          print("Section 3/9 excised (boundary-matched, sections 1/2/4-9 untouched).")
          PYEOF

          bash patches/apply_chimera_overlay_patches.sh 2>&1 | tee "${GITHUB_WORKSPACE}/overlay.log"
          echo "Chimera performance overlay applied (runner-only; not committed)."

      - name: Verify Chimera performance overlay markers
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.enable_chimera_overlay == 'true'
        run: |
          set -Eeuo pipefail
          FAIL=0
          check() {
            local desc="$1" marker="$2" file="$3"
            if grep -q "$marker" "$file" 2>/dev/null; then
              echo "OK:    $desc"
            else
              echo "FATAL: $desc — marker '$marker' not found in $file"
              FAIL=1
            fi
          }
          check "UFC short-circuit"                  "CMK9_UFC_SHORT_CIRCUIT"       "drivers/cpufreq/exynos-ufc.c"
          check "mem_rw() SUS_MAP guard"              "CMK9_MEM_RW_SUS_MAP_GUARD"    "fs/proc/base.c"
          check "board DTS tuning"                    "CMK9_DTS_BOARD_TUNING"        "arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts"
          check "sugov rate limit tuning"             "CMK9_SUGOV_RATE_LIMIT"        "kernel/sched/cpufreq_schedutil.c"
          check "sugov kthread priority (SCHED_RR)"   "CMK9_SUGOV_KTHREAD_PRIORITY"  "kernel/sched/cpufreq_schedutil.c"
          check "sugov_init() rate limit"             "CMK9_SUGOV_INIT_RATE_LIMIT"   "kernel/sched/cpufreq_schedutil.c"
          grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c \
            && echo "OK:    fair.c min_granularity tuned" \
            || { echo "FATAL: fair.c min_granularity not tuned"; FAIL=1; }
          grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c \
            && echo "OK:    fair.c migration_cost tuned" \
            || { echo "FATAL: fair.c migration_cost not tuned"; FAIL=1; }
          grep -q "Allow internal boot ROM / SPI interface to become ready" drivers/mfd/madera-core.c \
            && echo "OK:    madera-core.c settle delay applied" \
            || { echo "FATAL: madera-core.c settle delay not applied"; FAIL=1; }
          # Section 3 is intentionally excised -- explicitly confirm it did NOT land,
          # since a silent regression there would mean the excision step above failed
          # to match and something unexpected happened instead.
          if grep -q "CMK9_NAMEI_SUS_PATH_RECHECK" fs/namei.c 2>/dev/null; then
            echo "FATAL: CMK9_NAMEI_SUS_PATH_RECHECK marker present despite section 3 being excised -- excision did not work as expected"
            FAIL=1
          else
            echo "OK:    section 3/9 (SUSFS sus_path recheck) correctly absent — excised by design"
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo
          echo "PASS: Chimera performance overlay markers verified (8/9 sections; section 3/9 excised by design)"

      # ------------------------------------------------------------------ KSU vendoring (runner-only, compile-time)
      - name: Vendor KernelSU source into drivers/kernelsu/ (mode != disabled)
        if: steps.meta.outputs.ksu_integration_mode != 'disabled'
        run: |
          set -Eeuo pipefail
          KSU_REPO="${{ github.event.inputs.ksu_repo }}"
          KSU_REF="${{ github.event.inputs.ksu_ref }}"
          if [ -z "${KSU_REPO}" ] || [ -z "${KSU_REF}" ]; then
            echo "::error::ksu_repo and ksu_ref must be non-empty when ksu_integration_mode != disabled"
            exit 1
          fi
          echo "Cloning KernelSU: ${KSU_REPO} @ ${KSU_REF}"
          git clone --no-checkout "${KSU_REPO}" /tmp/ksu-src
          git -C /tmp/ksu-src fetch --no-tags --depth 1 origin "${KSU_REF}"
          git -C /tmp/ksu-src checkout --force "${KSU_REF}"
          RESOLVED="$(git -C /tmp/ksu-src rev-parse HEAD)"
          echo "Resolved KSU HEAD: ${RESOLVED}"
          if ! printf '%s' "${KSU_REF}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::ksu_ref '${KSU_REF}' is not a 40-hex SHA; this is NOT an immutable pin."
            echo "::warning::Resolved commit: ${RESOLVED}"
          else
            if [ "${RESOLVED}" != "${KSU_REF}" ]; then
              echo "::error::Resolved KSU HEAD (${RESOLVED}) does not match pinned SHA (${KSU_REF})"
              exit 1
            fi
          fi
          test -d /tmp/ksu-src/kernel
          test -f /tmp/ksu-src/kernel/Kconfig
          test -f /tmp/ksu-src/kernel/Kbuild
          mkdir -p drivers/kernelsu
          rsync -a --delete /tmp/ksu-src/kernel/ drivers/kernelsu/
          {
            echo "ksu_repo=${KSU_REPO}"
            echo "ksu_ref=${KSU_REF}"
            echo "ksu_resolved_sha=${RESOLVED}"
            date -u +"ksu_integrated_at=%Y-%m-%dT%H:%M:%SZ"
            echo "mk9_note=vendored into runner checkout only; never committed"
          } > drivers/kernelsu/KSU_PIN
          echo "KernelSU vendored into drivers/kernelsu/ (runner-only; KSU_PIN recorded)."
          if [ "${{ steps.meta.outputs.ksu_integration_mode }}" = "manual" ]; then
            grep -qE '^(void|int) ksu_handle_sys_read\(' drivers/kernelsu/runtime/ksud_integration.c || {
              echo "::error::ksu_handle_sys_read not found at the expected location for this pin."
              echo "::error::If ksu_ref changed, re-verify this signature (see header comment)."
              exit 1
            }
          fi

      - name: Wire drivers/Makefile + drivers/Kconfig for KSU (runner-only, Mk9)
        if: steps.meta.outputs.ksu_integration_mode != 'disabled'
        run: |
          set -Eeuo pipefail
          if ! grep -qE 'obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*kernelsu/' drivers/Makefile; then
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
            echo "drivers/Makefile wired for KSU (runner-only)."
          else
            echo "drivers/Makefile already wired for KSU."
          fi
          if ! grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig; then
            if grep -qE '^endmenu' drivers/Kconfig; then
              sed -i '0,/^endmenu/s//source "drivers\/kernelsu\/Kconfig"\n\nendmenu/' drivers/Kconfig
            else
              echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
            fi
            echo "drivers/Kconfig wired for KSU (runner-only)."
          else
            echo "drivers/Kconfig already wired for KSU."
          fi
          test -f drivers/kernelsu/Kconfig || { echo "::error::drivers/kernelsu/Kconfig missing after vendoring"; exit 1; }

      # ------------------------------------------------------------------ SUSFS integration (runner-only, compile-time)
      - name: Integrate SUSFS sources (enable_susfs=true)
        if: steps.meta.outputs.enable_susfs == 'true'
        run: |
          set -Eeuo pipefail
          SUSFS_REPO="${{ github.event.inputs.susfs_repo }}"
          SUSFS_REF="${{ github.event.inputs.susfs_ref }}"
          if [ -z "${SUSFS_REPO}" ] || [ -z "${SUSFS_REF}" ]; then
            echo "::error::susfs_repo and susfs_ref must be non-empty when enable_susfs=true"
            exit 1
          fi
          echo "Fetching SUSFS source: ${SUSFS_REPO} @ ${SUSFS_REF}"
          git clone --no-checkout "${SUSFS_REPO}" /tmp/susfs-src
          git -C /tmp/susfs-src fetch --no-tags --depth 1 origin "${SUSFS_REF}"
          git -C /tmp/susfs-src checkout --force "${SUSFS_REF}"
          echo "SUSFS resolved HEAD: $(git -C /tmp/susfs-src rev-parse HEAD)"
          if [ ! -f /tmp/susfs-src/fs/susfs.c ]; then
            echo "::error::fs/susfs.c not found in susfs_ref '${SUSFS_REF}' at ${SUSFS_REPO}."
            echo "::error::Expected layout: fs/susfs.c, include/linux/susfs.h,"
            echo "::error::include/linux/susfs_def.h (see lineage-23.2-ksun3-susfs2 for a"
            echo "::error::known-good layout)."
            exit 1
          fi
          cp -v /tmp/susfs-src/fs/susfs.c fs/susfs.c
          mkdir -p include/linux
          cp -v /tmp/susfs-src/include/linux/susfs.h include/linux/susfs.h
          cp -v /tmp/susfs-src/include/linux/susfs_def.h include/linux/susfs_def.h
          if ! grep -qE 'obj-\$\(CONFIG_KSU_SUSFS\)[[:space:]]*\+=[[:space:]]*susfs\.o' fs/Makefile; then
            printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile
            echo "fs/Makefile wired for SUSFS (runner-only)."
          else
            echo "fs/Makefile already wired for SUSFS."
          fi
          echo "SUSFS sources staged (fs/susfs.c + headers, runner-only)."

      # ------------------------------------------------------------------ configure
      - name: Clean build tree
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.clean_build == 'true'
        run: |
          set -Eeuo pipefail
          make ARCH=${ARCH} mrproper || true

      - name: Configure kernel (defconfig + KSU/SUSFS fragments + build identity)
        run: |
          set -Eeuo pipefail
          DEF="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || 'exynos9810-star2lte_defconfig' }}"
          make ARCH=${ARCH} CC=clang CROSS_COMPILE=${CROSS_COMPILE} "${DEF}"
          MODE="${{ steps.meta.outputs.ksu_integration_mode }}"
          SUSFS="${{ steps.meta.outputs.enable_susfs }}"
          FRAGS=()
          if [ "${MODE}" = "manual" ]; then FRAGS+=("arch/arm64/configs/chimera-ksu-manual.cfg"); fi
          if [ "${MODE}" = "kprobe" ]; then FRAGS+=("arch/arm64/configs/chimera-ksu-kprobe.cfg"); fi
          if [ "${SUSFS}" = "true" ]; then FRAGS+=("arch/arm64/configs/chimera-ksu-susfs.cfg"); fi
          if [ "${#FRAGS[@]}" -gt 0 ]; then
            ./scripts/kconfig/merge_config.sh -m -O . "${FRAGS[@]}"
          fi
          # Build-identity customization -- runner-local .config edits only, never
          # committed. Same intent as the "brand" LOCALVERSION handling elsewhere,
          # applied here without touching any tracked C source.
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' arch/arm64/configs/"${DEF}" 2>/dev/null || true
          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' "${FINAL_BRAND}" "${FINAL_BUILD_HOST}" >> .config
          make ARCH=${ARCH} CC=clang CROSS_COMPILE=${CROSS_COMPILE} olddefconfig
          cp .config config-${{ steps.meta.outputs.artifact_prefix }}

      # ------------------------------------------------------------------ verify config
      - name: Verify final .config symbols
        run: |
          set -Eeuo pipefail
          MODE="${{ steps.meta.outputs.ksu_integration_mode }}"
          SUSFS="${{ steps.meta.outputs.enable_susfs }}"
          fail=0
          check() {
            local sym="$1" exp="$2" got
            got="$(grep -E "^${sym}=|^# ${sym} is not set" .config | head -1 || true)"
            echo "${sym}: ${got:-<absent>}"
            case "${exp}" in
              y) [[ "${got}" = "${sym}=y" ]] || { echo "::error::expected ${sym}=y"; fail=1; } ;;
              n) [[ "${got}" = "${sym}=y" ]] && { echo "::error::expected ${sym} off but it is =y"; fail=1; } ;;
            esac
          }
          if [ "${MODE}" = "manual" ]; then
            check CONFIG_KSU y
            check CONFIG_KSU_MANUAL_HOOK y
            check CONFIG_KSU_KPROBES_HOOK n
          elif [ "${MODE}" = "kprobe" ]; then
            check CONFIG_KSU y
            check CONFIG_KSU_MANUAL_HOOK n
            check CONFIG_KSU_KPROBES_HOOK y
            check CONFIG_KPROBES y
            check CONFIG_KRETPROBES y
          elif [ "${MODE}" = "disabled" ]; then
            check CONFIG_KSU n
          fi
          if [ "${SUSFS}" = "true" ]; then
            check CONFIG_KSU_SUSFS y
          else
            check CONFIG_KSU_SUSFS n
          fi
          [ "${fail}" -eq 0 ] || exit 1
          echo "Final .config symbol check passed."

      # ------------------------------------------------------------------ verify hooks (critical, fails closed)
      - name: Verify KSU hook call sites (manual mode)
        if: steps.meta.outputs.ksu_integration_mode == 'manual'
        run: |
          set -Eeuo pipefail
          declare -A TARGETS=(
            ["fs/exec.c"]="ksu_handle_execveat"
            ["fs/open.c"]="ksu_handle_faccessat"
            ["fs/stat.c"]="ksu_handle_stat"
            ["fs/read_write.c"]="ksu_handle_sys_read"
            ["drivers/input/input.c"]="ksu_handle_input_handle_event"
            ["kernel/reboot.c"]="ksu_handle_sys_reboot"
          )
          fail=0
          for f in "${!TARGETS[@]}"; do
            sym="${TARGETS[$f]}"
            if [ ! -f "${f}" ]; then
              echo "::error::${f} not found"; fail=1; continue
            fi
            if ! grep -qE "\b${sym}\b" "${f}"; then
              echo "::error::Manual hook symbol '${sym}' not found in ${f}"
              fail=1
            else
              echo "OK: ${sym} present in ${f}"
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            echo "::error::Manual-hook call sites are missing. Under the Mk9 model this"
            echo "::error::workflow does NOT patch fs/exec.c, fs/open.c, fs/stat.c,"
            echo "::error::fs/read_write.c, drivers/input/input.c, or kernel/reboot.c --"
            echo "::error::it only vendors KSU/SUSFS and wires build files at compile time."
            echo "::error::The checked-out ref must already contain these 6 call sites."
            echo "::error::Reference implementation: royd-jpg/Project_Chimera, branch"
            echo "::error::lineage-23.2-ksun3-susfs2. Point this workflow's checkout at an"
            echo "::error::equivalent hook-carrying ref, or use ksu_integration_mode=kprobe"
            echo "::error::instead, which requires no existing-file modifications."
            exit 1
          fi
          echo "All manual-hook call sites verified present."

      - name: Verify kprobe config and KSU symbols (kprobe mode)
        if: steps.meta.outputs.ksu_integration_mode == 'kprobe'
        run: |
          set -Eeuo pipefail
          grep -qE '^CONFIG_KSU_KPROBES_HOOK=y' .config
          grep -qE '^CONFIG_HAVE_SYSCALL_TRACEPOINTS=y' .config
          grep -qE '^CONFIG_KRETPROBES=y' .config
          grep -qE '^CONFIG_KPROBES=y' .config
          test -f drivers/kernelsu/hook/hook_manager.c
          grep -qE 'kprobe|kretprobe|tracepoint' drivers/kernelsu/hook/hook_manager.c
          echo "Kprobe-mode KSU symbols verified."

      - name: Verify SUSFS integration (enable_susfs=true)
        if: steps.meta.outputs.enable_susfs == 'true'
        run: |
          set -Eeuo pipefail
          test -f fs/susfs.c || { echo "::error::fs/susfs.c missing after SUSFS integration"; exit 1; }
          test -f include/linux/susfs.h || { echo "::error::include/linux/susfs.h missing"; exit 1; }
          grep -qE '^CONFIG_KSU_SUSFS=y' .config
          grep -qE 'susfs' fs/susfs.c
          grep -qE 'obj-\$\(CONFIG_KSU_SUSFS\)[[:space:]]*\+=[[:space:]]*susfs\.o' fs/Makefile
          echo "SUSFS integration verified (fs/susfs.c + include/linux/susfs.h + fs/Makefile entry present)."

      # ------------------------------------------------------------------ identity + KCFLAGS hash (metadata only)
      - name: Generate kernel identity and KCFLAGS hash
        run: |
          set -Eeuo pipefail
          FULL_KCFLAGS="${BASE_KCFLAGS} ${{ github.event.inputs.extra_kcflags }}"
          KCFLAGS_HASH="$(printf '%s\n' "${FULL_KCFLAGS}" | sha256sum | cut -d' ' -f1)"
          KERNEL_RELEASE="${KERNEL_VERSION_STR}${FINAL_BRAND}"
          KERNEL_IDENTITY="mk9/${{ steps.meta.outputs.artifact_prefix }}/${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain || 'llvm22' }}/${KERNEL_RELEASE}"
          UNAME_PREVIEW="Linux version ${KERNEL_VERSION_STR}${FINAL_BRAND} (${FINAL_BUILD_USER}@${FINAL_BUILD_HOST}) #${FINAL_BUILD_VERSION} SMP PREEMPT"
          {
            echo "FULL_KCFLAGS=${FULL_KCFLAGS}"
            echo "KCFLAGS_HASH=${KCFLAGS_HASH}"
            echo "KERNEL_RELEASE=${KERNEL_RELEASE}"
            echo "KERNEL_IDENTITY=${KERNEL_IDENTITY}"
            echo "UNAME_PREVIEW=${UNAME_PREVIEW}"
          } >> "$GITHUB_ENV"
          echo "Kernel identity: ${KERNEL_IDENTITY}"
          echo "KCFLAGS: ${FULL_KCFLAGS}"
          echo "uname preview: ${UNAME_PREVIEW}"

      # ------------------------------------------------------------------ build
      - name: Build security/selinux first (ksu.o flask.h dependency)
        run: |
          set -Eeuo pipefail
          # ksu.o includes headers generated under security/selinux/; build that
          # subtree first to avoid a -j race on $(objtree)/security/selinux/flask.h.
          # This tail/|| true is for log brevity only; real failures here still
          # surface at the full build step below and are not masked.
          make ARCH=${ARCH} CC=clang LD=ld.lld CROSS_COMPILE=${CROSS_COMPILE} -j"$(nproc)" security/selinux/ 2>&1 | tail -20 || true

      - name: Build Image.gz + dtbs
        env:
          KBUILD_BUILD_USER: ${{ env.FINAL_BUILD_USER }}
          KBUILD_BUILD_HOST: ${{ env.FINAL_BUILD_HOST }}
          KBUILD_BUILD_VERSION: ${{ env.FINAL_BUILD_VERSION }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.FINAL_BUILD_DATE }}
        run: |
          set -Eeuo pipefail
          make ARCH=${ARCH} CC=clang LD=ld.lld CROSS_COMPILE=${CROSS_COMPILE} \
              LOCALVERSION="${FINAL_BRAND}" \
              KCFLAGS="${FULL_KCFLAGS}" \
              HOSTLDFLAGS="${TC_HOSTLDFLAGS}" \
              -j"$(nproc)" Image.gz dtbs 2>&1 | tee build.log
          echo "Build exit: ${PIPESTATUS[0]}"
          test -s arch/arm64/boot/Image.gz
          echo "Image.gz produced."

      - name: Verify image format and architecture
        run: |
          set -Eeuo pipefail
          file arch/arm64/boot/Image.gz
          od -An -tx1 -N2 arch/arm64/boot/Image.gz
          find arch/arm64/boot/dts -name '*.dtb' | head
          test -n "$(find arch/arm64/boot/dts -name '*.dtb' | head -1)"

      # ------------------------------------------------------------------ post-build
      - name: Generate SHA256SUMS and build manifest
        id: manifest
        run: |
          set -Eeuo pipefail
          PREFIX="${{ steps.meta.outputs.artifact_prefix }}"
          STAGE="out/${PREFIX}"
          mkdir -p "${STAGE}"
          cp arch/arm64/boot/Image.gz "${STAGE}/Image.gz"
          find arch/arm64/boot/dts -name '*.dtb' -exec cp {} "${STAGE}/" \;
          cp .config "${STAGE}/config-${PREFIX}"
          cp build.log "${STAGE}/build.log"
          cp toolchain-info.txt "${STAGE}/toolchain-info.txt"
          # Mk9: diff only the files this workflow can legitimately have touched
          # (runner-only wiring + vendored/copied sources). The 6 manual-hook files
          # are intentionally excluded -- Mk9 never modifies them.
          git diff -- drivers/Makefile drivers/Kconfig drivers/kernelsu fs/susfs.c fs/Makefile \
                   include/linux/susfs.h include/linux/susfs_def.h \
                   > "${STAGE}/source-diff-${PREFIX}.patch" 2>/dev/null || true
          [ -s "${STAGE}/source-diff-${PREFIX}.patch" ] || rm -f "${STAGE}/source-diff-${PREFIX}.patch"
          ( cd "${STAGE}" && sha256sum * > SHA256SUMS )
          BUILD_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          KERNEL_RELEASE_ACTUAL="$(make ARCH=${ARCH} CC=clang -s kernelrelease 2>/dev/null || echo unknown)"
          cat > "${STAGE}/manifest.json" <<EOF
          {
            "kernel_version": "Linux 4.9.337 (Exynos 9810)",
            "kernel_release_actual": "${KERNEL_RELEASE_ACTUAL}",
            "arch": "arm64",
            "workflow_model": "mk9",
            "defconfig": "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.defconfig || 'exynos9810-star2lte_defconfig' }}",
            "ksu_integration_mode": "${{ steps.meta.outputs.ksu_integration_mode }}",
            "enable_susfs": "${{ steps.meta.outputs.enable_susfs }}",
            "mode_label": "${{ steps.meta.outputs.mode_label }}",
            "ksu_repo": "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ksu_repo || '' }}",
            "ksu_ref": "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ksu_ref || '' }}",
            "susfs_repo": "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.susfs_repo || '' }}",
            "susfs_ref": "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.susfs_ref || '' }}",
            "toolchain": {
              "requested": "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.toolchain || 'llvm22' }}",
              "cache_key": "${TC_CACHE_KEY}",
              "clang_version": "${{ steps.toolchain.outputs.clang }}",
              "ld_lld": "${{ steps.toolchain.outputs.ld_lld }}"
            },
            "build_identity": {
              "brand": "${FINAL_BRAND}",
              "build_user": "${FINAL_BUILD_USER}",
              "build_host": "${FINAL_BUILD_HOST}",
              "build_version": "${FINAL_BUILD_VERSION}",
              "build_timestamp": "${FINAL_BUILD_DATE}",
              "uname_preview": "${UNAME_PREVIEW}",
              "kernel_release_label": "${KERNEL_RELEASE}",
              "identity_string": "${KERNEL_IDENTITY}",
              "kcflags": "${FULL_KCFLAGS}",
              "kcflags_sha256": "${KCFLAGS_HASH}"
            },
            "build_timestamp_utc": "${BUILD_TS}",
            "commit_sha": "${{ github.sha }}",
            "android17_scope": "Android 17 compatibility here means building the modified Exynos 9810 vendor kernel for potential use with a compatible LineageOS 24 userspace. Runtime compatibility requires physical-device testing.",
            "artifact_names": $(cd "${STAGE}" && ls | jq -R -s -c 'split("\n") | map(select(length>0))'),
            "sha256sums": $(cd "${STAGE}" && jq -R -s -c 'split("\n") | map(select(length>0))' SHA256SUMS)
          }
          EOF
          cat "${STAGE}/manifest.json"
          echo "stage_dir=${STAGE}" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mk9-${{ steps.meta.outputs.artifact_prefix }}-${{ github.run_id }}
          path: out/${{ steps.meta.outputs.artifact_prefix }}/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release (optional)
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-mk9-${{ needs.build.outputs.artifact_prefix }}-${{ github.run_id }}
          path: release-assets
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kernel-mk9-${{ needs.build.outputs.mode_label }}-${{ github.run_id }}
          name: Exynos9810 kernel (Mk9) — ${{ needs.build.outputs.mode_label }}
          body: |
            Exynos 9810 (Linux 4.9.337) kernel build. Mk9 model: KSU/SUSFS merged
            at compile time only; repo tree unmodified in Git.
            Mode: ${{ needs.build.outputs.ksu_integration_mode }}
            SUSFS: ${{ needs.build.outputs.enable_susfs }}

            Android 17 compatibility here means building the modified Exynos 9810 vendor kernel for
            potential use with a compatible LineageOS 24 userspace. Runtime compatibility requires
            physical-device testing.
          files: release-assets/*
          draft: true
          prerelease: true
