name: Kernel — Android 17 (KSUN + SUSFS) — Exynos9810

on:
  push:
    branches:
      - lineage-24.0
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - ".github/workflows/kernel-android17-ksun-susfs.yml"
  pull_request:
    branches:
      - lineage-24.0
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - ".github/workflows/kernel-android17-ksun-susfs.yml"
  workflow_dispatch:
    inputs:
      toolchain:
        description: "llvm22, llvm21, llvm20, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, or zyc_stable"
        type: string
        required: true
        default: llvm22
      localversion:
        description: "Kernel localversion; must start with '-'"
        type: string
        required: true
        default: "-Chimera_Mk9"
      build_user:
        description: "KBUILD_BUILD_USER"
        type: string
        required: true
        default: MTRXX
      build_host:
        description: "KBUILD_BUILD_HOST"
        type: string
        required: true
        default: CM9XNNNN
      build_version:
        description: "KBUILD_BUILD_VERSION"
        type: string
        required: true
        default: "1"
      build_timestamp:
        description: "KBUILD_BUILD_TIMESTAMP"
        type: string
        required: true
        default: "Wed Aug 19 03:26:19 UTC 2026"
      build_variants:
        description: "Comma-separated: star2lte,starlte,crownlte"
        type: string
        required: true
        default: "star2lte,starlte,crownlte"
      upload_dtbs:
        description: "Build and upload per-variant DTB images"
        type: boolean
        required: true
        default: true
      enable_lto:
        description: "Enable CONFIG_LTO_CLANG when supported by the tree"
        type: boolean
        required: true
        default: false
      extra_cflags:
        description: "Additional KCFLAGS"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Validate setup and configuration only"
        type: boolean
        required: true
        default: false
      do_release:
        description: "Create a GitHub release after a successful manual build"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: kernel-exynos9810-${{ github.workflow }}-${{ github.ref }}-${{ inputs.toolchain || 'llvm22' }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CCACHE_MAXSIZE: 3G
  KERNEL_VERSION: 4.9.337
  KBUILD_BUILD_USER: ${{ inputs.build_user || 'MTRXX' }}
  KBUILD_BUILD_HOST: ${{ inputs.build_host || 'CM9XNNNN' }}
  KBUILD_BUILD_VERSION: ${{ inputs.build_version || '1' }}
  KBUILD_BUILD_TIMESTAMP: ${{ inputs.build_timestamp || 'Wed Aug 19 03:26:19 UTC 2026' }}
  LOCALVERSION: ${{ inputs.localversion || '-Chimera_Mk9' }}
  BUILD_VARIANTS: ${{ inputs.build_variants || 'star2lte,starlte,crownlte' }}
  TOOLCHAIN: ${{ inputs.toolchain || 'llvm22' }}
  EXTRA_CFLAGS: ${{ inputs.extra_cflags || '' }}
  ENABLE_LTO: ${{ inputs.enable_lto || false }}
  UPLOAD_DTBS: ${{ inputs.upload_dtbs || false }}

jobs:
  build:
    name: Build — ${{ inputs.toolchain || 'llvm22' }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Project_Chimera
        uses: actions/checkout@v5
        with:
          repository: royd-jpg/Project_Chimera
          ref: lineage-24.0
          fetch-depth: 1
          submodules: recursive

      - name: Validate inputs
        run: |
          set -euo pipefail
          echo "::group::Validate inputs"

          fail=0

          if [[ "$LOCALVERSION" != -* ]]; then
            echo "::error::localversion must start with '-': $LOCALVERSION"
            fail=1
          fi

          for value_name in KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_VERSION KBUILD_BUILD_TIMESTAMP BUILD_VARIANTS TOOLCHAIN; do
            if [[ -z "${!value_name}" ]]; then
              echo "::error::$value_name must not be empty"
              fail=1
            fi
          done

          case "$TOOLCHAIN" in
            llvm22|llvm21|llvm20|aosp22|aosp21|aosp20|aosp19|neutron19|neutron23|neutron24|zyc_stable)
              ;;
            *)
              echo "::error::Unsupported toolchain: $TOOLCHAIN"
              fail=1
              ;;
          esac

          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          if [[ "${#variants[@]}" -eq 0 ]]; then
            echo "::error::No build variants supplied"
            fail=1
          fi

          declare -A seen=()
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            case "$variant" in
              star2lte|starlte|crownlte)
                ;;
              *)
                echo "::error::Unsupported variant: $variant"
                fail=1
                ;;
            esac

            if [[ -n "${seen[$variant]:-}" ]]; then
              echo "::error::Duplicate variant: $variant"
              fail=1
            fi
            seen["$variant"]=1
          done

          echo "::endgroup::"
          [[ "$fail" -eq 0 ]]

      - name: Install dependencies
        run: |
          set -euo pipefail
          echo "::group::Install dependencies"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache device-tree-compiler \
            flex gcc-aarch64-linux-gnu git libelf-dev libncurses-dev \
            libssl-dev lzop python3 rsync wget zip zlib1g-dev zstd \
            binutils-aarch64-linux-gnu

          echo "::endgroup::"

      - name: Configure ccache
        run: |
          set -euo pipefail
          echo "::group::Configure ccache"

          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          echo "::endgroup::"

      - name: Resolve toolchain
        run: |
          set -euo pipefail
          echo "::group::Resolve toolchain"

          case "$TOOLCHAIN" in
            aosp19)
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV"
              ;;
            aosp20)
              echo "TC_URL=https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV"
              ;;
            aosp21)
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV"
              ;;
            aosp22)
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV"
              ;;
            llvm20)
              echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV"
              ;;
            llvm21)
              echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV"
              ;;
            llvm22)
              echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV"
              ;;
            neutron19)
              echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV"
              ;;
            neutron23)
              echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV"
              ;;
            neutron24)
              echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV"
              ;;
            zyc_stable)
              zyc_url="$(curl -fsSL https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt)"
              [[ -n "$zyc_url" ]]
              echo "TC_URL=$zyc_url" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV"
              ;;
          esac

          echo "::endgroup::"

      # FIX: the cache key now includes the resolved TC_URL. zyc_stable resolves a
      # rolling "latest" link at runtime; previously the key was static per-toolchain,
      # so once cached, every future run silently reused the first-ever downloaded
      # build and never picked up upstream updates. Pinned toolchains (llvm22, aosp21,
      # etc.) are unaffected since their TC_URL never changes between runs.
      - name: Restore toolchain cache
        uses: actions/cache@v6
        id: toolchain-cache
        with:
          path: toolchains/clang
          key: toolchain-${{ inputs.toolchain || 'llvm22' }}-ubuntu-24.04-v3-${{ env.TC_URL }}

      - name: Download and extract toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "::group::Download and extract toolchain"

          rm -rf toolchains/clang /tmp/clang-archive /tmp/clang.tar /tmp/clang-stage
          mkdir -p toolchains/clang /tmp/clang-stage

          aria2c \
            --allow-overwrite=true \
            --continue=true \
            --dir=/tmp \
            --file-allocation=none \
            --max-tries=5 \
            --min-split-size=1M \
            --out=clang-archive \
            --retry-wait=5 \
            --split=16 \
            "$TC_URL"

          test -s /tmp/clang-archive

          # Detect by file content, not by the URL suffix.
          archive_kind="$(file -b /tmp/clang-archive)"
          case "$archive_kind" in
            *gzip*)
              tar_extract=(tar -xzf /tmp/clang-archive -C /tmp/clang-stage)
              ;;
            *XZ*)
              tar_extract=(tar -xJf /tmp/clang-archive -C /tmp/clang-stage)
              ;;
            *Zstandard*)
              zstd -d -f /tmp/clang-archive -o /tmp/clang.tar
              tar_extract=(tar -xf /tmp/clang.tar -C /tmp/clang-stage)
              ;;
            *)
              echo "::error::Unsupported toolchain archive: $archive_kind"
              exit 1
              ;;
          esac

          "${tar_extract[@]}"

          # Locate the actual compiler root by finding clang itself.
          # This handles:
          #   <root>/bin/clang
          #   bin/clang
          #   nested/wrapper/<root>/bin/clang
          #
          # FIX: kernel.org publishes "slim" LLVM toolchains built with the LLVM
          # multicall driver (LLVM_TOOL_LLVM_DRIVER_BUILD). In that layout, bin/clang
          # (and most other tool names) are SYMLINKS to a single shared "llvm" binary,
          # not regular files. `-type f` alone never matches them, so this always
          # returned empty for llvm20/llvm21/llvm22 even on a perfectly good download.
          # Match both regular files and symlinks.
          clang_bin="$(find /tmp/clang-stage \( -type f -o -type l \) -path '*/bin/clang' -print -quit)"
          if [[ -z "$clang_bin" ]]; then
            echo "::error::clang was not found in extracted archive"
            echo "::group::Archive contents"
            # FIX: dump full type+path listing (not just a name filter with -type f)
            # so a future failure is actually self-diagnosing instead of printing
            # an empty group, as it did before.
            find /tmp/clang-stage -maxdepth 6 -printf '%y %p\n' | sort | head -n 200
            echo "::endgroup::"
            exit 1
          fi

          toolchain_root="$(cd "$(dirname "$clang_bin")/.." && pwd)"

          # Keep the complete toolchain root intact. This is important for
          # Neutron, where bin/, lib/, and supporting files belong together.
          # rsync -a preserves symlinks (-l is implied by -a), so the multicall
          # symlinks stay intact and resolvable after this copy.
          rm -rf toolchains/clang
          mkdir -p toolchains/clang
          rsync -a "$toolchain_root"/ toolchains/clang/

          test -x toolchains/clang/bin/clang
          test -x toolchains/clang/bin/ld.lld

          # Make all bundled LLVM tools executable when the archive preserved
          # them as non-executable files. FIX: include symlinks here too — chmod
          # on a symlink is a harmless no-op/pass-through to its target on Linux,
          # so widening this is safe and keeps it consistent with the lookup above.
          find toolchains/clang/bin -maxdepth 1 \( -type f -o -type l \) -exec chmod +x {} +

          echo "Resolved toolchain root: $toolchain_root"
          echo "::endgroup::"

      - name: Configure and verify toolchain
        run: |
          set -euo pipefail
          echo "::group::Configure and verify toolchain"

          toolchain_bin="$PWD/toolchains/clang/bin"
          if [[ ! -x "$toolchain_bin/clang" ]]; then
            echo "::error::clang is missing from $toolchain_bin"
            find toolchains/clang -maxdepth 4 \( -type f -o -type l \) \
              \( -name clang -o -name ld.lld -o -name llvm-ar \) \
              -print | sort | head -n 200
            exit 1
          fi

          chmod +x "$toolchain_bin"/* 2>/dev/null || true
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          export PATH="$toolchain_bin:$PATH"

          for binary in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if ! command -v "$binary" >/dev/null 2>&1; then
              echo "::error::Required tool missing: $binary"
              exit 1
            fi
          done

          clang_major="$(clang --version | sed -nE 's/^clang version ([0-9]+).*/\1/p' | head -n1)"
          [[ -n "$clang_major" ]]

          echo "CLANG_LABEL=clang$clang_major" >> "$GITHUB_ENV"
          echo "CLANG_VERSION=$(clang --version | head -n1)" >> "$GITHUB_ENV"

          mkdir -p artifacts
          {
            echo "Kernel: Linux $KERNEL_VERSION"
            echo "Toolchain: $(clang --version | head -n1)"
            echo "Linker: $(ld.lld --version | head -n1)"
            echo "Toolchain root: $PWD/toolchains/clang"
            echo "Commit: $(git rev-parse HEAD)"
          } > artifacts/toolchain.txt

          echo "::endgroup::"

      - name: Configure KSUN and SUSFS defconfigs
        run: |
          set -euo pipefail
          echo "::group::Configure KSUN and SUSFS defconfigs"

          configs=(
            arch/arm64/configs/exynos9810-star2lte_defconfig
            arch/arm64/configs/exynos9810-starlte_defconfig
            arch/arm64/configs/exynos9810-crownlte_defconfig
          )

          symbols=(
            KSU
            KSU_MANUAL_HOOK
            KSU_KPROBES_HOOK
            KSU_SUSFS
            KSU_SUSFS_SUS_PATH
            KSU_SUSFS_SUS_MOUNT
            KSU_SUSFS_SUS_KSTAT
            KSU_SUSFS_TRY_UMOUNT
            KSU_SUSFS_SPOOF_UNAME
          )

          for config in "${configs[@]}"; do
            test -f "$config"

            for symbol in "${symbols[@]}"; do
              sed -i -E "/^(# )?CONFIG_${symbol}(=| is not set)/d" "$config"
            done

            cat >> "$config" <<'EOF'
          # KernelSU-Next + SUSFS
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_KPROBES_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          EOF
          done

          echo "::endgroup::"

      - name: Clone AnyKernel3
        run: |
          set -euo pipefail
          echo "::group::Clone AnyKernel3"

          rm -rf anykernel3
          git clone --depth=1 --branch master https://github.com/osm0sis/AnyKernel3.git anykernel3

          echo "::endgroup::"

      - name: Build dtbTool
        run: |
          set -euo pipefail
          echo "::group::Build dtbTool"

          rm -rf dtbTool dtbTool-bin
          git clone --depth=1 https://github.com/rajatgupta1998/android_tools_system_dtbTool.git dtbTool

          source_file="$(find dtbTool -type f -name dtbtool.c -print -quit)"
          if [[ -z "$source_file" ]]; then
            echo "::error::dtbtool.c was not found"
            exit 1
          fi

          gcc "$source_file" -O2 -o dtbTool-bin
          chmod +x dtbTool-bin
          test -x dtbTool-bin

          echo "::endgroup::"

      - name: Build kernel variants
        id: build
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "::group::Build kernel variants"

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export KCFLAGS="$EXTRA_CFLAGS"
          # FIX: this Makefile does `CLANG_TRIPLE ?= $(CROSS_COMPILE)`, but the make
          # invocation below passes CLANG_TRIPLE on the command line. A command-line
          # make variable always wins over `?=` in the Makefile, and $CLANG_TRIPLE was
          # never set anywhere in this workflow, so it was silently expanding to an
          # empty string — disabling `--target=aarch64-linux-gnu` in CLANG_FLAGS.
          # Set it explicitly instead of relying on the Makefile default being able
          # to take effect.
          export CLANG_TRIPLE="$CROSS_COMPILE"

          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          built_variants=()

          rm -rf out
          mkdir -p out

          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            output_dir="out/$variant"
            defconfig="exynos9810-${variant}_defconfig"

            mkdir -p "$output_dir"

            make -C . O="$output_dir" ARCH="$ARCH" "$defconfig"

            scripts/config \
              --file "$output_dir/.config" \
              -e KSU \
              -e KSU_MANUAL_HOOK \
              -d KSU_KPROBES_HOOK \
              -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_SPOOF_UNAME

            if [[ "$ENABLE_LTO" == "true" ]]; then
              if ! grep -Rqs '^config LTO_CLANG$' arch drivers fs include kernel security; then
                echo "::error::enable_lto=true, but this kernel tree does not provide CONFIG_LTO_CLANG"
                exit 1
              fi
              scripts/config --file "$output_dir/.config" -e LTO_CLANG
            fi

            make -C . O="$output_dir" ARCH="$ARCH" olddefconfig

            grep -qx 'CONFIG_KSU=y' "$output_dir/.config"
            grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$output_dir/.config"
            grep -qx 'CONFIG_KSU_SUSFS=y' "$output_dir/.config"

            if [[ "$ENABLE_LTO" == "true" ]]; then
              grep -qx 'CONFIG_LTO_CLANG=y' "$output_dir/.config"
            fi

            make -C . \
              -j"$(nproc)" \
              O="$output_dir" \
              ARCH="$ARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CLANG_TRIPLE="$CLANG_TRIPLE" \
              CC="$CC" \
              LD="$LD" \
              AR="$AR" \
              NM="$NM" \
              OBJCOPY="$OBJCOPY" \
              OBJDUMP="$OBJDUMP" \
              STRIP="$STRIP" \
              KCFLAGS="$KCFLAGS" \
              Image.gz-dtb dtbs

            image="$output_dir/arch/arm64/boot/Image.gz-dtb"
            if [[ ! -s "$image" ]]; then
              echo "::error::$variant did not produce Image.gz-dtb"
              exit 1
            fi

            cp "$image" "out/Image.gz-dtb-$variant"
            built_variants+=("$variant")
          done

          {
            echo "variants=$(IFS=,; echo "${built_variants[*]}")"
            echo "clang_label=$CLANG_LABEL"
          } >> "$GITHUB_OUTPUT"

          ccache -s || true
          echo "::endgroup::"

      - name: Create per-variant DTB images
        if: inputs.dry_run != true && inputs.upload_dtbs == true
        run: |
          set -euo pipefail
          echo "::group::Create per-variant DTB images"

          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"

          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            output_dir="out/$variant"
            dts_dir="$output_dir/arch/arm64/boot/dts/exynos"
            dtb_image="$output_dir/arch/arm64/boot/dtb.img"

            shopt -s nullglob
            dtbs=("$dts_dir"/*.dtb)
            shopt -u nullglob

            if [[ "${#dtbs[@]}" -eq 0 ]]; then
              echo "::error::$variant produced no Exynos DTBs"
              exit 1
            fi

            ./dtbTool-bin \
              -s 2048 \
              -o "$dtb_image" \
              -p "$output_dir/scripts/dtc/" \
              "${dtbs[@]}"

            test -s "$dtb_image"
            cp "$dtb_image" "out/dtb-$variant.img"
          done

          echo "::endgroup::"

      - name: Package AnyKernel3 ZIPs
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "::group::Package device-checked AnyKernel3 ZIPs"

          rm -rf packages
          mkdir -p packages

          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"

          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            staging_dir="packages/AnyKernel3-$variant"
            zip_name="Chimera-KSUN-SUSFS-${CLANG_LABEL}${LOCALVERSION}-$variant.zip"

            case "$variant" in
              star2lte)
                device_names=$'device.name1=star2lte\ndevice.name2=star2ltexx\ndevice.name3=SM-G965F\ndevice.name4=SM-G965U\ndevice.name5=SM-G965N'
                ;;
              starlte)
                device_names=$'device.name1=starlte\ndevice.name2=starltexx\ndevice.name3=SM-G960F\ndevice.name4=SM-G960U\ndevice.name5=SM-G960N'
                ;;
              crownlte)
                device_names=$'device.name1=crownlte\ndevice.name2=crownltexx\ndevice.name3=SM-N960F\ndevice.name4=SM-N960U\ndevice.name5=SM-N960N'
                ;;
              *)
                echo "::error::Unsupported AnyKernel3 variant: $variant"
                exit 1
                ;;
            esac

            mkdir -p "$staging_dir"
            rsync -a --delete --exclude=.git anykernel3/ "$staging_dir/"

            test -f "$staging_dir/tools/ak3-core.sh"
            test -s "out/Image.gz-dtb-$variant"

            cat > "$staging_dir/anykernel.sh" <<EOF
          #!/usr/bin/env bash
          
          properties() { '
          kernel.string=Chimera Linux $KERNEL_VERSION KSUN + SUSFS ($variant) | $CLANG_VERSION
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          $device_names
          supported.versions=17
          '; }
          
          BLOCK=/dev/block/by-name/BOOT
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          
          . tools/ak3-core.sh
          
          dump_boot
          write_boot
          EOF

            chmod +x "$staging_dir/anykernel.sh"
            cp "out/Image.gz-dtb-$variant" "$staging_dir/Image.gz-dtb"

            (
              cd "$staging_dir"
              zip -r9 "../$zip_name" . -x ".git/*" ".github/*"
            )

            test -s "packages/$zip_name"
            rm -rf "$staging_dir"
          done

          echo "::endgroup::"

      - name: Upload build artifacts
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v7
        with:
          name: Chimera-KSUN-SUSFS-${{ inputs.toolchain || 'llvm22' }}-${{ github.run_number }}
          path: |
            packages/*.zip
            out/Image.gz-dtb-*
            out/dtb-*.img
            artifacts/build-metadata.txt
            artifacts/toolchain.txt
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.do_release == true && inputs.dry_run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Chimera-KSUN-SUSFS-${{ github.run_number }}
          name: Chimera KSUN + SUSFS — Build ${{ github.run_number }}
          files: |
            packages/*.zip
          body: |
            ## Exynos 9810 — KernelSU-Next + SUSFS

            - Kernel: Linux 4.9.337
            - Source: Project_Chimera / lineage-24.0
            - Toolchain: ${{ inputs.toolchain }}
            - Localversion: ${{ inputs.localversion }}
            - Build identity: ${{ inputs.build_user }}@${{ inputs.build_host }} #${{ inputs.build_version }}
            - Timestamp: ${{ inputs.build_timestamp }}
            - Variants: ${{ steps.build.outputs.variants }}
            - DTB artifacts: ${{ inputs.upload_dtbs && 'included' || 'not included' }}
            - LTO: ${{ inputs.enable_lto && 'enabled' || 'disabled' }}

            Flash only on supported Exynos 9810 devices.
