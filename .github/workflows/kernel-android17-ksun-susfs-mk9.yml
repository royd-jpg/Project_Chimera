name: Kernel — Android 17 (KSUN + SUSFS) — Exynos9810

on:
  push:
    branches: [lineage-24.0]
  pull_request:
    branches: [lineage-24.0]
  workflow_dispatch:
    inputs:
      variants:
        description: Comma-separated device variants
        required: true
        default: star2lte,starlte,crownlte
        type: string
      upload_dtbs:
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: exynos9810-ksun-susfs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARCH: arm64
  KERNEL_VERSION: 4.9.337
  KBUILD_BUILD_USER: MTRXX
  KBUILD_BUILD_HOST: CM9XNNNN
  KBUILD_BUILD_VERSION: "1"
  KBUILD_BUILD_TIMESTAMP: Wed Aug 19 03:26:19 UTC 2026
  LOCALVERSION: -Chimera_Mk9
  BUILD_VARIANTS: ${{ inputs.variants || 'star2lte,starlte,crownlte' }}
  UPLOAD_DTBS: ${{ inputs.upload_dtbs }}
  KSU_REPO: gavdoc38/KernelSU-Next
  KSU_REF: b3263c77975616d3c29d48aa600892263e7d75c9
  SUSFS_REPO: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_REF: 1.4.2-kernel-4.9

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aria2 bc bison build-essential ccache device-tree-compiler flex gcc-aarch64-linux-gnu git libelf-dev libncurses-dev libssl-dev patch python3 rsync xz-utils zip zlib1g-dev

      - name: Fetch pinned KSUN and SUSFS
        run: |
          set -euo pipefail
          test ! -e drivers/kernelsu
          git clone --filter=blob:none "https://github.com/$KSU_REPO.git" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_REF"
          test "$(git -C KernelSU-Next rev-parse HEAD)" = "$KSU_REF"
          git clone --depth=1 --branch "$SUSFS_REF" "$SUSFS_REPO" susfs4ksu
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          grep -qF 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -qF 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/^endmenu$/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Add exact manual hooks for the pinned KSUN revision
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit("anchor missing: " + path)
              p.write_text(s.replace(old, new, 1))
          edit("fs/exec.c",
               "int do_execve(struct filename *filename,\n",
               "#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n#endif\n\nint do_execve(struct filename *filename,\n")
          edit("fs/exec.c",
               "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
               "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);")
          edit("fs/exec.c",
               "\t\t.ptr.compat = __envp,\n\t};\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);",
               "\t\t.ptr.compat = __envp,\n\t};\n#ifdef CONFIG_KSU\n\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, 0);\n#endif\n\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);")
          edit("fs/open.c",
               "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n",
               "#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n#endif\n\nSYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n")
          edit("fs/open.c",
               "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n\n\tif (mode & ~S_IRWXO)",
               "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n#ifdef CONFIG_KSU\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n#endif\n\n\tif (mode & ~S_IRWXO)")
          edit("fs/read_write.c",
               "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n",
               "#ifdef CONFIG_KSU\nextern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n#endif\n\nSYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n")
          edit("fs/read_write.c",
               "\t\tloff_t pos = file_pos_read(f.file);\n\t\tret = vfs_read",
               "\t\tloff_t pos = file_pos_read(f.file);\n#ifdef CONFIG_KSU\n\t\tksu_handle_vfs_read(&f.file, &buf, &count, &pos);\n#endif\n\t\tret = vfs_read")
          edit("fs/stat.c",
               "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n",
               "#ifdef CONFIG_KSU\n__attribute__((hot))\nextern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);\n#endif\n\n#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n")
          edit("fs/stat.c",
               "\tstruct kstat stat;\n\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
               "\tstruct kstat stat;\n\tint error;\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          edit("fs/stat.c",
               "\tstruct kstat stat;\n\tint error;\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);",
               "\tstruct kstat stat;\n\tint error;\n#ifdef CONFIG_KSU\n\tksu_handle_stat(&dfd, &filename, &flag);\n#endif\n\n\terror = vfs_fstatat(dfd, filename, &stat, flag);")
          edit("kernel/reboot.c",
               "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n",
               "#ifdef CONFIG_KSU\nextern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd, void __user **arg);\n#endif\n\nSYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n")
          edit("kernel/reboot.c",
               "\tchar buffer[256];\n\tint ret = 0;\n\n\t/* We only trust",
               "\tchar buffer[256];\n\tint ret = 0;\n#ifdef CONFIG_KSU\n\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n#endif\n\n\t/* We only trust")
          PY
          grep -R --line-number 'ksu_handle_' fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c

      - name: Import and patch SUSFS for kernel 4.9
        run: |
          set -euo pipefail
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h
          patch --batch --fuzz=0 -p1 < susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          grep -qx 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' fs/Makefile

      - name: Download LLVM 22
        run: |
          set -euo pipefail
          mkdir -p toolchains/llvm
          aria2c --allow-overwrite=true --file-allocation=none --max-tries=5 --out=llvm.tar.xz https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz
          tar -xJf llvm.tar.xz -C toolchains/llvm --strip-components=1
          test -x toolchains/llvm/bin/clang
          test -x toolchains/llvm/bin/ld.lld

      - name: Build variants
        run: |
          set -euo pipefail
          export PATH="$PWD/toolchains/llvm/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          mkdir -p artifacts out
          for variant in "${BUILD_VARIANTS//,/ }"; do
            case "$variant" in star2lte|starlte|crownlte) ;; *) exit 2;; esac
            out_dir="out/$variant"
            make O="$out_dir" ARCH="$ARCH" "exynos9810-${variant}_defconfig"
            scripts/config --file "$out_dir/.config" -e KSU -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME
            make O="$out_dir" ARCH="$ARCH" olddefconfig
            for symbol in KSU KSU_MANUAL_HOOK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_SPOOF_UNAME; do grep -qx "CONFIG_$symbol=y" "$out_dir/.config"; done
            ! grep -qx CONFIG_KSU_KPROBES_HOOK=y "$out_dir/.config"
            make -j"$(nproc)" O="$out_dir" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" Image.gz dtbs
            test -s "$out_dir/arch/arm64/boot/Image.gz"
            nm "$out_dir/vmlinux" > "artifacts/vmlinux-symbols-$variant.txt"
            grep -q '[[:space:]]ksu_handle_execveat$' "artifacts/vmlinux-symbols-$variant.txt"
            grep -q '[[:space:]]susfs_init$' "artifacts/vmlinux-symbols-$variant.txt"
            cp "$out_dir/arch/arm64/boot/Image.gz" "out/Image.gz-$variant"
          done

      - name: Package AnyKernel3
        run: |
          set -euo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          if [[ "${UPLOAD_DTBS:-false}" == true ]]; then
            git clone --depth=1 https://github.com/rajatgupta1998/android_tools_system_dtbTool.git dtbTool
            gcc -O2 "$(find dtbTool -name dtbtool.c -print -quit)" -o dtbTool-bin
            for variant in "${BUILD_VARIANTS//,/ }"; do
              out_dir="out/$variant"
              mapfile -t dtbs < <(find "$out_dir/arch/arm64/boot/dts/exynos" -name '*.dtb' -print | sort)
              (( ${#dtbs[@]} > 0 ))
              ./dtbTool-bin -s 2048 -o "out/dtb-$variant.img" -p "$out_dir/scripts/dtc/" "${dtbs[@]}"
              test -s "out/dtb-$variant.img"
            done
          fi
          mkdir packages
          for variant in "${BUILD_VARIANTS//,/ }"; do
            stage="packages/AnyKernel3-$variant"
            rsync -a --delete --exclude=.git anykernel3/ "$stage/"
            cp "out/Image.gz-$variant" "$stage/Image.gz"
            if [[ -s "out/dtb-$variant.img" ]]; then
              cp "out/dtb-$variant.img" "$stage/dtb.img"
            fi
            (cd "$stage" && zip -qr9 "../Chimera-KSUN-SUSFS${LOCALVERSION}-$variant.zip" .)
            rm -rf "$stage"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Chimera-KSUN-SUSFS-${{ github.run_number }}
          path: |
            packages/*.zip
            out/Image.gz-*
            artifacts/vmlinux-symbols-*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Chimera-KSUN-SUSFS-diagnostics-${{ github.run_number }}
          path: |
            out/**/.config
            fs/exec.c
            fs/open.c
            fs/read_write.c
            fs/stat.c
            kernel/reboot.c
          if-no-files-found: ignore
