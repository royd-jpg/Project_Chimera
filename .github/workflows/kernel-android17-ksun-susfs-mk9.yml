name: Kernel — Android 17 (KSUN + SUSFS) — Exynos9810

on:
  push:
    branches:
      - lineage-24.0
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "kernel/**"
      - "include/**"
      - ".github/workflows/kernel-android17-ksun-susfs.yml"
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain: llvm22/llvm21/llvm20/aosp22/aosp21/aosp20/aosp19/neutron19/neutron23/neutron24/zyc_stable"
        required: true
        type: string
        default: "llvm22"

      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false

      localversion:
        description: "LOCALVERSION suffix (must start with '-')"
        required: true
        type: string
        default: "-Chimera_Mk9"

      build_user:
        description: "KBUILD_BUILD_USER"
        required: true
        type: string
        default: "MTRXX"

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "CM9XNNNN"

      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        required: false
        type: string
        default: "1"

      build_timestamp:
        description: "KBUILD_BUILD_TIMESTAMP (e.g. 'Wed Aug 19 03:26:19 UTC 2026')"
        required: true
        type: string
        default: "Wed Aug 19 03:26:19 UTC 2026"

      build_variants:
        description: "Device variants to build (comma-separated)"
        required: true
        type: string
        default: "star2lte,starlte,crownlte"

      upload_dtbs:
        description: "Upload separate DTB files"
        required: false
        type: boolean
        default: true

      enable_lto:
        description: "Enable Link-Time Optimization"
        required: false
        type: boolean
        default: false

      extra_cflags:
        description: "Extra CFLAGS (space-separated)"
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.toolchain }}-${{ inputs.localversion }}
  cancel-in-progress: true

env:
  KERNEL_DIR: "."
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  ANYKERNEL_DIR: "anykernel3"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"
  ANYKERNEL3_BRANCH: "main"
  DTBTOOL_REPO: "https://github.com/rajatgupta1998/android_tools_system_dtbTool.git"

  CCACHE_MAXSIZE: "3G"
  KERNEL_VERSION: "4.9.337"

  LOCALVERSION: ${{ inputs.localversion }}
  KBUILD_BUILD_USER: ${{ inputs.build_user }}
  KBUILD_BUILD_HOST: ${{ inputs.build_host }}
  KBUILD_BUILD_VERSION: ${{ inputs.build_version }}
  KBUILD_BUILD_TIMESTAMP: ${{ inputs.build_timestamp }}

jobs:
  build:
    name: Build — ${{ inputs.toolchain }} / ${{ inputs.localversion }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:
      - name: Validate workflow inputs
        run: |
          set -euo pipefail
          echo "::group::Validating workflow inputs"
          FAIL=0

          if [[ "${{ inputs.localversion }}" != -* ]]; then
            echo "::error::localversion must start with '-', got '${{ inputs.localversion }}'"
            FAIL=1
          fi

          if [[ -z "${{ inputs.build_timestamp }}" ]]; then
            echo "::error::build_timestamp must not be empty"
            FAIL=1
          fi

          if [[ -z "${{ inputs.build_variants }}" ]]; then
            echo "::error::build_variants must not be empty"
            FAIL=1
          fi

          echo "::endgroup::"
          if [[ "$FAIL" -ne 0 ]]; then
            echo "::error::Input validation failed"
            exit 1
          fi
          echo "PASS: all workflow_dispatch inputs valid"

      - name: Checkout kernel source (Project_Chimera)
        uses: actions/checkout@v4
        with:
          path: "."
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          set -euo pipefail
          echo "::group::Installing build dependencies"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex git gnupg gperf \
            libssl-dev libtinfo5 lzop ncurses-dev openssl \
            python3 python3-pip rsync wget zip zlib1g-dev \
            libelf1 libfdt1 libffi7 libstdc++6 \
            device-tree-compiler aria2 zstd
          echo "::endgroup::"

      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -euo pipefail
          echo "::group::Resolving toolchain configuration"
          TOOLCHAIN="${{ inputs.toolchain }}"
          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""

          case "$TOOLCHAIN" in
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz"
              TC_CACHE_KEY="aosp-clang-r536225-ubuntu-24.04-v2"
              ;;
            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;
            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;
            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            llvm20)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="korg-clang-20.1.8-ubuntu-24.04-v1"
              ;;
            llvm21)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-21.1.0-ubuntu-24.04-v1"
              ;;
            llvm22)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-22.1.7-ubuntu-24.04-v1"
              ;;
            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;
            neutron23)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30062026-ubuntu-24.04-v2"
              ;;
            neutron24)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30072026-ubuntu-24.04-v2"
              ;;
            zyc_stable)
              TC_URL=$(curl -fsSL "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" 2>/dev/null || true)
              if [[ -n "$TC_URL" ]]; then
                TC_CACHE_KEY="zyc-clang-ubuntu-24.04-$(printf '%s' "$TC_URL" | sha256sum | cut -c1-16)"
              else
                TC_CACHE_KEY="zyc-clang-ubuntu-24.04-lookup-failed"
                echo "::warning::zyc_stable URL lookup failed, cache key will not be unique"
              fi
              ;;
            *)
              echo "::error::Unsupported toolchain '$TOOLCHAIN'"
              exit 1
              ;;
          esac

          echo "TC_URL=$TC_URL" >> "$GITHUB_ENV"
          echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT" >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=$TC_CACHE_KEY" >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=$TC_CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "Toolchain resolved: $TOOLCHAIN -> $TC_CACHE_KEY"
          echo "::endgroup::"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: "${{ env.TC_CACHE_KEY }}"
          restore-keys: |
            ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "::group::Downloading toolchain"
          rm -rf toolchains/clang
          mkdir -p toolchains/clang

          ARCHIVE="/tmp/clang_archive"
          if [[ -z "${{ env.TC_URL }}" ]]; then
            echo "::error::TC_URL is empty (zyc_stable lookup may have failed)"
            exit 1
          fi

          aria2c -x 16 -s 16 -k 1M -c \
            --max-tries=5 \
            --retry-wait=5 \
            --timeout=60 \
            --dir="/tmp" \
            --out="clang_archive" \
            "${{ env.TC_URL }}"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "::error::aria2c download failed or archive is empty"
            exit 1
          fi

          case "${{ env.TC_ARCHIVE_FMT }}" in
            tar.gz|tar)
              tar -C toolchains/clang -xzf "$ARCHIVE" --strip-components=1
              ;;
            tar.xz)
              tar -C toolchains/clang -xJf "$ARCHIVE" --strip-components=1
              ;;
            tar.zst)
              zstd -d "$ARCHIVE" -o /tmp/clang.tar --force
              tar -C toolchains/clang -xf /tmp/clang.tar --strip-components=1
              ;;
            *)
              echo "::error::Unrecognized TC_ARCHIVE_FMT '${{ env.TC_ARCHIVE_FMT }}'"
              exit 1
              ;;
          esac

          if [[ -z "$(find toolchains/clang -type f -print -quit)" ]]; then
            echo "::error::Extraction succeeded but toolchains/clang is empty"
            exit 1
          fi
          echo "Toolchain extracted: $(find toolchains/clang -type f | wc -l) file(s)"
          echo "::endgroup::"

      - name: Configure toolchain PATH
        run: |
          set -euo pipefail
          echo "::group::Configuring toolchain PATH"
          ACTUAL_BIN=$(find toolchains/clang -type d -name "bin" -printf "%d\t%p\n" | sort -n | cut -f2 | head -n 1)
          if [[ -z "$ACTUAL_BIN" || ! -d "$ACTUAL_BIN" ]]; then
            echo "::error::Could not find 'bin' directory in toolchains/clang"
            exit 1
          fi
          echo "Found toolchain bin: $ACTUAL_BIN"
          chmod +x "$ACTUAL_BIN"/* 2>/dev/null || true
          echo "$ACTUAL_BIN" >> "$GITHUB_PATH"
          echo "::endgroup::"

      - name: Verify toolchain and capture compiler identity
        run: |
          set -euo pipefail
          echo "::group::Verifying toolchain binaries"
          for bin in clang llvm-nm llvm-objdump llvm-ar llvm-objcopy llvm-strip ld.lld; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              echo "::error::Required toolchain binary '$bin' not found in PATH"
              exit 1
            fi
          done

          CLANG_VERSION="$(clang --version | head -1)"
          LLD_VERSION="$(ld.lld --version | head -1)"
          echo "Clang: $CLANG_VERSION"
          echo "LLD:  $LLD_VERSION"

          if [[ -z "$CLANG_VERSION" ]]; then
            echo "::error::clang --version produced no output"
            exit 1
          fi

          TC_IDENTITY_HASH="$(printf '%s\n%s\n' "$CLANG_VERSION" "$LLD_VERSION" | sha256sum | cut -d' ' -f1 | head -c 16)"
          echo "CLANG_VERSION=$CLANG_VERSION" >> "$GITHUB_ENV"
          echo "TC_IDENTITY_HASH=$TC_IDENTITY_HASH" >> "$GITHUB_ENV"

          mkdir -p logs
          {
            echo "$CLANG_VERSION"
            echo "$LLD_VERSION"
          } > logs/toolchain-identity.txt
          echo "::endgroup::"

      - name: Configure defconfigs for KSUN (manual hook)
        run: |
          set -euo pipefail
          echo "::group::Configuring defconfigs"
          for cfg in arch/arm64/configs/exynos9810-star2lte_defconfig \
                   arch/arm64/configs/exynos9810-starlte_defconfig \
                   arch/arm64/configs/exynos9810-crownlte_defconfig; do
            if [[ ! -f "$cfg" ]]; then
              echo "::warning::$cfg not found, skipping"
              continue
            fi
            {
              echo "# KernelSU-Next (manual hook)"
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
              echo "CONFIG_KSU_KPROBES_HOOK=n"
              echo "CONFIG_KPROBES=n"
              echo "CONFIG_HAVE_KPROBES=n"
              echo "CONFIG_KPROBE_EVENTS=n"
              echo "CONFIG_KSU_SUSFS=n"
            } >> "$cfg"
          done
          echo "::endgroup::"

      - name: Clone AnyKernel3
        run: |
          set -euo pipefail
          echo "::group::Cloning AnyKernel3"
          git clone --depth=1 --branch "${{ env.ANYKERNEL3_BRANCH }}" "${{ env.ANYKERNEL_REPO }}" anykernel3
          echo "::endgroup::"

      - name: Clone dtbTool (Exynos)
        run: |
          set -euo pipefail
          echo "::group::Cloning dtbTool"
          git clone --depth=1 "${{ env.DTBTOOL_REPO }}" dtbTool
          cd dtbTool
          gcc dtbTool/source/dtbtool.c -o dtbTool
          mv dtbTool dtbTool-bin
          chmod +x dtbTool-bin
          cd ..
          rm -rf dtbTool
          echo "::endgroup::"

      - name: Build kernel and DTBs (all variants)
        id: build
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "::group::Building kernel"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-none-linux-gnu-
          export CC=clang
          export CLANG_TRIPLE=aarch64-none-linux-gnu-
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          if [[ "${{ inputs.enable_lto }}" == "true" ]]; then
            export CFLAGS="${{ inputs.extra_cflags }} -flto"
          else
            export CFLAGS="${{ inputs.extra_cflags }}"
          fi

          mkdir -p kernel-out
          IFS=',' read -ra VAR_ARRAY <<< "${{ inputs.build_variants }}"
          for defconfig in "${VAR_ARRAY[@]/#/exynos9810-}"; do
            defconfig="${defconfig}_defconfig"
            echo "Building $defconfig..."
            make O=kernel-out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" "$defconfig"
            make -j"$(nproc)" O=kernel-out ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" CC="$CC" CLANG_TRIPLE="$CLANG_TRIPLE" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" $CFLAGS
            cp kernel-out/arch/arm64/boot/Image.gz-dtb "kernel-out/Image.gz-dtb.${defconfig%.defconfig}"
          done
          echo "variants=${VAR_ARRAY[*]}" >> "$GITHUB_OUTPUT"
          echo "::endgroup::"

      - name: Build dtb.img (Exynos dtbTool)
        if: inputs.dry_run != true && inputs.upload_dtbs == true
        run: |
          set -euo pipefail
          echo "::group::Building dtb.img"
          export ARCH=arm64
          export OUT_DIR=kernel-out
          mkdir -p "$OUT_DIR/arch/$ARCH/boot"
          DTBTOOL="./dtbTool-bin"
          if [[ ! -x "$DTBTOOL" ]]; then
            echo "::error::dtbTool not found at $DTBTOOL"
            exit 1
          fi
          "$DTBTOOL" \
            -s 2048 \
            -o "$OUT_DIR/arch/$ARCH/boot/dtb.img" \
            -p "$OUT_DIR/scripts/dtc/" \
            "$OUT_DIR/arch/$ARCH/boot/dts/exynos"/*.dtb 2>/dev/null || {
              echo "::warning::dtbTool failed, dtb.img may be incomplete"
            }
          cp "$OUT_DIR/arch/$ARCH/boot/dtb.img" "$OUT_DIR/dtb.img" 2>/dev/null || true
          echo "::endgroup::"

      - name: Package with AnyKernel3 (per variant)
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "::group::Packaging AnyKernel3 ZIPs"
          CLANG_VER="${{ env.CLANG_VERSION }}"
          IFS=',' read -ra VAR_ARRAY <<< "${{ inputs.build_variants }}"
          for variant in "${VAR_ARRAY[@]}"; do
            mkdir -p "ak3-$variant"
            cp -r anykernel3/* "ak3-$variant/"
            cp "kernel-out/Image.gz-dtb.$variant" "ak3-$variant/Image.gz-dtb"
            if [[ "${{ inputs.upload_dtbs }}" == "true" ]]; then
              cp "kernel-out/dtb.img" "ak3-$variant/dtb.img" 2>/dev/null || true
            fi
            cd "ak3-$variant"
            zip -r9 "../AnyKernel3-KSUN-clang${CLANG_VER}-${{ inputs.localversion }}-$variant.zip" .
            cd ..
            rm -rf "ak3-$variant"
          done
          echo "::endgroup::"

      - name: Upload artifacts
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: kernels-${{ inputs.toolchain }}-${{ inputs.localversion }}
          path: |
            AnyKernel3-KSUN-*.zip
            kernel-out/Image.gz-dtb.*
            kernel-out/dtb.img
          retention-days: 14
          if-no-files-found: warn

      - name: Create release
        if: inputs.do_release == true && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AnyKernel3-KSUN-*.zip
          body: |
            **Exynos9810 — Linux 4.9.337 — KSUN (manual hook)**

            - Repo: royd-jpg/Project_Chimera (lineage-24.0)
            - Toolchain: ${{ inputs.toolchain }} (${{ env.CLANG_VERSION }})
            - Localversion: ${{ inputs.localversion }}
            - Build: ${{ inputs.build_user }}@${{ inputs.build_host }} #${{ inputs.build_version }}
            - Timestamp: ${{ inputs.build_timestamp }}
            - Variants: ${{ steps.build.outputs.variants }}
            - DTB: ${{ inputs.upload_dtbs == true && 'included' || 'not included' }}
            - LTO: ${{ inputs.enable_lto == true && 'enabled' || 'disabled' }}
            - Extra CFLAGS: `${{ inputs.extra_cflags || 'none' }}`

            ⚠️ Test on physical devices before flashing.
