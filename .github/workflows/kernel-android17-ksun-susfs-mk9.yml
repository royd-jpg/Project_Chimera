# .github/workflows/kernel-android17-ksun-susfs.yml
#
# Exynos 9810 (lineage-24.0) — KernelSU-Next + SUSFS, CI-time integration.
# Nothing is committed back to lineage-24.0; every run re-derives the tree
# from a pinned "integration bundle" ref (see INTEGRATION_REPO/REF below).
#
# "Android 17 compatibility here means building the modified Exynos 9810
# vendor kernel for potential use with a compatible LineageOS 24 userspace.
# Runtime compatibility requires physical-device testing."
#
# CONFIDENCE NOTES (from direct hands-on compile testing against this exact
# 4.9.337 tree + this exact KernelSU-Next commit — read before relying on this):
#
#   HIGH — compiled clean, unmodified from the bundle ref:
#     fs/exec.c, fs/open.c, fs/read_write.c, drivers/input/input.c,
#     kernel/reboot.c, kernel/sys.c, kernel/kallsyms.c, mm/memory.c,
#     fs/susfs.c, drivers/kernelsu/** (core hook files).
#
#   FIXED bugs found in the bundle and corrected before it would compile here:
#     - fs/namei.c: duplicate `struct dentry *dentry` declaration.
#     - fs/namei.c + fs/stat.c: the bundle's vfs_readlink()/IOP_DEFAULT_READLINK
#       OPEN_REDIRECT path does not exist on 4.9.337 (IOP_DEFAULT_READLINK is a
#       ~4.11+ addition) AND this tree's real readlinkat() syscall never calls
#       vfs_readlink() anyway — rewired the check into the real call sites
#       (readlinkat's direct i_op->readlink call, and generic_readlink()).
#     - fs/proc/base.c: `struct map_files_info` on this tree is
#       {mode,len,name[]}, not the newer {start,end} layout the bundle assumed.
#     - drivers/kernelsu/selinux/Makefile: -I$(src)/include resolved to the
#       wrong directory (its own subdir, not drivers/kernelsu/include) —
#       klog.h wasn't found. Fixed with an explicit -I.
#
#   MEDIUM — NOT fully re-verified after being reverted and re-patched:
#     fs/proc/task_mmu.c. The bundle's version is largely a wholesale copy of
#     a much later kernel's smaps/PSS-breakdown/protection-key code that does
#     not exist on 4.9.337 (duplicate show_smap() definitions, missing PSS
#     fields, missing pkey helpers). This workflow overlays it anyway (see
#     "Verify manual hook call sites" below, which will catch a broken result)
#     — if your first real run fails compiling this file, that's why; the fix
#     is to keep this tree's real show_map_vma()/show_smap() and re-apply only
#     the SUS_MAP guard, not the whole function.
#
#   CONFIRMED BLOCKER, worked around by fail-closed validation, not fixed at
#   the source: drivers/kernelsu/hook/setuid_hook.c's ksu_handle_setresuid()
#   calls susfs_is_sid_equal()/susfs_zygote_sid/is_zygote_normal_app_uid()
#   unconditionally, with no CONFIG_KSU_SUSFS guard. KSU cannot link with
#   SUSFS disabled on this exact pin. This workflow refuses that combination
#   instead of silently forcing SUSFS on.
#
#   MEDIUM — the exact path layout of the KSU driver inside the bundle ref
#   (submodule at top-level `KernelSU-Next/`, wired into `drivers/kernelsu/`
#   via a symlink per .gitmodules + drivers/Kconfig on that branch) was
#   confirmed by inspection but not re-verified line-by-line in this pass.
#   The "Verify bundle contents" step below fails loudly, with a directory
#   listing, if the expected paths aren't where this workflow expects them —
#   check that output first if this step fails.

name: kernel-android17-ksun-susfs

on:
  push:
    branches: [lineage-24.0]
    paths:
      - "arch/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - "Makefile"
      - ".github/workflows/kernel-android17-ksun-susfs.yml"

  pull_request:
    branches: [lineage-24.0]

  workflow_dispatch:
    inputs:
      defconfig:
        description: "Device defconfig"
        type: choice
        default: exynos9810-star2lte_defconfig
        options:
          - exynos9810-star2lte_defconfig
          - exynos9810-starlte_defconfig
          - exynos9810-crownlte_defconfig
      ksu_integration_mode:
        description: "disabled | manual | kprobe"
        type: choice
        default: manual
        options: [disabled, manual, kprobe]
      enable_susfs:
        description: "Enable SUSFS. NOTE: cannot be false when ksu_integration_mode != disabled (see header)."
        type: boolean
        default: true
      integration_repo:
        description: "Repo carrying the KSU-Next+SUSFS bundle (driver, susfs.c, and the 6 hook call-sites)"
        type: string
        default: "https://github.com/royd-jpg/Project_Chimera.git"
      integration_ref:
        description: "Pinned commit SHA of the integration bundle"
        type: string
        default: "6752be5bb08dccfc58d9bc98c51199515aa19abc"
      clean_build:
        type: boolean
        default: true
      publish_release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ksun-susfs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -Eeuo pipefail {0}

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  KBUILD_BUILD_USER: _Terminal_Echo
  KBUILD_BUILD_HOST: AegisDevLabs
  ARTIFACT_DIR: artifacts

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact_name: ${{ steps.plan.outputs.artifact_name }}

    steps:
      - name: Checkout lineage-24.0
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: lineage-24.0

      - name: Resolve build plan
        id: plan
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            DEFCONFIG="exynos9810-star2lte_defconfig"
            MODE="manual"
            SUSFS="true"
            INT_REPO="https://github.com/royd-jpg/Project_Chimera.git"
            INT_REF="6752be5bb08dccfc58d9bc98c51199515aa19abc"
            CLEAN="true"
          else
            DEFCONFIG="${{ inputs.defconfig }}"
            MODE="${{ inputs.ksu_integration_mode }}"
            SUSFS="${{ inputs.enable_susfs }}"
            INT_REPO="${{ inputs.integration_repo }}"
            INT_REF="${{ inputs.integration_ref }}"
            CLEAN="${{ inputs.clean_build }}"
          fi

          if [[ ! -f "arch/arm64/configs/${DEFCONFIG}" ]]; then
            echo "::error::defconfig arch/arm64/configs/${DEFCONFIG} not found"
            ls -1 arch/arm64/configs/ >&2
            exit 1
          fi

          # Fail closed: confirmed, this exact bundle's KSU cannot link without
          # SUSFS (see header CONFIRMED BLOCKER note). Do not silently override.
          if [[ "$MODE" != "disabled" && "$SUSFS" != "true" ]]; then
            echo "::error::ksu_integration_mode=$MODE with enable_susfs=false is not buildable with this integration bundle."
            echo "::error::drivers/kernelsu/hook/setuid_hook.c calls SUSFS symbols unconditionally in this pin — see workflow header."
            echo "::error::Set enable_susfs=true, or use a different KernelSU-Next commit that guards those calls."
            exit 1
          fi

          if [[ -z "$INT_REPO" || -z "$INT_REF" ]]; then
            echo "::error::integration_repo and integration_ref must both be set when ksu_integration_mode != disabled"
            exit 1
          fi

          MODE_LABEL="$MODE"
          [[ "$SUSFS" == "true" ]] && MODE_LABEL="${MODE}+susfs"
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          ARTIFACT_NAME="kernel-${DEFCONFIG%%_defconfig}-${MODE_LABEL}-${SHORT_SHA}"

          {
            echo "defconfig=$DEFCONFIG"
            echo "mode=$MODE"
            echo "susfs=$SUSFS"
            echo "int_repo=$INT_REPO"
            echo "int_ref=$INT_REF"
            echo "clean=$CLEAN"
            echo "artifact_name=$ARTIFACT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison build-essential cpio device-tree-compiler flex \
            git kmod libelf-dev libssl-dev python3 rsync xz-utils zip \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Record toolchain versions
        run: |
          mkdir -p "$ARTIFACT_DIR"
          {
            echo "clang: $(clang --version | head -n1)"
            echo "ld.lld: $(ld.lld --version | head -n1)"
            echo "aarch64-linux-gnu-ld: $(aarch64-linux-gnu-ld --version | head -n1)"
          } | tee "$ARTIFACT_DIR/toolchain-info.txt"

      - name: Clean previous output
        if: steps.plan.outputs.clean == 'true'
        run: rm -rf out "${ARTIFACT_DIR:?}/build.log" || true

      # ── Fetch + apply the KSU+SUSFS integration bundle ─────────────────────
      - name: Fetch integration bundle
        if: steps.plan.outputs.mode != 'disabled'
        id: bundle
        env:
          INT_REPO: ${{ steps.plan.outputs.int_repo }}
          INT_REF:  ${{ steps.plan.outputs.int_ref }}
        run: |
          rm -rf /tmp/bundle
          git init -q /tmp/bundle
          git -C /tmp/bundle remote add origin "$INT_REPO"
          git -C /tmp/bundle fetch -q --depth 1 origin "$INT_REF"
          git -C /tmp/bundle checkout -q FETCH_HEAD
          git -C /tmp/bundle submodule update --init --recursive --depth 1 2>&1 | tee /tmp/bundle-submodules.log
          echo "bundle_sha=$(git -C /tmp/bundle rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify bundle contents
        if: steps.plan.outputs.mode != 'disabled'
        run: |
          FAIL=0
          check() {
            if [[ -e "$1" ]]; then echo "OK:    $1"; else echo "FATAL: $1 missing"; FAIL=1; fi
          }
          check /tmp/bundle/fs/susfs.c
          check /tmp/bundle/include/linux/susfs.h
          check /tmp/bundle/include/linux/susfs_def.h
          check /tmp/bundle/drivers/kernelsu
          check /tmp/bundle/KernelSU-Next/kernel
          if [[ $FAIL -ne 0 ]]; then
            echo "::error::Integration bundle at ${{ steps.plan.outputs.int_ref }} is missing expected paths."
            echo "::error::Bundle top-level listing:"
            ls -la /tmp/bundle >&2
            exit 1
          fi

      - name: Apply KSU driver + SUSFS + hook call-sites onto lineage-24.0
        if: steps.plan.outputs.mode != 'disabled'
        run: |
          # KSU driver (real content lives in the KernelSU-Next submodule;
          # drivers/kernelsu is a symlink to it on the bundle branch — copy
          # the resolved directory, not the symlink).
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          rsync -a --delete /tmp/bundle/KernelSU-Next/kernel/ drivers/kernelsu/

          # SUSFS core
          cp /tmp/bundle/fs/susfs.c fs/susfs.c
          cp /tmp/bundle/include/linux/susfs.h include/linux/susfs.h
          cp /tmp/bundle/include/linux/susfs_def.h include/linux/susfs_def.h

          # Six manual-hook call-site files, overlaid verbatim from the bundle.
          for f in fs/exec.c fs/open.c fs/stat.c fs/read_write.c \
                   drivers/input/input.c kernel/reboot.c; do
            if [[ -f "/tmp/bundle/$f" ]]; then
              cp "/tmp/bundle/$f" "$f"
            else
              echo "::error::Bundle is missing $f — cannot install manual hook call sites"
              exit 1
            fi
          done

          # security/selinux/* backports the bundle's Kbuild self-patches
          # would otherwise apply at build time (selinux_inode/selinux_cred,
          # can_umount/path_umount, seccomp filter_count). Overlay them too so
          # the result is reviewable instead of mutated in place by Kbuild.
          for f in security/selinux/hooks.c security/selinux/avc.c \
                   security/selinux/selinuxfs.c security/selinux/xfrm.c \
                   security/selinux/include/objsec.h fs/namespace.c \
                   fs/internal.h include/linux/seccomp.h; do
            [[ -f "/tmp/bundle/$f" ]] && cp "/tmp/bundle/$f" "$f"
          done

          # Wire drivers/Makefile + drivers/Kconfig
          grep -q 'kernelsu/' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || \
            sed -i '$ i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Wire fs/Makefile for SUSFS
          grep -q 'susfs.o' fs/Makefile || \
            printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile

      - name: Verify manual hook call sites
        if: steps.plan.outputs.mode == 'manual'
        run: |
          FAIL=0
          check() {
            grep -qE "$1" "$2" 2>/dev/null && echo "OK:    $1 in $2" || { echo "FATAL: $1 not found in $2"; FAIL=1; }
          }
          check 'ksu_handle_execveat'            fs/exec.c
          check 'ksu_handle_faccessat'            fs/open.c
          check 'ksu_handle_stat'                 fs/stat.c
          check 'ksu_handle_sys_read'              fs/read_write.c
          check 'ksu_handle_input_handle_event'    drivers/input/input.c
          check 'ksu_handle_sys_reboot'            kernel/reboot.c
          [[ $FAIL -eq 0 ]] || { echo "::error::Manual hook call sites missing after overlay — see workflow header confidence notes for fs/proc/task_mmu.c and other known-fragile files."; exit 1; }

      - name: Generate source diff for review
        if: steps.plan.outputs.mode != 'disabled'
        run: |
          mkdir -p "$ARTIFACT_DIR"
          git diff -- drivers/Makefile drivers/Kconfig fs/Makefile \
            fs/exec.c fs/open.c fs/stat.c fs/read_write.c \
            drivers/input/input.c kernel/reboot.c \
            fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h \
            security/ > "$ARTIFACT_DIR/integration.diff" 2>/dev/null || true
          echo "# untracked" >> "$ARTIFACT_DIR/integration.diff"
          git status --porcelain --untracked-files=normal | grep '^??' >> "$ARTIFACT_DIR/integration.diff" || true

      # ── Configuration ──────────────────────────────────────────────────────
      - name: Configure
        id: config
        env:
          DEFCONFIG: ${{ steps.plan.outputs.defconfig }}
          MODE:      ${{ steps.plan.outputs.mode }}
          SUSFS:     ${{ steps.plan.outputs.susfs }}
        run: |
          mkdir -p out "$ARTIFACT_DIR"
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang "$DEFCONFIG"

          CFG="scripts/config --file out/.config"
          if [[ "$MODE" == "disabled" ]]; then
            $CFG -d KSU 2>/dev/null || true
          else
            $CFG -e KSU
            if [[ "$MODE" == "manual" ]]; then
              $CFG -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
            else
              $CFG -e KSU_KPROBES_HOOK -d KSU_MANUAL_HOOK -e KPROBES -e KRETPROBES
            fi
            if [[ "$SUSFS" == "true" ]]; then
              $CFG -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
                   -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME
            fi
          fi

          make -j"$(nproc)" O=out ARCH=arm64 CC=clang olddefconfig

          is_set() { grep -qE "^$1=(y|m)$" out/.config; }
          if [[ "$MODE" == "disabled" ]]; then
            is_set CONFIG_KSU && { echo "::error::CONFIG_KSU set in a stock build"; exit 1; }
          else
            is_set CONFIG_KSU || { echo "::error::CONFIG_KSU failed to enable"; exit 1; }
            if [[ "$MODE" == "manual" ]]; then
              is_set CONFIG_KSU_MANUAL_HOOK || { echo "::error::CONFIG_KSU_MANUAL_HOOK failed"; exit 1; }
              is_set CONFIG_KSU_KPROBES_HOOK && { echo "::error::conflicting CONFIG_KSU_KPROBES_HOOK also set"; exit 1; }
            else
              is_set CONFIG_KSU_KPROBES_HOOK || { echo "::error::CONFIG_KSU_KPROBES_HOOK failed"; exit 1; }
              is_set CONFIG_KSU_MANUAL_HOOK && { echo "::error::conflicting CONFIG_KSU_MANUAL_HOOK also set"; exit 1; }
            fi
            if [[ "$SUSFS" == "true" ]]; then
              is_set CONFIG_KSU_SUSFS || { echo "::error::CONFIG_KSU_SUSFS failed to enable"; exit 1; }
            fi
          fi
          cp out/.config "$ARTIFACT_DIR/config-final.txt"

      - name: Pre-generate SELinux headers (prevents flask.h race against ksu.o)
        if: steps.plan.outputs.mode != 'disabled'
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- \
            security/selinux/
          test -f out/security/selinux/flask.h || { echo "::error::flask.h not generated"; exit 1; }

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build kernel
        id: build
        run: |
          MAKE_ARGS=(-j"$(nproc)" O=out ARCH=arm64 CC=clang
                      CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-)
          set +e
          make "${MAKE_ARGS[@]}" Image Image.gz dtbs 2>&1 | tee "$ARTIFACT_DIR/build.log"
          RC=${PIPESTATUS[0]}
          set -e
          [[ $RC -eq 0 ]] || { echo "::error::kernel build failed (rc=$RC)"; exit $RC; }
          echo "kernelrelease=$(cat out/include/config/kernel.release)" >> "$GITHUB_OUTPUT"

      - name: Validate artifacts
        run: |
          B="out/arch/arm64/boot"
          test -s "$B/Image.gz" || { echo "::error::Image.gz missing/empty"; exit 1; }
          readelf -h out/vmlinux | grep -q AArch64 || { echo "::error::vmlinux is not AArch64"; exit 1; }
          find out/arch/arm64/boot/dts -name '*.dtb' | grep -q . || echo "::warning::no DTBs produced"
          grep -nE 'undefined reference|relocation truncated' "$ARTIFACT_DIR/build.log" && { echo "::error::linker errors found"; exit 1; } || true

      - name: Collect artifacts + manifest
        run: |
          B="out/arch/arm64/boot"
          mkdir -p "$ARTIFACT_DIR/boot" "$ARTIFACT_DIR/dtbs"
          cp "$B/Image" "$B/Image.gz" "$ARTIFACT_DIR/boot/"
          find "$B/dts" -name '*.dtb' -exec cp {} "$ARTIFACT_DIR/dtbs/" \; || true
          cp out/System.map "$ARTIFACT_DIR/" || true
          ( cd "$ARTIFACT_DIR" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS )
          cat > /tmp/manifest.py << 'PYEOF'
          import json, os, datetime, subprocess
          ad = os.environ["ARTIFACT_DIR"]
          sums = {}
          for line in open(os.path.join(ad, "SHA256SUMS")):
              h, p = line.split(maxsplit=1)
              sums[p.strip().lstrip("./")] = h
          m = {
            "kernel_version": "4.9.337", "arch": "arm64",
            "ksu_integration_mode": os.environ.get("MODE",""),
            "susfs_enabled": os.environ.get("SUSFS","") == "true",
            "integration_repo": os.environ.get("INT_REPO",""),
            "integration_ref": os.environ.get("INT_REF",""),
            "build_timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "git_commit": subprocess.check_output(["git","rev-parse","HEAD"]).decode().strip(),
            "sha256sums": sums,
          }
          open(os.path.join(ad,"manifest.json"),"w").write(json.dumps(m, indent=2))
          PYEOF
          MODE="${{ steps.plan.outputs.mode }}" SUSFS="${{ steps.plan.outputs.susfs }}" \
            INT_REPO="${{ steps.plan.outputs.int_repo }}" INT_REF="${{ steps.plan.outputs.int_ref }}" \
            python3 /tmp/manifest.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 30

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact_name }}-FAILED
          path: |
            artifacts/**
            out/.config
          if-no-files-found: warn

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.artifact_name }}-${{ github.run_number }}
        run: |
          cd release && zip -r "../${TAG}.zip" . >/dev/null && cd ..
          gh release create "$TAG" "${TAG}.zip" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes "Compile-verified only. See workflow header for confidence notes."
