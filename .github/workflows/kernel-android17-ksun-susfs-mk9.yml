# Kernel — Android 17 (KernelSU-Next + SUSFS) — Exynos 9810 — Mk9 (refactored)
#
# "Android 17 compatibility here means building the modified Exynos 9810
# vendor kernel for potential use with a compatible LineageOS 24 userspace.
# Runtime compatibility requires physical-device testing."
#
# ─────────────────────────────────────────────────────────────────────────
# WHAT CHANGED FROM THE PRIOR DRAFT (root cause of the reported failure)
#
# The prior "Apply manual-hook call-site patch" step embedded hand-written
# unified diffs with WRONG hunk-size headers. Reproduced and confirmed:
#   - fs/exec.c hunk claimed "-2074,10 +2074,16" (10 old / 16 new lines).
#     The actual new-side content is 10 context + 8 added = 18 lines, not
#     16. GNU patch counts forward from the header, desyncs 2 lines short,
#     and then chokes on the next real diff line thinking it should be a
#     new hunk header — exactly "malformed patch at line 20: +#endif".
#   - fs/open.c's hunk has the same class of bug (claimed 20 new lines,
#     actual 22).
#   - This is a STATIC bug in the patch text itself — it would fail against
#     a byte-perfect matching file too. The old step's own error message
#     ("these files have diverged from the LOS23.2 reference") is a
#     misdiagnosis baked into the script.
#
# FIX: the hand-rolled `patch -p1` step is replaced entirely with
# anchor-based text insertion (Python str.replace on verified, unique
# anchor strings). This sidesteps hunk-math entirely and fails loud with a
# clear assertion if an anchor is not found or not unique — no silent
# partial application, no line-count arithmetic to get wrong.
#
# ─────────────────────────────────────────────────────────────────────────
# ADDITIONAL FIXES FOUND BY HANDS-ON COMPILE/LINK TESTING AGAINST THIS
# EXACT PIN (gavdoc38/KernelSU-Next @ b3263c77975616d3c29d48aa600892263e7d75c9)
# ON THE REAL 4.9.337 TREE (not assumed — all six items below were caught by
# actually running clang against real object files in this exact
# configuration):
#
#   1. This repo has a SIBLING `uapi/` directory next to `kernel/` at its
#      root (`gavdoc38/KernelSU-Next/{kernel,uapi,manager,LICENSE}`). Only
#      vendoring `kernel/` into drivers/kernelsu/ breaks
#      `#include "uapi/app_profile.h"` (file not found). Fix: also rsync
#      the top-level `uapi/` into `drivers/kernelsu/uapi/`.
#
#   2. All 6 manual-hook call sites are genuinely required for this pin —
#      not optional extras. The driver's own Kbuild has a hard gate:
#      `HAVE_KSU_HOOK := $(shell grep -q "ksu_handle_sys_reboot"
#      $(srctree)/kernel/reboot.c ...)` — manual mode will not build at all
#      without the kernel/reboot.c hook specifically. Verified real
#      function signatures for all 6 hooks directly from source
#      (kernel/core/init.c, kernel/feature/sucompat.{c,h},
#      kernel/runtime/ksud_integration.c) rather than assuming the prior
#      draft's declarations were correct — they were, for exec/open/stat;
#      read_write.c and input.c/reboot.c hooks were added fresh here using
#      the pin's real signatures.
#
#   3. `CONFIG_KSU_SUSFS_SUS_MEMFD` defaults to `y` the instant
#      `CONFIG_KSU_SUSFS=y` is set (Kconfig: `depends on KSU_SUSFS /
#      default y`), and calls `susfs_add_sus_memfd()`. The SUSFS source
#      this workflow vendors (v2.2.0, from
#      royd-jpg/Project_Chimera@6752be5b) predates that function —
#      confirmed by compiling: "implicit declaration of function
#      'susfs_add_sus_memfd'". This is a genuine KSU/SUSFS version
#      mismatch, not a config-order bug. Fixed by explicitly disabling
#      CONFIG_KSU_SUSFS_SUS_MEMFD. If a newer SUSFS source with SUS_MEMFD
#      support is later adopted, this line can be dropped.
#
#   4. `fs/susfs.c` declares `extern bool susfs_is_avc_log_spoofing_enabled;`
#      and calls WRITE_ONCE() on it unconditionally (not gated behind any
#      SUS_* sub-option) — required the moment CONFIG_KSU_SUSFS=y, for any
#      feature combination. It is not defined anywhere in a clean
#      lineage-24.0 tree. Fixed by adding one `bool ... = false;` definition
#      to security/selinux/avc.c. NOTE (scope boundary, disclosed plainly):
#      only the variable definition is added here, not the AVC-audit
#      consumer logic that would make the log-spoofing feature actually do
#      something (the reference SUSFS branch wires it into
#      slow_avc_audit()'s tsid formatting). As shipped, the toggle exists,
#      defaults off, and is inert — it will not break anything, but log
#      spoofing itself is a documented no-op pending that follow-up.
#
#   5. `setup_selinux()` and `try_umount()` — both referenced as `extern`
#      by fs/susfs.c — were checked and confirmed to already resolve
#      correctly from inside the vendored KSU driver itself
#      (drivers/kernelsu/selinux/selinux.c and
#      drivers/kernelsu/feature/kernel_umount.c respectively). No action
#      needed; documented here so a future editor doesn't "fix" something
#      that isn't broken.
#
#   6. `susfs_ksu_sid` / `susfs_priv_app_sid` (referenced by
#      security/selinux/avc.c's own consumer logic, if that logic is later
#      added per item 4's note) are already defined in
#      drivers/kernelsu/selinux/selinux.c. No action needed.
#
# CONFIDENCE LEVEL, STATED PLAINLY:
#   - HIGH: all 6 hook call sites compile clean, individually and as part
#     of their real driver-directory builds (drivers/input/*, fs/*,
#     kernel/reboot.o) in this exact configuration.
#   - HIGH: the full KernelSU driver module (`drivers/kernelsu/`) compiles
#     AND LINKS clean as a standalone unit in BOTH manual+SUSFS-off and
#     manual+SUSFS-on configurations (confirmed via `make ... drivers/kernelsu/`
#     producing a clean built-in.o with the expected ksu_* symbol count).
#   - MEDIUM: a full `vmlinux` link (the entire kernel, not just the KSU
#     subtree) was started and progressed cleanly through hundreds of
#     unrelated driver objects (drivers/input/*, drivers/iommu/*, etc. all
#     compiled with zero errors) before the verification sandbox's resource
#     limits killed the background process — NOT a code failure, no error
#     was ever printed, just silent termination under memory/CPU pressure
#     in a constrained single-core container. The full link was not
#     completed end-to-end. This workflow's own "Verify vmlinux symbols"
#     step below is your first real confirmation of that — if it fails on
#     your first real run, the most likely place to look is something
#     downstream of drivers/iommu/ that this sandbox never reached.
#   - NOT verified: boot, root grant, SUSFS hide/spoof runtime behavior,
#     SELinux policy interaction, RKP/TIMA/DEFEX interaction (this defconfig
#     ships without those Samsung guards enabled, so nothing is disabled by
#     this integration, but nothing was tested against them either).
#
# kprobe mode may conflict with Samsung security / RKP / DEFEX on Exynos
# 9810. It is also NOT usable on this Linux 4.9.337 base at all: this
# fork's kprobe-hook path is not gated by a kernel-version #if, but its
# design (hooking via ftrace-based kretprobes on syscall entry) targets
# 5.10+ hook infrastructure per upstream's own documentation. Manual mode
# is therefore the only supported mode on this tree, and is treated as
# such throughout this workflow — kprobe is intentionally NOT offered as a
# toolchain input option below.

on:
  push:
    branches: [lineage-24.0]
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - ".github/workflows/kernel-android17-ksun-susfs-mk9.yml"
  pull_request:
    branches: [lineage-24.0]
    paths:
      - "arch/arm64/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "kernel/**"
      - "security/**"
      - ".github/workflows/kernel-android17-ksun-susfs-mk9.yml"
  workflow_dispatch:
    inputs:
      toolchain:
        description: "llvm22, llvm21, llvm20, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, or zyc_stable"
        type: string
        required: true
        default: llvm22
      enable_susfs:
        description: "Build with SUSFS on top of KernelSU-Next manual hooks (see header note [3]: SUS_MEMFD is force-disabled due to a confirmed KSU/SUSFS version mismatch)"
        type: boolean
        required: true
        default: true
      localversion:
        description: "Kernel localversion; must start with '-'"
        type: string
        required: true
        default: "-Chimera_Mk9"
      build_user:
        type: string
        required: true
        default: MTRXX
      build_host:
        type: string
        required: true
        default: CM9XNNNN
      build_version:
        type: string
        required: true
        default: "1"
      build_timestamp:
        type: string
        required: true
        default: "Wed Aug 19 03:26:19 UTC 2026"
      build_variants:
        description: "Comma-separated: star2lte,starlte,crownlte"
        type: string
        required: true
        default: "star2lte,starlte,crownlte"
      upload_dtbs:
        type: boolean
        required: true
        default: true
      enable_lto:
        type: boolean
        required: true
        default: false
      extra_cflags:
        type: string
        required: false
        default: ""
      ksu_repo:
        description: "KernelSU-Next fork repo (owner/repo)"
        type: string
        required: true
        default: "gavdoc38/KernelSU-Next"
      ksu_ref:
        description: "Full 40-hex commit SHA. Verified compatible with this exact tree by direct compile+link testing — see workflow header. Do NOT use a branch name."
        type: string
        required: true
        default: "b3263c77975616d3c29d48aa600892263e7d75c9"
      susfs_repo:
        description: "Source repo carrying fs/susfs.c + include/linux/susfs*.h (owner/repo)"
        type: string
        required: true
        default: "royd-jpg/Project_Chimera"
      susfs_ref:
        description: "SUSFS source ref/SHA (v2.2.0-era; see header note [3] on the SUS_MEMFD mismatch this implies)"
        type: string
        required: true
        default: "6752be5bb08dccfc58d9bc98c51199515aa19abc"
      dry_run:
        type: boolean
        required: true
        default: false
      do_release:
        type: boolean
        required: true
        default: false

permissions:
  contents: write

concurrency:
  group: kernel-exynos9810-${{ github.workflow }}-${{ github.ref }}-${{ inputs.toolchain || 'llvm22' }}
  cancel-in-progress: true

env:
  ARCH: arm64
  CCACHE_MAXSIZE: 3G
  KERNEL_VERSION: 4.9.337
  KBUILD_BUILD_USER: ${{ inputs.build_user || 'MTRXX' }}
  KBUILD_BUILD_HOST: ${{ inputs.build_host || 'CM9XNNNN' }}
  KBUILD_BUILD_VERSION: ${{ inputs.build_version || '1' }}
  KBUILD_BUILD_TIMESTAMP: ${{ inputs.build_timestamp || 'Wed Aug 19 03:26:19 UTC 2026' }}
  LOCALVERSION: ${{ inputs.localversion || '-Chimera_Mk9' }}
  BUILD_VARIANTS: ${{ inputs.build_variants || 'star2lte,starlte,crownlte' }}
  TOOLCHAIN: ${{ inputs.toolchain || 'llvm22' }}
  EXTRA_CFLAGS: ${{ inputs.extra_cflags || '' }}
  ENABLE_LTO: ${{ inputs.enable_lto || false }}
  UPLOAD_DTBS: ${{ inputs.upload_dtbs || false }}
  ENABLE_SUSFS: ${{ inputs.enable_susfs || true }}
  KSU_REPO: ${{ inputs.ksu_repo || 'gavdoc38/KernelSU-Next' }}
  KSU_REF: ${{ inputs.ksu_ref || 'b3263c77975616d3c29d48aa600892263e7d75c9' }}
  SUSFS_REPO: ${{ inputs.susfs_repo || 'royd-jpg/Project_Chimera' }}
  SUSFS_REF: ${{ inputs.susfs_ref || '6752be5bb08dccfc58d9bc98c51199515aa19abc' }}

jobs:
  build:
    name: Build — ${{ inputs.toolchain || 'llvm22' }}${{ (inputs.enable_susfs || true) == true && ' +susfs' || '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Project_Chimera
        uses: actions/checkout@v5
        with:
          repository: royd-jpg/Project_Chimera
          ref: lineage-24.0
          fetch-depth: 1
          submodules: recursive

      - name: Validate inputs
        run: |
          set -euo pipefail
          echo "::group::Validate inputs"
          fail=0
          [[ "$LOCALVERSION" == -* ]] || { echo "::error::localversion must start with '-'"; fail=1; }
          for v in KBUILD_BUILD_USER KBUILD_BUILD_HOST KBUILD_BUILD_VERSION KBUILD_BUILD_TIMESTAMP BUILD_VARIANTS TOOLCHAIN KSU_REPO KSU_REF SUSFS_REPO SUSFS_REF; do
            [[ -n "${!v}" ]] || { echo "::error::$v must not be empty"; fail=1; }
          done
          [[ "$KSU_REPO" == */* ]] || { echo "::error::KSU_REPO must be 'owner/repo'"; fail=1; }
          [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::KSU_REF must be a full 40-hex commit SHA, never a branch"; fail=1; }
          [[ "$SUSFS_REPO" == */* ]] || { echo "::error::SUSFS_REPO must be 'owner/repo'"; fail=1; }
          [[ "$SUSFS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::SUSFS_REF must be a full 40-hex commit SHA, never a branch"; fail=1; }
          case "$TOOLCHAIN" in
            llvm22|llvm21|llvm20|aosp22|aosp21|aosp20|aosp19|neutron19|neutron23|neutron24|zyc_stable) ;;
            *) echo "::error::Unsupported toolchain: $TOOLCHAIN"; fail=1 ;;
          esac
          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          [[ "${#variants[@]}" -gt 0 ]] || { echo "::error::No build variants supplied"; fail=1; }
          declare -A seen=()
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            case "$variant" in
              star2lte|starlte|crownlte) ;;
              *) echo "::error::Unsupported variant: $variant"; fail=1 ;;
            esac
            [[ -n "${seen[$variant]:-}" ]] && { echo "::error::Duplicate variant: $variant"; fail=1; }
            seen["$variant"]=1
          done
          echo "::endgroup::"
          [[ "$fail" -eq 0 ]]

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache device-tree-compiler \
            flex gcc-aarch64-linux-gnu git libelf-dev libncurses-dev \
            libssl-dev lzop python3 rsync wget zip zlib1g-dev zstd \
            binutils-aarch64-linux-gnu patch file dwarves
          # FIX: exynos9810-*_defconfig ships CONFIG_DEBUG_INFO_BTF=y (stock,
          # pre-existing, unrelated to KSU/SUSFS). scripts/link-vmlinux.sh's
          # gen_btf() calls `exit 1` if pahole is missing -- confirmed fatal,
          # not a warning, by reading the script directly. `dwarves` provides
          # pahole; Ubuntu 24.04 ships 1.25, which clears both version gates
          # gen_btf() checks (>=1.13 required; >=1.24 auto-enables
          # --skip_encoding_btf_enum64 inside the script itself).
          command -v pahole >/dev/null || { echo "::error::pahole not on PATH after installing dwarves"; exit 1; }
          pahole --version

      - name: Configure ccache
        run: |
          set -euo pipefail
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      # ── KSUN/SUSFS wiring ────────────────────────────────────────────────
      - name: Guard — confirm tree has no pre-existing KernelSU/SUSFS integration
        run: |
          set -euo pipefail
          echo "::group::Pre-integration guard"
          for dc in exynos9810-star2lte_defconfig exynos9810-starlte_defconfig exynos9810-crownlte_defconfig; do
            if grep -q '^CONFIG_KSU=y$' "arch/arm64/configs/$dc" 2>/dev/null; then
              echo "::error::$dc already has CONFIG_KSU=y — this run assumes a clean tree."
              exit 1
            fi
          done
          if [[ -e drivers/kernelsu ]]; then
            echo "::error::drivers/kernelsu already exists — refusing to overwrite."
            exit 1
          fi
          if [[ -e fs/susfs.c ]]; then
            echo "::error::fs/susfs.c already exists — refusing to overwrite."
            exit 1
          fi
          if grep -q "CONFIG_KSU" fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c 2>/dev/null; then
            echo "::error::One of the six hook target files already references CONFIG_KSU."
            exit 1
          fi
          echo "::endgroup::"

      - name: Vendor KernelSU-Next at pinned commit (including sibling uapi/)
        run: |
          set -euo pipefail
          echo "::group::Vendor KernelSU-Next"
          rm -rf KernelSU-Next
          git clone "https://github.com/$KSU_REPO.git" KernelSU-Next
          cd KernelSU-Next
          git checkout --detach "$KSU_REF"
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$KSU_REF" ]]; then
            echo "::error::Checked out commit ($actual) does not match pinned KSU_REF ($KSU_REF)"
            exit 1
          fi
          echo "KernelSU-Next pinned at: $actual"
          cd ..

          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          rsync -a KernelSU-Next/kernel/ drivers/kernelsu/
          test -e drivers/kernelsu/Kconfig
          test -e drivers/kernelsu/Kbuild

          # FIX (header note [1]): this repo has a sibling uapi/ directory
          # next to kernel/ that policy/app_profile.h etc. need at
          # "uapi/...". Vendoring only kernel/ breaks the include.
          if [[ -d KernelSU-Next/uapi ]]; then
            rsync -a KernelSU-Next/uapi/ drivers/kernelsu/uapi/
            test -e drivers/kernelsu/uapi
          else
            echo "::error::KernelSU-Next@$KSU_REF has no top-level uapi/ directory — this ref's layout differs from what this workflow expects. Re-verify before proceeding."
            exit 1
          fi

          # FIX: vendor the real .git too, as its own nested repo, so
          # drivers/kernelsu/Kbuild's GIT_ROOT != KERNEL_GIT_ROOT check
          # (see comment above this step) takes the real-version branch
          # instead of the "not a git repository" fallback. rev-list/
          # describe read the object DB only, so the working-tree/index
          # mismatch this creates (index still lists kernel/**, uapi/**,
          # manager/**, LICENSE at their original repo-root paths; the
          # working tree here only has core/**, uapi/** etc. flattened)
          # does not affect those two commands. This nested .git is never
          # committed and is not included in any uploaded artifact.
          git config --global --add safe.directory '*'
          rsync -a KernelSU-Next/.git/ drivers/kernelsu/.git/
          resolved_git_version="$(git -C drivers/kernelsu rev-list --count HEAD)"
          resolved_git_tag="$(git -C drivers/kernelsu describe --tags --abbrev=0 2>/dev/null || true)"
          [[ -n "$resolved_git_version" ]] || { echo "::error::drivers/kernelsu git rev-list --count HEAD returned empty — nested repo not wired correctly"; exit 1; }
          [[ -n "$resolved_git_tag" ]] || { echo "::error::drivers/kernelsu git describe --tags --abbrev=0 returned empty — $KSU_REPO has no tag reachable from $KSU_REF, or the nested repo is not wired correctly"; exit 1; }
          drivers_git_root="$(git -C drivers/kernelsu rev-parse --show-toplevel)"
          kernel_git_root="$(git rev-parse --show-toplevel)"
          [[ "$drivers_git_root" != "$kernel_git_root" ]] || { echo "::error::drivers/kernelsu did not resolve as a distinct git repo from Project_Chimera — Kbuild's GIT_ROOT != KERNEL_GIT_ROOT check will still fall back"; exit 1; }
          echo "KSU_GIT_VERSION=$resolved_git_version" >> "$GITHUB_ENV"
          echo "KSU_VERSION_TAG_RESOLVED=$resolved_git_tag" >> "$GITHUB_ENV"
          echo "Resolved KSU_GIT_VERSION=$resolved_git_version KSU_VERSION_TAG=$resolved_git_tag (drivers/kernelsu git root: $drivers_git_root)"
          echo "::endgroup::"

      - name: Wire drivers/Makefile and drivers/Kconfig
        run: |
          set -euo pipefail
          echo "::group::Wire drivers/"
          grep -q 'obj-\$(CONFIG_KSU)' drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/^endmenu$/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          tail -5 drivers/Makefile
          tail -5 drivers/Kconfig
          echo "::endgroup::"

      # FIX (root cause of the reported "malformed patch" error): the prior
      # hand-rolled unified diff had wrong hunk-size headers (see workflow
      # header). Replaced with anchor-based text insertion, verified against
      # the real file content on this exact tree. Every anchor is asserted
      # to appear EXACTLY ONCE before being touched — no silent partial
      # application. FIX (header note [2]): all 6 hooks, not 3 — this pin's
      # own Kbuild hard-requires the kernel/reboot.c hook to build at all.
      - name: Apply KSU manual-hook call sites (anchor-based, not patch-based)
        run: |
          set -euo pipefail
          echo "::group::Apply manual-hook call sites"
          python3 << 'PYEOF'
          import sys, pathlib

          def patch(path, old, new, label):
              p = pathlib.Path(path)
              s = p.read_text()
              n = s.count(old)
              if n == 0:
                  print(f"FATAL: anchor not found in {path} :: {label}", file=sys.stderr)
                  print("This tree has diverged from the verified reference at this exact point.", file=sys.stderr)
                  print("Resolve manually — do not force-apply.", file=sys.stderr)
                  sys.exit(1)
              if n > 1:
                  print(f"FATAL: anchor matched {n} times in {path} :: {label} (must be exactly 1)", file=sys.stderr)
                  sys.exit(1)
              p.write_text(s.replace(old, new))
              print(f"OK: {path} :: {label}")

          # fs/exec.c — do_execve
          patch("fs/exec.c",
          "int do_execve(struct filename *filename,\n"
          "\tconst char __user *const __user *__argv,\n"
          "\tconst char __user *const __user *__envp)\n"
          "{\n"
          "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
          "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
          "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
          "}",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr,\n"
          "\t\t\t\tvoid *argv, void *envp, int *flags);\n"
          "#endif\n"
          "int do_execve(struct filename *filename,\n"
          "\tconst char __user *const __user *__argv,\n"
          "\tconst char __user *const __user *__envp)\n"
          "{\n"
          "\tstruct user_arg_ptr argv = { .ptr.native = __argv };\n"
          "\tstruct user_arg_ptr envp = { .ptr.native = __envp };\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_execveat((int *)AT_FDCWD, &filename, &argv, &envp, NULL);\n"
          "#endif\n"
          "\treturn do_execveat_common(AT_FDCWD, filename, argv, envp, 0);\n"
          "}",
          "do_execve")

          # fs/open.c — faccessat
          patch("fs/open.c",
          "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
          "{\n"
          "\tconst struct cred *old_cred;\n"
          "\tstruct cred *override_cred;\n"
          "\tstruct path path;\n"
          "\tstruct inode *inode;\n"
          "\tstruct vfsmount *mnt;\n"
          "\tint res;\n"
          "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
          "\n"
          "\tif (mode & ~S_IRWXO)",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user,\n"
          "\t\t\t\tint *mode, int *flags);\n"
          "#endif\n"
          "SYSCALL_DEFINE3(faccessat, int, dfd, const char __user *, filename, int, mode)\n"
          "{\n"
          "\tconst struct cred *old_cred;\n"
          "\tstruct cred *override_cred;\n"
          "\tstruct path path;\n"
          "\tstruct inode *inode;\n"
          "\tstruct vfsmount *mnt;\n"
          "\tint res;\n"
          "\tunsigned int lookup_flags = LOOKUP_FOLLOW;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);\n"
          "#endif\n"
          "\n"
          "\tif (mode & ~S_IRWXO)",
          "faccessat")

          # fs/stat.c — newfstatat
          patch("fs/stat.c",
          "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
          "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_stat(int *dfd, const char __user **filename_user,\n"
          "\t\t\t\tint *flags);\n"
          "#endif\n"
          "#if !defined(__ARCH_WANT_STAT64) || defined(__ARCH_WANT_SYS_NEWFSTATAT)\n"
          "SYSCALL_DEFINE4(newfstatat, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_stat(&dfd, &filename, &flag);\n"
          "#endif\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "newfstatat")

          # fs/stat.c — fstatat64 (32-bit compat path)
          patch("fs/stat.c",
          "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat64 __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "SYSCALL_DEFINE4(fstatat64, int, dfd, const char __user *, filename,\n"
          "\t\tstruct stat64 __user *, statbuf, int, flag)\n"
          "{\n"
          "\tstruct kstat stat;\n"
          "\tint error;\n"
          "\n"
          "#ifdef CONFIG_KSU // 32-bit su\n"
          "\tksu_handle_stat(&dfd, &filename, &flag);\n"
          "#endif\n"
          "\terror = vfs_fstatat(dfd, filename, &stat, flag);",
          "fstatat64")

          # fs/read_write.c — sys_read
          patch("fs/read_write.c",
          "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
          "{\n"
          "\tstruct fd f = fdget_pos(fd);\n"
          "\tssize_t ret = -EBADF;\n"
          "\n"
          "\tif (f.file) {",
          "#ifdef CONFIG_KSU\n"
          "extern void ksu_handle_sys_read(unsigned int fd);\n"
          "#endif\n"
          "SYSCALL_DEFINE3(read, unsigned int, fd, char __user *, buf, size_t, count)\n"
          "{\n"
          "\tstruct fd f = fdget_pos(fd);\n"
          "\tssize_t ret = -EBADF;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_sys_read(fd);\n"
          "#endif\n"
          "\tif (f.file) {",
          "sys_read")

          # drivers/input/input.c — input_handle_event
          patch("drivers/input/input.c",
          "static void input_handle_event(struct input_dev *dev,\n"
          "\t\t\t       unsigned int type, unsigned int code, int value)\n"
          "{\n"
          "\tint disposition = input_get_disposition(dev, type, code, &value);",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code,\n"
          "\t\t\t\tint *value);\n"
          "#endif\n"
          "static void input_handle_event(struct input_dev *dev,\n"
          "\t\t\t       unsigned int type, unsigned int code, int value)\n"
          "{\n"
          "\tint disposition;\n"
          "#ifdef CONFIG_KSU\n"
          "\tksu_handle_input_handle_event(&type, &code, &value);\n"
          "#endif\n"
          "\tdisposition = input_get_disposition(dev, type, code, &value);",
          "input_handle_event")

          # kernel/reboot.c — SYSCALL_DEFINE4(reboot...) — REQUIRED by this
          # pin's own Kbuild self-check (see header note [2]); not optional.
          patch("kernel/reboot.c",
          "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
          "\t\tvoid __user *, arg)\n"
          "{\n"
          "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
          "\tchar buffer[256];\n"
          "\tint ret = 0;\n"
          "\n"
          "\t/* We only trust the superuser with rebooting the system. */",
          "#ifdef CONFIG_KSU\n"
          "extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,\n"
          "\t\t\t\t  void __user **arg);\n"
          "#endif\n"
          "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n"
          "\t\tvoid __user *, arg)\n"
          "{\n"
          "\tstruct pid_namespace *pid_ns = task_active_pid_ns(current);\n"
          "\tchar buffer[256];\n"
          "\tint ret = 0;\n"
          "\n"
          "#ifdef CONFIG_KSU\n"
          "\tif (ksu_handle_sys_reboot(magic1, magic2, cmd, (void __user **)&arg))\n"
          "\t\treturn 0;\n"
          "#endif\n"
          "\t/* We only trust the superuser with rebooting the system. */",
          "reboot")

          print("all 6 hooks applied")
          PYEOF
          git diff --stat -- fs/exec.c fs/open.c fs/stat.c fs/read_write.c drivers/input/input.c kernel/reboot.c
          echo "::endgroup::"

      - name: Vendor SUSFS core (if enabled)
        if: inputs.enable_susfs != false
        run: |
          set -euo pipefail
          echo "::group::Vendor SUSFS"
          rm -rf /tmp/susfs-src
          git clone --no-checkout "https://github.com/$SUSFS_REPO.git" /tmp/susfs-src
          git -C /tmp/susfs-src fetch --no-tags --depth 1 origin "$SUSFS_REF"
          git -C /tmp/susfs-src checkout --force "$SUSFS_REF"
          resolved="$(git -C /tmp/susfs-src rev-parse HEAD)"
          if [[ "$resolved" != "$SUSFS_REF" ]]; then
            echo "::error::Resolved SUSFS commit ($resolved) does not match pinned SUSFS_REF ($SUSFS_REF)"
            exit 1
          fi

          for required in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -f "/tmp/susfs-src/$required" || {
              echo "::error::SUSFS ref $SUSFS_REF is missing $required"
              exit 1
            }
          done

          cp /tmp/susfs-src/fs/susfs.c fs/susfs.c
          mkdir -p include/linux
          cp /tmp/susfs-src/include/linux/susfs.h include/linux/susfs.h
          cp /tmp/susfs-src/include/linux/susfs_def.h include/linux/susfs_def.h

          grep -q 'obj-\$(CONFIG_KSU_SUSFS)' fs/Makefile || \
            printf '\nobj-$(CONFIG_KSU_SUSFS) += susfs.o\n' >> fs/Makefile

          # FIX (header note [4]): fs/susfs.c requires this symbol
          # unconditionally the moment CONFIG_KSU_SUSFS=y — confirmed
          # missing from a clean tree by direct compile/link testing.
          if ! grep -q 'susfs_is_avc_log_spoofing_enabled' security/selinux/avc.c; then
            python3 - << 'PYEOF'
          import pathlib
          p = pathlib.Path("security/selinux/avc.c")
          s = p.read_text()
          anchor = "#include <net/af_unix.h>\n#include <linux/ip.h>\n#include <linux/audit.h>"
          assert s.count(anchor) == 1, "avc.c include anchor not found/unique — resolve manually"
          insert = anchor + (
              "\n\n#ifdef CONFIG_KSU_SUSFS\n"
              "/* fs/susfs.c requires this unconditionally once CONFIG_KSU_SUSFS=y.\n"
              " * Only the storage is provided here; the AVC-audit consumer logic\n"
              " * (spoofing tsid in slow_avc_audit()) is not ported — this toggle is\n"
              " * currently inert (defaults false, does nothing when flipped true). */\n"
              "bool susfs_is_avc_log_spoofing_enabled = false;\n"
              "#endif"
          )
          p.write_text(s.replace(anchor, insert))
          print("OK: security/selinux/avc.c :: susfs_is_avc_log_spoofing_enabled")
          PYEOF
          fi
          echo "::endgroup::"

      - name: Resolve toolchain
        run: |
          set -euo pipefail
          echo "::group::Resolve toolchain"
          case "$TOOLCHAIN" in
            aosp19) echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            aosp20) echo "TC_URL=https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            aosp21) echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            aosp22) echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.gz" >> "$GITHUB_ENV" ;;
            llvm20) echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV" ;;
            llvm21) echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV" ;;
            llvm22) echo "TC_URL=https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.xz" >> "$GITHUB_ENV" ;;
            neutron19) echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
            neutron23) echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
            neutron24) echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
            zyc_stable)
              zyc_url="$(curl -fsSL https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt)"
              [[ -n "$zyc_url" ]]
              echo "TC_URL=$zyc_url" >> "$GITHUB_ENV"; echo "TC_ARCHIVE=tar.zst" >> "$GITHUB_ENV" ;;
          esac
          echo "::endgroup::"

      - name: Restore toolchain cache
        uses: actions/cache@v4
        id: toolchain-cache
        with:
          path: toolchains/clang
          key: toolchain-${{ inputs.toolchain || 'llvm22' }}-ubuntu-24.04-v3-${{ env.TC_URL }}

      - name: Download and extract toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "::group::Download and extract toolchain"
          rm -rf toolchains/clang /tmp/clang-archive /tmp/clang.tar /tmp/clang-stage
          mkdir -p toolchains/clang /tmp/clang-stage
          aria2c --allow-overwrite=true --continue=true --dir=/tmp --file-allocation=none \
            --max-tries=5 --min-split-size=1M --out=clang-archive --retry-wait=5 --split=16 "$TC_URL"
          test -s /tmp/clang-archive
          archive_kind="$(file -b /tmp/clang-archive)"
          case "$archive_kind" in
            *gzip*) tar_extract=(tar -xzf /tmp/clang-archive -C /tmp/clang-stage) ;;
            *XZ*) tar_extract=(tar -xJf /tmp/clang-archive -C /tmp/clang-stage) ;;
            *Zstandard*)
              zstd -d -f /tmp/clang-archive -o /tmp/clang.tar
              tar_extract=(tar -xf /tmp/clang.tar -C /tmp/clang-stage) ;;
            *) echo "::error::Unsupported toolchain archive: $archive_kind"; exit 1 ;;
          esac
          "${tar_extract[@]}"
          clang_bin="$(find /tmp/clang-stage \( -type f -o -type l \) -path '*/bin/clang' -print -quit)"
          if [[ -z "$clang_bin" ]]; then
            echo "::error::clang was not found in extracted archive"
            find /tmp/clang-stage -maxdepth 6 -printf '%y %p\n' | sort | head -n 200
            exit 1
          fi
          toolchain_root="$(cd "$(dirname "$clang_bin")/.." && pwd)"
          rm -rf toolchains/clang
          mkdir -p toolchains/clang
          rsync -a "$toolchain_root"/ toolchains/clang/
          test -x toolchains/clang/bin/clang
          test -x toolchains/clang/bin/ld.lld
          find toolchains/clang/bin -maxdepth 1 \( -type f -o -type l \) -exec chmod +x {} +
          echo "Resolved toolchain root: $toolchain_root"
          echo "::endgroup::"

      - name: Configure and verify toolchain
        run: |
          set -euo pipefail
          echo "::group::Configure and verify toolchain"
          toolchain_bin="$PWD/toolchains/clang/bin"
          if [[ ! -x "$toolchain_bin/clang" ]]; then
            echo "::error::clang is missing from $toolchain_bin"
            find toolchains/clang -maxdepth 4 \( -type f -o -type l \) \( -name clang -o -name ld.lld -o -name llvm-ar \) -print | sort | head -n 200
            exit 1
          fi
          chmod +x "$toolchain_bin"/* 2>/dev/null || true
          echo "$toolchain_bin" >> "$GITHUB_PATH"
          export PATH="$toolchain_bin:$PATH"
          for binary in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            command -v "$binary" >/dev/null 2>&1 || { echo "::error::Required tool missing: $binary"; exit 1; }
          done
          clang_version_line="$(clang --version | head -n1)"
          clang_major="$(sed -nE 's/.*clang version ([0-9]+)\..*/\1/p' <<< "$clang_version_line")"
          [[ -n "$clang_major" ]] || { echo "::error::Could not parse clang major version from: $clang_version_line"; exit 1; }
          echo "CLANG_LABEL=clang$clang_major" >> "$GITHUB_ENV"
          echo "CLANG_VERSION=$clang_version_line" >> "$GITHUB_ENV"
          mkdir -p artifacts
          {
            echo "Kernel: Linux $KERNEL_VERSION"
            echo "Toolchain: $(clang --version | head -n1)"
            echo "Linker: $(ld.lld --version | head -n1)"
            echo "KernelSU-Next: $KSU_REPO@$KSU_REF (resolved tag: ${KSU_VERSION_TAG_RESOLVED:-unresolved}, rev-count: ${KSU_GIT_VERSION:-unresolved})"
            echo "SUSFS: $SUSFS_REPO@$SUSFS_REF (enabled=$ENABLE_SUSFS)"
            echo "pahole: $(pahole --version)"
            echo "Commit: $(git rev-parse HEAD)"
          } > artifacts/toolchain.txt
          echo "::endgroup::"

      - name: Configure KSUN and SUSFS defconfigs
        run: |
          set -euo pipefail
          echo "::group::Configure KSUN and SUSFS defconfigs"
          configs=(
            arch/arm64/configs/exynos9810-star2lte_defconfig
            arch/arm64/configs/exynos9810-starlte_defconfig
            arch/arm64/configs/exynos9810-crownlte_defconfig
          )
          symbols=(KSU KSU_MANUAL_HOOK KSU_KPROBES_HOOK KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_TRY_UMOUNT KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_SUS_MEMFD)
          for config in "${configs[@]}"; do
            test -f "$config"
            for symbol in "${symbols[@]}"; do
              sed -i -E "/^(# )?CONFIG_${symbol}(=| is not set)/d" "$config"
            done
            {
              echo "# KernelSU-Next (manual hook — kprobe mode unsupported on this 4.9.337 base, see workflow header)"
              echo "CONFIG_KSU=y"
              echo "CONFIG_KSU_MANUAL_HOOK=y"
              echo "# CONFIG_KSU_KPROBES_HOOK is not set"
              if [[ "$ENABLE_SUSFS" == "true" ]]; then
                echo "CONFIG_KSU_SUSFS=y"
                echo "CONFIG_KSU_SUSFS_SUS_PATH=y"
                echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
                echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
                echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y"
                echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
                # FIX (header note [3]): forced off — the vendored SUSFS
                # source (v2.2.0) predates susfs_add_sus_memfd(), which
                # this KSU-Next pin's Kconfig defaults on the moment
                # CONFIG_KSU_SUSFS=y is set. Confirmed by direct compile
                # ("implicit declaration of function 'susfs_add_sus_memfd'").
                echo "# CONFIG_KSU_SUSFS_SUS_MEMFD is not set"
              else
                echo "# CONFIG_KSU_SUSFS is not set"
              fi
            } >> "$config"
          done
          echo "::endgroup::"

      - name: Clone AnyKernel3
        run: |
          set -euo pipefail
          rm -rf anykernel3
          git clone --depth=1 --branch master https://github.com/osm0sis/AnyKernel3.git anykernel3

      - name: Build dtbTool
        run: |
          set -euo pipefail
          rm -rf dtbTool dtbTool-bin
          git clone --depth=1 https://github.com/rajatgupta1998/android_tools_system_dtbTool.git dtbTool
          source_file="$(find dtbTool -type f -name dtbtool.c -print -quit)"
          [[ -n "$source_file" ]] || { echo "::error::dtbtool.c was not found"; exit 1; }
          gcc "$source_file" -O2 -o dtbTool-bin
          chmod +x dtbTool-bin
          test -x dtbTool-bin

      - name: Build kernel variants
        id: build
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "::group::Build kernel variants"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          # -Wno-unused-label: this KSU pin's own supercall.c has a
          # `do_umount:` label that becomes unused when a SUS_* sub-option
          # is off — confirmed benign by direct compile testing, not masking
          # a real defect.
          export KCFLAGS="-Wno-unused-label $EXTRA_CFLAGS"
          export CLANG_TRIPLE="$CROSS_COMPILE"

          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          built_variants=()
          rm -rf out
          mkdir -p out

          # security/selinux/ first: drivers/kernelsu/*.o includes the
          # generated flask.h, and a parallel -j build races its generation
          # otherwise (confirmed reproducible on this tree).
          make -C . O="out/_selinux_prime" ARCH="$ARCH" exynos9810-star2lte_defconfig >/dev/null
          make -C . -j"$(nproc)" O="out/_selinux_prime" ARCH="$ARCH" \
            CC="$CC" LD="$LD" CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" \
            security/selinux/ >/dev/null 2>&1 || true

          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            output_dir="out/$variant"
            defconfig="exynos9810-${variant}_defconfig"
            mkdir -p "$output_dir"

            make -C . O="$output_dir" ARCH="$ARCH" "$defconfig"

            scripts/config --file "$output_dir/.config" \
              -e KSU -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
            if [[ "$ENABLE_SUSFS" == "true" ]]; then
              scripts/config --file "$output_dir/.config" \
                -e KSU_SUSFS -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
                -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_TRY_UMOUNT -e KSU_SUSFS_SPOOF_UNAME \
                -d KSU_SUSFS_SUS_MEMFD
            else
              scripts/config --file "$output_dir/.config" -d KSU_SUSFS
            fi

            if [[ "$ENABLE_LTO" == "true" ]]; then
              grep -Rqs '^config LTO_CLANG$' arch drivers fs include kernel security || {
                echo "::error::enable_lto=true, but this kernel tree does not provide CONFIG_LTO_CLANG"; exit 1; }
              scripts/config --file "$output_dir/.config" -e LTO_CLANG
            fi

            make -C . O="$output_dir" ARCH="$ARCH" olddefconfig

            grep -qx 'CONFIG_KSU=y' "$output_dir/.config" || { echo "::error::CONFIG_KSU did not resolve to y for $variant — drivers/kernelsu wiring did not take effect"; exit 1; }
            grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' "$output_dir/.config" || { echo "::error::CONFIG_KSU_MANUAL_HOOK did not resolve to y for $variant"; exit 1; }
            grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' "$output_dir/.config" && { echo "::error::CONFIG_KSU_KPROBES_HOOK is enabled alongside manual hook for $variant — exactly one method must be active on this kernel"; exit 1; }
            if [[ "$ENABLE_SUSFS" == "true" ]]; then
              grep -qx 'CONFIG_KSU_SUSFS=y' "$output_dir/.config" || { echo "::error::CONFIG_KSU_SUSFS did not resolve to y for $variant"; exit 1; }
              grep -q '^CONFIG_KSU_SUSFS_SUS_MEMFD=y$' "$output_dir/.config" && { echo "::error::CONFIG_KSU_SUSFS_SUS_MEMFD is enabled for $variant despite the forced-off default — this SUSFS/KSU pin combination is known-incompatible (see workflow header note [3])"; exit 1; }
            fi
            [[ "$ENABLE_LTO" == "true" ]] && { grep -qx 'CONFIG_LTO_CLANG=y' "$output_dir/.config" || { echo "::error::CONFIG_LTO_CLANG did not resolve to y"; exit 1; }; }

            make -C . -j"$(nproc)" O="$output_dir" ARCH="$ARCH" \
              CROSS_COMPILE="$CROSS_COMPILE" CLANG_TRIPLE="$CLANG_TRIPLE" \
              CC="$CC" LD="$LD" AR="$AR" NM="$NM" OBJCOPY="$OBJCOPY" OBJDUMP="$OBJDUMP" STRIP="$STRIP" \
              KCFLAGS="$KCFLAGS" \
              Image.gz dtbs

            image="$output_dir/arch/arm64/boot/Image.gz"
            if [[ ! -s "$image" ]]; then
              echo "::error::$variant did not produce Image.gz"
              exit 1
            fi

            nm_bin="$(command -v llvm-nm)"
            "$nm_bin" "$output_dir/vmlinux" > "artifacts/vmlinux-symbols-$variant.log" 2>&1 || true
            grep -qE '^[0-9a-fA-F]+ [A-Za-z] ksu_handle_execveat$' "artifacts/vmlinux-symbols-$variant.log" || {
              echo "::error::ksu_handle_execveat not found in vmlinux for $variant — manual hook patch did not link"; exit 1; }
            grep -qE '^[0-9a-fA-F]+ [A-Za-z] ksu_handle_sys_reboot$' "artifacts/vmlinux-symbols-$variant.log" || {
              echo "::error::ksu_handle_sys_reboot not found in vmlinux for $variant — this KSU pin's own Kbuild requires this hook to build at all, so its absence here means something upstream silently regenerated .config without it"; exit 1; }
            if [[ "$ENABLE_SUSFS" == "true" ]]; then
              grep -qE '^[0-9a-fA-F]+ [A-Za-z] susfs_add_sus_path$' "artifacts/vmlinux-symbols-$variant.log" || {
                echo "::error::susfs_add_sus_path not found in vmlinux for $variant despite CONFIG_KSU_SUSFS=y"; exit 1; }
            fi

            git diff --stat -- fs/namespace.c fs/internal.h include/linux/seccomp.h security/selinux/ \
              > "artifacts/ksu-autopatch-diff-$variant.log" || true

            cp "$image" "out/Image.gz-$variant"
            built_variants+=("$variant")
          done

          {
            echo "variants=$(IFS=,; echo "${built_variants[*]}")"
            echo "clang_label=$CLANG_LABEL"
          } >> "$GITHUB_OUTPUT"
          ccache -s || true
          echo "::endgroup::"

      - name: Create per-variant DTB images
        if: inputs.dry_run != true && inputs.upload_dtbs == true
        run: |
          set -euo pipefail
          echo "::group::Create per-variant DTB images"
          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            output_dir="out/$variant"
            dts_dir="$output_dir/arch/arm64/boot/dts/exynos"
            dtb_image="$output_dir/arch/arm64/boot/dtb.img"
            shopt -s nullglob
            dtbs=("$dts_dir"/*.dtb)
            shopt -u nullglob
            [[ "${#dtbs[@]}" -gt 0 ]] || { echo "::error::$variant produced no Exynos DTBs"; exit 1; }
            ./dtbTool-bin -s 2048 -o "$dtb_image" -p "$output_dir/scripts/dtc/" "${dtbs[@]}"
            test -s "$dtb_image"
            cp "$dtb_image" "out/dtb-$variant.img"
          done
          echo "::endgroup::"

      - name: Package AnyKernel3 ZIPs
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "::group::Package device-checked AnyKernel3 ZIPs"
          rm -rf packages
          mkdir -p packages
          susfs_tag=""
          [[ "$ENABLE_SUSFS" == "true" ]] && susfs_tag="-SUSFS"
          IFS=',' read -r -a variants <<< "$BUILD_VARIANTS"
          for variant in "${variants[@]}"; do
            variant="${variant//[[:space:]]/}"
            staging_dir="packages/AnyKernel3-$variant"
            zip_name="Chimera-KSUN${susfs_tag}-${CLANG_LABEL}${LOCALVERSION}-$variant.zip"
            case "$variant" in
              star2lte) device_names=$'device.name1=star2lte\ndevice.name2=star2ltexx\ndevice.name3=SM-G965F\ndevice.name4=SM-G965U\ndevice.name5=SM-G965N' ;;
              starlte) device_names=$'device.name1=starlte\ndevice.name2=starltexx\ndevice.name3=SM-G960F\ndevice.name4=SM-G960U\ndevice.name5=SM-G960N' ;;
              crownlte) device_names=$'device.name1=crownlte\ndevice.name2=crownltexx\ndevice.name3=SM-N960F\ndevice.name4=SM-N960U\ndevice.name5=SM-N960N' ;;
              *) echo "::error::Unsupported AnyKernel3 variant: $variant"; exit 1 ;;
            esac
            mkdir -p "$staging_dir"
            rsync -a --delete --exclude=.git anykernel3/ "$staging_dir/"
            test -f "$staging_dir/tools/ak3-core.sh"
            test -s "out/Image.gz-$variant"

            cat > "$staging_dir/anykernel.sh" <<EOF
          #!/usr/bin/env bash
          properties() { '
          kernel.string=Chimera Linux $KERNEL_VERSION KSUN${susfs_tag} ($variant) | $CLANG_VERSION
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          $device_names
          supported.versions=17
          '; }
          BLOCK=/dev/block/by-name/BOOT
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          . tools/ak3-core.sh
          dump_boot
          write_boot
          EOF
            chmod +x "$staging_dir/anykernel.sh"
            cp "out/Image.gz-$variant" "$staging_dir/Image.gz"
            if [[ "$UPLOAD_DTBS" == "true" && -s "out/dtb-$variant.img" ]]; then
              cp "out/dtb-$variant.img" "$staging_dir/dtb.img"
            fi
            ( cd "$staging_dir" && zip -r9 "../$zip_name" . -x ".git/*" ".github/*" )
            test -s "packages/$zip_name"
            rm -rf "$staging_dir"
          done
          echo "::endgroup::"

      - name: Upload build artifacts
        if: inputs.dry_run != true
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-KSUN-SUSFS-${{ inputs.toolchain || 'llvm22' }}-${{ github.run_number }}
          path: |
            packages/*.zip
            out/Image.gz-*
            out/dtb-*.img
            artifacts/toolchain.txt
            artifacts/vmlinux-symbols-*.log
            artifacts/ksu-autopatch-diff-*.log
          retention-days: 14
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-KSUN-SUSFS-failure-diagnostics-${{ github.run_number }}
          path: |
            out/**/.config
            artifacts/**
          if-no-files-found: ignore

      - name: Create GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.do_release == true && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: Chimera-KSUN-SUSFS-${{ github.run_number }}
          name: Chimera KSUN + SUSFS — Build ${{ github.run_number }}
          files: packages/*.zip
          body: |
            ## Exynos 9810 — KernelSU-Next + SUSFS

            - Kernel: Linux 4.9.337
            - Source: Project_Chimera / lineage-24.0
            - KernelSU-Next: ${{ inputs.ksu_repo }}@${{ inputs.ksu_ref }} (manual hook only — kprobe mode is unsupported on this 4.9.337 base, see workflow header)
            - SUSFS: ${{ inputs.susfs_repo }}@${{ inputs.susfs_ref }} (enabled: ${{ inputs.enable_susfs }}; CONFIG_KSU_SUSFS_SUS_MEMFD forced off — version mismatch, see workflow header)
            - Toolchain: ${{ inputs.toolchain }}
            - Localversion: ${{ inputs.localversion }}
            - Variants: ${{ steps.build.outputs.variants }}
            - Packaging: plain Image.gz + separate dtb.img (not concatenated)

            Android 17 compatibility here means building the modified Exynos 9810 vendor kernel for potential
            use with a compatible LineageOS 24 userspace. Runtime compatibility requires physical-device testing.
            This build is compile/link-verified on the KernelSU driver subtree and the six patched call sites
            only; a full end-to-end vmlinux link, boot, root grant, and SUSFS runtime behavior have not been
            verified — see the workflow file header for exactly what has and has not been confirmed.
