# ═══════════════════════════════════════════════════════════════════════════════
# Project Chimera Mk7 Forte v3 — LOS/AOSP Android 15/16 / Exynos 9810 (star2lte)
# Hardened CI variant — all inline heredocs converted to YAML-safe printf
# Branding  : 4.9.337-Chimera_Mk7_Forte (Terminal_Echo@AegisDevLabs)
# ═══════════════════════════════════════════════════════════════════════════════

name: Project Chimera Mk7 Forte v3 — LOS/AOSP Android 15/16 / Exynos 9810 (star2lte) - AOSP Clang 21.0

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS even if already present in tree"
        required: false
        type: boolean
        default: false
      ksu_repo:
        description: "KernelSU git URL (https only)"
        required: false
        type: string
        default: "https://github.com/sidex15/KernelSU-Next.git"
      ksu_ref:
        description: "KernelSU branch/tag/ref"
        required: false
        type: string
        default: "legacy-susfs-v2"
      ksu_commit:
        description: "KernelSU exact commit SHA (leave blank to track ref tip)"
        required: false
        type: string
        default: ""
      susfs_repo:
        description: "SUSFS git URL (https only)"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_ref:
        description: "SUSFS branch/tag/ref"
        required: false
        type: string
        default: "kernel-4.9"
      susfs_commit:
        description: "SUSFS exact commit SHA (leave blank to track ref tip)"
        required: false
        type: string
        default: ""
      clang_checksum:
        description: "Optional SHA256 checksum for AOSP Clang tarball (recommended)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk7 Forte v3 (hardened)
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO:          "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH:        "chimera-mk6l"
      SUSFS_TARGET_VERSION: "2.1.0"
      KERNEL_DIR:           "kernel"
      OUT_DIR:              "kernel-out"
      LOG_DIR:              "logs"
      AOSP_KEY:             "aosp-clang-r563880c-ubuntu-24.04-v1"
      DEFCONFIG:            "arch/arm64/configs/exynos9810-star2lte_defconfig"
      BRAND:                "-Chimera_Mk7_Forte"
      BUILD_USER:           "Terminal_Echo"
      BUILD_HOST:           "AegisDevLabs"

    steps:

      - name: Checkout repository (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "dry_run=${{ inputs.dry_run }}"
            echo "do_release=${{ inputs.do_release }}"
            echo "force_repatch=${{ inputs.force_repatch }}"
            echo "ksu_repo=${{ inputs.ksu_repo }}"
            echo "ksu_ref=${{ inputs.ksu_ref }}"
            echo "brand=$BRAND"
            echo "build_user=$BUILD_USER"
            echo "build_host=$BUILD_HOST"
          } | tee "$LOG_DIR/build-inputs.log"

          # Export KBUILD_* so the preview matches the kernel branding fields
          export KBUILD_USER="$BUILD_USER"
          export KBUILD_HOST="$BUILD_HOST"
          LOG="$LOG_DIR/build-inputs.log"
          echo "uname preview: Linux version 4.9.337${BRAND} (${KBUILD_USER}@${KBUILD_HOST}) #1 SMP PREEMPT" | tee -a "$LOG"

      - name: Install build dependencies (minimal)
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates wget bc flex bison python3 python3-venv \
            libssl-dev libelf-dev build-essential \
            zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Cache AOSP Clang 21.0 r563880c
        id: cache-clang19
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: '${{ env.AOSP_KEY }}'

      - name: Download AOSP Clang 21.0 r563880c (Tarball)
        if: steps.cache-clang19.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          echo "=== Fetching AOSP Clang r563880c tarball ==="
          mkdir -p aosp-clang
          wget -q \
            -O aosp-clang/clang-r563880c.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
          tar -xzf aosp-clang/clang-r563880c.tar.gz -C aosp-clang
          rm -f aosp-clang/clang-r563880c.tar.gz
          if [[ -x aosp-clang/bin/clang ]]; then
            :
          elif [[ -x aosp-clang/clang-r563880c/bin/clang ]]; then
            mv aosp-clang/clang-r563880c/* aosp-clang/
            rmdir aosp-clang/clang-r563880c
          fi
          test -x aosp-clang/bin/clang \
            || { echo "ERROR: clang binary missing after extract"; exit 1; }
          aosp-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"

      - name: Export Clang 21.0 PATH
        run: |
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          echo "=== Verifying Compiler Binaries ==="
          clang --version
          ld.lld --version

      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log --oneline -5 | tee "$LOG_DIR/kernel-revision.log"
          echo "OK: kernel tree cloned (branch: $KERNEL_BRANCH)"

      - name: Clone SUSFS (kernel-tree files; pinned)
        run: |
          set -Eeuo pipefail
          SUSFS_URL="${{ inputs.susfs_repo }}"
          SUSFS_REF="${{ inputs.susfs_ref }}"
          SUSFS_COMMIT="${{ inputs.susfs_commit }}"
          [[ "$SUSFS_URL" =~ ^https:// ]] || { echo "ERROR: SUSFS URL must use https://"; exit 1; }
          git clone --filter=blob:none --no-tags "$SUSFS_URL" susfs4ksu
          if [[ -n "$SUSFS_COMMIT" ]]; then
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT"
            git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          else
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_REF"
            git -C susfs4ksu checkout --detach FETCH_HEAD
          fi
          RESOLVED="$(git -C susfs4ksu rev-parse HEAD)"
          {
            echo "SUSFS_URL=$SUSFS_URL"
            echo "SUSFS_REF=${SUSFS_REF:-none}"
            echo "SUSFS_COMMIT_INPUT=${SUSFS_COMMIT:-none}"
            echo "SUSFS_COMMIT_RESOLVED=$RESOLVED"
          } | tee "$LOG_DIR/susfs-revision.log"
          MISSING=0
          for f in \
            "kernel_patches/50_add_susfs_in_kernel-4.9.patch" \
            "kernel_patches/fs/susfs.c" \
            "kernel_patches/fs/sus_su.c" \
            "kernel_patches/include/linux/susfs.h" \
            "kernel_patches/include/linux/susfs_def.h" \
            "kernel_patches/include/linux/sus_su.h"; do
            [[ -f "susfs4ksu/$f" ]] || { echo "ERROR: susfs4ksu/$f missing"; MISSING=1; }
          done
          [[ "$MISSING" -eq 0 ]] || { echo "Aborting: required SUSFS files absent"; exit 1; }
          echo "OK: all required SUSFS kernel-tree files present"
          ACTUAL_VER="$(grep -oP 'SUSFS_VERSION\s+"\K[^"]+' susfs4ksu/kernel_patches/include/linux/susfs.h 2>/dev/null || echo 'unknown')"
          echo "SUSFS_ACTUAL_VERSION=$ACTUAL_VER" | tee -a "$LOG_DIR/susfs-revision.log"
          if [[ "$ACTUAL_VER" == "$SUSFS_TARGET_VERSION" ]]; then
            echo "OK: SUSFS version confirmed: $ACTUAL_VER"
          else
            echo "WARN: SUSFS version is '$ACTUAL_VER', expected '$SUSFS_TARGET_VERSION' — continuing"
          fi

      - name: Set up KernelSU-Next (sidex15/legacy-susfs-v2)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          git rm -r --cached KernelSU-Next 2>/dev/null || true
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu || true
          KSU_URL="${{ inputs.ksu_repo }}"
          KSU_REF="${{ inputs.ksu_ref }}"
          KSU_COMMIT="${{ inputs.ksu_commit }}"
          [[ "$KSU_URL" =~ ^https:// ]] || { echo "ERROR: KSU URL must use https://"; exit 1; }
          git clone --filter=blob:none --no-tags "$KSU_URL" KernelSU-Next
          if [[ -n "$KSU_COMMIT" ]]; then
            git -C KernelSU-Next fetch --depth=1 origin "$KSU_COMMIT"
            git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          else
            git -C KernelSU-Next fetch --depth=1 origin "$KSU_REF"
            git -C KernelSU-Next checkout --detach FETCH_HEAD
          fi
          RESOLVED_KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          {
            echo "KSU_URL=$KSU_URL"
            echo "KSU_REF=${KSU_REF:-none}"
            echo "KSU_COMMIT_INPUT=${KSU_COMMIT:-none}"
            echo "KSU_COMMIT_RESOLVED=$RESOLVED_KSU_COMMIT"
          } | tee "../$LOG_DIR/ksu-submodule.log"
          test -f KernelSU-Next/kernel/Kconfig || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }
          if grep -qE '^[[:space:]]*config[[:space:]]+KSU_SUSFS' KernelSU-Next/kernel/Kconfig; then
            echo "OK: SUSFS confirmed native in KernelSU-Next/kernel/Kconfig"
            echo "KSU_SUSFS_NATIVE=true" >> "$GITHUB_ENV"
          else
            echo "WARN: KernelSU-Next/kernel/Kconfig has no 'config KSU_SUSFS' entry."
            echo "KSU_SUSFS_NATIVE=false" >> "$GITHUB_ENV"
          fi
          git -C KernelSU-Next log --oneline -1 | tee -a "../$LOG_DIR/ksu-submodule.log"
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || { echo "ERROR: drivers/kernelsu/Kconfig symlink broken"; exit 1; }
          echo "OK: KernelSU-Next wired at drivers/kernelsu"

      - name: Fix syscall_fn_t typedef (Samsung 4.9 BSP pointer-type fix)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"
          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            echo "INFO: syscall_fn_t — nothing to fix"; exit 0
          fi

          # Write Python fixer using printf to avoid heredoc/YAML parsing issues
          printf '%s\n' \
            'from pathlib import Path' \
            'import re' \
            '' \
            'path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")' \
            'if not path.exists():' \
            '    raise SystemExit(0)' \
            '' \
            'content = path.read_text()' \
            'typedef = (' \
            '    "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\\n"' \
            '    "typedef long (*syscall_fn_t)(\\n"' \
            '    "    unsigned long, unsigned long, unsigned long,\\n"' \
            '    "    unsigned long, unsigned long, unsigned long\\n"' \
            '    ");\\n\\n"' \
            ')' \
            '' \
            'pos = 0' \
            'for m in re.finditer(r"^#(include|pragma|ifndef|define)[^\\n]*\\n", content, re.MULTILINE):' \
            '    pos = m.end()' \
            '' \
            'if "typedef long (*syscall_fn_t)" not in content:' \
            '    path.write_text(content[:pos] + typedef + content[pos:])' \
            '    print("OK: syscall_fn_t typedef injected")' \
            'else:' \
            '    print("OK: syscall_fn_t already present (idempotent)")' \
            > /tmp/fix_syscall_fn_t.py

          python3 /tmp/fix_syscall_fn_t.py

      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/preflight.log"
          echo "=== Preflight — Chimera Mk7 ===" | tee "$LOG"
          git status --short | tee -a "$LOG"
          echo "=== KSU/SUSFS markers ===" | tee -a "$LOG"
          grep -RsnE 'KernelSU|kernelsu|CONFIG_KSU|susfs_task_state|ksu_handle_faccessat' fs include kernel arch/arm64/configs 2>/dev/null | tee -a "$LOG" || true
          ALREADY_PATCHED=false
          if grep -RqsE 'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi
          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "$LOG"
          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true"  >> "$GITHUB_ENV"
            echo "INFO: tree already has KSU/SUSFS markers — skipping patch application"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig || true
          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'obj-y += kernelsu/' drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile
          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: Expected 1 Kconfig entry, found $COUNT"; exit 1; }
          echo "OK: KernelSU Kconfig wired (count=$COUNT)"

      - name: Apply SUSFS kernel patch (kernel-tree side only) — prefer tracked patch
        if: ${{ env.SKIP_INTEGRATION == 'false' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          PATCH_SRC="../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"
          if [[ -f "patches/0001-add-susfs-in-kernel.patch" ]]; then
            git apply --check patches/0001-add-susfs-in-kernel.patch || { echo "Patch check failed"; exit 1; }
            git apply patches/0001-add-susfs-in-kernel.patch || { echo "Patch apply failed"; exit 1; }
            echo "OK: applied tracked patches/0001-add-susfs-in-kernel.patch"
          else
            if [[ -f "$PATCH_SRC" ]]; then
              set +e
              git apply --reject --whitespace=fix "$PATCH_SRC" > "../$LOG_DIR/susfs-apply.log" 2>&1
              RC=$?
              set -e
              find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log" || true
              echo "Apply RC=$RC" | tee -a "../$LOG_DIR/susfs-apply.log"
              if [[ "$RC" -eq 0 ]]; then
                echo "OK: SUSFS kernel patch applied cleanly"
              else
                echo "WARN: git apply had conflicts — step 'Guarantee SUSFS files' will install files directly"
              fi
            else
              echo "WARN: No SUSFS patch found to apply; continuing to guarantee files"
            fi
          fi

      - name: Guarantee SUSFS kernel-tree files present
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-guarantee.log"
          echo "=== SUSFS file guarantee ===" | tee "$LOG"
          SRC="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          for pair in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do
            DST="${pair##*:}"; FROM="$SRC/${pair%%:*}"
            if [[ ! -f "$DST" ]]; then
              install -m 0644 "$FROM" "$DST"
              echo "OK: installed $DST" | tee -a "$LOG"
            else
              echo "INFO: $DST present ($(wc -l < "$DST") lines) — preserved" | tee -a "$LOG"
            fi
          done
          for hdr in "include/linux/susfs.h" "include/linux/susfs_def.h" "include/linux/sus_su.h"; do
            if [[ ! -f "$hdr" ]]; then
              PATCH_SRC="$SRC/$hdr"
              if [[ -f "$PATCH_SRC" ]]; then
                install -m 0644 "$PATCH_SRC" "$hdr"
                echo "OK: installed $hdr" | tee -a "$LOG"
              else
                echo "FAIL: $hdr missing from patch source" | tee -a "$LOG"
              fi
            else
              echo "INFO: $hdr present ($(wc -l < "$hdr") lines) — preserved" | tee -a "$LOG"
            fi
          done
          grep -q 'susfs\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile
          sed -i '/ccflags-.*CONFIG_KSU_SUSFS.*selinux/d' fs/Makefile || true
          echo 'ccflags-$(CONFIG_KSU_SUSFS) += -Isecurity/selinux -Isecurity/selinux/include' >> fs/Makefile
          echo "OK: fs/Makefile wired" | tee -a "$LOG"
          FAIL=0
          for f in fs/susfs.c fs/sus_su.c include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h; do
            [[ -f "$f" ]] && echo "OK: $f" | tee -a "$LOG" || { echo "FAIL: $f MISSING" | tee -a "$LOG"; FAIL=1; }
          done
          [[ "$FAIL" -eq 0 ]] || { echo "ERROR: missing SUSFS files"; exit 1; }

      - name: KernelSU Header Surgery (export headers, shim, normalize includes)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p include/kernelsu
          find include fs -type f \( -name '*.h' -o -name '*.c' \) -exec sed -i \
            -e 's|#include "../../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' \
            -e 's|#include "../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' \
            {} +
          echo "OK [Surgery A]: SUSFS include namespace normalized"

          # Export headers via printf-based Python to avoid heredoc YAML parsing issues
          printf '%s\n' \
            'import sys' \
            'from pathlib import Path' \
            '' \
            'def export_header(name):' \
            '    matches = [p for p in Path("KernelSU-Next").rglob(name) if "/include/" not in str(p)]' \
            '    dst = Path("include/kernelsu") / name' \
            '    if not matches:' \
            '        print(f"WARN: {name} not found — generating fallback")' \
            '        dst.write_text(f"#pragma once\n/* Auto-generated fallback for {name} */\n")' \
            '        return' \
            '    src = matches[0]' \
            '    content = src.read_text()' \
            '    content = "\n".join(l for l in content.splitlines() if "drivers/kernelsu" not in l and "<kernelsu/" not in l)' \
            '    dst.write_text(content)' \
            '    print(f"OK [Surgery B]: exported {name}")' \
            '' \
            'for h in ("core_hook.h", "kernel_compat.h", "ksu.h", "sucompat.h"):' \
            '    export_header(h)' \
            > /tmp/export_headers.py

          python3 /tmp/export_headers.py

          # Write kernel-safe ksu.h using printf to avoid heredoc parsing issues
          printf '%s\n' \
            '#pragma once' \
            '/* Kernel-safe shim for Mk7 — replaces upstream ksu.h */' \
            '#include <linux/types.h>' \
            '#include <linux/cred.h>' \
            '#include <linux/sched.h>' \
            '#include <linux/uaccess.h>' \
            '' \
            'extern const struct cred *ksu_cred;' \
            > include/kernelsu/ksu.h

          echo "OK [Surgery C]: kernel-safe ksu.h installed"

          for hdr in include/kernelsu/core_hook.h include/kernelsu/kernel_compat.h; do
            if [[ -f "$hdr" ]] && ! grep -q 'ksu_cred' "$hdr"; then
              printf '\nextern const struct cred *ksu_cred;\n' >> "$hdr"
              echo "OK [Surgery D]: ksu_cred added to $hdr"
            fi
          done

          FAIL=0
          for f in include/kernelsu/core_hook.h include/kernelsu/kernel_compat.h include/kernelsu/ksu.h; do
            [[ -f "$f" ]] && echo "OK: $f" || { echo "FAIL: missing $f"; FAIL=1; }
          done
          if grep -R '../../drivers/kernelsu' include fs 2>/dev/null; then
            echo "FAIL: stale relative KernelSU paths remain"; FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || { echo "FATAL: KernelSU header surgery failed"; exit 1; }
          echo "OK: KernelSU header surgery complete"

      - name: Inject SUSFS prctl bridge (apply tracked patch if present)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          if [[ -f "patches/0002-add-susfs-prctl-bridge.patch" ]]; then
            git apply --check patches/0002-add-susfs-prctl-bridge.patch || { echo "Patch check failed"; exit 1; }
            git apply patches/0002-add-susfs-prctl-bridge.patch || { echo "Patch apply failed"; exit 1; }
            echo "OK: applied patches/0002-add-susfs-prctl-bridge.patch"
          else
            # Use printf-based Python writer to avoid heredoc parsing issues
            printf '%s\n' \
              'from pathlib import Path' \
              'import re, sys' \
              '' \
              'MARKER = "CHIMERA_MK6R9_SUSFS_PRCTL_BRIDGE"' \
              'susfs_h = Path("include/linux/susfs.h")' \
              'susfs_def = Path("include/linux/susfs_def.h")' \
              'if not susfs_h.exists():' \
              '    print("WARN: include/linux/susfs.h missing — skipping bridge")' \
              '    sys.exit(0)' \
              'scan_src = susfs_def.read_text() if susfs_def.exists() else susfs_h.read_text()' \
              'cmd_ids = re.findall(r"#define\\s+(CMD_SUSFS_\\w+|SUSFS_CMD_\\w+)\\s+(0x[0-9a-fA-F]+|\\d+)", scan_src)' \
              'if not cmd_ids:' \
              '    print("WARN: no CMD_SUSFS_* constants found — bridge skipped")' \
              '    sys.exit(0)' \
              'vals = [int(v,0) for _,v in cmd_ids]' \
              'cmd_min = min(vals); cmd_max = max(vals)' \
              'susfs_c = Path("fs/susfs.c")' \
              'bridge = f"""' \
              '/* Chimera Mk7 SUSFS prctl bridge ({MARKER}) */' \
              '#ifndef {MARKER}' \
              '#define {MARKER} 1' \
              '#ifdef CONFIG_KSU_SUSFS' \
              'int ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2,' \
              '    unsigned long arg3, unsigned long arg4, unsigned long arg5)' \
              '{' \
              '    return -EINVAL;' \
              '}' \
              'EXPORT_SYMBOL_GPL(ksu_susfs_handle_prctl);' \
              '#endif' \
              '#endif' \
              '"""' \
              'if susfs_c.exists():' \
              '    txt = susfs_c.read_text()' \
              '    if MARKER not in txt:' \
              '        susfs_c.write_text(txt + bridge)' \
              '        print("OK: bridge appended to fs/susfs.c")' \
              '    else:' \
              '        print("OK: bridge already present")' \
              'else:' \
              '    print("WARN: fs/susfs.c not present — bridge append skipped")' \
              > /tmp/inject_prctl_bridge.py

            python3 /tmp/inject_prctl_bridge.py
          fi

      - name: Inject weak symbol fallbacks (prefer tracked compat file)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          if [[ -f "kernel/chimera/sus_compat.c" ]]; then
            echo "OK: kernel/chimera/sus_compat.c present — will be built via Makefile fragment"
          else
            # Use printf-based Python writer to avoid heredoc parsing issues
            printf '%s\n' \
              'from pathlib import Path' \
              '' \
              't = Path("fs/sus_su.c")' \
              'if not t.exists():' \
              '    print("INFO: fs/sus_su.c not found — skipping weak fallback injection")' \
              '    raise SystemExit(0)' \
              'content = t.read_text()' \
              'if "WEAK_SYMBOL_FALLBACK" in content:' \
              '    print("OK: weak fallbacks already present (idempotent)")' \
              '    raise SystemExit(0)' \
              'fallback = """' \
              '/* === WEAK_SYMBOL_FALLBACK === */' \
              '#include <linux/cred.h>' \
              '#include <linux/uidgid.h>' \
              '#include <linux/capability.h>' \
              '' \
              '__attribute__((weak)) bool susfs_is_allow_su(void) { return false; }' \
              '' \
              '__attribute__((weak)) void ksu_escape_to_root(void) {' \
              '    struct cred *nc = prepare_creds();' \
              '    if (!nc) return;' \
              '    nc->uid = nc->euid = nc->suid = nc->fsuid = GLOBAL_ROOT_UID;' \
              '    nc->gid = nc->egid = nc->sgid = nc->fsgid = GLOBAL_ROOT_GID;' \
              '    commit_creds(nc);' \
              '}' \
              '/* ========================== */' \
              '"""' \
              't.write_text(content + fallback)' \
              'print("OK: weak symbol fallbacks injected into fs/sus_su.c")' \
              > /tmp/inject_weak_fallbacks.py

            python3 /tmp/inject_weak_fallbacks.py
          fi

      - name: Apply defconfig tuning (FORTe Mode — hardened A16 QPR2 SUSFS profile)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          test -f "$DEFCONFIG" || { echo "ERROR: $DEFCONFIG not found"; exit 1; }
          LOG="../$LOG_DIR/defconfig-forte.log"
          : > "$LOG"

          if [[ -x scripts/config ]]; then
            cfg_tool="./scripts/config"
            echo "INFO: using scripts/config for defconfig edits" | tee -a "$LOG"
            set_cfg() { $cfg_tool --set-val "$1" "${2:-y}"; echo "SET: $1=${2:-y}" | tee -a "$LOG"; }
            enable_cfg() { $cfg_tool --enable "$1"; echo "ENABLE: $1" | tee -a "$LOG"; }
            disable_cfg() { $cfg_tool --disable "$1"; echo "DISABLE: $1" | tee -a "$LOG"; }
            unset_cfg() { $cfg_tool --set-val "$1" "n"; echo "UNSET: $1" | tee -a "$LOG"; }
            probe_kconfig() {
              local sym="${1#CONFIG_}"
              grep -qE "^[[:space:]]*config[[:space:]]+${sym}([[:space:]]|$)" KernelSU-Next/kernel/Kconfig 2>/dev/null \
                || grep -qrE "^[[:space:]]*config[[:space:]]+${sym}([[:space:]]|$)" $(git ls-files '*Kconfig' || echo "") 2>/dev/null
            }
          else
            echo "WARN: scripts/config not found — falling back to sed-based edits" | tee -a "$LOG"
            set_cfg() {
              local k="$1"; local v="${2:-y}"
              sed -i "/^${k}=.*/d" "$DEFCONFIG"
              sed -i "/^# ${k} is not set/d" "$DEFCONFIG"
              echo "${k}=${v}" >> "$DEFCONFIG"
              echo "SET: ${k}=${v}" | tee -a "$LOG"
            }
            unset_cfg() {
              local k="$1"
              sed -i "/^${k}=.*/d" "$DEFCONFIG"
              sed -i "/^# ${k} is not set/d" "$DEFCONFIG"
              echo "# ${k} is not set" >> "$DEFCONFIG"
              echo "UNSET: ${k}" | tee -a "$LOG"
            }
            probe_kconfig() {
              local sym="${1#CONFIG_}"
              grep -qrE "^[[:space:]]*config[[:space:]]+${sym}([[:space:]]|$)" . 2>/dev/null
            }
          fi

          echo "=== FORTe Mode: Defconfig tuning start ===" | tee -a "$LOG"

          set_cfg CONFIG_PREEMPT y
          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY
          unset_cfg CONFIG_HZ_100
          unset_cfg CONFIG_HZ_250
          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300

          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_TCP_CONG_CUBIC y
          sed -i '/CONFIG_DEFAULT_TCP_CONG/d' "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          echo "SET: CONFIG_DEFAULT_TCP_CONG=bbr" | tee -a "$LOG"

          set_cfg CONFIG_SCHED_DEBUG y
          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_CRYPTO_LZ4 y
          set_cfg CONFIG_CRYPTO_LZ4HC y

          set_cfg CONFIG_PRINTK y
          set_cfg CONFIG_PRINTK_SAFE_LOG_BUF y
          set_cfg CONFIG_CONSOLE_LOGLEVEL_DEFAULT 3
          set_cfg CONFIG_MESSAGE_LOGLEVEL_DEFAULT 3
          set_cfg CONFIG_DEFAULT_MESSAGE_LOGLEVEL 3
          unset_cfg CONFIG_PRINTK_TIME
          unset_cfg CONFIG_PRINTK_CALLER
          unset_cfg CONFIG_DYNAMIC_DEBUG
          unset_cfg CONFIG_DYNAMIC_DEBUG_CORE
          unset_cfg CONFIG_DEBUG_FS
          set_cfg CONFIG_LOG_BUF_SHIFT 18

          unset_cfg CONFIG_CC_STACKPROTECTOR_STRONG
          unset_cfg CONFIG_CC_STACKPROTECTOR_REGULAR
          set_cfg CONFIG_CC_STACKPROTECTOR_NONE y
          unset_cfg CONFIG_LOCALVERSION_AUTO

          set_cfg CONFIG_BPF_SYSCALL y
          set_cfg CONFIG_CGROUP_BPF y
          set_cfg CONFIG_NET_CLS_BPF y
          set_cfg CONFIG_FUSE_FS y
          set_cfg CONFIG_OVERLAY_FS y
          set_cfg CONFIG_ANDROID_BINDER_IPC y
          set_cfg CONFIG_ANDROID_BINDERFS y
          sed -i '/CONFIG_ANDROID_BINDER_DEVICES/d' "$DEFCONFIG"
          echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> "$DEFCONFIG"
          unset_cfg CONFIG_ANDROID_BINDER_IPC_SELFTEST
          set_cfg CONFIG_MEMCG y
          set_cfg CONFIG_MEMCG_SWAP y
          set_cfg CONFIG_PSI y
          set_cfg CONFIG_CGROUPS y
          set_cfg CONFIG_CGROUP_SCHED y
          set_cfg CONFIG_FAIR_GROUP_SCHED y
          set_cfg CONFIG_RT_GROUP_SCHED y
          set_cfg CONFIG_NET_CLS_CGROUP y
          set_cfg CONFIG_NETFILTER_XT_MATCH_CGROUP y
          set_cfg CONFIG_VETH y
          set_cfg CONFIG_IKCONFIG y
          set_cfg CONFIG_IKCONFIG_PROC y
          set_cfg CONFIG_PROC_EVENTS y

          set_cfg CONFIG_SECURITY_SELINUX_DEVELOP y
          set_cfg CONFIG_SECURITY_SELINUX_BOOTPARAM y

          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y

          if probe_kconfig CONFIG_KSU_SUSFS_SUS_MAP; then
            set_cfg CONFIG_KSU_SUSFS_SUS_MAP y
          else
            echo "SKIP: SUS_MAP not present in tree" | tee -a "$LOG"
          fi

          if probe_kconfig CONFIG_KSU_SUSFS_SPOOF_UNAME; then
            set_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME y
          else
            echo "SKIP: SPOOF_UNAME not present in tree" | tee -a "$LOG"
          fi

          if probe_kconfig CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL; then
            set_cfg CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL y
          else
            echo "SKIP: HIDE_MAGISK_EVIL not present in tree" | tee -a "$LOG"
          fi

          if probe_kconfig CONFIG_KSU_SUSFS_SPOOF_SELINUX; then
            set_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX y
            echo "INFO: Enabled SUSFS SELinux Spoofing" | tee -a "$LOG"
          else
            echo "SKIP: SPOOF_SELINUX not present in tree" | tee -a "$LOG"
          fi

          if probe_kconfig CONFIG_KSU_SUSFS_ENABLE_AVC_SPOOF; then
            set_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_SPOOF y
            echo "INFO: Enabled SUSFS AVC Spoofing" | tee -a "$LOG"
          fi

          if grep -qr 'config LRU_GEN' mm/ 2>/dev/null; then
            set_cfg CONFIG_LRU_GEN y
            set_cfg CONFIG_LRU_GEN_ENABLED y
            set_cfg CONFIG_LRU_GEN_STATS y
            echo "INFO: MGLRU enabled" | tee -a "$LOG"
          fi

          echo "=== FORTe Mode: Summary ===" | tee -a "$LOG"
          grep -E "^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_PREEMPT|CONFIG_HZ|CONFIG_TCP_CONG|CONFIG_BPF|CONFIG_CGROUP|CONFIG_BINDER|CONFIG_MEMCG|CONFIG_PSI|CONFIG_NET_CLS|CONFIG_FUSE|CONFIG_OVERLAY)" "$DEFCONFIG" | tee -a "$LOG"
          echo "=== FORTe Mode complete ===" | tee -a "$LOG"

      - name: Run integration script if present (preferred) or fallback to inline
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/integration.log"
          : > "$LOG"
          if [[ -x scripts/integration_and_tuning.sh ]]; then
            echo "Running tracked scripts/integration_and_tuning.sh" | tee -a "$LOG"
            chmod +x scripts/integration_and_tuning.sh
            ./scripts/integration_and_tuning.sh 2>&1 | tee -a "$LOG"
          else
            echo "No integration script found; continuing with inlined minimal checks" | tee -a "$LOG"
            make O="$GITHUB_WORKSPACE/$OUT_DIR" olddefconfig 2>&1 | tee -a "$LOG" || true
          fi

      - name: Validate integration by building small target (drivers/kernelsu)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          CC="$GITHUB_WORKSPACE/aosp-clang/bin/clang"
          make -j2 O="$GITHUB_WORKSPACE/$OUT_DIR" ARCH=arm64 SUBARCH=arm64 LLVM=1 CC="$CC" drivers/kernelsu 2>&1 | tee "$LOG_DIR/validate-kernelsu.log" || { echo "Validation build failed"; exit 1; }
          echo "Validation build succeeded" | tee -a "$LOG_DIR/validate-kernelsu.log"

      - name: Dry run summary
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo "========================================"
          echo "  Chimera Mk7 Forte v3 — dry run PASSED"
          echo "  Re-run with dry_run=false to compile and package."
          echo "========================================"

      - name: Build kernel (full)
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: kernel
        env:
          PATH: ${{ github.workspace }}/aosp-clang/bin:${PATH}
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          export KBUILD_BUILD_USER="$BUILD_USER"
          export KBUILD_BUILD_HOST="$BUILD_HOST"
          CLANG_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/clang"
          LD_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/ld.lld"
          AR_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-ar"
          NM_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-nm"
          OBJCOPY_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-objcopy"
          OBJDUMP_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-objdump"
          STRIP_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-strip"
          make -j"$(nproc)" O="$GITHUB_WORKSPACE/$OUT_DIR" ARCH=arm64 SUBARCH=arm64 \
            LLVM=1 LLVM_IAS=0 CC="$CLANG_BIN" HOSTCC=gcc HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD="$LD_BIN" AR="$AR_BIN" NM="$NM_BIN" \
            OBJCOPY="$OBJCOPY_BIN" OBJDUMP="$OBJDUMP_BIN" STRIP="$STRIP_BIN" \
            LOCALVERSION="$BRAND" KBUILD_BUILD_USER="$BUILD_USER" KBUILD_BUILD_HOST="$BUILD_HOST" \
            KCFLAGS="-O2 -fcommon -fno-strict-aliasing -Wno-error" \
            "$DEFCONFIG"
          cp "$GITHUB_WORKSPACE/$OUT_DIR/.config" "$GITHUB_WORKSPACE/$LOG_DIR/final.config"
          make -j"$(nproc)" O="$GITHUB_WORKSPACE/$OUT_DIR" Image dtbs 2>&1 | tee kernel/build.log
          test -f "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" || { echo "ERROR: Image not produced"; exit 1; }

      - name: Package flashable zip
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          find "$OUT_DIR/arch/arm64/boot/dts/exynos" -name '*star2lte*.dtb' -exec cp {} AnyKernel3/ \; 2>/dev/null || true
          ZIP="chimera-mk7-forte-v3-AOSPClang21.0-$(date +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}.zip"
          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '*.git*' ) || { echo "ERROR: zip failed"; exit 1; }
          echo "ZIP=$ZIP" >> "$LOG_DIR/branding.env"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          du -h "$ZIP"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk7-forte-v3-logs-${{ github.run_number }}'
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload flashable zip
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk7-forte-v3-AOSPClang21.0-${{ github.run_number }}'
          path: chimera-mk7-forte-v3-AOSPClang21.0-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (optional)
        if: ${{ inputs.do_release == 'true' && inputs.dry_run == 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'chimera-mk7-forte-v3-${{ github.run_number }}'
          name: "Project Chimera Mk7 Forte v3 — Build #${{ github.run_number }}"
          body: |
            Release created by CI. See attached artifact for flashable zip.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
