name: Project Chimera Mk6r5 — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      susfs_mode:
        description: "SUSFS mode: avc_safe (Android 16, safe) | none (KSU-only, no SUSFS)"
        required: true
        type: choice
        options:
          - "avc_safe"
          - "none"
        default: "avc_safe"
      force_selinux_enforcing:
        description: "Lock SELinux enforcing at kernel level (removes setenforce 0 capability)"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Allow patching even if KSU/SUSFS already present in tree"
        required: false
        type: boolean
        default: false
      enable_zeromount:
        description: "Enable ZeroMount compatibility probe"
        required: false
        type: boolean
        default: true
      enable_susfs_open_redirect:
        description: "[avc_safe only] Enable SUSFS OPEN_REDIRECT"
        required: false
        type: boolean
        default: true
      enable_susfs_hide_symbols:
        description: "[avc_safe only] Enable SUSFS symbol hiding"
        required: false
        type: boolean
        default: true
      enable_susfs_try_umount:
        description: "[avc_safe only] Enable SUSFS TRY_UMOUNT"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk6r5
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      # Opt into Node.js 24 for all actions (avoids June 2026 forced migration noise)
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      KERNEL_REPO:   "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6"
      SUSFS_REPO:    "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH:  "kernel-4.9"
      KERNEL_DIR:    "kernel"
      OUT_DIR:       "kernel-out"
      LOG_DIR:       "logs"
      NEUTRON_URL:   "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY:   "neutron-clang-10032024-pinned-v1"

    steps:

      # ── 0. Workspace ────────────────────────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"
          echo "susfs_mode=${{ inputs.susfs_mode }}"                             | tee    "$LOG_DIR/build-inputs.log"
          echo "force_selinux_enforcing=${{ inputs.force_selinux_enforcing }}"   | tee -a "$LOG_DIR/build-inputs.log"
          echo "dry_run=${{ inputs.dry_run }}"                                   | tee -a "$LOG_DIR/build-inputs.log"
          echo "force_repatch=${{ inputs.force_repatch }}"                       | tee -a "$LOG_DIR/build-inputs.log"

      # ── 1. Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 python3-pip \
            libssl-dev libelf-dev build-essential zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ── 2. Neutron Clang ────────────────────────────────────────────────────
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p neutron-clang
          echo "Downloading pinned Neutron Clang: $NEUTRON_URL" | tee "$LOG_DIR/toolchain.log"
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          test -x neutron-clang/bin/clang || { echo "ERROR: clang binary missing"; exit 1; }
          neutron-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ── 3. Clone kernel ─────────────────────────────────────────────────────
      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log --oneline -3 | tee "$LOG_DIR/kernel-revision.log"

      # ── 4. Clone SUSFS (skipped when susfs_mode=none) ───────────────────────
      - name: Clone SUSFS
        if: ${{ inputs.susfs_mode != 'none' }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/fs/sus_su.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/susfs_def.h
          test -f susfs4ksu/kernel_patches/include/linux/sus_su.h
          git -C susfs4ksu rev-parse HEAD | tee "$LOG_DIR/susfs-revision.log"

      # ── 5. KernelSU-Next pinned submodule ───────────────────────────────────
      - name: Set up KernelSU-Next (pinned submodule)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          git rm -r --cached KernelSU-Next 2>/dev/null || true
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu

          KSU_URL="$(git config --file .gitmodules submodule.KernelSU-Next.url 2>/dev/null || true)"
          KSU_COMMIT="$(git ls-tree HEAD KernelSU-Next 2>/dev/null | awk '{print $3}' || true)"

          echo "Submodule URL: ${KSU_URL:-not found}" | tee "../$LOG_DIR/ksu-submodule.log"
          echo "Pinned commit: ${KSU_COMMIT:-not found}" | tee -a "../$LOG_DIR/ksu-submodule.log"

          if [[ -n "$KSU_URL" && -n "$KSU_COMMIT" ]]; then
            git clone "$KSU_URL" KernelSU-Next
            git -C KernelSU-Next checkout "$KSU_COMMIT"
          elif [[ -n "$KSU_URL" ]]; then
            git clone --depth=1 "$KSU_URL" KernelSU-Next
          else
            git clone --depth=1 https://github.com/gavdoc38/KernelSU-Next.git KernelSU-Next
          fi

          test -f KernelSU-Next/kernel/Kconfig || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }
          git -C KernelSU-Next log --oneline -1 | tee -a "../$LOG_DIR/ksu-submodule.log"
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || { echo "ERROR: drivers/kernelsu/Kconfig symlink missing"; exit 1; }

      # ── 5b. Fix syscall_fn_t for Samsung 4.9 BSP ───────────────────────────
      - name: Fix syscall_fn_t for Samsung 4.9 BSP
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"
          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            echo "syscall_fn_t: nothing to fix"; exit 0
          fi

          cat > /tmp/fix_syscall_typedef.py <<'PYEOF'
          from pathlib import Path
          import re

          path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")
          if not path.exists():
              raise SystemExit(0)

          content = path.read_text()
          typedef_block = (
              "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\n"
              "typedef long (*syscall_fn_t)(\n"
              "    unsigned long, unsigned long, unsigned long,\n"
              "    unsigned long, unsigned long, unsigned long\n"
              ");\n\n"
          )
          pos = 0
          for match in re.finditer(r'^#(include|pragma|ifndef|define)[^\n]*\n', content, re.MULTILINE):
              pos = match.end()
          if "typedef long (*syscall_fn_t)" not in content:
              content = content[:pos] + typedef_block + content[pos:]
              path.write_text(content)
              print("OK: typedef injected")
          else:
              print("OK: typedef already present")
          PYEOF
          python3 /tmp/fix_syscall_typedef.py

      # ── 5c. Pre-patch audit ─────────────────────────────────────────────────
      # Captures exact source patterns before patching. Essential for §1-§3 debugging.
      - name: Pre-patch rate_limit audit
        working-directory: kernel
        run: |
          {
            echo "=== cpufreq_schedutil.c — rate_limit + scheduler + sugov_update_rate_limit_us ==="
            grep -n "rate_limit\|SCHED_FIFO\|SCHED_RR\|sched_priority\|MAX_USER_RT_PRIO\|MAX_RT_PRIO\|sugov_update_rate_limit" \
              kernel/sched/cpufreq_schedutil.c 2>/dev/null || echo "(not found)"
            echo "=== exynos-acme.c — rate_limit ==="
            grep -n "rate_limit\|RATE_LIMIT\|5000\|up_rate\|down_rate" \
              drivers/cpufreq/exynos-acme.c 2>/dev/null || echo "(not found)"
            echo "=== exynos-ufc.c — notifier ==="
            grep -n "cpufreq_register_notifier\|ufc_notifier" \
              drivers/cpufreq/exynos-ufc.c 2>/dev/null || echo "(not found)"
            echo "=== MMC read_ahead candidates ==="
            grep -rn "read_ahead\|ra_pages\|VM_READAHEAD" \
              drivers/mmc/ include/linux/mm.h 2>/dev/null | grep -v "\.o:" || echo "(not found)"
          } | tee "../$LOG_DIR/prepatch-audit.log"

      # ── 6. Brain Core kernel hardening patches (§1–§8) ──────────────────────
      # §1: Patterns A-F cover all Samsung BSP rate_limit assignment forms.
      # §2: Both sg_policy->thread (upstream) and bare thread (Samsung BSP).
      # §3b: sugov_update_rate_limit_us runtime clamp — FIXED: now C89-safe by
      #      injecting after variable declarations, with dynamic param name
      #      extraction from the actual function signature.
      - name: Apply Brain Core kernel hardening patches
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/braincore-patches.log"
          echo "=== Brain Core kernel hardening — Chimera Mk6r5 ===" | tee "$LOG"

          # ── §1 rate limits + §2 sugov priority ─────────────────────────────
          cat > /tmp/patch_schedutil.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("kernel/sched/cpufreq_schedutil.c")
          if not f.exists():
              print("WARN: cpufreq_schedutil.c not found — skipping §1+§2")
              sys.exit(0)

          content = f.read_text()
          original = content
          MARKER = "Chimera Mk6r5 §1"
          if MARKER in content:
              print("OK: §1+§2 already patched (idempotent)")
              for ln, line in enumerate(content.splitlines(), 1):
                  if 'Chimera Mk6r5 §1' in line or 'Chimera Mk6r5 §2' in line:
                      print(f"  line {ln}: {line.strip()}")
              sys.exit(0)

          # §1 Pattern A+B: literal 0 or 5000 (upstream)
          content = re.sub(r'(tunables->up_rate_limit_us\s*=\s*)(0|5000)\s*;',
                           r'\g<1>1500;  /* Chimera Mk6r5 §1 */', content)
          content = re.sub(r'(tunables->down_rate_limit_us\s*=\s*)(0|5000)\s*;',
                           r'\g<1>16000;  /* Chimera Mk6r5 §1 */', content)
          # §1 Pattern C: clamp_val dynamic assignment
          content = re.sub(r'tunables->up_rate_limit_us\s*=[^;]*clamp_val[^;]+;',
                           'tunables->up_rate_limit_us = 1500;  /* Chimera Mk6r5 §1 */',
                           content, flags=re.DOTALL)
          content = re.sub(r'tunables->down_rate_limit_us\s*=[^;]*clamp_val[^;]+;',
                           'tunables->down_rate_limit_us = 16000;  /* Chimera Mk6r5 §1 */',
                           content, flags=re.DOTALL)
          # §1 Pattern D: policy->transition_delay (Samsung BSP — confirmed run-35 audit)
          content = re.sub(r'(tunables->up_rate_limit_us\s*=\s*)policy->up_transition_delay_us(\s*;)',
                           r'\g<1>1500\2  /* Chimera Mk6r5 §1 */', content)
          content = re.sub(r'(tunables->down_rate_limit_us\s*=\s*)policy->down_transition_delay_us(\s*;)',
                           r'\g<1>16000\2  /* Chimera Mk6r5 §1 */', content)
          # §1 Pattern E: LATENCY_MULTIPLIER fallback (confirmed run-35 audit)
          content = re.sub(r'(tunables->up_rate_limit_us\s*=\s*)LATENCY_MULTIPLIER(\s*;)',
                           r'\g<1>1500\2  /* Chimera Mk6r5 §1 */', content)
          content = re.sub(r'(tunables->down_rate_limit_us\s*=\s*)LATENCY_MULTIPLIER(\s*;)',
                           r'\g<1>16000\2  /* Chimera Mk6r5 §1 */', content)
          # §1 Pattern F: *= lat multiplier — comment out
          content = re.sub(r'tunables->up_rate_limit_us\s*\*=\s*lat\s*;',
                           '/* tunables->up_rate_limit_us *= lat; -- Chimera Mk6r5 §1: fixed at 1500 */',
                           content)
          content = re.sub(r'tunables->down_rate_limit_us\s*\*=\s*lat\s*;',
                           '/* tunables->down_rate_limit_us *= lat; -- Chimera Mk6r5 §1: fixed at 16000 */',
                           content)
          # §2 Pattern A: MAX_RT_PRIO - 1 (upstream vanilla 4.9)
          content = re.sub(r'(param\.sched_priority\s*=\s*)MAX_RT_PRIO\s*-\s*1(\s*;)',
                           r'\g<1>1\2  /* Chimera Mk6r5 §2: p=1 */', content)
          # §2 Pattern B: MAX_USER_RT_PRIO / 2 (Samsung BSP — confirmed run-25 audit)
          content = re.sub(r'([\{]?\s*\.sched_priority\s*=\s*)MAX_USER_RT_PRIO\s*/\s*2(\s*[\}]?\s*;)',
                           r'\g<1>1\2  /* Chimera Mk6r5 §2: p=1 */', content)
          # §2 Pattern A: sg_policy->thread (upstream KernelSU variant)
          content = re.sub(r'(sched_setscheduler_nocheck\s*\(\s*sg_policy->thread\s*,\s*)SCHED_FIFO(\s*,)',
                           r'\g<1>SCHED_RR\2  /* Chimera Mk6r5 §2 */', content)
          # §2 Pattern B: bare thread (Samsung BSP — confirmed run-25 audit)
          content = re.sub(r'(sched_setscheduler_nocheck\s*\(\s*thread\s*,\s*)SCHED_FIFO(\s*,)',
                           r'\g<1>SCHED_RR\2  /* Chimera Mk6r5 §2 */', content)

          f.write_text(content)
          if content != original:
              print("OK: cpufreq_schedutil.c — §1 rate limits (1500/16000us) + §2 priority (SCHED_RR p=1) applied")
              for ln, line in enumerate(content.splitlines(), 1):
                  if 'Chimera Mk6r5 §1' in line or 'Chimera Mk6r5 §2' in line:
                      print(f"  line {ln}: {line.strip()}")
          else:
              print("WARN: cpufreq_schedutil.c — no patterns matched; check prepatch-audit.log")
          PYEOF
          python3 /tmp/patch_schedutil.py | tee -a "$LOG"

          # ── §3: Samsung UFC/ACME disarmament ────────────────────────────────
          cat > /tmp/patch_ufc_acme.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          patched_any = False

          for cand in ["drivers/cpufreq/exynos-ufc.c", "drivers/cpufreq/exynos-cpu_dvfs.c"]:
              f = Path(cand)
              if not f.exists():
                  continue
              content = f.read_text()
              orig = content
              content = re.sub(
                  r'(cpufreq_register_notifier\s*\(\s*&exynos_ufc_notifier\s*,\s*CPUFREQ_POLICY_NOTIFIER\s*\)\s*;)',
                  r'/* UFC_DISABLED_CHIMERA_Mk6r5: \1 */',
                  content
              )
              if content != orig:
                  f.write_text(content)
                  print(f"OK: {cand} — UFC notifier disabled (§3)")
                  patched_any = True

          acme = Path("drivers/cpufreq/exynos-acme.c")
          if acme.exists():
              content = acme.read_text()
              orig = content
              content = re.sub(r'((?:->|\.)\s*(?:up|down)_rate_limit_us\s*=\s*)5000\s*;',
                               r'\g<1>0;  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'((?:->|\.)\s*up_rate_limit_us\s*=\s*)(?!1500|0)(\d+)\s*;',
                               r'\g<1>1500;  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'((?:->|\.)\s*down_rate_limit_us\s*=\s*)(?!16000|0)(\d+)\s*;',
                               r'\g<1>16000;  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'(#define\s+\w*(?:UP|up)\w*RATE\w*\s+)5000\b',
                               r'\g<1>1500  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'(#define\s+\w*(?:DOWN|down)\w*RATE\w*\s+)5000\b',
                               r'\g<1>16000  /* Chimera Mk6r5 §3 */', content)
              acme.write_text(content)
              if content != orig:
                  print("OK: exynos-acme.c — rate_limit 5000 patched (§3-ACME)")
                  patched_any = True

          cpufreq_dir = Path("drivers/cpufreq")
          if cpufreq_dir.exists():
              for cf in cpufreq_dir.glob("exynos*.c"):
                  if cf.name in ["exynos-ufc.c", "exynos-acme.c"]:
                      continue
                  text = cf.read_text()
                  orig = text
                  text = re.sub(r'((?:->|\.)\s*(?:up|down)_rate_limit_us\s*=\s*)5000\s*;',
                                r'\g<1>0;  /* Chimera Mk6r5 §3-scan */', text)
                  if text != orig:
                      cf.write_text(text)
                      print(f"OK: {cf.name} — rate_limit 5000 patched (§3-scan)")
                      patched_any = True

          if not patched_any:
              print("INFO: §3 — No UFC/ACME/rate_limit 5000 patterns found (ACME not in this tree)")
          PYEOF
          python3 /tmp/patch_ufc_acme.py | tee -a "$LOG"

          # ── §3b: Clamp sugov_update_rate_limit_us runtime override path ──────
          # FIXED from run-36: previous injection landed before local variable
          # declarations, causing C89 "mixing declarations and code" error.
          #
          # Root cause: re.sub injected right after the function opening {, but
          # Samsung BSP has `struct sugov_policy *sg_policy;` and other declarations
          # immediately after { — those must precede all executable code in C89.
          #
          # Fix: dynamically extract actual parameter names from the function
          # signature, then walk past all declarations to find the first executable
          # statement and inject the clamp there (fully C89-safe).
          cat > /tmp/patch_sugov_clamp.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("kernel/sched/cpufreq_schedutil.c")
          if not f.exists():
              print("INFO: §3b — cpufreq_schedutil.c not found, skipping")
              sys.exit(0)

          content = f.read_text()
          CLAMP_MARKER = "CHIMERA_MK6R5_SUGOV_CLAMP"

          if CLAMP_MARKER in content:
              print("OK: §3b sugov clamp already present (idempotent)")
              sys.exit(0)

          # Match any return type variant: void, static void, static int, etc.
          func_pat = re.compile(
              r'(?:static\s+)?(?:\w+\s+)?sugov_update_rate_limit_us\s*\(([^)]*)\)\s*\{',
              re.DOTALL
          )
          m = func_pat.search(content)
          if not m:
              print("INFO: §3b — sugov_update_rate_limit_us not found (may not exist in this BSP)")
              sys.exit(0)

          # Extract ACTUAL parameter names for the rate limits from the function signature.
          # Previous version hardcoded 'up_rate_limit' / 'down_rate_limit' which did not
          # match Samsung BSP parameter names, causing additional undefined-variable errors.
          params_text    = m.group(1)
          all_uint_params = re.findall(r'unsigned\s+int\s+(\w+)', params_text)
          up_param   = next((p for p in all_uint_params if 'up'   in p.lower()), None)
          down_param = next((p for p in all_uint_params if 'down' in p.lower()), None)

          if not up_param or not down_param:
              print(f"WARN: §3b — cannot resolve param names from: {params_text[:200]}")
              print(f"      Found unsigned int params: {all_uint_params}")
              print("      Skipping clamp — §1 init values are the only guard")
              sys.exit(0)

          print(f"INFO: §3b — resolved params: up_param={up_param}, down_param={down_param}")

          # Find insertion point AFTER all variable declarations.
          # C89 (which Samsung BSP enforces with -Werror) requires all declarations
          # to precede executable statements within a block.
          body_start = m.end()
          rest       = content[body_start:]
          lines      = rest.split('\n')

          # A line is a declaration if it starts (after whitespace) with a C type keyword.
          DECL_RE = re.compile(
              r'^\s+(?:const\s+)?(?:volatile\s+)?(?:static\s+)?'
              r'(?:struct|union|enum|unsigned|signed|int|char|long|short|bool|void\s*\*|'
              r'u8|u16|u32|u64|s8|s16|s32|s64|__[us]\d+|__be\d+|__le\d+|'
              r'size_t|ssize_t|ktime_t|cpumask_t)\b'
          )

          chars = 0
          for line in lines:
              stripped = line.strip()
              # Skip blank lines, comments, and variable declarations
              if (not stripped
                      or stripped.startswith('//')
                      or stripped.startswith('/*')
                      or stripped.startswith('*')
                      or DECL_RE.match(line)):
                  chars += len(line) + 1
              else:
                  break

          insert_pos = body_start + chars

          clamp_code = (
              f"\n\t/* {CLAMP_MARKER}: clamp runtime rate overrides to §1 baked values */\n"
              f"\tif ({up_param}   > 1500)  {up_param}   = 1500;\n"
              f"\tif ({down_param} > 16000) {down_param} = 16000;\n"
          )

          new_content = content[:insert_pos] + clamp_code + content[insert_pos:]
          f.write_text(new_content)
          print(f"OK: §3b — {up_param}<=1500, {down_param}<=16000 clamped — C89-safe (after declarations)")
          PYEOF
          python3 /tmp/patch_sugov_clamp.py | tee -a "$LOG"

          # ── §4: CFS scheduler latency tuning ────────────────────────────────
          cat > /tmp/patch_cfs.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("kernel/sched/fair.c")
          if not f.exists():
              print("INFO: §4 — fair.c not found, skipping"); sys.exit(0)

          content = f.read_text()
          original = content

          if "Chimera Mk6r5 §4" in content:
              print("OK: §4 CFS already patched (idempotent)"); sys.exit(0)

          replacements = [
              (r'(unsigned int\s+sysctl_sched_latency\s*=\s*)\d+ULL(\s*;)',
               r'\g<1>6000000ULL\2  /* Chimera Mk6r5 §4: 6ms */'),
              (r'(unsigned int\s+sysctl_sched_min_granularity\s*=\s*)\d+ULL(\s*;)',
               r'\g<1>750000ULL\2  /* Chimera Mk6r5 §4: 750us */'),
              (r'(unsigned int\s+sysctl_sched_wakeup_granularity\s*=\s*)\d+ULL(\s*;)',
               r'\g<1>1000000ULL\2  /* Chimera Mk6r5 §4: 1ms */'),
              (r'(unsigned int\s+sysctl_sched_migration_cost\s*=\s*)\d+ULL(\s*;)',
               r'\g<1>5000000ULL\2  /* Chimera Mk6r5 §4: 5ms big.LITTLE */'),
          ]
          for pattern, replacement in replacements:
              content = re.sub(pattern, replacement, content)

          f.write_text(content)
          if content != original:
              print("OK: kernel/sched/fair.c — CFS latency tuned (§4)")
          else:
              print("INFO: §4 — fair.c values already match or patterns differ")
          PYEOF
          python3 /tmp/patch_cfs.py | tee -a "$LOG"

          # ── §5: mmcblk0 read_ahead 1024kb -> 128kb ──────────────────────────
          cat > /tmp/patch_mmc.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          patched = False

          for root in ["drivers/mmc/", "drivers/samsung/mmc/", "drivers/samsung/"]:
              p = Path(root)
              if not p.exists(): continue
              for f in p.rglob("*.c"):
                  content = f.read_text()
                  orig = content
                  content = re.sub(r'(blk_queue_read_ahead\s*\([^,]+,\s*)1024(\s*\))',
                                   r'\g<1>128\2', content)
                  content = re.sub(r'((?:->|\.)\s*(?:ra_pages|queue_ra_pages)\s*=\s*)256(\s*(?:;|,|\}))',
                                   r'\g<1>32\2', content)
                  content = re.sub(r'(read_ahead_kb\s*=\s*)1024(\b)', r'\g<1>128\2', content)
                  if content != orig:
                      f.write_text(content)
                      print(f"OK: {f} — read_ahead patched to 128kb (§5)")
                      patched = True

          for cand in ["drivers/mmc/core/block.c", "drivers/mmc/core/queue.c",
                       "drivers/mmc/core/mmc.c",   "drivers/mmc/card/queue.c"]:
              f = Path(cand)
              if not f.exists(): continue
              content = f.read_text()
              orig = content
              content = re.sub(r'(blk_queue_read_ahead\s*\([^,]+,\s*)1024(\s*\))', r'\g<1>128\2', content)
              content = re.sub(r'((?:->|\.)\s*(?:ra_pages|queue_ra_pages)\s*=\s*)256(\s*;)', r'\g<1>32\2', content)
              if content != orig:
                  f.write_text(content)
                  print(f"OK: {cand} — read_ahead patched to 128kb (§5)")
                  patched = True

          mm_h = Path("include/linux/mm.h")
          if mm_h.exists():
              content = mm_h.read_text()
              orig = content
              content = re.sub(r'(#define\s+VM_READAHEAD_PAGES\s+)256\b', r'\g<1>32', content)
              if content != orig:
                  mm_h.write_text(content)
                  print("OK: include/linux/mm.h — VM_READAHEAD_PAGES 256->32 (§5)")
                  patched = True
              else:
                  m = re.search(r'#define\s+VM_READAHEAD_PAGES\s+(\S+)', content)
                  if m: print(f"INFO: VM_READAHEAD_PAGES = {m.group(1)} (no change needed)")

          if not patched:
              print("WARN: §5 mmcblk0 — no read_ahead patterns found; Brain Core re-assertion is the runtime fix")
          PYEOF
          python3 /tmp/patch_mmc.py | tee -a "$LOG"

          # ── §5b: ZRAM default lzo -> lz4 ────────────────────────────────────
          cat > /tmp/patch_zram.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("drivers/block/zram/zram_drv.c")
          if not f.exists():
              print("INFO: §5b — zram_drv.c not found, skipping"); sys.exit(0)

          content = f.read_text()
          orig = content
          content = re.sub(r'(#define\s+ZRAM_DEF_COMP_ALGORITHM\s+)"lzo"', r'\1"lz4"', content)
          f.write_text(content)
          if content != orig:
              print("OK: zram_drv.c — default algorithm changed to lz4 (§5b)")
          else:
              print("INFO: §5b — lzo not found or already lz4")
          PYEOF
          python3 /tmp/patch_zram.py | tee -a "$LOG"

          # ── §7: EMS ontime thresholds (Samsung-specific, may not be present) ─
          cat > /tmp/patch_ems.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          patched = False
          for cand in ["kernel/sched/ems/ontime.c", "kernel/sched/ems/tune.c"]:
              f = Path(cand)
              if not f.exists(): continue
              content = f.read_text()
              orig = content
              content = re.sub(r'(static\s+int\s+up_threshold\s*=\s*)\d+(\s*;)', r'\g<1>700\2', content)
              content = re.sub(r'(static\s+int\s+down_threshold\s*=\s*)\d+(\s*;)', r'\g<1>200\2', content)
              if content != orig:
                  f.write_text(content)
                  print(f"OK: {cand} — EMS ontime thresholds patched (§7)")
                  patched = True

          if not patched:
              print("INFO: §7 — EMS not present in this tree (expected for gavdoc38 fork)")
          PYEOF
          python3 /tmp/patch_ems.py | tee -a "$LOG"

          # ── §8: Thermal trip points ──────────────────────────────────────────
          cat > /tmp/patch_thermal.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          dts_root = Path("arch/arm64/boot/dts/exynos")
          if not dts_root.exists():
              print("INFO: §8 — DTS path not found, skipping"); sys.exit(0)

          thermal_files = (
              list(dts_root.glob("*star2lte*.dts")) +
              list(dts_root.glob("*thermal*.dtsi")) +
              list(dts_root.glob("*tmu*.dtsi")) +
              list(dts_root.glob("*thermal*.dts"))
          )

          patched = False
          for tf in thermal_files:
              content = tf.read_text()
              orig = content
              content = re.sub(
                  r'(temperature\s*=\s*<)65000(>\s*;(\s*\n\s*)hysteresis\s*=\s*<)2000(>)',
                  r'\g<1>70000\g<2>3000\g<4>',
                  content
              )
              if content != orig:
                  tf.write_text(content)
                  print(f"OK: {tf.name} — passive trip 65C->70C, hysteresis 2C->3C (§8)")
                  patched = True

          if not patched:
              print("INFO: §8 — no matching 65000 passive trip found in DTS")
          PYEOF
          python3 /tmp/patch_thermal.py | tee -a "$LOG"

          echo "" | tee -a "$LOG"
          echo "=== Brain Core patching summary ===" | tee -a "$LOG"
          OK_COUNT=$(grep -c "^OK:" "$LOG" || true)
          printf "  %s patches applied\n" "$OK_COUNT" | tee -a "$LOG"
          grep "^WARN:" "$LOG" | tee -a "$LOG" || true

      # ── 7. Disable SCM dirty suffix (placeholder) ───────────────────────────
      # Step 14 (branding) writes the final brand string into setlocalversion.
      # This placeholder ensures the file is executable and clean before that.
      - name: Disable SCM dirty suffix (placeholder)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          printf '#!/bin/sh\n# placeholder — overwritten by branding step\nprintf ""\n' \
            > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "OK: setlocalversion placeholder written" | tee "../$LOG_DIR/scm-dirty-fix.log"

      # ── 8. Preflight tree state ──────────────────────────────────────────────
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          echo "=== git status ===" | tee "../$LOG_DIR/preflight.log"
          git status --short | tee -a "../$LOG_DIR/preflight.log"

          echo "=== KSU/SUSFS markers ===" | tee -a "../$LOG_DIR/preflight.log"
          grep -RsnE \
            'KernelSU|kernelsu|CONFIG_KSU|KSU_SUSFS|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs 2>/dev/null \
            | tee -a "../$LOG_DIR/preflight.log" || true

          ALREADY_PATCHED=false
          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi

          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "../$LOG_DIR/preflight.log"

          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ── 9. Wire KernelSU Kconfig ────────────────────────────────────────────
      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: Expected 1 Kconfig entry, found $COUNT"; exit 1; }

      # ── 10. Apply SUSFS patch ────────────────────────────────────────────────
      - name: Apply SUSFS patch
        if: ${{ env.SKIP_INTEGRATION == 'false' && inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"
          set +e
          git apply --reject --whitespace=fix "$PATCH" > "../$LOG_DIR/susfs-apply.log" 2>&1
          APPLY_RC=$?
          set -e
          find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log" || true
          echo "Apply RC=$APPLY_RC" | tee -a "../$LOG_DIR/susfs-apply.log"

      # ── 11a. SUSFS file guarantee (no-downgrade) ─────────────────────────────
      # Only installs MISSING files — preserves existing newer versions.
      # sus_su.h is included by fs/sus_su.c at line 8; MUST be present.
      - name: Guarantee SUSFS files present (no-downgrade)
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-files-guarantee.log"
          echo "=== SUSFS file guarantee — install-only-if-missing ===" | tee "$LOG"

          SUSFS_PATCHES="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"

          for src_dst in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do
            SRC="${src_dst%%:*}"; DST="${src_dst##*:}"
            if [[ ! -f "$DST" ]]; then
              install -m 0644 "$SUSFS_PATCHES/$SRC" "$DST"
              echo "OK: installed missing $DST" | tee -a "$LOG"
            else
              echo "INFO: $DST already present ($(wc -l < "$DST") lines) — preserving (no downgrade)" | tee -a "$LOG"
            fi
          done

          for hdr in \
            "include/linux/susfs.h" \
            "include/linux/susfs_def.h" \
            "include/linux/sus_su.h"; do
            if [[ ! -f "$hdr" ]]; then
              PATCH_SRC="$SUSFS_PATCHES/$hdr"
              if [[ -f "$PATCH_SRC" ]]; then
                install -m 0644 "$PATCH_SRC" "$hdr"
                echo "OK: installed missing $hdr" | tee -a "$LOG"
              else
                echo "FAIL: $hdr missing from both tree and patch source — build will fail" | tee -a "$LOG"
              fi
            else
              echo "INFO: $hdr already present ($(wc -l < "$hdr") lines) — preserving" | tee -a "$LOG"
            fi
          done

          grep -q 'susfs\.o'  fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o'  >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile
          sed -i '/ccflags-.*CONFIG_KSU_SUSFS.*selinux/d' fs/Makefile
          echo 'ccflags-$(CONFIG_KSU_SUSFS) += -Isecurity/selinux -Isecurity/selinux/include' >> fs/Makefile
          echo "OK: fs/Makefile — object entries + SELinux include path set" | tee -a "$LOG"

          echo "=== File presence check ===" | tee -a "$LOG"
          FAIL=0
          for f in \
            fs/susfs.c fs/sus_su.c \
            include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h; do
            if [[ -f "$f" ]]; then
              echo "OK: $f ($(wc -l < "$f") lines)" | tee -a "$LOG"
            else
              echo "FAIL: $f MISSING — compile will fail" | tee -a "$LOG"
              FAIL=1
            fi
          done
          [[ "$FAIL" -eq 0 ]] || { echo "ERROR: One or more SUSFS files missing — aborting"; exit 1; }

      # ── 11b. Inject SUSFS prctl bridge ──────────────────────────────────────
      # Pass A: inject into KernelSU-Next prctl handler near PR_SET_VMA.
      # Pass B: inject into SYSCALL_DEFINE5(prctl) in kernel/sys.c (C89-safe).
      # Uses dynamic CMD range from susfs_def.h to gate dispatch precisely.
      - name: Inject SUSFS prctl bridge (ShowVersion EINVAL fix)
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-prctl-bridge.log"
          echo "=== SUSFS prctl bridge injection — Chimera Mk6r5 ===" | tee "$LOG"

          cat > /tmp/inject_prctl_bridge.py <<'PYEOF'
          import re, sys, os
          from pathlib import Path

          BRIDGE_MARKER = "CHIMERA_MK6R5_SUSFS_PRCTL_BRIDGE"

          susfs_h = Path("include/linux/susfs.h")
          if not susfs_h.exists():
              print("FAIL: include/linux/susfs.h missing"); sys.exit(1)

          susfs_h_text = susfs_h.read_text()
          susfs_def_h  = Path("include/linux/susfs_def.h")
          scan_text    = susfs_def_h.read_text() if susfs_def_h.exists() else susfs_h_text

          cmd_ids = re.findall(r'#define\s+(CMD_SUSFS_\w+|SUSFS_CMD_\w+)\s+(0x[0-9a-fA-F]+|\d+)', scan_text)
          cmd_values = []
          for _, raw in cmd_ids:
              try: cmd_values.append(int(raw, 0))
              except ValueError: pass

          susfs_funcs      = re.findall(r'(?:int|bool|void)\s+(susfs_\w+)\s*\(', susfs_h_text)
          show_version_func = next((fn for fn in susfs_funcs if 'version' in fn.lower()), None)
          show_version_cmd  = next((c for c in cmd_ids if 'SHOW_VERSION' in c[0] or 'VERSION' in c[0]), None)

          cmd_min = min(cmd_values) if cmd_values else 0x55550
          cmd_max = max(cmd_values) if cmd_values else 0x60020
          print(f"INFO: CMD range=[{hex(cmd_min)}, {hex(cmd_max)}] "
                f"show_version_func={show_version_func} cmd={show_version_cmd}")

          # Dispatch: use exact CMD when resolved, otherwise range pass-through
          if show_version_cmd and show_version_func:
              dispatch = (f"\tif (option == {show_version_cmd[1]}) {{\n"
                          f"\t\t{show_version_func}((void __user *)arg2);\n"
                          f"\t\treturn 0;\n"
                          f"\t}}\n")
          elif show_version_func:
              print("WARN: SHOW_VERSION cmd not found; using range pass-through")
              dispatch = (f"\t(void)arg2; (void)arg3; (void)arg4; (void)arg5;\n"
                          f"\treturn 0;\n")
          else:
              print("WARN: show_version func not found; bridge is a stub")
              dispatch = "\treturn -EINVAL;\n"

          bridge_func = (
              "\n\n/* Chimera Mk6r5 SUSFS prctl bridge (" + BRIDGE_MARKER + ") */\n"
              f"#ifndef {BRIDGE_MARKER}\n#define {BRIDGE_MARKER} 1\n"
              "#ifdef CONFIG_KSU_SUSFS\n"
              "int ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2,\n"
              "    unsigned long arg3, unsigned long arg4, unsigned long arg5)\n"
              "{\n" + dispatch + "\treturn -EINVAL;\n}\n"
              "EXPORT_SYMBOL_GPL(ksu_susfs_handle_prctl);\n"
              "#endif\n#endif\n"
          )

          susfs_c = Path("fs/susfs.c")
          if susfs_c.exists():
              sc_text = susfs_c.read_text()
              if BRIDGE_MARKER not in sc_text:
                  susfs_c.write_text(sc_text + bridge_func)
                  print("OK: prctl bridge appended to fs/susfs.c")
              else:
                  print("OK: prctl bridge already in fs/susfs.c (idempotent)")

          def make_snippet(return_type, params_str):
              gate = (f"\tif ((unsigned long)option >= {hex(cmd_min)}UL &&\n"
                      f"\t    (unsigned long)option <= {hex(cmd_max)}UL) {{\n")
              call = ("\t\textern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"
                      "\t\t    unsigned long, unsigned long, unsigned long);\n"
                      "\t\tint __s = ksu_susfs_handle_prctl(\n"
                      "\t\t    (unsigned long)option, (unsigned long)arg2,\n"
                      "\t\t    (unsigned long)arg3, (unsigned long)arg4,\n"
                      "\t\t    (unsigned long)arg5);\n")
              if 'bool' in return_type:
                  m_ret = re.search(r'int\s*\*\s*(\w+)', params_str)
                  rv = m_ret.group(1) if m_ret else "retval"
                  return ("\n\t/* Chimera: SUSFS prctl bridge (" + BRIDGE_MARKER + ") */\n"
                          "#ifdef CONFIG_KSU_SUSFS\n" + gate + call +
                          f"\t\tif (__s != -EINVAL) {{ if ({rv}) *{rv} = __s; return true; }}\n"
                          "\t}\n#endif\n")
              else:
                  return ("\n\t/* Chimera: SUSFS prctl bridge (" + BRIDGE_MARKER + ") */\n"
                          "#ifdef CONFIG_KSU_SUSFS\n" + gate + call +
                          "\t\tif (__s != -EINVAL) return (long)__s;\n"
                          "\t}\n#endif\n")

          all_ksu_c = []
          for root in [Path("KernelSU-Next/kernel"), Path("drivers/kernelsu")]:
              if root.exists(): all_ksu_c.extend(sorted(root.rglob("*.c")))

          sys_c    = Path("kernel/sys.c")
          injected = False

          # Pass A: KernelSU-Next prctl handler with PR_SET_VMA in function body
          for cf in all_ksu_c:
              if injected: break
              txt = cf.read_text(errors='replace')
              if BRIDGE_MARKER in txt:
                  print(f"OK: already injected in {cf} (idempotent)")
                  injected = True; break
              for m in re.finditer(
                  r'((?:static\s+)?(int|bool|long)\s+\w+\s*\(([^)]*?(?:option|cmd|command)[^)]*?)\)\s*\{)',
                  txt, re.DOTALL
              ):
                  if any(tok in txt[m.end():m.end()+800] for tok in ["0x53564d41", "PR_SET_VMA"]):
                      cf.write_text(txt[:m.end()] + make_snippet(m.group(2), m.group(3)) + txt[m.end():])
                      print(f"OK: SUSFS dispatch injected in {cf} (Pass A)")
                      injected = True; break

          # Pass B: kernel/sys.c SYSCALL_DEFINE5(prctl) — C89 compliant
          if not injected and sys_c.exists():
              txt = sys_c.read_text(errors='replace')
              if BRIDGE_MARKER not in txt:
                  m_start = re.search(r'(SYSCALL_DEFINE5\s*\(\s*prctl\b[^{]+\{)', txt, re.DOTALL)
                  if m_start:
                      start_pos = m_start.end()
                      m_exec = re.search(r'\n\s*(error\s*=|switch\s*\(|if\s*\(|return\b)', txt[start_pos:])
                      insert_pos = start_pos + m_exec.start() if m_exec else start_pos
                      sys_c.write_text(txt[:insert_pos] + make_snippet('int', '') + txt[insert_pos:])
                      print("OK: SUSFS dispatch injected into kernel/sys.c SYSCALL_DEFINE5(prctl) (Pass B)")
                      injected = True

          if not injected:
              print("WARN: All injection passes exhausted — bridge compiled but prctl not wired")

          decl_marker = BRIDGE_MARKER + "_DECL"
          if decl_marker not in susfs_h_text:
              decl = (f"\n#ifndef {decl_marker}\n#define {decl_marker} 1\n"
                      "#ifdef CONFIG_KSU_SUSFS\n"
                      "extern int ksu_susfs_handle_prctl(unsigned long option,\n"
                      "    unsigned long arg2, unsigned long arg3,\n"
                      "    unsigned long arg4, unsigned long arg5);\n"
                      "#endif\n#endif\n")
              susfs_h.write_text(susfs_h_text + decl)
              print("OK: ksu_susfs_handle_prctl declaration added to susfs.h")

          print("\nBridge injection complete.")
          PYEOF
          python3 /tmp/inject_prctl_bridge.py 2>&1 | tee -a "$LOG"

      # ── 11c. SUSFS ABI alignment diagnostic ─────────────────────────────────
      - name: SUSFS ABI alignment and ShowVersion diagnostic
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-abi.log"
          echo "=== SUSFS ABI alignment — Chimera Mk6r5 ===" | tee "$LOG"

          cat > /tmp/susfs_abi_align.py <<'PYEOF'
          import re, sys, os
          from pathlib import Path

          results = []

          susfs_h = Path("include/linux/susfs.h")
          if susfs_h.exists():
              m = re.search(r'SUSFS_VERSION\s+"([^"]+)"', susfs_h.read_text())
              results.append(f"OK:   SUSFS_VERSION = {m.group(1)}" if m
                             else "WARN: SUSFS_VERSION not found in susfs.h")
          else:
              results.append("FAIL: include/linux/susfs.h missing")

          for hdr in ["include/linux/susfs_def.h", "include/linux/sus_su.h"]:
              results.append(f"OK:   {hdr} present" if Path(hdr).exists()
                             else f"FAIL: {hdr} MISSING — compile will fail")

          susfs_c = Path("fs/susfs.c")
          if susfs_c.exists():
              text = susfs_c.read_text()
              results.append("OK:   susfs_show_version present" if 'susfs_show_version' in text
                             else "FAIL: susfs_show_version MISSING — ShowVersion will EINVAL")
              if 'ksu_susfs' in text:
                  results.append("OK:   ksu_susfs symbols found in fs/susfs.c")
          else:
              results.append("FAIL: fs/susfs.c missing")

          results.append("OK:   fs/sus_su.c present" if Path("fs/sus_su.c").exists()
                         else "FAIL: fs/sus_su.c MISSING")

          if Path("fs/Makefile").exists():
              mk = Path("fs/Makefile").read_text()
              results.append("OK:   fs/Makefile has susfs.o"  if 'susfs.o'  in mk else "FAIL: fs/Makefile missing susfs.o")
              results.append("OK:   fs/Makefile has sus_su.o" if 'sus_su.o' in mk else "FAIL: fs/Makefile missing sus_su.o")
              results.append("OK:   fs/Makefile has SELinux ccflags" if 'selinux' in mk
                             else "WARN: fs/Makefile missing SELinux include path")

          BRIDGE_MARKER = "CHIMERA_MK6R5_SUSFS_PRCTL_BRIDGE"
          bridge_found  = False
          for cand in ["KernelSU-Next/kernel/ksu.c","KernelSU-Next/kernel/core_hook.c",
                       "drivers/kernelsu/ksu.c","drivers/kernelsu/core_hook.c"]:
              p = Path(cand)
              if p.exists() and any(tok in p.read_text().lower() for tok in ['susfs','ksu_susfs']):
                  results.append(f"OK:   SUSFS bridge in {cand}")
                  bridge_found = True; break

          if not bridge_found:
              sys_c = Path("kernel/sys.c")
              if sys_c.exists() and BRIDGE_MARKER in sys_c.read_text(errors='replace'):
                  results.append("OK:   SUSFS bridge in kernel/sys.c (prctl injection)")
                  bridge_found = True

          if not bridge_found:
              results.append("WARN: SUSFS prctl dispatch not found — ShowVersion may EINVAL")

          rejects_log = Path(f"../{os.environ.get('LOG_DIR','logs')}/susfs-rejects.log")
          if rejects_log.exists():
              rejects = rejects_log.read_text().strip()
              results.append(f"WARN: Patch rejects:\n{rejects}" if rejects
                             else "OK:   No patch rejects")

          for line in results: print(line)

          fail_count = sum(1 for r in results if r.startswith("FAIL:"))
          warn_count = sum(1 for r in results if r.startswith("WARN:"))
          print(f"\nSummary: {len(results)} checks — {fail_count} FAIL, {warn_count} WARN")
          if fail_count > 0:
              print("ACTION REQUIRED: See FAIL lines above")
              sys.exit(1)
          PYEOF
          python3 /tmp/susfs_abi_align.py 2>&1 | tee -a "$LOG"
          find . -name '*.rej' -exec printf -- '--- %s ---\n' {} \; -exec cat {} \; \
            2>/dev/null | tee -a "$LOG" || echo "(no rejects)" | tee -a "$LOG"

      # ── 11d. Fix KernelSU-Next header paths in SUSFS ─────────────────────────
      - name: Fix KernelSU-Next header paths in SUSFS
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-header-fix.log"
          echo "=== Fixing SUSFS header includes for KernelSU-Next ===" | tee "$LOG"

          cat > /tmp/fix_headers.py <<'PYEOF'
          import re
          from pathlib import Path

          ksu_kernel = Path("KernelSU-Next/kernel")
          if not ksu_kernel.exists():
              print("FAIL: KernelSU-Next/kernel not found."); exit(1)

          ksu_headers = {hdr.name: hdr.relative_to(ksu_kernel) for hdr in ksu_kernel.rglob("*.h")}
          ksu_linked  = Path("drivers/kernelsu")
          if ksu_linked.exists():
              for hdr in ksu_linked.rglob("*.h"):
                  ksu_headers.setdefault(hdr.name, hdr.relative_to(ksu_linked))

          for target_file in ["include/linux/sus_su.h","include/linux/susfs.h",
                              "fs/susfs.c","fs/sus_su.c"]:
              p = Path(target_file)
              if not p.exists(): continue
              content = p.read_text()
              changed = False
              for m in re.finditer(r'#include\s+["<]((?:\.\./)+)drivers/kernelsu/([^>"]+)[">]', content):
                  full_match, prefix, header_name = m.group(0), m.group(1), m.group(2)
                  if header_name in ksu_headers:
                      content = content.replace(full_match,
                          f'#include "{prefix}drivers/kernelsu/{ksu_headers[header_name]}"')
                      print(f"OK: {target_file} -> {header_name} rewired")
                      changed = True
                  else:
                      print(f"WARN: {target_file}: {header_name} not in KernelSU-Next — preserving")
              if changed: p.write_text(content)

          print("Header rewire complete.")
          PYEOF
          python3 /tmp/fix_headers.py | tee -a "$LOG"

      # ── 11e. Create KernelSU compatibility header shim ──────────────────────
      - name: Create KernelSU compatibility header shim
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-header-shim.log"
          echo "=== KernelSU compatibility header shim ===" | tee "$LOG"

          cat > /tmp/create_ksu_header_shim.py <<'PYEOF'
          from pathlib import Path
          import subprocess, shutil

          base = Path("drivers/kernelsu")
          shim = base / "kernel_compat.h"

          candidates = [
              base / "hook/kernel_compat.h",
              base / "compat/kernel_compat.h",
              base / "include/kernel_compat.h",
              base / "ksu/kernel_compat.h",
          ]
          target = next((c for c in candidates if c.exists()), None)

          if target is None:
              found = sorted(base.rglob("kernel_compat.h")) if base.exists() else []
              target = found[0] if found else None

          if target is None:
              print("WARN: kernel_compat.h not in tree — fetching from upstream")
              fallback_root = Path("../ksu-header-fallback")
              if fallback_root.exists(): shutil.rmtree(fallback_root)
              fallback_root.mkdir(parents=True, exist_ok=True)
              fetched = None
              for repo in ["https://github.com/gavdoc38/KernelSU-Next.git",
                           "https://github.com/tiann/KernelSU.git"]:
                  repo_dir = fallback_root / Path(repo).stem
                  try:
                      subprocess.run(["git","clone","--depth=1",repo,str(repo_dir)],
                                     check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  except Exception: continue
                  hits = sorted(repo_dir.rglob("kernel_compat.h"))
                  if hits: fetched = hits[0]; break
              if fetched is None:
                  print("FAIL: kernel_compat.h not found anywhere — build may fail")
                  raise SystemExit(1)
              shim.write_text("/* Chimera Mk6r5: fallback shim */\n" + fetched.read_text())
              print(f"OK: populated from fallback: {fetched}")
              raise SystemExit(0)

          rel = target.relative_to(base)
          if shim.exists():
              existing = shim.read_text()
              if rel.as_posix() in existing:
                  print(f"OK: shim already points to {rel} (idempotent)")
                  raise SystemExit(0)

          shim.write_text(f"/* Chimera Mk6r5: SUSFS compatibility shim */\n#include \"{rel.as_posix()}\"\n")
          print(f"OK: created shim drivers/kernelsu/kernel_compat.h -> {rel}")
          PYEOF
          python3 /tmp/create_ksu_header_shim.py | tee -a "$LOG"

      # ── 11f. Inject linker symbol fallbacks ──────────────────────────────────
      # FIXED: separate kuid_t / kgid_t assignments (GLOBAL_ROOT_UID != GLOBAL_ROOT_GID
      # in typesafe kernels). Previous chained assignment caused type mismatch.
      - name: Inject linker symbol fallbacks
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/linker-symbol-fix.log"
          echo "=== Injecting weak function fallbacks ===" | tee "$LOG"

          cat > /tmp/patch_symbols.py <<'PYEOF'
          from pathlib import Path

          target = Path("fs/sus_su.c")
          if not target.exists():
              print("INFO: fs/sus_su.c not found — skipping"); exit(0)

          content = target.read_text()
          if "WEAK_SYMBOL_FALLBACK_BLOCK" in content:
              print("OK: fallbacks already present (idempotent)"); exit(0)

          # FIXED: Use separate uid/gid assignments with correct types.
          # kuid_t and kgid_t are distinct struct types when CONFIG_UIDGID_STRICT_TYPE_CHECKS
          # is enabled; chaining uid=gid=...=GLOBAL_ROOT_UID causes type mismatch errors.
          fallback = """
          /* === WEAK_SYMBOL_FALLBACK_BLOCK === */
          #include <linux/cred.h>
          #include <linux/uidgid.h>
          #include <linux/capability.h>

          #ifndef cap_set_full
          #define cap_set_full(c) do { (c) = CAP_FULL_SET; } while(0)
          #endif

          __attribute__((weak)) bool susfs_is_allow_su(void) { return false; }

          __attribute__((weak)) void ksu_escape_to_root(void) {
              struct cred *nc = prepare_creds();
              if (!nc) return;
              nc->uid   = GLOBAL_ROOT_UID;
              nc->gid   = GLOBAL_ROOT_GID;
              nc->suid  = GLOBAL_ROOT_UID;
              nc->sgid  = GLOBAL_ROOT_GID;
              nc->euid  = GLOBAL_ROOT_UID;
              nc->egid  = GLOBAL_ROOT_GID;
              nc->fsuid = GLOBAL_ROOT_UID;
              nc->fsgid = GLOBAL_ROOT_GID;
              cap_set_full(nc->cap_inheritable);
              cap_set_full(nc->cap_permitted);
              cap_set_full(nc->cap_effective);
              cap_set_full(nc->cap_bset);
              commit_creds(nc);
          }
          /* ================================== */
          """
          target.write_text(content + "\n" + fallback)
          print("OK: weak function fallbacks injected into fs/sus_su.c")
          PYEOF
          python3 /tmp/patch_symbols.py | tee -a "$LOG"

      # ── 12. ZeroMount compatibility probe ────────────────────────────────────
      - name: ZeroMount compatibility probe
        if: ${{ inputs.enable_zeromount }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          {
            echo "=== ZeroMount compatibility probe — Chimera Mk6r5 ==="
            echo "susfs_mode=${{ inputs.susfs_mode }}"
            echo "== kernel markers =="
            grep -RsnE \
              'CONFIG_KSU_SUSFS|susfs_task_state|INODE_STATE_SUS_PATH|susfs_is_inode_sus_path' \
              fs include kernel 2>/dev/null || echo "(none)"
            if [[ "${{ inputs.susfs_mode }}" != "none" ]]; then
              echo "== SUSFS workspace markers =="
              grep -RsnE 'ShowVersion|supercall|SUSFS|susfs' \
                "$GITHUB_WORKSPACE/susfs4ksu" 2>/dev/null || echo "(none)"
            fi
          } | tee "../$LOG_DIR/zeromount-compat.log"

      # ── 13. Defconfig tuning ─────────────────────────────────────────────────
      # susfs_mode=avc_safe: SUSFS enabled, all AVC spoof opts unset.
      # susfs_mode=none:     Pure KernelSU-Next, all SUSFS opts explicitly unset.
      # force_selinux_enforcing=true: removes CONFIG_SECURITY_SELINUX_DEVELOP —
      #   setenforce 0 returns EPERM; sel_write_enforce is not compiled.
      - name: Apply defconfig tuning
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"
          test -f "$DEFCONFIG" || { echo "ERROR: defconfig not found: $DEFCONFIG"; exit 1; }

          set_cfg() {
            sed -i "/^$1=.*/d"            "$DEFCONFIG"
            sed -i "/^# $1 is not set/d" "$DEFCONFIG"
            echo "$1=$2"                 >> "$DEFCONFIG"
          }

          unset_cfg() {
            sed -i "/^$1=.*/d"            "$DEFCONFIG"
            sed -i "/^# $1 is not set/d" "$DEFCONFIG"
            echo "# $1 is not set"       >> "$DEFCONFIG"
          }

          # ── KSU (always) ────────────────────────────────────────────────────
          set_cfg CONFIG_KSU y

          # ── SUSFS mode dispatch ──────────────────────────────────────────────
          if [[ "${{ inputs.susfs_mode }}" == "avc_safe" ]]; then
            set_cfg CONFIG_KSU_SUSFS           y
            set_cfg CONFIG_KSU_SUSFS_SUS_PATH  y
            set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y

            [[ "${{ inputs.enable_susfs_open_redirect }}" == "true" ]] \
              && set_cfg   CONFIG_KSU_SUSFS_OPEN_REDIRECT y \
              || unset_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT

            [[ "${{ inputs.enable_susfs_hide_symbols }}" == "true" ]] \
              && set_cfg   CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y \
              || unset_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS

            [[ "${{ inputs.enable_susfs_try_umount }}" == "true" ]] \
              && set_cfg   CONFIG_KSU_SUSFS_TRY_UMOUNT y \
              || unset_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT

            # AVC-safe: all spoof options unset (Android 16 QPR2 compatibility)
            for opt in \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK \
              CONFIG_KSU_SUSFS_SPOOF_SELINUX \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING; do
              unset_cfg "$opt"
            done
          else
            # none: disable SUSFS entirely — pure KernelSU-Next
            for opt in \
              CONFIG_KSU_SUSFS \
              CONFIG_KSU_SUSFS_SUS_PATH \
              CONFIG_KSU_SUSFS_SUS_KSTAT \
              CONFIG_KSU_SUSFS_OPEN_REDIRECT \
              CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              CONFIG_KSU_SUSFS_TRY_UMOUNT \
              CONFIG_KSU_SUSFS_SUS_MOUNT \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK \
              CONFIG_KSU_SUSFS_SPOOF_SELINUX \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING; do
              unset_cfg "$opt"
            done
          fi

          # ── SELinux enforcing lock ───────────────────────────────────────────
          # CONFIG_SECURITY_SELINUX_DEVELOP controls whether sel_write_enforce
          # is compiled. When unset, /sys/fs/selinux/enforce is read-only and
          # setenforce 0 returns EPERM regardless of caller privilege.
          if [[ "${{ inputs.force_selinux_enforcing }}" == "true" ]]; then
            unset_cfg CONFIG_SECURITY_SELINUX_DEVELOP
            unset_cfg CONFIG_SECURITY_SELINUX_BOOTPARAM
            unset_cfg CONFIG_SECURITY_SELINUX_DISABLE
            sed -i 's/androidboot\.selinux=permissive//g' "$DEFCONFIG"
            sed -i 's/\benforcing=0\b//g'                "$DEFCONFIG"
            echo "OK: SELinux enforcing locked (DEVELOP removed — setenforce 0 returns EPERM)"
          fi

          # ── Brain Core §6 ────────────────────────────────────────────────────
          set_cfg CONFIG_PREEMPT y
          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY
          unset_cfg CONFIG_HZ_100
          unset_cfg CONFIG_HZ_250
          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300
          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR     y
          set_cfg CONFIG_TCP_CONG_CUBIC   y
          sed -i '/^CONFIG_DEFAULT_TCP_CONG=/d;/^# CONFIG_DEFAULT_TCP_CONG is not set/d' "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          set_cfg CONFIG_CRC32_ARMV8_CRC y
          set_cfg CONFIG_ZRAM     y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_CRYPTO_LZ4   y
          set_cfg CONFIG_CRYPTO_LZ4HC y
          unset_cfg CONFIG_LOCALVERSION_AUTO

          echo "OK: defconfig tuning complete" | tee "../$LOG_DIR/defconfig-tuning.log"
          grep -E "^(CONFIG_KSU|CONFIG_PREEMPT|CONFIG_HZ|CONFIG_TCP_CONG|CONFIG_ZRAM|CONFIG_CRYPTO_LZ4|CONFIG_LOCALVERSION|CONFIG_SECURITY_SELINUX)" \
            "$DEFCONFIG" | tee -a "../$LOG_DIR/defconfig-tuning.log"

      # ── 14. Chimera Mk6r5 branding ───────────────────────────────────────────
      # setlocalversion is authoritative in Samsung BSP 4.9 — overrides everything.
      # uname: Linux version 4.9.x-Chimera_Mk6r5 (X@AegisDevLabs)
      - name: Chimera Mk6r5 branding
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          BUILD_NUM="$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")"
          BRAND="-Chimera_Mk6r5"
          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"

          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' "$DEFCONFIG"
          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="AegisDevLabs"\n' \
            "$BRAND" >> "$DEFCONFIG"

          # setlocalversion is authoritative (Samsung BSP ignores CONFIG_LOCALVERSION)
          printf '#!/bin/sh\n# Chimera Mk6r5 brand\nprintf "%%s" "%s"\n' \
            "$BRAND" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          echo "$BRAND" > localversion

          echo "CHIMERA_BRAND=$BRAND" >> "$GITHUB_ENV"
          echo "BUILD_NUM=$BUILD_NUM"  >> "$GITHUB_ENV"
          printf "BRAND=%s\nBUILD_NUM=%s\n" "$BRAND" "$BUILD_NUM" \
            | tee "../$LOG_DIR/build-branding.env"

          echo "=== setlocalversion ===" | tee -a "../$LOG_DIR/scm-dirty-fix.log"
          cat scripts/setlocalversion   | tee -a "../$LOG_DIR/scm-dirty-fix.log"

      # ── 15. Dry run complete ─────────────────────────────────────────────────
      - name: Dry run complete
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "=== Chimera Mk6r5 dry run passed ==="
          echo "susfs_mode=${{ inputs.susfs_mode }}"
          echo "force_selinux_enforcing=${{ inputs.force_selinux_enforcing }}"
          echo "Patches applied. Re-run with dry_run=false to build."

      # ── 16. Build kernel ─────────────────────────────────────────────────────
      - name: Build kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          LOCALVERSION="-Chimera_Mk6r5"
          export KBUILD_BUILD_USER="X"
          export KBUILD_BUILD_HOST="AegisDevLabs"
          export KBUILD_BUILD_VERSION="${GITHUB_RUN_NUMBER:-1}"

          MAKE=(
            make -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64 SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld"
            AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            KCFLAGS="-fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
            LOCALVERSION="$LOCALVERSION"
            KBUILD_BUILD_USER="X"
            KBUILD_BUILD_HOST="AegisDevLabs"
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig
          cp "$GITHUB_WORKSPACE/$OUT_DIR/.config" "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          echo "=== LOCALVERSION + SELinux enforcing check ===" \
            | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/scm-dirty-fix.log"
          grep -E "LOCALVERSION|SELINUX_DEVELOP" "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/scm-dirty-fix.log" || true

          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log

          test -f "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" || {
            echo "ERROR: Image not produced — check build.log"; exit 1
          }

          du -h "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"

          echo "=== uname string in Image ===" | tee "$GITHUB_WORKSPACE/$LOG_DIR/uname-verify.log"
          strings "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" \
            | grep -E "Linux version 4\.9\." | head -3 \
            | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/uname-verify.log" || true

      # ── 17. Package flashable zip ─────────────────────────────────────────────
      - name: Package flashable zip
        if: ${{ inputs.dry_run == false }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cat > /tmp/write_anykernel.py <<'PYEOF'
          from pathlib import Path

          content = (
              "properties() { '\n"
              "kernel.string=Project Chimera Mk6r5 - Exynos9810 / star2lte\n"
              "do.devicecheck=1\ndo.modules=0\ndo.cleanup=1\ndo.cleanuponabort=0\n"
              "device.name1=star2lte\ndevice.name2=SM-G965F\ndevice.name3=SM-G965U\n"
              "device.name4=SM-G965N\ndevice.name5=SM-G9650\n'; }\n\n"
              "block=boot;\nis_slot_device=0;\nramdisk_compression=auto;\n"
              "patch_vbmeta_flag=auto;\n\n. tools/ak3-core.sh;\ndump_boot;\nwrite_boot;\n"
          )
          Path("AnyKernel3/anykernel.sh").write_text(content)
          print("OK: anykernel.sh written")
          PYEOF
          python3 /tmp/write_anykernel.py

          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          find "$OUT_DIR/arch/arm64/boot/dts/exynos" -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          BUILD_NUM="${BUILD_NUM:-$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")}"
          SUSFS_TAG="${{ inputs.susfs_mode }}"
          ZIP="chimera-mk6r5-${SUSFS_TAG}-lineage23.2-${BUILD_NUM}-$(date +%Y%m%d-%H%M).zip"

          (cd AnyKernel3 && zip -r9 "../$ZIP" . -x '*.git*')
          test -f "$ZIP" || { echo "ERROR: ZIP not produced"; exit 1; }
          echo "ZIP=${ZIP}" >> "$LOG_DIR/build-branding.env"
          echo "OK: flashable zip ready: ${ZIP}"

      # ── 18. Upload logs ──────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r5-logs-${{ github.run_number }}
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      # ── 19. Upload flashable zip ─────────────────────────────────────────────
      - name: Upload flashable zip
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r5-${{ inputs.susfs_mode }}-${{ github.run_number }}
          path: chimera-mk6r5-*.zip
          if-no-files-found: error
          retention-days: 30

      # ── 20. Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false && inputs.do_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6r5-${{ github.run_number }}
          name: "Project Chimera Mk6r5 — Lineage 23.2 Build #${{ github.run_number }}"
          body: |
            ## Project Chimera Mk6r5 — Exynos 9810 / star2lte
            Base: Project_Chimera @ chimera-mk6

            ### Build options
            | Option | Value |
            |---|---|
            | susfs_mode | `${{ inputs.susfs_mode }}` |
            | force_selinux_enforcing | `${{ inputs.force_selinux_enforcing }}` |
            | open_redirect | `${{ inputs.enable_susfs_open_redirect }}` |
            | hide_symbols | `${{ inputs.enable_susfs_hide_symbols }}` |
            | try_umount | `${{ inputs.enable_susfs_try_umount }}` |

            ### SELinux enforcement
            ${{ inputs.force_selinux_enforcing == true && '**Locked enforcing** — `CONFIG_SECURITY_SELINUX_DEVELOP` removed. `setenforce 0` returns `EPERM` regardless of root privilege.' || '**Standard** — permissive mode available via root.' }}

            ### Kernel identity
            ```
            Linux version 4.9.x-Chimera_Mk6r5 (X@AegisDevLabs)
            ```

            ### Brain Core hardening baked in
            - §1 schedutil 1500/16000 µs (patterns A-F: upstream + Samsung BSP variants)
            - §2 sugov SCHED_RR p=1 (MAX_USER_RT_PRIO/2 + bare thread patterns)
            - §3 Samsung UFC/ACME disarmed
            - §3b sugov_update_rate_limit_us runtime clamp — **C89-safe** (fixed run-36)
            - §4 CFS 6ms/750µs/1ms + 5ms big.LITTLE migration cost
            - §5 ZRAM lz4 default
            - §6 PREEMPT · HZ_300 · TCP BBR · CRC32 HW · LZ4
            - §7 EMS ontime 700/200 (when present)
            - §8 Thermal passive trip 70°C

            ### Flash order
            1. Flash LineageOS 23.2 + recovery
            2. Sideload this zip via recovery
            3. Install KernelSU Next manager APK
            4. Install SUSFS module via KSU manager (if avc_safe mode)
            5. Reboot — verify with ZeroMount log
          files: chimera-mk6r5-*.zip
