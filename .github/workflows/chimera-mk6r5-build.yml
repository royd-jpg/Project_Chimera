name: "Project Chimera Mk6r5 - Lineage 23.2 Build"

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only - skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Allow patching even if KSU/SUSFS already present in tree"
        required: false
        type: boolean
        default: false
      enable_zeromount:
        description: "Enable ZeroMount compatibility probe"
        required: false
        type: boolean
        default: true
      enable_susfs_open_redirect:
        description: "Enable SUSFS OPEN_REDIRECT"
        required: false
        type: boolean
        default: true
      enable_susfs_hide_symbols:
        description: "Enable SUSFS symbol hiding"
        required: false
        type: boolean
        default: true
      enable_susfs_try_umount:
        description: "Enable SUSFS TRY_UMOUNT"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: "Build Exynos9810 Kernel (Mk6r5)"
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO: "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6"
      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.9"
      KERNEL_DIR: "kernel"
      OUT_DIR: "kernel-out"
      LOG_DIR: "logs"
      NEUTRON_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY: "neutron-clang-10032024-pinned-v1"

    steps:

      # ── Phase 0: Workspace ───────────────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"

      # ── Phase 1: Dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git \
            curl \
            wget \
            bc \
            flex \
            bison \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            build-essential \
            zip \
            unzip \
            zstd \
            lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ── Phase 2: Neutron Clang ───────────────────────────────────────────
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p neutron-clang
          echo "Downloading pinned Neutron Clang: $NEUTRON_URL" | tee "$LOG_DIR/toolchain.log"
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          test -x neutron-clang/bin/clang || { echo "ERROR: clang missing"; exit 1; }
          neutron-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: |
          set -Eeuo pipefail
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ── Phase 3: Sources ─────────────────────────────────────────────────
      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log --oneline -3 | tee "$LOG_DIR/kernel-revision.log"

      - name: Clone SUSFS
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/susfs_def.h
          git -C susfs4ksu rev-parse HEAD | tee "$LOG_DIR/susfs-revision.log"

      # ── Phase 4: KernelSU-Next ───────────────────────────────────────────
      - name: Set up KernelSU-Next (pinned submodule)
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          git rm -r --cached KernelSU-Next 2>/dev/null || true
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu

          KSU_URL="$(git config --file .gitmodules submodule.KernelSU-Next.url 2>/dev/null || true)"
          KSU_COMMIT="$(git ls-tree HEAD KernelSU-Next 2>/dev/null | awk '{print $3}' || true)"

          echo "Submodule URL: ${KSU_URL:-not found}" | tee "../$LOG_DIR/ksu-submodule.log"
          echo "Pinned commit: ${KSU_COMMIT:-not found}" | tee -a "../$LOG_DIR/ksu-submodule.log"

          if [[ -n "$KSU_URL" && -n "$KSU_COMMIT" ]]; then
            git clone "$KSU_URL" KernelSU-Next
            git -C KernelSU-Next checkout "$KSU_COMMIT"
          elif [[ -n "$KSU_URL" ]]; then
            git clone --depth=1 "$KSU_URL" KernelSU-Next
          else
            git clone --depth=1 https://github.com/gavdoc38/KernelSU-Next.git KernelSU-Next
          fi

          test -f KernelSU-Next/kernel/Kconfig || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }
          git -C KernelSU-Next log --oneline -1 | tee -a "../$LOG_DIR/ksu-submodule.log"

          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || { echo "ERROR: drivers/kernelsu/Kconfig missing"; exit 1; }

      # ── Phase 4b: Samsung 4.9 BSP compatibility fix ──────────────────────
      - name: Fix syscall_fn_t for Samsung 4.9 BSP
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"

          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            echo "Nothing to fix - syscall_fn_t not needed or file absent"
            exit 0
          fi

          cat > /tmp/fix_syscall_typedef.py <<'PYEOF'
import sys
from pathlib import Path
import re

path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")
if not path.exists():
    sys.exit(0)

content = path.read_text()
typedef_block = (
    "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\n"
    "typedef long (*syscall_fn_t)(\n"
    "    unsigned long,\n"
    "    unsigned long,\n"
    "    unsigned long,\n"
    "    unsigned long,\n"
    "    unsigned long,\n"
    "    unsigned long\n"
    ");\n\n"
)

pos = 0
for match in re.finditer(r'^#(include|pragma|ifndef|define)[^\n]*\n', content, re.MULTILINE):
    pos = match.end()

if "typedef long (*syscall_fn_t)" not in content:
    content = content[:pos] + typedef_block + content[pos:]
    path.write_text(content)
    print("typedef injected")
else:
    print("typedef already exists")
PYEOF
          python3 /tmp/fix_syscall_typedef.py

      # ── Phase 5: SUSFS ABI Alignment (Mk6r5 core feature) ───────────────
      # Goal: ensure kernel speaks the same SUSFS dialect as the module.
      # Fixes: supercall ShowVersion EINVAL, CMD_ ID mismatches,
      #        missing bridge wiring, version probe failures.
      - name: SUSFS ABI alignment - probe and validate
        run: |
          set -Eeuo pipefail
          LOG="$LOG_DIR/susfs-abi.log"
          SUSFS_H="susfs4ksu/kernel_patches/include/linux/susfs.h"
          SUSFS_DEF_H="susfs4ksu/kernel_patches/include/linux/susfs_def.h"
          SUSFS_C="susfs4ksu/kernel_patches/fs/susfs.c"

          echo "=== SUSFS ABI Alignment Probe ===" | tee "$LOG"

          # --- Write probe script to temp file ---
          cat > /tmp/susfs_abi_probe.py <<'PYEOF'
import sys
import re
from pathlib import Path

log = []
issues = []

susfs_h_path = Path(sys.argv[1])
susfs_def_path = Path(sys.argv[2])
susfs_c_path = Path(sys.argv[3])

if not susfs_h_path.exists():
    print("ERROR: susfs.h source not found at " + str(susfs_h_path))
    sys.exit(1)

content_h = susfs_h_path.read_text()

# Probe SUSFS_VERSION
m = re.search(r'#define\s+SUSFS_VERSION\s+(\S+)', content_h)
if m:
    log.append("SUSFS_VERSION = " + m.group(1))
else:
    issues.append("SUSFS_VERSION not defined in susfs.h")

# Probe CMD_ supercall command IDs
for match in re.finditer(r'#define\s+(CMD_SUSFS_\w+)\s+(\S+)', content_h):
    log.append(match.group(1) + " = " + match.group(2))

# Check for supercall bridge symbols
bridge_syms = ['ksu_susfs_handle_cmd', 'susfs_handle_cmd', 'ksu_handle_susfs',
               'susfs_send_log', 'susfs_get_enabled']
for sym in bridge_syms:
    if sym in content_h:
        log.append("bridge symbol in susfs.h: " + sym)

# Probe susfs_def.h for CURRENT_SUSFS_VERSION
if susfs_def_path.exists():
    content_def = susfs_def_path.read_text()
    m = re.search(r'#define\s+CURRENT_SUSFS_VERSION\s+(\S+)', content_def)
    if m:
        log.append("CURRENT_SUSFS_VERSION = " + m.group(1))

# Probe susfs.c for handler registration
if susfs_c_path.exists():
    content_c = susfs_c_path.read_text()
    for sym in ['susfs_send_log', 'ksu_susfs_handle_cmd', 'susfs_handle_cmd']:
        if sym in content_c:
            log.append("susfs.c contains: " + sym)
    if 'EXPORT_SYMBOL' in content_c:
        exports = re.findall(r'EXPORT_SYMBOL\w*\((\w+)\)', content_c)
        for e in exports:
            log.append("EXPORT_SYMBOL: " + e)

print("--- SUSFS ABI probe results ---")
for line in log:
    print("  " + line)
if issues:
    print("--- ISSUES ---")
    for i in issues:
        print("  WARNING: " + i)
    sys.exit(0)
else:
    print("ABI probe: OK - no missing definitions detected")
PYEOF
          python3 /tmp/susfs_abi_probe.py \
            "$SUSFS_H" "$SUSFS_DEF_H" "$SUSFS_C" | tee -a "$LOG"

      - name: SUSFS ABI alignment - validate KSU bridge wiring
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-abi-ksu.log"
          KSU_DIR="KernelSU-Next/kernel"

          echo "=== KSU-SUSFS Bridge Wire Check ===" | tee "$LOG"

          cat > /tmp/susfs_ksu_bridge_check.py <<'PYEOF'
import sys
from pathlib import Path

ksu_dir = Path(sys.argv[1])
log = []
found = []

search_patterns = [
    'susfs_handle_cmd',
    'ksu_susfs',
    'CMD_SUSFS',
    'SUSFS_VERSION',
    'susfs_send_log',
]

for src in list(ksu_dir.rglob('*.c')) + list(ksu_dir.rglob('*.h')):
    try:
        content = src.read_text(errors='replace')
    except Exception:
        continue
    for pat in search_patterns:
        if pat in content:
            entry = src.name + ": contains " + pat
            if entry not in found:
                found.append(entry)
                log.append("  " + entry)

if found:
    print("KSU-SUSFS bridge references found:")
    for line in log:
        print(line)
else:
    print("WARNING: No KSU-SUSFS bridge references in KernelSU-Next/kernel")
    print("  This may indicate the supercall bridge is not wired.")
    print("  ShowVersion will likely fail until SUSFS patch is applied.")
PYEOF
          python3 /tmp/susfs_ksu_bridge_check.py "$KSU_DIR" | tee -a "$LOG"

      # ── Phase 6: Preflight ───────────────────────────────────────────────
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          echo "=== git status ===" | tee "../$LOG_DIR/preflight.log"
          git status --short | tee -a "../$LOG_DIR/preflight.log"

          echo "=== KSU/SUSFS markers ===" | tee -a "../$LOG_DIR/preflight.log"
          grep -RsnE \
            'KernelSU|kernelsu|CONFIG_KSU|KSU_SUSFS|ksu_handle_faccessat|susfs_task_state|SUSFS_VERSION' \
            fs include kernel arch/arm64/configs 2>/dev/null \
            | tee -a "../$LOG_DIR/preflight.log" || true

          ALREADY_PATCHED=false
          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi

          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "../$LOG_DIR/preflight.log"

          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ── Phase 7: KernelSU Kconfig wiring ────────────────────────────────
      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig

          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi

          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: Expected 1 entry, found $COUNT"; exit 1; }

      # ── Phase 8: Apply SUSFS patch ───────────────────────────────────────
      - name: Apply SUSFS patch
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          set +e
          git apply --reject --whitespace=fix "$PATCH" > "../$LOG_DIR/susfs-apply.log" 2>&1
          APPLY_RC=$?
          set -e

          find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log" || true
          echo "Apply RC=$APPLY_RC" | tee -a "../$LOG_DIR/susfs-apply.log"

          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" fs/susfs.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" fs/sus_su.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" include/linux/sus_su.h

          grep -q 'susfs.o' fs/Makefile  || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o'  >> fs/Makefile
          grep -q 'sus_su.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile

      # ── Phase 9: SUSFS post-patch ABI verification ───────────────────────
      # After patch is applied to the kernel tree, verify the supercall
      # handler registration and command ID alignment are intact.
      - name: SUSFS ABI alignment - post-patch verification
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-abi-postpatch.log"

          echo "=== Post-patch SUSFS ABI verification ===" | tee "$LOG"

          cat > /tmp/susfs_postpatch_verify.py <<'PYEOF'
import sys
import re
from pathlib import Path

issues = []
ok = []

susfs_h = Path("include/linux/susfs.h")
susfs_c = Path("fs/susfs.c")

if not susfs_h.exists():
    print("ERROR: include/linux/susfs.h not found after patch")
    sys.exit(1)

content_h = susfs_h.read_text()

# 1. SUSFS_VERSION must be present
m = re.search(r'#define\s+SUSFS_VERSION\s+(\S+)', content_h)
if m:
    ok.append("SUSFS_VERSION = " + m.group(1))
else:
    issues.append("SUSFS_VERSION missing from include/linux/susfs.h")

# 2. At least one CMD_SUSFS_ definition must be present
cmds = re.findall(r'#define\s+(CMD_SUSFS_\w+)\s+(\S+)', content_h)
if cmds:
    for name, val in cmds:
        ok.append(name + " = " + val)
else:
    issues.append("No CMD_SUSFS_* definitions found - supercall IDs missing")

# 3. susfs.c must export susfs_send_log (required by KSU bridge)
if susfs_c.exists():
    content_c = susfs_c.read_text()
    if 'susfs_send_log' in content_c:
        ok.append("susfs_send_log: present in fs/susfs.c")
    else:
        issues.append("susfs_send_log not found in fs/susfs.c")

    # Check for EXPORT_SYMBOL entries (required for KSU to call into SUSFS)
    exports = re.findall(r'EXPORT_SYMBOL\w*\((\w+)\)', content_c)
    if exports:
        ok.append("Exported symbols: " + ", ".join(exports))
    else:
        issues.append("No EXPORT_SYMBOL in susfs.c - KSU cannot call SUSFS functions")
else:
    issues.append("fs/susfs.c not found")

print("--- Post-patch verification ---")
for line in ok:
    print("  OK: " + line)
if issues:
    for i in issues:
        print("  ISSUE: " + i)
    print("ABI verification: ISSUES FOUND - review logs")
else:
    print("ABI verification: PASS")
PYEOF
          python3 /tmp/susfs_postpatch_verify.py | tee -a "$LOG"

      # ── Phase 10: Brain Core §1 - schedutil rate limits ──────────────────
      # Bakes 1500/16000 defaults so kernel never enters pathological state.
      # Eliminates sugov:0 32%+ CPU usage and Brain Core's re-assertion loop.
      - name: "Brain Core §1 - schedutil rate limits (1500us/16000us)"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          SCHEDUTIL="drivers/cpufreq/cpufreq_schedutil.c"
          LOG="../$LOG_DIR/braincore-s1-schedutil.log"

          if [[ ! -f "$SCHEDUTIL" ]]; then
            echo "WARNING: $SCHEDUTIL not found - skipping" | tee "$LOG"
            exit 0
          fi

          echo "=== Brain Core §1: schedutil rate limits ===" | tee "$LOG"
          echo "--- Before ---" | tee -a "$LOG"
          grep -n "rate_limit_us" "$SCHEDUTIL" | head -20 | tee -a "$LOG"

          cat > /tmp/patch_schedutil_rates.py <<'PYEOF'
import sys
import re
from pathlib import Path

path = Path(sys.argv[1])
content = path.read_text()
original = content

# Pattern A: vanilla 4.9 defaults (0 / 0)
content = re.sub(
    r'(tunables->up_rate_limit_us\s*=\s*)0(\s*;)',
    r'\g<1>1500\2',
    content
)
content = re.sub(
    r'(tunables->down_rate_limit_us\s*=\s*)0(\s*;)',
    r'\g<1>16000\2',
    content
)

# Pattern B: Samsung BSP defaults (5000 / 5000)
content = re.sub(
    r'(tunables->up_rate_limit_us\s*=\s*)5000(\s*;)',
    r'\g<1>1500\2',
    content
)
content = re.sub(
    r'(tunables->down_rate_limit_us\s*=\s*)5000(\s*;)',
    r'\g<1>16000\2',
    content
)

# Pattern C: Samsung BSP clamp_val / cpufreq_policy_transition_delay_us
content = re.sub(
    r'tunables->up_rate_limit_us\s*=\s*\n?\s*clamp_val\s*\([^;]+\)\s*;',
    'tunables->up_rate_limit_us = 1500; /* Chimera Mk6r5 */',
    content
)
content = re.sub(
    r'tunables->down_rate_limit_us\s*=\s*\n?\s*clamp_val\s*\([^;]+\)\s*;',
    'tunables->down_rate_limit_us = 16000; /* Chimera Mk6r5 */',
    content
)

if content != original:
    path.write_text(content)
    print("schedutil: up_rate_limit_us=1500 down_rate_limit_us=16000 applied")
else:
    print("WARNING: no rate_limit_us pattern matched - manual review required")
    print("  Run: grep -n rate_limit_us " + str(path))
PYEOF
          python3 /tmp/patch_schedutil_rates.py "$SCHEDUTIL" | tee -a "$LOG"

          echo "--- After ---" | tee -a "$LOG"
          grep -n "rate_limit_us" "$SCHEDUTIL" | head -20 | tee -a "$LOG"

      # ── Phase 11: Brain Core §2 - sugov thread priority ──────────────────
      # SCHED_FIFO p=98 -> SCHED_RR p=1.
      # This cannot be done from userspace - chrt on kernel threads is a no-op.
      - name: "Brain Core §2 - sugov thread priority (SCHED_RR p=1)"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          SCHEDUTIL="drivers/cpufreq/cpufreq_schedutil.c"
          LOG="../$LOG_DIR/braincore-s2-sugov-prio.log"

          if [[ ! -f "$SCHEDUTIL" ]]; then
            echo "WARNING: $SCHEDUTIL not found - skipping" | tee "$LOG"
            exit 0
          fi

          echo "=== Brain Core §2: sugov thread priority ===" | tee "$LOG"
          echo "--- Before ---" | tee -a "$LOG"
          grep -n "MAX_RT_PRIO\|SCHED_FIFO\|sched_priority\|SCHED_RR" "$SCHEDUTIL" | tee -a "$LOG"

          cat > /tmp/patch_sugov_prio.py <<'PYEOF'
import sys
import re
from pathlib import Path

path = Path(sys.argv[1])
content = path.read_text()
original = content

# Replace MAX_RT_PRIO - 1 priority assignment with p=1
content = re.sub(
    r'(param\.sched_priority\s*=\s*)MAX_RT_PRIO\s*-\s*1(\s*;)',
    r'\g<1>1\2  /* Chimera Mk6r5: p=1 below audio stack */',
    content
)

# Replace SCHED_FIFO with SCHED_RR only for the sg_policy->thread call
content = re.sub(
    r'(sched_setscheduler_nocheck\s*\(\s*sg_policy\s*->\s*thread\s*,\s*)SCHED_FIFO(\s*,)',
    r'\g<1>SCHED_RR\2  /* Chimera Mk6r5 */',
    content
)

if content != original:
    path.write_text(content)
    print("sugov: SCHED_FIFO p=98 -> SCHED_RR p=1 applied")
    print("  Audio stack will no longer be preempted by governor thread")
else:
    print("WARNING: sugov priority pattern not matched")
    print("  Run: grep -n MAX_RT_PRIO " + str(path))
PYEOF
          python3 /tmp/patch_sugov_prio.py "$SCHEDUTIL" | tee -a "$LOG"

          echo "--- After ---" | tee -a "$LOG"
          grep -n "MAX_RT_PRIO\|SCHED_FIFO\|sched_priority\|SCHED_RR" "$SCHEDUTIL" | tee -a "$LOG"

      # ── Phase 12: Brain Core §3 - Samsung UFC disable ────────────────────
      # Severs the flags_health_check -> UFC -> schedutil reset path.
      # This is why Brain Core's 1500/16000 values reverted to 5000/5000.
      - name: "Brain Core §3 - Disable Samsung UFC notifier"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/braincore-s3-ufc.log"

          echo "=== Brain Core §3: Samsung UFC disable ===" | tee "$LOG"

          UFC_FILE=""
          for candidate in \
            "drivers/cpufreq/exynos-ufc.c" \
            "drivers/cpufreq/exynos-acme.c" \
            "drivers/cpufreq/exynos-cpu_dvfs.c"; do
            if [[ -f "$candidate" ]]; then
              UFC_FILE="$candidate"
              break
            fi
          done

          if [[ -z "$UFC_FILE" ]]; then
            echo "Primary UFC files not found - searching tree..." | tee -a "$LOG"
            grep -rn "CPUFREQ_POLICY_NOTIFIER\|ufc_notifier\|exynos_ufc" \
              drivers/cpufreq/ 2>/dev/null | tee -a "$LOG" || true
            echo "INFO: UFC file not present - skipping §3" | tee -a "$LOG"
            exit 0
          fi

          echo "UFC file: $UFC_FILE" | tee -a "$LOG"

          cat > /tmp/patch_ufc_disable.py <<'PYEOF'
import sys
import re
from pathlib import Path

path = Path(sys.argv[1])
content = path.read_text()
original = content

comment_header = (
    "\t/* UFC DISABLED - Chimera Mk6r5 / LOS 23.2\n"
    "\t * exynos-ufc notifier removed: flags_health_check resets schedutil\n"
    "\t * rates via UFC callbacks, fighting Brain Core and §1 baked values.\n"
    "\t * Brain Core manages frequency policy at runtime instead. */\n"
    "\tpr_info(\"exynos-ufc: disabled at compile time (Chimera Mk6r5)\\n\");\n"
    "\treturn 0;\n"
)

# Strategy: neutralise the module init to return early before registering notifier
init_re = re.compile(
    r'(static\s+int\s+__init\s+\w+ufc\w*_init\s*\(\s*\)\s*\{)',
    re.IGNORECASE
)

if init_re.search(content):
    content = init_re.sub(r'\1\n' + comment_header, content, count=1)
    path.write_text(content)
    print("UFC init() neutralised - returns early before notifier registration")
else:
    # Fallback: comment out just the cpufreq_register_notifier line for ufc
    new_content = re.sub(
        r'^(\s*)(return\s+cpufreq_register_notifier\s*\(&\w*ufc\w*_notifier[^;]*;)',
        r'\1/* UFC DISABLED Chimera Mk6r5: \2 */\n\1return 0;',
        content,
        flags=re.MULTILINE | re.IGNORECASE
    )
    if new_content != content:
        path.write_text(new_content)
        print("UFC cpufreq_register_notifier line commented out")
    else:
        # Last resort: grep for any CPUFREQ_POLICY_NOTIFIER registration
        new_content = re.sub(
            r'^(\s*)(cpufreq_register_notifier\s*\([^;]+CPUFREQ_POLICY_NOTIFIER[^;]*;)',
            r'\1/* UFC DISABLED Chimera Mk6r5: \2 */',
            content,
            flags=re.MULTILINE
        )
        if new_content != content:
            path.write_text(new_content)
            print("UFC CPUFREQ_POLICY_NOTIFIER registration commented out (fallback)")
        else:
            print("WARNING: No UFC notifier pattern matched in " + str(path))
PYEOF
          python3 /tmp/patch_ufc_disable.py "$UFC_FILE" | tee -a "$LOG"
          grep -n "DISABLED\|cpufreq_register_notifier\|ufc.*init" "$UFC_FILE" | \
            tee -a "$LOG" || true

      # ── Phase 13: Brain Core §4 - CFS scheduler latency tuning ──────────
      - name: "Brain Core §4 - CFS scheduler latency tuning"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          FAIR_C="kernel/sched/fair.c"
          LOG="../$LOG_DIR/braincore-s4-cfs.log"

          if [[ ! -f "$FAIR_C" ]]; then
            echo "WARNING: $FAIR_C not found - skipping" | tee "$LOG"
            exit 0
          fi

          echo "=== Brain Core §4: CFS scheduler latency ===" | tee "$LOG"
          echo "--- Before ---" | tee -a "$LOG"
          grep -n "sysctl_sched_latency\|sysctl_sched_min_gran\|sysctl_sched_wakeup\|sysctl_sched_migration" \
            "$FAIR_C" | head -10 | tee -a "$LOG"

          cat > /tmp/patch_cfs_latency.py <<'PYEOF'
import sys
import re
from pathlib import Path

path = Path(sys.argv[1])
content = path.read_text()
original = content

# sched_latency: any value -> 6ms (Chimera target, Brain Core runtime value)
content = re.sub(
    r'(unsigned\s+int\s+sysctl_sched_latency\s*=\s*)\d+ULL(\s*;[^\n]*)',
    r'\g<1>6000000ULL\2  /* 6ms Chimera Mk6r5 */',
    content
)

# sched_min_granularity: any value -> 750us
content = re.sub(
    r'(unsigned\s+int\s+sysctl_sched_min_granularity\s*=\s*)\d+ULL(\s*;[^\n]*)',
    r'\g<1>750000ULL\2  /* 750us Chimera Mk6r5 */',
    content
)

# sched_wakeup_granularity: any value -> 1ms
content = re.sub(
    r'(unsigned\s+int\s+sysctl_sched_wakeup_granularity\s*=\s*)\d+ULL(\s*;[^\n]*)',
    r'\g<1>1000000ULL\2  /* 1ms Chimera Mk6r5 */',
    content
)

# sched_migration_cost: any value -> 5ms (reduce big.LITTLE cross-cluster thrash)
content = re.sub(
    r'(unsigned\s+int\s+sysctl_sched_migration_cost\s*=\s*)\d+ULL(\s*;[^\n]*)',
    r'\g<1>5000000ULL\2  /* 5ms Chimera Mk6r5 big.LITTLE */',
    content
)

if content != original:
    path.write_text(content)
    print("CFS scheduler latency values patched")
else:
    print("INFO: CFS patterns not matched or already correct")
    print("  Verify with: grep -n sysctl_sched_latency " + str(path))
PYEOF
          python3 /tmp/patch_cfs_latency.py "$FAIR_C" | tee -a "$LOG"

          echo "--- After ---" | tee -a "$LOG"
          grep -n "sysctl_sched_latency\|sysctl_sched_min_gran\|sysctl_sched_wakeup\|sysctl_sched_migration" \
            "$FAIR_C" | head -10 | tee -a "$LOG"

      # ── Phase 14: Brain Core §5 - mmcblk0 read_ahead ─────────────────────
      # Bakes 128kb default so Brain Core's 5-min re-assertion is not needed.
      - name: "Brain Core §5 - mmcblk0 read_ahead 128kb default"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/braincore-s5-mmc.log"

          echo "=== Brain Core §5: mmcblk0 read_ahead ===" | tee "$LOG"

          cat > /tmp/patch_mmc_readahead.py <<'PYEOF'
import sys
import re
from pathlib import Path

changed = False
candidates = [
    Path("drivers/mmc/core/block.c"),
    Path("drivers/mmc/core/queue.c"),
]

for path in candidates:
    if not path.exists():
        continue
    content = path.read_text()
    original = content

    # blk_queue_read_ahead(x, 1024) -> 128
    new = re.sub(
        r'(blk_queue_read_ahead\s*\([^,]+,\s*)1024(\s*\))',
        r'\g<1>128\2  /* 128kb Chimera Mk6r5 */',
        content
    )
    # ra_pages = 256 (256 x 4k = 1024kb) -> 32 (32 x 4k = 128kb)
    new = re.sub(
        r'(\.ra_pages\s*=\s*|ra_pages\s*=\s*)256(\s*;)',
        r'\g<1>32\2  /* 128kb Chimera Mk6r5 */',
        new
    )
    new = re.sub(
        r'(backing_dev_info\.ra_pages\s*=\s*)256(\s*;)',
        r'\g<1>32\2  /* 128kb Chimera Mk6r5 */',
        new
    )

    if new != original:
        path.write_text(new)
        print("read_ahead 128kb patched in: " + str(path))
        changed = True

if not changed:
    print("INFO: read_ahead 1024kb pattern not found or already correct")
PYEOF
          python3 /tmp/patch_mmc_readahead.py | tee -a "$LOG"

      # ── Phase 15: Brain Core §7 - EMS ontime threshold tuning ────────────
      - name: "Brain Core §7 - EMS ontime threshold tuning"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/braincore-s7-ems.log"

          echo "=== Brain Core §7: EMS tuning ===" | tee "$LOG"

          if [[ ! -d "kernel/sched/ems" ]]; then
            echo "EMS directory not present in this tree - skipping §7" | tee -a "$LOG"
            exit 0
          fi

          echo "EMS directory found: kernel/sched/ems" | tee -a "$LOG"
          ls kernel/sched/ems/ | tee -a "$LOG"

          cat > /tmp/patch_ems_ontime.py <<'PYEOF'
import sys
import re
from pathlib import Path

ems_dir = Path("kernel/sched/ems")
changed = False

for src_file in ems_dir.rglob("*.c"):
    try:
        content = src_file.read_text(errors='replace')
    except Exception:
        continue
    original = content

    # up_threshold: 500 -> 700 (migrate to BIG only when genuinely loaded ~68%)
    # prevents EMS fighting Brain Core schedtune for cluster assignment
    content = re.sub(
        r'(static\s+int\s+up_threshold\s*=\s*)500(\s*;)',
        r'\g<1>700\2  /* Chimera Mk6r5: conservative BIG migration */',
        content
    )
    # down_threshold: 300 -> 200 (drop to LITTLE only when very idle ~20%)
    content = re.sub(
        r'(static\s+int\s+down_threshold\s*=\s*)300(\s*;)',
        r'\g<1>200\2  /* Chimera Mk6r5: conservative LITTLE migration */',
        content
    )

    if content != original:
        src_file.write_text(content)
        print("EMS patched: " + str(src_file))
        changed = True

if not changed:
    print("INFO: EMS threshold patterns not found or already at target values")
PYEOF
          python3 /tmp/patch_ems_ontime.py | tee -a "$LOG"

      # ── Phase 16: Brain Core §8 - Thermal trip points ────────────────────
      # Raises passive trip 65C->70C to reduce spurious throttling.
      # Aligns with Brain Core's THERMAL_HYST_HIGH=75C.
      - name: "Brain Core §8 - Thermal passive trip 65C -> 70C"
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/braincore-s8-thermal.log"

          echo "=== Brain Core §8: Thermal trip points ===" | tee "$LOG"

          THERMAL_DTS=""
          for candidate in \
            "arch/arm64/boot/dts/exynos/exynos9810-thermal.dtsi" \
            "arch/arm64/boot/dts/exynos/exynos9810_thermal.dtsi" \
            "arch/arm64/boot/dts/exynos/exynos9810-tmu.dtsi"; do
            if [[ -f "$candidate" ]]; then
              THERMAL_DTS="$candidate"
              break
            fi
          done

          if [[ -z "$THERMAL_DTS" ]]; then
            echo "Searching for thermal DTS..." | tee -a "$LOG"
            THERMAL_DTS="$(find arch/arm64/boot/dts -name '*thermal*' -o -name '*tmu*' 2>/dev/null \
              | head -1 || true)"
          fi

          if [[ -z "$THERMAL_DTS" ]]; then
            echo "WARNING: Thermal DTS not found - skipping §8" | tee -a "$LOG"
            exit 0
          fi

          echo "Thermal DTS: $THERMAL_DTS" | tee -a "$LOG"

          cat > /tmp/patch_thermal_trip.py <<'PYEOF'
import sys
import re
from pathlib import Path

path = Path(sys.argv[1])
content = path.read_text()
original = content

# Raise passive trip from 65000 (65C) to 70000 (70C)
# and widen hysteresis from 2000 to 3000 for the same passive zone
content = re.sub(
    r'(temperature\s*=\s*<\s*)65000(\s*>\s*;[^\n]*\n(?:[^\n]*\n){0,3}?[^\n]*hysteresis\s*=\s*<\s*)2000(\s*>)',
    r'\g<1>70000\g<2>3000\g<3>',
    content
)

# Simple single-line variant if DTS is formatted differently
content = re.sub(
    r'(temperature\s*=\s*<\s*)65000(\s*>)',
    r'\g<1>70000\2  /* Chimera Mk6r5: raised passive trip */',
    content
)

if content != original:
    path.write_text(content)
    print("Thermal passive trip raised 65C -> 70C in: " + sys.argv[1])
else:
    print("INFO: Thermal 65C trip pattern not matched in " + sys.argv[1])
    print("  Check DTS structure manually if throttling issues persist")
PYEOF
          python3 /tmp/patch_thermal_trip.py "$THERMAL_DTS" | tee -a "$LOG"

      # ── Phase 17: ZeroMount compatibility probe ───────────────────────────
      - name: ZeroMount compatibility probe
        if: '${{ inputs.enable_zeromount == true }}'
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          {
            echo "=== ZeroMount compatibility probe ==="
            echo "== kernel SUSFS markers =="
            grep -RsnE \
              'CONFIG_KSU_SUSFS|susfs_task_state|INODE_STATE_SUS_PATH' \
              fs include kernel 2>/dev/null || true
            grep -RsnE \
              'susfs_is_inode_sus_path|CONFIG_KSU_SUSFS_OPEN_REDIRECT' \
              fs include kernel 2>/dev/null || true
            grep -RsnE \
              'SUSFS_VERSION|CMD_SUSFS_SHOW_VERSION' \
              fs include kernel 2>/dev/null || true
            echo
            echo "== SUSFS workspace bridge markers =="
            grep -RsnE \
              'ShowVersion|supercall|SUSFS_VERSION|CMD_SUSFS' \
              "$GITHUB_WORKSPACE/susfs4ksu" 2>/dev/null | head -40 || true
          } | tee "../$LOG_DIR/zeromount-compat.log"

      # ── Phase 18: AVC-safe SUSFS config ──────────────────────────────────
      # Configured for Android 16 QPR2 / LineageOS 23.2 AVC safety.
      # SUS_MOUNT, AVC_LOG_SPOOF, SELINUX hooks all disabled.
      - name: Apply AVC-safe SUSFS config
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"
          test -f "$DEFCONFIG" || { echo "ERROR: defconfig not found at $DEFCONFIG"; exit 1; }

          set_cfg() {
            sed -i "/^${1}=.*/d"          "$DEFCONFIG"
            sed -i "/^# ${1} is not set/d" "$DEFCONFIG"
            echo "${1}=${2}" >> "$DEFCONFIG"
          }

          unset_cfg() {
            sed -i "/^${1}=.*/d"          "$DEFCONFIG"
            sed -i "/^# ${1} is not set/d" "$DEFCONFIG"
            echo "# ${1} is not set" >> "$DEFCONFIG"
          }

          # Core KSU + SUSFS - required for ABI to function
          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
          set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y

          # Conditional features (driven by workflow inputs)
          if [[ "${{ inputs.enable_susfs_open_redirect }}" == "true" ]]; then
            set_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          else
            unset_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT
          fi

          if [[ "${{ inputs.enable_susfs_hide_symbols }}" == "true" ]]; then
            set_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          else
            unset_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          fi

          if [[ "${{ inputs.enable_susfs_try_umount }}" == "true" ]]; then
            set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          else
            unset_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT
          fi

          # AVC-safe: features that trigger SELinux denials on Android 16 QPR2
          # must remain disabled for stable operation without SELinux permissive
          unset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT
          unset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME
          unset_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF
          unset_cfg CONFIG_KSU_SUSFS_AVC_LOG_SPOOF
          unset_cfg CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK
          unset_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX

      # ── Phase 19: Brain Core §6 - defconfig tuning ───────────────────────
      - name: "Brain Core §6 - defconfig (PREEMPT / HZ_300 / BBR / LZ4 / CRC32)"
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"
          LOG="../$LOG_DIR/braincore-s6-defconfig.log"

          echo "=== Brain Core §6: defconfig tuning ===" | tee "$LOG"

          set_cfg() {
            sed -i "/^${1}=.*/d"          "$DEFCONFIG"
            sed -i "/^# ${1} is not set/d" "$DEFCONFIG"
            echo "${1}=${2}" >> "$DEFCONFIG"
          }

          unset_cfg() {
            sed -i "/^${1}=.*/d"          "$DEFCONFIG"
            sed -i "/^# ${1} is not set/d" "$DEFCONFIG"
            echo "# ${1} is not set" >> "$DEFCONFIG"
          }

          # §6a: Full kernel preemption
          set_cfg   CONFIG_PREEMPT y
          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY

          # §6b: HZ_300 tick rate (better UI, avoids 1000 battery cost)
          unset_cfg CONFIG_HZ_100
          unset_cfg CONFIG_HZ_250
          set_cfg   CONFIG_HZ_300 y
          set_cfg   CONFIG_HZ 300

          # §6c: TCP BBR as default, keep CUBIC available
          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_TCP_CONG_CUBIC y
          set_cfg CONFIG_DEFAULT_TCP_CONG '"bbr"'

          # §6d: CRC32 ARMv8 hardware acceleration (eMMC/F2FS performance)
          set_cfg CONFIG_CRC32_ARMV8_CRC y

          # §6e: LZ4 for ZRAM
          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_CRYPTO_LZ4 y
          set_cfg CONFIG_CRYPTO_LZ4HC y

          # Disable LOCALVERSION_AUTO - prevents SCM git dirty suffix
          unset_cfg CONFIG_LOCALVERSION_AUTO

          echo "--- Applied config entries ---" | tee -a "$LOG"
          grep -E "PREEMPT|CONFIG_HZ|BBR|LZ4|ZRAM|LOCALVERSION|CRC32" "$DEFCONFIG" \
            | tee -a "$LOG"

      # ── Phase 20: ZRAM default algorithm ─────────────────────────────────
      - name: Patch ZRAM default compression algorithm to lz4
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          ZRAM_DRV="drivers/block/zram/zram_drv.c"
          LOG="../$LOG_DIR/zram-algo.log"

          if [[ ! -f "$ZRAM_DRV" ]]; then
            echo "INFO: zram_drv.c not found - skipping" | tee "$LOG"
            exit 0
          fi

          echo "=== ZRAM default algorithm ===" | tee "$LOG"
          echo "--- Before ---" | tee -a "$LOG"
          grep -n "ZRAM_DEF_COMP\|DEF_COMP_ALGORITHM" "$ZRAM_DRV" | tee -a "$LOG" || true

          sed -i \
            's|#define ZRAM_DEF_COMP_ALGORITHM[[:space:]]*"lzo"|#define ZRAM_DEF_COMP_ALGORITHM "lz4"|g' \
            "$ZRAM_DRV"
          sed -i \
            's|#define ZRAM_DEF_COMP[[:space:]]*"lzo"|#define ZRAM_DEF_COMP "lz4"|g' \
            "$ZRAM_DRV"

          echo "--- After ---" | tee -a "$LOG"
          grep -n "ZRAM_DEF_COMP\|DEF_COMP_ALGORITHM" "$ZRAM_DRV" | tee -a "$LOG" || true

      # ── Phase 21: Fix SCM dirty version suffix ────────────────────────────
      # Samsung 4.9 BSP appends git-dirty markers via setlocalversion,
      # CONFIG_LOCALVERSION_AUTO, and git tree detection.
      # All three paths are closed here to produce a clean version string.
      - name: Fix SCM dirty version suffix
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/scm-fix.log"

          echo "=== SCM dirty suffix fix ===" | tee "$LOG"

          # Method 1: .scmversion file - overrides git-based detection entirely
          # An empty file causes scripts/setlocalversion to skip the git path
          printf '' > .scmversion
          echo "Method 1: .scmversion created" | tee -a "$LOG"

          # Method 2: Patch scripts/setlocalversion to suppress all git output
          SETLOCALVER="scripts/setlocalversion"
          if [[ -f "$SETLOCALVER" ]]; then
            # Suppress the trailing '+' appended when tree is dirty
            sed -i 's/echo "+"/echo ""/' "$SETLOCALVER"

            # Suppress git-describe scm_version substitution
            sed -i 's/echo "\$scm_version"/echo ""/' "$SETLOCALVER" 2>/dev/null || true

            # Suppress git-based version block (common Samsung BSP pattern)
            sed -i '/scm_version=/,/fi/{
              /echo.*\$scm_version/s/echo.*\$scm_version/echo ""/
            }' "$SETLOCALVER" 2>/dev/null || true

            echo "Method 2: setlocalversion patched" | tee -a "$LOG"
          else
            echo "Method 2: setlocalversion not found - skipped" | tee -a "$LOG"
          fi

          # Method 3: CONFIG_LOCALVERSION_AUTO already unset in Phase 19
          echo "Method 3: CONFIG_LOCALVERSION_AUTO=n (set in defconfig phase)" | tee -a "$LOG"

          # Verify the current state
          echo "--- setlocalversion state (first 30 lines) ---" | tee -a "$LOG"
          head -30 "$SETLOCALVER" | tee -a "$LOG" 2>/dev/null || true

      # ── Phase 22: Chimera Mk6r5 branding ─────────────────────────────────
      # Target uname: Linux version 4.9.x-Chimera_Mk6r5-XXX (X@AegisDevLabs)
      - name: Chimera Mk6r5 branding
        working-directory: kernel
