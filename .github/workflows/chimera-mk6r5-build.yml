        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          BUILD_NUM="${BUILD_NUM:-$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")}"
          LOCALVERSION="-Chimera_Mk6r5-${BUILD_NUM}"

          export KBUILD_BUILD_USER="X"
          export KBUILD_BUILD_HOST="AegisDevLabs"
          export KBUILD_BUILD_VERSION="${BUILD_NUM}"

          MAKE=(
            make -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld"
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
