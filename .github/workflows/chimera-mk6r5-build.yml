          echo "  Brain Core §1: schedutil 1500/16000 baked"
          echo "  Brain Core §2: sugov SCHED_RR p=1"
          echo "  Brain Core §3: UFC notifier disabled"
          echo "  Brain Core §4: CFS latency 6ms/750us/1ms"
          echo "  Brain Core §5: mmcblk0 read_ahead 128kb"
          echo "  Brain Core §6: PREEMPT/HZ_300/BBR/LZ4"
          echo "  Brain Core §7: EMS ontime 700/200"
          echo "  Brain Core §8: Thermal passive trip 70C"
          echo "  SUSFS AVC-safe config applied"
          echo "  SCM dirty suffix suppressed"
          echo "  Branding: Chimera_Mk6r5-${BUILD_NUM:-001}"
          echo ""
          echo "Re-run with dry_run=false to build."
          echo "Check artifacts for all patch logs."

      # ── Phase 24: Build kernel ────────────────────────────────────────────
      - name: Build kernel
        if: '${{ inputs.dry_run == false }}'
