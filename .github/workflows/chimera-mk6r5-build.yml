          echo "BUILD_NUM=${BUILD_NUM}"  >> "$GITHUB_ENV"
          echo "LOCALVERSION_TAG=${BRAND}" >> "$GITHUB_ENV"

          echo "Branding applied: Linux version 4.9.x${BRAND} (X@AegisDevLabs)"

      # ── Phase 23: Dry-run gate ────────────────────────────────────────────
      - name: Dry run complete
        if: '${{ inputs.dry_run == true }}'
