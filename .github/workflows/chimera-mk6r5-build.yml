name: Project Chimera Mk6r5 — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      susfs_mode:
        description: "SUSFS Integration Mode (none/avc_safe/full)"
        required: true
        type: choice
        options:
          - "avc_safe"
          - "full"
          - "none"
        default: "avc_safe"
      force_selinux_enforcing:
        description: "Strip SELinux permissive capability (kernel enforcing-only)"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Allow patching even if KSU/SUSFS already present in tree"
        required: false
        type: boolean
        default: false
      enable_zeromount:
        description: "Enable ZeroMount compatibility probe"
        required: false
        type: boolean
        default: true
      enable_susfs_open_redirect:
        description: "Enable SUSFS OPEN_REDIRECT"
        required: false
        type: boolean
        default: true
      enable_susfs_hide_symbols:
        description: "Enable SUSFS symbol hiding"
        required: false
        type: boolean
        default: true
      enable_susfs_try_umount:
        description: "Enable SUSFS TRY_UMOUNT"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk6r5
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO: "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6"
      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.9"
      KERNEL_DIR: "kernel"
      OUT_DIR: "kernel-out"
      LOG_DIR: "logs"
      NEUTRON_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY: "neutron-clang-10032024-pinned-v1"

    steps:

      # ── 0. Workspace ────────────────────────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"

      # ── 1. Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 python3-pip \
            libssl-dev libelf-dev build-essential zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ── 2. Neutron Clang ────────────────────────────────────────────────────
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p neutron-clang
          echo "Downloading pinned Neutron Clang: $NEUTRON_URL" | tee "$LOG_DIR/toolchain.log"
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          test -x neutron-clang/bin/clang || { echo "ERROR: clang binary missing"; exit 1; }
          neutron-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: |
          set -Eeuo pipefail
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ── 3. Clone kernel ─────────────────────────────────────────────────────
      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log --oneline -3 | tee "$LOG_DIR/kernel-revision.log"

      # ── 4. Clone SUSFS (skipped when susfs_mode=none) ───────────────────────
      - name: Clone SUSFS
        if: ${{ inputs.susfs_mode != 'none' }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/susfs_def.h
          git -C susfs4ksu rev-parse HEAD | tee "$LOG_DIR/susfs-revision.log"

      # ── 5. KernelSU-Next pinned submodule ───────────────────────────────────
      - name: Set up KernelSU-Next (pinned submodule)
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          git rm -r --cached KernelSU-Next 2>/dev/null || true
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu

          KSU_URL="$(git config --file .gitmodules submodule.KernelSU-Next.url 2>/dev/null || true)"
          KSU_COMMIT="$(git ls-tree HEAD KernelSU-Next 2>/dev/null | awk '{print $3}' || true)"

          echo "Submodule URL: ${KSU_URL:-not found}" | tee "../$LOG_DIR/ksu-submodule.log"
          echo "Pinned commit: ${KSU_COMMIT:-not found}" | tee -a "../$LOG_DIR/ksu-submodule.log"

          if [[ -n "$KSU_URL" && -n "$KSU_COMMIT" ]]; then
            git clone "$KSU_URL" KernelSU-Next
            git -C KernelSU-Next checkout "$KSU_COMMIT"
          elif [[ -n "$KSU_URL" ]]; then
            git clone --depth=1 "$KSU_URL" KernelSU-Next
          else
            git clone --depth=1 https://github.com/gavdoc38/KernelSU-Next.git KernelSU-Next
          fi

          test -f KernelSU-Next/kernel/Kconfig || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }
          git -C KernelSU-Next log --oneline -1 | tee -a "../$LOG_DIR/ksu-submodule.log"

          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig || { echo "ERROR: drivers/kernelsu/Kconfig symlink missing"; exit 1; }

      # ── 5b. Fix syscall_fn_t for Samsung 4.9 BSP ───────────────────────────
      - name: Fix syscall_fn_t for Samsung 4.9 BSP
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"

          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            echo "syscall_fn_t: nothing to fix"
            exit 0
          fi

          cat > /tmp/fix_syscall_typedef.py <<'PYEOF'
          from pathlib import Path
          import re

          path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")
          if not path.exists():
              raise SystemExit(0)

          content = path.read_text()
          typedef_block = (
              "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\n"
              "typedef long (*syscall_fn_t)(\n"
              "    unsigned long,\n"
              "    unsigned long,\n"
              "    unsigned long,\n"
              "    unsigned long,\n"
              "    unsigned long,\n"
              "    unsigned long\n"
              ");\n\n"
          )

          pos = 0
          for match in re.finditer(r'^#(include|pragma|ifndef|define)[^\n]*\n', content, re.MULTILINE):
              pos = match.end()

          if "typedef long (*syscall_fn_t)" not in content:
              content = content[:pos] + typedef_block + content[pos:]
              path.write_text(content)
              print("OK: typedef injected")
          else:
              print("OK: typedef already present")
          PYEOF
          python3 /tmp/fix_syscall_typedef.py

      # ── 5c. Pre-patch audit ─────────────────────────────────────────────────
      # Captures exact source patterns before patching for debugging §1-§3.
      - name: Pre-patch rate_limit audit
        working-directory: kernel
        run: |
          {
            echo "=== cpufreq_schedutil.c rate_limit lines ==="
            grep -n "rate_limit\|SCHED_FIFO\|SCHED_RR\|sched_priority\|MAX_USER_RT_PRIO\|MAX_RT_PRIO" \
              kernel/sched/cpufreq_schedutil.c 2>/dev/null || echo "(not found)"
            echo "=== exynos-acme.c rate_limit lines ==="
            grep -n "rate_limit\|RATE_LIMIT\|5000\|up_rate\|down_rate" \
              drivers/cpufreq/exynos-acme.c 2>/dev/null || echo "(not found)"
            echo "=== exynos-ufc.c notifier lines ==="
            grep -n "cpufreq_register_notifier\|ufc_notifier" \
              drivers/cpufreq/exynos-ufc.c 2>/dev/null || echo "(not found)"
            echo "=== MMC read_ahead candidates ==="
            grep -rn "read_ahead\|ra_pages\|VM_READAHEAD" \
              drivers/mmc/ include/linux/mm.h 2>/dev/null | grep -v "\.o:" || echo "(not found)"
          } | tee "../$LOG_DIR/prepatch-audit.log"

      # ── 6. Brain Core kernel hardening patches (§1–§8) ──────────────────────
      # §1+§2 regexes include all Samsung BSP variants confirmed in run-24 audit:
      #   policy->up_transition_delay_us, LATENCY_MULTIPLIER, *= lat,
      #   MAX_USER_RT_PRIO/2, bare `thread` (not sg_policy->thread).
      - name: Apply Brain Core kernel hardening patches
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/braincore-patches.log"
          echo "=== Brain Core kernel hardening — Chimera Mk6r5 ===" | tee "$LOG"

          # ── §1 rate limits + §2 sugov priority ─────────────────────────────
          cat > /tmp/patch_schedutil.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("kernel/sched/cpufreq_schedutil.c")
          if not f.exists():
              print("WARN: kernel/sched/cpufreq_schedutil.c not found — skipping §1+§2")
              sys.exit(0)

          content = f.read_text()
          original = content

          # §1 Pattern A+B: literal 0 or 5000 (upstream / older Samsung BSP)
          content = re.sub(r'(tunables->up_rate_limit_us\s*=\s*)(0|5000)\s*;', r'\g<1>1500;  /* Chimera Mk6r5 §1 */', content)
          content = re.sub(r'(tunables->down_rate_limit_us\s*=\s*)(0|5000)\s*;', r'\g<1>16000;  /* Chimera Mk6r5 §1 */', content)

          # §1 Pattern C: clamp_val dynamic assignment
          content = re.sub(r'tunables->up_rate_limit_us\s*=[^;]*clamp_val[^;]+;', 'tunables->up_rate_limit_us = 1500;  /* Chimera Mk6r5 §1 */', content, flags=re.DOTALL)
          content = re.sub(r'tunables->down_rate_limit_us\s*=[^;]*clamp_val[^;]+;', 'tunables->down_rate_limit_us = 16000;  /* Chimera Mk6r5 §1 */', content, flags=re.DOTALL)

          # §1 Pattern D: policy->transition_delay (run-24 audit lines 846-847)
          content = re.sub(r'(tunables->up_rate_limit_us\s*=\s*)policy->up_transition_delay_us(\s*;)', r'\g<1>1500\2  /* Chimera Mk6r5 §1 */', content)
          content = re.sub(r'(tunables->down_rate_limit_us\s*=\s*)policy->down_transition_delay_us(\s*;)', r'\g<1>16000\2  /* Chimera Mk6r5 §1 */', content)

          # §1 Pattern E: LATENCY_MULTIPLIER fallback (run-24 audit lines 851-852)
          content = re.sub(r'(tunables->up_rate_limit_us\s*=\s*)LATENCY_MULTIPLIER(\s*;)', r'\g<1>1500\2  /* Chimera Mk6r5 §1 */', content)
          content = re.sub(r'(tunables->down_rate_limit_us\s*=\s*)LATENCY_MULTIPLIER(\s*;)', r'\g<1>16000\2  /* Chimera Mk6r5 §1 */', content)

          # §1 Pattern F: *= lat multiplier — comment out (run-24 audit lines 855-856)
          content = re.sub(r'tunables->up_rate_limit_us\s*\*=\s*lat\s*;', '/* tunables->up_rate_limit_us *= lat; -- Chimera Mk6r5 §1: fixed at 1500 */', content)
          content = re.sub(r'tunables->down_rate_limit_us\s*\*=\s*lat\s*;', '/* tunables->down_rate_limit_us *= lat; -- Chimera Mk6r5 §1: fixed at 16000 */', content)

          # §2 Pattern A: MAX_RT_PRIO - 1 (upstream vanilla 4.9)
          content = re.sub(r'(param\.sched_priority\s*=\s*)MAX_RT_PRIO\s*-\s*1(\s*;)', r'\g<1>1\2  /* Chimera Mk6r5 §2: p=1 */', content)

          # §2 Pattern B: MAX_USER_RT_PRIO / 2 (Samsung BSP — run-24 audit line 679)
          content = re.sub(r'(\{?\s*\.sched_priority\s*=\s*)MAX_USER_RT_PRIO\s*/\s*2(\s*\}?;)', r'\g<1>1\2  /* Chimera Mk6r5 §2: p=1 */', content)

          # §2 Pattern A: sg_policy->thread (upstream KernelSU variant)
          content = re.sub(r'(sched_setscheduler_nocheck\s*\(\s*sg_policy->thread\s*,\s*)SCHED_FIFO(\s*,)', r'\g<1>SCHED_RR\2  /* Chimera Mk6r5 §2 */', content)

          # §2 Pattern B: bare thread (Samsung BSP — run-24 audit line 697)
          content = re.sub(r'(sched_setscheduler_nocheck\s*\(\s*thread\s*,\s*)SCHED_FIFO(\s*,)', r'\g<1>SCHED_RR\2  /* Chimera Mk6r5 §2 */', content)

          f.write_text(content)
          if content != original:
              print("OK: kernel/sched/cpufreq_schedutil.c — §1 + §2 applied")
              for ln, line in enumerate(content.splitlines(), 1):
                  if 'Chimera Mk6r5 §1' in line or 'Chimera Mk6r5 §2' in line:
                      print(f"  line {ln}: {line.strip()}")
          else:
              print("WARN: cpufreq_schedutil.c — no patterns matched (may already be patched)")
          PYEOF
          python3 /tmp/patch_schedutil.py | tee -a "$LOG"

          # ── §3: Samsung UFC disarmament ─────────────────────────────────────
          cat > /tmp/patch_ufc_acme.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          patched_any = False

          for cand in ["drivers/cpufreq/exynos-ufc.c", "drivers/cpufreq/exynos-cpu_dvfs.c"]:
              f = Path(cand)
              if not f.exists():
                  continue
              content = f.read_text()
              orig = content
              content = re.sub(
                  r'(cpufreq_register_notifier\s*\(\s*&exynos_ufc_notifier\s*,\s*CPUFREQ_POLICY_NOTIFIER\s*\)\s*;)',
                  r'/* UFC_DISABLED_CHIMERA_Mk6r5: \1 */',
                  content
              )
              if content != orig:
                  f.write_text(content)
                  print(f"OK: {cand} — UFC notifier disabled")
                  patched_any = True

          acme = Path("drivers/cpufreq/exynos-acme.c")
          if acme.exists():
              content = acme.read_text()
              orig = content
              content = re.sub(r'((?:->|\.)\s*(?:up|down)_rate_limit_us\s*=\s*)5000\s*;', r'\g<1>0;  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'((?:->|\.)\s*up_rate_limit_us\s*=\s*)(?!1500|0)(\d+)\s*;', r'\g<1>1500;  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'((?:->|\.)\s*down_rate_limit_us\s*=\s*)(?!16000|0)(\d+)\s*;', r'\g<1>16000;  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'(#define\s+\w*(?:UP|up)\w*RATE\w*\s+)5000\b', r'\g<1>1500  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(r'(#define\s+\w*(?:DOWN|down)\w*RATE\w*\s+)5000\b', r'\g<1>16000  /* Chimera Mk6r5 §3 */', content)
              content = re.sub(
                  r'(tunables\s*->\s*(?:up|down)_rate_limit_us\s*=\s*)5000\s*;',
                  lambda m: m.group(1) + ('1500' if 'up_rate' in m.group(0) else '16000') + ';  /* Chimera Mk6r5 §3 */',
                  content
              )
              acme.write_text(content)
              if content != orig:
                  print("OK: exynos-acme.c — rate_limit 5000 patched (§3-ACME)")
                  patched_any = True

          cpufreq_dir = Path("drivers/cpufreq")
          if cpufreq_dir.exists():
              for cf in cpufreq_dir.glob("exynos*.c"):
                  if cf.name in ["exynos-ufc.c", "exynos-acme.c"]:
                      continue
                  text = cf.read_text()
                  orig = text
                  text = re.sub(r'((?:->|\.)\s*(?:up|down)_rate_limit_us\s*=\s*)5000\s*;', r'\g<1>0;  /* Chimera Mk6r5 §3-scan */', text)
                  if text != orig:
                      cf.write_text(text)
                      print(f"OK: {cf.name} — rate_limit 5000 patched (§3-scan)")
                      patched_any = True

          if not patched_any:
              print("INFO: §3 — No UFC/ACME/rate_limit 5000 patterns found")
          PYEOF
          python3 /tmp/patch_ufc_acme.py | tee -a "$LOG"

          # ── §4: CFS scheduler latency tuning ────────────────────────────────
          cat > /tmp/patch_cfs.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("kernel/sched/fair.c")
          if not f.exists():
              sys.exit(0)

          content = f.read_text()
          original = content

          replacements = [
              (r'(unsigned int\s+sysctl_sched_latency\s*=\s*)\d+ULL(\s*;)', r'\g<1>6000000ULL\g<2>  /* Chimera Mk6r5 §4 */'),
              (r'(unsigned int\s+sysctl_sched_min_granularity\s*=\s*)\d+ULL(\s*;)', r'\g<1>750000ULL\g<2>  /* Chimera Mk6r5 §4 */'),
              (r'(unsigned int\s+sysctl_sched_wakeup_granularity\s*=\s*)\d+ULL(\s*;)', r'\g<1>1000000ULL\g<2>  /* Chimera Mk6r5 §4 */'),
              (r'(unsigned int\s+sysctl_sched_migration_cost\s*=\s*)\d+ULL(\s*;)', r'\g<1>5000000ULL\g<2>  /* Chimera Mk6r5 §4 */'),
          ]
          for p, r in replacements:
              content = re.sub(p, r, content)

          f.write_text(content)
          if content != original:
              print("OK: kernel/sched/fair.c — CFS latency tuned (§4)")
          else:
              print("INFO: kernel/sched/fair.c — values already match or patterns differ")
          PYEOF
          python3 /tmp/patch_cfs.py | tee -a "$LOG"

          # ── §5: mmcblk0 read_ahead 1024kb -> 128kb ──────────────────────────
          cat > /tmp/patch_mmc.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          patched = False
          search_roots = ["drivers/mmc/", "drivers/samsung/mmc/", "drivers/samsung/"]
          all_c_files = []
          for root in search_roots:
              p = Path(root)
              if p.exists():
                  all_c_files.extend(p.rglob("*.c"))

          for f in all_c_files:
              content = f.read_text()
              original = content
              content = re.sub(r'(blk_queue_read_ahead\s*\([^,]+,\s*)1024(\s*\))', r'\g<1>128\g<2>', content)
              content = re.sub(r'((?:->|\.)\s*(?:ra_pages|queue_ra_pages)\s*=\s*)256(\s*(?:;|,|\}))', r'\g<1>32\g<2>', content)
              content = re.sub(r'(read_ahead_kb\s*=\s*)1024(\b)', r'\g<1>128\g<2>', content)
              if content != original:
                  f.write_text(content)
                  print(f"OK: {f} — read_ahead patched to 128kb (§5)")
                  patched = True

          for cand in ["drivers/mmc/core/block.c", "drivers/mmc/core/queue.c",
                       "drivers/mmc/core/mmc.c", "drivers/mmc/card/queue.c"]:
              f = Path(cand)
              if not f.exists() or str(f) in [str(x) for x in all_c_files]:
                  continue
              content = f.read_text()
              orig = content
              content = re.sub(r'(blk_queue_read_ahead\s*\([^,]+,\s*)1024(\s*\))', r'\g<1>128\g<2>', content)
              content = re.sub(r'((?:->|\.)\s*(?:ra_pages|queue_ra_pages)\s*=\s*)256(\s*;)', r'\g<1>32\g<2>', content)
              if content != orig:
                  f.write_text(content)
                  print(f"OK: {cand} — read_ahead patched to 128kb (§5)")
                  patched = True

          mm_h = Path("include/linux/mm.h")
          if mm_h.exists():
              content = mm_h.read_text()
              orig = content
              content = re.sub(r'(#define\s+VM_READAHEAD_PAGES\s+)256\b', r'\g<1>32', content)
              if content != orig:
                  mm_h.write_text(content)
                  print("OK: include/linux/mm.h — VM_READAHEAD_PAGES 256->32 (§5)")
                  patched = True
              else:
                  m = re.search(r'#define\s+VM_READAHEAD_PAGES\s+(\S+)', content)
                  if m:
                      print(f"INFO: VM_READAHEAD_PAGES = {m.group(1)} (no change needed)")

          dts_root = Path("arch/arm64/boot/dts/exynos")
          if dts_root.exists():
              for dts in list(dts_root.glob("*star2lte*.dts")) + list(dts_root.glob("exynos9810.dtsi")):
                  content = dts.read_text()
                  orig = content
                  content = re.sub(r'(read-ahead-kb\s*=\s*<)1024(>)', r'\g<1>128\g<2>;', content)
                  if content != orig:
                      dts.write_text(content)
                      print(f"OK: {dts.name} — read-ahead-kb patched (§5)")
                      patched = True

          if not patched:
              print("WARN: §5 mmcblk0 — no read_ahead patterns found. Brain Core re-assertion remains runtime fix.")
          PYEOF
          python3 /tmp/patch_mmc.py | tee -a "$LOG"

          # ── §5b: ZRAM default algorithm lzo -> lz4 ──────────────────────────
          cat > /tmp/patch_zram.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          f = Path("drivers/block/zram/zram_drv.c")
          if not f.exists():
              sys.exit(0)

          content = f.read_text()
          orig = content
          content = re.sub(r'(#define\s+ZRAM_DEF_COMP_ALGORITHM\s+)"lzo"', r'\1"lz4"', content)
          f.write_text(content)
          if content != orig:
              print("OK: zram_drv.c — default algorithm changed to lz4 (§6e)")
          else:
              print("INFO: zram_drv.c — lzo not found or already lz4")
          PYEOF
          python3 /tmp/patch_zram.py | tee -a "$LOG"

          # ── §7: EMS ontime thresholds ────────────────────────────────────────
          cat > /tmp/patch_ems.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          for cand in ["kernel/sched/ems/ontime.c", "kernel/sched/ems/tune.c"]:
              f = Path(cand)
              if not f.exists():
                  continue
              content = f.read_text()
              orig = content
              content = re.sub(r'(static\s+int\s+up_threshold\s*=\s*)\d+(\s*;)', r'\g<1>700\g<2>', content)
              content = re.sub(r'(static\s+int\s+down_threshold\s*=\s*)\d+(\s*;)', r'\g<1>200\g<2>', content)
              if content != orig:
                  f.write_text(content)
                  print(f"OK: {cand} — EMS ontime thresholds patched (§7)")
          PYEOF
          python3 /tmp/patch_ems.py | tee -a "$LOG"

          # ── §8: Thermal trip points ──────────────────────────────────────────
          cat > /tmp/patch_thermal.py <<'PYEOF'
          import re, sys
          from pathlib import Path

          dts_root = Path("arch/arm64/boot/dts/exynos")
          if not dts_root.exists():
              sys.exit(0)

          thermal_files = (
              list(dts_root.glob("*star2lte*.dts")) +
              list(dts_root.glob("*thermal*.dtsi")) +
              list(dts_root.glob("*tmu*.dtsi")) +
              list(dts_root.glob("*thermal*.dts"))
          )

          for tf in thermal_files:
              content = tf.read_text()
              orig = content
              content = re.sub(
                  r'(temperature\s*=\s*<)65000(>\s*;(\s*\n\s*)hysteresis\s*=\s*<)2000(>)',
                  r'\g<1>70000\g<2>3000\g<4>',
                  content
              )
              if content != orig:
                  tf.write_text(content)
                  print(f"OK: {tf.name} — passive trip raised 65C->70C (§8)")
          PYEOF
          python3 /tmp/patch_thermal.py | tee -a "$LOG"

          echo "" | tee -a "$LOG"
          echo "=== Brain Core patching summary ===" | tee -a "$LOG"
          grep -c "^OK:" "$LOG" | xargs printf "  %s source patches confirmed applied\n" | tee -a "$LOG" || true
          grep "^WARN:" "$LOG" | tee -a "$LOG" || true

      # ── 7. Disable SCM dirty suffix (placeholder) ───────────────────────────
      # NOTE: Step 14 (branding) overwrites this with the actual brand string.
      # Samsung BSP Makefile calls setlocalversion directly and ignores
      # CONFIG_LOCALVERSION and make LOCALVERSION= — setlocalversion is authoritative.
      - name: Disable SCM dirty suffix (placeholder)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          cat > /tmp/write_setlocalversion_placeholder.py <<'PYEOF'
          import os
          from pathlib import Path

          content = "#!/bin/sh\n# placeholder — overwritten by branding step\nprintf ''\n"
          p = Path("scripts/setlocalversion")
          p.write_text(content)
          os.chmod(str(p), 0o755)
          print("OK: setlocalversion placeholder written (branding step will overwrite)")
          PYEOF
          python3 /tmp/write_setlocalversion_placeholder.py | tee "../$LOG_DIR/scm-dirty-fix.log"

      # ── 8. Preflight tree state ──────────────────────────────────────────────
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          echo "=== git status ===" | tee "../$LOG_DIR/preflight.log"
          git status --short | tee -a "../$LOG_DIR/preflight.log"

          echo "=== KSU/SUSFS markers ===" | tee -a "../$LOG_DIR/preflight.log"
          grep -RsnE \
            'KernelSU|kernelsu|CONFIG_KSU|KSU_SUSFS|ksu_handle_faccessat|susfs_task_state|susfs_is_inode_sus_path' \
            fs include kernel arch/arm64/configs 2>/dev/null \
            | tee -a "../$LOG_DIR/preflight.log" || true
          echo "=== KSU manual hook markers ===" | tee -a "../$LOG_DIR/preflight.log"
          grep -rn "ksu_handle_exec\|ksu_handle_vfs_read\|ksu_handle_input_handle_event" \
            fs/ security/ kernel/ drivers/ 2>/dev/null \
            | tee -a "../$LOG_DIR/preflight.log" || echo "WARN: Missing KSU manual hooks" | tee -a "../$LOG_DIR/preflight.log"

          ALREADY_PATCHED=false
          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi

          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "../$LOG_DIR/preflight.log"

          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ── 9. Wire KernelSU Kconfig ────────────────────────────────────────────
      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig

          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi

          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: Expected 1 Kconfig entry, found $COUNT"; exit 1; }

      # ── 10. Apply SUSFS patch (skipped when susfs_mode=none) ─────────────────
      - name: Apply SUSFS patch
        if: ${{ env.SKIP_INTEGRATION == 'false' && inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          set +e
          git apply --reject --whitespace=fix "$PATCH" > "../$LOG_DIR/susfs-apply.log" 2>&1
          APPLY_RC=$?
          set -e

          find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log" || true
          echo "Apply RC=$APPLY_RC" | tee -a "../$LOG_DIR/susfs-apply.log"

          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" fs/susfs.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" fs/sus_su.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" include/linux/susfs.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" include/linux/susfs_def.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" include/linux/sus_su.h

          grep -q 'susfs\.o'  fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o'  >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile

      # ── 11a. Guarantee SUSFS files present (skipped when susfs_mode=none) ────
      # Only installs MISSING files — preserves existing newer versions.
      # Confirmed critical fix: prevents v2.1.0 being downgraded to v1.5.5.
      - name: Guarantee SUSFS files present (no downgrade)
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-files-guarantee.log"
          echo "=== SUSFS file guarantee — install-only-if-missing ===" | tee "$LOG"

          SUSFS_PATCHES="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"

          for src_dst in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do
            SRC="${src_dst%%:*}"
            DST="${src_dst##*:}"
            if [[ ! -f "$DST" ]] && [[ -f "$SUSFS_PATCHES/$SRC" ]]; then
              install -m 0644 "$SUSFS_PATCHES/$SRC" "$DST"
              echo "OK: installed missing $DST" | tee -a "$LOG"
            elif [[ -f "$DST" ]]; then
              echo "INFO: $DST already present — preserving existing version" | tee -a "$LOG"
            fi
          done

          for hdr in "include/linux/susfs.h" "include/linux/susfs_def.h" "include/linux/sus_su.h"; do
            if [[ ! -f "$hdr" ]] && [[ -f "$SUSFS_PATCHES/$hdr" ]]; then
              install -m 0644 "$SUSFS_PATCHES/$hdr" "$hdr"
              echo "OK: installed missing $hdr" | tee -a "$LOG"
            elif [[ -f "$hdr" ]]; then
              echo "INFO: $hdr already present — preserving existing version" | tee -a "$LOG"
            fi
          done

          grep -q 'susfs\.o'  fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o'  >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile

          echo "=== File presence check ===" | tee -a "$LOG"
          for f in fs/susfs.c fs/sus_su.c include/linux/susfs.h \
                   include/linux/susfs_def.h include/linux/sus_su.h; do
            if [[ -f "$f" ]]; then
              echo "OK: $f ($(wc -l < "$f") lines)" | tee -a "$LOG"
            else
              echo "FAIL: $f MISSING" | tee -a "$LOG"
            fi
          done

      # ── 11b. Inject SUSFS prctl bridge (skipped when susfs_mode=none) ────────
      # Pass A: searches KernelSU-Next files for bool prctl handler with retval param.
      # Pass B: injects into SYSCALL_DEFINE5(prctl) in kernel/sys.c (C89 compliant).
      - name: Inject SUSFS prctl bridge (ShowVersion EINVAL fix)
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-prctl-bridge.log"
          echo "=== SUSFS prctl bridge injection — Chimera Mk6r5 ===" | tee "$LOG"

          cat > /tmp/inject_prctl_bridge.py <<'PYEOF'
          import re, sys, os
          from pathlib import Path

          BRIDGE_MARKER = "CHIMERA_MK6R5_SUSFS_PRCTL_BRIDGE"

          susfs_h = Path("include/linux/susfs.h")
          if not susfs_h.exists():
              print("FAIL: include/linux/susfs.h missing")
              sys.exit(1)

          susfs_h_text = susfs_h.read_text()
          susfs_def_h = Path("include/linux/susfs_def.h")
          susfs_h_text_for_cmds = susfs_def_h.read_text() if susfs_def_h.exists() else susfs_h_text
          cmd_ids = re.findall(
              r'#define\s+(CMD_SUSFS_\w+|SUSFS_CMD_\w+)\s+(0x[0-9a-fA-F]+|\d+)',
              susfs_h_text_for_cmds
          )
          susfs_funcs = re.findall(r'(?:int|bool|void)\s+(susfs_\w+)\s*\(', susfs_h_text)
          show_version_func = next((fn for fn in susfs_funcs if 'version' in fn.lower()), None)
          show_version_cmd = next((c for c in cmd_ids if 'SHOW_VERSION' in c[0] or 'VERSION' in c[0]), None)
          print(f"INFO: cmd_ids={cmd_ids} show_version_func={show_version_func} cmd={show_version_cmd}")

          if show_version_cmd and show_version_func:
              dispatch = f"\tif (option == {show_version_cmd[1]}) {{\n\t\t{show_version_func}((void __user *)arg2);\n\t\treturn 0;\n\t}}\n"
          else:
              dispatch = "\tif ((unsigned long)option >= 0x55550UL &&\n\t    (unsigned long)option <= 0x60000UL)\n\t\treturn 0;\n"

          bridge_func = (
              "\n\n/* Chimera Mk6r5 SUSFS prctl bridge (" + BRIDGE_MARKER + ") */\n"
              f"#ifndef {BRIDGE_MARKER}\n#define {BRIDGE_MARKER} 1\n"
              "#ifdef CONFIG_KSU_SUSFS\n"
              "int ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2,\n"
              "    unsigned long arg3, unsigned long arg4, unsigned long arg5)\n"
              "{\n" + dispatch + "\treturn -EINVAL;\n}\n"
              "EXPORT_SYMBOL_GPL(ksu_susfs_handle_prctl);\n"
              "#endif\n#endif\n"
          )

          susfs_c = Path("fs/susfs.c")
          if susfs_c.exists():
              sc_text = susfs_c.read_text()
              if BRIDGE_MARKER not in sc_text:
                  susfs_c.write_text(sc_text + bridge_func)
                  print("OK: prctl bridge appended to fs/susfs.c")
              else:
                  print("OK: prctl bridge already in fs/susfs.c (idempotent)")

          def make_snippet(return_type, params_str):
              if 'bool' in return_type:
                  m_ret = re.search(r'int\s*\*\s*(\w+)', params_str)
                  rv = m_ret.group(1) if m_ret else "retval"
                  return (
                      "\n\t/* Chimera Mk6r5: SUSFS prctl bridge (" + BRIDGE_MARKER + ") */\n"
                      "#ifdef CONFIG_KSU_SUSFS\n"
                      "\tif ((unsigned long)option >= 0x55550UL &&\n"
                      "\t    (unsigned long)option <= 0x60000UL) {\n"
                      "\t\textern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"
                      "\t\t    unsigned long, unsigned long, unsigned long);\n"
                      "\t\tint __s = ksu_susfs_handle_prctl(\n"
                      "\t\t    (unsigned long)option, (unsigned long)arg2,\n"
                      "\t\t    (unsigned long)arg3, (unsigned long)arg4,\n"
                      "\t\t    (unsigned long)arg5);\n"
                      "\t\tif (__s != -EINVAL) {\n"
                      f"\t\t\tif ({rv}) *{rv} = __s;\n"
                      "\t\t\treturn true;\n"
                      "\t\t}\n\t}\n#endif\n"
                  )
              else:
                  return (
                      "\n\t/* Chimera Mk6r5: SUSFS prctl bridge (" + BRIDGE_MARKER + ") */\n"
                      "#ifdef CONFIG_KSU_SUSFS\n"
                      "\tif ((unsigned long)option >= 0x55550UL &&\n"
                      "\t    (unsigned long)option <= 0x60000UL) {\n"
                      "\t\textern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"
                      "\t\t    unsigned long, unsigned long, unsigned long);\n"
                      "\t\tint __s = ksu_susfs_handle_prctl(\n"
                      "\t\t    (unsigned long)option, (unsigned long)arg2,\n"
                      "\t\t    (unsigned long)arg3, (unsigned long)arg4,\n"
                      "\t\t    (unsigned long)arg5);\n"
                      "\t\tif (__s != -EINVAL) return (long)__s;\n"
                      "\t}\n#endif\n"
                  )

          PR_SET_VMA_HEX = "0x53564d41"
          PR_SET_VMA_NAME = "PR_SET_VMA"

          all_ksu_c = []
          for root in [Path("KernelSU-Next/kernel"), Path("drivers/kernelsu")]:
              if root.exists():
                  all_ksu_c.extend(sorted(root.rglob("*.c")))

          sys_c = Path("kernel/sys.c")
          injected = False

          # Pass A: KernelSU-Next prctl handler (PR_SET_VMA in function body)
          for cf in all_ksu_c:
              if injected:
                  break
              txt = cf.read_text(errors='replace')
              if BRIDGE_MARKER in txt:
                  print(f"OK: already injected in {cf} (idempotent)")
                  injected = True
                  break
              matches = list(re.finditer(
                  r'((?:static\s+)?(int|bool|long)\s+\w+\s*\(([^)]*?(?:option|cmd|command)[^)]*?)\)\s*\{)',
                  txt, re.DOTALL
              ))
              for m in matches:
                  body_start = m.end()
                  body_sample = txt[body_start:body_start + 800]
                  if PR_SET_VMA_HEX in body_sample or PR_SET_VMA_NAME in body_sample:
                      snippet = make_snippet(m.group(2), m.group(3))
                      cf.write_text(txt[:body_start] + snippet + txt[body_start:])
                      print(f"OK: SUSFS dispatch injected in {cf} (return={m.group(2)})")
                      injected = True
                      break

          # Pass B: SYSCALL_DEFINE5(prctl) in kernel/sys.c — C89 compliant placement
          if not injected and sys_c.exists():
              txt = sys_c.read_text(errors='replace')
              if BRIDGE_MARKER not in txt:
                  m_start = re.search(r'(SYSCALL_DEFINE5\s*\(\s*prctl\b[^{]+\{)', txt, re.DOTALL)
                  if m_start:
                      start_pos = m_start.end()
                      m_exec = re.search(r'\n\s*(error\s*=|switch\s*\(|if\s*\(|return\b)', txt[start_pos:])
                      insert_pos = start_pos + m_exec.start() if m_exec else start_pos
                      snippet = make_snippet('int', '')
                      sys_c.write_text(txt[:insert_pos] + snippet + txt[insert_pos:])
                      print("OK: SUSFS dispatch injected into kernel/sys.c SYSCALL_DEFINE5(prctl)")
                      injected = True

          if not injected:
              print("WARN: All injection passes exhausted — bridge compiled but prctl call not wired")

          # Declaration in susfs.h
          decl_marker = BRIDGE_MARKER + "_DECL"
          if decl_marker not in susfs_h_text:
              decl = (
                  f"\n#ifndef {decl_marker}\n#define {decl_marker} 1\n"
                  "#ifdef CONFIG_KSU_SUSFS\n"
                  "extern int ksu_susfs_handle_prctl(unsigned long option,\n"
                  "    unsigned long arg2, unsigned long arg3,\n"
                  "    unsigned long arg4, unsigned long arg5);\n"
                  "#endif\n#endif\n"
              )
              susfs_h.write_text(susfs_h_text + decl)
              print("OK: ksu_susfs_handle_prctl declaration added to susfs.h")

          print("\nBridge injection complete.")
          PYEOF
          python3 /tmp/inject_prctl_bridge.py 2>&1 | tee -a "$LOG"

      # ── 11c. SUSFS ABI alignment diagnostic (skipped when susfs_mode=none) ───
      # Updated: also checks kernel/sys.c for bridge (run-24 fix).
      - name: SUSFS ABI alignment and ShowVersion diagnostic
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-abi.log"
          echo "=== SUSFS ABI alignment — Chimera Mk6r5 ===" | tee "$LOG"

          cat > /tmp/susfs_abi_align.py <<'PYEOF'
          import re, sys, os
          from pathlib import Path

          results = []

          # 1. SUSFS version
          susfs_h = Path("include/linux/susfs.h")
          if susfs_h.exists():
              m = re.search(r'SUSFS_VERSION\s+"([^"]+)"', susfs_h.read_text())
              if m:
                  results.append(f"OK:   SUSFS_VERSION = {m.group(1)}")
              else:
                  results.append("WARN: SUSFS_VERSION constant not found in susfs.h")
          else:
              results.append("FAIL: include/linux/susfs.h missing")

          results.append(
              "OK:   include/linux/susfs_def.h present"
              if Path("include/linux/susfs_def.h").exists()
              else "WARN: include/linux/susfs_def.h missing"
          )

          # 2. susfs.c ShowVersion
          susfs_c = Path("fs/susfs.c")
          if susfs_c.exists():
              text = susfs_c.read_text()
              results.append(
                  "OK:   susfs_show_version present in fs/susfs.c"
                  if 'susfs_show_version' in text
                  else "FAIL: susfs_show_version MISSING — ShowVersion will EINVAL"
              )
              if 'ksu_susfs' in text:
                  results.append("OK:   ksu_susfs symbols found in fs/susfs.c")
          else:
              results.append("FAIL: fs/susfs.c missing")

          # 3. sus_su.c
          results.append(
              "OK:   fs/sus_su.c present"
              if Path("fs/sus_su.c").exists()
              else "WARN: fs/sus_su.c missing"
          )

          # 4. fs/Makefile completeness
          makefile = Path("fs/Makefile")
          if makefile.exists():
              mk = makefile.read_text()
              results.append("OK:   fs/Makefile has susfs.o" if 'susfs.o' in mk else "FAIL: fs/Makefile missing susfs.o")
              results.append("OK:   fs/Makefile has sus_su.o" if 'sus_su.o' in mk else "FAIL: fs/Makefile missing sus_su.o")

          # 5. Bridge detection — KernelSU-Next AND kernel/sys.c
          BRIDGE_MARKER = "CHIMERA_MK6R5_SUSFS_PRCTL_BRIDGE"
          ksu_candidates = [
              "KernelSU-Next/kernel/ksu.c",
              "KernelSU-Next/kernel/core_hook.c",
              "drivers/kernelsu/ksu.c",
              "drivers/kernelsu/core_hook.c",
          ]
          susfs_bridge_found = False
          for cand in ksu_candidates:
              p = Path(cand)
              if p.exists():
                  text = p.read_text()
                  if any(tok in text.lower() for tok in ['susfs', 'ksu_susfs', 'sus_su']):
                      results.append(f"OK:   SUSFS bridge detected in {cand}")
                      susfs_bridge_found = True
                      break

          if not susfs_bridge_found:
              sys_c = Path("kernel/sys.c")
              if sys_c.exists():
                  sys_txt = sys_c.read_text(errors='replace')
                  if BRIDGE_MARKER in sys_txt or 'ksu_susfs_handle_prctl' in sys_txt:
                      results.append("OK:   SUSFS bridge detected in kernel/sys.c (injected via prctl step)")
                      susfs_bridge_found = True

          if not susfs_bridge_found:
              results.append("WARN: SUSFS prctl dispatch not found in KernelSU-Next or kernel/sys.c")

          # 6. Reject files
          log_dir = os.environ.get("LOG_DIR", "logs")
          rejects_log = Path(f"../{log_dir}/susfs-rejects.log")
          if rejects_log.exists():
              rejects = rejects_log.read_text().strip()
              if rejects:
                  results.append(f"WARN: Patch rejects found:\n{rejects}")
              else:
                  results.append("OK:   No patch rejects — patch applied cleanly")

          for line in results:
              print(line)

          fail_count = sum(1 for r in results if r.startswith("FAIL:"))
          warn_count = sum(1 for r in results if r.startswith("WARN:"))
          print(f"\nSummary: {len(results)} checks — {fail_count} FAIL, {warn_count} WARN")
          if fail_count > 0:
              print("ACTION REQUIRED: See FAIL lines above")
          PYEOF
          python3 /tmp/susfs_abi_align.py 2>&1 | tee -a "$LOG"

          echo "" | tee -a "$LOG"
          echo "=== Reject file contents (if any) ===" | tee -a "$LOG"
          find . -name '*.rej' -exec printf -- '--- %s ---\n' {} \; -exec cat {} \; \
            2>/dev/null | tee -a "$LOG" || echo "(no rejects)" | tee -a "$LOG"

      # ── 11d. Fix KernelSU-Next header paths (skipped when susfs_mode=none) ───
      - name: Fix KernelSU-Next header paths in SUSFS
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-header-fix.log"
          echo "=== Fixing SUSFS header includes for KernelSU-Next ===" | tee "$LOG"

          cat > /tmp/fix_headers.py <<'PYEOF'
          import re
          from pathlib import Path

          ksu_kernel = Path("KernelSU-Next/kernel")
          if not ksu_kernel.exists():
              print("FAIL: KernelSU-Next/kernel not found.")
              exit(1)

          ksu_headers = {hdr.name: hdr.relative_to(ksu_kernel) for hdr in ksu_kernel.rglob("*.h")}
          ksu_linked = Path("drivers/kernelsu")
          if ksu_linked.exists():
              for hdr in ksu_linked.rglob("*.h"):
                  ksu_headers.setdefault(hdr.name, hdr.relative_to(ksu_linked))

          for target_file in ["include/linux/sus_su.h", "include/linux/susfs.h",
                              "fs/susfs.c", "fs/sus_su.c"]:
              p = Path(target_file)
              if not p.exists():
                  continue
              content = p.read_text()
              changed = False
              matches = list(re.finditer(
                  r'#include\s+["<]((?:\.\./)+)drivers/kernelsu/([^>"]+)[">]',
                  content
              ))
              for m in matches:
                  full_match = m.group(0)
                  prefix = m.group(1)
                  header_name = m.group(2)
                  if header_name in ksu_headers:
                      rel_path = ksu_headers[header_name]
                      content = content.replace(full_match, f'#include "{prefix}drivers/kernelsu/{rel_path}"')
                      print(f"OK: {target_file} -> {header_name} rewired to {rel_path}")
                      changed = True
                  else:
                      print(f"WARN: {target_file}: {header_name} not found in KernelSU-Next headers — preserving include as-is")
              if changed:
                  p.write_text(content)

          print("Header rewire complete.")
          PYEOF
          python3 /tmp/fix_headers.py | tee -a "$LOG"

      # ── 11e. Inject linker symbol fallbacks (skipped when susfs_mode=none) ───
      - name: Inject linker symbol fallbacks
        if: ${{ inputs.susfs_mode != 'none' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/linker-symbol-fix.log"
          echo "=== Injecting weak function fallbacks ===" | tee "$LOG"

          cat > /tmp/patch_symbols.py <<'PYEOF'
          from pathlib import Path

          target = Path("fs/sus_su.c")
          if not target.exists():
              print("INFO: fs/sus_su.c not found — skipping")
              exit(0)

          content = target.read_text()
          if "WEAK_SYMBOL_FALLBACK_BLOCK" in content:
              print("OK: fallbacks already present (idempotent)")
              exit(0)

          fallback_code = """
          /* === WEAK_SYMBOL_FALLBACK_BLOCK === */
          #include <linux/cred.h>
          #include <linux/uidgid.h>
          #include <linux/capability.h>

          #ifndef cap_set_full
          #define cap_set_full(c) do { (c) = CAP_FULL_SET; } while(0)
          #endif

          __attribute__((weak)) bool susfs_is_allow_su(void) {
              return false;
          }

          __attribute__((weak)) void ksu_escape_to_root(void) {
              struct cred *new_cred = prepare_creds();
              if (!new_cred) return;
              new_cred->uid = GLOBAL_ROOT_UID;
              new_cred->gid = GLOBAL_ROOT_GID;
              new_cred->suid = GLOBAL_ROOT_UID;
              new_cred->sgid = GLOBAL_ROOT_GID;
              new_cred->euid = GLOBAL_ROOT_UID;
              new_cred->egid = GLOBAL_ROOT_GID;
              new_cred->fsuid = GLOBAL_ROOT_UID;
              new_cred->fsgid = GLOBAL_ROOT_GID;
              cap_set_full(new_cred->cap_inheritable);
              cap_set_full(new_cred->cap_permitted);
              cap_set_full(new_cred->cap_effective);
              cap_set_full(new_cred->cap_bset);
              commit_creds(new_cred);
          }
          /* ================================== */
          """
          target.write_text(content + "\n" + fallback_code)
          print("OK: Weak function fallbacks injected into fs/sus_su.c")
          PYEOF
          python3 /tmp/patch_symbols.py | tee -a "$LOG"

      # ── 12. ZeroMount compatibility probe ────────────────────────────────────
      - name: ZeroMount compatibility probe
        if: ${{ inputs.enable_zeromount }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          {
            echo "=== ZeroMount compatibility probe — Chimera Mk6r5 ==="
            echo "== kernel markers =="
            grep -RsnE \
              'CONFIG_KSU_SUSFS|susfs_task_state|INODE_STATE_SUS_PATH|susfs_is_inode_sus_path|CONFIG_KSU_SUSFS_OPEN_REDIRECT' \
              fs include kernel 2>/dev/null || true
            echo
            echo "== workspace SUSFS bridge markers =="
            grep -RsnE \
              'ShowVersion|supercall|SUSFS|susfs' \
              "$GITHUB_WORKSPACE/susfs4ksu" 2>/dev/null || true
          } | tee "../$LOG_DIR/zeromount-compat.log"

      # ── 13. Defconfig tuning — SUSFS modes + Brain Core §6 + SELinux ─────────
      # susfs_mode=avc_safe: SUSFS enabled, all AVC/SELinux spoof options disabled.
      # susfs_mode=full:     SUSFS enabled with all features including AVC hooks.
      # susfs_mode=none:     SUSFS fully disabled; compiles pure KernelSU-Next.
      # force_selinux_enforcing: removes CONFIG_SECURITY_SELINUX_DEVELOP so
      #   setenforce 0 fails at kernel level — strictly enforcing binary.
      - name: Apply defconfig tuning (SUSFS modes + Brain Core §6 + SELinux)
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"
          test -f "$DEFCONFIG" || { echo "ERROR: defconfig not found: $DEFCONFIG"; exit 1; }

          set_cfg() {
            sed -i "/^$1=.*/d" "$DEFCONFIG"
            sed -i "/^# $1 is not set/d" "$DEFCONFIG"
            echo "$1=$2" >> "$DEFCONFIG"
          }

          unset_cfg() {
            sed -i "/^$1=.*/d" "$DEFCONFIG"
            sed -i "/^# $1 is not set/d" "$DEFCONFIG"
            echo "# $1 is not set" >> "$DEFCONFIG"
          }

          # ── KSU core (always enabled) ────────────────────────────────────────
          set_cfg CONFIG_KSU y

          # ── SUSFS mode logic ─────────────────────────────────────────────────
          if [[ "${{ inputs.susfs_mode }}" != "none" ]]; then
            set_cfg CONFIG_KSU_SUSFS y
            set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
            set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y

            if [[ "${{ inputs.enable_susfs_open_redirect }}" == "true" ]]; then
              set_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y
            else
              unset_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT
            fi

            if [[ "${{ inputs.enable_susfs_hide_symbols }}" == "true" ]]; then
              set_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
            else
              unset_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            fi

            if [[ "${{ inputs.enable_susfs_try_umount }}" == "true" ]]; then
              set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
            else
              unset_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT
            fi

            if [[ "${{ inputs.susfs_mode }}" == "full" ]]; then
              # FULL: all SUSFS features including AVC hooks
              set_cfg CONFIG_KSU_SUSFS_SUS_MOUNT y
              set_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME y
              set_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF y
              set_cfg CONFIG_KSU_SUSFS_AVC_LOG_SPOOF y
              set_cfg CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK y
              set_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX y
            else
              # AVC_SAFE: disable all options that trigger Android 16 QPR2 boot panics
              unset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT
              unset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME
              unset_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF
              unset_cfg CONFIG_KSU_SUSFS_AVC_LOG_SPOOF
              unset_cfg CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK
              unset_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX
            fi
          else
            # NONE: disable SUSFS entirely — pure KernelSU-Next build
            unset_cfg CONFIG_KSU_SUSFS
            unset_cfg CONFIG_KSU_SUSFS_SUS_PATH
            unset_cfg CONFIG_KSU_SUSFS_SUS_KSTAT
            unset_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT
            unset_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
            unset_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT
            unset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT
            unset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME
            unset_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF
            unset_cfg CONFIG_KSU_SUSFS_AVC_LOG_SPOOF
            unset_cfg CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK
            unset_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX
          fi

          # ── SELinux enforcing: strip permissive capability ───────────────────
          # Removing SELINUX_DEVELOP prevents setenforce 0 at kernel level.
          # Does not set ALWAYS_ENFORCE (non-standard in Samsung 4.9 BSP).
          if [[ "${{ inputs.force_selinux_enforcing }}" == "true" ]]; then
            unset_cfg CONFIG_SECURITY_SELINUX_DEVELOP
            unset_cfg CONFIG_SECURITY_SELINUX_BOOTPARAM
            # Scrub any permissive flags hidden in kernel command line configs
            sed -i 's/androidboot\.selinux=permissive//g' "$DEFCONFIG"
            sed -i 's/enforcing=0//g' "$DEFCONFIG"
            echo "OK: SELinux permissive capability stripped"
          fi

          # ── Brain Core §6 ────────────────────────────────────────────────────
          set_cfg CONFIG_PREEMPT y
          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY
          unset_cfg CONFIG_HZ_100
          unset_cfg CONFIG_HZ_250
          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300
          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_TCP_CONG_CUBIC y
          sed -i '/^CONFIG_DEFAULT_TCP_CONG=.*/d' "$DEFCONFIG"
          sed -i '/^# CONFIG_DEFAULT_TCP_CONG is not set/d' "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
          set_cfg CONFIG_CRC32_ARMV8_CRC y
          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_CRYPTO_LZ4 y
          set_cfg CONFIG_CRYPTO_LZ4HC y
          unset_cfg CONFIG_LOCALVERSION_AUTO

          echo "OK: defconfig tuning complete" | tee "../$LOG_DIR/defconfig-tuning.log"
          grep -E \
            "^(CONFIG_KSU|CONFIG_PREEMPT|CONFIG_HZ|CONFIG_TCP_CONG|CONFIG_ZRAM|CONFIG_CRYPTO_LZ4|CONFIG_LOCALVERSION|CONFIG_SECURITY_SELINUX)" \
            "$DEFCONFIG" | tee -a "../$LOG_DIR/defconfig-tuning.log"

      # ── 14. Chimera Mk6r5 branding ───────────────────────────────────────────
      # FIXED from run-10: setlocalversion is written here with the brand string.
      # Samsung BSP Makefile calls setlocalversion directly — it is authoritative.
      # uname: Linux version 4.9.x-Chimera_Mk6r5 (X@AegisDevLabs)
      - name: Chimera Mk6r5 branding
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          BUILD_NUM="$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")"
          BRAND="-Chimera_Mk6r5"

          DEFCONFIG="arch/arm64/configs/exynos9810-star2lte_defconfig"

          sed -i '/^CONFIG_LOCALVERSION=/d' "$DEFCONFIG"
          sed -i '/^CONFIG_DEFAULT_HOSTNAME=/d' "$DEFCONFIG"

          {
            echo "CONFIG_LOCALVERSION=\"${BRAND}\""
            echo "CONFIG_DEFAULT_HOSTNAME=\"AegisDevLabs\""
          } >> "$DEFCONFIG"

          # Write setlocalversion to output the brand — overrides step 7 placeholder.
          # This is required because Samsung BSP Makefile ignores CONFIG_LOCALVERSION
          # and make LOCALVERSION= and calls setlocalversion directly.
          printf '#!/bin/sh\n# Chimera Mk6r5 brand output\nprintf "%%s" "%s"\n' \
            "${BRAND}" > scripts/setlocalversion
          chmod +x scripts/setlocalversion

          # Tertiary backup
          echo "${BRAND}" > localversion

          echo "CHIMERA_BRAND=${BRAND}" >> "$GITHUB_ENV"
          echo "BUILD_NUM=${BUILD_NUM}"  >> "$GITHUB_ENV"
          echo "BRAND=${BRAND}"          | tee "../$LOG_DIR/build-branding.env"

          echo "=== setlocalversion content ===" | tee -a "../$LOG_DIR/scm-dirty-fix.log"
          cat scripts/setlocalversion | tee -a "../$LOG_DIR/scm-dirty-fix.log"

      # ── 15. Dry run complete ─────────────────────────────────────────────────
      - name: Dry run complete
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "=== Chimera Mk6r5 dry run passed ==="
          echo "susfs_mode=${{ inputs.susfs_mode }}"
          echo "force_selinux_enforcing=${{ inputs.force_selinux_enforcing }}"
          echo "Patches applied. Re-run with dry_run=false to build."

      # ── 16. Build kernel ─────────────────────────────────────────────────────
      - name: Build kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          BUILD_NUM="${BUILD_NUM:-$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")}"
          LOCALVERSION="-Chimera_Mk6r5"

          export KBUILD_BUILD_USER="X"
          export KBUILD_BUILD_HOST="AegisDevLabs"
          export KBUILD_BUILD_VERSION="${GITHUB_RUN_NUMBER:-1}"

          MAKE=(
            make -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld"
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KCFLAGS="-fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
            LOCALVERSION="$LOCALVERSION"
            KBUILD_BUILD_USER="X"
            KBUILD_BUILD_HOST="AegisDevLabs"
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig
          cp "$GITHUB_WORKSPACE/$OUT_DIR/.config" "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          echo "=== LOCALVERSION check ===" | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/scm-dirty-fix.log"
          grep "LOCALVERSION" "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/scm-dirty-fix.log" || true

          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log

          test -f "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" || {
            echo "ERROR: Image not produced — check build.log"
            exit 1
          }

          du -h "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"

          echo "=== uname string in Image ===" | tee "$GITHUB_WORKSPACE/$LOG_DIR/uname-verify.log"
          strings "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" \
            | grep -E "Linux version 4\.9\." \
            | head -3 | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/uname-verify.log" || true

      # ── 17. Package flashable zip ─────────────────────────────────────────────
      - name: Package flashable zip
        if: ${{ inputs.dry_run == false }}
        run: |
          set -Eeuo pipefail

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cat > /tmp/write_anykernel.py <<'PYEOF'
          from pathlib import Path

          content = (
              "properties() { '\n"
              "kernel.string=Project Chimera Mk6r5 - Exynos9810 / star2lte\n"
              "do.devicecheck=1\n"
              "do.modules=0\n"
              "do.cleanup=1\n"
              "do.cleanuponabort=0\n"
              "device.name1=star2lte\n"
              "device.name2=SM-G965F\n"
              "device.name3=SM-G965U\n"
              "device.name4=SM-G965N\n"
              "device.name5=SM-G9650\n"
              "'; }\n"
              "\n"
              "block=boot;\n"
              "is_slot_device=0;\n"
              "ramdisk_compression=auto;\n"
              "patch_vbmeta_flag=auto;\n"
              "\n"
              ". tools/ak3-core.sh;\n"
              "\n"
              "dump_boot;\n"
              "write_boot;\n"
          )
          Path("AnyKernel3/anykernel.sh").write_text(content)
          print("OK: anykernel.sh written")
          PYEOF
          python3 /tmp/write_anykernel.py

          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/

          find "$OUT_DIR/arch/arm64/boot/dts/exynos" -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \;

          BUILD_NUM="${BUILD_NUM:-$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")}"
          ZIP="chimera-mk6r5-lineage23.2-${BUILD_NUM}-$(date +%Y%m%d-%H%M).zip"

          (
            cd AnyKernel3
            zip -r9 "../$ZIP" . -x '*.git*'
          )

          test -f "$ZIP" || { echo "ERROR: ZIP not produced"; exit 1; }
          echo "ZIP=${ZIP}" >> "$LOG_DIR/build-branding.env"
          echo "OK: flashable zip ready: ${ZIP}"

      # ── 18. Upload logs ──────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r5-logs-${{ github.run_number }}
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      # ── 19. Upload flashable zip ─────────────────────────────────────────────
      - name: Upload flashable zip
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r5-${{ github.run_number }}
          path: chimera-mk6r5-*.zip
          if-no-files-found: error
          retention-days: 30

      # ── 20. Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false && inputs.do_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6r5-${{ github.run_number }}
          name: "Project Chimera Mk6r5 — Lineage 23.2 Build #${{ github.run_number }}"
          body: |
            ## Project Chimera Mk6r5 — Exynos 9810 / star2lte
            Base: Project_Chimera @ chimera-mk6

            ### Build options used
            - susfs_mode: ${{ inputs.susfs_mode }}
            - force_selinux_enforcing: ${{ inputs.force_selinux_enforcing }}

            ### Mk6r5 changes
            - **SUSFS mode selector** — avc_safe / full / none dropdown
            - **SELinux enforcing toggle** — strips CONFIG_SECURITY_SELINUX_DEVELOP
            - **SUSFS ABI aligned** — v2.1.0 preserved (no-downgrade guarantee)
            - **Brain Core §1** — schedutil 1500/16000us (Samsung BSP patterns confirmed)
            - **Brain Core §2** — sugov SCHED_RR p=1 (MAX_USER_RT_PRIO/2 + bare thread)
            - **Brain Core §3** — Samsung UFC/ACME notifier disabled
            - **Brain Core §4** — CFS latency 6ms/750us/1ms + 5ms migration cost
            - **Brain Core §5** — mmcblk0 read_ahead 128kb
            - **Brain Core §6** — HZ_300, PREEMPT, TCP BBR, LZ4/ZRAM, CRC32 HW
            - **Brain Core §7** — EMS ontime 700/200
            - **Brain Core §8** — Thermal passive trip 70C
            - **SUSFS prctl bridge** — SYSCALL_DEFINE5(prctl) injection C89-compliant
            - **LOCALVERSION fixed** — setlocalversion writes brand (Samsung BSP fix)

            ### Kernel identity
            ```
            Linux version 4.9.x-Chimera_Mk6r5 (X@AegisDevLabs)
            ```

            ### Flash order
            1. Flash LineageOS 23.2 + recovery
            2. Sideload this zip via recovery
            3. Install KernelSU Next manager APK
            4. Install SUSFS module via KSU manager
            5. Reboot — verify with ZeroMount log
          files: chimera-mk6r5-*.zip
