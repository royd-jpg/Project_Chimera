          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig
          cp "$GITHUB_WORKSPACE/$OUT_DIR/.config" "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          "${MAKE[@]}" LOCALVERSION="$LOCALVERSION" Image dtbs 2>&1 | tee build.log

          test -f "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" || {
            echo "ERROR: Image not produced"
            tail -80 build.log
            exit 1
          }

          du -h "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" | \
            tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"

      # ── Phase 25: AnyKernel3 packaging ───────────────────────────────────
      - name: Package flashable zip
        if: '${{ inputs.dry_run == false }}'
        run: |
          set -Eeuo pipefail

          BUILD_NUM="${BUILD_NUM:-$(printf '%03d' "$((10#${GITHUB_RUN_NUMBER:-1} % 1000))")}"

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cat > AnyKernel3/anykernel.sh <<'AKEOF'
properties() { '
kernel.string=Project Chimera Mk6r5
do.devicecheck=1
do.modules=0
do.cleanup=1
do.cleanuponabort=0
device.name1=star2lte
device.name2=SM-G965F
device.name3=SM-G965U
device.name4=SM-G965N
device.name5=SM-G9650
'; }

block=boot;
is_slot_device=0;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

. tools/ak3-core.sh;

dump_boot;
write_boot;
AKEOF

          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/

          find "$OUT_DIR/arch/arm64/boot/dts/exynos" \
            -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          ZIP="chimera-mk6r5-lineage23.2-$(date +%Y%m%d-%H%M)-b${BUILD_NUM}.zip"

          (
            cd AnyKernel3
            zip -r9 "../$ZIP" . -x '*.git*'
          )

          test -f "$ZIP" || { echo "ERROR: ZIP missing"; exit 1; }

          echo "ZIP_NAME=${ZIP}" >> "$GITHUB_ENV"
          echo "Built: $ZIP"

      # ── Phase 26: Artifacts ───────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r5-logs-${{ github.run_number }}
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload flashable zip
        if: '${{ inputs.dry_run == false }}'
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r5-${{ github.run_number }}
          path: chimera-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: '${{ inputs.dry_run == false && inputs.do_release == true }}'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6r5-${{ github.run_number }}
          name: "Project Chimera Mk6r5 - Lineage 23.2 Build #${{ github.run_number }}"
          body: |
            ## Project Chimera Mk6r5 - Exynos 9810 / star2lte
            Base: Project_Chimera @ chimera-mk6

            ### SUSFS ABI Integration (Mk6r5 headline feature)
            - Supercall ABI validated at build time (fixes ShowVersion EINVAL)
            - CMD_SUSFS_ command IDs probed and logged for module alignment
            - KSU-SUSFS bridge wiring verified pre and post patch
            - EXPORT_SYMBOL coverage checked in susfs.c
            - AVC-safe: SUS_MOUNT / AVC_LOG_SPOOF / SELINUX hooks disabled

            ### Brain Core Kernel Tuning
            - §1 schedutil: up=1500us down=16000us baked in (eliminates sugov 32% CPU)
            - §2 sugov: SCHED_FIFO p=98 -> SCHED_RR p=1 (audio no longer preempted)
            - §3 Samsung UFC notifier disabled (stops flags_health_check rate resets)
            - §4 CFS latency: 6ms / 750us / 1ms wakeup / 5ms migration cost
            - §5 mmcblk0 read_ahead: 128kb default (no more 5-min re-assertion)
            - §6 defconfig: PREEMPT=y, HZ_300, BBR default, LZ4/ZRAM, CRC32 HW
            - §7 EMS ontime: up_threshold=700 down_threshold=200 (conservative)
            - §8 Thermal: passive trip raised 65C -> 70C, hysteresis 3C

            ### Kernel Version Format
            `Linux version 4.9.x-Chimera_Mk6r5-XXX (X@AegisDevLabs)`

            ### Integrated
            - KernelSU Next (gavdoc38 pinned submodule)
            - SUSFS4KSU kernel-4.9 branch
            - ZeroMount compatibility probe
            - OPEN_REDIRECT / TRY_UMOUNT / symbol hiding enabled
            - Samsung 4.9 BSP syscall_fn_t compat fix
            - SCM dirty suffix fully suppressed

            ### Flash order
            1. Flash LineageOS 23.2 + recovery
            2. Sideload this zip
            3. Install KernelSU Next manager
            4. Install SUSFS module
            5. Reboot
            6. Verify: `ShowVersion` should succeed; check ZeroMount logs
          files: chimera-*.zip
