# ═══════════════════════════════════════════════════════════════════════════════
# Project Chimera Mk6r9 — EvolutionX 10.9 (Android 15) / Exynos 9810 (star2lte)
# ───────────────────────────────────────────────────────────────────────────────
# Base      : royd-jpg/Project_Chimera @ chimera-mk6l
# KSU       : sidex15/KernelSU-Next @ legacy-susfs-v2  ← AUDIT FINDING:
#             This branch is a self-contained fork: SUSFS is natively baked
#             into kernel/Kconfig and kernel/Makefile within the KernelSU-Next
#             source tree itself.  The 10_enable_susfs_for_ksu.patch step from
#             simonpunk is therefore REDUNDANT and has been removed.
#             The simonpunk/susfs4ksu clone is still REQUIRED for the kernel-
#             tree side files (fs/susfs.c, fs/sus_su.c, include/linux/susfs*.h)
#             which live in the Linux kernel proper, not in KernelSU-Next.
# SUSFS     : simonpunk/susfs4ksu @ kernel-4.9 (kernel-tree files only)
# Clang     : Neutron Clang 10-03-2024 (pinned)
# Target    : EvolutionX 10.9 · Android 15 · All SUSFS features enabled
# ───────────────────────────────────────────────────────────────────────────────
# REFACTOR SUMMARY
# [R1]  KSU source switched to sidex15/legacy-susfs-v2 — SUSFS native.
# [R2]  Full KSU_SUSFS defconfigs enabled for Android 15 / EvoX.
# [R3]  Branding strictly locked to 4.9.337-Chimera_Mk6r9 (X@AegisDevLabs).
# ═══════════════════════════════════════════════════════════════════════════════

name: Project Chimera Mk6r9 — EvolutionX 10.9 / Exynos 9810 (star2lte) Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS even if already present in tree"
        required: false
        type: boolean
        default: false

      ksu_repo:
        description: "KernelSU git URL (https only)"
        required: false
        type: string
        default: "https://github.com/sidex15/KernelSU-Next.git"
      ksu_ref:
        description: "KernelSU branch/tag/ref"
        required: false
        type: string
        default: "legacy-susfs-v2"
      ksu_commit:
        description: "KernelSU exact commit SHA to pin (optional)"
        required: false
        type: string
        default: ""

      susfs_repo:
        description: "SUSFS git URL (https only)"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_ref:
        description: "SUSFS branch/tag/ref"
        required: false
        type: string
        default: "kernel-4.9"
      susfs_commit:
        description: "SUSFS exact commit SHA to pin"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk6r9
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      KERNEL_REPO:          "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH:        "chimera-mk6l"
      SUSFS_TARGET_VERSION: "2.1.0"
      KERNEL_DIR:           "kernel"
      OUT_DIR:              "kernel-out"
      LOG_DIR:              "logs"

      NEUTRON_URL:  "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY:  "neutron-clang-10032024-ubuntu-24.04-v1"

      DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"
      BRAND:     "-Chimera_Mk6r9"

    steps:

      # ── 0. Workspace ─────────────────────────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "dry_run=${{ inputs.dry_run }}"
            echo "do_release=${{ inputs.do_release }}"
          } | tee "$LOG_DIR/build-inputs.log"

      # ── 1. Dependencies ───────────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 \
            libssl-dev libelf-dev build-essential \
            zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ── 2. Neutron Clang toolchain ────────────────────────────────────────────
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p neutron-clang
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          neutron-clang/bin/clang --version | tee "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ── 3. Clone kernel tree ──────────────────────────────────────────────────
      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"

      # ── 4. Clone SUSFS (kernel-tree files only) ───────────────────────────────
      - name: Clone SUSFS
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-tags "${{ inputs.susfs_repo }}" susfs4ksu
          git -C susfs4ksu checkout "${{ inputs.susfs_ref }}"

      # ── 5. Set up KernelSU-Next ───────────────────────────────────────────────
      - name: Set up KernelSU-Next
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          git clone --filter=blob:none --no-tags "${{ inputs.ksu_repo }}" KernelSU-Next
          git -C KernelSU-Next checkout "${{ inputs.ksu_ref }}"
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

      # ── 5b. Fix syscall_fn_t typedef ──────────────────────────────────────────
      - name: Fix syscall_fn_t typedef (Samsung 4.9 BSP pointer-type fix)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"
          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then exit 0; fi

          printf '%s\n' \
            'from pathlib import Path' \
            'import re' \
            'path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")' \
            'content = path.read_text()' \
            'typedef = "typedef long (*syscall_fn_t)(unsigned long, unsigned long, unsigned long, unsigned long, unsigned long, unsigned long);\n\n"' \
            'if "typedef long (*syscall_fn_t)" not in content:' \
            '    pos = re.search(r"^#(include|pragma|ifndef|define)[^\n]*\n", content, re.MULTILINE).end()' \
            '    path.write_text(content[:pos] + typedef + content[pos:])' \
            > /tmp/fix_syscall_fn_t.py
          python3 /tmp/fix_syscall_fn_t.py

      # ── 6. Preflight ──────────────────────────────────────────────────────────
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          if grep -RqsE 'source "drivers/kernelsu/Kconfig"|susfs_task_state' fs drivers; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ── 7. Wire KernelSU Kconfig ──────────────────────────────────────────────
      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'obj-y += kernelsu/' drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

      # ── 8. Apply SUSFS kernel patch ───────────────────────────────────────────
      - name: Apply SUSFS kernel patch
        if: ${{ env.SKIP_INTEGRATION == 'false' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          git apply --reject --whitespace=fix "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch" || true

      # ── 9. Guarantee SUSFS files ──────────────────────────────────────────────
      - name: Guarantee SUSFS files
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          SRC="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          for pair in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do
            [[ -f "${pair##*:}" ]] || install -m 0644 "$SRC/${pair%%:*}" "${pair##*:}"
          done
          for hdr in "include/linux/susfs.h" "include/linux/susfs_def.h" "include/linux/sus_su.h"; do
            [[ -f "$hdr" ]] || install -m 0644 "$SRC/$hdr" "$hdr"
          done
          grep -q 'susfs\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile
          sed -i '/ccflags-.*CONFIG_KSU_SUSFS.*selinux/d' fs/Makefile
          echo 'ccflags-$(CONFIG_KSU_SUSFS) += -Isecurity/selinux -Isecurity/selinux/include' >> fs/Makefile

      # ── 10. KernelSU Header Surgery ───────────────────────────────────────────
      - name: KernelSU Header Surgery
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p include/kernelsu
          find include fs -type f -exec sed -i -e 's|#include "../../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' -e 's|#include "../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' {} +
          
          printf '%s\n' \
            'from pathlib import Path' \
            'for h in ("core_hook.h", "kernel_compat.h", "ksu.h", "sucompat.h"):' \
            '    matches = [p for p in Path("KernelSU-Next").rglob(h) if "/include/" not in str(p)]' \
            '    if matches: Path("include/kernelsu") / h.write_text("\n".join(l for l in matches[0].read_text().splitlines() if "drivers/kernelsu" not in l and "<kernelsu/" not in l))' \
            > /tmp/export_headers.py
          python3 /tmp/export_headers.py

          printf '#pragma once\n#include <linux/types.h>\n#include <linux/cred.h>\n#include <linux/sched.h>\n#include <linux/uaccess.h>\nextern const struct cred *ksu_cred;\n' > include/kernelsu/ksu.h
          for hdr in include/kernelsu/core_hook.h include/kernelsu/kernel_compat.h; do
            [[ -f "$hdr" ]] && ! grep -q 'ksu_cred' "$hdr" && printf '\nextern const struct cred *ksu_cred;\n' >> "$hdr"
          done

      # ── 13. Defconfig tuning ──────────────────────────────────────────────────
      - name: Apply defconfig tuning
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          set_cfg() { sed -i "/^$1=.*/d;/^# $1 is not set/d" "$DEFCONFIG"; echo "$1=$2" >> "$DEFCONFIG"; }
          unset_cfg() { sed -i "/^$1=.*/d;/^# $1 is not set/d" "$DEFCONFIG"; echo "# $1 is not set" >> "$DEFCONFIG"; }

          set_cfg CONFIG_KSU y

          # ── ALL SUSFS features ENABLED (Android 15 / EvoX requirements) ─────
          set_cfg CONFIG_KSU_SUSFS                      y
          set_cfg CONFIG_KSU_SUSFS_SUS_PATH             y
          set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT            y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT           y
          set_cfg CONFIG_KSU_SUSFS_SUS_MAP              y
          set_cfg CONFIG_KSU_SUSFS_SUS_UNAME            y
          set_cfg CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL     y
          set_cfg CONFIG_KSU_SUSFS_HIDE_KSU_DIR         y
          set_cfg CONFIG_KSU_MANUAL_HOOKS               y
          
          # Previously disabled, now explicitly forced on
          set_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT          y
          set_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_cfg CONFIG_KSU_SUSFS_SUS_MOUNT              y
          set_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME            y

          for opt in \
            CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
            CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING \
            CONFIG_KSU_SUSFS_AVC_LOG_SPOOF \
            CONFIG_KSU_SUSFS_SELINUX_AVC_HOOK \
            CONFIG_KSU_SUSFS_SPOOF_SELINUX; do
            set_cfg "$opt" y
          done

          # ── SELinux enforcing-locked ────────────────────────────────────────
          unset_cfg CONFIG_SECURITY_SELINUX_DEVELOP
          unset_cfg CONFIG_SECURITY_SELINUX_BOOTPARAM
          unset_cfg CONFIG_SECURITY_SELINUX_DISABLE
          sed -i 's/androidboot\.selinux=permissive//g; s/\benforcing=0\b//g' "$DEFCONFIG"

          # ── Misc tuning ─────────────────────────────────────────────────────
          set_cfg CONFIG_PREEMPT y
          set_cfg CONFIG_HZ 300
          set_cfg CONFIG_TCP_CONG_BBR y
          unset_cfg CONFIG_LOCALVERSION_AUTO

      # ── 14. Branding ──────────────────────────────────────────────────────────
      - name: Apply Mk6r9 branding
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          BUILD_HOST="AegisDevLabs"
          BUILD_USER="X"

          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' "$DEFCONFIG"
          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' \
            "$BRAND" "$BUILD_HOST" >> "$DEFCONFIG"

          printf '#!/bin/sh\nprintf "%%s" "%s"\n' "$BRAND" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "$BRAND" > localversion

          echo "CHIMERA_BRAND=$BRAND"    >> "$GITHUB_ENV"
          echo "KBUILD_HOST=$BUILD_HOST" >> "$GITHUB_ENV"
          echo "KBUILD_USER=$BUILD_USER" >> "$GITHUB_ENV"

      # ── 15. Sanity check ──────────────────────────────────────────────────────
      - name: SUSFS pre-build sanity check
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          echo "uname will be: Linux version 4.9.x${BRAND} (${KBUILD_USER:-X}@${KBUILD_HOST:-AegisDevLabs})"

      # ── 17. Build kernel ──────────────────────────────────────────────────────
      - name: Build kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          export KBUILD_BUILD_USER="${KBUILD_USER:-X}"
          export KBUILD_BUILD_HOST="${KBUILD_HOST:-AegisDevLabs}"
          export KBUILD_BUILD_VERSION="${GITHUB_RUN_NUMBER:-1}"

          MAKE=(
            make -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld"
            KCFLAGS="-fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
            LOCALVERSION="$BRAND"
            KBUILD_BUILD_USER="${KBUILD_USER:-X}"
            KBUILD_BUILD_HOST="${KBUILD_HOST:-AegisDevLabs}"
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig
          "${MAKE[@]}" Image dtbs

      # ── 18. Package AnyKernel3 ───────────────────────────────────────────────
      - name: Package flashable zip
        if: ${{ inputs.dry_run == false }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          printf '%s\n' \
            "properties() { '" \
            "kernel.string=Project Chimera Mk6r9 - EvolutionX 10.9 (Android 15) / Exynos9810" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=star2lte" \
            "device.name2=SM-G965F" \
            "'; }" \
            "block=/dev/block/platform/11120000.ufs/by-name/BOOT;" \
            "is_slot_device=0;" \
            "ramdisk_compression=auto;" \
            "patch_vbmeta_flag=auto;" \
            ". tools/ak3-core.sh;" \
            "dump_boot;" \
            "write_boot;" \
            > AnyKernel3/anykernel.sh

          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          find "$OUT_DIR/arch/arm64/boot/dts/exynos" -name '*star2lte*.dtb' -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          ZIP="chimera-mk6r9-evolutionX10.9-$(date +%Y%m%d-%H%M).zip"
          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '*.git*' )

      # ── 19 & 20. Upload ───────────────────────────────────────────────────────
      - name: Upload flashable zip
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6r9-${{ github.run_number }}
          path: chimera-mk6r9-*.zip
          retention-days: 30

      # ── 21. Release ───────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false && inputs.do_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6r9-${{ github.run_number }}
          name: "Project Chimera Mk6r9 — EvolutionX 10.9 Build #${{ github.run_number }}"
          body: |
            ## Project Chimera Mk6r9 — Exynos 9810 / star2lte
            **Target:** EvolutionX 10.9 (Android 15)
            **KSU:** `sidex15/KernelSU-Next @ legacy-susfs-v2` (SUSFS native)
            **SUSFS:** `simonpunk/susfs4ksu @ kernel-4.9` 

            ### SUSFS feature set (Maximum allowed for EvoX)
            | Feature | State |
            |---|---|
            | SUS_PATH & SUS_MAP | ✅ enabled |
            | TRY_UMOUNT & SUS_KSTAT | ✅ enabled |
            | OPEN_REDIRECT | ✅ enabled |
            | All AVC/SELinux spoof options | ✅ enabled |

          files: chimera-mk6r9-*.zip
