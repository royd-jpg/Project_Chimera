name: Project Chimera — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      do_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chimera-lineage23-2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  KERNEL_BRANCH: chimera-mk5-r3.1
  KERNEL_REPO: https://github.com/royd-jpg/android_kernel_samsung_exynos9810
  NEUTRON_CATALOG_API: https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest
  NEUTRON_CLANG_SERIES: '19'
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          retry() {
            local attempts=3 delay=10 n=1
            until "$@"; do
              if (( n >= attempts )); then
                echo "ERROR: command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "WARN: command failed (attempt ${n}/${attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              n=$((n + 1))
            done
          }
          retry sudo apt-get update -qq
          retry sudo apt-get install -yqq --no-install-recommends \
            git curl ca-certificates bc flex bison python3 ccache \
            libssl-dev libelf-dev build-essential \
            zip zstd lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Resolve Neutron Clang release
        id: neutron-release
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$NEUTRON_CATALOG_API")"
          RELEASE_JSON="$release_json" python3 - "$NEUTRON_CLANG_SERIES" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          series = sys.argv[1]
          output = sys.argv[2]
          release = json.loads(os.environ["RELEASE_JSON"])
          assets = release.get("assets", [])
          matches = [
              asset for asset in assets
              if asset.get("name", "").endswith(".tar.zst")
              and (f"clang-{series}" in asset.get("name", "") or series in asset.get("name", ""))
              and asset.get("browser_download_url")
          ]
          if not matches:
              raise SystemExit(f"ERROR: no Neutron Clang {series} .tar.zst asset found")
          asset = matches[0]
          with open(output, "a", encoding="utf-8") as fh:
              fh.write(f"asset_name={asset['name']}\n")
              fh.write(f"download_url={asset['browser_download_url']}\n")
              fh.write(f"cache_key={asset['name'].removesuffix('.tar.zst')}\n")
          print(f"Selected Neutron Clang asset: {asset['name']}")
          PY

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: neutron-clang-${{ steps.neutron-release.outputs.cache_key }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p neutron-clang
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o /tmp/neutron.tar.zst \
            "${{ steps.neutron-release.outputs.download_url }}"
          tar --zstd -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          test -x neutron-clang/bin/clang || { echo "ERROR: neutron-clang/bin/clang missing after extraction" >&2; exit 1; }
          echo "Clang: $(neutron-clang/bin/clang --version | head -1)"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-
            ccache-${{ runner.os }}-

      - name: Export toolchain PATH
        run: |
          set -euo pipefail
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Clone kernel tree
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            kernel

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf drivers/kernelsu KernelSU KernelSU-Next fs/susfs
          sed -i '/susfs\/Kconfig/d' fs/Kconfig
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig

          git clone --depth=1 \
            https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          if ! grep -q "^endmenu" drivers/Kconfig; then
            echo "endmenu" >> drivers/Kconfig
          fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # SUSFS stubs to satisfy Kconfig references
          mkdir -p fs/susfs
          echo 'config SUSFS'             >> fs/susfs/Kconfig
          echo '    bool "SUSFS Support"' >> fs/susfs/Kconfig
          echo '    default y'            >> fs/susfs/Kconfig
          echo 'obj-y += susfs.o'         > fs/susfs/Makefile
          echo 'void susfs_stub(void) {}' > fs/susfs/susfs.c
          sed -i '/if BLOCK/i source "fs/susfs/Kconfig"' fs/Kconfig

          # Bypassing Bash heredoc conflict via Python
          mkdir -p include/linux
          python3 -c '
          with open("include/linux/susfs.h", "w") as f:
              f.write("#ifndef _SUSFS_H\n#define _SUSFS_H\n")
              f.write("#include <linux/types.h>\n")
              f.write("#define SUSFS_VERSION \"1.5.1\"\n#endif\n")
          '
          echo "KernelSU Next integrated."

      - name: Inject manual KSU hooks (Samsung 4.9 BSP)
        working-directory: kernel
        run: |
          set -euo pipefail
          # ── fs/exec.c — execve hook ──────────────────────────────────────
          python3 -c '
          import re, sys
          with open(sys.argv[1]) as f:
              content = f.read()
          if "ksu_handle_execveat_sucompat" in content:
              print("exec.c already patched")
              sys.exit(0)
          include_end = 0
          for m in re.finditer(r"^#include\s+[<\"]", content, re.MULTILINE):
              include_end = m.end()
          if include_end == 0:
              raise SystemExit(f"ERROR: no include block found in {sys.argv[1]}")
          nl = content.index("\n", include_end)
          insert_pos = nl + 1
          extern_decl = "\nextern void ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n"
          content = content[:insert_pos] + extern_decl + content[insert_pos:]
          anchor = "\tret = search_binary_handler(bprm);"
          if anchor not in content:
              raise SystemExit("ERROR: search_binary_handler anchor not found in fs/exec.c")
          hook_call = "\tksu_handle_execveat_sucompat(&bprm->fd, &bprm->filename, NULL, NULL, NULL);\n\t"
          content = content.replace(anchor, hook_call + "ret = search_binary_handler(bprm);", 1)
          with open(sys.argv[1], "w") as f:
              f.write(content)
          print("fs/exec.c patched successfully")
          ' fs/exec.c

          # ── fs/open.c — faccessat hook ───────────────────────────────────
          python3 -c '
          import re, sys
          with open(sys.argv[1]) as f:
              content = f.read()
          if "ksu_handle_faccessat" in content:
              print("open.c already patched")
              sys.exit(0)
          include_end = 0
          for m in re.finditer(r"^#include\s+[<\"]", content, re.MULTILINE):
              include_end = m.end()
          if include_end == 0:
              raise SystemExit(f"ERROR: no include block found in {sys.argv[1]}")
          nl = content.index("\n", include_end)
          insert_pos = nl + 1
          extern_decl = "\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n"
          content = content[:insert_pos] + extern_decl + content[insert_pos:]
          pattern = r"(SYSCALL_DEFINE3\(faccessat,\s*int,\s*dfd,.*?int,\s*mode\)\s*\{)"
          def insert_hook(m):
              return m.group(1) + "\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);"
          content, replaced = re.subn(pattern, insert_hook, content, count=1, flags=re.DOTALL)
          if replaced != 1:
              raise SystemExit("ERROR: faccessat syscall anchor not found in fs/open.c")
          with open(sys.argv[1], "w") as f:
              f.write(content)
          print("fs/open.c patched successfully")
          ' fs/open.c
          
          echo "Manual KSU hooks injected."

      - name: Patch kernel for Clang 19
        working-directory: kernel
        run: |
          set -euo pipefail
          sed -i 's/-std=gnu89/-std=gnu11 -fcommon/g' Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -std=gnu11 -fcommon /' Makefile

          END_LINE=$(grep -n "^\s*-std=gnu" Makefile | tail -1 | cut -d: -f1)
          sed -i "${END_LINE}a KBUILD_CFLAGS += -Wno-address-of-packed-member -Wno-int-in-bool-context -Wno-asm-operand-widths -DSUSFS_VERSION=1.5.1" Makefile

          F="arch/arm64/configs/exynos9810-star2lte_defconfig"
          kset() {
            local key="$1" val="$2"
            grep -q "^${key}=" "$F" \
              && sed -i "s|^${key}=.*|${key}=${val}|" "$F" \
              || echo "${key}=${val}" >> "$F"
          }

          kset CONFIG_HZ_300 y
          kset CONFIG_HZ 300
          kset CONFIG_PREEMPT y
          kset CONFIG_KSU y
          kset CONFIG_KSU_ALLOWLIST_WORKAROUND y
          kset CONFIG_KPROBES y
          kset CONFIG_KPROBE_EVENTS y

          sed -i 's/^CONFIG_CRYPTO_\(.*\)=m$/CONFIG_CRYPTO_\1=y/' "$F"
          echo "Defconfig tuned."

      - name: Patch DTS
        working-directory: kernel
        run: |
          set -euo pipefail
          DTS="arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts"
          sed -i 's/size = <461373440>;/size = <603979776>;/' "$DTS" || true
          sed -i 's/min-residency-us = <2000>/min-residency-us = <400>/' \
            arch/arm64/boot/dts/exynos/exynos9810.dtsi 2>/dev/null || true
          echo "DTS patched."

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          ccache --zero-stats
          MAKE=(
            make -j"$(nproc)"
            ARCH=arm64
            SUBARCH=arm64
            CC="ccache clang"
            HOSTCC="ccache gcc"
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD=$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KCFLAGS="-std=gnu11 -fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
          )
          "${MAKE[@]}" exynos9810-star2lte_defconfig
          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log

          test -f arch/arm64/boot/Image || \
            { echo "ERROR: Image not produced — check build.log"; exit 1; }
          echo "Build succeeded: $(du -h arch/arm64/boot/Image)"
          ccache --show-stats

      - name: Package flashable zip
        run: |
          set -euo pipefail
          git clone --depth=1 --single-branch https://github.com/osm0sis/AnyKernel3 AnyKernel3
          
          # Bypassing Bash heredoc conflict via Python
          python3 -c '
          with open("AnyKernel3/anykernel.sh", "w") as f:
              f.write("properties() { '"'"'\n")
              f.write("kernel.string=Project Chimera — Lineage 23.2 / star2lte\n")
              f.write("do.devicecheck=1\n")
              f.write("do.modules=0\n")
              f.write("do.cleanup=1\n")
              f.write("do.cleanuponabort=0\n")
              f.write("device.name1=star2lte\n")
              f.write("device.name2=SM-G965F\n")
              f.write("device.name3=SM-G965U\n")
              f.write("device.name4=SM-G965N\n")
              f.write("device.name5=SM-G9650\n")
              f.write("'"'"'; }\n")
              f.write("block=boot;\n")
              f.write("is_slot_device=0;\n")
              f.write("ramdisk_compression=auto;\n")
              f.write("patch_vbmeta_flag=auto;\n")
              f.write(". tools/ak3-core.sh;\n")
              f.write("dump_boot;\n")
              f.write("write_boot;\n")
          '

          test -f kernel/arch/arm64/boot/Image || { echo "ERROR: kernel Image missing before packaging" >&2; exit 1; }
          cp kernel/arch/arm64/boot/Image AnyKernel3/
          dtb_count=$(find kernel/arch/arm64/boot/dts/exynos/ -name "*.dtb" -exec cp {} AnyKernel3/ \; -print | wc -l)
          if [[ "$dtb_count" -eq 0 ]]; then
            echo "ERROR: no Exynos DTBs were found for packaging" >&2
            exit 1
          fi

          (cd AnyKernel3 && zip -r9 "../chimera-lineage23.2-$(date +%Y%m%d-%H%M).zip" . -x "*.git*")
          ls -lh chimera-*.zip

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: chimera-lineage23.2-${{ github.run_number }}
          path: ./*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ github.run_number }}
          path: |
            kernel/build.log
            kernel/**/*.rej
            kernel/**/*.orig
          if-no-files-found: ignore
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-${{ github.run_number }}
          name: "Project Chimera — Lineage 23.2 Build #${{ github.run_number }}"
          body: |
            ## Project Chimera — Exynos 9810 / star2lte
            Built from: chimera-mk5-r3.1 + KernelSU Next (manual hooks)

            ### What changed
            - Manual KSU hooks injected into fs/exec.c and fs/open.c
            - Samsung 4.9 BSP compatible (no kprobe dependency)
            - HZ_300, SchedUtil, camera ION 576MB, CPU idle tuned

            ### Flash order
            1. Flash Lineage 23.2 + its recovery
            2. Sideload this zip via recovery
            3. Install KernelSU Next manager APK
            4. Reboot
          files: ./*.zip
