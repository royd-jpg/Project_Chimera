name: Project Chimera — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      do_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: chimera-lineage23-2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  KERNEL_BRANCH: chimera-mk5-r3.1
  KERNEL_REPO: https://github.com/royd-jpg/android_kernel_samsung_exynos9810
  NEUTRON_CATALOG_API: https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          retry() {
            local attempts=3 delay=10 n=1
            until "$@"; do
              if (( n >= attempts )); then
                echo "ERROR: command failed after ${attempts} attempts: $*" >&2
                return 1
              fi
              echo "WARN: command failed (attempt ${n}/${attempts}); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              n=$((n + 1))
            done
          }
          retry sudo apt-get update -qq
          retry sudo apt-get install -yqq --no-install-recommends \
            git curl ca-certificates bc flex bison python3 ccache \
            libssl-dev libelf-dev build-essential \
            zip zstd lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Resolve Neutron Clang release
        id: neutron-release
        run: |
          set -euo pipefail
          release_json="$(curl -fsSL --retry 5 --retry-delay 10 --retry-all-errors "$NEUTRON_CATALOG_API")"
          RELEASE_JSON="$release_json" python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import sys

          output = sys.argv[1]
          release = json.loads(os.environ["RELEASE_JSON"])
          assets = release.get("assets", [])
          matches = [
              asset for asset in assets
              if asset.get("name", "").endswith(".tar.zst")
              and asset.get("browser_download_url")
          ]
          if not matches:
              raise SystemExit("ERROR: no .tar.zst asset found in latest Neutron release")
          asset = matches[0]
          with open(output, "a", encoding="utf-8") as fh:
              fh.write(f"asset_name={asset['name']}\n")
              fh.write(f"download_url={asset['browser_download_url']}\n")
              fh.write(f"cache_key={asset['name'].removesuffix('.tar.zst')}\n")
          PY

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: neutron-clang-${{ steps.neutron-release.outputs.cache_key }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p neutron-clang
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
            -o /tmp/neutron.tar.zst \
            "${{ steps.neutron-release.outputs.download_url }}"
          tar --zstd -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          echo "Clang: $(neutron-clang/bin/clang --version | head -1)"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.KERNEL_BRANCH }}-
            ccache-${{ runner.os }}-

      - name: Export toolchain PATH
        run: |
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Clone kernel tree
        run: |
          git clone --depth=1 --single-branch -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      - name: Integrate KernelSU Next
        working-directory: kernel
        run: |
          set -euo pipefail
          rm -rf drivers/kernelsu KernelSU KernelSU-Next fs/susfs
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          if ! grep -q "^endmenu" drivers/Kconfig; then echo "endmenu" >> drivers/Kconfig; fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # SUSFS stubs
          mkdir -p fs/susfs
          echo 'config SUSFS' > fs/susfs/Kconfig
          echo ' bool "SUSFS"' >> fs/susfs/Kconfig
          echo ' default y' >> fs/susfs/Kconfig
          echo 'obj-y += susfs.o' > fs/susfs/Makefile
          echo 'void susfs_stub(void) {}' > fs/susfs/susfs.c
          sed -i '/susfs\/Kconfig/d' fs/Kconfig
          sed -i '/if BLOCK/i source "fs/susfs/Kconfig"' fs/Kconfig
          
          mkdir -p include/linux
          echo -e "#ifndef _SUSFS_H\n#define _SUSFS_H\n#define SUSFS_VERSION \"1.5.1\"\n#endif" > include/linux/susfs.h

      - name: Inject manual KSU hooks (Samsung 4.9 BSP)
        working-directory: kernel
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          # ── fs/exec.c — execve hook (Kernel 4.9 Local Scope Fix) ─────────
          python3 - fs/exec.c <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              content = f.read()
          if 'ksu_handle_execveat_sucompat' in content:
              print('exec.c already patched')
              raise SystemExit(0)

          include_end = 0
          for match in re.finditer(r'^#include\s+[<"]', content, re.MULTILINE):
              include_end = match.end()
          if include_end == 0:
              raise SystemExit('ERROR: no #include block found in fs/exec.c')

          nl = content.index('\n', include_end)
          extern_decl = '\nextern void ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n'
          content = content[:nl + 1] + extern_decl + content[nl + 1:]

          # Kernel 4.9 specific: use &fd instead of &bprm->fd
          needle = '\tret = search_binary_handler(bprm);'
          hook = '\tksu_handle_execveat_sucompat(&fd, &bprm->filename, NULL, NULL, NULL);\n'
          if needle not in content:
              raise SystemExit('ERROR: search_binary_handler anchor not found in fs/exec.c')
          content = content.replace(needle, hook + needle.lstrip(), 1)
          
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('fs/exec.c patched successfully for 4.9 BSP')
          PY

          # ── fs/open.c — faccessat hook ───────────────────────────────────
          python3 - fs/open.c <<'PY'
          import re
          import sys

          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              content = f.read()
          if 'ksu_handle_faccessat' in content:
              print('open.c already patched')
              raise SystemExit(0)

          include_end = 0
          for match in re.finditer(r'^#include\s+[<"]', content, re.MULTILINE):
              include_end = match.end()
          
          nl = content.index('\n', include_end)
          extern_decl = '\nextern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode, int *flags);\n'
          content = content[:nl + 1] + extern_decl + content[nl + 1:]
          pattern = r'(SYSCALL_DEFINE3\(faccessat,\s*int,\s*dfd,.*?int,\s*mode\)\s*\{)'
          content, count = re.subn(
              pattern,
              lambda m: m.group(1) + '\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);',
              content,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit('ERROR: faccessat syscall anchor not found in fs/open.c')
          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('fs/open.c patched successfully')
          PY
          echo 'Manual KSU hooks injected.'

      - name: Patch kernel for Clang 19 & Tuning
        working-directory: kernel
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          sed -i 's/-std=gnu89/-std=gnu11 -fcommon/g' Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -std=gnu11 -fcommon /' Makefile

          end_line="$(grep -n '^[[:space:]]*-std=gnu' Makefile | tail -1 | cut -d: -f1 || true)"
          sed -i "${end_line}a KBUILD_CFLAGS += -Wno-address-of-packed-member -Wno-int-in-bool-context -Wno-asm-operand-widths -DSUSFS_VERSION=1.5.1" Makefile

          defconfig='arch/arm64/configs/exynos9810-star2lte_defconfig'
          kset() {
            local key="$1" val="$2"
            if grep -q "^${key}=" "$defconfig"; then
              sed -i "s|^${key}=.*|${key}=${val}|" "$defconfig"
            else
              echo "${key}=${val}" >> "$defconfig"
            fi
          }

          # Performance & KSU
          kset CONFIG_HZ_300 y
          kset CONFIG_HZ 300
          kset CONFIG_PREEMPT y
          kset CONFIG_KSU y
          kset CONFIG_KSU_ALLOWLIST_WORKAROUND y
          
          # Kprobes Disabled (Manual hooks used instead)
          kset CONFIG_KPROBES n
          kset CONFIG_KPROBE_EVENTS n

          sed -i 's/^CONFIG_CRYPTO_\(.*\)=m$/CONFIG_CRYPTO_\1=y/' "$defconfig"
          echo 'Defconfig tuned (Kprobes disabled).'

      - name: Patch kernel for Clang 19
        working-directory: kernel
        run: |
          sed -i 's/-std=gnu89/-std=gnu11 -fcommon/g' Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -std=gnu11 -fcommon /' Makefile
          
          F="arch/arm64/configs/exynos9810-star2lte_defconfig"
          echo "CONFIG_HZ_300=y" >> "$F"
          echo "CONFIG_HZ=300" >> "$F"
          echo "CONFIG_KSU=y" >> "$F"
          echo "CONFIG_KPROBES=y" >> "$F"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$F"

      - name: Build kernel
        working-directory: kernel
        run: |
          set -euo pipefail
          ccache --zero-stats
          MAKE=(
            make -j"$(nproc)" ARCH=arm64 SUBARCH=arm64
            CC="ccache clang" HOSTCC="ccache gcc"
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD=$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
            KCFLAGS="-std=gnu11 -fcommon -Wno-implicit-function-declaration -Wno-return-type"
          )
          "${MAKE[@]}" exynos9810-star2lte_defconfig
          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log
          ccache --show-stats

      - name: Package and Upload
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp kernel/arch/arm64/boot/Image AnyKernel3/
          find kernel/arch/arm64/boot/dts/exynos/ -name "*.dtb" -exec cp {} AnyKernel3/ \;
          (cd AnyKernel3 && zip -r9 "../chimera-lineage23.2-$(date +%H%M).zip" . -x "*.git*")

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chimera-build
          path: ./*.zip

      - name: Create Release
        if: ${{ inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-${{ github.run_number }}
          files: ./*.zip
