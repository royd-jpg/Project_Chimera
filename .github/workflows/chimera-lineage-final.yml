name: Project Chimera — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      do_release:
        description: 'Create a GitHub Release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Dependencies ──────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 \
            libssl-dev libelf-dev build-essential \
            zip zstd lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ── 2. Neutron Clang 19 ───────────────────────────────────────────────
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: neutron-clang-10032024

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          mkdir -p neutron-clang
          URL=$(curl -fsSL \
            https://api.github.com/repos/Neutron-Toolchains/clang-build-catalogue/releases/latest \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          hits=[a['browser_download_url'] for a in d.get('assets',[])
                if a['name'].endswith('.tar.zst')]
          print(hits[0] if hits else '')
          ")
          [[ -n "$URL" ]] || { echo "ERROR: Neutron Clang not found"; exit 1; }
          wget -qO /tmp/neutron.tar.zst "$URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          echo "Clang: $(neutron-clang/bin/clang --version | head -1)"

      - name: Export toolchain PATH
        run: |
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ── 3. Clone kernel ───────────────────────────────────────────────────
      - name: Clone kernel tree
        run: |
          git clone --depth=1 \
            -b chimera-mk5-r3.1 \
            https://github.com/royd-jpg/android_kernel_samsung_exynos9810 \
            kernel

            # ── 4. KernelSU Next & SUSFS Prep ──────────────────────────────────────
      - name: Integrate KernelSU Next and SUSFS
        working-directory: kernel
        run: |
          # Clean up previous attempts
          rm -rf drivers/kernelsu KernelSU KernelSU-Next
          
          # Integrate KernelSU Next
          git clone --depth=1 https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          
          # Remove existing Kconfig entries to prevent duplicates
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          
          # Ensure endmenu exists and inject Kconfig
          if ! grep -q "^endmenu" drivers/Kconfig; then echo "endmenu" >> drivers/Kconfig; fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Prep SUSFS Headers (Using a more stable raw link)
          mkdir -p include/linux/susfs
          # We use -L to follow redirects and -S to show errors
          wget -qS -O include/linux/susfs.h https://raw.githubusercontent.com/sid75/susfs_patches/main/Kernel_Patches/include/linux/susfs.h || \
          wget -qS -O include/linux/susfs.h https://raw.githubusercontent.com/sid75/susfs_patches/main/Kernel_Patches/Kernel_4.9/include/linux/susfs.h

          # Verify the file is not empty
          if [ ! -s include/linux/susfs.h ]; then
            echo "ERROR: susfs.h is empty or download failed"
            exit 1
          fi
          
          echo "KernelSU Next and SUSFS headers integrated successfully"

      # ── 5. Defconfig & Makefile Surgical Fixes ────────────────────────────
      - name: Patch Kernel Core for Clang 19
        working-directory: kernel
        run: |
          # 1. Force GNU11 and relax duplicate symbols (Fixes init/main.c and Crypto errors)
          sed -i 's/-std=gnu89/-std=gnu11 -fcommon/g' Makefile
          sed -i 's/HOSTCFLAGS   :=/HOSTCFLAGS   := -std=gnu11 -fcommon /' Makefile

          # 2. Add Clang 19 suppressions and SUSFS flag
          END_LINE=$(grep -n "^\s*-std=gnu" Makefile | tail -1 | cut -d: -f1)
          sed -i "${END_LINE}a KBUILD_CFLAGS += -Wno-address-of-packed-member -Wno-int-in-bool-context -Wno-asm-operand-widths -DSUSFS_VERSION=1.5.1" Makefile

          # 3. Defconfig Tuning
          F="arch/arm64/configs/exynos9810-star2lte_defconfig"
          kset() {
            local key="$1" val="$2"
            grep -q "^${key}=" "$F" && sed -i "s|^${key}=.*|${key}=${val}|" "$F" || echo "${key}=${val}" >> "$F"
          }
          kset CONFIG_HZ_300 y
          kset CONFIG_HZ 300
          kset CONFIG_PREEMPT y
          kset CONFIG_KSU y
          kset CONFIG_KSU_ALLOWLIST_WORKAROUND y
          # Built-in crypto to avoid module symbol conflicts
          sed -i 's/^CONFIG_CRYPTO_\(.*\)=m$/CONFIG_CRYPTO_\1=y/' "$F"

      # ── 6. DTS Tuning ─────────────────────────────────────────────────────
      - name: Patch DTS
        working-directory: kernel
        run: |
          DTS="arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts"
          # Expand Camera ION heap
          sed -i 's/size = <461373440>;/size = <603979776>;/' "$DTS" || true
          # Tune CPU Idle
          sed -i 's/min-residency-us = <2000>/min-residency-us = <400>/' arch/arm64/boot/dts/exynos/exynos9810.dtsi || true

      # ── 7. Build ──────────────────────────────────────────────────────────
      - name: Build kernel
        working-directory: kernel
        run: |
          MAKE=(
            make -j"$(nproc)"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD=$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld
            AR=llvm-ar NM=llvm-nm
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KCFLAGS="-std=gnu11 -fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig
          "${MAKE[@]}" Image.gz dtbs 2>&1 | tee build.log

      # ── 8. Package ────────────────────────────────────────────────────────
      - name: Package flashable zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          find kernel/arch/arm64/boot/dts/exynos/ -name "*.dtb" -exec cp {} AnyKernel3/ \;
          
          cd AnyKernel3
          zip -r9 "../chimera-lineage23.2-$(date +%Y%m%d).zip" . -x "*.git*"
          cd ..

      # ── 9. Upload ─────────────────────────────────────────────────────────
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Project-Chimera-Build
          path: chimera-*.zip
