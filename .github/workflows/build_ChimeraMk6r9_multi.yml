            | SUS_KSTAT | ✅ |
            | SUS_MAP | ✅ |
            | SUS_UNAME | ✅ |
            | TRY_UMOUNT | ✅ |
            | SPOOF_UNAME | ✅ |
            | SPOOF_CMDLINE_OR_BOOTCONFIG | ✅ |
            | OPEN_REDIRECT | ✅ |
            | HIDE_KSU_SUSFS_SYMBOLS | ✅ |
