        if: '${{ inputs.dry_run == false && inputs.do_release == true }}'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'chimera-mk6r9-${{ github.run_number }}'
          name: >-
            Project Chimera Mk6r9 — EvolutionX 10.9 Build #${{ github.run_number
