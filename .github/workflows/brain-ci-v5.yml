# ═══════════════════════════════════════════════════════════════════════════════
# Project Chimera Mk6 Plus — Lineage 23.2 / Exynos 9810 (star2lte)
# ───────────────────────────────────────────────────────────────────────────────
# KSU    : KernelSU-Next (resolved via KDR)
# SUSFS  : SUSFS4KSU (resolved via KDR)
# Clang  : Neutron Clang 10-03-2024 (pinned)
# ═══════════════════════════════════════════════════════════════════════════════

name: Project Chimera Mk6 Plus — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        required: false
        type: boolean
        default: true

      do_release:
        required: false
        type: boolean
        default: false

      force_repatch:
        required: false
        type: boolean
        default: false

      ksu_repo:
        required: false
        type: string
        default: "https://github.com/sidex15/KernelSU-Next.git"

      ksu_ref:
        required: false
        type: string
        default: "v3.2.0-legacy-susfs-v2"

      susfs_repo:
        required: false
        type: string
        default: "https://gitlab.com/xxxxx/susfs4ksu.git"

      susfs_ref:
        required: false
        type: string
        default: "kernel-4.9"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO:   "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6l"

      KERNEL_DIR:    "kernel"
      OUT_DIR:       "kernel-out"
      LOG_DIR:       "logs"

      NEUTRON_URL:   "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY:   "neutron-clang-10032024-pinned-v1"

      DEFCONFIG:     "arch/arm64/configs/exynos9810-star2lte_defconfig"
      BRAND:         "-6988168"

      KSU_REPO:   "${{ inputs.ksu_repo }}"
      KSU_REF:    "${{ inputs.ksu_ref }}"
      SUSFS_REPO: "${{ inputs.susfs_repo }}"
      SUSFS_REF:  "${{ inputs.susfs_ref }}"

    steps:

      # ── Workspace ─────────────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"

      # ── Dependencies ─────────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq git curl wget bc flex bison python3 \
            libssl-dev libelf-dev build-essential zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ── Toolchain ────────────────────────────────────────────
      - name: Cache Clang
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Clang
        run: |
          mkdir -p neutron-clang
          wget -qO /tmp/clang.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/clang.tar.zst -C neutron-clang --strip-components=1

      - name: Export PATH
        run: echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH

      # ── Kernel clone ─────────────────────────────────────────
      - name: Clone kernel
        run: |
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"

      # ─────────────────────────────────────────────────────────
      # 🔥 KDR — Dependency Resolver (CORE FIX)
      # ─────────────────────────────────────────────────────────
      - name: Resolve Kernel Dependencies (KDR)
        run: |
          set -Eeuo pipefail

          python3 - << 'PYEOF'
          import subprocess, json, os

          def run(cmd):
              return subprocess.check_output(cmd, shell=True).decode().strip()

          def resolve(repo, ref):
              if not repo:
                  return ""
              run(f"git clone --filter=blob:none --no-tags {repo} /tmp/kdr_repo")
              try:
                  run(f"git -C /tmp/kdr_repo fetch origin {ref}")
                  run(f"git -C /tmp/kdr_repo checkout FETCH_HEAD")
              except:
                  run(f"git -C /tmp/kdr_repo checkout {ref}")
              return run("git -C /tmp/kdr_repo rev-parse HEAD")

          ksu_repo = os.environ["KSU_REPO"]
          ksu_ref  = os.environ["KSU_REF"]
          sus_repo = os.environ["SUSFS_REPO"]
          sus_ref  = os.environ["SUSFS_REF"]

          ksu_commit = resolve(ksu_repo, ksu_ref)
          sus_commit = resolve(sus_repo, sus_ref)

          with open("kdr-lock.json", "w") as f:
              json.dump({
                  "ksu": {"repo": ksu_repo, "ref": ksu_ref, "commit": ksu_commit},
                  "susfs": {"repo": sus_repo, "ref": sus_ref, "commit": sus_commit}
              }, f, indent=2)

          print(f"KSU_COMMIT={ksu_commit}")
          print(f"SUSFS_COMMIT={sus_commit}")
          PYEOF

          echo "KSU_COMMIT=$(jq -r '.ksu.commit' kdr-lock.json)" >> $GITHUB_ENV
          echo "SUSFS_COMMIT=$(jq -r '.susfs.commit' kdr-lock.json)" >> $GITHUB_ENV

      # ── KernelSU ─────────────────────────────────────────────
      - name: Setup KernelSU
        working-directory: kernel
        run: |
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --filter=blob:none "${{ inputs.ksu_repo }}" KernelSU-Next
          git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

      - name: Wire KSU
        working-directory: kernel
        run: |
          sed -i '/drivers\/kernelsu/d' drivers/Kconfig
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'obj-y += kernelsu/' drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

      # ── SUSFS ───────────────────────────────────────────────
      - name: Setup SUSFS
        run: |
          if [[ -n "${{ inputs.susfs_repo }}" ]]; then
            git clone --filter=blob:none "${{ inputs.susfs_repo }}" susfs4ksu
            git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          fi

      - name: Apply SUSFS patch
        if: ${{ inputs.susfs_repo != '' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          git apply ../susfs4ksu/kernel_patches/*.patch || true

      # ── Defconfig ───────────────────────────────────────────
      - name: Defconfig tuning
        working-directory: kernel
        run: |
          sed -i "/CONFIG_KSU/d" "$DEFCONFIG"
          echo "CONFIG_KSU=y" >> "$DEFCONFIG"
          echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"

      # ── Build ────────────────────────────────────────────────
      - name: Build kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          make -j$(nproc) O="$GITHUB_WORKSPACE/$OUT_DIR" ARCH=arm64 Image

      # ── Dry run ─────────────────────────────────────────────
      - name: Dry run
        if: ${{ inputs.dry_run == true }}
        run: echo "OK: dependency resolution + config valid"

      # ── Upload ──────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/

      - name: Upload kernel
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: kernel
          path: kernel-out/
