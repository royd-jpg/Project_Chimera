name: Brain CI v5.1 — Chimera Mk6 Plus (Hardened Attested Build)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
      do_release:
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      # FIX: must be owner/repo, NOT URL
      KERNEL_REPO: royd-jpg/Project_Chimera
      KERNEL_BRANCH: chimera-mk6l

      KERNEL_DIR: kernel
      OUT_DIR: kernel-out
      LOG_DIR: logs

      NEUTRON_URL: https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
      NEUTRON_KEY: neutron-clang-10032024-v5

      DEFCONFIG: exynos9810-star2lte_defconfig

      AK3_REPO: https://github.com/osm0sis/AnyKernel3
      AK3_COMMIT: 7f8c2b6  # FIX: MUST pin commit, not branch

    steps:

    # ─────────────────────────────
    # Workspace init
    # ─────────────────────────────
    - name: Init workspace
      run: |
        set -Eeuo pipefail
        mkdir -p "$LOG_DIR" "$OUT_DIR"

        echo "run=${GITHUB_RUN_NUMBER}" | tee "$LOG_DIR/meta.log"
        echo "sha=${GITHUB_SHA}" >> "$LOG_DIR/meta.log"

    # ─────────────────────────────
    # FIXED checkout (critical fix)
    # ─────────────────────────────
    - name: Checkout kernel
      uses: actions/checkout@v4
      with:
        repository: ${{ env.KERNEL_REPO }}   # FIXED FORMAT
        ref: ${{ env.KERNEL_BRANCH }}
        path: ${{ env.KERNEL_DIR }}
        submodules: recursive
        fetch-depth: 1

    # ─────────────────────────────
    # Submodule validation (fixed logic)
    # ─────────────────────────────
    - name: Submodule integrity check
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -Eeuo pipefail

        git submodule status --recursive | tee ../$LOG_DIR/submodules.log

        # no hard-coded wrong owner check
        URL=$(git config -f .gitmodules --get submodule.KernelSU-Next.url)

        echo "KernelSU URL = $URL" | tee -a ../$LOG_DIR/submodules.log

        test -d KernelSU-Next
        git -C KernelSU-Next rev-parse HEAD | tee ../$LOG_DIR/ksu_commit

    # ─────────────────────────────
    # Toolchain cache (realized properly)
    # ─────────────────────────────
    - name: Cache Clang
      uses: actions/cache@v4
      with:
        path: neutron-clang
        key: ${{ env.NEUTRON_KEY }}

    - name: Install toolchain
      if: steps.cache-clang.outputs.cache-hit != 'true'
      run: |
        mkdir -p neutron-clang
        wget -qO clang.tar.zst "$NEUTRON_URL"
        tar -xf clang.tar.zst -C neutron-clang --strip-components=1

    - name: Export PATH
      run: echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> $GITHUB_PATH

    # ─────────────────────────────
    # DEFCONFIG FIX (critical)
    # ─────────────────────────────
    - name: Build defconfig (correct flow)
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -Eeuo pipefail

        make O=../$OUT_DIR ARCH=arm64 $DEFCONFIG

        # NEVER modify defconfig directly
        scripts/config --file ../$OUT_DIR/.config \
          -e KSU \
          -e KSU_SUSFS || true

        make O=../$OUT_DIR olddefconfig

        cp ../$OUT_DIR/.config ../$LOG_DIR/final.config

        sha256sum ../$LOG_DIR/final.config > ../$LOG_DIR/config.sha256

    # ─────────────────────────────
    # Build gate
    # ─────────────────────────────
    - name: Build confirmation gate
      run: |
        echo "CONFIG LOCKED"
        sha256sum logs/config.sha256

    # ─────────────────────────────
    # Kernel build
    # ─────────────────────────────
    - name: Build kernel
      if: ${{ inputs.dry_run == false }}
      working-directory: ${{ env.KERNEL_DIR }}
      run: |
        set -Eeuo pipefail

        make O=../$OUT_DIR ARCH=arm64 -j$(nproc) Image dtbs

        test -f ../$OUT_DIR/arch/arm64/boot/Image

        sha256sum ../$OUT_DIR/arch/arm64/boot/Image > ../$LOG_DIR/kernel.sha256

    # ─────────────────────────────
    # AK3 FIX (commit pin)
    # ─────────────────────────────
    - name: Package AK3
      if: ${{ inputs.dry_run == false }}
      run: |
        set -Eeuo pipefail

        git clone "$AK3_REPO"
        cd AnyKernel3
        git checkout "$AK3_COMMIT"

        cp ../kernel-out/arch/arm64/boot/Image .

        ZIP="chimera-brain-v5.1-r${GITHUB_RUN_NUMBER}.zip"
        zip -r9 "../$ZIP" .

        sha256sum "../$ZIP" > "../$ZIP.sha256"

    # ─────────────────────────────
    # Fingerprint
    # ─────────────────────────────
    - name: Reproducibility fingerprint
      run: |
        cat logs/config.sha256 logs/kernel.sha256 > logs/fingerprint
        sha256sum logs/fingerprint

    # ─────────────────────────────
    # Upload artifacts
    # ─────────────────────────────
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: brain-ci-v5.1-${{ github.run_number }}
        path: |
          logs/
          *.zip
