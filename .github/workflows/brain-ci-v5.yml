# ═══════════════════════════════════════════════════════════════════════════════
# Project Chimera Mk6 Plus — Lineage 23.2 / Exynos 9810 (star2lte)
# ───────────────────────────────────────────────────────────────────────────────
# Integrated KernelSU-Next (Legacy SUSFS)
# ═══════════════════════════════════════════════════════════════════════════════

name: Project Chimera Mk6 Plus — Lineage 23.2 Build - GEMINI BETA

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS even if already present"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk6 Plus
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      KERNEL_REPO:   "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6l"
      KSU_REPO:      "https://github.com/sidex15/KernelSU-Next.git"
      KSU_REF:       "legacy-susfs-v2"
      DEFCONFIG:     "arch/arm64/configs/exynos9810-star2lte_defconfig"
      BRAND:         "-6988168"
      OUT_DIR:       "kernel-out"
      LOG_DIR:       "logs"
      NEUTRON_URL:   "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY:   "neutron-clang-10032024-pinned-v1"

    steps:
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_number=${GITHUB_RUN_NUMBER}"
          } | tee "$LOG_DIR/build-inputs.log"

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq git curl wget bc flex bison python3 libssl-dev libelf-dev build-essential zip unzip zstd lz4 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Download Neutron Clang
        run: |
          mkdir -p neutron-clang
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Clone kernel tree
        run: git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel

      # ── Integrated KernelSU-Next ──────────────────────────────────────────
      - name: Integrate KernelSU-Next
        working-directory: kernel
        run: |
          git clone --filter=blob:none --no-tags -b "$KSU_REF" "$KSU_REPO" KernelSU-Next
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          
          # Wire Kconfig
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          if ! grep -q '^endmenu' drivers/Kconfig; then printf '\nendmenu\n' >> drivers/Kconfig; fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'obj-y += kernelsu/' drivers/Makefile || echo 'obj-y += kernelsu/' >> drivers/Makefile

      # ── Emergency Surgery (4.9 Kernel Compatibility & Build Fixes) ────────
      - name: Emergency Surgery (Compatibility Patches)
        working-directory: kernel
        run: |
          # Fix pointer format mismatch in process.c
          sed -i 's/printk("\\n%s: %pS:\\n", name, addr);/printk("\\n%s: %pS:\\n", name, (void *)addr);/g' arch/arm64/kernel/process.c
          
          # Namei Compatibility Fix
          if [[ -f fs/namei.c ]]; then
            sed -i '/struct nameidata {/i #define ND_FLAGS_LOOKUP_LAST (1 << 30)\n#define ND_STATE_LOOKUP_LAST (1 << 30)\n#define ND_STATE_OPEN_LAST (1 << 30)\n' fs/namei.c
          fi
          
          # Syscall Fix
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"
          if [[ -f "$HOOK_H" ]] && ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            sed -i '1i typedef long (*syscall_fn_t)(unsigned long, unsigned long, unsigned long, unsigned long, unsigned long, unsigned long);\n' "$HOOK_H"
          fi

      - name: Inject SUSFS Prctl Bridge
        working-directory: kernel
        run: |
          python3 - << 'PYEOF'
          from pathlib import Path
          sys_c = Path("kernel/sys.c")
          if sys_c.exists():
              txt = sys_c.read_text(errors='replace')
              marker = "/* Chimera Mk6 Plus SUSFS Bridge */"
              if marker not in txt:
                  snippet = (
                      f"\n{marker}\n#ifdef CONFIG_KSU_SUSFS\n"
                      "\textern int ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5);\n"
                      "\tif ((unsigned long)option >= 0xdead0000UL) {\n"
                      "\t\tint __r = ksu_susfs_handle_prctl(option, arg2, arg3, arg4, arg5);\n"
                      "\t\tif (__r != -EINVAL) return (long)__r;\n"
                      "\t}\n#endif\n"
                  )
                  pos = txt.find("SYSCALL_DEFINE5(prctl")
                  if pos != -1:
                      end_pos = txt.find("{", pos) + 1
                      sys_c.write_text(txt[:end_pos] + snippet + txt[end_pos:])
          PYEOF

      - name: Inject Weak Symbol Fallbacks
        working-directory: kernel
        run: |
          cat >> KernelSU-Next/kernel/ksu.c <<EOF
          __attribute__((weak)) void ksu_escape_to_root(void) {}
          __attribute__((weak)) bool susfs_is_allow_su(void) { return false; }
          EOF

      # ── Defconfig Tuning ──────────────────────────────────────────────────
      - name: Apply defconfig tuning
        working-directory: kernel
        run: |
          set_cfg() { sed -i "/^$1=.*/d;/^# $1 is not set/d" "$DEFCONFIG"; echo "$1=$2" >> "$DEFCONFIG"; }
          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
          set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          set_cfg CONFIG_KSU_SUSFS_SUS_MAP y
          
          set_cfg CONFIG_PREEMPT y
          set_cfg CONFIG_HZ 300
          set_cfg CONFIG_SCHED_DEBUG y
          set_cfg CONFIG_TCP_CONG_BBR y

      # ── Build & Package ──────────────────────────────────────────────────
      - name: Build Kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          make -j$(nproc) O=../kernel-out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- exynos9810-star2lte_defconfig
          make -j$(nproc) O=../kernel-out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Package flashable zip
        if: ${{ inputs.dry_run == false }}
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          cp kernel-out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3 && zip -r9 ../chimera-mk6plus.zip .

      - name: Upload artifact
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6plus-${{ github.run_number }}
          path: chimera-mk6plus.zip

      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false && inputs.do_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6plus-${{ github.run_number }}
          name: "Project Chimera Mk6 Plus Build #${{ github.run_number }}"
          files: chimera-mk6plus.zip
