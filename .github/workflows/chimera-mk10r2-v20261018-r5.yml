# Workflow: chimera-mk10r2-v20261018-r5.yml (refactored from chimera-mk10r2-v20261018-r4.yml)
# gavdoc38: gavdoc38/android_kernel_samsung_exynos9810; default pin 11f2256b423acdec8860eaf7f670f13b06e27778 (= release v3.3.0 commit; differs from
#   branch lineage-24.0-xxksu3-susfs2@70afe129 ONLY in the KernelSU gitlink — verified by diff-tree).
# Project_Chimera: royd-jpg/Project_Chimera; branch lineage-24.0-xxksu3-susfs2; pinned 95b8142e6763cf6af9534fb1e4495fd59013d6eb.
# krazey repo/ref: UNVERIFIED until supplied; fetched only and never merged into the kernel tree.
# Overlay control: `profile` is the ONLY selector (boot-first | chimera-lite | chimera-full). No separate overlay toggle exists.
#
# ── CHANGELOG ────────────────────────────────────────────────────────────────
# r5 changes vs r4:
#   xxKSU permanently pinned to v3.3.1 (32680-5):
#     - ROOT CAUSE of the 32693-6 build: gavdoc_ref 70afe129 (branch lineage-24.0-xxksu3-susfs2, 2026-10-18) points KernelSU at
#       00551a81 whose kernel/Makefile hard-codes -DKSU_VERSION=32693. The v3.3.0 release commit 11f2256 points KernelSU at
#       5c595611 ("Override version to match manager (32680)"), Makefile -DKSU_VERSION=32680. Kernel-side tree is otherwise identical.
#       The r4 freeze guard did its job (nothing changed after checkout) but froze the WRONG KSU.
#     - gavdoc_ref default is now 11f2256b423acdec8860eaf7f670f13b06e27778 (release v3.3.0 commit).
#     - NEW permanent env pin KSU_PIN_SHA=5c595611d1924b1bbc86e84b0766fb91a52c257a and KSU_PIN_VERSION=32680. A hard gate
#       (before any patch) requires: the KernelSU gitlink == pin, the submodule checked out at the pin, and kernel/Makefile
#       containing -DKSU_VERSION=32680. Any other gavdoc_ref whose KernelSU differs now FAILS in minutes with a clear message.
#       To change xxKSU in future you must edit KSU_PIN_SHA/KSU_PIN_VERSION in this file deliberately.
#     - The ksu_commit input is removed (superseded by the permanent pin).
#   BBR + FQ_CoDel in every profile:
#     - NEW input net_bbr_fq_codel (default true): merges a small fragment last (NET_SCHED, NET_SCH_FQ, NET_SCH_FQ_CODEL,
#       TCP_CONG_ADVANCED/CUBIC/BBR, DEFAULT_BBR). Config guard hard-requires those plus CONFIG_DEFAULT_TCP_CONG="bbr".
#     - VERIFIED in the gavdoc38 tree: net/sched/Kconfig has NO DEFAULT_NET_SCH / DEFAULT_FQ_CODEL choice, and sch_generic.c hard-codes
#       default_qdisc_ops = &pfifo_fast_ops. fq_codel is therefore compiled in and selectable, but the DEFAULT qdisc can only be
#       changed at runtime: `sysctl -w net.core.default_qdisc=fq_codel` (or from an init script/module). No source patch is applied.
#   Upstream fetch (fetch-only, never merged):
#     - krazey_repo/krazey_ref replaced by krazey_upstreams (comma list of owner/repo[@branch]); default fetches the LATEST tip of
#       krazey/android_kernel_samsung_exynos9810@android-4.9-s and ExyHyperBrick/android_kernel_samsung_exynos9810@lineage-24.0.
#       Tips are resolved at run time and recorded (manifest KRAZEY_FETCHED). Failure to fetch only warns (build is unaffected).
#     - NEW advisory report per upstream (logs/krazey-*.txt): tip, last 30 commits, and a changed-path summary
#       (kernel base -> upstream tip, grouped by top 2 directories). Use it to pick cherry-pick candidates by hand.
#   AnyKernel3 busybox smoke test fixed: busybox selects its applet from the executable's NAME, and r4 copied it to
#   /tmp/ak3-bb, so '--list' failed ("inconclusive" warning in your run). It is now run as a file named 'busybox'.
# r4 changes vs r3:
#   xxKSU (frozen to gavdoc38):
#     - NEW policy: this workflow never modifies, replaces, bumps or re-integrates KernelSU/xxKSU. The xxKSU in the pinned
#       gavdoc38 tree is the only xxKSU. Per the gavdoc38 v3.3.0 release notes it is xxKSU v3.3.1, build 32680, driver uapi v5,
#       and it REQUIRES a uapi v5 manager (backslashxx/KernelSU v3.3.1). A uapi v6 manager must NOT be used with it.
#     - NEW step "KSU freeze — record baseline": fingerprints the KSU directory + all submodule/gitlink state right after the
#       integrated-tree checks, and logs submodule status and version/uapi hints (logs/ksu-baseline.txt).
#     - NEW step "KSU freeze guard": re-fingerprints after every CI-time patch (identity, bcmdhd, hooks.c, overlay scripts)
#       and FAILS the run if anything under the KSU directory or any submodule changed (fail closed, before Kconfig/compile).
#     - NEW step "KSU freeze — post-build drift check": warning-only (build may legitimately emit generated files).
#     - ksu_commit stays verify-only (must match a gitlink in the tree); it never selects or fetches a KSU commit.
#     - uapi v5 / manager requirement is now carried in manifest.json, the job summary, the release body and the AK3 ui_print.
#   AnyKernel3 / busybox hardening (opt-in package_anykernel; the root cause of the recovery busybox errors is UNVERIFIED,
#   see NOTES — these changes remove the causes that CI can detect and make the rest observable):
#     - NEW input anykernel_ref (empty or 40-hex SHA). Empty = AnyKernel3 HEAD at run time (not reproducible; warned and recorded).
#     - AK3 is fetched as a single commit and checked out detached; resolved SHA is logged and written to manifest.json.
#     - AK3 layout is verified (update-binary, updater-script, ak3-core.sh); every tools/busybox* is inventoried:
#       sha256, ELF class/machine, static vs dynamically linked (a dynamic busybox needs the recovery's loader and is a classic
#       cause of "not found"/exec errors in recoveries; reported as a warning).
#     - NEW busybox smoke test under qemu-user (diagnostic only, never fails the build): runs `busybox --list` and `sh -c`,
#       and warns if common applets are missing.
#     - Shell scripts are rejected if they contain CRLF line endings (CR breaks `sh` shebangs/busybox applets on-device).
#     - Executable bits are forced on update-binary and tools/*; the ZIP is built with `zip -r9 -X`, then verified:
#       `unzip -t`, required entries present, busybox byte-identical to the source and still executable inside the ZIP.
#     - anykernel.sh is generated from a quoted template (no shell expansion surprises) and syntax-checked with `sh -n`;
#       kernel.string is sanitised to a conservative character set (no '#', '|', quotes).
#     - qemu-user-static and unzip are installed only when needed; logs/ak3-*.txt go into the logs artifact.
#   Unchanged from r3: all inputs/defaults except the new anykernel_ref, toolchain handling, overlay logic, config guard,
#   build, symbol checks, artifacts, release job (plus new xxKSU rows in the release body).
# r3 changes vs r2:
#   - chimera-lite/full with the known overlay-less chimera_ref (CHIMERA_NO_OVERLAY_SHA) is rejected in input validation (seconds, not minutes).
#   - concurrency group includes build_scope (config-only and full runs no longer queue behind each other).
#   - release body shows 'none (boot-first)' when no Chimera checkout was made.
#
# ── NOTES ────────────────────────────────────────────────────────────────────
# xxKSU / uapi:
#   - Source of the version/uapi facts: gavdoc38 release v3.3.0 notes (kernel for kraZey90's LineageOS 24.0 14/10/2026 TESTBUILD RC2):
#     "xxKSU updated to version 3.3.1, build 32680 ... driver is uapi v5 and so requires the manager to be uapi v5 ...
#     Do not update to uapi v6 manager". Manager: https://github.com/backslashxx/KernelSU/releases/tag/v3.3.1
#   - The CI cannot prove the uapi version of the built driver. It proves only that the KSU sources/gitlinks were not altered
#     relative to the pinned gavdoc_ref checkout. Confirm uapi on device with the manager.
#   - The KSU directory is derived from the Kconfig that defines `config KSU` (layout UNVERIFIED; submodule vs in-tree vs symlink).
#     Submodule/gitlink state is fingerprinted globally regardless.
#   - merge_ksu_fragment only merges a defconfig fragment (symbols); it cannot change the xxKSU driver sources, but it can change
#     KSU Kconfig symbols. Leave it off unless the base defconfig fails the CONFIG_KSU=y check.
# xxKSU pin (r5):
#   - Pinned KernelSU commit 5c595611 is NOT on any branch of gavdoc38/KernelSU (orphaned by a force-push; verified not an ancestor of
#     xxksu-susfs). It is still fetchable by SHA today, but GitHub may garbage-collect it. If the checkout ever fails, mirror that commit
#     into a repo you own and update .gitmodules/the pin deliberately. The gate fails closed rather than silently using another KSU.
#   - uapi v5 / the "-5" suffix come from the maintainer's release notes; only KSU_VERSION=32680 is verifiable from the sources.
#   - xxKSU uses syscall-table / branch-link / kprobe hooks, so the ksu_handle_* "not found" warnings for fs/*.c call sites and
#     vmlinux symbols are expected noise for this variant (UNVERIFIED; they were never hard checks).
# BBR / fq_codel on this 4.9 kernel: BBR is the compiled-in default congestion control (DEFAULT_TCP_CONG="bbr"); fq_codel and fq are
#   built in, but the default qdisc stays pfifo_fast until set at runtime (see r5 changelog). UNVERIFIED: BBR pacing on 4.9 relies on
#   the fq qdisc, so BBR with fq_codel may lack proper pacing; compare `net.core.default_qdisc=fq` vs `fq_codel` on device.
# Upstream "krazey": two candidates were found. krazey/android_kernel_samsung_exynos9810 exists (default branch master = 4.11-testing, 2022;
#   it also carries android-4.9-* branches). ExyHyperBrick/android_kernel_samsung_exynos9810 is the fork root of gavdoc38's repo; its
#   lineage-24.0 head e5906667 equals gavdoc38's lineage-24.0 head. Which one you mean is UNVERIFIED, so both are fetched.
# AnyKernel3:
#   - gavdoc38's documented install path is fastbootd `fastboot flash BOOT boot.img` (or ODIN). AK3 packaging in this workflow is
#     UNVERIFIED for star2lte (Samsung boot image, dtb concat format, partition name).
#   - To root-cause the busybox error, the recovery log from the failing flash is needed (e.g. /tmp/recovery.log or the
#     recovery's "copy log" output) plus the recovery name/version. Until then the CI checks above are best-effort diagnostics.
#   - A qemu smoke test shows the busybox binary runs and which applets it has; it does NOT reproduce recovery SELinux/noexec/
#     loader/toolbox conditions.
# Supply chain (not changed in r4, UNVERIFIED): third-party GitHub Actions are pinned by major tag, not commit SHA; toolchain
#   archives other than weebx have no SHA-256 pin. Pinning actions to reviewed commit SHAs is recommended once SHAs are verified.

name: Project Chimera Mk10r2 — gavdoc38 lineage-24.0-xxksu3-susfs2

permissions:
  contents: read

concurrency:
  group: chimera-mk10-g38-${{ github.event.inputs.profile }}-${{ github.event.inputs.build_scope }}-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.gavdoc_ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "boot-first = pinned gavdoc kernel only (recommended first run); chimera-lite/full = apply the matching Chimera overlay. The default chimera_ref has NO overlay files, so choose boot-first or provide an overlay-containing chimera_ref."
        required: true
        type: choice
        options: [boot-first, chimera-lite, chimera-full]
        default: boot-first

      toolchain:
        description: "gcc = DEFAULT (Ubuntu 24.04 gcc-aarch64-linux-gnu). llvm-full = FULL LLVM/Clang mode (pinned LLVM 22.1.7; Clang + LLD + LLVM binutils, no GCC compiler/linker). Other choices carried over from base, EXPERIMENTAL."
        required: true
        type: choice
        options: [gcc, llvm-full, llvm22, llvm21, llvm20, aosp23, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, zyc_stable, weebx]
        default: gcc

      relax_bcmdhd_werror:
        description: "Strip -Werror from drivers/net/wireless/bcmdhd_101_16 build files at CI time (GCC 13; no-op if dir/flags not present)"
        required: false
        type: boolean
        default: true

      build_scope:
        description: "full = compile Image/vmlinux/dtbs, verify, collect artifacts (+ optional packaging / release). config-only = apply overlay, run Kconfig, validate final .config, then STOP (no compile; package_anykernel and do_release ignored)."
        required: false
        type: choice
        options: [full, config-only]
        default: full

      package_anykernel:
        description: "Also build an AnyKernel3 ZIP + raw dtb concat (packaging is UNVERIFIED for this device; busybox/layout diagnostics run). Only with build_scope=full."
        required: false
        type: boolean
        default: false

      anykernel_ref:
        description: "OPTIONAL AnyKernel3 commit: empty or full 40-hex SHA. Empty = AnyKernel3 HEAD at run time (not reproducible; resolved SHA is recorded). Used only with package_anykernel=true."
        required: false
        type: string
        default: ""

      do_release:
        description: "Create a GitHub prerelease (creates a tag — repository mutation). Only with build_scope=full; runs in a separate release job with contents: write."
        required: false
        type: boolean
        default: false

      gavdoc_ref:
        description: "gavdoc38 kernel commit: required immutable 40-hex SHA. Default 11f2256b... = release v3.3.0 commit (KernelSU 5c595611, xxKSU v3.3.1 build 32680). A gavdoc_ref whose KernelSU gitlink differs from the permanent pin is rejected."
        required: true
        type: string
        default: "11f2256b423acdec8860eaf7f670f13b06e27778"

      chimera_ref:
        description: "Project_Chimera commit: required immutable 40-hex SHA. Default 95b8142e... contains chimera-xxksu-susfs.cfg but NOT the Chimera overlay files; it works only with boot-first (chimera-lite/full with this SHA is rejected at input validation)."
        required: true
        type: string
        default: "95b8142e6763cf6af9534fb1e4495fd59013d6eb"

      krazey_upstreams:
        description: "Fetch-only upstreams (never merged): comma list of owner/repo[@branch]; latest tip is resolved at run time and recorded. Empty = skip. Writes logs/krazey-*.txt (commits + changed-path summary vs the kernel base)."
        required: false
        type: string
        default: "krazey/android_kernel_samsung_exynos9810@android-4.9-s,ExyHyperBrick/android_kernel_samsung_exynos9810@lineage-24.0"

      net_bbr_fq_codel:
        description: "Enable TCP BBR (default congestion control) and fq_codel + fq qdiscs in every profile via a last-merged fragment. Hard-checked in the final .config. Default qdisc is runtime-only on this kernel (net.core.default_qdisc)."
        required: false
        type: boolean
        default: true

      merge_ksu_fragment:
        description: "Merge chimera-xxksu-susfs.cfg (defconfig symbols only) from the pinned overlay commit. Default off: branch is already integrated. Cannot change xxKSU driver sources."
        required: false
        type: boolean
        default: false

      brand:
        description: "LOCALVERSION suffix (starts with '-'). '-c10r2x[git7]' = '-c10r2x' + first 7 hex of the resolved base commit."
        required: true
        type: choice
        options:
          - "-Chimera_Mk10r2"
          - "-24463729"
          - "-c10r2x[git7]"
          - "Other"
        default: "-c10r2x[git7]"
      custom_brand:
        description: "Custom brand — only if brand=Other (must start with '-')"
        required: false
        type: string

      build_user:
        description: "KBUILD_BUILD_USER. 'Other' uses custom_build_user."
        required: true
        type: choice
        options: ["MTRXX", "EVOXV", "EVOXG", "DRPFST", "HLCYN", "LOS", "GA", "RC0", "Other"]
        default: "Other"
      custom_build_user:
        description: "Custom build user — only if build_user=Other"
        required: false
        type: string
        default: "CM9XNNNN"

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"

      build_version:
        description: "KBUILD_BUILD_VERSION (#N token, digits)"
        required: false
        type: string
        default: "1"

      build_date:
        description: "KBUILD_BUILD_TIMESTAMP — ROM label stripped before use. 'Other' uses custom_build_date (empty => fixed default)."
        required: true
        type: choice
        options:
          - "RISINGOS9: Mon Oct 12 15:30:15 UTC 2026"
          - "Other"
        default: "Other"
      custom_build_date:
        description: "Custom build timestamp — only if build_date=Other"
        required: false
        type: string

env:
  GAVDOC_REPO_SLUG: "gavdoc38/android_kernel_samsung_exynos9810"
  GAVDOC_REPO: "https://github.com/gavdoc38/android_kernel_samsung_exynos9810.git"
  GAVDOC_BRANCH: "lineage-24.0-xxksu3-susfs2 (default pin = release v3.3.0 commit)"
  CHIMERA_REPO_SLUG: "royd-jpg/Project_Chimera"
  CHIMERA_REPO: "https://github.com/royd-jpg/Project_Chimera.git"
  CHIMERA_BRANCH: "lineage-24.0-xxksu3-susfs2"
  # Known to contain chimera-xxksu-susfs.cfg but NO overlay/patch files; rejected for chimera-lite/full at validation.
  CHIMERA_NO_OVERLAY_SHA: "95b8142e6763cf6af9534fb1e4495fd59013d6eb"
  OVERLAY_DIR_NAME: "chimera_overlay"
  KRAZEY_DIR_NAME: "krazey_upstream"

  # xxKSU policy: frozen to whatever the pinned gavdoc38 tree contains. Facts below come from the gavdoc38 v3.3.0 release notes.
  KSU_POLICY: "permanently pinned (KernelSU commit + KSU_VERSION gated), then frozen (no KSU change by CI)"
  KSU_PIN_SHA: "5c595611d1924b1bbc86e84b0766fb91a52c257a"
  KSU_PIN_VERSION: "32680"
  KSU_EXPECTED: "xxKSU v3.3.1 (32680-5), KernelSU commit 5c595611d1924b1bbc86e84b0766fb91a52c257a, KSU_VERSION=32680, driver uapi v5; manager must be uapi v5 (backslashxx/KernelSU v3.3.1); do NOT use a uapi v6 manager"

  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  ANYKERNEL_DIR: "anykernel3"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

  # Verified at the gavdoc_ref default; the remaining compatibility checks fail closed at run time.
  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"
  STAR2_DTB_REL: "dts/exynos/exynos9810-star2lte_eur_open_26.dtb"
  CCACHE_MAXSIZE: "3G"
  CCACHE_BASEDIR: "${{ github.workspace }}"

  KERNEL_NAME: "Chimera Mk10r2"
  KERNEL_DEVICE: "star2lte"
  KERNEL_PLATFORM: "Exynos 9810"
  BUILD_DATE_DEFAULT: "Thu Jan 1 00:00:00 UTC 2026"

  CHIMERA_KCFLAGS_COMMON: "-O2 -fcommon -fno-strict-aliasing -Wno-error -Wno-error=unused-function"

  CI_LIB: "/tmp/chimera-ci-lib.sh"

  # Inputs are passed through env, never interpolated into shell text.
  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  IN_PROFILE: ${{ inputs.profile }}
  IN_TOOLCHAIN: ${{ inputs.toolchain }}
  IN_GAVDOC_REF: ${{ inputs.gavdoc_ref }}
  IN_CHIMERA_REF: ${{ inputs.chimera_ref }}
  IN_KRAZEY_UPSTREAMS: ${{ inputs.krazey_upstreams }}
  IN_NET_BBR_FQ_CODEL: ${{ inputs.net_bbr_fq_codel }}
  IN_ANYKERNEL_REF: ${{ inputs.anykernel_ref }}
  IN_MERGE_KSU_FRAGMENT: ${{ inputs.merge_ksu_fragment }}
  IN_BRAND: ${{ inputs.brand }}
  IN_CUSTOM_BRAND: ${{ inputs.custom_brand }}
  IN_BUILD_USER: ${{ inputs.build_user }}
  IN_CUSTOM_BUILD_USER: ${{ inputs.custom_build_user }}
  IN_BUILD_HOST: ${{ inputs.build_host }}
  IN_BUILD_VERSION: ${{ inputs.build_version }}
  IN_BUILD_DATE: ${{ inputs.build_date }}
  IN_CUSTOM_BUILD_DATE: ${{ inputs.custom_build_date }}
  RELAX_BCMDHD_WERROR: ${{ inputs.relax_bcmdhd_werror }}
  APPLY_OVERLAY: ${{ inputs.profile != 'boot-first' }}
  IN_BUILD_SCOPE: ${{ inputs.build_scope }}
  IN_PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
  IN_DO_RELEASE: ${{ inputs.do_release }}
  OVERLAY_PROFILE_EFFECTIVE: ${{ inputs.profile == 'chimera-full' && 'full' || inputs.profile == 'chimera-lite' && 'lite' || 'off' }}

jobs:
  build:
    name: Chimera Mk10r2 g38-xxksu3 ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    steps:
      # ── 0. Validate inputs ─────────────────────────────────────────────────
      - name: Validate workflow inputs
        run: |
          set -Eeuo pipefail
          FAIL=0
          [[ "$IN_PROFILE" =~ ^(boot-first|chimera-lite|chimera-full)$ ]] || { echo "FATAL: bad profile '$IN_PROFILE'" >&2; FAIL=1; }
          [[ "$IN_BUILD_SCOPE" =~ ^(full|config-only)$ ]] || { echo "FATAL: bad build_scope '$IN_BUILD_SCOPE'" >&2; FAIL=1; }
          [[ "$IN_TOOLCHAIN" =~ ^(gcc|llvm-full|llvm22|llvm21|llvm20|aosp23|aosp22|aosp21|aosp20|aosp19|neutron19|neutron23|neutron24|zyc_stable|weebx)$ ]] || { echo "FATAL: bad toolchain '$IN_TOOLCHAIN'" >&2; FAIL=1; }
          [[ "$IN_GAVDOC_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: gavdoc_ref must be an immutable full 40-hex SHA (branch names and short SHAs are rejected)" >&2; FAIL=1; }
          [[ "$IN_CHIMERA_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: chimera_ref must be an immutable full 40-hex SHA (branch names and short SHAs are rejected)" >&2; FAIL=1; }
          [[ -z "$IN_ANYKERNEL_REF" || "$IN_ANYKERNEL_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: anykernel_ref must be empty or a full 40-hex SHA" >&2; FAIL=1; }
          if [[ -n "$IN_KRAZEY_UPSTREAMS" ]]; then
            IFS=',' read -r -a KZ <<< "$IN_KRAZEY_UPSTREAMS"
            for kz in "${KZ[@]}"; do
              kz="${kz//[[:space:]]/}"; [[ -n "$kz" ]] || continue
              [[ "$kz" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(@[A-Za-z0-9._/-]+)?$ ]] || { echo "FATAL: krazey_upstreams entry '$kz' must be owner/repo or owner/repo@branch" >&2; FAIL=1; }
            done
          fi
          [[ "$IN_BUILD_VERSION" =~ ^[0-9]+$ ]] || { echo "FATAL: build_version must be digits" >&2; FAIL=1; }
          [[ "$IN_BUILD_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "FATAL: bad build_host" >&2; FAIL=1; }
          if [[ "$IN_PROFILE" != "boot-first" && "$IN_CHIMERA_REF" == "$CHIMERA_NO_OVERLAY_SHA" ]]; then
            echo "FATAL: profile=$IN_PROFILE needs an overlay-containing chimera_ref; $CHIMERA_NO_OVERLAY_SHA has only chimera-xxksu-susfs.cfg and no overlay/patch files. Use profile=boot-first or supply another 40-hex SHA." >&2
            FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          if [[ "$IN_PROFILE" == "boot-first" ]]; then
            echo "::notice::profile=boot-first: no Chimera overlay will be checked out or applied (unless merge_ksu_fragment=true)."
          else
            echo "::notice::profile=$IN_PROFILE: the pinned chimera_ref must contain the required overlay files before any patch is applied."
          fi
          if [[ "$IN_BUILD_SCOPE" == "config-only" && ( "$IN_PACKAGE_ANYKERNEL" == "true" || "$IN_DO_RELEASE" == "true" ) ]]; then
            echo "::notice::build_scope=config-only: package_anykernel / do_release are ignored (nothing is compiled)"
          fi
          if [[ "$IN_PACKAGE_ANYKERNEL" == "true" && "$IN_BUILD_SCOPE" == "full" && -z "$IN_ANYKERNEL_REF" ]]; then
            echo "::warning::package_anykernel=true with empty anykernel_ref: AnyKernel3 HEAD will be used (not reproducible). The resolved SHA is recorded; pass it as anykernel_ref to reproduce."
          fi
          echo "::notice::xxKSU policy: $KSU_POLICY — expected: $KSU_EXPECTED"
          echo "PASS: inputs valid (APPLY_OVERLAY=$APPLY_OVERLAY, OVERLAY_PROFILE_EFFECTIVE=$OVERLAY_PROFILE_EFFECTIVE, BUILD_SCOPE=$IN_BUILD_SCOPE)"

      - name: Record immutable gavdoc38 and Project_Chimera pins
        run: |
          set -Eeuo pipefail
          GAVDOC_REF_RESOLVED="$IN_GAVDOC_REF"; GAVDOC_REF_SOURCE="workflow_dispatch:gavdoc_ref"
          CHIMERA_REF_RESOLVED="$IN_CHIMERA_REF"; CHIMERA_REF_SOURCE="workflow_dispatch:chimera_ref"
          {
            echo "GAVDOC_REF_RESOLVED=$GAVDOC_REF_RESOLVED"
            echo "GAVDOC_REF_SOURCE=$GAVDOC_REF_SOURCE"
            echo "CHIMERA_REF_RESOLVED=$CHIMERA_REF_RESOLVED"
            echo "CHIMERA_REF_SOURCE=$CHIMERA_REF_SOURCE"
          } >> "$GITHUB_ENV"
          echo "gavdoc:  $GAVDOC_REPO_SLUG@$GAVDOC_REF_RESOLVED ($GAVDOC_REF_SOURCE)"
          echo "chimera: $CHIMERA_REPO@$CHIMERA_REF_RESOLVED ($CHIMERA_REF_SOURCE)"

      - name: Resolve build identity inputs
        run: |
          set -Eeuo pipefail
          if [[ "$IN_BRAND" == "Other" ]]; then
            FINAL_BRAND="$IN_CUSTOM_BRAND"
          elif [[ "$IN_BRAND" == "-c10r2x[git7]" ]]; then
            FINAL_BRAND="-c10r2x${GAVDOC_REF_RESOLVED:0:7}"
          else
            FINAL_BRAND="$IN_BRAND"
          fi
          [[ "$FINAL_BRAND" =~ ^-[A-Za-z0-9._+@:-]+$ ]] || { echo "FATAL: brand '$FINAL_BRAND' must start with '-' and use [A-Za-z0-9._+@:-]" >&2; exit 1; }

          if [[ "$IN_BUILD_USER" == "Other" ]]; then FINAL_USER="$IN_CUSTOM_BUILD_USER"; else FINAL_USER="$IN_BUILD_USER"; fi
          [[ "$FINAL_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "FATAL: bad build user '$FINAL_USER'" >&2; exit 1; }

          if [[ "$IN_BUILD_DATE" == "Other" ]]; then
            FINAL_DATE="$IN_CUSTOM_BUILD_DATE"
            if [[ -z "$FINAL_DATE" ]]; then
              FINAL_DATE="$BUILD_DATE_DEFAULT"
              echo "::warning::build_date=Other with empty custom_build_date — using fixed default '$FINAL_DATE'"
            fi
          else
            FINAL_DATE="${IN_BUILD_DATE#*: }"
          fi
          [[ "$FINAL_DATE" =~ ^[A-Za-z0-9\ :+._-]+$ ]] || { echo "FATAL: bad build date '$FINAL_DATE'" >&2; exit 1; }

          {
            echo "BRAND=$FINAL_BRAND"
            echo "KBUILD_BUILD_USER=$FINAL_USER"
            echo "KBUILD_BUILD_HOST=$IN_BUILD_HOST"
            echo "KBUILD_BUILD_VERSION=$IN_BUILD_VERSION"
            echo "KBUILD_BUILD_TIMESTAMP=$FINAL_DATE"
          } >> "$GITHUB_ENV"
          echo "brand=$FINAL_BRAND user=$FINAL_USER host=$IN_BUILD_HOST ver=$IN_BUILD_VERSION ts=$FINAL_DATE"

      - name: Clean workspace
        run: |
          set -Eeuo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      # ── 1. Host dependencies ───────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 lzop pahole python3 rsync \
            zstd xz-utils cpio zip unzip
          command -v pahole >/dev/null || { echo "::error::pahole missing (needed if DEBUG_INFO_BTF=y)"; exit 1; }
          pahole --version
          python3 --version
          git --version
          aarch64-linux-gnu-gcc --version | head -n1
          arm-linux-gnueabi-gcc --version | head -n1

      # ── 2. Checkouts ───────────────────────────────────────────────────────
      - name: Checkout Project_Chimera overlay repo (full checkout; no sparse filter)
        if: ${{ inputs.profile != 'boot-first' || inputs.merge_ksu_fragment }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CHIMERA_REPO_SLUG }}
          ref: ${{ env.CHIMERA_REF_RESOLVED }}
          path: ${{ env.OVERLAY_DIR_NAME }}
          fetch-depth: 1
          clean: false

      - name: Record Project_Chimera revision and verify required files
        if: ${{ inputs.profile != 'boot-first' || inputs.merge_ksu_fragment }}
        run: |
          set -Eeuo pipefail
          OV="$GITHUB_WORKSPACE/$OVERLAY_DIR_NAME"
          SHA="$(git -C "$OV" rev-parse HEAD)"
          echo "CHIMERA_SHA=$SHA" >> "$GITHUB_ENV"
          echo "OVERLAY_DIR=$OV" >> "$GITHUB_ENV"
          echo "Chimera resolved: $CHIMERA_REF_RESOLVED  checked-out commit: $SHA"
          [[ "$SHA" == "$CHIMERA_REF_RESOLVED" ]] || { echo "FATAL: Project_Chimera checkout $SHA != resolved $CHIMERA_REF_RESOLVED" >&2; exit 1; }
          NEED=()
          KSU_FRAGMENT_USED=""
          if [[ "$IN_MERGE_KSU_FRAGMENT" == "true" ]]; then
            [[ -f "$OV/chimera-xxksu-susfs.cfg" ]] || { echo "FATAL: merge_ksu_fragment=true but chimera-xxksu-susfs.cfg is absent from $CHIMERA_REPO_SLUG@$SHA" >&2; exit 1; }
            KSU_FRAGMENT_USED="chimera-xxksu-susfs.cfg"
            NEED+=("$KSU_FRAGMENT_USED")
          fi
          echo "KSU_FRAGMENT_USED=$KSU_FRAGMENT_USED" >> "$GITHUB_ENV"
          if [[ "$APPLY_OVERLAY" == "true" ]]; then
            # Validate these exact files before any overlay change is made, even for the lite profile.
            NEED+=(
              chimera-device-specific.cfg
              patches/apply_chimera_overlay_patches.sh
              patches/0001-mfd-madera-core-settle-delay-after-reset-release.patch
            )
            case "$OVERLAY_PROFILE_EFFECTIVE" in
              full) ;;
              lite) NEED+=(patches/apply_chimera_overlay_lite.sh) ;;
            esac
          fi
          MISSING=()
          for f in "${NEED[@]}"; do
            if [[ -f "$OV/$f" ]]; then echo "OK: $f"; else MISSING+=("$f"); fi
          done
          if [[ "${#MISSING[@]}" -ne 0 ]]; then
            echo "FATAL: missing required Chimera overlay file(s) in $CHIMERA_REPO_SLUG@$SHA: ${MISSING[*]}" >&2
            echo "--- $CHIMERA_REPO_SLUG@$SHA (HEAD: $(git -C "$OV" log -1 --format=%s)) ---" >&2
            echo "tracked files: $(git -C "$OV" ls-tree -r --name-only HEAD | wc -l)" >&2
            echo "--- top level ---" >&2
            git -C "$OV" ls-tree --name-only HEAD | tr '\n' ' ' >&2; echo >&2
            echo "--- chimera*, patches/, *.cfg, apply_* entries ---" >&2
            git -C "$OV" ls-tree -r --name-only HEAD | grep -E '(^|/)(chimera[^/]*|patches/.*|[^/]*\.cfg|apply_[^/]*)$' >&2 || echo "(none)" >&2
            echo "::error::Use profile=boot-first, or select a chimera_ref commit containing the listed overlay files." >&2
            exit 1
          fi
          [[ ! -f "$OV/patches/apply_chimera_overlay_patches.sh" ]] || chmod +x "$OV/patches/apply_chimera_overlay_patches.sh"
          [[ ! -f "$OV/patches/apply_chimera_overlay_lite.sh" ]] || chmod +x "$OV/patches/apply_chimera_overlay_lite.sh"

      - name: Checkout pinned gavdoc38 kernel (submodules recursive — UNVERIFIED need)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAVDOC_REPO_SLUG }}
          ref: ${{ env.GAVDOC_REF_RESOLVED }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1
          submodules: recursive
          clean: false

      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR" "$GITHUB_WORKSPACE/$OUT_DIR" "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/toolchains"
          {
            echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR"
            echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR"
            echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR"
            echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang"
            echo "ART_DIR=$GITHUB_WORKSPACE/artifacts"
          } >> "$GITHUB_ENV"

      - name: Fetch upstream krazey repos (latest tip, fetch-only, no merge) and write advisory reports
        if: ${{ inputs.krazey_upstreams != '' }}
        continue-on-error: true
        run: |
          set -Eeuo pipefail
          ROOT="$GITHUB_WORKSPACE/$KRAZEY_DIR_NAME"
          BASE="$GAVDOC_REF_RESOLVED"
          rm -rf "$ROOT"; mkdir -p "$ROOT"
          RESOLVED=""
          IFS=',' read -r -a ENTRIES <<< "$IN_KRAZEY_UPSTREAMS"
          for raw in "${ENTRIES[@]}"; do
            e="${raw//[[:space:]]/}"; [[ -n "$e" ]] || continue
            repo="${e%%@*}"; branch=""; if [[ "$e" == *@* ]]; then branch="${e#*@}"; fi
            slug="$(printf '%s' "$repo" | tr '/' '_')"; d="$ROOT/$slug"; rpt="$ABS_LOG/krazey-${slug}.txt"
            spec="HEAD"; if [[ -n "$branch" ]]; then spec="refs/heads/$branch"; fi
            git init -q "$d" || { echo "::warning::krazey: git init failed for $e"; continue; }
            git -C "$d" remote add origin "https://github.com/${repo}.git" || { echo "::warning::krazey: remote add failed for $e"; continue; }
            git -C "$d" fetch -q --no-tags --depth=50 --filter=blob:none origin "$spec" || { echo "::warning::krazey: fetch failed for $e (fetch-only; build unaffected)"; continue; }
            tip="$(git -C "$d" rev-parse "FETCH_HEAD^{commit}")" || { echo "::warning::krazey: cannot resolve tip for $e"; continue; }
            {
              echo "upstream: $repo  branch: ${branch:-<remote default HEAD>}"
              echo "tip: $tip"
              echo "--- last 30 commits ---"
              git -C "$d" log -n 30 --format='%h %ci %an | %s' "$tip"
              echo "--- changed paths: kernel base $BASE -> upstream tip (grouped by top 2 dirs; count status dir) ---"
            } > "$rpt"
            if git -C "$d" fetch -q --no-tags --depth=1 --filter=blob:none "$GAVDOC_REPO" "$BASE"; then
              base_tip="$(git -C "$d" rev-parse "FETCH_HEAD^{commit}")"
              git -C "$d" diff-tree -r --name-status --no-renames "$base_tip" "$tip" \
                | awk '{n=split($2,a,"/"); k=(n>1)?a[1]"/"a[2]:a[1]; c[$1" "k]++} END{for(x in c) print c[x], x}' \
                | sort -rn | sed -n '1,60p' >> "$rpt" || true
              echo "total changed paths: $(git -C "$d" diff-tree -r --name-only --no-renames "$base_tip" "$tip" | wc -l)" >> "$rpt"
            else
              echo "(could not fetch kernel base $BASE for comparison)" >> "$rpt"
            fi
            RESOLVED+="${repo}@${branch:-HEAD}=${tip};"
            sed -n '1,12p' "$rpt"
          done
          echo "KRAZEY_FETCHED=$RESOLVED" >> "$GITHUB_ENV"
          echo "Fetched (no merge, no patch applied): ${RESOLVED:-none}"

      - name: Deepen submodules if present (KSU Kbuild may run git describe/rev-list) — UNVERIFIED need
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          if [[ -f .gitmodules ]]; then
            git submodule status --recursive | tee "$ABS_LOG/submodule-status.txt"
            git submodule foreach --recursive 'git fetch -q --unshallow --tags 2>/dev/null || git fetch -q --tags 2>/dev/null || true'
          else
            echo "no .gitmodules in base — nothing to deepen" | tee "$ABS_LOG/submodule-status.txt"
          fi

      # ── 3. Shared toolchain library (sourced by every step) ────────────────
      - name: Write shared toolchain library
        run: |
          set -Eeuo pipefail
          cat > "$CI_LIB" <<'LIBEOF'
          # Sourced by each step. Reads only persisted env. No cross-step arrays.
          # KBUILD_LDFLAGS is deliberately never defined or passed (empty is valid).
          chimera_toolchain_args() {
            local v bad
            for v in TOOLCHAIN TC_CC TC_LD TC_AR TC_NM TC_OBJCOPY TC_OBJDUMP TC_STRIP TC_READELF \
                     TC_CROSS_COMPILE TC_CROSS_COMPILE_ARM32 CHIMERA_KCFLAGS_COMMON; do
              [[ -n "${!v-}" ]] || { echo "FATAL: $v is unset or empty" >&2; return 1; }
            done
            if [[ "$TOOLCHAIN" == "gcc" ]]; then
              TOOLCHAIN_ARGS=(
                "CC=${TC_CC}"
                "HOSTCC=gcc -fcommon"
                "HOSTCXX=g++"
                "HOSTLD=ld"
                "LD=${TC_LD}"
                "AR=${TC_AR}"
                "NM=${TC_NM}"
                "OBJCOPY=${TC_OBJCOPY}"
                "OBJDUMP=${TC_OBJDUMP}"
                "STRIP=${TC_STRIP}"
                "READELF=${TC_READELF}"
                "CROSS_COMPILE=${TC_CROSS_COMPILE}"
                "CROSS_COMPILE_ARM32=${TC_CROSS_COMPILE_ARM32}"
              )
              BUILD_KCFLAGS="$CHIMERA_KCFLAGS_COMMON"
              for bad in -fuse-ld=lld -Wno-unknown-warning-option -Wno-error=unused-but-set-global; do
                [[ " $BUILD_KCFLAGS " != *" $bad "* ]] || { echo "FATAL: clang-only flag $bad in GCC mode" >&2; return 1; }
              done
              [[ "$TC_CC" == *aarch64-linux-gnu-gcc ]] || { echo "FATAL: GCC mode CC is '$TC_CC'" >&2; return 1; }
              [[ "$TC_LD" == "aarch64-linux-gnu-ld" ]] || { echo "FATAL: GCC mode LD is '$TC_LD'" >&2; return 1; }
              [[ "$TC_CROSS_COMPILE" == "aarch64-linux-gnu-" ]] || { echo "FATAL: GCC mode CROSS_COMPILE is '$TC_CROSS_COMPILE'" >&2; return 1; }
            else
              TOOLCHAIN_ARGS=(
                "CC=${TC_CC}"
                "HOSTCC=clang -fcommon"
                "HOSTCXX=clang++"
                "HOSTLD=ld.lld"
                "HOSTAR=llvm-ar"
                "HOSTAS=clang"
                "LD=${TC_LD}"
                "AR=${TC_AR}"
                "NM=${TC_NM}"
                "OBJCOPY=${TC_OBJCOPY}"
                "OBJDUMP=${TC_OBJDUMP}"
                "STRIP=${TC_STRIP}"
                "READELF=${TC_READELF}"
                "LLVM=1"
                "LLVM_IAS=1"
                "CLANG_TRIPLE=aarch64-linux-gnu-"
                "CROSS_COMPILE=${TC_CROSS_COMPILE}"
                "CROSS_COMPILE_ARM32=${TC_CROSS_COMPILE_ARM32}"
              )
              BUILD_KCFLAGS="$CHIMERA_KCFLAGS_COMMON -fuse-ld=lld"
              [[ "$TC_CC" == *clang* && "$TC_CC" != *gcc* ]] || { echo "FATAL: LLVM mode CC is '$TC_CC' (GCC is forbidden)" >&2; return 1; }
              [[ "$TC_LD" == "ld.lld" ]] || { echo "FATAL: LLVM mode LD is '$TC_LD'" >&2; return 1; }
              [[ "$TC_AR" == "llvm-ar" && "$TC_NM" == "llvm-nm" && "$TC_OBJCOPY" == "llvm-objcopy" ]] || { echo "FATAL: LLVM mode is missing LLVM binutils" >&2; return 1; }
              [[ "$TC_OBJDUMP" == "llvm-objdump" && "$TC_STRIP" == "llvm-strip" && "$TC_READELF" == "llvm-readelf" ]] || { echo "FATAL: LLVM mode is missing LLVM inspection/strip tools" >&2; return 1; }
            fi
          }
          chimera_make() {
            make O="$ABS_OUT" ARCH=arm64 "${TOOLCHAIN_ARGS[@]}" "$@"
          }
          # xxKSU freeze: fingerprint of everything that could carry KernelSU/xxKSU state.
          # Run from the kernel tree root. $1 = KSU directory (dirname of the Kconfig defining `config KSU`).
          # Covers: index entries under the KSU dir, global submodule/gitlink state, worktree changes under the KSU dir,
          # and per-submodule HEAD + worktree status. Layout (submodule vs in-tree vs symlink) is UNVERIFIED, so all of it is hashed.
          ksu_fingerprint() {
            local d="$1"
            {
              echo "## ls-files -s $d";  git ls-files -s -- "$d"
              echo "## submodule status"; git submodule status --recursive
              echo "## status $d";        git status --porcelain --ignore-submodules=none -- "$d"
              echo "## submodule worktrees"
              git submodule foreach --quiet --recursive 'echo "$displaypath $(git rev-parse HEAD)"; git status --porcelain'
            } 2>&1 | sha256sum | cut -d' ' -f1
          }
          LIBEOF
          bash -n "$CI_LIB"
          echo "library written: $CI_LIB"

      # ── 4. Toolchain resolution (carried over unchanged from base) ─────────
      # gcc = compile-tested default in base (on a different kernel base); llvm-full = full LLVM mode; all other
      # non-gcc options EXPERIMENTAL — UNVERIFIED — REQUIRES CONFIRMATION. Nothing here was re-downloaded.
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail
          TC_URL=""; TC_ARCHIVE_FMT="tar.gz"; TC_CACHE_KEY=""; TC_SHA256=""
          case "$IN_TOOLCHAIN" in
            gcc)
              TC_CACHE_KEY="gcc-cross-ubuntu-24.04-v3" ;;
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz"
              TC_CACHE_KEY="aosp-clang-r536225-ubuntu-24.04-v2" ;;
            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              echo "::warning::aosp20 uses a mutable third-party mirror (master); not reproducible" ;;
            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2" ;;
            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              echo "::warning::aosp22 URL references a mutable branch; not reproducible" ;;
            aosp23)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/28337064939c0b4bb5804cddf35fb03d860edcf6/clang-r614150.tar.gz"
              TC_CACHE_KEY="aosp-clang-r614150-ubuntu-24.04-v1"
              echo "::warning::aosp23 unverified: no SHA-256 pin" ;;
            llvm20)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="korg-clang-20.1.8-ubuntu-24.04-v1" ;;
            llvm21)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="llvm-clang-21.1.0-ubuntu-24.04-v1" ;;
            llvm-full)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="llvm-full-22.1.7-ubuntu-24.04-v1" ;;
            llvm22)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="llvm-clang-22.1.7-ubuntu-24.04-v1" ;;
            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"; TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2" ;;
            neutron23)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"; TC_CACHE_KEY="neutron-clang-30062026-ubuntu-24.04-v2" ;;
            neutron24)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"; TC_CACHE_KEY="neutron-clang-30072026-ubuntu-24.04-v2" ;;
            zyc_stable)
              TC_URL="$(curl -fsSL https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt | head -n1 | tr -d '\r')"
              [[ "$TC_URL" =~ ^https:// ]] || { echo "FATAL: zyc URL lookup failed: '$TC_URL'" >&2; exit 1; }
              TC_ARCHIVE_FMT="tar.gz"   # UNVERIFIED — REQUIRES CONFIRMATION
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-$(printf '%s' "$TC_URL" | sha256sum | cut -c1-16)" ;;
            weebx)
              TC_URL="https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz"
              TC_CACHE_KEY="weebx-clang-20.0.0git-20241206-ubuntu-24.04-v1"
              TC_SHA256="a2ac878d7f26fc1ac7d90d1330e4e34b62676d3a2326673b78b7799e1d8a0a7c" ;;
            *) echo "FATAL: unsupported toolchain $IN_TOOLCHAIN" >&2; exit 1 ;;
          esac

          if [[ "$IN_TOOLCHAIN" == "gcc" ]]; then
            TC_CC="ccache aarch64-linux-gnu-gcc"; TC_LD="aarch64-linux-gnu-ld"
            TC_AR="aarch64-linux-gnu-ar"; TC_NM="aarch64-linux-gnu-nm"
            TC_OBJCOPY="aarch64-linux-gnu-objcopy"; TC_OBJDUMP="aarch64-linux-gnu-objdump"
            TC_STRIP="aarch64-linux-gnu-strip"; TC_READELF="aarch64-linux-gnu-readelf"
          else
            TC_CC="ccache clang"; TC_LD="ld.lld"; TC_AR="llvm-ar"; TC_NM="llvm-nm"
            TC_OBJCOPY="llvm-objcopy"; TC_OBJDUMP="llvm-objdump"; TC_STRIP="llvm-strip"; TC_READELF="llvm-readelf"
          fi
          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_SHA256=$TC_SHA256"
            echo "TC_CC=$TC_CC"
            echo "TC_LD=$TC_LD"
            echo "TC_AR=$TC_AR"
            echo "TC_NM=$TC_NM"
            echo "TC_OBJCOPY=$TC_OBJCOPY"
            echo "TC_OBJDUMP=$TC_OBJDUMP"
            echo "TC_STRIP=$TC_STRIP"
            echo "TC_READELF=$TC_READELF"
            echo "TC_CROSS_COMPILE=aarch64-linux-gnu-"
            echo "TC_CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          } >> "$GITHUB_ENV"
          echo "Toolchain=$IN_TOOLCHAIN CC=$TC_CC LD=$TC_LD"

      - name: Cache toolchain
        if: ${{ inputs.toolchain != 'gcc' }}
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: ${{ inputs.toolchain != 'gcc' && steps.tc-cache.outputs.cache-hit != 'true' }}
        run: |
          set -Eeuo pipefail
          rm -rf "$ABS_TC"; mkdir -p "$ABS_TC"
          [[ -n "$TC_URL" ]] || { echo "FATAL: TC_URL empty" >&2; exit 1; }
          ARCHIVE=/tmp/clang_archive
          aria2c -x 16 -s 16 -k 1M -c --max-tries=5 --retry-wait=5 --timeout=60 \
            --dir=/tmp --out=clang_archive "$TC_URL"
          [[ -s "$ARCHIVE" ]] || { echo "FATAL: archive missing/empty" >&2; exit 1; }
          ACTUAL_SHA="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          echo "toolchain archive sha256: $ACTUAL_SHA" | tee "$ABS_LOG/toolchain-archive-sha256.txt"
          if [[ -n "$TC_SHA256" && "$ACTUAL_SHA" != "$TC_SHA256" ]]; then
            echo "FATAL: SHA-256 mismatch (expected $TC_SHA256)" >&2; exit 1
          fi
          case "$TC_ARCHIVE_FMT" in
            tar.gz) tar -C "$ABS_TC" -xzf "$ARCHIVE" ;;
            tar.xz) tar -C "$ABS_TC" -xJf "$ARCHIVE" ;;
            tar.zst) zstd -d "$ARCHIVE" -o /tmp/clang.tar --force; tar -C "$ABS_TC" -xf /tmp/clang.tar ;;
            *) echo "FATAL: unsupported archive format '$TC_ARCHIVE_FMT'" >&2; exit 1 ;;
          esac
          [[ -n "$(find "$ABS_TC" -type f -print -quit)" ]] || { echo "FATAL: no files extracted" >&2; exit 1; }
          echo "Toolchain ready: $(find "$ABS_TC" -type f | wc -l) file(s)"

      - name: Configure LLVM toolchain PATH
        if: ${{ inputs.toolchain != 'gcc' }}
        run: |
          set -Eeuo pipefail
          ACTUAL_BIN="$(find "$ABS_TC" -type d -name bin -printf '%d\t%p\n' | sort -n | cut -f2 | sed -n '1p')"
          [[ -n "$ACTUAL_BIN" && -d "$ACTUAL_BIN" ]] || { echo "FATAL: no bin dir under $ABS_TC" >&2; exit 1; }
          chmod +x "$ACTUAL_BIN"/* 2>/dev/null || true
          echo "$ACTUAL_BIN" >> "$GITHUB_PATH"
          echo "toolchain bin: $ACTUAL_BIN"

      - name: Verify toolchain and capture compiler identity
        run: |
          set -Eeuo pipefail
          need() { command -v "$1" >/dev/null 2>&1 || { echo "FATAL: missing command $1" >&2; exit 1; }; }
          need ccache
          if [[ "$TOOLCHAIN" == "gcc" ]]; then
            for t in gcc ld ar nm objcopy objdump strip readelf; do need "aarch64-linux-gnu-$t"; done
            for t in gcc ld ar nm objcopy objdump strip readelf; do need "arm-linux-gnueabi-$t"; done
            COMPILER_VERSION="$(aarch64-linux-gnu-gcc --version | head -n1)"
            LINKER_VERSION="$(aarch64-linux-gnu-ld --version | head -n1)"
            COMPILER_KIND=gcc
          else
            for b in clang clang++ ld.lld llvm-nm llvm-objdump llvm-ar llvm-objcopy llvm-strip llvm-readelf; do need "$b"; done
            clang --print-targets | grep -qi aarch64 || { echo "FATAL: clang lacks aarch64 target" >&2; exit 1; }
            COMPILER_VERSION="$(clang --version | head -n1)"
            LINKER_VERSION="$(ld.lld --version | head -n1)"
            COMPILER_KIND=llvm
            if [[ "$TOOLCHAIN" == "llvm-full" ]]; then
              [[ "$(command -v clang)" != *aarch64-linux-gnu-gcc* ]] || { echo "FATAL: full-LLVM resolved CC to GCC" >&2; exit 1; }
              echo "FULL_LLVM_MODE=1" >> "$GITHUB_ENV"
            fi
          fi
          TC_IDENTITY_HASH="$(printf '%s\n%s\n%s\n' "$COMPILER_VERSION" "$LINKER_VERSION" "$COMPILER_KIND" | sha256sum | cut -c1-16)"
          {
            echo "COMPILER_VERSION=$COMPILER_VERSION"
            echo "LINKER_VERSION=$LINKER_VERSION"
            echo "COMPILER_KIND=$COMPILER_KIND"
            echo "TC_IDENTITY_HASH=$TC_IDENTITY_HASH"
          } >> "$GITHUB_ENV"
          {
            echo "Compiler: $COMPILER_VERSION"
            echo "Linker:   $LINKER_VERSION"
            echo "Kind:     $COMPILER_KIND"
            echo "Identity hash: $TC_IDENTITY_HASH"
          } | tee "$ABS_LOG/toolchain-identity.txt"

      - name: Set up ccache
        if: ${{ inputs.build_scope == 'full' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: chimera-mk10-g38-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-${{ github.sha }}
          restore-keys: |
            chimera-mk10-g38-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ── 5. Verify base (gavdoc38 tree is EXPECTED to be KSU/SUSFS-integrated already) ──
      - name: Preflight — base commit, clean tree, kernel version, defconfig, integrated-tree presence
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$(git status --porcelain --ignore-submodules=none)" ]]; then
            echo "FATAL: base checkout not clean" >&2; git status --short; exit 1
          fi
          BASE_COMMIT="$(git rev-parse HEAD)"
          [[ "$BASE_COMMIT" == "$GAVDOC_REF_RESOLVED" ]] || { echo "FATAL: HEAD $BASE_COMMIT != requested gavdoc_ref $GAVDOC_REF_RESOLVED" >&2; exit 1; }
          KV="$(make -s --no-print-directory kernelversion)"
          echo "kernelversion: $KV"
          [[ "$KV" =~ ^4\.9\. ]] || { echo "FATAL: kernelversion '$KV' is not 4.9.x (expected for Exynos 9810 LOS kernel — UNVERIFIED assumption)" >&2; exit 1; }
          if [[ ! -f "$DEFCONFIG" ]]; then
            echo "FATAL: defconfig missing: $DEFCONFIG (UNVERIFIED path). Available Exynos 9810 defconfigs:" >&2
            find arch/arm64/configs -maxdepth 1 -iname '*9810*' >&2 || true
            exit 1
          fi
          # Integrated-tree presence (inverse of base's 'pristine' check). Names are UNVERIFIED for xxksu3.
          for p in fs/susfs.c include/linux/susfs.h; do
            [[ -s "$p" ]] || { echo "FATAL: '$p' missing — branch does not look SUSFS-integrated (UNVERIFIED file name); this workflow performs NO integration" >&2; exit 1; }
          done
          KSU_KCONFIG="$(grep -rlE --include='Kconfig*' --exclude-dir=.git '^config KSU$' . 2>/dev/null | head -n1 || true)"
          [[ -n "$KSU_KCONFIG" ]] || { echo "FATAL: no Kconfig defining 'config KSU' found — branch does not look KernelSU-integrated; this workflow performs NO integration" >&2; exit 1; }
          echo "KSU Kconfig: $KSU_KCONFIG"
          git ls-files -s | awk '$1=="160000"{print $2, $4}' > "$ABS_LOG/gitlinks.txt" || true
          echo "$BASE_COMMIT" > "$ABS_LOG/base-commit.txt"
          UNAME_PREVIEW="Linux version ${KV}${BRAND} (${KBUILD_BUILD_USER}@${KBUILD_BUILD_HOST}) #${KBUILD_BUILD_VERSION} SMP PREEMPT"
          {
            echo "BASE_COMMIT=$BASE_COMMIT"
            echo "KERNEL_VERSION=$KV"
            echo "KERNEL_RELEASE_EXPECTED=${KV}${BRAND}"
            echo "KSU_KCONFIG_PATH=$KSU_KCONFIG"
            echo "UNAME_PREVIEW=$UNAME_PREVIEW"
          } >> "$GITHUB_ENV"
          echo "OK: gavdoc base $GAVDOC_REPO_SLUG@$BASE_COMMIT, $KV, defconfig present, KSU/SUSFS integration present"

      - name: Verify integrated tree (hard presence checks; call-site checks are warnings — names UNVERIFIED for xxksu3)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          FAIL=0
          # Hard: some ksu_handle_* hook exists in the VFS/input/reboot call sites.
          if grep -rqE 'ksu_handle_' --include='*.c' --include='*.h' fs kernel security drivers/input include/linux 2>/dev/null; then
            echo "OK:    ksu_handle_* hook references present"
          else
            echo "FATAL: no ksu_handle_* references in fs/kernel/security/drivers/input/include" >&2; FAIL=1
          fi
          if grep -rqE 'susfs_' --include='*.c' --include='*.h' fs kernel security include/linux 2>/dev/null; then
            echo "OK:    susfs_* references present"
          else
            echo "FATAL: no susfs_* references" >&2; FAIL=1
          fi
          soft() {
            local d="$1" f="$2" p="$3"
            if grep -qE -- "$p" "$f" 2>/dev/null; then echo "OK:    $d"; else echo "::warning::$d — /$p/ not found in $f (UNVERIFIED expectation)"; fi
          }
          soft "sched.h susfs task fields"  include/linux/sched.h 'susfs_task_state'
          soft "can_umount() present"       fs/namespace.c '^static int can_umount\('
          soft "path_umount() defined"      fs/namespace.c '^int path_umount\('
          soft "seccomp filter_count"       include/linux/seccomp.h 'atomic_t filter_count;'
          soft "objsec.h selinux_cred()"    security/selinux/include/objsec.h 'selinux_cred\('
          soft "objsec.h selinux_inode()"   security/selinux/include/objsec.h 'selinux_inode\('
          soft "reboot.c hook"              kernel/reboot.c 'ksu_handle_sys_reboot'
          soft "exec.c hook"                fs/exec.c 'ksu_handle_execveat'
          soft "open.c hook"                fs/open.c 'ksu_handle_faccessat'
          soft "stat.c hook"                fs/stat.c 'ksu_handle_stat'
          soft "read_write.c hook"          fs/read_write.c 'ksu_handle_(sys_read|vfs_read)'
          soft "input.c hook"               drivers/input/input.c 'ksu_handle_input_handle_event'
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: integrated tree present (no integration performed by this workflow)"

      # ── 5b. xxKSU freeze: baseline (r4) ────────────────────────────────────
      # The xxKSU in the pinned gavdoc38 tree (v3.3.1 build 32680, uapi v5 per gavdoc38 v3.3.0 notes) is the ONLY xxKSU.
      # This step records its fingerprint; "KSU freeze guard" below fails the run if any CI patch alters it.
      - name: KSU pin gate + freeze baseline (permanent xxKSU v3.3.1, KSU_VERSION 32680)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          source "$CI_LIB"
          KSU_DIR="$(dirname "$KSU_KCONFIG_PATH")"
          [[ -d "$KSU_DIR" ]] || { echo "FATAL: KSU dir '$KSU_DIR' (from $KSU_KCONFIG_PATH) is not a directory" >&2; exit 1; }
          # PERMANENT xxKSU PIN GATE: gitlink, checked-out commit and KSU_VERSION must all match the pin (v3.3.1 build 32680).
          GL="$(git ls-files -s | awk '$1=="160000"{print $2, $4}')"
          if ! grep -q "^${KSU_PIN_SHA} " <<<"$GL"; then
            { echo "FATAL: no gitlink equals the permanent xxKSU pin $KSU_PIN_SHA. This gavdoc_ref ($BASE_COMMIT) points KernelSU elsewhere:"; echo "$GL"
              echo "Use gavdoc_ref=11f2256b423acdec8860eaf7f670f13b06e27778 (release v3.3.0), or edit KSU_PIN_SHA/KSU_PIN_VERSION in this workflow deliberately."; } >&2
            exit 1
          fi
          SS="$(git submodule status --recursive)"
          if grep -qE '^[-+U]' <<<"$SS"; then echo "FATAL: a submodule is not at its recorded commit:" >&2; echo "$SS" >&2; exit 1; fi
          awk '{print $1}' <<<"$(sed -E 's/^.//' <<<"$SS")" | grep -qx "$KSU_PIN_SHA" || { echo "FATAL: KernelSU submodule is not checked out at $KSU_PIN_SHA" >&2; echo "$SS" >&2; exit 1; }
          VLINE="$(grep -hE 'DKSU_VERSION=' "$KSU_DIR/Makefile" 2>/dev/null || true)"
          echo "KSU_VERSION line: $VLINE"
          [[ "$VLINE" == *"-DKSU_VERSION=${KSU_PIN_VERSION}"* ]] || { echo "FATAL: $KSU_DIR/Makefile does not define -DKSU_VERSION=$KSU_PIN_VERSION" >&2; exit 1; }
          echo "PASS: xxKSU pin gate (commit $KSU_PIN_SHA, KSU_VERSION=$KSU_PIN_VERSION)"
          KSU_FP_BASE="$(ksu_fingerprint "$KSU_DIR")"
          [[ "$KSU_FP_BASE" =~ ^[0-9a-f]{64}$ ]] || { echo "FATAL: could not compute KSU fingerprint" >&2; exit 1; }
          {
            echo "KSU_DIR=$KSU_DIR"
            echo "KSU_FP_BASE=$KSU_FP_BASE"
          } >> "$GITHUB_ENV"
          HINTS="$(grep -rnIE '(uapi|KSU_VERSION|KERNEL_SU_VERSION|KSU_FULL_VERSION)' \
            --include='*.h' --include='Kbuild' --include='Makefile' --include='Kconfig*' "$KSU_DIR" 2>/dev/null || true)"
          {
            echo "policy:      $KSU_POLICY"
            echo "expected:    $KSU_EXPECTED"
            echo "ksu_dir:     $KSU_DIR (layout UNVERIFIED)"
            echo "fingerprint: $KSU_FP_BASE"
            echo "--- submodule status ---"
            git submodule status --recursive 2>&1 || true
            echo "--- version/uapi hints (best effort; names UNVERIFIED; the build number is not necessarily a literal in the sources) ---"
            if [[ -n "$HINTS" ]]; then printf '%s\n' "$HINTS" | sed -n '1,60p'; else echo "(none found)"; fi
          } | tee "$ABS_LOG/ksu-baseline.txt"
          echo "::notice::xxKSU frozen to the pinned gavdoc38 tree. Expected: $KSU_EXPECTED. Confirm uapi on device with the manager; CI cannot prove it."

      # ── 6. Identity (CI-time, cosmetic) ────────────────────────────────────
      - name: Apply build identity (CI-time patch, no push)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' "$DEFCONFIG"
          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' "$BRAND" "$KBUILD_BUILD_HOST" >> "$DEFCONFIG"
          printf '#!/bin/sh\nprintf "%%s" "%s"\n' "$BRAND" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "$BRAND" > localversion
          echo "identity applied: brand=$BRAND host=$KBUILD_BUILD_HOST"

      # ── 6b. CI-time patch: bcmdhd_101_16 -Werror (GCC 13 failures; no-op if dir absent) ──
      - name: CI-time patch — drop -Werror from bcmdhd_101_16 build files
        if: ${{ inputs.relax_bcmdhd_werror }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          D=drivers/net/wireless/bcmdhd_101_16
          [[ -d "$D" ]] || { echo "::warning::$D not found — nothing to patch"; exit 0; }
          { grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" || echo "no -Werror found (before)"; } | tee "$ABS_LOG/bcmdhd-werror-before.txt"
          mapfile -t F < <(grep -rlE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" || true)
          for f in "${F[@]}"; do
            sed -i -E ':a;s/(^|[[:space:]])-Werror(=[A-Za-z0-9_-]+)?([[:space:]]|$)/\1\3/;ta' "$f"
            echo "patched: $f"
          done
          if grep -rqE --include='Makefile' --include='Kbuild' --include='*.mk' -e '(^|[[:space:]])-Werror(=[A-Za-z0-9_-]+)?([[:space:]]|$)' "$D"; then
            echo "FATAL: -Werror still present in bcmdhd build files" >&2
            grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" >&2 || true
            exit 1
          fi
          { grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" || echo "no -Werror remains in build files"; } | tee "$ABS_LOG/bcmdhd-werror-after.txt"

      # ── 7. Chimera overlay (chimera-lite / chimera-full only) ──────────────
      - name: Optional overlay — hooks.c selinux_cred() consistency + stack protector
        if: ${{ env.APPLY_OVERLAY == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          grep -q 'selinux_cred(' security/selinux/include/objsec.h || {
            echo "FATAL: security/selinux/include/objsec.h has no selinux_cred() helper on this branch — the hooks.c selinux_cred() overlay pass is INCOMPATIBLE with the gavdoc38 lineage-24.0-xxksu3-susfs2 tree (UNVERIFIED). Use profile=boot-first, or update the overlay." >&2
            exit 1; }
          # CONFIG_CC_STACKPROTECTOR is a hidden def_bool selected by the choice
          # (NONE | REGULAR | STRONG); select the choice member instead.
          sed -i -E '/^(# )?CONFIG_CC_STACKPROTECTOR(_NONE|_REGULAR|_STRONG)?([= ]|$)/d' "$DEFCONFIG"
          printf '# CONFIG_CC_STACKPROTECTOR_NONE is not set\nCONFIG_CC_STACKPROTECTOR_REGULAR=y\n# CONFIG_CC_STACKPROTECTOR_STRONG is not set\n' >> "$DEFCONFIG"
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path
          MARKER = "CMK9_HOOKS_C_SELINUX_CRED_CONSISTENCY"
          p = Path("security/selinux/hooks.c")
          src = p.read_text()
          if MARKER in src:
              print("hooks.c: already applied"); sys.exit(0)
          subs = [
              (r'\btsec = cred->security;', 'tsec = selinux_cred(cred);'),
              (r'const struct task_security_struct \*tsec = cred->security;',
               'const struct task_security_struct *tsec = selinux_cred(cred);'),
              (r'const struct task_security_struct \*tsec = current_security\(\);',
               'const struct task_security_struct *tsec = selinux_cred(current_cred());'),
              (r'rc = selinux_determine_inode_label\(current_security\(\)',
               'rc = selinux_determine_inode_label(selinux_cred(current_cred())'),
              (r'\bold_tsec = current_security\(\);', 'old_tsec = selinux_cred(current_cred());'),
              (r'\bnew_tsec = bprm->cred->security;', 'new_tsec = selinux_cred(bprm->cred);'),
              (r'rc = selinux_determine_inode_label\(old->security',
               'rc = selinux_determine_inode_label(selinux_cred(old)'),
              (r'\btsec = new->security;', 'tsec = selinux_cred(new);'),
              (r'\btsec = new_creds->security;', 'tsec = selinux_cred(new_creds);'),
              (r'\bold_tsec = old->security;', 'old_tsec = selinux_cred(old);'),
              (r'const struct task_security_struct \*old_tsec = old->security;',
               'const struct task_security_struct *old_tsec = selinux_cred(old);'),
              (r'struct task_security_struct \*tsec = new->security;',
               'struct task_security_struct *tsec = selinux_cred(new);'),
              (r'__tsec = current_security\(\);', '__tsec = selinux_cred(current_cred());'),
              (r'__tsec = __task_cred\(p\)->security;', '__tsec = selinux_cred(__task_cred(p));'),
          ]
          total = 0
          for pat, rep in subs:
              src, n = re.subn(pat, rep, src)
              if n:
                  print(f"  converted {n}: {pat}"); total += n
          if total:
              p.write_text(f"/* {MARKER} */\n" + src)
              print(f"hooks.c: {total} sites converted")
          else:
              print("hooks.c: no applicable sites")
          PYEOF
          for fn in selinux_cred_alloc_blank selinux_cred_free selinux_cred_prepare selinux_cred_transfer; do
            grep -q "$fn" security/selinux/hooks.c || { echo "FATAL: $fn missing from hooks.c" >&2; exit 1; }
          done
          REMAINING="$(grep -cE 'rc = selinux_determine_inode_label\((current_security\(\)|old->security)' security/selinux/hooks.c || true)"
          [[ "${REMAINING:-0}" -eq 0 ]] || { echo "FATAL: $REMAINING unconverted sites" >&2; exit 1; }
          echo "PASS: hooks.c consistency pass"

      - name: Optional overlay — Chimera overlay script and marker verification (profile full)
        if: ${{ env.OVERLAY_PROFILE_EFFECTIVE == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          bash "$OVERLAY_DIR/patches/apply_chimera_overlay_patches.sh" 2>&1 | tee "$ABS_LOG/overlay.log"
          FAIL=0
          mk() { if grep -q "$2" "$3" 2>/dev/null; then echo "OK:    $1"; else echo "FATAL: $1 — marker $2 missing in $3 (markers UNVERIFIED for this overlay branch)"; FAIL=1; fi; }
          mk "UFC short-circuit"     CMK9_UFC_SHORT_CIRCUIT        drivers/cpufreq/exynos-ufc.c
          mk "mem_rw SUS_MAP guard"  CMK9_MEM_RW_SUS_MAP_GUARD     fs/proc/base.c
          mk "board DTS tuning"      CMK9_DTS_BOARD_TUNING         arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts
          mk "sugov rate limit"      CMK9_SUGOV_RATE_LIMIT         kernel/sched/cpufreq_schedutil.c
          mk "sugov kthread prio"    CMK9_SUGOV_KTHREAD_PRIORITY   kernel/sched/cpufreq_schedutil.c
          mk "sugov_init rate limit" CMK9_SUGOV_INIT_RATE_LIMIT    kernel/sched/cpufreq_schedutil.c
          if grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c; then echo "OK:    fair.c min_granularity"; else echo "FATAL: fair.c min_granularity"; FAIL=1; fi
          if grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c; then echo "OK:    fair.c migration_cost"; else echo "FATAL: fair.c migration_cost"; FAIL=1; fi
          if grep -q 'Allow internal boot ROM / SPI interface to become ready' drivers/mfd/madera-core.c; then echo "OK:    madera-core settle delay"; else echo "FATAL: madera-core settle delay"; FAIL=1; fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: overlay markers present"

      - name: Optional overlay — Chimera LITE overlay script and marker verification (profile lite)
        if: ${{ env.OVERLAY_PROFILE_EFFECTIVE == 'lite' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          bash "$OVERLAY_DIR/patches/apply_chimera_overlay_lite.sh" 2>&1 | tee "$ABS_LOG/overlay.log"
          FAIL=0
          mk() { if grep -q "$2" "$3" 2>/dev/null; then echo "OK:    $1"; else echo "FATAL: $1 — marker $2 missing in $3 (markers UNVERIFIED for this overlay branch)"; FAIL=1; fi; }
          mk "UFC short-circuit"      CMK9_UFC_SHORT_CIRCUIT        drivers/cpufreq/exynos-ufc.c
          mk "mem_rw SUS_MAP guard"   CMK9_MEM_RW_SUS_MAP_GUARD     fs/proc/base.c
          mk "sugov rate limit"       CMK9_SUGOV_RATE_LIMIT         kernel/sched/cpufreq_schedutil.c
          mk "sugov kthread prio"     CMK9_SUGOV_KTHREAD_PRIORITY   kernel/sched/cpufreq_schedutil.c
          mk "sugov_init rate limit"  CMK9_SUGOV_INIT_RATE_LIMIT    kernel/sched/cpufreq_schedutil.c
          if grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c; then echo "OK:    fair.c min_granularity"; else echo "FATAL: fair.c min_granularity"; FAIL=1; fi
          if grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c; then echo "OK:    fair.c migration_cost"; else echo "FATAL: fair.c migration_cost"; FAIL=1; fi
          if grep -q 'CMK9_DTS_BOARD_TUNING' arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts 2>/dev/null; then
            echo "FATAL: DTS board tuning present in lite profile"; FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: lite overlay markers present (5 mk + 2 fair.c), no DTS tuning"

      # ── 7b. xxKSU freeze guard (r4): fail closed if any CI patch touched KSU ──
      - name: KSU freeze guard — xxKSU must be unchanged after all CI-time patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          source "$CI_LIB"
          NOW="$(ksu_fingerprint "$KSU_DIR")"
          if [[ "$NOW" != "$KSU_FP_BASE" ]]; then
            {
              echo "FATAL: xxKSU state changed after CI-time patches (policy: $KSU_POLICY)."
              echo "  baseline: $KSU_FP_BASE"
              echo "  now:      $NOW"
              echo "  KSU dir:  $KSU_DIR"
              echo "--- git status under KSU dir ---"
              git status --short --ignore-submodules=none -- "$KSU_DIR" || true
              echo "--- submodule status ---"
              git submodule status --recursive || true
              echo "Suspect: overlay patch script, merge_ksu_fragment, or a CI-time patch touching KernelSU/xxKSU paths."
            } >&2
            exit 1
          fi
          echo "PASS: xxKSU unchanged vs pinned gavdoc38 tree (fingerprint $NOW)"

      # ── 8. Kconfig ─────────────────────────────────────────────────────────
      - name: Configure kernel (defconfig + optional fragments; no KSU/SUSFS forcing)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          source "$CI_LIB"
          chimera_toolchain_args

          FRAGS=()
          if [[ -n "${KSU_FRAGMENT_USED:-}" ]]; then
            cp "$OVERLAY_DIR/$KSU_FRAGMENT_USED" "/tmp/ksu-fragment.cfg"
            if grep -qE '^CONFIG_KSU_NON_KPROBE' /tmp/ksu-fragment.cfg; then echo "FATAL: invalid symbol CONFIG_KSU_NON_KPROBE in $KSU_FRAGMENT_USED" >&2; exit 1; fi
            FRAGS+=(/tmp/ksu-fragment.cfg)
          fi
          if [[ "$APPLY_OVERLAY" == "true" ]]; then
            cp "$OVERLAY_DIR/chimera-device-specific.cfg" /tmp/chimera-device-specific.cfg
            FRAGS+=(/tmp/chimera-device-specific.cfg)
          fi
          # Fragment cleanup (CI-time, temp copies only). Symbols below were verified absent/hidden on the
          # xthorfinnx base used by the Mk9r2 workflow; on this branch it is UNVERIFIED but harmless if absent.
          # KSU-specific symbols (SPOOF_SELINUX, KPROBES_HOOK) are intentionally NOT touched here.
          DROP_SYMS=(
            CONFIG_UH_RKP CONFIG_RKP_KDP CONFIG_SEC_RESTRICT_SETUID CONFIG_FIVE CONFIG_DEFEX CONFIG_SECURITY_DEFEX
            CONFIG_DEFAULT_NET_SCH CONFIG_DEFAULT_FQ_CODEL CONFIG_CRC32_ARMV8_CRC CONFIG_MFD_CS47L92_GPIO
          )
          : > "$ABS_LOG/fragment-cleanup.txt"
          for fr in "${FRAGS[@]}"; do
            for sym in "${DROP_SYMS[@]}"; do
              if grep -qE "^(# )?${sym}(=.*| is not set)?\$" "$fr"; then
                grep -nE "^(# )?${sym}(=.*| is not set)?\$" "$fr" | sed "s|^|$(basename "$fr"): removed |" | tee -a "$ABS_LOG/fragment-cleanup.txt"
                sed -i -E "/^(# )?${sym}(=.*| is not set)?\$/d" "$fr"
              fi
            done
          done
          [[ -s "$ABS_LOG/fragment-cleanup.txt" ]] || echo "fragment cleanup: nothing to remove (or no fragments merged)" | tee "$ABS_LOG/fragment-cleanup.txt"

          # BBR + fq_codel (+fq) in every profile, merged last. Only symbols VERIFIED to exist in this tree are used (no DEFAULT_NET_SCH /
          # DEFAULT_FQ_CODEL here: the default qdisc is runtime-only). DEFAULT_TCP_CONG="bbr" follows from DEFAULT_BBR and is hard-checked below.
          if [[ "$IN_NET_BBR_FQ_CODEL" == "true" ]]; then
            cat > /tmp/chimera-net.cfg <<'NETEOF'
          CONFIG_NET_SCHED=y
          CONFIG_NET_SCH_FQ=y
          CONFIG_NET_SCH_FQ_CODEL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_CUBIC=y
          CONFIG_TCP_CONG_BBR=y
          # CONFIG_DEFAULT_RENO is not set
          # CONFIG_DEFAULT_CUBIC is not set
          CONFIG_DEFAULT_BBR=y
          NETEOF
            FRAGS+=(/tmp/chimera-net.cfg)
          fi

          chimera_make "$(basename "$DEFCONFIG")" | tee "$ABS_LOG/defconfig-base.log"
          if [[ "${#FRAGS[@]}" -gt 0 ]]; then
            scripts/kconfig/merge_config.sh -m -O "$ABS_OUT" "$ABS_OUT/.config" "${FRAGS[@]}" | tee "$ABS_LOG/merge-config.log"
          else
            echo "no fragments to merge (boot-first, merge_ksu_fragment=false)" | tee "$ABS_LOG/merge-config.log"
          fi
          chimera_make olddefconfig | tee -a "$ABS_LOG/merge-config.log"

          CFG="$ABS_OUT/.config"
          grep -q '^CONFIG_KSU=y$' "$CFG" || { echo "FATAL: CONFIG_KSU=y not set in final .config — the branch defconfig does not enable KSU (and this workflow does not force it). Try merge_ksu_fragment=true. (UNVERIFIED symbol/defconfig)" >&2; exit 1; }

          # Fragment symbols that Kconfig silently dropped.
          : > "$ABS_LOG/fragment-dropped-symbols.txt"
          for fr in "${FRAGS[@]}"; do
            while read -r sym; do
              if ! grep -qE "^${sym}=|^# ${sym} is not set" "$CFG"; then
                echo "$sym (from $(basename "$fr"))" | tee -a "$ABS_LOG/fragment-dropped-symbols.txt"
                echo "::warning::fragment symbol $sym is not defined in this tree (dropped by Kconfig)"
              fi
            done < <(grep -oE '^(# )?CONFIG_[A-Za-z0-9_]+' "$fr" | sed 's/^# //' | sort -u)
          done

          cp "$CFG" "$ABS_LOG/final.config"
          FINAL_CONFIG_HASH="$(sha256sum "$CFG" | cut -d' ' -f1)"
          echo "FINAL_CONFIG_HASH=$FINAL_CONFIG_HASH" >> "$GITHUB_ENV"
          echo "final .config sha256: $FINAL_CONFIG_HASH"

      - name: Config guard (required symbols; Samsung security symbols)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          CFG="$ABS_OUT/.config"
          # Required-symbol sets (appended conditionally below):
          #   BASE     — always: KSU + SUSFS sus_path, SoC/DTS/SELinux/task_struct prerequisites. (names UNVERIFIED for xxksu3)
          #   SECURITY — any active overlay: stack-protector REGULAR and SUSFS sus_kstat.
          #   LITE     — lite | full: SUS_MAP, schedutil, Exynos UFC.
          #   FULL     — full only: HZ_300, BBR/FQ/FQ_CoDel, Madera/CS47L92.
          REQUIRED_BASE=(CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_THREAD_INFO_IN_TASK CONFIG_SECURITY_SELINUX CONFIG_SOC_EXYNOS9810 CONFIG_DTS_9810_STAR2)
          REQUIRED_SECURITY=(CONFIG_CC_STACKPROTECTOR CONFIG_CC_STACKPROTECTOR_REGULAR CONFIG_KSU_SUSFS_SUS_KSTAT)
          REQUIRED_LITE=(CONFIG_KSU_SUSFS_SUS_MAP CONFIG_CPU_FREQ_GOV_SCHEDUTIL CONFIG_ARM_EXYNOS_UFC)
          REQUIRED_FULL=(CONFIG_HZ_300 CONFIG_TCP_CONG_ADVANCED CONFIG_TCP_CONG_BBR CONFIG_TCP_CONG_CUBIC CONFIG_DEFAULT_BBR CONFIG_NET_SCHED CONFIG_NET_SCH_FQ CONFIG_NET_SCH_FQ_CODEL CONFIG_MFD_MADERA CONFIG_MFD_MADERA_SPI CONFIG_MFD_CS47L92 CONFIG_PINCTRL_MADERA CONFIG_GPIO_MADERA)
          FORBIDDEN=(CONFIG_RKP_KDP CONFIG_UH_RKP CONFIG_TIMA CONFIG_TIMA_LKMAUTH CONFIG_FIVE CONFIG_SEC_RESTRICT_ROOTING CONFIG_SEC_RESTRICT_SETUID CONFIG_SECURITY_DEFEX CONFIG_KNOX_KAP)
          REQUIRED_NET=(CONFIG_NET_SCHED CONFIG_NET_SCH_FQ CONFIG_NET_SCH_FQ_CODEL CONFIG_TCP_CONG_ADVANCED CONFIG_TCP_CONG_CUBIC CONFIG_TCP_CONG_BBR CONFIG_DEFAULT_BBR)
          REQUIRED=("${REQUIRED_BASE[@]}")
          SETS="BASE"
          case "$OVERLAY_PROFILE_EFFECTIVE" in
            off) ;;
            lite)          REQUIRED+=("${REQUIRED_SECURITY[@]}" "${REQUIRED_LITE[@]}"); SETS+="+SECURITY+LITE" ;;
            full)          REQUIRED+=("${REQUIRED_SECURITY[@]}" "${REQUIRED_LITE[@]}" "${REQUIRED_FULL[@]}"); SETS+="+SECURITY+LITE+FULL" ;;
            *) echo "FATAL: unexpected OVERLAY_PROFILE_EFFECTIVE '$OVERLAY_PROFILE_EFFECTIVE'" >&2; exit 1 ;;
          esac
          if [[ "$IN_NET_BBR_FQ_CODEL" == "true" ]]; then REQUIRED+=("${REQUIRED_NET[@]}"); SETS+="+NET"; fi
          FAIL=0
          : > "$ABS_LOG/config-guard.log"
          echo "guard symbol sets: $SETS (overlay profile: $OVERLAY_PROFILE_EFFECTIVE)" | tee -a "$ABS_LOG/config-guard.log"
          for s in "${REQUIRED[@]}"; do
            if grep -qE "^${s}=y$" "$CFG"; then echo "OK: $s=y" | tee -a "$ABS_LOG/config-guard.log"
            else echo "FATAL: $s not enabled" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1; fi
          done
          if [[ "$IN_NET_BBR_FQ_CODEL" == "true" ]]; then
            for kv in 'CONFIG_DEFAULT_TCP_CONG="bbr"'; do
              if grep -qxF "$kv" "$CFG"; then echo "OK: $kv" | tee -a "$ABS_LOG/config-guard.log"
              else echo "FATAL: $kv not in final .config" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1; fi
            done
          fi
          if [[ "$APPLY_OVERLAY" == "true" ]]; then
            for s in CONFIG_CC_STACKPROTECTOR_NONE CONFIG_CC_STACKPROTECTOR_STRONG; do
              if grep -qE "^${s}=y$" "$CFG"; then echo "FATAL: $s=y (overlay requires CC_STACKPROTECTOR_REGULAR)" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1; fi
            done
          fi
          for s in "${FORBIDDEN[@]}"; do
            if grep -qE "^${s}=y$" "$CFG"; then
              if [[ "$APPLY_OVERLAY" == "true" ]]; then echo "FATAL: $s=y (active overlay requires off)" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1
              else echo "INFO: $s=y (boot-first: left as base has it)" | tee -a "$ABS_LOG/config-guard.log"; fi
            else echo "OK: $s not =y" | tee -a "$ABS_LOG/config-guard.log"; fi
          done
          # Hook-mode visibility (variant-specific symbols UNVERIFIED)
          grep -E '^(CONFIG_KSU|CONFIG_SECURITY|CONFIG_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_LOCALVERSION|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_DEBUG_INFO_BTF|CONFIG_HZ_)' "$CFG" > "$ABS_LOG/config-summary.txt" || true
          if grep -qE '^CONFIG_KSU_KPROBES_HOOK=y$' "$CFG" && grep -qE '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG"; then
            echo "FATAL: manual and kprobes hooks both enabled" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1

      - name: Config-only scope — stop notice
        if: ${{ inputs.build_scope == 'config-only' }}
        run: echo "::notice::build_scope=config-only — config and .config validated only; no compile, link, packaging, boot or KSU/SUSFS runtime validation was performed."

      # ── 9. Build (build_scope=full only) ───────────────────────────────────
      - name: Build kernel Image, Image.gz, vmlinux and DTBs
        if: ${{ inputs.build_scope == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          source "$CI_LIB"
          chimera_toolchain_args
          echo "BUILD_KCFLAGS=$BUILD_KCFLAGS" >> "$GITHUB_ENV"
          {
            echo "Toolchain: $TOOLCHAIN"
            echo "Compiler: $COMPILER_VERSION"
            echo "Linker: $LINKER_VERSION"
            echo "KCFLAGS: $BUILD_KCFLAGS"
            echo "KBUILD_LDFLAGS: (not passed)"
            printf 'make arg: %s\n' "${TOOLCHAIN_ARGS[@]}"
          } | tee "$ABS_LOG/build-flags.txt"
          chimera_make -j"$(nproc)" "KCFLAGS=$BUILD_KCFLAGS" Image Image.gz vmlinux dtbs 2>&1 | tee "$ABS_LOG/build.log"

      - name: Verify compiler identity, kernel release, hook symbols and DTB
        if: ${{ inputs.build_scope == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          VMLINUX="$ABS_OUT/vmlinux"
          [[ -s "$ABS_OUT/arch/arm64/boot/Image" ]] || { echo "FATAL: Image missing/empty" >&2; exit 1; }
          [[ -s "$ABS_OUT/arch/arm64/boot/Image.gz" ]] || { echo "FATAL: Image.gz missing/empty" >&2; exit 1; }
          [[ -s "$VMLINUX" ]] || { echo "FATAL: vmlinux missing/empty" >&2; exit 1; }
          if [[ ! -s "$ABS_OUT/arch/arm64/boot/$STAR2_DTB_REL" ]]; then
            echo "FATAL: star2lte DTB missing: arch/arm64/boot/$STAR2_DTB_REL (UNVERIFIED path). DTBs produced:" >&2
            find "$ABS_OUT/arch/arm64/boot/dts" -name '*.dtb' 2>/dev/null | sort >&2 || true
            exit 1
          fi

          REL="$(cat "$ABS_OUT/include/config/kernel.release")"
          echo "KERNEL_RELEASE_ACTUAL=$REL" >> "$GITHUB_ENV"
          echo "expected: $KERNEL_RELEASE_EXPECTED  actual: $REL"
          [[ "$REL" == "$KERNEL_VERSION"* ]] || { echo "FATAL: release '$REL' does not start with $KERNEL_VERSION" >&2; exit 1; }
          [[ "$REL" == "$KERNEL_RELEASE_EXPECTED" ]] || echo "::warning::kernel.release '$REL' != expected '$KERNEL_RELEASE_EXPECTED'"

          readelf -p .comment "$VMLINUX" > "$ABS_LOG/vmlinux-comment.txt" 2>&1 || true
          cat "$ABS_LOG/vmlinux-comment.txt"
          if grep -qE '\S' "$ABS_LOG/vmlinux-comment.txt" && ! grep -qi 'no section\|not found' "$ABS_LOG/vmlinux-comment.txt"; then
            if [[ "$TOOLCHAIN" == "gcc" ]]; then
              grep -q 'GCC:' "$ABS_LOG/vmlinux-comment.txt" || { echo "FATAL: GCC selected but vmlinux .comment has no GCC entry" >&2; exit 1; }
            else
              grep -qi 'clang' "$ABS_LOG/vmlinux-comment.txt" || { echo "FATAL: LLVM selected but vmlinux .comment has no clang entry" >&2; exit 1; }
            fi
            echo "OK: compiler identity matches selection"
          else
            echo "::warning::.comment section unavailable — compiler identity not proven from vmlinux"
          fi

          "$TC_NM" "$VMLINUX" > "$ABS_LOG/vmlinux-symbols.log" 2>&1 || true
          FAIL=0
          # Hard: generic presence (xxksu3 symbol names UNVERIFIED, so named hooks below are warnings only).
          KSU_N="$(grep -cE '^[0-9a-fA-F]+ [A-Za-z] ksu_' "$ABS_LOG/vmlinux-symbols.log" || true)"
          SUSFS_N="$(grep -cE '^[0-9a-fA-F]+ [A-Za-z] susfs_' "$ABS_LOG/vmlinux-symbols.log" || true)"
          echo "ksu_* symbols: $KSU_N   susfs_* symbols: $SUSFS_N"
          [[ "${KSU_N:-0}" -gt 0 ]] || { echo "FATAL: no ksu_* symbols linked into vmlinux"; FAIL=1; }
          if grep -q '^CONFIG_KSU_SUSFS=y$' "$ABS_OUT/.config"; then
            [[ "${SUSFS_N:-0}" -gt 0 ]] || { echo "FATAL: CONFIG_KSU_SUSFS=y but no susfs_* symbols in vmlinux"; FAIL=1; }
          fi
          SOFT=(ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_read ksu_handle_vfs_read ksu_handle_input_handle_event ksu_handle_sys_reboot susfs_is_inode_sus_path ksu_handle_setresuid ksu_lsm_hook_init ksu_task_fix_setuid)
          for s in "${SOFT[@]}"; do
            if grep -qE "^[0-9a-fA-F]+ [A-Za-z] ${s}(\.[A-Za-z0-9._]+)?$" "$ABS_LOG/vmlinux-symbols.log"; then echo "OK: $s"; else echo "::warning::symbol $s not found (may be inlined/static/renamed in xxksu; confirm on device)"; fi
          done
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: symbol/identity checks"

      - name: KSU freeze — post-build drift check (warning only)
        if: ${{ inputs.build_scope == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # shellcheck source=/dev/null
          source "$CI_LIB"
          NOW="$(ksu_fingerprint "$KSU_DIR")"
          if [[ "$NOW" == "$KSU_FP_BASE" ]]; then
            echo "OK: xxKSU unchanged after build (fingerprint $NOW)"
          else
            echo "::warning::KSU directory/submodule state differs after the build (the build may emit generated files). Inspect logs/ksu-postbuild.txt; the pre-build freeze guard passed."
            {
              git status --short --ignore-submodules=none -- "$KSU_DIR" || true
              git submodule status --recursive || true
            } | tee "$ABS_LOG/ksu-postbuild.txt"
          fi

      - name: Collect artifacts and metadata
        if: ${{ inputs.build_scope == 'full' }}
        run: |
          set -Eeuo pipefail
          BOOT="$ABS_OUT/arch/arm64/boot"
          mkdir -p "$ART_DIR/dtb"
          cp "$BOOT/Image" "$ART_DIR/Image"
          cp "$BOOT/Image.gz" "$ART_DIR/Image.gz"
          [[ ! -f "$ABS_OUT/System.map" ]] || cp "$ABS_OUT/System.map" "$ART_DIR/System.map"
          cp "$ABS_OUT/.config" "$ART_DIR/final.config"
          ls -la "$BOOT" > "$ABS_LOG/boot-dir-listing.txt"
          find "$BOOT/dts" \( -name '*.dtb' -o -name '*.dtbo' \) 2>/dev/null | sort > "$ABS_LOG/all-dtbs.txt" || true
          DTB="$BOOT/$STAR2_DTB_REL"
          [[ -s "$DTB" ]] || { echo "FATAL: star2lte DTB missing: $DTB" >&2; exit 1; }
          cp "$DTB" "$ART_DIR/dtb/"
          echo "$DTB" | tee "$ABS_LOG/dtb-selected.txt"
          BUILD_TAG="chimera-mk10-g38-${IN_PROFILE}-${IN_TOOLCHAIN}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"
          export BUILD_TAG
          python3 - <<'PYEOF'
          import json, os, hashlib, pathlib
          art = pathlib.Path(os.environ["ART_DIR"])
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          keys = ["BUILD_TAG","GITHUB_RUN_ID","IN_PROFILE","TOOLCHAIN","APPLY_OVERLAY","GAVDOC_REPO_SLUG","GAVDOC_BRANCH",
                  "IN_GAVDOC_REF","GAVDOC_REF_RESOLVED","GAVDOC_REF_SOURCE","BASE_COMMIT","CHIMERA_REPO_SLUG","CHIMERA_BRANCH",
                  "CHIMERA_REF_RESOLVED","CHIMERA_REF_SOURCE","CHIMERA_SHA","IN_KRAZEY_UPSTREAMS","KRAZEY_FETCHED","IN_NET_BBR_FQ_CODEL",
                  "KSU_PIN_SHA","KSU_PIN_VERSION","KSU_KCONFIG_PATH","KSU_POLICY","KSU_EXPECTED","KSU_DIR","KSU_FP_BASE",
                  "IN_MERGE_KSU_FRAGMENT","KSU_FRAGMENT_USED","COMPILER_VERSION","LINKER_VERSION","TC_CACHE_KEY",
                  "TC_IDENTITY_HASH","KERNEL_VERSION","KERNEL_RELEASE_EXPECTED","KERNEL_RELEASE_ACTUAL","BUILD_KCFLAGS",
                  "FINAL_CONFIG_HASH","UNAME_PREVIEW","KBUILD_BUILD_USER","KBUILD_BUILD_HOST","KBUILD_BUILD_VERSION",
                  "KBUILD_BUILD_TIMESTAMP","FULL_LLVM_MODE","COMPILER_KIND","TC_CC","TC_LD","TC_AR","TC_NM","TC_OBJCOPY",
                  "TC_OBJDUMP","TC_STRIP","TC_READELF","RELAX_BCMDHD_WERROR","OVERLAY_PROFILE_EFFECTIVE"]
          m = {k: os.environ.get(k, "") for k in keys}
          m["integration"] = "none performed by CI: base branch is already KSU+SUSFS integrated (gavdoc38 lineage-24.0-xxksu3-susfs2); xxKSU is frozen to the pinned tree"
          m["ksu_note"] = ("xxKSU is taken unchanged from the pinned gavdoc38 tree. Per gavdoc38 release v3.3.0 notes: xxKSU v3.3.1 build 32680, driver uapi v5, "
                           "manager must be uapi v5 (backslashxx/KernelSU v3.3.1); do NOT use a uapi v6 manager. CI proves only that KSU sources/gitlinks were not "
                           "altered by CI-time patches; it does not prove the uapi version of the built driver.")
          m["compatibility"] = ("Chimera Mk10r2 compatibility here means building the Exynos 9810 Linux 4.9.x vendor kernel from "
                                "gavdoc38 lineage-24.0-xxksu3-susfs2 for potential use with a LineageOS 24 userspace. "
                                "Runtime compatibility requires physical-device testing.")
          m["disclaimer"] = ("Compile-verified only; no claim of boot, root or SUSFS proof. CI build only. "
                             "Not proof of boot, root, SUSFS, SELinux, Samsung security, "
                             "flashability, vendor-blob, camera/modem/audio/thermal/charging, recovery, "
                             "boot-image, Android runtime, or any common-kernel ABI compatibility.")
          files = {str(p.relative_to(art)): sha(p) for p in sorted(art.rglob("*")) if p.is_file() and p.name not in ("manifest.json","SHA256SUMS")}
          m["artifacts_sha256"] = files
          (art / "manifest.json").write_text(json.dumps(m, indent=2))
          (art / "SHA256SUMS").write_text("".join(f"{h}  {n}\n" for n, h in files.items()))
          print(json.dumps(m, indent=2))
          PYEOF

      # ── 10. Optional AnyKernel3 packaging (UNVERIFIED for this device) ─────
      # r4: pinned fetch, layout + busybox inventory, CRLF/exec-bit checks, qemu smoke test (diagnostic), verified ZIP.
      - name: Install AnyKernel3 diagnostics (qemu-user for busybox smoke test)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          if ! sudo apt-get install -y --no-install-recommends qemu-user-static; then
            echo "::warning::qemu-user-static could not be installed — the AK3 busybox smoke test will be skipped (diagnostic only)"
          fi

      - name: Fetch AnyKernel3 and verify layout, line endings and busybox (opt-in, UNVERIFIED packaging)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        run: |
          set -Eeuo pipefail
          AK="$GITHUB_WORKSPACE/$ANYKERNEL_DIR"
          rm -rf "$AK"
          git init -q "$AK"
          git -C "$AK" remote add origin "$ANYKERNEL_REPO"
          if [[ -n "$IN_ANYKERNEL_REF" ]]; then
            git -C "$AK" fetch --no-tags --depth=1 origin "$IN_ANYKERNEL_REF"
          else
            echo "::warning::anykernel_ref empty — fetching AnyKernel3 HEAD (not reproducible)"
            git -C "$AK" fetch --no-tags --depth=1 origin HEAD
          fi
          git -C "$AK" checkout -q --detach FETCH_HEAD
          AK3_SHA="$(git -C "$AK" rev-parse HEAD)"
          if [[ -n "$IN_ANYKERNEL_REF" && "$AK3_SHA" != "$IN_ANYKERNEL_REF" ]]; then
            echo "FATAL: fetched AnyKernel3 commit $AK3_SHA != requested $IN_ANYKERNEL_REF" >&2; exit 1
          fi
          echo "AK3_SHA=$AK3_SHA" >> "$GITHUB_ENV"
          echo "$AK3_SHA" | tee "$ABS_LOG/anykernel3-commit.txt"
          rm -rf "$AK/.git" "$AK/.github"

          # Layout (file names are UNVERIFIED expectations for the AnyKernel3 revision in use; fail closed with a listing).
          REQ=(META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script tools/ak3-core.sh)
          MISSING=()
          for f in "${REQ[@]}"; do [[ -f "$AK/$f" ]] || MISSING+=("$f"); done
          if [[ "${#MISSING[@]}" -ne 0 ]]; then
            echo "FATAL: AnyKernel3 $AK3_SHA is missing: ${MISSING[*]}" >&2
            ( cd "$AK" && find . -maxdepth 3 -not -path './.git*' | sort ) >&2
            exit 1
          fi

          # CRLF in shell scripts breaks sh/busybox on device (shebang and applet names get a trailing CR).
          CRLF=()
          for f in META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script tools/ak3-core.sh; do
            if grep -q $'\r' "$AK/$f"; then CRLF+=("$f"); fi
          done
          [[ "${#CRLF[@]}" -eq 0 ]] || { echo "FATAL: CRLF line endings in: ${CRLF[*]}" >&2; exit 1; }

          # Executable bits (the ZIP carries Unix modes; recoveries that ignore them rely on AK3 chmod, but never ship non-exec tools).
          chmod 755 "$AK/META-INF/com/google/android/update-binary"
          find "$AK/tools" -type f -exec chmod 755 {} +

          # Busybox inventory. Root cause of recovery busybox errors is UNVERIFIED; this records what CI can see.
          : > "$ABS_LOG/ak3-busybox.txt"
          mapfile -t BBS < <(cd "$AK" && find tools -maxdepth 2 -type f -iname 'busybox*' | sort)
          if [[ "${#BBS[@]}" -eq 0 ]]; then
            echo "::warning::no tools/busybox* found in AnyKernel3 $AK3_SHA — recoveries will use their own busybox/toybox (a likely source of applet errors)" | tee -a "$ABS_LOG/ak3-busybox.txt"
          fi
          AK3_BUSYBOX_LIST=""
          for rel in "${BBS[@]}"; do
            bb="$AK/$rel"
            sha="$(sha256sum "$bb" | cut -d' ' -f1)"
            {
              echo "== $rel"
              echo "sha256: $sha"
            } | tee -a "$ABS_LOG/ak3-busybox.txt"
            if ! readelf -h "$bb" >/dev/null 2>&1; then
              echo "::warning::$rel is not an ELF file" | tee -a "$ABS_LOG/ak3-busybox.txt"
              continue
            fi
            CLASS="$(readelf -h "$bb" | awk -F: '/Class:/{gsub(/^[ \t]+/,"",$2);print $2}')"
            MACH="$(readelf -h "$bb" | awk -F: '/Machine:/{gsub(/^[ \t]+/,"",$2);print $2}')"
            INTERP="$(readelf -l "$bb" 2>/dev/null | grep -i 'requesting program interpreter' || true)"
            if [[ -n "$INTERP" ]]; then LINK="dynamic"; else LINK="static"; fi
            {
              echo "class: $CLASS   machine: $MACH   linking: $LINK"
              [[ -z "$INTERP" ]] || echo "interpreter: $INTERP"
            } | tee -a "$ABS_LOG/ak3-busybox.txt"
            if [[ "$LINK" == "dynamic" ]]; then
              echo "::warning::$rel is dynamically linked — it needs the recovery's loader/libs and can fail with 'not found' or exec errors in minimal recoveries"
            fi
            AK3_BUSYBOX_LIST+="${rel}:${sha}:${MACH}:${LINK};"

            # Diagnostic-only smoke test under qemu-user (never fails the build; does not reproduce recovery SELinux/noexec/loader conditions).
            case "$MACH" in
              AArch64) Q=qemu-aarch64-static ;;
              ARM)     Q=qemu-arm-static ;;
              *)       Q="" ;;
            esac
            if [[ -n "$Q" ]] && command -v "$Q" >/dev/null 2>&1; then
              mkdir -p /tmp/ak3-bbdir && cp "$bb" /tmp/ak3-bbdir/busybox && chmod +x /tmp/ak3-bbdir/busybox   # applet is chosen from the file NAME
              if "$Q" /tmp/ak3-bbdir/busybox --list > /tmp/ak3-bb-applets.txt 2> "$ABS_LOG/ak3-busybox-qemu.err"; then
                echo "qemu smoke: --list OK ($(wc -l < /tmp/ak3-bb-applets.txt) applets)" | tee -a "$ABS_LOG/ak3-busybox.txt"
                cp /tmp/ak3-bb-applets.txt "$ABS_LOG/ak3-busybox-applets.txt"
                # Applet list is a judgment call, UNVERIFIED against what this AK3 revision actually calls.
                for a in sh ash cat chmod cp cut dd find grep ls mkdir mv readlink rm sed tr; do
                  grep -qx "$a" /tmp/ak3-bb-applets.txt || echo "::warning::busybox applet '$a' missing in $rel (UNVERIFIED need)" | tee -a "$ABS_LOG/ak3-busybox.txt"
                done
                if "$Q" /tmp/ak3-bbdir/busybox sh -c 'echo bb-sh-ok' 2>>"$ABS_LOG/ak3-busybox-qemu.err" | grep -qx 'bb-sh-ok'; then
                  echo "qemu smoke: sh -c OK" | tee -a "$ABS_LOG/ak3-busybox.txt"
                else
                  echo "::warning::qemu smoke: '$rel sh -c' failed (see logs/ak3-busybox-qemu.err)" | tee -a "$ABS_LOG/ak3-busybox.txt"
                fi
              else
                echo "::warning::qemu smoke: '$rel --list' failed (see logs/ak3-busybox-qemu.err) — inconclusive for recoveries" | tee -a "$ABS_LOG/ak3-busybox.txt"
              fi
            else
              echo "qemu smoke skipped (machine '$MACH', qemu '${Q:-n/a}')" | tee -a "$ABS_LOG/ak3-busybox.txt"
            fi
          done
          echo "AK3_BUSYBOX_LIST=$AK3_BUSYBOX_LIST" >> "$GITHUB_ENV"

      - name: Package AnyKernel3 ZIP and verify it (opt-in, UNVERIFIED packaging)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        run: |
          set -Eeuo pipefail
          AK="$GITHUB_WORKSPACE/$ANYKERNEL_DIR"
          # Raw concatenation of DTBs — format UNVERIFIED — REQUIRES CONFIRMATION
          cat "$ART_DIR"/dtb/*.dtb > "$ART_DIR/dtb.img"
          [[ -s "$ART_DIR/dtb.img" ]] || { echo "FATAL: dtb.img empty" >&2; exit 1; }
          cp "$ART_DIR/Image" "$AK/Image"
          cp "$ART_DIR/dtb.img" "$AK/dtb"

          # kernel.string: conservative character set (no '#', '|', quotes, backslashes) so AK3's property parsing and ui_print stay safe.
          KSTR_RAW="${UNAME_PREVIEW} / ${TOOLCHAIN} / cfg ${FINAL_CONFIG_HASH:0:12} / base ${BASE_COMMIT:0:8}"
          KSTR="$(printf '%s' "$KSTR_RAW" | tr -cd 'A-Za-z0-9 ._+@:()/-')"
          [[ -n "$KSTR" ]] || { echo "FATAL: kernel.string is empty after sanitising" >&2; exit 1; }
          export AK KSTR

          # Quoted template: nothing in here is expanded by the shell. @KERNEL_STRING@ is replaced below.
          cat > "$AK/anykernel.sh" <<'AK3SH'
          ### AnyKernel3 script — Chimera Mk10r2 g38-xxksu3 (packaging UNVERIFIED for this device)
          properties() { '
          kernel.string=@KERNEL_STRING@
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star2lte
          device.name2=star2ltexx
          device.name3=SM-G965F
          device.name4=SM-G965U
          device.name5=SM-G965N
          '; }
          # supported.versions intentionally omitted (LOS24 Android version UNVERIFIED).
          BLOCK=/dev/block/by-name/BOOT
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          # xxKSU in this kernel is uapi v5 (gavdoc38 v3.3.0 notes): use the uapi v5 manager (backslashxx/KernelSU v3.3.1), NOT a uapi v6 manager.
          command -v ui_print >/dev/null 2>&1 && ui_print "xxKSU uapi v5: use manager v3.3.1 (uapi v5), NOT a uapi v6 manager" || true

          dump_boot
          write_boot
          AK3SH
          python3 - <<'PYEOF'
          import os, pathlib
          p = pathlib.Path(os.environ["AK"]) / "anykernel.sh"
          s = p.read_text().replace("@KERNEL_STRING@", os.environ["KSTR"])
          if "@KERNEL_STRING@" in s or "\r" in s:
              raise SystemExit("FATAL: anykernel.sh template substitution failed")
          p.write_text(s)
          PYEOF
          chmod 755 "$AK/anykernel.sh"
          # Syntax check with a POSIX sh (dash): catches quoting/parse errors that would surface as errors under busybox ash.
          sh -n "$AK/anykernel.sh" || { echo "FATAL: generated anykernel.sh has a shell syntax error" >&2; exit 1; }
          sed -n '1,40p' "$AK/anykernel.sh" > "$ABS_LOG/ak3-anykernel.sh.txt"

          ZIP="$ART_DIR/${BUILD_TAG}-AnyKernel3-UNVERIFIED.zip"
          ( cd "$AK" && zip -r9 -X "$ZIP" . )
          [[ -s "$ZIP" ]] || { echo "FATAL: zip empty" >&2; exit 1; }

          # Verify the ZIP itself.
          unzip -tq "$ZIP"
          unzip -Z "$ZIP" > "$ABS_LOG/ak3-zip-listing.txt"
          LIST="$(unzip -Z1 "$ZIP")"
          for f in META-INF/com/google/android/update-binary META-INF/com/google/android/updater-script tools/ak3-core.sh anykernel.sh Image dtb; do
            grep -qxF "$f" <<<"$LIST" || { echo "FATAL: ZIP lacks entry '$f'" >&2; exit 1; }
          done
          IFS=';' read -r -a ITEMS <<< "${AK3_BUSYBOX_LIST:-}"
          for it in "${ITEMS[@]}"; do
            [[ -n "$it" ]] || continue
            rel="${it%%:*}"; rest="${it#*:}"; want="${rest%%:*}"
            grep -qxF "$rel" <<<"$LIST" || { echo "FATAL: ZIP lacks busybox entry '$rel'" >&2; exit 1; }
            got="$(unzip -p "$ZIP" "$rel" | sha256sum | cut -d' ' -f1)"
            [[ "$got" == "$want" ]] || { echo "FATAL: busybox '$rel' in ZIP ($got) != source ($want)" >&2; exit 1; }
            MODE="$(unzip -Z "$ZIP" "$rel")"
            [[ "$MODE" =~ ^-r.x ]] || { echo "FATAL: busybox '$rel' is not executable inside the ZIP: $MODE" >&2; exit 1; }
            echo "OK: ZIP busybox $rel sha256 matches source and is executable"
          done
          MODE="$(unzip -Z "$ZIP" META-INF/com/google/android/update-binary)"
          [[ "$MODE" =~ ^-r.x ]] || echo "::warning::update-binary mode in ZIP is not executable: $MODE (recoveries normally exec it via their own mechanism; informational)"
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          ( cd "$ART_DIR" && sha256sum dtb.img "$(basename "$ZIP")" >> SHA256SUMS )

          # Record AK3 details in manifest.json (manifest is not part of SHA256SUMS by design).
          export ZIP
          python3 - <<'PYEOF'
          import json, os, pathlib
          mp = pathlib.Path(os.environ["ART_DIR"]) / "manifest.json"
          m = json.loads(mp.read_text())
          m["anykernel"] = {
              "repo": os.environ.get("ANYKERNEL_REPO", ""),
              "requested_ref": os.environ.get("IN_ANYKERNEL_REF", "") or "HEAD (unpinned)",
              "resolved_sha": os.environ.get("AK3_SHA", ""),
              "busybox": [x for x in os.environ.get("AK3_BUSYBOX_LIST", "").split(";") if x],
              "zip": os.path.basename(os.environ.get("ZIP", "")),
              "status": "UNVERIFIED packaging for star2lte; CI checks are diagnostics only (see logs/ak3-*.txt)",
          }
          mp.write_text(json.dumps(m, indent=2))
          print(json.dumps(m["anykernel"], indent=2))
          PYEOF

      # ── 11. Uploads / release / diagnostics ────────────────────────────────
      # actions/upload-artifact@v7 with archive: false uploads ONE file, UNZIPPED; the artifact name is the file name.
      - name: Upload Image
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Image
          archive: false
          if-no-files-found: error

      - name: Upload Image.gz
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Image.gz
          archive: false
          if-no-files-found: error

      - name: Upload final.config
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/final.config
          archive: false
          if-no-files-found: error

      - name: Upload star2lte DTB
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/dtb/exynos9810-star2lte_eur_open_26.dtb
          archive: false
          if-no-files-found: error

      - name: Upload System.map
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/System.map
          archive: false
          if-no-files-found: ignore

      - name: Upload manifest.json
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/manifest.json
          archive: false
          if-no-files-found: error

      - name: Upload SHA256SUMS
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/SHA256SUMS
          archive: false
          if-no-files-found: error

      - name: Upload dtb.img (opt-in packaging, UNVERIFIED)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/dtb.img
          archive: false
          if-no-files-found: error

      - name: Upload AnyKernel3 ZIP (opt-in packaging, UNVERIFIED)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error

      - name: Failure diagnostics
        if: ${{ failure() }}
        run: |
          {
            echo "## Chimera Mk10r2 (g38-xxksu3) build FAILED"
            echo '```'
            if [[ -f "${ABS_LOG:-/nonexistent}/build.log" ]]; then
              grep -nE 'error:|Error [0-9]+|undefined reference|multiple definition|No such file' "$ABS_LOG/build.log" | head -n 60 || true
              echo "--- tail ---"
              tail -n 40 "$ABS_LOG/build.log"
            else
              echo "no build.log — failure occurred before/outside the kernel build; see step logs"
            fi
            echo '```'
            echo "### diagnostics"
            echo '```'
            for f in base-commit.txt gitlinks.txt submodule-status.txt ksu-baseline.txt ksu-postbuild.txt fragment-cleanup.txt fragment-dropped-symbols.txt config-guard.log bcmdhd-werror-before.txt bcmdhd-werror-after.txt anykernel3-commit.txt ak3-busybox.txt ak3-zip-listing.txt; do
              if [[ -f "${ABS_LOG:-/nonexistent}/$f" ]]; then echo "--- $f ---"; head -n 40 "$ABS_LOG/$f"; fi
            done
            echo '```'
            if [[ -d "${ABS_KERNEL:-/nonexistent}" ]]; then
              echo "### bcmdhd / refcount diagnostics"
              echo '```'
              echo "--- bcmdhd_101_16 -Werror (build files) ---"
              grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$ABS_KERNEL/drivers/net/wireless/bcmdhd_101_16" 2>/dev/null | head -n 20 || true
              echo "--- include/linux/refcount.h 195-245 ---"
              sed -n '195,245p' "$ABS_KERNEL/include/linux/refcount.h" 2>&1 || true
              echo "--- CONFIG_REFCOUNT* ---"
              grep -n "REFCOUNT" "${ABS_OUT:-/nonexistent}/.config" 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## Chimera Mk10r2 g38-xxksu3 — ${IN_PROFILE} / ${IN_TOOLCHAIN}"
            echo "- build scope: ${IN_BUILD_SCOPE}"
            if [[ "$IN_BUILD_SCOPE" == "config-only" ]]; then
              echo "- **config-only**: final .config validated; NOTHING was compiled, linked, packaged or released. No KSU/SUSFS runtime behavior, boot or packaging was validated."
            fi
            if [[ "$IN_PROFILE" == "boot-first" ]]; then
              echo "- overlay: off — Project_Chimera checkout skipped (unless merge_ksu_fragment=true)"
              echo "- chimera_ref retained for reproducibility only: ${IN_CHIMERA_REF}"
            else
              echo "- overlay: ${OVERLAY_PROFILE_EFFECTIVE} — Project_Chimera: ${CHIMERA_SHA:-n/a} (${CHIMERA_REF_SOURCE:-n/a})"
            fi
            echo "- brand: ${BRAND:-n/a}"
            echo "- kernel base: ${GAVDOC_REPO_SLUG}@${BASE_COMMIT:-n/a} (${GAVDOC_REF_SOURCE:-n/a})"
            echo "- upstream fetch-only (never merged): ${KRAZEY_FETCHED:-none/not requested} — see logs/krazey-*.txt"
            echo "- BBR (default CC) + fq_codel/fq built in: ${IN_NET_BBR_FQ_CODEL} (default qdisc is runtime-only: net.core.default_qdisc)"
            echo "- xxKSU pin: ${KSU_PIN_SHA} / KSU_VERSION ${KSU_PIN_VERSION}"
            echo "- KSU/SUSFS: pre-integrated in base branch; no integration performed (Kconfig: ${KSU_KCONFIG_PATH:-n/a}; fragment: ${KSU_FRAGMENT_USED:-none})"
            echo "- **xxKSU policy**: ${KSU_POLICY} — fingerprint: ${KSU_FP_BASE:-n/a}"
            echo "- **xxKSU expected (from gavdoc38 v3.3.0 notes)**: ${KSU_EXPECTED}"
            if [[ "$IN_PACKAGE_ANYKERNEL" == "true" && "$IN_BUILD_SCOPE" == "full" ]]; then
              echo "- AnyKernel3: ${AK3_SHA:-n/a} (requested: ${IN_ANYKERNEL_REF:-HEAD, unpinned}); busybox: ${AK3_BUSYBOX_LIST:-none found}; packaging UNVERIFIED — see logs/ak3-*.txt"
            fi
            echo "- compiler: ${COMPILER_VERSION:-n/a}"
            echo "- kernel release: ${KERNEL_RELEASE_ACTUAL:-n/a}"
            echo
            echo "A green build proves none of: boot, root, SUSFS, SELinux, Samsung RKP/TIMA/KNOX, flashability, vendor blobs, camera, modem, audio, thermal, charging, recovery, boot-image layout, xxKSU uapi version, or ABI compatibility."
          } >> "$GITHUB_STEP_SUMMARY"

      # Build logs are many files, so they stay ONE zipped artifact (archive: false allows a single file only).
      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chimera-mk10-g38-logs-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/**
          if-no-files-found: warn

  # Separate job: the ONLY place with contents: write. Runs only when requested and the build job succeeded.
  release:
    name: Release Mk10r2 g38-xxksu3 ${{ inputs.profile }} / ${{ inputs.toolchain }}
    needs: build
    if: ${{ inputs.do_release && inputs.build_scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      # download-artifact@v8 is required for the unzipped (archive: false) artifacts uploaded by upload-artifact@v7.
      - name: Download Image
        uses: actions/download-artifact@v8
        with:
          name: Image
          path: release-assets

      - name: Download final.config
        uses: actions/download-artifact@v8
        with:
          name: final.config
          path: release-assets

      - name: Download manifest.json
        uses: actions/download-artifact@v8
        with:
          name: manifest.json
          path: release-assets

      - name: Download SHA256SUMS
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: release-assets

      - name: Verify assets against SHA256SUMS and render release body from manifest.json
        id: prep
        run: |
          set -Eeuo pipefail
          cd release-assets
          for f in Image final.config manifest.json SHA256SUMS; do
            [[ -s "$f" ]] || { echo "FATAL: missing/empty release asset $f" >&2; exit 1; }
          done
          grep -E '^[0-9a-f]{64}  (Image|final\.config)$' SHA256SUMS > /tmp/release-sums.txt || true
          [[ "$(wc -l < /tmp/release-sums.txt)" -eq 2 ]] || { echo "FATAL: SHA256SUMS lacks entries for Image/final.config" >&2; exit 1; }
          sha256sum -c /tmp/release-sums.txt
          cd ..
          python3 - <<'PYEOF'
          import json, os, re
          from pathlib import Path
          m = json.loads(Path("release-assets/manifest.json").read_text())
          tag = str(m.get("BUILD_TAG", ""))
          if not re.fullmatch(r"chimera-mk10-[A-Za-z0-9._-]+", tag):
              raise SystemExit(f"FATAL: unexpected BUILD_TAG in manifest: {tag!r}")
          def v(k):
              return str(m.get(k, "n/a")).replace("`", "'").replace("\r", " ").replace("\n", " ")
          body = (
              "CI build only — compile-verified only; NOT boot-tested. No claim of boot, root or SUSFS proof. "
              "Not proof of boot, root, SUSFS, SELinux,\n"
              "Samsung security, flashability, vendor-blob, camera/modem/audio/thermal/charging,\n"
              "recovery, boot-image, Android runtime or any ABI compatibility.\n\n"
              "Chimera Mk10r2 compatibility here means building the Exynos 9810 Linux 4.9.x vendor kernel from "
              "gavdoc38 lineage-24.0-xxksu3-susfs2 (KSU+SUSFS pre-integrated in the branch; no integration performed by CI) "
              "for potential use with a LineageOS 24 userspace. Runtime compatibility requires physical-device testing.\n\n"
              "**xxKSU:** permanently pinned (KernelSU 5c595611, KSU_VERSION 32680) and frozen (no KSU change by CI). Per the gavdoc38 v3.3.0 notes this is "
              "xxKSU v3.3.1 build 32680, driver uapi v5 — use the uapi v5 manager "
              "(https://github.com/backslashxx/KernelSU/releases/tag/v3.3.1) and do NOT use a uapi v6 manager. "
              "CI does not prove the built driver's uapi version.\n\n"
              "| Field | Value |\n|---|---|\n"
              f"| Kernel base | `{v('GAVDOC_REPO_SLUG')}@{v('BASE_COMMIT')}` (`{v('GAVDOC_REF_SOURCE')}`) |\n"
              f"| xxKSU policy / expected | `{v('KSU_POLICY')}` / `{v('KSU_EXPECTED')}` |\n"
              f"| xxKSU baseline fingerprint (KSU dir / hash) | `{v('KSU_DIR')}` / `{v('KSU_FP_BASE')}` |\n"
              f"| Chimera overlay (commit, checkout verified) | `{m.get('CHIMERA_SHA') or 'none (boot-first)'}` (`{v('CHIMERA_REF_SOURCE')}`) |\n"
              f"| Upstream fetch-only (no merge) | `{m.get('KRAZEY_FETCHED') or 'not requested'}` |\n"
              f"| BBR + fq_codel | `{v('IN_NET_BBR_FQ_CODEL')}` |\n"
              f"| xxKSU pin / KSU_VERSION | `{v('KSU_PIN_SHA')}` / `{v('KSU_PIN_VERSION')}` |\n"
              f"| KSU Kconfig / fragment | `{v('KSU_KCONFIG_PATH')}` / `{m.get('KSU_FRAGMENT_USED') or 'none'}` |\n"
              f"| Profile / overlay / overlay profile | `{v('IN_PROFILE')}` / `{v('APPLY_OVERLAY')}` / `{v('OVERLAY_PROFILE_EFFECTIVE')}` |\n"
              f"| Toolchain mode | `{v('TOOLCHAIN')}` (`{v('COMPILER_KIND')}`) |\n"
              f"| Compiler | `{v('COMPILER_VERSION')}` |\n"
              f"| Linker | `{v('LINKER_VERSION')}` |\n"
              f"| Full LLVM | `{m.get('FULL_LLVM_MODE') or '0'}` |\n"
              f"| Kernel release | `{v('KERNEL_RELEASE_ACTUAL')}` |\n"
              f"| Final config SHA-256 | `{v('FINAL_CONFIG_HASH')}` |\n"
          )
          Path("release-body.md").write_text(body)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"tag={tag}\n")
          print(body)
          PYEOF

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "Chimera Mk10r2 g38-xxksu3 — ${{ inputs.profile }} / ${{ inputs.toolchain }} (UNTESTED)"
          prerelease: true
          draft: false
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/Image
            release-assets/manifest.json
            release-assets/SHA256SUMS
            release-assets/final.config
