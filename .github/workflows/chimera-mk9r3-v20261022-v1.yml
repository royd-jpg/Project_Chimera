name: Project Chimera Mk9r3 — xthorfinnx/16-xxksu-susfs kernel build v.20261022-v1
# ─────────────────────────────────────────────────────────────────────────────
# VERSION HISTORY (append-only; earlier entries condensed)
#
# v.20261022-v1 — Mk9r3. (1) Kernel base moved to xthorfinnx/android_kernel_samsung_exynos9810 branch
#   16-xxksu-susfs. base_ref is the BRANCH NAME; base_commit is the exact pin (default 608aef8592023c47...,
#   the branch tip on 2026-10-22). (2) Pre-integrated KernelSU + SUSFS source in the base is used as-is. The base
#   carries gitlink KernelSU -> https://github.com/xthorfinnx/KernelSU.git @ 8e661a1351447dc62e5c12390e34af55048f62ba
#   (ksu_commit default) and drivers/kernelsu -> ../KernelSU/kernel. This is the xxKSU fork, NOT KernelSU-Next:
#   it has no CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_KPROBES_HOOK. (3) The old gavdoc38 integration-patch flow is
#   REMOVED (integration_base / integration_ref / integration_patch_sha256 inputs, patch generation + git apply,
#   gavdoc38 KernelSU-Next clone, pristine-base checks); replaced by a fail-closed submodule resolver + verifier.
#   (4) chimera-ksu-susfs.cfg is no longer merged (the base defconfig already enables KSU + SUSFS and the fragment
#   asserts symbols this fork does not define). Hook mode is asserted instead: source call sites in
#   exec/open/stat/reboot + KSU_LSM_SECURITY_HOOKS; TAMPER_SYSCALL_TABLE / HACK_ARM64_BRANCH_LINK / KPROBES_KSUD
#   must be off. (5) Integrated-tree checks rewritten to the real tree; backport/selinux_cred/sys_read/input checks
#   dropped (absent by design); the hooks.c selinux_cred() pass runs only if objsec.h provides selinux_cred().
#   (6) Mk9r3 branding/artifact naming. Statically verified 2026-10-22 against base 608aef85 + KernelSU 8e661a13
#   (kernelversion, defconfig, Kconfig/olddefconfig, DTS source, overlay script sections 1-8, submodule checkout);
#   NOT compiled, NOT booted.
# v.20261014-r2 — Full LLVM toolchain mode added alongside GCC. (1) Added explicit `llvm-full`
#   workflow choice; it uses the pinned LLVM 22.1.7 toolchain archive and is treated as a first-class
#   Clang/LLVM build mode rather than an experimental compiler alias. (2) Full LLVM mode explicitly
#   selects Clang, LLD, llvm-ar/nm/objcopy/objdump/readelf/strip plus LLVM=1 and LLVM_IAS=1; no
#   GCC compiler or GNU linker is selected for the kernel build. (3) Added HOSTAR/HOSTAS and READELF
#   Kbuild variables and fail-closed tool presence checks. (4) Added explicit LLVM-vs-GCC toolchain
#   identity checks and manifest/release metadata so the selected compiler family is auditable.
#   (5) Existing GCC and legacy LLVM/AOSP/Neutron toolchain choices are preserved unchanged.
# v.20261003-r1 — Hardening/refactor (no redesign). (1) Least privilege: top-level contents: read; the
#   GitHub release moved to a separate 'release' job (needs: build; the only contents: write). It downloads the
#   unzipped artifacts, verifies them against SHA256SUMS and renders the body from manifest.json.
#   (2) CHIMERA_REF is an immutable 40-hex commit (was branch lineage-23.2-ksun3-susfs2); the checkout is
#   verified against it and CHIMERA_SHA is still recorded. (3) overlay_profile 'none' renamed 'security-only'
#   (behavior unchanged: hooks.c selinux_cred + stack-protector + chimera-device-specific.cfg; no mk/grep source
#   overlays). (4) Config guard split into BASE / SECURITY / LITE / FULL symbol sets. (5) Input dry_run replaced by
#   build_scope = full | config-only (config-only compiles nothing). (6) Default toolchain is now gcc (the only
#   compile-tested option); all others are labeled experimental. (7) Release notes / manifest now say
#   "compile-verified only; no claim of boot/root/SUSFS proof".
# v.20261002-r5 — Kernel-side overlay fixes. (1) mem_rw() SUS_MAP guard now holds mm->mmap_sem (read)
#   around find_vma() + the vma->vm_file deref (was lockless: UAF/oops race with munmap) and requires
#   vma->vm_start <= addr (find_vma returns the NEXT vma for addr in a hole). (2) Removed the
#   CMK9_NAMEI_SUS_PATH_RECHECK patch: it repeated, after may_lookup(), the identical sus_path test the
#   integration patch already does at the loop top (nd->path.dentry cannot change in between).
#   namei is now VERIFY-ONLY in both overlay scripts; the namei mk check is gone (the 'none' leak check
#   is kept and now also guards against the old block reappearing).
# v.20261002-r4 — overlay_profile input (full|lite|none; default full; only effective when the
#   overlay is active). lite = patches/apply_chimera_overlay_lite.sh (UFC, mem_rw SUS_MAP, namei
#   sus_path, sugov x3, fair.c). hooks.c selinux_cred + stack-protector + chimera-device-specific.cfg
#   are applied in every active profile. FIX: stack-protector edit appended CONFIG_CC_STACKPROTECTOR=y,
#   which is a hidden def_bool in this tree; the choice defaulted to NONE (run 36988907877: final.config
#   had CC_STACKPROTECTOR_NONE=y). Now selects CC_STACKPROTECTOR_REGULAR and the config guard requires it.
# v.20261002-r3 — Branding: brand options are now "-Chimera_Mk9r2" and "-c9r2x[git7]"
#   ('-c9r2x' + first 7 hex of base_ref; default). Artifacts are uploaded as SEPARATE,
#   UNZIPPED files (actions/upload-artifact@v7, archive: false — single file per artifact,
#   artifact name = file name): Image, System.map, final.config, star2lte dtb,
#   manifest.json, SHA256SUMS, integration patch, and (opt-in) dtb.img + AnyKernel3 ZIP.
#   Build logs stay one zipped artifact (multi-file). Metadata .txt files are no longer
#   duplicated into the kernel artifacts (they remain in the logs artifact).
# v.20261002-r2 — Fragment cleanup applied at CI time to the TEMP fragment copies (repo files
#   untouched, idempotent): drops symbols verified absent/hidden in xthorfinnx/16 + pinned KSU-Next
#   (SPOOF_SELINUX, KPROBES_HOOK, UH_RKP, RKP_KDP, SEC_RESTRICT_SETUID, FIVE, DEFEX, SECURITY_DEFEX,
#   DEFAULT_NET_SCH, DEFAULT_FQ_CODEL, CRC32_ARMV8_CRC, MFD_CS47L92_GPIO). Log: fragment-cleanup.txt.
# v.20261002-r1 — Kernel base moved from gavdoc38 to xthorfinnx branch 16.
#   Base: xthorfinnx/android_kernel_samsung_exynos9810@8255de66... (Linux 4.9.337,
#   no KernelSU/SUSFS, no submodules). KSU-Next + SUSFS are re-applied at CI time:
#   (1) a patch GENERATED from two pinned gavdoc38 commits (tree diff, excluding the
#   KernelSU-Next gitlink and .gitmodules), verified by SHA-256, git-apply --check'd
#   then applied; (2) gavdoc38/KernelSU-Next cloned at the pinned ksu_commit.
#   Fail-closed on any mismatch. KSU-Next stays at the gavdoc38 pin (NOT v3.4.0).
#   Chimera overlay is chimera-full ONLY (boot-first applies none of it).
#   GCC fix: bcmdhd_101_16 Makefile -Werror (beats KCFLAGS -Wno-error) is stripped
#   with a grep that no longer swallows --include as filenames; verified on GCC 13.3.
#   Added: kprobe-symbol exclusivity check, exact star2lte DTB path, patch/ksu
#   pins in manifest. Removed input: force_repatch (unused by the overlay script).
# v.20260928-r3 — GCC 13 vs bcmdhd_101_16 (run #238): -Wno-error=unused-function,
#   relax_bcmdhd_werror input, refcount diagnostics.
# v.20260928-r2 — Boot-first restructure; shared toolchain library; injection-safe
#   inputs; SUBLEVEL enforcement; compiler identity from vmlinux .comment.
#   Packaging is opt-in and UNVERIFIED. No claim of boot/root/SUSFS proof.
# v.20260928 — GCC cross-toolchain option added.
# v.20260927 — aosp23 toolchain option (URL/layout/hash unverified).
# v.20260921 — weebx toolchain (SHA-256 pinned); -cm9x[git7] brand.
# v.20260914 — KSU-Next manual-hook call-site audit; vmlinux symbol guard;
#   proton removed; zyc_stable cache key hashes resolved URL.
# v.20260902 — DTB packaging path, toolchain-before-Kconfig, ccache wiring.
# v.20260822b — AnyKernel identity parity.
# v.20260822a — AArch64 VDSO linker failure fix (-fuse-ld=lld).
# ─────────────────────────────────────────────────────────────────────────────

# Least privilege: the build job only reads. The separate 'release' job (do_release) is the ONLY place
# with contents: write (it creates a tag + release). Artifact upload/download and caches use the runtime
# token, not GITHUB_TOKEN permissions.
permissions:
  contents: read

concurrency:
  group: chimera-mk9r3-${{ github.event.inputs.profile }}-${{ github.event.inputs.overlay_profile }}-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.base_ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "boot-first (xthorfinnx/16-xxksu-susfs pre-integrated KernelSU/SUSFS only) or chimera-full (adds optional Chimera overlay/tuning)"
        required: true
        type: choice
        options: [boot-first, chimera-full]
        default: boot-first

      toolchain:
        description: "gcc = DEFAULT, compile-tested (Ubuntu 24.04 gcc-aarch64-linux-gnu 13.3). llvm-full = FULL LLVM/Clang mode (pinned LLVM 22.1.7; Clang + LLD + LLVM binutils, no GCC compiler/linker). Legacy LLVM/AOSP/Neutron choices remain experimental and are preserved for compatibility."
        required: true
        type: choice
        options: [gcc, llvm-full, llvm22, llvm21, llvm20, aosp23, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, zyc_stable, weebx]
        default: gcc

      apply_optional_overlay:
        description: "Apply the optional Chimera overlay/tuning even in boot-first"
        required: false
        type: boolean
        default: false

      overlay_profile:
        description: "Chimera source-overlay set. Only used when the overlay is active (profile=chimera-full or apply_optional_overlay=true); otherwise ignored. full = apply_chimera_overlay_patches.sh (all 9 sections incl. DTS + madera). lite = apply_chimera_overlay_lite.sh (UFC, mem_rw SUS_MAP, namei sus_path verify, sugov x3, fair.c tuning only). security-only = NO mk/grep source overlays. In ALL three, the stack-protector edit and chimera-device-specific.cfg are still applied (that cfg also carries non-security symbols such as HZ_300/BBR/Madera); the hooks.c selinux_cred() pass runs only if the tree provides selinux_cred() (N/A on 16-xxksu-susfs, logged). For an unmodified base use profile=boot-first with apply_optional_overlay=false."
        required: false
        type: choice
        options: [full, lite, security-only]
        default: full

      relax_bcmdhd_werror:
        description: "Strip -Werror from drivers/net/wireless/bcmdhd_101_16 build files at CI time (needed for GCC 13; no-op if none found)"
        required: false
        type: boolean
        default: true

      build_scope:
        description: "full = compile Image/vmlinux/dtbs, verify hook symbols, collect artifacts (+ optional packaging / release). config-only = apply patches, run Kconfig and validate the final .config, then STOP: it does NOT compile, link, boot, or validate KSU/SUSFS runtime behavior or packaging (package_anykernel and do_release are ignored)."
        required: false
        type: choice
        options: [full, config-only]
        default: full

      package_anykernel:
        description: "Also build an AnyKernel3 ZIP + raw dtb concat (packaging is UNVERIFIED for this device). Only with build_scope=full."
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create a GitHub prerelease (creates a tag — repository mutation). Only with build_scope=full; runs in a separate release job with contents: write."
        required: false
        type: boolean
        default: false

      base_repo:
        description: "Kernel source repo (owner/repo)"
        required: false
        type: string
        default: "xthorfinnx/android_kernel_samsung_exynos9810"

      base_ref:
        description: "Kernel source BRANCH name (default 16-xxksu-susfs, KernelSU/SUSFS pre-integrated). Resolved at job start; base_commit selects the exact commit."
        required: false
        type: string
        default: "16-xxksu-susfs"

      base_commit:
        description: "Full 40-hex commit SHA pinning the kernel base (must be in base_ref history, else fail). Default = 16-xxksu-susfs tip on 2026-10-22. Empty = build the live tip of base_ref (recorded in manifest; NOT reproducible)."
        required: false
        type: string
        default: "608aef8592023c470176d43ab25e34004b528ddc"

      ksu_commit:
        description: "xthorfinnx/KernelSU commit the base's KernelSU gitlink must equal (full 40-hex). Default = the gitlink recorded by the default base_commit. Empty = accept whatever gitlink the base records (warning)."
        required: false
        type: string
        default: "8e661a1351447dc62e5c12390e34af55048f62ba"

      brand:
        description: "LOCALVERSION suffix (starts with '-'). '-c9r3x[git7]' = '-c9r3x' + first 7 hex of the resolved base commit."
        required: true
        type: choice
        options:
          - "-Chimera_Mk9r3"
          - "-24463729"
          - "-c9r3x[git7]"
          - "Other"
        default: "-c9r3x[git7]"
      custom_brand:
        description: "Custom brand — only if brand=Other (must start with '-')"
        required: false
        type: string

      build_user:
        description: "KBUILD_BUILD_USER. 'Other' uses custom_build_user."
        required: true
        type: choice
        options: ["MTRXX", "EVOXV", "EVOXG", "DRPFST", "HLCYN", "LOS", "GA", "RC0", "Other"]
        default: "Other"
      custom_build_user:
        description: "Custom build user — only if build_user=Other"
        required: false
        type: string
        default: "CM9XNNNN"

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"

      build_version:
        description: "KBUILD_BUILD_VERSION (#N token, digits)"
        required: false
        type: string
        default: "1"

      build_date:
        description: "KBUILD_BUILD_TIMESTAMP — ROM label stripped before use. 'Other' uses custom_build_date (empty => fixed default)."
        required: true
        type: choice
        options:
          - "MTRXX: Wed Aug 19 03:26:19 UTC 2026"
          - "LOS232: Sat Sep 12 23:46:37 CEST 2026"
          - "EVOXV: Tue Aug 11 10:23:04 UTC 2026"
          - "EVOXGMS: Tue Aug 11 13:18:57 UTC 2026"
          - "HLCYN: Tue Aug 18 13:16:25 UTC 2026"
          - "DRPFST: Tue Aug 11 07:06:26 UTC 2026"
          - "CRDROID 12.11: Fri Aug 7 19:06:04 PKT 2026"
          - "CRDROID 12.12: Sat Sep 26 21:05:43 PKT 2026"
          - "Other"
        default: "Other"
      custom_build_date:
        description: "Custom build timestamp — only if build_date=Other"
        required: false
        type: string

env:
  CHIMERA_REPO: "https://github.com/royd-jpg/Project_Chimera.git"
  # Immutable pin (40-hex commit) of royd-jpg/Project_Chimera (carried over unchanged from Mk9r2 v.20261014-r2).
  # At this pin chimera-device-specific.cfg and patches/apply_chimera_overlay_patches.sh were dry-run on
  # xthorfinnx/16-xxksu-susfs@608aef85 (2026-10-22): config merge OK, overlay sections 1-8 + markers OK (section 9
  # needs GITHUB_WORKSPACE, set by Actions; apply_chimera_overlay_lite.sh was NOT dry-run). Bump deliberately after
  # reviewing the overlay scripts/fragments; the checkout is verified against this value.
  CHIMERA_REF: "7fe07e9c414d2278ddcedaf99d598e855b0248a7"

  # KernelSU submodule expected in the base (verified 2026-10-22 in .gitmodules of 16-xxksu-susfs@608aef85).
  KSU_REPO_URL: "https://github.com/xthorfinnx/KernelSU.git"
  KSU_SUBMODULE_PATH: "KernelSU"

  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  ANYKERNEL_DIR: "anykernel3"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

  # Verified statically on 16-xxksu-susfs@608aef85 (2026-10-22): defconfig + DTS source exist, CONFIG_DTS_9810_STAR2=y,
  # kernelversion 4.9.337. DTB BUILD output (STAR2_DTB_REL) is UNVERIFIED — REQUIRES CONFIRMATION until a full build
  # passes; it is re-checked after the build and fails closed.
  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"
  STAR2_DTB_REL: "dts/exynos/exynos9810-star2lte_eur_open_26.dtb"
  CCACHE_MAXSIZE: "3G"
  CCACHE_BASEDIR: "${{ github.workspace }}"

  KERNEL_VERSION: "4.9.337"
  KERNEL_NAME: "Chimera Mk9r3"
  KERNEL_DEVICE: "star2lte"
  KERNEL_PLATFORM: "Exynos 9810"
  BUILD_DATE_DEFAULT: "Thu Jan 1 00:00:00 UTC 2026"

  # Common target CFLAGS. LLVM mode appends -fuse-ld=lld in the shared library.
  # -Wno-error=unused-function: per-warning demotion kept from run #238.
  CHIMERA_KCFLAGS_COMMON: "-O2 -fcommon -fno-strict-aliasing -Wno-error -Wno-error=unused-function"

  CI_LIB: "/tmp/chimera-ci-lib.sh"

  # Inputs are passed through env, never interpolated into shell text.
  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  IN_PROFILE: ${{ inputs.profile }}
  IN_TOOLCHAIN: ${{ inputs.toolchain }}
  IN_BASE_REPO: ${{ inputs.base_repo }}
  IN_BASE_REF: ${{ inputs.base_ref }}
  IN_BASE_COMMIT: ${{ inputs.base_commit }}
  IN_KSU_COMMIT: ${{ inputs.ksu_commit }}
  IN_BRAND: ${{ inputs.brand }}
  IN_CUSTOM_BRAND: ${{ inputs.custom_brand }}
  IN_BUILD_USER: ${{ inputs.build_user }}
  IN_CUSTOM_BUILD_USER: ${{ inputs.custom_build_user }}
  IN_BUILD_HOST: ${{ inputs.build_host }}
  IN_BUILD_VERSION: ${{ inputs.build_version }}
  IN_BUILD_DATE: ${{ inputs.build_date }}
  IN_CUSTOM_BUILD_DATE: ${{ inputs.custom_build_date }}
  RELAX_BCMDHD_WERROR: ${{ inputs.relax_bcmdhd_werror }}
  APPLY_OVERLAY: ${{ inputs.profile == 'chimera-full' || inputs.apply_optional_overlay }}
  IN_OVERLAY_PROFILE: ${{ inputs.overlay_profile }}
  IN_BUILD_SCOPE: ${{ inputs.build_scope }}
  IN_PACKAGE_ANYKERNEL: ${{ inputs.package_anykernel }}
  IN_DO_RELEASE: ${{ inputs.do_release }}
  # 'off' when the overlay is not active (boot-first without apply_optional_overlay); else the chosen profile.
  OVERLAY_PROFILE_EFFECTIVE: ${{ (inputs.profile == 'chimera-full' || inputs.apply_optional_overlay) && inputs.overlay_profile || 'off' }}

jobs:
  build:
    name: Chimera Mk9r3 ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash

    steps:
      # ── 0. Validate inputs ─────────────────────────────────────────────────
      - name: Validate workflow inputs
        run: |
          set -Eeuo pipefail
          FAIL=0
          [[ "$IN_PROFILE" =~ ^(boot-first|chimera-full)$ ]] || { echo "FATAL: bad profile '$IN_PROFILE'" >&2; FAIL=1; }
          [[ "$IN_OVERLAY_PROFILE" =~ ^(full|lite|security-only)$ ]] || { echo "FATAL: bad overlay_profile '$IN_OVERLAY_PROFILE'" >&2; FAIL=1; }
          [[ "$IN_BUILD_SCOPE" =~ ^(full|config-only)$ ]] || { echo "FATAL: bad build_scope '$IN_BUILD_SCOPE'" >&2; FAIL=1; }
          [[ "$CHIMERA_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: CHIMERA_REF must be an immutable 40-hex commit SHA" >&2; FAIL=1; }
          [[ "$IN_TOOLCHAIN" =~ ^(gcc|llvm-full|llvm22|llvm21|llvm20|aosp23|aosp22|aosp21|aosp20|aosp19|neutron19|neutron23|neutron24|zyc_stable|weebx)$ ]] || { echo "FATAL: bad toolchain '$IN_TOOLCHAIN'" >&2; FAIL=1; }
          [[ "$IN_BASE_REF" =~ ^[A-Za-z0-9._/-]+$ && "$IN_BASE_REF" != -* && "$IN_BASE_REF" != *..* ]] || { echo "FATAL: base_ref must be a branch name ([A-Za-z0-9._/-], no leading '-', no '..'), got '$IN_BASE_REF'" >&2; FAIL=1; }
          [[ -z "$IN_BASE_COMMIT" || "$IN_BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: base_commit must be empty or a full 40-hex SHA" >&2; FAIL=1; }
          [[ -z "$IN_KSU_COMMIT" || "$IN_KSU_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: ksu_commit must be empty or a full 40-hex SHA" >&2; FAIL=1; }
          [[ "$IN_BASE_REPO" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]] || { echo "FATAL: base_repo must be owner/repo" >&2; FAIL=1; }
          [[ "$IN_BUILD_VERSION" =~ ^[0-9]+$ ]] || { echo "FATAL: build_version must be digits" >&2; FAIL=1; }
          [[ "$IN_BUILD_HOST" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "FATAL: bad build_host" >&2; FAIL=1; }
          [[ "$FAIL" -eq 0 ]] || exit 1
          if [[ "$APPLY_OVERLAY" != "true" && "$IN_OVERLAY_PROFILE" != "full" ]]; then
            echo "::notice::overlay_profile=$IN_OVERLAY_PROFILE ignored: overlay inactive (profile=$IN_PROFILE, apply_optional_overlay=false)"
          fi
          if [[ "$IN_BUILD_SCOPE" == "config-only" && ( "$IN_PACKAGE_ANYKERNEL" == "true" || "$IN_DO_RELEASE" == "true" ) ]]; then
            echo "::notice::build_scope=config-only: package_anykernel / do_release are ignored (nothing is compiled)"
          fi
          echo "PASS: inputs valid (APPLY_OVERLAY=$APPLY_OVERLAY, OVERLAY_PROFILE_EFFECTIVE=$OVERLAY_PROFILE_EFFECTIVE, BUILD_SCOPE=$IN_BUILD_SCOPE)"

      # Resolves the kernel base branch to ONE exact commit before anything else uses it (brand, checkout, manifest).
      - name: Resolve kernel base branch to an exact commit (fail-closed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          LS="$(git ls-remote --heads "https://github.com/${IN_BASE_REPO}.git" "refs/heads/${IN_BASE_REF}")" \
            || { echo "FATAL: git ls-remote failed for ${IN_BASE_REPO} (repo missing/private/unreachable)" >&2; exit 1; }
          TIP="$(printf '%s\n' "$LS" | awk -v r="refs/heads/${IN_BASE_REF}" '$2==r {print $1}')"
          [[ "$TIP" =~ ^[0-9a-f]{40}$ ]] || { echo "FATAL: branch '${IN_BASE_REF}' not found in ${IN_BASE_REPO}" >&2; exit 1; }
          CMP="n/a"
          if [[ -n "$IN_BASE_COMMIT" ]]; then
            PIN="$IN_BASE_COMMIT"; MODE="pinned"
            if [[ "$PIN" == "$TIP" ]]; then
              CMP="identical"
            else
              CMP="$(curl -fsSL --max-time 30 -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${IN_BASE_REPO}/compare/${PIN}...${TIP}" | jq -r '.status // "unknown"' 2>/dev/null || echo unknown)"
              case "$CMP" in
                ahead)
                  echo "::warning::base_commit ${PIN} is an ancestor of the live tip ${TIP} of ${IN_BASE_REF}; pin NOT advanced." ;;
                behind|diverged)
                  echo "FATAL: base_commit ${PIN} is NOT in the history of ${IN_BASE_REF} (compare status: ${CMP}). Refusing to build a commit outside the requested branch." >&2; exit 1 ;;
                *)
                  echo "::warning::could not verify that base_commit ${PIN} belongs to ${IN_BASE_REF} (compare status: ${CMP}) — UNVERIFIED — REQUIRES CONFIRMATION" ;;
              esac
            fi
          else
            PIN="$TIP"; MODE="branch-tip"
            echo "::warning::base_commit empty — building live tip ${TIP} of ${IN_BASE_REF}. Recorded in manifest; NOT reproducible. Set base_commit to pin."
          fi
          {
            echo "BASE_BRANCH=$IN_BASE_REF"
            echo "BASE_TIP=$TIP"
            echo "BASE_PIN_SHA=$PIN"
            echo "BASE_PIN_MODE=$MODE"
            echo "BASE_CMP_STATUS=$CMP"
          } >> "$GITHUB_ENV"
          echo "base: ${IN_BASE_REPO} branch=${IN_BASE_REF} tip=${TIP} using=${PIN} (${MODE}, compare=${CMP})"

      - name: Resolve build identity inputs
        run: |
          set -Eeuo pipefail
          if [[ "$IN_BRAND" == "Other" ]]; then
            FINAL_BRAND="$IN_CUSTOM_BRAND"
          elif [[ "$IN_BRAND" == "-c9r3x[git7]" ]]; then
            FINAL_BRAND="-c9r3x${BASE_PIN_SHA:0:7}"
          else
            FINAL_BRAND="$IN_BRAND"
          fi
          [[ "$FINAL_BRAND" =~ ^-[A-Za-z0-9._+@:-]+$ ]] || { echo "FATAL: brand '$FINAL_BRAND' must start with '-' and use [A-Za-z0-9._+@:-]" >&2; exit 1; }

          if [[ "$IN_BUILD_USER" == "Other" ]]; then FINAL_USER="$IN_CUSTOM_BUILD_USER"; else FINAL_USER="$IN_BUILD_USER"; fi
          [[ "$FINAL_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "FATAL: bad build user '$FINAL_USER'" >&2; exit 1; }

          if [[ "$IN_BUILD_DATE" == "Other" ]]; then
            FINAL_DATE="$IN_CUSTOM_BUILD_DATE"
            if [[ -z "$FINAL_DATE" ]]; then
              FINAL_DATE="$BUILD_DATE_DEFAULT"
              echo "::warning::build_date=Other with empty custom_build_date — using fixed default '$FINAL_DATE'"
            fi
          else
            FINAL_DATE="${IN_BUILD_DATE#*: }"
          fi
          [[ "$FINAL_DATE" =~ ^[A-Za-z0-9\ :+._-]+$ ]] || { echo "FATAL: bad build date '$FINAL_DATE'" >&2; exit 1; }

          UNAME_PREVIEW="Linux version ${KERNEL_VERSION}${FINAL_BRAND} (${FINAL_USER}@${IN_BUILD_HOST}) #${IN_BUILD_VERSION} SMP PREEMPT"
          {
            echo "BRAND=$FINAL_BRAND"
            echo "KBUILD_BUILD_USER=$FINAL_USER"
            echo "KBUILD_BUILD_HOST=$IN_BUILD_HOST"
            echo "KBUILD_BUILD_VERSION=$IN_BUILD_VERSION"
            echo "KBUILD_BUILD_TIMESTAMP=$FINAL_DATE"
            echo "UNAME_PREVIEW=$UNAME_PREVIEW"
          } >> "$GITHUB_ENV"
          echo "brand=$FINAL_BRAND user=$FINAL_USER host=$IN_BUILD_HOST ver=$IN_BUILD_VERSION ts=$FINAL_DATE"

      - name: Clean workspace
        run: |
          set -Eeuo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      # ── 1. Host dependencies ───────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache curl flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            git libelf-dev libssl-dev lz4 lzop pahole python3 rsync \
            zstd xz-utils cpio zip
          # CONFIG_DEBUG_INFO_BTF=y is set in exynos9810-star2lte_defconfig (verified on
          # xthorfinnx/16-xxksu-susfs@608aef85, 2026-10-22); vmlinux link hard-fails without
          # pahole. Fail here, not 40 min in.
          command -v pahole >/dev/null || { echo "::error::pahole missing (needed for DEBUG_INFO_BTF)"; exit 1; }
          pahole --version
          python3 --version
          git --version
          aarch64-linux-gnu-gcc --version | head -n1
          arm-linux-gnueabi-gcc --version | head -n1

      # ── 2. Checkouts ───────────────────────────────────────────────────────
      - name: Checkout Project_Chimera (workflow repo — device cfg fragment + overlay only)
        uses: actions/checkout@v4
        with:
          path: .
          ref: ${{ env.CHIMERA_REF }}
          fetch-depth: 1
          clean: false
          sparse-checkout: |
            chimera-device-specific.cfg
            patches/
          sparse-checkout-cone-mode: false

      - name: Record Project_Chimera revision and verify required files
        run: |
          set -Eeuo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "CHIMERA_SHA=$SHA" >> "$GITHUB_ENV"
          echo "Chimera pin: $CHIMERA_REF  checked-out commit: $SHA"
          [[ "$SHA" == "$CHIMERA_REF" ]] || { echo "FATAL: Project_Chimera checkout $SHA != pinned CHIMERA_REF $CHIMERA_REF" >&2; exit 1; }
          # chimera-ksu-susfs.cfg is intentionally NOT required/merged: the base defconfig already carries
          # KSU + SUSFS and that fragment asserts symbols (KSU_MANUAL_HOOK, ...) this KernelSU fork does not define.
          NEED=()
          if [[ "$APPLY_OVERLAY" == "true" ]]; then
            NEED+=(chimera-device-specific.cfg)   # merged in ALL overlay profiles
            case "$IN_OVERLAY_PROFILE" in
              full) NEED+=(patches/apply_chimera_overlay_patches.sh patches/0001-mfd-madera-core-settle-delay-after-reset-release.patch) ;;
              lite) NEED+=(patches/apply_chimera_overlay_lite.sh) ;;
              security-only) ;;   # no mk/grep scripts; stack-protector + device cfg only
            esac
          fi
          MISSING=0
          for f in ${NEED[@]+"${NEED[@]}"}; do
            if [[ -f "$GITHUB_WORKSPACE/$f" ]]; then echo "OK: $f"; else echo "FATAL: missing $f" >&2; MISSING=1; fi
          done
          [[ "$MISSING" -eq 0 ]] || exit 1
          [[ ! -f patches/apply_chimera_overlay_patches.sh ]] || chmod +x patches/apply_chimera_overlay_patches.sh
          [[ ! -f patches/apply_chimera_overlay_lite.sh ]] || chmod +x patches/apply_chimera_overlay_lite.sh

      # The KernelSU submodule is NOT fetched here; the layout step below handles the gitlink explicitly and fail-closed.
      - name: Checkout kernel base (resolved exact commit, no submodules)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          ref: ${{ env.BASE_PIN_SHA }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1
          submodules: false
          clean: false

      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR" "$GITHUB_WORKSPACE/$OUT_DIR" "$GITHUB_WORKSPACE/artifacts" "$GITHUB_WORKSPACE/toolchains"
          {
            echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR"
            echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR"
            echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR"
            echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang"
            echo "ART_DIR=$GITHUB_WORKSPACE/artifacts"
          } >> "$GITHUB_ENV"

      - name: Detect base branch-tip drift (log only)
        run: |
          set -Eeuo pipefail
          {
            echo "base repo: $IN_BASE_REPO"
            echo "branch: $BASE_BRANCH"
            echo "mode: $BASE_PIN_MODE"
            echo "commit used: $BASE_PIN_SHA"
            echo "live tip at job start: $BASE_TIP"
            echo "compare(pin...tip): $BASE_CMP_STATUS"
          } | tee "$ABS_LOG/base-drift.txt"
          if [[ "$BASE_PIN_SHA" != "$BASE_TIP" ]]; then
            echo "::warning::base_commit $BASE_PIN_SHA differs from live tip $BASE_TIP of $BASE_BRANCH; pin NOT advanced. Re-verify (hook/SUSFS checks, compile) before repinning."
          fi

      # ── 3. Shared toolchain library (sourced by every step) ────────────────
      - name: Write shared toolchain library
        run: |
          set -Eeuo pipefail
          cat > "$CI_LIB" <<'LIBEOF'
          # Sourced by each step. Reads only persisted env. No cross-step arrays.
          # KBUILD_LDFLAGS is deliberately never defined or passed (empty is valid).
          chimera_toolchain_args() {
            local v bad
            for v in TOOLCHAIN TC_CC TC_LD TC_AR TC_NM TC_OBJCOPY TC_OBJDUMP TC_STRIP TC_READELF \
                     TC_CROSS_COMPILE TC_CROSS_COMPILE_ARM32 CHIMERA_KCFLAGS_COMMON; do
              [[ -n "${!v-}" ]] || { echo "FATAL: $v is unset or empty" >&2; return 1; }
            done
            if [[ "$TOOLCHAIN" == "gcc" ]]; then
              TOOLCHAIN_ARGS=(
                "CC=${TC_CC}"
                "HOSTCC=gcc -fcommon"
                "HOSTCXX=g++"
                "HOSTLD=ld"
                "LD=${TC_LD}"
                "AR=${TC_AR}"
                "NM=${TC_NM}"
                "OBJCOPY=${TC_OBJCOPY}"
                "OBJDUMP=${TC_OBJDUMP}"
                "STRIP=${TC_STRIP}"
                "READELF=${TC_READELF}"
                "CROSS_COMPILE=${TC_CROSS_COMPILE}"
                "CROSS_COMPILE_ARM32=${TC_CROSS_COMPILE_ARM32}"
              )
              BUILD_KCFLAGS="$CHIMERA_KCFLAGS_COMMON"
              for bad in -fuse-ld=lld -Wno-unknown-warning-option -Wno-error=unused-but-set-global; do
                [[ " $BUILD_KCFLAGS " != *" $bad "* ]] || { echo "FATAL: clang-only flag $bad in GCC mode" >&2; return 1; }
              done
              [[ "$TC_CC" == *aarch64-linux-gnu-gcc ]] || { echo "FATAL: GCC mode CC is '$TC_CC'" >&2; return 1; }
              [[ "$TC_LD" == "aarch64-linux-gnu-ld" ]] || { echo "FATAL: GCC mode LD is '$TC_LD'" >&2; return 1; }
              [[ "$TC_CROSS_COMPILE" == "aarch64-linux-gnu-" ]] || { echo "FATAL: GCC mode CROSS_COMPILE is '$TC_CROSS_COMPILE'" >&2; return 1; }
            else
              TOOLCHAIN_ARGS=(
                "CC=${TC_CC}"
                "HOSTCC=clang -fcommon"
                "HOSTCXX=clang++"
                "HOSTLD=ld.lld"
                "HOSTAR=llvm-ar"
                "HOSTAS=clang"
                "LD=${TC_LD}"
                "AR=${TC_AR}"
                "NM=${TC_NM}"
                "OBJCOPY=${TC_OBJCOPY}"
                "OBJDUMP=${TC_OBJDUMP}"
                "STRIP=${TC_STRIP}"
                "READELF=${TC_READELF}"
                "LLVM=1"
                "LLVM_IAS=1"
                "CLANG_TRIPLE=aarch64-linux-gnu-"
                "CROSS_COMPILE=${TC_CROSS_COMPILE}"
                "CROSS_COMPILE_ARM32=${TC_CROSS_COMPILE_ARM32}"
              )
              BUILD_KCFLAGS="$CHIMERA_KCFLAGS_COMMON -fuse-ld=lld"
              [[ "$TC_CC" == *clang* && "$TC_CC" != *gcc* ]] || { echo "FATAL: LLVM mode CC is '$TC_CC' (GCC is forbidden)" >&2; return 1; }
              [[ "$TC_LD" == "ld.lld" ]] || { echo "FATAL: LLVM mode LD is '$TC_LD'" >&2; return 1; }
              [[ "$TC_AR" == "llvm-ar" && "$TC_NM" == "llvm-nm" && "$TC_OBJCOPY" == "llvm-objcopy" ]] || { echo "FATAL: LLVM mode is missing LLVM binutils" >&2; return 1; }
              [[ "$TC_OBJDUMP" == "llvm-objdump" && "$TC_STRIP" == "llvm-strip" && "$TC_READELF" == "llvm-readelf" ]] || { echo "FATAL: LLVM mode is missing LLVM inspection/strip tools" >&2; return 1; }
            fi
          }
          chimera_make() {
            make O="$ABS_OUT" ARCH=arm64 "${TOOLCHAIN_ARGS[@]}" "$@"
          }
          LIBEOF
          bash -n "$CI_LIB"
          echo "library written: $CI_LIB"

      # ── 4. Toolchain resolution ────────────────────────────────────────────
      # SUPPORT STATUS — gcc remains the compile-tested default (Ubuntu GCC 13.3 cross). llvm-full is a dedicated full-LLVM mode;
      # llvm-full uses the pinned LLVM 22.1.7 archive and is explicitly verified as a Clang/LLD/LLVM-binutils build path.
      # Every other non-gcc/non-llvm-full option is EXPERIMENTAL: URLs/layouts carried over from earlier revisions and NOT
      # re-downloaded or compile-tested here — UNVERIFIED — REQUIRES CONFIRMATION.
      # Existence-only check on 2026-10-03: the neutron19/23/24 and weebx release assets and the zyc_stable
      # link file answered HTTP 200 (github-hosted). kernel.org (llvm*), android.googlesource.com (aosp19/21/23)
      # and gitlab.com (aosp20) could not be reached from the checking environment, so they are unchecked.
      # aosp20 (mirror 'master') and aosp22 (branch URL) are mutable. Nothing was clearly broken, so no option
      # was removed. (All toolchain values below are unchanged from Mk9r2; none re-verified for Mk9r3.)
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail
          TC_URL=""; TC_ARCHIVE_FMT="tar.gz"; TC_CACHE_KEY=""; TC_SHA256=""
          case "$IN_TOOLCHAIN" in
            gcc)
              TC_CACHE_KEY="gcc-cross-ubuntu-24.04-v3" ;;
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz"
              TC_CACHE_KEY="aosp-clang-r536225-ubuntu-24.04-v2" ;;
            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              echo "::warning::aosp20 uses a mutable third-party mirror (master); not reproducible" ;;
            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2" ;;
            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              echo "::warning::aosp22 URL references a mutable branch; not reproducible" ;;
            aosp23)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/28337064939c0b4bb5804cddf35fb03d860edcf6/clang-r614150.tar.gz"
              TC_CACHE_KEY="aosp-clang-r614150-ubuntu-24.04-v1"
              echo "::warning::aosp23 unverified: no SHA-256 pin" ;;
            llvm20)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="korg-clang-20.1.8-ubuntu-24.04-v1" ;;
            llvm21)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="llvm-clang-21.1.0-ubuntu-24.04-v1" ;;
            llvm-full)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="llvm-full-22.1.7-ubuntu-24.04-v1" ;;
            llvm22)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"; TC_CACHE_KEY="llvm-clang-22.1.7-ubuntu-24.04-v1" ;;
            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"; TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2" ;;
            neutron23)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"; TC_CACHE_KEY="neutron-clang-30062026-ubuntu-24.04-v2" ;;
            neutron24)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"; TC_CACHE_KEY="neutron-clang-30072026-ubuntu-24.04-v2" ;;
            zyc_stable)
              TC_URL="$(curl -fsSL https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt | head -n1 | tr -d '\r')"
              [[ "$TC_URL" =~ ^https:// ]] || { echo "FATAL: zyc URL lookup failed: '$TC_URL'" >&2; exit 1; }
              TC_ARCHIVE_FMT="tar.gz"   # UNVERIFIED — REQUIRES CONFIRMATION
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-$(printf '%s' "$TC_URL" | sha256sum | cut -c1-16)" ;;
            weebx)
              TC_URL="https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz"
              TC_CACHE_KEY="weebx-clang-20.0.0git-20241206-ubuntu-24.04-v1"
              TC_SHA256="a2ac878d7f26fc1ac7d90d1330e4e34b62676d3a2326673b78b7799e1d8a0a7c" ;;
            *) echo "FATAL: unsupported toolchain $IN_TOOLCHAIN" >&2; exit 1 ;;
          esac

          if [[ "$IN_TOOLCHAIN" == "gcc" ]]; then
            TC_CC="ccache aarch64-linux-gnu-gcc"; TC_LD="aarch64-linux-gnu-ld"
            TC_AR="aarch64-linux-gnu-ar"; TC_NM="aarch64-linux-gnu-nm"
            TC_OBJCOPY="aarch64-linux-gnu-objcopy"; TC_OBJDUMP="aarch64-linux-gnu-objdump"
            TC_STRIP="aarch64-linux-gnu-strip"; TC_READELF="aarch64-linux-gnu-readelf"
          else
            TC_CC="ccache clang"; TC_LD="ld.lld"; TC_AR="llvm-ar"; TC_NM="llvm-nm"
            TC_OBJCOPY="llvm-objcopy"; TC_OBJDUMP="llvm-objdump"; TC_STRIP="llvm-strip"; TC_READELF="llvm-readelf"
          fi
          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_SHA256=$TC_SHA256"
            echo "TC_CC=$TC_CC"
            echo "TC_LD=$TC_LD"
            echo "TC_AR=$TC_AR"
            echo "TC_NM=$TC_NM"
            echo "TC_OBJCOPY=$TC_OBJCOPY"
            echo "TC_OBJDUMP=$TC_OBJDUMP"
            echo "TC_STRIP=$TC_STRIP"
            echo "TC_READELF=$TC_READELF"
            echo "TC_CROSS_COMPILE=aarch64-linux-gnu-"
            echo "TC_CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          } >> "$GITHUB_ENV"
          echo "Toolchain=$IN_TOOLCHAIN CC=$TC_CC LD=$TC_LD"

      - name: Cache toolchain
        if: ${{ inputs.toolchain != 'gcc' }}
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: ${{ inputs.toolchain != 'gcc' && steps.tc-cache.outputs.cache-hit != 'true' }}
        run: |
          set -Eeuo pipefail
          rm -rf "$ABS_TC"; mkdir -p "$ABS_TC"
          [[ -n "$TC_URL" ]] || { echo "FATAL: TC_URL empty" >&2; exit 1; }
          ARCHIVE=/tmp/clang_archive
          aria2c -x 16 -s 16 -k 1M -c --max-tries=5 --retry-wait=5 --timeout=60 \
            --dir=/tmp --out=clang_archive "$TC_URL"
          [[ -s "$ARCHIVE" ]] || { echo "FATAL: archive missing/empty" >&2; exit 1; }
          ACTUAL_SHA="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          echo "toolchain archive sha256: $ACTUAL_SHA" | tee "$ABS_LOG/toolchain-archive-sha256.txt"
          if [[ -n "$TC_SHA256" && "$ACTUAL_SHA" != "$TC_SHA256" ]]; then
            echo "FATAL: SHA-256 mismatch (expected $TC_SHA256)" >&2; exit 1
          fi
          case "$TC_ARCHIVE_FMT" in
            tar.gz) tar -C "$ABS_TC" -xzf "$ARCHIVE" ;;
            tar.xz) tar -C "$ABS_TC" -xJf "$ARCHIVE" ;;
            tar.zst) zstd -d "$ARCHIVE" -o /tmp/clang.tar --force; tar -C "$ABS_TC" -xf /tmp/clang.tar ;;
            *) echo "FATAL: unsupported archive format '$TC_ARCHIVE_FMT'" >&2; exit 1 ;;
          esac
          [[ -n "$(find "$ABS_TC" -type f -print -quit)" ]] || { echo "FATAL: no files extracted" >&2; exit 1; }
          echo "Toolchain ready: $(find "$ABS_TC" -type f | wc -l) file(s)"

      - name: Configure LLVM toolchain PATH
        if: ${{ inputs.toolchain != 'gcc' }}
        run: |
          set -Eeuo pipefail
          ACTUAL_BIN="$(find "$ABS_TC" -type d -name bin -printf '%d\t%p\n' | sort -n | cut -f2 | sed -n '1p')"
          [[ -n "$ACTUAL_BIN" && -d "$ACTUAL_BIN" ]] || { echo "FATAL: no bin dir under $ABS_TC" >&2; exit 1; }
          chmod +x "$ACTUAL_BIN"/* 2>/dev/null || true
          echo "$ACTUAL_BIN" >> "$GITHUB_PATH"
          echo "toolchain bin: $ACTUAL_BIN"

      - name: Verify toolchain and capture compiler identity
        run: |
          set -Eeuo pipefail
          need() { command -v "$1" >/dev/null 2>&1 || { echo "FATAL: missing command $1" >&2; exit 1; }; }
          need ccache
          if [[ "$TOOLCHAIN" == "gcc" ]]; then
            for t in gcc ld ar nm objcopy objdump strip readelf; do need "aarch64-linux-gnu-$t"; done
            for t in gcc ld ar nm objcopy objdump strip readelf; do need "arm-linux-gnueabi-$t"; done
            COMPILER_VERSION="$(aarch64-linux-gnu-gcc --version | head -n1)"
            LINKER_VERSION="$(aarch64-linux-gnu-ld --version | head -n1)"
            COMPILER_KIND=gcc
          else
            for b in clang clang++ ld.lld llvm-nm llvm-objdump llvm-ar llvm-objcopy llvm-strip llvm-readelf; do need "$b"; done
            clang --print-targets | grep -qi aarch64 || { echo "FATAL: clang lacks aarch64 target" >&2; exit 1; }
            COMPILER_VERSION="$(clang --version | head -n1)"
            LINKER_VERSION="$(ld.lld --version | head -n1)"
            COMPILER_KIND=llvm
            if [[ "$TOOLCHAIN" == "llvm-full" ]]; then
              for b in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip llvm-readelf; do
                command -v "$b" >/dev/null 2>&1 || { echo "FATAL: full-LLVM tool missing: $b" >&2; exit 1; }
              done
              [[ "$(command -v clang)" != *aarch64-linux-gnu-gcc* ]] || { echo "FATAL: full-LLVM resolved CC to GCC" >&2; exit 1; }
              echo "FULL_LLVM_MODE=1" >> "$GITHUB_ENV"
            fi
          fi
          TC_IDENTITY_HASH="$(printf '%s\n%s\n%s\n' "$COMPILER_VERSION" "$LINKER_VERSION" "$COMPILER_KIND" | sha256sum | cut -c1-16)"
          {
            echo "COMPILER_VERSION=$COMPILER_VERSION"
            echo "LINKER_VERSION=$LINKER_VERSION"
            echo "COMPILER_KIND=$COMPILER_KIND"
            echo "TC_IDENTITY_HASH=$TC_IDENTITY_HASH"
          } >> "$GITHUB_ENV"
          {
            echo "Compiler: $COMPILER_VERSION"
            echo "Linker:   $LINKER_VERSION"
            echo "Kind:     $COMPILER_KIND"
            echo "Identity hash: $TC_IDENTITY_HASH"
          } | tee "$ABS_LOG/toolchain-identity.txt"

      - name: Set up ccache
        if: ${{ inputs.build_scope == 'full' }}
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: chimera-mk9r3-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-${{ github.sha }}
          restore-keys: |
            chimera-mk9r3-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ── 5. Verify base (xthorfinnx/16-xxksu-susfs, KernelSU/SUSFS pre-integrated) ───────
      - name: Preflight — base commit, clean tree, kernel version, defconfig, star2lte DTS
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$(git status --porcelain --ignore-submodules=none)" ]]; then
            echo "FATAL: base checkout not clean" >&2; git status --short; exit 1
          fi
          BASE_COMMIT="$(git rev-parse HEAD)"
          [[ "$BASE_COMMIT" == "$BASE_PIN_SHA" ]] || { echo "FATAL: HEAD $BASE_COMMIT != resolved base commit $BASE_PIN_SHA" >&2; exit 1; }
          KV="$(make -s --no-print-directory kernelversion)"
          echo "kernelversion: $KV"
          [[ "$KV" == "$KERNEL_VERSION" ]] || { echo "FATAL: kernelversion '$KV' != expected '$KERNEL_VERSION' for ${IN_BASE_REPO}@${BASE_PIN_SHA} — KERNEL_VERSION is verified only for 608aef85; update it deliberately after review (UNVERIFIED — REQUIRES CONFIRMATION)" >&2; exit 1; }
          [[ -f "$DEFCONFIG" ]] || { echo "FATAL: defconfig missing: $DEFCONFIG — UNVERIFIED — REQUIRES CONFIRMATION: DEFCONFIG path does not exist in ${IN_BASE_REPO}@${BASE_PIN_SHA}" >&2; exit 1; }
          DTS_SRC="arch/arm64/boot/${STAR2_DTB_REL%.dtb}.dts"
          [[ -f "$DTS_SRC" ]] || { echo "FATAL: star2lte DTS source missing: $DTS_SRC — UNVERIFIED — REQUIRES CONFIRMATION: STAR2_DTB_REL ($STAR2_DTB_REL) does not match ${IN_BASE_REPO}@${BASE_PIN_SHA}" >&2; exit 1; }
          # NOTE: the Mk9r2 'pristine base (no KSU/SUSFS)' checks are intentionally gone. This base already carries
          # KernelSU + SUSFS; presence/shape is verified fail-closed below.
          echo "$BASE_COMMIT" > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"
          echo "KERNEL_RELEASE_EXPECTED=${KV}${BRAND}" >> "$GITHUB_ENV"
          echo "OK: base $IN_BASE_REPO@$BASE_COMMIT ($BASE_BRANCH, $BASE_PIN_MODE), $KV, defconfig + star2lte DTS source present"

      # ── 5b. Pre-integrated KernelSU (xxKSU fork) + SUSFS: submodule at the base's gitlink (no CI-time patch) ───────
      # Mk9r2 generated/applied a gavdoc38 integration patch and cloned gavdoc38/KernelSU-Next here. That flow is
      # REMOVED. Verified 2026-10-22 on 16-xxksu-susfs@608aef85: gitlink KernelSU @ 8e661a13..., .gitmodules url
      # https://github.com/xthorfinnx/KernelSU.git, drivers/kernelsu -> ../KernelSU/kernel. Any deviation fails.
      - name: Resolve pre-integrated KernelSU submodule (gitlink, pinned, fail-closed)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          [[ -L drivers/kernelsu || -d drivers/kernelsu ]] || {
            echo "FATAL: drivers/kernelsu missing — ${IN_BASE_REPO}@${BASE_PIN_SHA} has no KernelSU wiring. The gavdoc38 patch flow is removed; UNVERIFIED — REQUIRES CONFIRMATION of the real KSU path." >&2; exit 1; }
          KREL="$(realpath -m --relative-to="$PWD" drivers/kernelsu)"
          [[ "$KREL" != ..* && "$KREL" != /* ]] || { echo "FATAL: drivers/kernelsu resolves outside the tree: '$KREL'" >&2; exit 1; }
          echo "drivers/kernelsu resolves to: $KREL"
          SUB_PATH=""; SUB_SHA=""
          while read -r mode sha stage path; do
            [[ "$mode" == "160000" ]] || continue
            if [[ "$KREL" == "$path" || "$KREL" == "$path"/* ]]; then SUB_PATH="$path"; SUB_SHA="$sha"; fi
          done < <(git ls-files -s)
          [[ -n "$SUB_PATH" ]] || { echo "FATAL: no submodule gitlink covers '$KREL' (in-tree KernelSU is not supported here — UNVERIFIED — REQUIRES CONFIRMATION)" >&2; exit 1; }
          [[ "$SUB_PATH" == "$KSU_SUBMODULE_PATH" ]] || { echo "FATAL: KernelSU gitlink path '$SUB_PATH' != expected '$KSU_SUBMODULE_PATH'" >&2; exit 1; }
          [[ -f .gitmodules ]] || { echo "FATAL: gitlink '$SUB_PATH' present but .gitmodules missing" >&2; exit 1; }
          NAME="$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | awk -v p="$SUB_PATH" '$2==p {sub(/^submodule\./,"",$1); sub(/\.path$/,"",$1); print $1}')"
          [[ -n "$NAME" ]] || { echo "FATAL: no .gitmodules entry for gitlink '$SUB_PATH'" >&2; exit 1; }
          URL="$(git config -f .gitmodules --get "submodule.${NAME}.url")"
          [[ "$URL" == "$KSU_REPO_URL" ]] || { echo "FATAL: submodule URL '$URL' != expected '$KSU_REPO_URL'" >&2; exit 1; }
          echo "submodule: path=$SUB_PATH url=$URL recorded-commit=$SUB_SHA"
          git submodule update --init --checkout -- "$SUB_PATH" \
            || { echo "FATAL: could not fetch submodule $SUB_PATH from $URL at recorded commit $SUB_SHA (unreachable/private/force-pushed away)" >&2; exit 1; }
          # Full (non-shallow) submodule: KernelSU's build may run git rev-list/describe.
          if [[ "$(git -C "$SUB_PATH" rev-parse --is-shallow-repository)" == "true" ]]; then git -C "$SUB_PATH" fetch -q --unshallow; fi
          ACTUAL="$(git -C "$SUB_PATH" rev-parse HEAD)"
          [[ "$ACTUAL" == "$SUB_SHA" ]] || { echo "FATAL: submodule HEAD $ACTUAL != recorded gitlink commit $SUB_SHA" >&2; exit 1; }
          if [[ -n "$IN_KSU_COMMIT" && "$IN_KSU_COMMIT" != "$SUB_SHA" ]]; then
            echo "FATAL: ksu_commit input $IN_KSU_COMMIT != gitlink commit $SUB_SHA recorded by ${IN_BASE_REPO}@${BASE_PIN_SHA}. Set ksu_commit to $SUB_SHA (after reviewing the new KernelSU) or leave it empty." >&2; exit 1
          fi
          [[ -n "$IN_KSU_COMMIT" ]] || echo "::warning::ksu_commit empty; using the gitlink commit $SUB_SHA recorded by the base commit"
          # xxKSU kernel dir ships a Makefile (not Kbuild) — verified 2026-10-22.
          [[ -f "$KREL/Kconfig" && ( -f "$KREL/Kbuild" || -f "$KREL/Makefile" ) ]] \
            || { echo "FATAL: $KREL/Kconfig or $KREL/{Kbuild,Makefile} missing — KernelSU kernel dir layout unexpected (UNVERIFIED — REQUIRES CONFIRMATION)" >&2; exit 1; }
          echo "$ACTUAL" > "$ABS_LOG/ksu-commit.txt"
          {
            echo "layout: submodule"
            echo "kernel dir: $KREL"
            echo "submodule path: $SUB_PATH"
            echo "submodule url: $URL"
            echo "commit: $ACTUAL"
            echo "git describe: $(git -C "$SUB_PATH" describe --tags --always 2>&1 || true)"
          } | tee "$ABS_LOG/ksu-layout.txt"
          {
            echo "KSU_LAYOUT=submodule"
            echo "KSU_KERNEL_DIR=$KREL"
            echo "KSU_COMMIT_ACTUAL=$ACTUAL"
            echo "KSU_SUBMODULE_URL=$URL"
          } >> "$GITHUB_ENV"

      - name: Verify pre-integrated tree (SUSFS core, hook call sites, LSM path, Kbuild/Kconfig wiring)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # Report is also shipped as an unzipped artifact (replaces the Mk9r2 integration patch artifact).
          OUT="$ART_DIR/ksu-susfs-preintegration-verification.txt"
          { echo "base: $IN_BASE_REPO@$BASE_COMMIT (branch $BASE_BRANCH, $BASE_PIN_MODE)"
            echo "ksu layout: $KSU_LAYOUT dir=$KSU_KERNEL_DIR commit=$KSU_COMMIT_ACTUAL"; } > "$OUT"
          say() { echo "$*" | tee -a "$OUT"; }
          FAIL=0
          chk() {
            local d="$1" f="$2" p="$3"
            if grep -qE -- "$p" "$f" 2>/dev/null; then say "OK:    $d"; else say "FATAL: $d — /$p/ not found in $f"; FAIL=1; fi
          }
          # Expectations below were derived by static inspection of 16-xxksu-susfs@608aef85 + KernelSU@8e661a13
          # (2026-10-22). The Mk9r2 KernelSU-Next checks that do NOT exist in this tree (KSU_MANUAL_HOOK/KPROBES_HOOK
          # Kconfig, can_umount/path_umount, seccomp filter_count, selinux_cred()/selinux_inode() helpers, sys_read and
          # input hooks) were removed on purpose. For any other base/KSU commit these are UNVERIFIED — REQUIRES CONFIRMATION.
          # SUSFS core files
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [[ -s "$f" ]]; then say "OK:    $f"; else say "FATAL: missing $f"; FAIL=1; fi
          done
          chk "sched.h susfs task fields"       include/linux/sched.h 'u64 susfs_task_state;'
          chk "drivers/Kconfig sources KSU"     drivers/Kconfig 'source "drivers/kernelsu/Kconfig"'
          chk "drivers/Makefile builds KSU"     drivers/Makefile 'obj-\$\(CONFIG_KSU\)[[:space:]]*\+=[[:space:]]*kernelsu/'
          AVC_DEFS="$(grep -rn '^bool susfs_is_avc_log_spoofing_enabled = false;' security/selinux/avc.c fs/susfs.c 2>/dev/null | wc -l)"
          if [[ "$AVC_DEFS" -eq 1 ]] && grep -q '^bool susfs_is_avc_log_spoofing_enabled = false;' security/selinux/avc.c; then
            say "OK:    avc log spoofing flag defined once in avc.c"
          else
            say "FATAL: avc log spoofing flag definition unexpected ($AVC_DEFS)"; FAIL=1
          fi
          chk "susfs sus_path hook (namei.c)"   fs/namei.c 'susfs_is_inode_sus_path\('
          chk "susfs sus_path def (susfs.c)"    fs/susfs.c 'susfs_is_inode_sus_path\('
          # source call sites (the tree uses manual call sites + LSM hooks, not the syscall-table/branch-link/kprobe modes)
          chk "exec.c hook"                     fs/exec.c 'ksu_handle_execveat\('
          chk "open.c hook"                     fs/open.c 'ksu_handle_faccessat\('
          chk "stat.c hook"                     fs/stat.c 'ksu_handle_stat\('
          chk "reboot.c extern"                 kernel/reboot.c 'extern int ksu_handle_sys_reboot'
          chk "reboot.c call"                   kernel/reboot.c 'ksu_handle_sys_reboot\(magic1, magic2, cmd, &arg\)'
          # setresuid via LSM only (K = resolved KernelSU kernel dir)
          K="$KSU_KERNEL_DIR"
          chk "ksu_task_fix_setuid defined"     $K/hook/lsm_hooks_list.c 'ksu_task_fix_setuid'
          chk "LSM registration"                $K/hook/lsm_hooks_list.c 'LSM_HACK_INIT\(task_fix_setuid, ksu_task_fix_setuid\)'
          chk "setresuid impl"                  $K/hook/setuid_hook.c 'ksu_handle_setresuid_cred'
          chk "ksu_handle_sys_reboot impl"      $K/supercall/supercall.c '^int ksu_handle_sys_reboot\('
          if grep -q 'ksu_handle_setresuid' kernel/sys.c 2>/dev/null; then
            say "FATAL: kernel/sys.c calls ksu_handle_setresuid directly"; FAIL=1
          else
            say "OK:    kernel/sys.c has no direct setresuid hook (LSM path only)"
          fi
          chk "Kconfig KSU_LSM_SECURITY_HOOKS"  $K/Kconfig 'config KSU_LSM_SECURITY_HOOKS'
          chk "Kconfig KSU_TAMPER_SYSCALL_TABLE" $K/Kconfig 'config KSU_TAMPER_SYSCALL_TABLE'
          chk "Kconfig KSU_HACK_ARM64_BRANCH_LINK" $K/Kconfig 'config KSU_HACK_ARM64_BRANCH_LINK'
          chk "Kconfig KSU_KPROBES_KSUD"        $K/Kconfig 'config KSU_KPROBES_KSUD'
          chk "Kconfig KSU_SUSFS"               $K/Kconfig 'config KSU_SUSFS$'
          { echo "--- drivers wiring (informational) ---"
            ls -la drivers | grep -i kernelsu || echo "no drivers/*kernelsu* entry"
            grep -in kernelsu drivers/Makefile drivers/Kconfig 2>/dev/null || echo "no kernelsu ref"
          } | tee "$ABS_LOG/ksu-wiring.txt"
          if [[ "$FAIL" -ne 0 ]]; then
            say "Pre-integration of ${IN_BASE_REPO}@${BASE_PIN_SHA} (${BASE_BRANCH}) does not match the verified expectations — failing closed."
            say "Each FATAL above is UNVERIFIED — REQUIRES CONFIRMATION: either the branch/KernelSU commit changed or an expectation here is stale. Fix the base or update the check after review; do NOT bypass."
            exit 1
          fi
          say "PASS: pre-integrated tree verified"

      # ── 6. Identity (CI-time, cosmetic) ────────────────────────────────────
      - name: Apply build identity (CI-time patch, no push)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' "$DEFCONFIG"
          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' "$BRAND" "$KBUILD_BUILD_HOST" >> "$DEFCONFIG"
          printf '#!/bin/sh\nprintf "%%s" "%s"\n' "$BRAND" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "$BRAND" > localversion
          echo "identity applied: brand=$BRAND host=$KBUILD_BUILD_HOST"

      # ── 6b. CI-time patch: bcmdhd_101_16 -Werror (GCC 13 failures) ─────────
      # The driver Makefile adds -Werror via ccflags, which is placed AFTER KCFLAGS and
      # therefore beats -Wno-error (reproduced on GCC 13.3 against xthorfinnx/16:
      # -Werror=address in wl_android.c/dhd_pktlog.c, -Werror=maybe-uninitialized in
      # wl_bigdata.c). Only build files are edited; C-source comments are left alone.
      - name: CI-time patch — drop -Werror from bcmdhd_101_16 build files
        if: ${{ inputs.relax_bcmdhd_werror }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          D=drivers/net/wireless/bcmdhd_101_16
          [[ -d "$D" ]] || { echo "::warning::$D not found — nothing to patch"; exit 0; }
          { grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" || echo "no -Werror found (before)"; } | tee "$ABS_LOG/bcmdhd-werror-before.txt"
          mapfile -t F < <(grep -rlE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" || true)
          for f in "${F[@]}"; do
            sed -i -E ':a;s/(^|[[:space:]])-Werror(=[A-Za-z0-9_-]+)?([[:space:]]|$)/\1\3/;ta' "$f"
            echo "patched: $f"
          done
          if grep -rqE --include='Makefile' --include='Kbuild' --include='*.mk' -e '(^|[[:space:]])-Werror(=[A-Za-z0-9_-]+)?([[:space:]]|$)' "$D"; then
            echo "FATAL: -Werror still present in bcmdhd build files" >&2
            grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" >&2 || true
            exit 1
          fi
          { grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$D" || echo "no -Werror remains in build files"; } | tee "$ABS_LOG/bcmdhd-werror-after.txt"

      # ── 7. Optional Chimera overlay (chimera-full / apply_optional_overlay) ─
      # Active when profile=chimera-full or apply_optional_overlay=true. overlay_profile (full | lite |
      # security-only) selects the mk/grep source-overlay set; the stack-protector edit below and
      # chimera-device-specific.cfg apply in ALL active forms. None of this is required for KSU/SUSFS or boot.
      - name: Optional overlay — stack protector + hooks.c selinux_cred() consistency (only if tree has selinux_cred)
        if: ${{ env.APPLY_OVERLAY == 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          # CONFIG_CC_STACKPROTECTOR is a hidden def_bool selected by the choice
          # (NONE | REGULAR | STRONG); setting it directly is ignored and the choice
          # falls back to NONE. Select the choice member instead.
          sed -i -E '/^(# )?CONFIG_CC_STACKPROTECTOR(_NONE|_REGULAR|_STRONG)?([= ]|$)/d' "$DEFCONFIG"
          printf '# CONFIG_CC_STACKPROTECTOR_NONE is not set\nCONFIG_CC_STACKPROTECTOR_REGULAR=y\n# CONFIG_CC_STACKPROTECTOR_STRONG is not set\n' >> "$DEFCONFIG"
          # The selinux_cred() conversion only makes sense when objsec.h provides selinux_cred() (the Mk9r2 gavdoc38
          # backport). 16-xxksu-susfs@608aef85 uses native cred->security (no helper): converting would break the build,
          # so the pass is N/A there. Gated, logged, never silent.
          if grep -qE 'selinux_cred\(' security/selinux/include/objsec.h; then
          python3 - <<'PYEOF'
          import re, sys
          from pathlib import Path
          MARKER = "CMK9_HOOKS_C_SELINUX_CRED_CONSISTENCY"
          p = Path("security/selinux/hooks.c")
          src = p.read_text()
          if MARKER in src:
              print("hooks.c: already applied"); sys.exit(0)
          subs = [
              (r'\btsec = cred->security;', 'tsec = selinux_cred(cred);'),
              (r'const struct task_security_struct \*tsec = cred->security;',
               'const struct task_security_struct *tsec = selinux_cred(cred);'),
              (r'const struct task_security_struct \*tsec = current_security\(\);',
               'const struct task_security_struct *tsec = selinux_cred(current_cred());'),
              (r'rc = selinux_determine_inode_label\(current_security\(\)',
               'rc = selinux_determine_inode_label(selinux_cred(current_cred())'),
              (r'\bold_tsec = current_security\(\);', 'old_tsec = selinux_cred(current_cred());'),
              (r'\bnew_tsec = bprm->cred->security;', 'new_tsec = selinux_cred(bprm->cred);'),
              (r'rc = selinux_determine_inode_label\(old->security',
               'rc = selinux_determine_inode_label(selinux_cred(old)'),
              (r'\btsec = new->security;', 'tsec = selinux_cred(new);'),
              (r'\btsec = new_creds->security;', 'tsec = selinux_cred(new_creds);'),
              (r'\bold_tsec = old->security;', 'old_tsec = selinux_cred(old);'),
              (r'const struct task_security_struct \*old_tsec = old->security;',
               'const struct task_security_struct *old_tsec = selinux_cred(old);'),
              (r'struct task_security_struct \*tsec = new->security;',
               'struct task_security_struct *tsec = selinux_cred(new);'),
              (r'__tsec = current_security\(\);', '__tsec = selinux_cred(current_cred());'),
              (r'__tsec = __task_cred\(p\)->security;', '__tsec = selinux_cred(__task_cred(p));'),
          ]
          total = 0
          for pat, rep in subs:
              src, n = re.subn(pat, rep, src)
              if n:
                  print(f"  converted {n}: {pat}"); total += n
          if total:
              p.write_text(f"/* {MARKER} */\n" + src)
              print(f"hooks.c: {total} sites converted")
          else:
              print("hooks.c: no applicable sites")
          PYEOF
            for fn in selinux_cred_alloc_blank selinux_cred_free selinux_cred_prepare selinux_cred_transfer; do
              grep -q "$fn" security/selinux/hooks.c || { echo "FATAL: $fn missing from hooks.c" >&2; exit 1; }
            done
            REMAINING="$(grep -cE 'rc = selinux_determine_inode_label\((current_security\(\)|old->security)' security/selinux/hooks.c || true)"
            [[ "${REMAINING:-0}" -eq 0 ]] || { echo "FATAL: $REMAINING unconverted sites" >&2; exit 1; }
            echo "PASS: hooks.c consistency pass"
          else
            echo "::notice::hooks.c selinux_cred() pass N/A: objsec.h has no selinux_cred() (native cred->security tree); stack-protector edit applied only"
          fi

      - name: Optional overlay — Chimera overlay script and marker verification (profile full)
        if: ${{ env.OVERLAY_PROFILE_EFFECTIVE == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/patches/apply_chimera_overlay_patches.sh" 2>&1 | tee "$ABS_LOG/overlay.log"
          FAIL=0
          mk() { grep -q "$2" "$3" 2>/dev/null && echo "OK:    $1" || { echo "FATAL: $1 — marker $2 missing in $3"; FAIL=1; }; }
          mk "UFC short-circuit"     CMK9_UFC_SHORT_CIRCUIT        drivers/cpufreq/exynos-ufc.c
          mk "mem_rw SUS_MAP guard"  CMK9_MEM_RW_SUS_MAP_GUARD     fs/proc/base.c
          mk "board DTS tuning"      CMK9_DTS_BOARD_TUNING         arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts
          mk "sugov rate limit"      CMK9_SUGOV_RATE_LIMIT         kernel/sched/cpufreq_schedutil.c
          mk "sugov kthread prio"    CMK9_SUGOV_KTHREAD_PRIORITY   kernel/sched/cpufreq_schedutil.c
          mk "sugov_init rate limit" CMK9_SUGOV_INIT_RATE_LIMIT    kernel/sched/cpufreq_schedutil.c
          grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c && echo "OK:    fair.c min_granularity" || { echo "FATAL: fair.c min_granularity"; FAIL=1; }
          grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c && echo "OK:    fair.c migration_cost" || { echo "FATAL: fair.c migration_cost"; FAIL=1; }
          grep -q 'Allow internal boot ROM / SPI interface to become ready' drivers/mfd/madera-core.c && echo "OK:    madera-core settle delay" || { echo "FATAL: madera-core settle delay"; FAIL=1; }
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: overlay markers present"

      - name: Optional overlay — Chimera LITE overlay script and marker verification (profile lite)
        if: ${{ env.OVERLAY_PROFILE_EFFECTIVE == 'lite' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/patches/apply_chimera_overlay_lite.sh" 2>&1 | tee "$ABS_LOG/overlay.log"
          FAIL=0
          mk() { grep -q "$2" "$3" 2>/dev/null && echo "OK:    $1" || { echo "FATAL: $1 — marker $2 missing in $3"; FAIL=1; }; }
          mk "UFC short-circuit"      CMK9_UFC_SHORT_CIRCUIT        drivers/cpufreq/exynos-ufc.c
          mk "mem_rw SUS_MAP guard"   CMK9_MEM_RW_SUS_MAP_GUARD     fs/proc/base.c
          mk "sugov rate limit"       CMK9_SUGOV_RATE_LIMIT         kernel/sched/cpufreq_schedutil.c
          mk "sugov kthread prio"     CMK9_SUGOV_KTHREAD_PRIORITY   kernel/sched/cpufreq_schedutil.c
          mk "sugov_init rate limit"  CMK9_SUGOV_INIT_RATE_LIMIT    kernel/sched/cpufreq_schedutil.c
          grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c && echo "OK:    fair.c min_granularity" || { echo "FATAL: fair.c min_granularity"; FAIL=1; }
          grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c && echo "OK:    fair.c migration_cost" || { echo "FATAL: fair.c migration_cost"; FAIL=1; }
          # lite must NOT carry the full-only DTS tuning
          if grep -q 'CMK9_DTS_BOARD_TUNING' arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts; then
            echo "FATAL: DTS board tuning present in lite profile"; FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: lite overlay markers present (5 mk + 2 fair.c), no DTS tuning"

      - name: Optional overlay — security-only (no Chimera mk/grep source overlays) leak check
        if: ${{ env.OVERLAY_PROFILE_EFFECTIVE == 'security-only' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          FAIL=0
          leak() { if grep -q "$1" "$2" 2>/dev/null; then echo "FATAL: marker $1 present in $2 (profile security-only)"; FAIL=1; fi; }
          leak CMK9_UFC_SHORT_CIRCUIT        drivers/cpufreq/exynos-ufc.c
          leak CMK9_MEM_RW_SUS_MAP_GUARD     fs/proc/base.c
          leak CMK9_NAMEI_SUS_PATH_RECHECK   fs/namei.c
          leak CMK9_DTS_BOARD_TUNING         arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts
          leak CMK9_SUGOV_RATE_LIMIT         kernel/sched/cpufreq_schedutil.c
          leak CMK9_SUGOV_KTHREAD_PRIORITY   kernel/sched/cpufreq_schedutil.c
          leak CMK9_SUGOV_INIT_RATE_LIMIT    kernel/sched/cpufreq_schedutil.c
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: overlay_profile=security-only — no Chimera mk overlay markers present (stack-protector / device cfg still applied)"

      # ── 8. Kconfig ─────────────────────────────────────────────────────────
      - name: Configure kernel (defconfig + optional device cfg merge + hook-mode assertions)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          source "$CI_LIB"
          chimera_toolchain_args

          # KSU + SUSFS come from the base defconfig (verified 2026-10-22: CONFIG_KSU=y + SUSFS symbols, Kconfig
          # defaults give LSM_SECURITY_HOOKS=y, TAMPER/BRANCH_LINK/KPROBES_KSUD off). chimera-ksu-susfs.cfg is NOT merged.
          FRAGS=()
          if [[ "$APPLY_OVERLAY" == "true" ]]; then
            cp "$GITHUB_WORKSPACE/chimera-device-specific.cfg" /tmp/chimera-device-specific.cfg
            FRAGS+=(/tmp/chimera-device-specific.cfg)
          fi
          # Fragment cleanup (CI-time, temp copies only; repo files are not modified).
          # Carried over from Mk9r2 (symbols verified absent/hidden in xthorfinnx/16); idempotent. The device cfg
          # merged cleanly on 16-xxksu-susfs@608aef85 in a dry run, so this is a no-op safeguard.
          DROP_SYMS=(
            CONFIG_KSU_SUSFS_SPOOF_SELINUX CONFIG_KSU_KPROBES_HOOK
            CONFIG_UH_RKP CONFIG_RKP_KDP CONFIG_SEC_RESTRICT_SETUID CONFIG_FIVE CONFIG_DEFEX CONFIG_SECURITY_DEFEX
            CONFIG_DEFAULT_NET_SCH CONFIG_DEFAULT_FQ_CODEL CONFIG_CRC32_ARMV8_CRC CONFIG_MFD_CS47L92_GPIO
          )
          : > "$ABS_LOG/fragment-cleanup.txt"
          for fr in ${FRAGS[@]+"${FRAGS[@]}"}; do
            for sym in "${DROP_SYMS[@]}"; do
              if grep -qE "^(# )?${sym}(=.*| is not set)?\$" "$fr"; then
                grep -nE "^(# )?${sym}(=.*| is not set)?\$" "$fr" | sed "s|^|$(basename "$fr"): removed |" | tee -a "$ABS_LOG/fragment-cleanup.txt"
                sed -i -E "/^(# )?${sym}(=.*| is not set)?\$/d" "$fr"
              fi
            done
          done
          [[ -s "$ABS_LOG/fragment-cleanup.txt" ]] || echo "fragment cleanup: nothing to remove (no fragments, or already clean)" | tee "$ABS_LOG/fragment-cleanup.txt"

          chimera_make "$(basename "$DEFCONFIG")" | tee "$ABS_LOG/defconfig-base.log"
          if [[ "${#FRAGS[@]}" -gt 0 ]]; then
            scripts/kconfig/merge_config.sh -m -O "$ABS_OUT" "$ABS_OUT/.config" "${FRAGS[@]}" | tee "$ABS_LOG/merge-config.log"
          fi
          chimera_make olddefconfig | tee -a "$ABS_LOG/merge-config.log"

          CFG="$ABS_OUT/.config"
          # Hook-mode assertions on the FINAL .config (fail-closed; nothing is force-enabled here).
          for s in CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_LSM_SECURITY_HOOKS; do
            grep -qE "^${s}=y$" "$CFG" || { echo "FATAL: ${s}=y missing from final .config — KernelSU/SUSFS not enabled as the tree's call sites expect" >&2; exit 1; }
          done
          for s in CONFIG_KSU_TAMPER_SYSCALL_TABLE CONFIG_KSU_HACK_ARM64_BRANCH_LINK CONFIG_KSU_KPROBES_KSUD; do
            if grep -qE "^${s}=y$" "$CFG"; then echo "FATAL: ${s}=y — the tree is wired for source call sites + LSM hooks; this hook mode would double-hook (UNVERIFIED — REQUIRES CONFIRMATION)" >&2; exit 1; fi
          done

          # Fragment symbols that Kconfig silently dropped (e.g. not defined in this tree).
          : > "$ABS_LOG/fragment-dropped-symbols.txt"
          for fr in ${FRAGS[@]+"${FRAGS[@]}"}; do
            while read -r sym; do
              if ! grep -qE "^${sym}=|^# ${sym} is not set" "$CFG"; then
                echo "$sym (from $(basename "$fr"))" | tee -a "$ABS_LOG/fragment-dropped-symbols.txt"
                echo "::warning::fragment symbol $sym is not defined in this tree (dropped by Kconfig)"
              fi
            done < <(grep -oE '^(# )?CONFIG_[A-Za-z0-9_]+' "$fr" | sed 's/^# //' | sort -u)
          done

          cp "$CFG" "$ABS_LOG/final.config"
          FINAL_CONFIG_HASH="$(sha256sum "$CFG" | cut -d' ' -f1)"
          echo "FINAL_CONFIG_HASH=$FINAL_CONFIG_HASH" >> "$GITHUB_ENV"
          echo "final .config sha256: $FINAL_CONFIG_HASH"
          echo "PASS: KernelSU source-call-site + LSM hook mode confirmed on final .config"

      - name: Config guard (required symbols; Samsung security symbols)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          CFG="$ABS_OUT/.config"
          # Required-symbol sets, appended conditionally below:
          #   BASE     — always: KSU + SUSFS sus_path + LSM hooks, plus SoC/DTS/SELinux/task_struct prerequisites.
          #   SECURITY — any active overlay (security-only | lite | full): stack-protector REGULAR (the edit is
          #              applied in every active form) and SUSFS sus_kstat.
          #   LITE     — lite | full: what the mk/grep source overlays need compiled in: SUS_MAP (mem_rw guard is
          #              #ifdef CONFIG_KSU_SUSFS_SUS_MAP), schedutil (sugov x3), Exynos UFC (UFC short-circuit).
          #   FULL     — full only: device-cfg symbols asserted only for the full set (DTS + madera patch):
          #              HZ_300, BBR/FQ/FQ_CoDel network stack, Madera/CS47L92 audio codec.
          # (chimera-device-specific.cfg is still merged in every active form; lite/security-only just don't assert FULL.)
          # Names verified on the 16-xxksu-susfs@608aef85 olddefconfig (2026-10-22); a missing symbol fails the build.
          REQUIRED_BASE=(CONFIG_KSU CONFIG_KSU_SUSFS CONFIG_KSU_SUSFS_SUS_PATH CONFIG_KSU_LSM_SECURITY_HOOKS CONFIG_THREAD_INFO_IN_TASK CONFIG_SECURITY_SELINUX CONFIG_SOC_EXYNOS9810 CONFIG_DTS_9810_STAR2)
          REQUIRED_SECURITY=(CONFIG_CC_STACKPROTECTOR CONFIG_CC_STACKPROTECTOR_REGULAR CONFIG_KSU_SUSFS_SUS_KSTAT)
          REQUIRED_LITE=(CONFIG_KSU_SUSFS_SUS_MAP CONFIG_CPU_FREQ_GOV_SCHEDUTIL CONFIG_ARM_EXYNOS_UFC)
          REQUIRED_FULL=(CONFIG_HZ_300 CONFIG_TCP_CONG_ADVANCED CONFIG_TCP_CONG_BBR CONFIG_TCP_CONG_CUBIC CONFIG_DEFAULT_BBR CONFIG_NET_SCHED CONFIG_NET_SCH_FQ CONFIG_NET_SCH_FQ_CODEL CONFIG_MFD_MADERA CONFIG_MFD_MADERA_SPI CONFIG_MFD_CS47L92 CONFIG_PINCTRL_MADERA CONFIG_GPIO_MADERA)
          FORBIDDEN=(CONFIG_RKP_KDP CONFIG_UH_RKP CONFIG_TIMA CONFIG_TIMA_LKMAUTH CONFIG_FIVE CONFIG_SEC_RESTRICT_ROOTING CONFIG_SEC_RESTRICT_SETUID CONFIG_SECURITY_DEFEX CONFIG_KNOX_KAP)
          REQUIRED=("${REQUIRED_BASE[@]}")
          SETS="BASE"
          case "$OVERLAY_PROFILE_EFFECTIVE" in
            off) ;;
            security-only) REQUIRED+=("${REQUIRED_SECURITY[@]}"); SETS+="+SECURITY" ;;
            lite)          REQUIRED+=("${REQUIRED_SECURITY[@]}" "${REQUIRED_LITE[@]}"); SETS+="+SECURITY+LITE" ;;
            full)          REQUIRED+=("${REQUIRED_SECURITY[@]}" "${REQUIRED_LITE[@]}" "${REQUIRED_FULL[@]}"); SETS+="+SECURITY+LITE+FULL" ;;
            *) echo "FATAL: unexpected OVERLAY_PROFILE_EFFECTIVE '$OVERLAY_PROFILE_EFFECTIVE'" >&2; exit 1 ;;
          esac
          FAIL=0
          : > "$ABS_LOG/config-guard.log"
          echo "guard symbol sets: $SETS (overlay profile: $OVERLAY_PROFILE_EFFECTIVE)" | tee -a "$ABS_LOG/config-guard.log"
          for s in "${REQUIRED[@]}"; do
            if grep -qE "^${s}=y$" "$CFG"; then echo "OK: $s=y" | tee -a "$ABS_LOG/config-guard.log"
            else echo "FATAL: $s not enabled" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1; fi
          done
          if [[ "$APPLY_OVERLAY" == "true" ]]; then
            for s in CONFIG_CC_STACKPROTECTOR_NONE CONFIG_CC_STACKPROTECTOR_STRONG; do
              if grep -qE "^${s}=y$" "$CFG"; then echo "FATAL: $s=y (overlay requires CC_STACKPROTECTOR_REGULAR)" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1; fi
            done
          fi
          for s in "${FORBIDDEN[@]}"; do
            if grep -qE "^${s}=y$" "$CFG"; then
              if [[ "$APPLY_OVERLAY" == "true" ]]; then echo "FATAL: $s=y (active overlay requires off)" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1
              else echo "INFO: $s=y (boot-first: left as base has it)" | tee -a "$ABS_LOG/config-guard.log"; fi
            else echo "OK: $s not =y" | tee -a "$ABS_LOG/config-guard.log"; fi
          done
          # Hook-mode exclusivity (re-checked on the FINAL .config): only source call sites + LSM hooks are allowed.
          for s in CONFIG_KSU_TAMPER_SYSCALL_TABLE CONFIG_KSU_HACK_ARM64_BRANCH_LINK CONFIG_KSU_KPROBES_KSUD; do
            if grep -qE "^${s}=y$" "$CFG"; then echo "FATAL: $s=y (conflicts with the tree's source call-site hooks)" | tee -a "$ABS_LOG/config-guard.log"; FAIL=1; fi
          done
          grep -E '^(CONFIG_KSU|CONFIG_SECURITY|CONFIG_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_LOCALVERSION|CONFIG_KPROBES|CONFIG_KRETPROBES|CONFIG_DEBUG_INFO_BTF|CONFIG_HZ_)' "$CFG" > "$ABS_LOG/config-summary.txt" || true
          [[ "$FAIL" -eq 0 ]] || exit 1

      - name: Config-only scope — stop notice
        if: ${{ inputs.build_scope == 'config-only' }}
        run: echo "::notice::build_scope=config-only — config and .config validated only; no compile, link, packaging, boot or KSU/SUSFS runtime validation was performed."

      # ── 9. Build (build_scope=full only) ───────────────────────────────────
      - name: Build kernel Image, vmlinux and DTBs
        if: ${{ inputs.build_scope == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          source "$CI_LIB"
          chimera_toolchain_args
          echo "BUILD_KCFLAGS=$BUILD_KCFLAGS" >> "$GITHUB_ENV"
          {
            echo "Toolchain: $TOOLCHAIN"
            echo "Compiler: $COMPILER_VERSION"
            echo "Linker: $LINKER_VERSION"
            echo "KCFLAGS: $BUILD_KCFLAGS"
            echo "KBUILD_LDFLAGS: (not passed)"
            printf 'make arg: %s\n' "${TOOLCHAIN_ARGS[@]}"
          } | tee "$ABS_LOG/build-flags.txt"
          chimera_make -j"$(nproc)" "KCFLAGS=$BUILD_KCFLAGS" Image vmlinux dtbs 2>&1 | tee "$ABS_LOG/build.log"

      - name: Verify compiler identity, kernel release, hook symbols and DTB
        if: ${{ inputs.build_scope == 'full' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          VMLINUX="$ABS_OUT/vmlinux"
          [[ -s "$ABS_OUT/arch/arm64/boot/Image" ]] || { echo "FATAL: Image missing/empty" >&2; exit 1; }
          [[ -s "$VMLINUX" ]] || { echo "FATAL: vmlinux missing/empty" >&2; exit 1; }
          [[ -s "$ABS_OUT/arch/arm64/boot/$STAR2_DTB_REL" ]] || { echo "FATAL: star2lte DTB missing: arch/arm64/boot/$STAR2_DTB_REL — UNVERIFIED — REQUIRES CONFIRMATION: STAR2_DTB_REL / CONFIG_DTS_9810_STAR2 output for ${IN_BASE_REPO}@${BASE_PIN_SHA}" >&2; exit 1; }

          # 1) actual release
          REL="$(cat "$ABS_OUT/include/config/kernel.release")"
          echo "KERNEL_RELEASE_ACTUAL=$REL" >> "$GITHUB_ENV"
          echo "expected: $KERNEL_RELEASE_EXPECTED  actual: $REL"
          [[ "$REL" == "$KERNEL_VERSION"* ]] || { echo "FATAL: release '$REL' does not start with $KERNEL_VERSION" >&2; exit 1; }
          [[ "$REL" == "$KERNEL_RELEASE_EXPECTED" ]] || echo "::warning::kernel.release '$REL' != expected '$KERNEL_RELEASE_EXPECTED'"

          # 2) compiler that actually built vmlinux
          readelf -p .comment "$VMLINUX" > "$ABS_LOG/vmlinux-comment.txt" 2>&1 || true
          cat "$ABS_LOG/vmlinux-comment.txt"
          if grep -qE '\S' "$ABS_LOG/vmlinux-comment.txt" && ! grep -qi 'no section\|not found' "$ABS_LOG/vmlinux-comment.txt"; then
            if [[ "$TOOLCHAIN" == "gcc" ]]; then
              grep -q 'GCC:' "$ABS_LOG/vmlinux-comment.txt" || { echo "FATAL: GCC selected but vmlinux .comment has no GCC entry" >&2; exit 1; }
            else
              grep -qi 'clang' "$ABS_LOG/vmlinux-comment.txt" || { echo "FATAL: LLVM selected but vmlinux .comment has no clang entry" >&2; exit 1; }
            fi
            echo "OK: compiler identity matches selection"
          else
            echo "::warning::.comment section unavailable — compiler identity not proven from vmlinux"
          fi

          # 3) symbols (use the selected nm, without the ccache prefix)
          # Source call sites exist only for execveat/faccessat/stat/reboot in this tree (no sys_read / input hooks);
          # symbol NAMES are from static inspection only — UNVERIFIED — REQUIRES CONFIRMATION until a build passes.
          "$TC_NM" "$VMLINUX" > "$ABS_LOG/vmlinux-symbols.log" 2>&1 || true
          HARD=(ksu_handle_execveat ksu_handle_faccessat ksu_handle_stat ksu_handle_sys_reboot susfs_is_inode_sus_path)
          SOFT=(ksu_task_fix_setuid ksu_lsm_hook_init ksu_handle_setresuid_cred)
          FAIL=0
          for s in "${HARD[@]}"; do
            if grep -qE "^[0-9a-fA-F]+ [A-Za-z] ${s}(\.[A-Za-z0-9._]+)?$" "$ABS_LOG/vmlinux-symbols.log"; then echo "OK: $s"; else echo "FATAL: missing symbol $s"; FAIL=1; fi
          done
          for s in "${SOFT[@]}"; do
            if grep -qE "^[0-9a-fA-F]+ [A-Za-z] ${s}(\.[A-Za-z0-9._]+)?$" "$ABS_LOG/vmlinux-symbols.log"; then echo "OK: $s"; else echo "::warning::symbol $s not found (static/inlined/__init; confirm on device)"; fi
          done
          # The Mk9r2 kprobe-object exclusivity symbol scan (execve_kp, ...) was KernelSU-Next specific and is dropped;
          # hook-mode exclusivity is enforced on the final .config instead (KPROBES_KSUD/TAMPER/BRANCH_LINK must be off).
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: symbol/identity checks"

      - name: Collect artifacts and metadata
        if: ${{ inputs.build_scope == 'full' }}
        run: |
          set -Eeuo pipefail
          BOOT="$ABS_OUT/arch/arm64/boot"
          mkdir -p "$ART_DIR/dtb"
          cp "$BOOT/Image" "$ART_DIR/Image"
          [[ ! -f "$ABS_OUT/System.map" ]] || cp "$ABS_OUT/System.map" "$ART_DIR/System.map"
          cp "$ABS_OUT/.config" "$ART_DIR/final.config"
          [[ -s "$ART_DIR/ksu-susfs-preintegration-verification.txt" ]] || { echo "FATAL: KSU/SUSFS verification report missing (verification step did not run?)" >&2; exit 1; }
          ls -la "$BOOT" > "$ABS_LOG/boot-dir-listing.txt"
          find "$BOOT/dts" \( -name '*.dtb' -o -name '*.dtbo' \) 2>/dev/null | sort > "$ABS_LOG/all-dtbs.txt" || true
          # Exact star2lte DTB (CONFIG_DTS_9810_STAR2 -> exynos/exynos9810-star2lte_eur_open_26.dtb)
          DTB="$BOOT/$STAR2_DTB_REL"
          [[ -s "$DTB" ]] || { echo "FATAL: star2lte DTB missing: $DTB" >&2; exit 1; }
          cp "$DTB" "$ART_DIR/dtb/"
          echo "$DTB" | tee "$ABS_LOG/dtb-selected.txt"
          BUILD_TAG="chimera-mk9r3-${IN_PROFILE}-${IN_TOOLCHAIN}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"
          export BUILD_TAG
          # NOTE: identity/diagnostic .txt files (toolchain-identity, ksu-layout, ksu-commit, base-commit,
          # base-drift, fragment-*.txt) stay in the logs artifact only.
          python3 - <<'PYEOF'
          import json, os, hashlib, pathlib
          art = pathlib.Path(os.environ["ART_DIR"])
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          keys = ["BUILD_TAG","GITHUB_RUN_ID","IN_PROFILE","TOOLCHAIN","APPLY_OVERLAY","CHIMERA_REF","CHIMERA_SHA",
                  "IN_BASE_REPO","BASE_BRANCH","BASE_PIN_MODE","BASE_PIN_SHA","BASE_TIP","BASE_CMP_STATUS","BASE_COMMIT",
                  "KSU_LAYOUT","KSU_KERNEL_DIR","KSU_SUBMODULE_URL","IN_KSU_COMMIT","KSU_COMMIT_ACTUAL",
                  "COMPILER_VERSION","LINKER_VERSION","TC_CACHE_KEY","TC_IDENTITY_HASH","KERNEL_VERSION",
                  "KERNEL_RELEASE_EXPECTED","KERNEL_RELEASE_ACTUAL","BUILD_KCFLAGS","FINAL_CONFIG_HASH","UNAME_PREVIEW",
                  "KBUILD_BUILD_USER","KBUILD_BUILD_HOST","KBUILD_BUILD_VERSION","KBUILD_BUILD_TIMESTAMP","FULL_LLVM_MODE",
                   "TC_CC","TC_LD","TC_AR","TC_NM","TC_OBJCOPY","TC_OBJDUMP","TC_STRIP","TC_READELF",
                  "RELAX_BCMDHD_WERROR","OVERLAY_PROFILE_EFFECTIVE"]
          m = {k: os.environ.get(k, "") for k in keys}
          m["compatibility"] = ("Chimera Mk9r3 compatibility here means building the modified Exynos 9810 Linux 4.9.337 "
                                "vendor kernel for potential use with the Chimera Mk9r3 LineageOS 23.2 userspace based on "
                                "Android 16 QPR2. Runtime compatibility requires physical-device testing.")
          m["disclaimer"] = ("Compile-verified only; no claim of boot, root or SUSFS proof. CI build only. "
                             "Not proof of boot, root, SUSFS, SELinux, Samsung security, "
                             "flashability, vendor-blob, camera/modem/audio/thermal/charging, recovery, "
                             "boot-image, Android 16 QPR2 runtime, or any common-kernel ABI compatibility.")
          files = {str(p.relative_to(art)): sha(p) for p in sorted(art.rglob("*")) if p.is_file() and p.name not in ("manifest.json","SHA256SUMS")}
          m["artifacts_sha256"] = files
          (art / "manifest.json").write_text(json.dumps(m, indent=2))
          (art / "SHA256SUMS").write_text("".join(f"{h}  {n}\n" for n, h in files.items()))
          print(json.dumps(m, indent=2))
          PYEOF

      # ── 10. Optional AnyKernel3 packaging (UNVERIFIED for this device) ─────
      - name: Package AnyKernel3 ZIP (opt-in, UNVERIFIED packaging)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 "$ANYKERNEL_REPO" "$ANYKERNEL_DIR"
          git -C "$ANYKERNEL_DIR" rev-parse HEAD | tee "$ABS_LOG/anykernel3-commit.txt"
          rm -rf "$ANYKERNEL_DIR/.git" "$ANYKERNEL_DIR/.github"
          # Raw concatenation of DTBs — format UNVERIFIED — REQUIRES CONFIRMATION
          cat "$ART_DIR"/dtb/*.dtb > "$ART_DIR/dtb.img"
          [[ -s "$ART_DIR/dtb.img" ]] || { echo "FATAL: dtb.img empty" >&2; exit 1; }
          cp "$ART_DIR/Image" "$ANYKERNEL_DIR/Image"
          cp "$ART_DIR/dtb.img" "$ANYKERNEL_DIR/dtb"
          cat > "$ANYKERNEL_DIR/anykernel.sh" <<AK3SH
          ### AnyKernel3 script — Chimera Mk9r3 (packaging UNVERIFIED for this device)
          properties() { '
          kernel.string=${UNAME_PREVIEW} | ${TOOLCHAIN} | cfg_sha256=${FINAL_CONFIG_HASH:0:12} | base=${BASE_COMMIT:0:8} | ksu=${KSU_COMMIT_ACTUAL:0:8}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star2lte
          device.name2=star2ltexx
          device.name3=SM-G965F
          device.name4=SM-G965U
          device.name5=SM-G965N
          supported.versions=9-16
          '; }
          # Named-partition mode: let ak3-core.sh resolve BOOT across
          # by-name / bootdevice/by-name / platform/*/by-name, rather than
          # hardcoding the UFS controller node id (UNVERIFIED — REQUIRES CONFIRMATION).
          BLOCK=/dev/block/by-name/BOOT
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto

          . tools/ak3-core.sh

          dump_boot
          write_boot
          AK3SH
          ZIP="$ART_DIR/${BUILD_TAG}-AnyKernel3-UNVERIFIED.zip"
          ( cd "$ANYKERNEL_DIR" && zip -r9 "$ZIP" . )
          [[ -s "$ZIP" ]] || { echo "FATAL: zip empty" >&2; exit 1; }
          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"
          ( cd "$ART_DIR" && sha256sum dtb.img "$(basename "$ZIP")" >> SHA256SUMS )

      # ── 11. Uploads / release / diagnostics ────────────────────────────────
      # actions/upload-artifact@v7 with archive: false uploads ONE file, UNZIPPED; the
      # artifact name is the file name (the 'name' input is ignored). Hence one step per file.
      - name: Upload Image
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/Image
          archive: false
          if-no-files-found: error

      - name: Upload final.config
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/final.config
          archive: false
          if-no-files-found: error

      - name: Upload star2lte DTB
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          # basename of STAR2_DTB_REL (dts/exynos/exynos9810-star2lte_eur_open_26.dtb)
          path: artifacts/dtb/exynos9810-star2lte_eur_open_26.dtb
          archive: false
          if-no-files-found: error

      - name: Upload System.map
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/System.map
          archive: false
          if-no-files-found: ignore

      - name: Upload KSU/SUSFS pre-integration verification report
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ksu-susfs-preintegration-verification.txt
          archive: false
          if-no-files-found: error

      - name: Upload manifest.json
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/manifest.json
          archive: false
          if-no-files-found: error

      - name: Upload SHA256SUMS
        if: ${{ inputs.build_scope == 'full' }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/SHA256SUMS
          archive: false
          if-no-files-found: error

      - name: Upload dtb.img (opt-in packaging, UNVERIFIED)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/dtb.img
          archive: false
          if-no-files-found: error

      - name: Upload AnyKernel3 ZIP (opt-in packaging, UNVERIFIED)
        if: ${{ inputs.build_scope == 'full' && inputs.package_anykernel }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error

      - name: Failure diagnostics
        if: ${{ failure() }}
        run: |
          {
            echo "## Chimera Mk9r3 build FAILED"
            echo '```'
            if [[ -f "${ABS_LOG:-/nonexistent}/build.log" ]]; then
              grep -nE 'error:|Error [0-9]+|undefined reference|multiple definition|No such file' "$ABS_LOG/build.log" | head -n 60 || true
              echo "--- tail ---"
              tail -n 40 "$ABS_LOG/build.log"
            else
              echo "no build.log — failure occurred before/outside the kernel build; see step logs"
            fi
            echo '```'
            echo "### base / KernelSU-SUSFS pre-integration diagnostics"
            echo '```'
            for f in base-drift.txt base-commit.txt ksu-layout.txt ksu-commit.txt ksu-wiring.txt fragment-cleanup.txt fragment-dropped-symbols.txt config-guard.log bcmdhd-werror-before.txt bcmdhd-werror-after.txt; do
              if [[ -f "${ABS_LOG:-/nonexistent}/$f" ]]; then echo "--- $f ---"; head -n 40 "$ABS_LOG/$f"; fi
            done
            if [[ -f "${ART_DIR:-/nonexistent}/ksu-susfs-preintegration-verification.txt" ]]; then
              echo "--- ksu-susfs-preintegration-verification.txt ---"; head -n 80 "$ART_DIR/ksu-susfs-preintegration-verification.txt"
            fi
            echo '```'
            if [[ -d "${ABS_KERNEL:-/nonexistent}" ]]; then
              echo "### bcmdhd / refcount diagnostics"
              echo '```'
              echo "--- bcmdhd_101_16 -Werror (build files) ---"
              grep -rnE --include='Makefile' --include='Kbuild' --include='*.mk' -e '-Werror' "$ABS_KERNEL/drivers/net/wireless/bcmdhd_101_16" 2>/dev/null | head -n 20 || true
              echo "--- include/linux/refcount.h 195-245 ---"
              sed -n '195,245p' "$ABS_KERNEL/include/linux/refcount.h" 2>&1 || true
              echo "--- CONFIG_REFCOUNT* ---"
              grep -n "REFCOUNT" "${ABS_OUT:-/nonexistent}/.config" 2>/dev/null || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "## Chimera Mk9r3 — ${IN_PROFILE} / ${IN_TOOLCHAIN}"
            echo "- build scope: ${IN_BUILD_SCOPE}"
            if [[ "$IN_BUILD_SCOPE" == "config-only" ]]; then
              echo "- **config-only**: patches applied and final .config validated; NOTHING was compiled, linked, packaged or released. No KSU/SUSFS runtime behavior, boot or packaging was validated."
            fi
            echo "- overlay applied: ${APPLY_OVERLAY} (profile: ${OVERLAY_PROFILE_EFFECTIVE})"
            echo "- Project_Chimera pin: ${CHIMERA_SHA:-n/a}"
            echo "- brand: ${BRAND:-n/a}"
            echo "- kernel base: ${IN_BASE_REPO}@${BASE_COMMIT:-${BASE_PIN_SHA:-n/a}} (branch ${BASE_BRANCH:-n/a}, ${BASE_PIN_MODE:-n/a}, live tip ${BASE_TIP:-n/a})"
            echo "- KSU/SUSFS: pre-integrated in base (no CI-time patch); KernelSU layout ${KSU_LAYOUT:-n/a} at ${KSU_KERNEL_DIR:-n/a}"
            echo "- KernelSU: ${KSU_COMMIT_ACTUAL:-n/a}"
            echo "- compiler: ${COMPILER_VERSION:-n/a}"
            echo "- kernel release: ${KERNEL_RELEASE_ACTUAL:-n/a}"
            echo
            echo "Chimera Mk9r3 compatibility here means building the modified Exynos 9810 Linux 4.9.337 vendor kernel for potential use with the Chimera Mk9r3 LineageOS 23.2 userspace based on Android 16 QPR2. Runtime compatibility requires physical-device testing. A green build proves none of: boot, root, SUSFS, SELinux, Samsung RKP/TIMA/KNOX, flashability, vendor blobs, camera, modem, audio, thermal, charging, recovery, boot-image layout, or ABI compatibility."
          } >> "$GITHUB_STEP_SUMMARY"

      # Build logs are many files, so they stay ONE zipped artifact (archive: false allows a single file only).
      - name: Upload build logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chimera-mk9r3-logs-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/**
          if-no-files-found: warn

  # Separate job: the ONLY place with contents: write. Runs only when requested and the build job succeeded.
  # Compile-verified only — no claim of boot/root/SUSFS proof.
  release:
    name: Release ${{ inputs.profile }} / ${{ inputs.toolchain }}
    needs: build
    if: ${{ inputs.do_release && inputs.build_scope == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      # download-artifact@v8 is required for the unzipped (archive: false) artifacts uploaded by upload-artifact@v7.
      - name: Download Image
        uses: actions/download-artifact@v8
        with:
          name: Image
          path: release-assets

      - name: Download final.config
        uses: actions/download-artifact@v8
        with:
          name: final.config
          path: release-assets

      - name: Download manifest.json
        uses: actions/download-artifact@v8
        with:
          name: manifest.json
          path: release-assets

      - name: Download SHA256SUMS
        uses: actions/download-artifact@v8
        with:
          name: SHA256SUMS
          path: release-assets

      - name: Download KSU/SUSFS pre-integration verification report
        uses: actions/download-artifact@v8
        with:
          name: ksu-susfs-preintegration-verification.txt
          path: release-assets

      - name: Verify assets against SHA256SUMS and render release body from manifest.json
        id: prep
        run: |
          set -Eeuo pipefail
          cd release-assets
          for f in Image final.config manifest.json SHA256SUMS ksu-susfs-preintegration-verification.txt; do
            [[ -s "$f" ]] || { echo "FATAL: missing/empty release asset $f" >&2; exit 1; }
          done
          grep -E '^[0-9a-f]{64}  (Image|final\.config|ksu-susfs-preintegration-verification\.txt)$' SHA256SUMS > /tmp/release-sums.txt || true
          [[ "$(wc -l < /tmp/release-sums.txt)" -eq 3 ]] || { echo "FATAL: SHA256SUMS lacks entries for Image/final.config/verification report" >&2; exit 1; }
          sha256sum -c /tmp/release-sums.txt
          cd ..
          python3 - <<'PYEOF'
          import json, os, re
          from pathlib import Path
          m = json.loads(Path("release-assets/manifest.json").read_text())
          tag = str(m.get("BUILD_TAG", ""))
          if not re.fullmatch(r"chimera-mk9r3-[A-Za-z0-9._-]+", tag):
              raise SystemExit(f"FATAL: unexpected BUILD_TAG in manifest: {tag!r}")
          def v(k):
              return str(m.get(k, "n/a")).replace("`", "'").replace("\r", " ").replace("\n", " ")
          body = (
              "CI build only — compile-verified only; NOT boot-tested. No claim of boot, root or SUSFS proof. "
              "Not proof of boot, root, SUSFS, SELinux,\n"
              "Samsung security, flashability, vendor-blob, camera/modem/audio/thermal/charging,\n"
              "recovery, boot-image, Android 16 QPR2 runtime or any ABI compatibility.\n\n"
              "Chimera Mk9r3 compatibility here means building the modified Exynos 9810 Linux 4.9.337 vendor kernel "
              "for potential use with the Chimera Mk9r3 LineageOS 23.2 userspace based on Android 16 QPR2. "
              "Runtime compatibility requires physical-device testing.\n\n"
              "| Field | Value |\n|---|---|\n"
              f"| Kernel base | `{v('IN_BASE_REPO')}@{v('BASE_COMMIT')}` |\n"
              f"| Base branch / pin mode | `{v('BASE_BRANCH')}` / `{v('BASE_PIN_MODE')}` (live tip at start `{v('BASE_TIP')}`) |\n"
              f"| KSU/SUSFS | pre-integrated in base (no CI-time patch); layout `{v('KSU_LAYOUT')}` at `{v('KSU_KERNEL_DIR')}` |\n"
              f"| KernelSU | `{v('KSU_SUBMODULE_URL')}` @ `{v('KSU_COMMIT_ACTUAL')}` |\n"
              f"| Chimera (pinned commit, checkout verified) | `{v('CHIMERA_SHA')}` |\n"
              f"| Profile / overlay / overlay profile | `{v('IN_PROFILE')}` / `{v('APPLY_OVERLAY')}` / `{v('OVERLAY_PROFILE_EFFECTIVE')}` |\n"
              f"| Toolchain mode | `{v('TOOLCHAIN')}` (`{v('COMPILER_KIND')}`) |\n"
              f"| Compiler | `{v('COMPILER_VERSION')}` |\n"
              f"| Linker | `{v('LINKER_VERSION')}` |\n"
              f"| Full LLVM | `{v('FULL_LLVM_MODE') or '0'}` |\n"
              f"| Kernel release | `{v('KERNEL_RELEASE_ACTUAL')}` |\n"
              f"| Final config SHA-256 | `{v('FINAL_CONFIG_HASH')}` |\n"
          )
          Path("release-body.md").write_text(body)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"tag={tag}\n")
          print(body)
          PYEOF

      - name: Create GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: "Chimera Mk9r3 — ${{ inputs.profile }} / ${{ inputs.toolchain }} (UNTESTED)"
          prerelease: true
          draft: false
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            release-assets/Image
            release-assets/manifest.json
            release-assets/SHA256SUMS
            release-assets/final.config
            release-assets/ksu-susfs-preintegration-verification.txt
