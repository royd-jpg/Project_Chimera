name: Project Chimera Mk9 — ExyHyperBrick Merge Build

# ─────────────────────────────────────────────────────────────────────────────
# ROOT-CAUSE FIXES in this revision (linker stage, ld.lld):
#
#   1) undefined symbol: susfs_is_avc_log_spoofing_enabled
#      referenced by fs/susfs.c:(susfs_set_avc_log_spoofing)
#      Chimera Mk8's fs/susfs.c calls this helper unconditionally from
#      susfs_set_avc_log_spoofing(), but its real definition only exists
#      under CONFIG_KSU_SUSFS_SPOOF_SELINUX (disabled in this build's
#      Kconfig fragment). Fix: append a disabled-by-default stub definition
#      to fs/susfs.c, guarded so it never collides with a real definition
#      if SPOOF_SELINUX is ever enabled later.
#
#   2) undefined symbol: path_umount
#      referenced by drivers/built-in.o:(try_umount) [adb_root.c, part of
#      KernelSU-Next's drivers/kernelsu tree]
#      KernelSU-Next assumes a path_umount(struct path *, int) helper that
#      only exists in newer (5.9+) kernel trees. This 4.9.337 tree has no
#      such helper. Fix: back-port a minimal path_umount() into
#      fs/namespace.c, placed immediately after do_umount()'s unique literal
#      tail anchor. A raw balanced-brace scan is unsafe in this Samsung tree
#      because preprocessor branches can have textually asymmetric braces.
#      The helper is also declared in fs/internal.h before compilation.
#
# Both fixes are applied via new steps 6d/6e, directly after the KSU/SUSFS
# patch stack and the kernel/reboot.c hook fix, before the Chimera overlay.
# path_umount is patched into fs/namespace.c before fs/built-in.o compilation.
# Everything else in this file is unchanged from the last known-working
# revision (lineage-23.2 base, CONFIG_KSU_MANUAL_HOOK, ksu_handle_sys_reboot
# hook, corrected nm guard list).
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: cm8 (runtime SUSFS spoof) or cm8e (compile-time identity)"
        required: true
        type: choice
        options: [cm8, cm8e]
        default: cm8
      toolchain:
        description: "Toolchain: aosp19/aosp20/aosp21/aosp22/neutron19/zyc_stable/clang21-eva-gcc"
        required: true
        type: choice
        options: [aosp19, aosp20, aosp21, aosp22, neutron19, zyc_stable, clang21-eva-gcc]
        default: neutron19
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: false
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS/Chimera patches even if markers present"
        required: false
        type: boolean
        default: false
      base_ref:
        description: "ExyHyperBrick base ref/branch/SHA (4.9.337 Exynos9810 BSP)"
        required: false
        type: string
        default: "lineage-23.2"
      ksu_repo:
        description: "KernelSU-Next git URL (https only)"
        required: false
        type: string
        default: "https://github.com/gavdoc38/KernelSU-Next.git"
      ksu_commit:
        description: "KernelSU exact commit SHA (pin)"
        required: false
        type: string
        default: "242f245b2c971eb5c1cc4a689e01dcdeaff4c939"
      susfs_repo:
        description: "SUSFS git URL — traceability only; core files pulled from Chimera Mk8 ref"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_ref:
        description: "SUSFS branch/tag/ref (traceability only)"
        required: false
        type: string
        default: "kernel-4.9"
      susfs_commit:
        description: "SUSFS exact commit SHA (optional pin, traceability only)"
        required: false
        type: string
        default: ""
      brand:
        description: "LOCALVERSION suffix (must start with '-')"
        required: false
        type: string
        default: "-Chimera_Mk9_Merge"
      build_user:
        description: "KBUILD_BUILD_USER"
        required: false
        type: string
        default: "C43L4N"
      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"
      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        required: false
        type: string
        default: "1"
      build_date:
        description: "KBUILD_BUILD_TIMESTAMP (deterministic)"
        required: false
        type: string
        default: "Mon 1 Jan 00:00:00 UTC 2026"

env:
  BASE_REPO: "ExyHyperBrick/android_kernel_samsung_exynos9810"
  CHIMERA_REPO: "https://github.com/royd-jpg/Project_Chimera.git"
  CHIMERA_REF: "chimera-mk8"
  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"
  CCACHE_MAXSIZE: "3G"
  BRAND_DEFAULT: "-Chimera_Mk9_Merge"
  BUILD_USER_DEFAULT: "_Terminal_Echo"
  BUILD_HOST_DEFAULT: "AegisDevLabs"
  BUILD_VERSION_DEFAULT: "1"
  KBUILD_BUILD_TIMESTAMP_DEFAULT: "Mon 1 Jan 00:00:00 UTC 2026"
  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  IDENTITY_ENGINE_ACTIVE: ${{ inputs.profile == 'cm8e' }}
  FORCE_REPATCH: ${{ inputs.force_repatch }}

jobs:
  build:
    name: Chimera Mk9 Merge Build — ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:

      # ── 1. Host dependencies ─────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache flex \
            git libelf-dev libssl-dev lz4 python3 \
            rsync zstd cpio pahole zip
          python3 --version

      - name: Install GCC cross-compiler (clang21-eva-gcc only)
        if: ${{ inputs.toolchain == 'clang21-eva-gcc' }}
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      # ── 2. Checkout Project_Chimera (workflow repo — patches + cfg) ──────────
      # clean: false is mandatory — prevents wiping logs/ and kernel-out/ on re-runs.
      - name: Checkout Project_Chimera (workflow repo — patches + Kconfig fragment)
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 1
          clean: false

      - name: Verify required repo-local files are present
        run: |
          set -Eeuo pipefail
          MISSING=0
          for f in patches/apply_ksu_susfs_patches.sh chimera-ksu-susfs.cfg; do
            if [[ ! -f "$GITHUB_WORKSPACE/$f" ]]; then
              echo "FATAL: required file missing from repo checkout: $f" >&2
              MISSING=1
            else
              echo "OK: found $f"
            fi
          done

          [[ -f "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh" ]] && \
            chmod +x "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"

          [[ $MISSING -eq 0 ]] || {
            echo "Commit these files to the repo before running this workflow." >&2
            exit 1
          }

      # ── 3. Checkout ExyHyperBrick kernel (immutable base) ───────────────────
      - name: Checkout ExyHyperBrick base kernel (4.9.337 Exynos9810 BSP)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ inputs.base_ref }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          clean: false

      # ── Workspace dirs + identity (AFTER both checkouts to survive clean: true) ─
      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR"        >> "$GITHUB_ENV"
          echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR"        >> "$GITHUB_ENV"
          echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR"  >> "$GITHUB_ENV"
          echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang" >> "$GITHUB_ENV"

      - name: Resolve build identity (runtime)
        run: |
          set -Eeuo pipefail
          mkdir -p "$ABS_LOG"

          BRAND="${{ inputs.brand }}"
          BRAND="${BRAND:-$BRAND_DEFAULT}"

          [[ "${BRAND:0:1}" == "-" ]] || {
            echo "ERROR: brand must start with '-'" >&2
            exit 1
          }

          BUILD_USER="${{ inputs.build_user }}"
          BUILD_USER="${BUILD_USER:-$BUILD_USER_DEFAULT}"

          BUILD_HOST="${{ inputs.build_host }}"
          BUILD_HOST="${BUILD_HOST:-$BUILD_HOST_DEFAULT}"

          BUILD_VER="${{ inputs.build_version }}"
          BUILD_VER="${BUILD_VER:-$BUILD_VERSION_DEFAULT}"

          BUILD_TS="${{ inputs.build_date }}"
          BUILD_TS="${BUILD_TS:-$KBUILD_BUILD_TIMESTAMP_DEFAULT}"

          UNAME_PREVIEW="Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VER} SMP PREEMPT"

          echo "BRAND=$BRAND"                     >> "$GITHUB_ENV"
          echo "BUILD_USER=$BUILD_USER"           >> "$GITHUB_ENV"
          echo "BUILD_HOST=$BUILD_HOST"           >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VER"         >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TS" >> "$GITHUB_ENV"
          echo "UNAME_PREVIEW=$UNAME_PREVIEW"     >> "$GITHUB_ENV"

          {
            echo "profile=${{ inputs.profile }}"
            echo "toolchain=${{ inputs.toolchain }}"
            echo "brand=$BRAND"
            echo "uname_preview=$UNAME_PREVIEW"
          } >> "$ABS_LOG/inputs.env"

      - name: Preflight — verify base ref and clean worktree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$ABS_LOG"

          EXPECTED="${{ inputs.base_ref }}"
          current_branch=$(git rev-parse --abbrev-ref HEAD || true)

          if [[ "$current_branch" != "$EXPECTED" && "$current_branch" != "HEAD" ]]; then
            echo "WARN: expected ref '$EXPECTED', on branch '$current_branch'" \
              | tee -a "$ABS_LOG/preflight.log"
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: ExyHyperBrick checkout has uncommitted changes; base must be clean" >&2
            git status --porcelain
            exit 1
          fi

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile \
            | head -3 \
            | tee -a "$ABS_LOG/preflight.log"

          BASE_COMMIT=$(git rev-parse HEAD)

          echo "$BASE_COMMIT"              > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

          echo "BASE_REPO=${{ env.BASE_REPO }} @ $BASE_COMMIT" \
            | tee -a "$ABS_LOG/preflight.log"

      # ── 4. Chimera Mk8 as reference/patch-source remote (NOT merged) ─────────
      - name: Fetch Chimera Mk8 reference (patch source only — no git merge)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          git remote add chimera "${{ env.CHIMERA_REPO }}" || true
          git fetch --no-tags --depth=1 chimera "${{ env.CHIMERA_REF }}"

          CHIMERA_TIP=$(git rev-parse chimera/${{ env.CHIMERA_REF }})

          echo "$CHIMERA_TIP"                  > "$ABS_LOG/chimera-reference.txt"
          echo "CHIMERA_COMMIT=$CHIMERA_TIP" >> "$GITHUB_ENV"

          echo "Chimera Mk8 reference pinned at $CHIMERA_TIP (fetched only, never merged into base)" \
            | tee -a "$ABS_LOG/preflight.log"

      # ── 5. KernelSU-Next ──────────────────────────────────────────────────────
      - name: Initialise KernelSU-Next submodule
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_COMMIT="${{ inputs.ksu_commit }}"
          KSU_SUB="KernelSU-Next"

          if [[ -f .gitmodules ]] && grep -q "$KSU_SUB" .gitmodules 2>/dev/null; then
            [[ -n "$KSU_REPO" ]] && \
              git config "submodule.$KSU_SUB.url" "$KSU_REPO"

            git submodule init "$KSU_SUB"

            git submodule update --depth=1 "$KSU_SUB" || {
              git -C "$KSU_SUB" fetch --no-tags --depth=1 origin "$KSU_COMMIT" || \
              git -C "$KSU_SUB" fetch --no-tags --depth=100 origin "$KSU_COMMIT"

              git -C "$KSU_SUB" checkout --detach "$KSU_COMMIT"
            }
          else
            rm -rf "$KSU_SUB"

            git clone --depth=100 "$KSU_REPO" "$KSU_SUB"

            git -C "$KSU_SUB" fetch --no-tags --depth=1 origin "$KSU_COMMIT" || true
            git -C "$KSU_SUB" checkout --detach "$KSU_COMMIT"
          fi

          ACTUAL_KSU=$(git -C "$KSU_SUB" rev-parse HEAD)

          echo "KernelSU-Next: $ACTUAL_KSU" > "$ABS_LOG/ksu-commit.txt"
          echo "KSU_GIT_VERSION=$(git -C "$KSU_SUB" rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Record SUSFS traceability refs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          {
            echo "susfs_repo=${{ inputs.susfs_repo }}"
            echo "susfs_ref=${{ inputs.susfs_ref }}"
            echo "susfs_commit=${{ inputs.susfs_commit }}"
            echo "NOTE: SUSFS core files are pulled from Chimera Mk8's 4.9.337 port,"
            echo "      not from the upstream 5.10-oriented repo. Ref is for traceability only."
          } > "$ABS_LOG/susfs-refs.txt"

      # ── 6. Apply curated KSU + SUSFS patch stack ─────────────────────────────
      - name: Apply curated KSU-Next + SUSFS patch stack
        working-directory: ${{ env.KERNEL_DIR }}
        run: bash "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"

      # ── 6b. Patch kernel/reboot.c — ksu_handle_sys_reboot ───────────────────
      # ROOT-CAUSE FIX: gavdoc38/KernelSU-Next Kbuild:151 greps for
      # "ksu_handle_sys_reboot" in kernel/reboot.c to confirm manual hooks are
      # integrated (CONFIG_KSU_MANUAL_HOOK=y path only). Anchor confirmed
      # against ExyHyperBrick lineage-23.2 (SYSCALL_DEFINE4(reboot)).
      - name: Patch kernel/reboot.c — add ksu_handle_sys_reboot (Kbuild hook check)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          MARKER = "CMK9_REBOOT_KSU_HOOK"
          p = Path("kernel/reboot.c")
          src = p.read_text()

          if MARKER in src:
              print("kernel/reboot.c: already patched — skipping")
              sys.exit(0)

          errors = []

          def replace_once(src, old, new, label):
              if new in src:
                  print(f"  OK (idempotent): {label}")
                  return src

              if old in src:
                  print(f"  OK: {label}")
                  return src.replace(old, new, 1)

              print(f"  FATAL: anchor not found — {label}", file=sys.stderr)
              errors.append(label)
              return src

          src = replace_once(
              src,
              'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n'
              '\t\tvoid __user *, arg)\n'
              '{',
              '#ifdef CONFIG_KSU /* ' + MARKER + ' */\n'
              'extern int ksu_handle_sys_reboot(int magic1, int magic2,\n'
              '\t\t\t\t unsigned int cmd, void __user **arg);\n'
              '#endif\n'
              'SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, unsigned int, cmd,\n'
              '\t\tvoid __user *, arg)\n'
              '{',
              "kernel/reboot.c: ksu_handle_sys_reboot extern declaration"
          )

          src = replace_once(
              src,
              '\tret = reboot_pid_ns(pid_ns, cmd);\n'
              '\tif (ret)\n'
              '\t\treturn ret;\n'
              '\n'
              '\t/* Instead of trying to make the power_off code look like\n'
              '\t * halt when pm_power_off is not set do it the easy way.\n'
              '\t */\n'
              '\tif ((cmd == LINUX_REBOOT_CMD_POWER_OFF) && !pm_power_off)\n'
              '\t\tcmd = LINUX_REBOOT_CMD_HALT;\n'
              '\n'
              '\tmutex_lock(&reboot_mutex);',
              '\tret = reboot_pid_ns(pid_ns, cmd);\n'
              '\tif (ret)\n'
              '\t\treturn ret;\n'
              '\n'
              '\t/* Instead of trying to make the power_off code look like\n'
              '\t * halt when pm_power_off is not set do it the easy way.\n'
              '\t */\n'
              '\tif ((cmd == LINUX_REBOOT_CMD_POWER_OFF) && !pm_power_off)\n'
              '\t\tcmd = LINUX_REBOOT_CMD_HALT;\n'
              '\n'
              '#ifdef CONFIG_KSU\n'
              '\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n'
              '#endif\n'
              '\tmutex_lock(&reboot_mutex);',
              "kernel/reboot.c: ksu_handle_sys_reboot call-site"
          )

          p.write_text(src)

          if errors:
              print(
                  "\nFATAL: required anchor(s) not found in kernel/reboot.c",
                  file=sys.stderr
              )

              for e in errors:
                  print(f"  - {e}", file=sys.stderr)

              sys.exit(1)

          print("kernel/reboot.c: ksu_handle_sys_reboot hook applied successfully")
          PYEOF

      # ── 6c. Diagnostic — confirm hook presence + Kbuild check visibility ─────
      - name: Diagnostic — verify KSU hook presence and Kbuild check
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          echo "=== KSU manual hook references ==="

          grep -n 'ksu_handle_sys_reboot' kernel/reboot.c \
            || echo "MISSING: kernel/reboot.c"

          grep -n 'ksu_handle_execveat' fs/exec.c \
            || echo "MISSING: fs/exec.c"

          grep -n 'ksu_handle_faccessat' fs/open.c \
            || echo "MISSING: fs/open.c"

          echo ""
          echo "=== Kbuild hook check (lines 130–165) ==="

          sed -n '130,165p' drivers/kernelsu/Kbuild 2>/dev/null \
            || echo "(symlink not yet created — run after patch step)"

          echo ""
          echo "=== Kbuild grep simulation ==="

          grep -q 'ksu_handle_sys_reboot' kernel/reboot.c \
            && echo "PASS: ksu_handle_sys_reboot found in kernel/reboot.c" \
            || echo "FAIL: ksu_handle_sys_reboot NOT found — Kbuild:151 would error"

      # ── 6d. Fix linker error #1 — susfs_is_avc_log_spoofing_enabled ─────────
      # ld.lld: undefined symbol: susfs_is_avc_log_spoofing_enabled
      #   referenced by fs/susfs.c:(susfs_set_avc_log_spoofing)
      # Chimera Mk8's fs/susfs.c calls this helper unconditionally from
      # susfs_set_avc_log_spoofing(), but the real implementation only exists
      # under CONFIG_KSU_SUSFS_SPOOF_SELINUX, which this build's Kconfig
      # fragment leaves disabled. Append a disabled-mode stub so the symbol
      # resolves; guarded so it never collides if SPOOF_SELINUX is enabled
      # in a future build.
      - name: Patch fs/susfs.c — stub susfs_is_avc_log_spoofing_enabled
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          MARKER = "CMK9_AVC_LOG_SPOOF_STUB"
          p = Path("fs/susfs.c")
          src = p.read_text()

          if MARKER in src:
              print("fs/susfs.c: stub already present — skipping")
              sys.exit(0)

          if "bool susfs_is_avc_log_spoofing_enabled(void)" in src and \
             "#ifdef CONFIG_KSU_SUSFS_SPOOF_SELINUX" not in src.split(
                 "bool susfs_is_avc_log_spoofing_enabled(void)"
             )[0][-200:]:
              # A real (unguarded) definition already exists upstream —
              # nothing to do, avoid a duplicate-symbol build error.
              print("fs/susfs.c: a definition already exists — skipping stub")
              sys.exit(0)

          stub = (
              "\n/* " + MARKER + " */\n"
              "#ifndef CONFIG_KSU_SUSFS_SPOOF_SELINUX\n"
              "bool susfs_is_avc_log_spoofing_enabled(void)\n"
              "{\n"
              "\treturn false;\n"
              "}\n"
              "#endif\n"
          )

          p.write_text(src + stub)

          print(
              "fs/susfs.c: appended disabled-mode stub for "
              "susfs_is_avc_log_spoofing_enabled"
          )
          PYEOF

      # ── 6e. Fix linker error #2 — path_umount ────────────────────────────────
      # ld.lld: undefined symbol: path_umount
      #   referenced by drivers/built-in.o:(try_umount) [adb_root.c in
      #   KernelSU-Next's drivers/kernelsu tree]
      # path_umount(struct path *, int) only exists in 5.9+ kernel trees.
      #
      # IMPORTANT: do not use a raw balanced-brace scanner here. Samsung's
      # namespace.c contains preprocessor branches whose text has two alternate
      # opening braces but one shared closing brace; a preprocessor-unaware
      # scanner therefore reports a false imbalance. Use the unique literal
      # tail of do_umount() as the insertion anchor instead.
      #
      # The helper must be present before the fs/ build phase starts. Injecting
      # it later from a Kbuild rule is too late because fs/built-in.o may already
      # have been compiled.
      - name: Patch fs/namespace.c and fs/internal.h — add path_umount
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          MARKER = "CMK9_PATH_UMOUNT_BACKPORT"
          ns = Path("fs/namespace.c")
          internal = Path("fs/internal.h")
          src = ns.read_text()

          if MARKER not in src:
              # This is the unique literal tail of do_umount() in the
              # ExyHyperBrick lineage-23.2 4.9.337 tree. It is deliberately
              # content-anchored rather than line-number- or brace-based.
              tail = (
                  "\tunlock_mount_hash();\n"
                  "\tnamespace_unlock();\n"
                  "\treturn retval;\n"
                  "}\n"
              )

              count = src.count(tail)

              if count != 1:
                  print(
                      "FATAL: expected exactly one do_umount() tail anchor "
                      f"in fs/namespace.c, found {count}",
                      file=sys.stderr
                  )
                  sys.exit(1)

              backport = (
                  "\n\n/* " + MARKER + " — back-ported for KernelSU-Next drivers/kernelsu\n"
                  " * (adb_root.c try_umount()), which assumes a 5.9+ path_umount() helper\n"
                  " * that this 4.9.337 tree does not have. Minimal equivalent using the\n"
                  " * existing do_umount()/mntput_no_expire() primitives already present\n"
                  " * in this file.\n"
                  " */\n"
                  "#ifdef CONFIG_KSU\n"
                  "int path_umount(struct path *path, int flags)\n"
                  "{\n"
                  "\tstruct mount *mnt = real_mount(path->mnt);\n"
                  "\tint ret;\n\n"
                  "\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n"
                  "\t\treturn -EINVAL;\n\n"
                  "\tif (!may_mount())\n"
                  "\t\treturn -EPERM;\n\n"
                  "\tret = do_umount(mnt, flags);\n\n"
                  "\t/* we mustn't call path_put() here: that would drop the mnt_count\n"
                  "\t * reference that do_umount() expects the caller to hold.\n"
                  "\t */\n"
                  "\tdput(path->dentry);\n"
                  "\tmntput_no_expire(mnt);\n"
                  "\treturn ret;\n"
                  "}\n"
                  "#endif\n"
              )

              src = src.replace(tail, tail + backport, 1)
              ns.write_text(src)

              print(
                  "fs/namespace.c: path_umount() inserted after do_umount() tail"
              )
          else:
              print("fs/namespace.c: path_umount() already present — skipping")

          # The KSU driver is built in-tree and may rely on the internal kernel
          # declaration. Add it before compilation, idempotently.
          h = internal.read_text()
          decl = "int path_umount(struct path *path, int flags);"

          if decl not in h:
              h += (
                  "\n\n/* " + MARKER + " — KernelSU-Next 4.9.337 backport */\n"
                  "#ifdef CONFIG_KSU\n"
                  + decl + "\n"
                  "#endif\n"
              )

              internal.write_text(h)
              print("fs/internal.h: path_umount() declaration added")
          else:
              print("fs/internal.h: path_umount() declaration already present")

          PYEOF

      - name: Diagnostic — verify linker-fix symbols present before build
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          grep -n 'susfs_is_avc_log_spoofing_enabled' fs/susfs.c
          grep -n 'CMK9_PATH_UMOUNT_BACKPORT\|int path_umount' fs/namespace.c
          grep -n 'CMK9_PATH_UMOUNT_BACKPORT\|int path_umount' fs/internal.h

      # ── 7. Chimera overlay (branding / identity / scheduler tuning) ──────────
      - name: Apply Chimera overlay (branding/identity/scheduler tuning)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          LOG="$ABS_LOG/overlay.log"
          echo "Chimera overlay started at $(date -u)" > "$LOG"

          FAIR="kernel/sched/fair.c"

          if grep -q '750000ULL' "$FAIR"; then
            sed -i \
              's/\(normalized_sysctl_sched_min_granularity\s*=\s*\)750000ULL/\15000000ULL/' \
              "$FAIR"
          fi

          if grep -q '500000UL;' "$FAIR"; then
            sed -i \
              's/\(sysctl_sched_migration_cost\s*=\s*\)500000UL/\12000000UL/' \
              "$FAIR"
          fi

          sed -i \
            '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' \
            "$DEFCONFIG"

          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' \
            "$BRAND" "$BUILD_HOST" >> "$DEFCONFIG"

          printf '#!/bin/sh\nprintf "%%s" "%s"\n' "$BRAND" \
            > scripts/setlocalversion

          chmod +x scripts/setlocalversion
          echo "$BRAND" > localversion

          echo "Overlay applied (profile=$PROFILE, brand=$BRAND)" \
            | tee -a "$LOG"

      # ── 8. Fix Kconfig fragment before merge ─────────────────────────────────
      - name: Validate and fix chimera-ksu-susfs.cfg
        run: |
          set -Eeuo pipefail

          CFG="$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg"

          if grep -q 'CONFIG_KSU_NON_KPROBE=y' "$CFG"; then
            sed -i \
              's/^CONFIG_KSU_NON_KPROBE=y/CONFIG_KSU_MANUAL_HOOK=y/' \
              "$CFG"

            echo "Fixed: CONFIG_KSU_NON_KPROBE → CONFIG_KSU_MANUAL_HOOK"
          fi

          grep -q 'CONFIG_KSU_MANUAL_HOOK=y' "$CFG" || \
            echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CFG"

          sed -i \
            '/^# CONFIG_KSU_KPROBES_HOOK is not set/d' \
            "$CFG" || true

          echo "=== chimera-ksu-susfs.cfg (validated) ==="
          cat "$CFG"

      # ── 9. Kconfig fragment merge + defconfig baseline ───────────────────────
      - name: Merge Kconfig fragment (chimera-ksu-susfs.cfg) via merge_config.sh
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          cp "$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg" \
            /tmp/chimera-ksu-susfs.cfg

          make O="$ABS_OUT" ARCH=arm64 "$(basename "$DEFCONFIG")" \
            | tee "$ABS_LOG/defconfig-base.log"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$ABS_OUT" \
            "$ABS_OUT/.config" \
            /tmp/chimera-ksu-susfs.cfg \
            | tee "$ABS_LOG/merge-config.log"

          make O="$ABS_OUT" ARCH=arm64 olddefconfig \
            | tee -a "$ABS_LOG/merge-config.log"

      # ── 10. Safety guard — disallowed symbols must remain disabled ────────────
      - name: Guard pass — Samsung security features must remain disabled
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          CFG="$ABS_OUT/.config"

          FORBIDDEN=(
            CONFIG_RKP_KDP
            CONFIG_UH_RKP
            CONFIG_TIMA
            CONFIG_TIMA_LKMAUTH
            CONFIG_FIVE
            CONFIG_SEC_RESTRICT_ROOTING
            CONFIG_SEC_RESTRICT_SETUID
          )

          FAIL=0
          : > "$ABS_LOG/config-guard.log"

          for sym in "${FORBIDDEN[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "FATAL: $sym=y is set — must remain disabled" \
                | tee -a "$ABS_LOG/config-guard.log"

              FAIL=1
            else
              echo "OK: $sym not enabled" \
                | tee -a "$ABS_LOG/config-guard.log"
            fi
          done

          for sym in \
            CONFIG_KSU \
            CONFIG_KSU_MANUAL_HOOK \
            CONFIG_KSU_SUSFS \
            CONFIG_KSU_SUSFS_SUS_PATH \
            CONFIG_KSU_SUSFS_SUS_MAP \
            CONFIG_KSU_SUSFS_SUS_KSTAT; do

            if grep -qE "^${sym}=y" "$CFG"; then
              echo "OK: $sym=y" \
                | tee -a "$ABS_LOG/config-guard.log"
            else
              echo "FATAL: $sym is not enabled — required for this build" \
                | tee -a "$ABS_LOG/config-guard.log"

              FAIL=1
            fi
          done

          [[ $FAIL -eq 0 ]] || {
            echo "Config guard failed — aborting build" >&2
            exit 1
          }

      # ── 11. Toolchain resolution ──────────────────────────────────────────────
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail

          TOOLCHAIN="${{ inputs.toolchain }}"

          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_LLVM_IAS="1"
          TC_USE_FULL_LLVM="true"

          case "$TOOLCHAIN" in
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f60b8b55282f002f594f452ce22dfd6cf1fd7e3c/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;

            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;

            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;

            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;

            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;

            zyc_stable)
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-v2"
              TC_URL=$(curl -fsSL \
                "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" \
                || true)
              ;;

            clang21-eva-gcc)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              TC_USE_FULL_LLVM="false"
              TC_LLVM_IAS="0"
              ;;

            *)
              echo "ERROR: unsupported toolchain '$TOOLCHAIN'" >&2
              exit 1
              ;;
          esac

          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_LLVM_IAS=$TC_LLVM_IAS"
            echo "TC_USE_FULL_LLVM=$TC_USE_FULL_LLVM"
          } >> "$GITHUB_ENV"

          echo "TC_CACHE_KEY=$TC_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          ARCHIVE="/tmp/clang_archive"

          aria2c \
            -x4 \
            -s4 \
            -q \
            -d /tmp \
            -o clang_archive \
            "$TC_URL" \
            || wget -O "$ARCHIVE" "$TC_URL"

          rm -rf toolchains/clang
          mkdir -p toolchains/clang

          case "$TC_ARCHIVE_FMT" in
            tar.gz|tar)
              tar -C toolchains/clang -xzf "$ARCHIVE"
              ;;

            tar.xz)
              tar -C toolchains/clang -xJf "$ARCHIVE"
              ;;

            tar.zst)
              zstd -d "$ARCHIVE" -o /tmp/clang.tar --force
              tar -C toolchains/clang -xf /tmp/clang.tar
              ;;
          esac

          chmod +x toolchains/clang/bin/* 2>/dev/null || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: >-
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ── 12. Finalise .config + summary ───────────────────────────────────────
      - name: Finalise kernel .config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          make O="$ABS_OUT" ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          cp "$ABS_OUT/.config" "$ABS_LOG/config.built"

          echo "=== Key config symbols ===" \
            | tee "$ABS_LOG/config-summary.txt"

          grep -E \
            "^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SEC_RESTRICT|CONFIG_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_LOCALVERSION)" \
            "$ABS_OUT/.config" \
            | tee -a "$ABS_LOG/config-summary.txt"

          if grep -q \
            'CONFIG_KSU_MANUAL_HOOK=y' \
            "$ABS_OUT/include/config/auto.conf" \
            2>/dev/null; then

            echo "PASS: CONFIG_KSU_MANUAL_HOOK=y is in auto.conf (visible to Kbuild)"
          else
            echo "WARN: CONFIG_KSU_MANUAL_HOOK not yet in auto.conf — will be generated at build start"
          fi

      # ── 13. Build ─────────────────────────────────────────────────────────────
      - name: Build kernel
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: arm64
          KBUILD_BUILD_USER: "${{ env.BUILD_USER }}"
          KBUILD_BUILD_HOST: "${{ env.BUILD_HOST }}"
          KBUILD_BUILD_VERSION: "${{ env.BUILD_VERSION }}"
          KBUILD_BUILD_TIMESTAMP: "${{ env.KBUILD_BUILD_TIMESTAMP }}"
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          JOBS=$(nproc || echo 2)

          MAKE_ARGS=(
            "O=$ABS_OUT"
            "ARCH=arm64"
            "CC=ccache clang"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "CROSS_COMPILE=aarch64-linux-gnu-"
            "CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
            "-j${JOBS}"
            "LOCALVERSION=${BRAND}"
          )

          if [[ "${TC_USE_FULL_LLVM}" == "true" ]]; then
            for tool in ar nm objcopy objdump strip; do
              ln -sf \
                "$ABS_TC/bin/llvm-${tool}" \
                "$ABS_TC/bin/aarch64-linux-gnu-${tool}" \
                || true
            done

            ln -sf \
              "$ABS_TC/bin/ld.lld" \
              "$ABS_TC/bin/aarch64-linux-gnu-ld" \
              || true

            MAKE_ARGS+=(
              "LLVM=1"
              "LLVM_IAS=${TC_LLVM_IAS}"
              "LD=ld.lld"
              "AR=llvm-ar"
              "NM=llvm-nm"
              "OBJCOPY=llvm-objcopy"
              "OBJDUMP=llvm-objdump"
              "STRIP=llvm-strip"
              "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error -fuse-ld=lld"
            )
          else
            MAKE_ARGS+=(
              "LLVM_IAS=0"
              "HOSTCC=gcc"
              "HOSTCXX=g++"
              "LD=aarch64-linux-gnu-ld"
              "AR=aarch64-linux-gnu-ar"
              "NM=aarch64-linux-gnu-nm"
              "OBJCOPY=aarch64-linux-gnu-objcopy"
              "OBJDUMP=aarch64-linux-gnu-objdump"
              "STRIP=aarch64-linux-gnu-strip"
              "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error"
            )
          fi

          make "${MAKE_ARGS[@]}" \
            Image.gz-dtb \
            2>&1 | tee "$ABS_LOG/build.log"

      # ── 14. nm guard — verify KSU/SUSFS symbols are compiled in ──────────────
      - name: Guard pass — verify KSU/SUSFS hooks compiled into vmlinux
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          VMLINUX="$ABS_OUT/vmlinux"

          [[ -f "$VMLINUX" ]] || {
            echo "ERROR: vmlinux not found at $VMLINUX" >&2
            exit 1
          }

          NM=nm

          [[ "${TC_USE_FULL_LLVM}" == "true" ]] && NM=llvm-nm

          "$NM" "$VMLINUX" \
            > "$ABS_LOG/vmlinux-symbols.log" \
            2>&1 \
            || true

          REQUIRED=(
            ksu_handle_execveat
            ksu_handle_faccessat
            ksu_handle_sys_reboot
            susfs_is_inode_sus_path
          )

          FAIL=0

          : > "$ABS_LOG/nm-guard.log"

          for sym in "${REQUIRED[@]}"; do
            if grep -q " $sym$\| ${sym} " \
              "$ABS_LOG/vmlinux-symbols.log"; then

              echo "OK: $sym present" \
                | tee -a "$ABS_LOG/nm-guard.log"
            else
              echo "FATAL: $sym missing from vmlinux" \
                | tee -a "$ABS_LOG/nm-guard.log"

              FAIL=1
            fi
          done

          [[ $FAIL -eq 0 ]] || {
            echo "nm symbol guard failed" >&2
            exit 1
          }

      # ── 15. Package + upload ─────────────────────────────────────────────────
      - name: Locate Image.gz-dtb and package artifacts
        if: ${{ inputs.dry_run != 'true' }}
        id: package
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART_DIR"

          IMG="$ABS_OUT/arch/arm64/boot/Image.gz-dtb"

          [[ -f "$IMG" ]] || {
            echo "ERROR: Image.gz-dtb not produced" >&2
            exit 1
          }

          cp "$IMG" "$ART_DIR/Image.gz-dtb"

          BUILD_TAG="chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"

          echo "BUILD_TAG=$BUILD_TAG" \
            >> "$GITHUB_ENV"

          echo "artifact_path=$ART_DIR/Image.gz-dtb" \
            >> "$GITHUB_OUTPUT"

          echo "ART_DIR=$ART_DIR" \
            >> "$GITHUB_ENV"

      - name: Upload Image.gz-dtb artifact
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-image-${{ inputs.profile }}-${{ inputs.toolchain }}
          path: ${{ steps.package.outputs.artifact_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ inputs.do_release == 'true' && inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "Chimera Mk9 — ${{ inputs.profile }} / ${{ inputs.toolchain }}"
          body: |
            ## Chimera Mk9 — ExyHyperBrick Merge Build

            | Field | Value |
            |---|---|
            | Base | `${{ env.BASE_REPO }}` @ `${{ env.BASE_COMMIT }}` |
            | Chimera Mk8 ref (patch source) | `${{ env.CHIMERA_COMMIT }}` |
            | KSU-Next | `${{ inputs.ksu_commit }}` |
            | Profile | `${{ inputs.profile }}` |
            | Toolchain | `${{ inputs.toolchain }}` |
            | uname | `${{ env.UNAME_PREVIEW }}` |

          files: |
            ${{ steps.package.outputs.artifact_path }}

          draft: false
          prerelease: false

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-logs-${{ github.run_id }}
          path: ${{ env.ABS_LOG }}/**
          if-no-files-found: warn
