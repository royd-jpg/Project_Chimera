name: Project Chimera Mk9 — ExyHyperBrick Merge Build

# ─────────────────────────────────────────────────────────────────────────────
# Project Chimera Mk9 — Exynos9810 / star2lte / Linux 4.9.337
#
# ROOT-CAUSE HARDENING
#
# 1. KernelSU-Next Manager integration
#    -------------------------------
#    A kernel can compile and boot while Manager root requests still fail if
#    the Manager integration objects are disabled or omitted.
#
#    This workflow therefore:
#      - forces CONFIG_KSU_DISABLE_MANAGER=n
#      - verifies Manager object entries in KernelSU-Next/Kbuild
#      - verifies KSU core/manual-hook configuration after olddefconfig
#      - verifies required runtime symbols in vmlinux
#
# 2. Manual hook integration
#    -----------------------
#    CONFIG_KSU_MANUAL_HOOK=y requires the KernelSU-Next manual hook contract.
#    Kbuild checks kernel/reboot.c for ksu_handle_sys_reboot().
#
#    The workflow inserts and verifies that hook.
#
# 3. Linux 4.9.337 compatibility
#    ----------------------------
#    KernelSU-Next expects path_umount() from newer kernels.
#    This BSP does not provide it.
#
#    A minimal 4.9-compatible path_umount() backport is inserted after the
#    literal do_umount() tail. No preprocessor-unaware brace scanning is used.
#
# 4. SUSFS AVC symbol
#    ----------------
#    Chimera Mk8 fs/susfs.c references:
#
#        extern bool susfs_is_avc_log_spoofing_enabled;
#
#    The symbol is not defined in the selected tree when the AVC/SELinux
#    implementation is not imported. The workflow provides a local disabled
#    definition so the linker resolves cleanly.
#
# 5. Packaging
#    ----------
#    The kernel and device tree are built and packaged separately:
#
#      chimera-mk9-Image-<profile>-<toolchain>
#          └── Image
#
#      chimera-mk9-dtb-<profile>-<toolchain>
#          ├── dtb.img
#          └── raw star2lte .dtb files
#
#    dtb.img is raw concatenation of the selected Samsung DTB blobs.
#
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: cm8 or cm8e"
        required: true
        type: choice
        options:
          - cm8
          - cm8e
        default: cm8

      toolchain:
        description: "Toolchain"
        required: true
        type: choice
        options:
          - aosp19
          - aosp20
          - aosp21
          - aosp22
          - neutron19
          - zyc_stable
          - clang21-eva-gcc
        default: neutron19

      dry_run:
        description: "Validate only — skip build and packaging"
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create a GitHub Release"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force re-apply patch stack"
        required: false
        type: boolean
        default: false

      base_ref:
        description: "ExyHyperBrick base ref/branch/SHA"
        required: false
        type: string
        default: "lineage-23.2"

      ksu_repo:
        description: "KernelSU-Next repository"
        required: false
        type: string
        default: "https://github.com/gavdoc38/KernelSU-Next.git"

      ksu_commit:
        description: "KernelSU-Next exact commit"
        required: false
        type: string
        default: "242f245b2c971eb5c1cc4a689e01dcdeaff4c939"

      susfs_repo:
        description: "SUSFS traceability repository"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"

      susfs_ref:
        description: "SUSFS traceability ref"
        required: false
        type: string
        default: "kernel-4.9"

      susfs_commit:
        description: "SUSFS traceability commit"
        required: false
        type: string
        default: ""

      brand:
        description: "LOCALVERSION suffix"
        required: false
        type: string
        default: "-Chimera_Mk9_Merge"

      build_user:
        description: "KBUILD_BUILD_USER"
        required: false
        type: string
        default: "C43L4N"

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"

      build_version:
        description: "KBUILD_BUILD_VERSION"
        required: false
        type: string
        default: "1"

      build_date:
        description: "KBUILD_BUILD_TIMESTAMP"
        required: false
        type: string
        default: "Mon 1 Jan 00:00:00 UTC 2026"

env:
  BASE_REPO: "ExyHyperBrick/android_kernel_samsung_exynos9810"

  CHIMERA_REPO: "https://github.com/royd-jpg/Project_Chimera.git"
  CHIMERA_REF: "chimera-mk8"

  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"

  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"

  CCACHE_MAXSIZE: "3G"

  BRAND_DEFAULT: "-Chimera_Mk9_Merge"
  BUILD_USER_DEFAULT: "C43L4N"
  BUILD_HOST_DEFAULT: "AegisDevLabs"
  BUILD_VERSION_DEFAULT: "1"
  KBUILD_BUILD_TIMESTAMP_DEFAULT: "Mon 1 Jan 00:00:00 UTC 2026"

  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  FORCE_REPATCH: ${{ inputs.force_repatch }}

jobs:
  build:
    name: Chimera Mk9 — ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:

      # ─────────────────────────────────────────────────────────────────────────
      # 1. HOST DEPENDENCIES
      # ─────────────────────────────────────────────────────────────────────────

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            zstd \
            cpio \
            pahole \
            zip

          python3 --version

      - name: Install GCC cross-compiler
        if: ${{ inputs.toolchain == 'clang21-eva-gcc' }}
        run: |
          set -Eeuo pipefail

          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      # ─────────────────────────────────────────────────────────────────────────
      # 2. CHECKOUT WORKFLOW REPOSITORY
      # ─────────────────────────────────────────────────────────────────────────

      - name: Checkout Project_Chimera workflow repository
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 1
          clean: false

      - name: Verify required repo-local files
        run: |
          set -Eeuo pipefail

          required_files=(
            "patches/apply_ksu_susfs_patches.sh"
            "chimera-ksu-susfs.cfg"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$GITHUB_WORKSPACE/$file" ]]; then
              echo "FATAL: missing required file: $file" >&2
              exit 1
            fi
            echo "OK: $file"
          done

          chmod +x \
            "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"

      # ─────────────────────────────────────────────────────────────────────────
      # 3. CHECKOUT IMMUTABLE EXYHYPERBRICK BASE
      # ─────────────────────────────────────────────────────────────────────────

      - name: Checkout ExyHyperBrick 4.9.337 base
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ inputs.base_ref }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          clean: false

      # ─────────────────────────────────────────────────────────────────────────
      # 4. WORKSPACE AND BUILD IDENTITY
      # ─────────────────────────────────────────────────────────────────────────

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$GITHUB_WORKSPACE/$LOG_DIR" \
            "$GITHUB_WORKSPACE/$OUT_DIR"

          {
            echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR"
            echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR"
            echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR"
            echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang"
          } >> "$GITHUB_ENV"

      - name: Resolve build identity
        run: |
          set -Eeuo pipefail

          BRAND="${{ inputs.brand }}"
          BRAND="${BRAND:-$BRAND_DEFAULT}"

          [[ "${BRAND:0:1}" == "-" ]] || {
            echo "FATAL: brand must begin with '-'" >&2
            exit 1
          }

          BUILD_USER="${{ inputs.build_user }}"
          BUILD_USER="${BUILD_USER:-$BUILD_USER_DEFAULT}"

          BUILD_HOST="${{ inputs.build_host }}"
          BUILD_HOST="${BUILD_HOST:-$BUILD_HOST_DEFAULT}"

          BUILD_VERSION="${{ inputs.build_version }}"
          BUILD_VERSION="${BUILD_VERSION:-$BUILD_VERSION_DEFAULT}"

          BUILD_TIMESTAMP="${{ inputs.build_date }}"
          BUILD_TIMESTAMP="${BUILD_TIMESTAMP:-$KBUILD_BUILD_TIMESTAMP_DEFAULT}"

          UNAME_PREVIEW="Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VERSION} SMP PREEMPT"

          {
            echo "BRAND=$BRAND"
            echo "BUILD_USER=$BUILD_USER"
            echo "BUILD_HOST=$BUILD_HOST"
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TIMESTAMP"
            echo "UNAME_PREVIEW=$UNAME_PREVIEW"
          } >> "$GITHUB_ENV"

          {
            echo "profile=${{ inputs.profile }}"
            echo "toolchain=${{ inputs.toolchain }}"
            echo "brand=$BRAND"
            echo "uname_preview=$UNAME_PREVIEW"
          } > "$ABS_LOG/inputs.env"

      # ─────────────────────────────────────────────────────────────────────────
      # 5. PREFLIGHT
      # ─────────────────────────────────────────────────────────────────────────

      - name: Preflight — verify base kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          EXPECTED="${{ inputs.base_ref }}"
          CURRENT="$(git rev-parse --abbrev-ref HEAD || true)"

          if [[ "$CURRENT" != "$EXPECTED" && "$CURRENT" != "HEAD" ]]; then
            echo "WARN: expected '$EXPECTED', got '$CURRENT'" \
              | tee -a "$ABS_LOG/preflight.log"
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "FATAL: base tree is not clean" >&2
            git status --short
            exit 1
          fi

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' \
            Makefile \
            | head -3 \
            | tee "$ABS_LOG/kernel-version.log"

          BASE_COMMIT="$(git rev-parse HEAD)"

          echo "$BASE_COMMIT" > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────────
      # 6. CHIMERA REFERENCE
      # ─────────────────────────────────────────────────────────────────────────

      - name: Fetch Chimera Mk8 reference
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          git remote add chimera "${{ env.CHIMERA_REPO }}" 2>/dev/null || true

          git fetch \
            --no-tags \
            --depth=1 \
            chimera \
            "${{ env.CHIMERA_REF }}"

          CHIMERA_COMMIT="$(git rev-parse "chimera/${{ env.CHIMERA_REF }}")"

          echo "$CHIMERA_COMMIT" \
            > "$ABS_LOG/chimera-reference.txt"

          echo "CHIMERA_COMMIT=$CHIMERA_COMMIT" \
            >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────────
      # 7. KERNELSU-NEXT
      # ─────────────────────────────────────────────────────────────────────────

      - name: Initialise KernelSU-Next
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_COMMIT="${{ inputs.ksu_commit }}"
          KSU_SUB="KernelSU-Next"

          if [[ -f .gitmodules ]] &&
             grep -q "$KSU_SUB" .gitmodules; then

            git config \
              "submodule.$KSU_SUB.url" \
              "$KSU_REPO"

            git submodule init "$KSU_SUB"

            git submodule update \
              --depth=1 \
              "$KSU_SUB" || {
                git -C "$KSU_SUB" fetch \
                  --no-tags \
                  --depth=100 \
                  origin \
                  "$KSU_COMMIT"

                git -C "$KSU_SUB" checkout \
                  --detach \
                  "$KSU_COMMIT"
              }

          else
            rm -rf "$KSU_SUB"

            git clone \
              --depth=100 \
              "$KSU_REPO" \
              "$KSU_SUB"

            git -C "$KSU_SUB" fetch \
              --no-tags \
              --depth=1 \
              origin \
              "$KSU_COMMIT"

            git -C "$KSU_SUB" checkout \
              --detach \
              "$KSU_COMMIT"
          fi

          ACTUAL_KSU="$(git -C "$KSU_SUB" rev-parse HEAD)"

          echo "$ACTUAL_KSU" \
            > "$ABS_LOG/ksu-commit.txt"

          echo "KSU_GIT_VERSION=$(git -C "$KSU_SUB" rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Record SUSFS traceability
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          {
            echo "susfs_repo=${{ inputs.susfs_repo }}"
            echo "susfs_ref=${{ inputs.susfs_ref }}"
            echo "susfs_commit=${{ inputs.susfs_commit }}"
            echo
            echo "SUSFS core source: Chimera Mk8 4.9.337 implementation"
          } > "$ABS_LOG/susfs-refs.txt"

      # ─────────────────────────────────────────────────────────────────────────
      # 8. APPLY CURATED KSU/SUSFS PATCH STACK
      # ─────────────────────────────────────────────────────────────────────────

      - name: Apply curated KSU/SUSFS patch stack
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          bash \
            "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"

      # ─────────────────────────────────────────────────────────────────────────
      # 9. REQUIRED MANUAL REBOOT HOOK
      # ─────────────────────────────────────────────────────────────────────────

      - name: Patch kernel/reboot.c — ksu_handle_sys_reboot
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          MARKER = "CMK9_REBOOT_KSU_HOOK"
          path = Path("kernel/reboot.c")
          src = path.read_text()

          if MARKER in src:
              print("reboot hook already present")
              sys.exit(0)

          declaration_anchor = (
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, "
              "unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n"
              "{"
          )

          declaration = (
              "#ifdef CONFIG_KSU /* CMK9_REBOOT_KSU_HOOK */\n"
              "extern int ksu_handle_sys_reboot(\n"
              "\tint magic1,\n"
              "\tint magic2,\n"
              "\tunsigned int cmd,\n"
              "\tvoid __user **arg\n"
              ");\n"
              "#endif\n"
          )

          if declaration_anchor not in src:
              print(
                  "FATAL: reboot syscall declaration anchor not found",
                  file=sys.stderr
              )
              sys.exit(1)

          src = src.replace(
              declaration_anchor,
              declaration + declaration_anchor,
              1
          )

          call_anchor = (
              "\tret = reboot_pid_ns(pid_ns, cmd);\n"
              "\tif (ret)\n"
              "\t\treturn ret;\n"
          )

          call = (
              "\n"
              "#ifdef CONFIG_KSU\n"
              "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
              "#endif\n"
          )

          if call_anchor not in src:
              print(
                  "FATAL: reboot syscall call-site anchor not found",
                  file=sys.stderr
              )
              sys.exit(1)

          src = src.replace(
              call_anchor,
              call_anchor + call,
              1
          )

          path.write_text(src)

          print("ksu_handle_sys_reboot hook applied")
          PYEOF

      # ─────────────────────────────────────────────────────────────────────────
      # 10. AVC SYMBOL FIX
      # ─────────────────────────────────────────────────────────────────────────

      - name: Fix SUSFS AVC spoofing symbol
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          MARKER = "CMK9_AVC_LOG_SPOOF_SYMBOL_FIX"
          path = Path("fs/susfs.c")
          src = path.read_text()

          if MARKER in src:
              print("AVC symbol fix already applied")
              sys.exit(0)

          old = "extern bool susfs_is_avc_log_spoofing_enabled;"

          if old not in src:
              print(
                  "FATAL: expected SUSFS AVC extern declaration not found",
                  file=sys.stderr
              )
              sys.exit(1)

          new = (
              "/* CMK9_AVC_LOG_SPOOF_SYMBOL_FIX */\n"
              "/*\n"
              " * AVC log spoofing is intentionally disabled in this build.\n"
              " * The SELinux avc.c implementation is not imported, therefore\n"
              " * the SUSFS extern must resolve locally.\n"
              " */\n"
              "bool susfs_is_avc_log_spoofing_enabled = false;"
          )

          src = src.replace(old, new, 1)
          path.write_text(src)

          print("SUSFS AVC symbol defined locally")
          PYEOF

      # ─────────────────────────────────────────────────────────────────────────
      # 11. PATH_UMOUNT BACKPORT
      # ─────────────────────────────────────────────────────────────────────────

      - name: Backport path_umount for Linux 4.9.337
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          python3 << 'PYEOF'
          import sys
          from pathlib import Path

          MARKER = "CMK9_PATH_UMOUNT_BACKPORT"

          namespace = Path("fs/namespace.c")
          internal = Path("fs/internal.h")

          src = namespace.read_text()

          if MARKER not in src:
              tail = (
                  "\tunlock_mount_hash();\n"
                  "\tnamespace_unlock();\n"
                  "\treturn retval;\n"
                  "}\n"
              )

              if src.count(tail) != 1:
                  print(
                      "FATAL: do_umount() literal tail is not unique",
                      file=sys.stderr
                  )
                  sys.exit(1)

              backport = (
                  "\n\n"
                  "/* CMK9_PATH_UMOUNT_BACKPORT */\n"
                  "#ifdef CONFIG_KSU\n"
                  "static inline bool may_mount(void);\n"
                  "\n"
                  "int path_umount(struct path *path, int flags)\n"
                  "{\n"
                  "\tstruct mount *mnt = real_mount(path->mnt);\n"
                  "\tint ret;\n"
                  "\n"
                  "\tif (flags & ~(MNT_FORCE | MNT_DETACH | "
                  "MNT_EXPIRE | UMOUNT_NOFOLLOW))\n"
                  "\t\treturn -EINVAL;\n"
                  "\n"
                  "\tif (!may_mount())\n"
                  "\t\treturn -EPERM;\n"
                  "\n"
                  "\tret = do_umount(mnt, flags);\n"
                  "\n"
                  "\tdput(path->dentry);\n"
                  "\tmntput_no_expire(mnt);\n"
                  "\n"
                  "\treturn ret;\n"
                  "}\n"
                  "#endif\n"
              )

              src = src.replace(
                  tail,
                  tail + backport,
                  1
              )

              namespace.write_text(src)

          header = internal.read_text()
          declaration = "int path_umount(struct path *path, int flags);"

          if declaration not in header:
              header += (
                  "\n\n"
                  "/* CMK9_PATH_UMOUNT_BACKPORT */\n"
                  "#ifdef CONFIG_KSU\n"
                  + declaration +
                  "\n"
                  "#endif\n"
              )

              internal.write_text(header)

          print("path_umount backport verified")
          PYEOF

      # ─────────────────────────────────────────────────────────────────────────
      # 12. VERIFY PATCHES BEFORE CONFIGURATION
      # ─────────────────────────────────────────────────────────────────────────

      - name: Verify required source integrations
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          grep -q "ksu_handle_sys_reboot" \
            kernel/reboot.c

          grep -q "CMK9_AVC_LOG_SPOOF_SYMBOL_FIX" \
            fs/susfs.c

          grep -q "CMK9_PATH_UMOUNT_BACKPORT" \
            fs/namespace.c

          grep -q "int path_umount" \
            fs/internal.h

          echo "PASS: reboot hook"
          echo "PASS: AVC symbol"
          echo "PASS: path_umount declaration"
          echo "PASS: path_umount implementation"

      # ─────────────────────────────────────────────────────────────────────────
      # 13. CHIMERA OVERLAY
      # ─────────────────────────────────────────────────────────────────────────

      - name: Apply Chimera overlay
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          FAIR="kernel/sched/fair.c"

          if grep -q '750000ULL' "$FAIR"; then
            sed -i \
              's/\(normalized_sysctl_sched_min_granularity\s*=\s*\)750000ULL/\15000000ULL/' \
              "$FAIR"
          fi

          if grep -q '500000UL;' "$FAIR"; then
            sed -i \
              's/\(sysctl_sched_migration_cost\s*=\s*\)500000UL/\12000000UL/' \
              "$FAIR"
          fi

          sed -i \
            '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' \
            "$DEFCONFIG"

          printf \
            'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' \
            "$BRAND" \
            "$BUILD_HOST" \
            >> "$DEFCONFIG"

          printf \
            '#!/bin/sh\nprintf "%%s" "%s"\n' \
            "$BRAND" \
            > scripts/setlocalversion

          chmod +x scripts/setlocalversion

          echo "$BRAND" > localversion

          echo "Chimera overlay applied"

      # ─────────────────────────────────────────────────────────────────────────
      # 14. NORMALIZE KCONFIG
      # ─────────────────────────────────────────────────────────────────────────

      - name: Normalize KSU configuration fragment
        run: |
          set -Eeuo pipefail

          CFG="$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg"

          sed -i \
            's/^CONFIG_KSU_NON_KPROBE=y$/CONFIG_KSU_MANUAL_HOOK=y/' \
            "$CFG"

          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG" || \
            echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CFG"

          sed -i \
            '/^# CONFIG_KSU_KPROBES_HOOK is not set$/d' \
            "$CFG"

          # Manager integration is mandatory for this build.
          sed -i \
            '/^CONFIG_KSU_DISABLE_MANAGER=/d' \
            "$CFG"

          sed -i \
            '/^# CONFIG_KSU_DISABLE_MANAGER is not set$/d' \
            "$CFG"

          echo 'CONFIG_KSU_DISABLE_MANAGER=n' >> "$CFG"

          echo "=== FINAL KSU CONFIG FRAGMENT ==="
          cat "$CFG"

      # ─────────────────────────────────────────────────────────────────────────
      # 15. MERGE CONFIGURATION
      # ─────────────────────────────────────────────────────────────────────────

      - name: Merge kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          cp \
            "$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg" \
            /tmp/chimera-ksu-susfs.cfg

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            "$(basename "$DEFCONFIG")" \
            | tee "$ABS_LOG/defconfig-base.log"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$ABS_OUT" \
            "$ABS_OUT/.config" \
            /tmp/chimera-ksu-susfs.cfg \
            | tee "$ABS_LOG/merge-config.log"

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            olddefconfig \
            | tee -a "$ABS_LOG/merge-config.log"

      # ─────────────────────────────────────────────────────────────────────────
      # 16. DEFINITIVE CONFIGURATION GUARD
      # ─────────────────────────────────────────────────────────────────────────

      - name: Guard KSU Manager and security configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          CFG="$ABS_OUT/.config"
          FAIL=0

          required=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_SUS_KSTAT
          )

          for sym in "${required[@]}"; do
            if grep -q "^${sym}=y$" "$CFG"; then
              echo "OK: ${sym}=y"
            else
              echo "FATAL: ${sym} is not enabled" >&2
              FAIL=1
            fi
          done

          if grep -q '^CONFIG_KSU_DISABLE_MANAGER=y$' "$CFG"; then
            echo "FATAL: CONFIG_KSU_DISABLE_MANAGER=y" >&2
            FAIL=1
          else
            echo "OK: CONFIG_KSU_DISABLE_MANAGER is not enabled"
          fi

          forbidden=(
            CONFIG_RKP_KDP
            CONFIG_UH_RKP
            CONFIG_TIMA
            CONFIG_TIMA_LKMAUTH
            CONFIG_FIVE
            CONFIG_SEC_RESTRICT_ROOTING
            CONFIG_SEC_RESTRICT_SETUID
          )

          for sym in "${forbidden[@]}"; do
            if grep -q "^${sym}=y$" "$CFG"; then
              echo "FATAL: forbidden ${sym}=y" >&2
              FAIL=1
            else
              echo "OK: ${sym} disabled"
            fi
          done

          {
            echo "=== KSU CONFIGURATION ==="
            grep -E \
              '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_DISABLE_MANAGER)' \
              "$CFG" || true

            echo
            echo "=== SELINUX CONFIGURATION ==="
            grep -E \
              '^(CONFIG_SECURITY_SELINUX|CONFIG_SECURITY_SELINUX_BOOTPARAM)' \
              "$CFG" || true

            echo
            echo "=== RESTRICTIVE SAMSUNG SECURITY CONFIGURATION ==="
            grep -E \
              '^(CONFIG_RKP|CONFIG_UH_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_SEC_RESTRICT)' \
              "$CFG" || true
          } | tee "$ABS_LOG/config-summary.txt"

          cp "$CFG" "$ABS_LOG/config.built"

          [[ "$FAIL" -eq 0 ]] || exit 1

      # ─────────────────────────────────────────────────────────────────────────
      # 17. VERIFY KSU MANAGER OBJECTS
      # ─────────────────────────────────────────────────────────────────────────

      - name: Verify KernelSU-Next Manager integration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          KBUILD="drivers/kernelsu/Kbuild"

          [[ -f "$KBUILD" ]] || {
            echo "FATAL: $KBUILD not found" >&2
            exit 1
          }

          if grep -q \
            'manager/apk_sign\.o' \
            "$KBUILD"; then
            echo "OK: manager/apk_sign.o"
          else
            echo "FATAL: manager/apk_sign.o missing" >&2
            exit 1
          fi

          if grep -q \
            'manager/throne_tracker\.o' \
            "$KBUILD"; then
            echo "OK: manager/throne_tracker.o"
          else
            echo "FATAL: manager/throne_tracker.o missing" >&2
            exit 1
          fi

          if grep -q \
            'manager/pkg_observer\.o' \
            "$KBUILD"; then
            echo "OK: manager/pkg_observer.o"
          else
            echo "FATAL: manager/pkg_observer.o missing" >&2
            exit 1
          fi

          if grep -q \
            'CONFIG_KSU_DISABLE_MANAGER' \
            "$KBUILD"; then
            echo "OK: Kbuild contains Manager gating"
          else
            echo "WARN: Kbuild Manager gating not found"
          fi

      # ─────────────────────────────────────────────────────────────────────────
      # 18. TOOLCHAIN RESOLUTION
      # ─────────────────────────────────────────────────────────────────────────

      - name: Resolve toolchain
        run: |
          set -Eeuo pipefail

          TOOLCHAIN="${{ inputs.toolchain }}"

          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_LLVM_IAS="1"
          TC_USE_FULL_LLVM="true"

          case "$TOOLCHAIN" in
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f60b8b55282f002f594f452ce22dfd6cf1fd7e3c/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;

            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;

            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;

            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;

            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;

            zyc_stable)
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-v2"

              TC_URL="$(curl -fsSL \
                "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt")"

              ;;

            clang21-eva-gcc)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              TC_USE_FULL_LLVM="false"
              TC_LLVM_IAS="0"
              ;;
          esac

          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_LLVM_IAS=$TC_LLVM_IAS"
            echo "TC_USE_FULL_LLVM=$TC_USE_FULL_LLVM"
          } >> "$GITHUB_ENV"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          ARCHIVE="/tmp/clang_archive"

          aria2c \
            -x4 \
            -s4 \
            -q \
            -d /tmp \
            -o clang_archive \
            "$TC_URL" \
            || wget -O "$ARCHIVE" "$TC_URL"

          rm -rf toolchains/clang
          mkdir -p toolchains/clang

          case "$TC_ARCHIVE_FMT" in
            tar.gz|tar)
              tar \
                -C toolchains/clang \
                -xzf "$ARCHIVE"
              ;;

            tar.xz)
              tar \
                -C toolchains/clang \
                -xJf "$ARCHIVE"
              ;;

            tar.zst)
              zstd \
                -d \
                "$ARCHIVE" \
                -o /tmp/clang.tar \
                --force

              tar \
                -C toolchains/clang \
                -xf /tmp/clang.tar
              ;;
          esac

          chmod +x \
            toolchains/clang/bin/* \
            2>/dev/null || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: >-
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ─────────────────────────────────────────────────────────────────────────
      # 19. FINAL CONFIGURATION
      # ─────────────────────────────────────────────────────────────────────────

      - name: Finalise kernel configuration
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          cp \
            "$ABS_OUT/.config" \
            "$ABS_LOG/config.built"

          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_KSU_DISABLE_MANAGER|CONFIG_SECURITY_SELINUX|CONFIG_LOCALVERSION)' \
            "$ABS_OUT/.config" \
            | tee "$ABS_LOG/config-summary-final.txt"

      # ─────────────────────────────────────────────────────────────────────────
      # 20. BUILD IMAGE + DTBS SEPARATELY
      # ─────────────────────────────────────────────────────────────────────────

      - name: Build kernel Image and device DTBs
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: ${{ env.BUILD_USER }}
          KBUILD_BUILD_HOST: ${{ env.BUILD_HOST }}
          KBUILD_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        run: |
          set -Eeuo pipefail

          export PATH="$ABS_TC/bin:$PATH"

          JOBS="$(nproc)"

          MAKE_ARGS=(
            "O=$ABS_OUT"
            "ARCH=arm64"
            "CC=ccache clang"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "CROSS_COMPILE=aarch64-linux-gnu-"
            "CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
            "-j${JOBS}"
            "LOCALVERSION=${BRAND}"
          )

          if [[ "${{ inputs.toolchain }}" != "clang21-eva-gcc" ]]; then

            for tool in ar nm objcopy objdump strip; do
              ln -sf \
                "$ABS_TC/bin/llvm-${tool}" \
                "$ABS_TC/bin/aarch64-linux-gnu-${tool}"
            done

            ln -sf \
              "$ABS_TC/bin/ld.lld" \
              "$ABS_TC/bin/aarch64-linux-gnu-ld"

            MAKE_ARGS+=(
              "LLVM=1"
              "LLVM_IAS=1"
              "LD=ld.lld"
              "AR=llvm-ar"
              "NM=llvm-nm"
              "OBJCOPY=llvm-objcopy"
              "OBJDUMP=llvm-objdump"
              "STRIP=llvm-strip"
              "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error -fuse-ld=lld"
            )

          else

            MAKE_ARGS+=(
              "LLVM_IAS=0"
              "HOSTCC=gcc"
              "HOSTCXX=g++"
              "LD=aarch64-linux-gnu-ld"
              "AR=aarch64-linux-gnu-ar"
              "NM=aarch64-linux-gnu-nm"
              "OBJCOPY=aarch64-linux-gnu-objcopy"
              "OBJDUMP=aarch64-linux-gnu-objdump"
              "STRIP=aarch64-linux-gnu-strip"
              "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error"
            )

          fi

          make \
            "${MAKE_ARGS[@]}" \
            Image \
            dtbs \
            2>&1 \
            | tee "$ABS_LOG/build.log"

      # ─────────────────────────────────────────────────────────────────────────
      # 21. VERIFY KSU SYMBOLS
      # ─────────────────────────────────────────────────────────────────────────

      - name: Verify KSU/SUSFS runtime symbols
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          VMLINUX="$ABS_OUT/vmlinux"

          [[ -f "$VMLINUX" ]] || {
            echo "FATAL: vmlinux missing" >&2
            exit 1
          }

          if [[ "$TC_USE_FULL_LLVM" == "true" ]]; then
            NM=llvm-nm
          else
            NM=nm
          fi

          "$NM" \
            "$VMLINUX" \
            > "$ABS_LOG/vmlinux-symbols.log" \
            2>&1 || true

          required_symbols=(
            ksu_handle_execveat
            ksu_handle_faccessat
            ksu_handle_sys_reboot
            susfs_is_inode_sus_path
          )

          FAIL=0

          for sym in "${required_symbols[@]}"; do
            if grep -qE \
              "^[0-9a-fA-F]+ [A-Za-z] ${sym}$" \
              "$ABS_LOG/vmlinux-symbols.log"; then
              echo "OK: $sym"
            else
              echo "FATAL: missing symbol: $sym" >&2
              FAIL=1
            fi
          done

          [[ "$FAIL" -eq 0 ]] || exit 1

      # ─────────────────────────────────────────────────────────────────────────
      # 22. ASSEMBLE LEGACY SAMSUNG DTB.IMG
      # ─────────────────────────────────────────────────────────────────────────

      - name: Assemble legacy Samsung dtb.img
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          DTB_DIR="$ABS_OUT/arch/arm64/boot/dts/exynos"

          mkdir -p "$ART_DIR"

          mapfile -t DTB_FILES < <(
            find "$DTB_DIR" \
              -maxdepth 1 \
              -type f \
              -iname "*star2lte*.dtb" \
              | sort
          )

          if [[ "${#DTB_FILES[@]}" -eq 0 ]]; then
            echo "FATAL: no star2lte DTB found under $DTB_DIR" >&2
            find "$ABS_OUT/arch/arm64/boot/dts" \
              -type f \
              -name "*.dtb" \
              >&2 || true
            exit 1
          fi

          printf '%s\n' \
            "${DTB_FILES[@]}" \
            | tee "$ABS_LOG/dtb-files.txt"

          cat \
            "${DTB_FILES[@]}" \
            > "$ART_DIR/dtb.img"

          [[ -s "$ART_DIR/dtb.img" ]] || {
            echo "FATAL: dtb.img is empty" >&2
            exit 1
          }

          cp \
            "${DTB_FILES[@]}" \
            "$ART_DIR/"

          echo "DTB_SIZE=$(stat -c%s "$ART_DIR/dtb.img")" \
            >> "$GITHUB_ENV"

      # ─────────────────────────────────────────────────────────────────────────
      # 23. PACKAGE IMAGE
      # ─────────────────────────────────────────────────────────────────────────

      - name: Package Image
        if: ${{ inputs.dry_run != 'true' }}
        id: package-image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          IMG="$ABS_OUT/arch/arm64/boot/Image"

          [[ -f "$IMG" ]] || {
            echo "FATAL: Image not found at $IMG" >&2
            exit 1
          }

          cp \
            "$IMG" \
            "$ART_DIR/Image"

          BUILD_TAG="chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"

          echo "BUILD_TAG=$BUILD_TAG" \
            >> "$GITHUB_ENV"

          echo "ART_DIR=$ART_DIR" \
            >> "$GITHUB_ENV"

          echo "image_path=$ART_DIR/Image" \
            >> "$GITHUB_OUTPUT"

          echo "dtb_path=$ART_DIR/dtb.img" \
            >> "$GITHUB_OUTPUT"

      # ─────────────────────────────────────────────────────────────────────────
      # 24. UPLOAD IMAGE ARTIFACT
      # ─────────────────────────────────────────────────────────────────────────

      - name: Upload Image artifact
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-Image-${{ inputs.profile }}-${{ inputs.toolchain }}
          path: ${{ steps.package-image.outputs.image_path }}
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────────────────────
      # 25. UPLOAD DTB ARTIFACT
      # ─────────────────────────────────────────────────────────────────────────

      - name: Upload DTB artifact
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-dtb-${{ inputs.profile }}-${{ inputs.toolchain }}
          path: |
            ${{ env.ART_DIR }}/dtb.img
            ${{ env.ART_DIR }}/*.dtb
          if-no-files-found: error

      # ─────────────────────────────────────────────────────────────────────────
      # 26. RELEASE
      # ─────────────────────────────────────────────────────────────────────────

      - name: Create GitHub Release
        if: ${{ inputs.do_release == true && inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "Chimera Mk9 — ${{ inputs.profile }} / ${{ inputs.toolchain }}"
          body: |
            ## Chimera Mk9 — ExyHyperBrick Merge Build

            | Field | Value |
            |---|---|
            | Base | `${{ env.BASE_REPO }}` @ `${{ env.BASE_COMMIT }}` |
            | Chimera Mk8 | `${{ env.CHIMERA_COMMIT }}` |
            | KernelSU-Next | `${{ inputs.ksu_commit }}` |
            | Profile | `${{ inputs.profile }}` |
            | Toolchain | `${{ inputs.toolchain }}` |
            | uname | `${{ env.UNAME_PREVIEW }}` |
            | Packaging | Separate Image + dtb.img |

          files: |
            ${{ steps.package-image.outputs.image_path }}
            ${{ steps.package-image.outputs.dtb_path }}

          draft: false
          prerelease: false

      # ─────────────────────────────────────────────────────────────────────────
      # 27. UPLOAD LOGS
      # ─────────────────────────────────────────────────────────────────────────

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-logs-${{ github.run_id }}
          path: |
            ${{ env.ABS_LOG }}/**
            ${{ env.ABS_OUT }}/.config
          if-no-files-found: warn
