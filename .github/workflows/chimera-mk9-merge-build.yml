# VERSION HISTORY (append-only — do not delete prior entries)
#
# v.20260822a — CI incident: "unrecognised emulation mode: aarch64linux" at
#   VDSOL arch/arm64/kernel/vdso/vdso.so.dbg (run failed with exit code 2 at
#   vdso_prepare, before vmlinux link is ever reached).
#   Root cause: arch/arm64/kernel/vdso/Makefile's VDSOL rule links
#   vdso.so.dbg via its own $(CC) invocation and does not reliably inherit
#   the top-level KBUILD_LDFLAGS make variable on this 4.9.337 tree. Prior
#   to v.20260821b, -fuse-ld=lld lived in CHIMERA_KCFLAGS, which IS exported
#   to every clang invocation including this one, so it worked. The
#   2026-08-21 refactor (see that entry below, item 3) moved -fuse-ld=lld
#   out of KCFLAGS and into KBUILD_LDFLAGS only, on the reasoning that it's
#   "a linker flag". That's true for the final vmlinux link (which does
#   correctly receive KBUILD_LDFLAGS), but the vdso sub-make's link step
#   does not consume KBUILD_LDFLAGS the same way, so it silently fell back
#   to whatever `ld` is first on $PATH — the host runner's default
#   /usr/bin/ld (GNU bfd, x86_64-only emulations: elf_x86_64, elf32_x86_64,
#   elf_i386, elf_iamcu, i386pep, i386pe) — which cannot emit
#   aarch64linux and fails immediately.
#   FIX: -fuse-ld=lld restored to CHIMERA_KCFLAGS (kept in
#   CHIMERA_KBUILD_LDFLAGS too — harmless duplication, and still correct
#   for the final vmlinux link). KCFLAGS reaches every clang invocation in
#   this build, including host tools, vdso, and the main kernel objects,
#   so this closes the gap unconditionally rather than only for the
#   top-level make target.
#   VERIFICATION: re-run with dry_run:false, same profile/toolchain that
#   failed; confirm "VDSOL arch/arm64/kernel/vdso/vdso.so.dbg" no longer
#   emits "unrecognised emulation mode" and the build proceeds into normal
#   object compilation. Step 18b ("Verify build identity and KCFLAGS")
#   requires no changes — it hashes whatever CHIMERA_KCFLAGS currently is,
#   not a hardcoded value, so the manifest/identity/hash all pick up the
#   new flag automatically.
#   NOT INDEPENDENTLY CONFIRMED: the exact LDFLAGS variable name consumed
#   by arch/arm64/kernel/vdso/Makefile on the gavdoc38 base was not read
#   directly as part of this fix (inferred from the failure point in the
#   log plus the 2026-08-21 changelog entry that introduced the
#   regression). If this recurs, run
#     grep -n 'LDFLAGS\|fuse-ld' kernel/arch/arm64/kernel/vdso/Makefile
#   against the checked-out base to confirm/correct this diagnosis against
#   the actual Makefile text.
# ─────────────────────────────────────────────────────────────────────────────

