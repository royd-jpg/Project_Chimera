
name: Project Chimera Mk9 — gavdoc38 Canonical Base Build v.20260813

# ─────────────────────────────────────────────────────────────────────────────
# REFACTOR RATIONALE / BASE PIN HISTORY (corrected — the previous revision
# of this comment claimed a re-pin to e0710943f1c00397054e5d9995376195
# ce38d58e and then to 4d8c9e7c675b77d8b00fa0080b2aa61474fd21c4, with
# KernelSU-Next moved to 8ff37831ecea3e5a00dd3940c0c658e81f27c202. Neither
# of those SHAs matches the base_ref/ksu_commit defaults actually declared
# below, so that narrative was stale relative to this file and has been
# removed rather than repeated).
#
# CURRENT PIN OF RECORD (matches base_ref/ksu_commit input defaults below):
#   base_ref (gavdoc38/android_kernel_samsung_exynos9810, branch
#   lineage-23.2-ksun3-susfs2): 73892fe0c3b2462195e7558737c2feab2416422a
#   ksu_commit (KernelSU-Next submodule):
#   ffdff69a2cbea4378c09d915022fea9850a21696
#   This SHA was independently verified fetchable from the base_repo
#   during this refactor. It was NOT re-verified against the fix-log
#   items below at this pin (that verification was performed against
#   prior pins referenced in earlier drafts of this file, not this exact
#   commit) — re-run steps 7/8/9/11b against this pin before relying on
#   the fix-log claims verbatim.
#
# NOTE ON UPSTREAM STABILITY: base_ref pins a specific commit, not a
# branch name, because gavdoc38 has force-pushed this branch before. A
# pinned SHA can still go stale if the upstream repo rewrites history
# again or if GitHub eventually garbage-collects an orphaned commit. This
# workflow's "Detect base branch-tip drift" step logs whenever the live
# branch tip differs from base_ref — it does NOT advance the pin
# automatically. If a build fails at the "Preflight — verify base ref"
# step with a checkout/fetch error, check
# https://github.com/gavdoc38/android_kernel_samsung_exynos9810/commits/lineage-23.2-ksun3-susfs2
# for the current tip and re-pin both base_ref and ksu_commit together
# (verifying the new tip's files match the fix-log items above before
# assuming it's a drop-in replacement — do not assume drift alone means
# the new tip is safe to adopt).
#
# TOOLCHAIN MERGE (2026-07-30): llvm20/llvm21 (korg-hosted LLVM release
# tarballs) restored into this version's toolchain matrix — present in an
# earlier draft of this workflow but missing from this v.20260730 base.
# URLs/cache keys carried over unchanged; zyc_stable's dynamic
# Clang-main-link.txt lookup (this version's own approach, not the older
# hardcoded-URL one) is left as-is.
# ─────────────────────────────────────────────────────────────────────────────

# ARCHITECTURE CHANGE
#   Previous Mk9 iterations took a vanilla ExyHyperBrick base and hand-rolled
#   the entire KSU-Next + SUSFS wiring via ad hoc python/sed patches applied
#   in-workflow. That approach was the source of every bug below. gavdoc38 has
#   since published a canonical, working integration commit with the
#   KernelSU-Next submodule pinned and every required backport already
#   applied correctly. This workflow now takes that commit as BASE_REPO,
#   eliminating the hand-rolled patches entirely and replacing them with
#   fail-fast verification steps. Chimera-specific overlay work (scheduler
#   tuning, defconfig branding, SUS_MAP/sus_path Chimera patches) is
#   unaffected and still applies on top.
#
# CONFIRMED BUGS FIXED (each independently re-derived from primary source,
# not taken on faith from a prior session's uploaded notes)
#
# [A] Redundant / double-invoked setresuid hook — ROOT CAUSE of "su detected,
#     root grant fails, manager restart fails"
#     ---------------------------------------------------------------------
#     The previous workflow patched kernel/sys.c's SYSCALL_DEFINE3(setresuid)
#     body to call ksu_handle_setresuid() directly. This is unnecessary and
#     harmful: verified against KernelSU-Next kernel/hook/lsm_hooks.c, the
#     driver registers a full LSM hook table (ksu_hooks[]) unconditionally
#     whenever CONFIG_KSU_KPROBES_HOOK is NOT set (i.e. manual-hook mode,
#     which this defconfig forces for a 4.9.337 target). That table includes
#     LSM_HOOK_INIT(task_fix_setuid, ksu_task_fix_setuid), and
#     ksu_task_fix_setuid() itself calls ksu_handle_setresuid(). This hook is
#     registered from kernel/core/init.c's normal (non-late-load) init path
#     unconditionally. The kernel's own setresuid/setreuid/setuid syscalls
#     already call security_task_fix_setuid() as stock behavior — no kernel
#     source patch is required to reach KSU-Next's handler.
#     The manual kernel/sys.c patch therefore caused ksu_handle_setresuid()
#     to run twice per credential transition: once via the legitimate LSM
#     dispatch, once via the direct call this patch inserted. If that handler
#     has any non-idempotent state (allowlist consumption, one-shot grant
#     flags, replay protection), the second call is the most likely
#     explanation for "root detected but grant/manager-restart fails."
#     FIX: kernel/sys.c is no longer touched. A verification step confirms
#     the LSM hook and its symbols are compiled in instead.
#
# [B] fs/susfs.c AVC log-spoofing "fix" was actively wrong for this base
#     -------------------------------------------------------------------
#     Previous workflow defined `bool susfs_is_avc_log_spoofing_enabled =
#     false;` directly in fs/susfs.c on the assumption that no other
#     translation unit defines it. Verified false for the gavdoc38 base:
#     security/selinux/avc.c:56 already contains
#     `bool susfs_is_avc_log_spoofing_enabled = false;`, and fs/susfs.c's
#     `extern bool susfs_is_avc_log_spoofing_enabled;` is the correct,
#     intended declaration referencing that definition. Applying the old
#     patch would produce two definitions of the same global in the same
#     link unit — a hard "multiple definition" error under -fno-common,
#     which is the default for modern GCC and for LLD (this workflow's linker).
#     FIX: patch removed. A verify-only step confirms avc.c defines it
#     exactly once and fs/susfs.c only declares it extern.
#
# [C] path_umount/can_umount hand backport was incomplete
#     -----------------------------------------------------
#     The ad hoc backport implemented path_umount() but only guarded it with
#     may_mount() — omitting check_mnt(), the MNT_LOCKED check, the
#     path->dentry == path->mnt->mnt_root validation, and the
#     CAP_SYS_ADMIN gate on MNT_FORCE that upstream's can_umount() performs.
#     This is a real correctness/security gap (a namespace could be
#     unmounted while still attached to a locked mount, or while not being
#     the root of that mount). Verified: the gavdoc38 base already carries
#     the complete can_umount() + path_umount() pair from the referenced
#     commit, inserted immediately before is_mnt_ns_file() in fs/namespace.c,
#     with a matching declaration in fs/internal.h placed after mnt_init().
#     FIX: hand backport removed. Verify-only step confirms both functions
#     and the correct check_mnt/MNT_LOCKED/CAP_SYS_ADMIN logic are present.
#
# [D] kernel/reboot.c hook — no longer needed as a patch
#     ----------------------------------------------------
#     gavdoc38 base already declares and calls ksu_handle_sys_reboot() at
#     the correct site in SYSCALL_DEFINE4(reboot, ...). Verified directly.
#     FIX: patch removed, replaced with verification.
#
# [E] CONFIG_KSU_NON_KPROBE is not a real Kconfig symbol
#     ----------------------------------------------------
#     Verified against KernelSU-Next kernel/Kconfig: the only relevant
#     symbols are CONFIG_KSU_MANUAL_HOOK and CONFIG_KSU_KPROBES_HOOK
#     (mutually exclusive, KSU_MANUAL_HOOK defaults to y). Kconfig
#     enforcement step already used the correct name and is kept/hardened.
#
# [F] Kbuild self-patch race condition (structural hardening, independent of
#     A–E)
#     -----------------------------------------------------------------------
#     KernelSU-Next's kernel/Kbuild performs its own backport detection and
#     application via $(shell grep ...)/$(shell sed -i ...) at Makefile-parse
#     time for the drivers/kernelsu sub-make. Under Linux's recursive Kbuild
#     model, each directory (fs/, security/, drivers/kernelsu/, ...) is built
#     by its own sub-make invocation, and there is no guaranteed ordering
#     between them — especially under `make -j`. If fs/'s sub-make compiles
#     fs/namespace.c before drivers/kernelsu's Kbuild has run its sed pass,
#     any *new* symbol the self-patch would introduce is simply absent from
#     the already-compiled object, producing a late, confusing
#     "undefined reference" at final link rather than a clear build error.
#     This is exactly the failure class item [C] used to occur as (before
#     gavdoc38's base existed). Since we now take the backports from a
#     verified base rather than relying on runtime self-patching, this
#     workflow adds a pre-build step that independently re-evaluates every
#     one of KSU-Next's Kbuild self-patch guards and asserts each is already
#     satisfied (a guaranteed no-op) before `make` is invoked. Any drift
#     (e.g. a future KSU-Next bump reintroducing a check our base doesn't
#     satisfy) fails fast at an attributable step instead of at final link.
#
# [G] hooks.c selinux_cred() consistency gap (verified, non-fatal)
#     ---------------------------------------------------------------------
#     KSU-Next's own Kbuild guard for patching security/selinux/hooks.c's
#     cred->security / current_security() call sites to use the
#     selinux_cred() wrapper was originally: `grep -q "selinux_cred" hooks.c`.
#     On the gavdoc38 base (at the time this was found) this was a false
#     positive: hooks.c already contained the unrelated LSM hook function
#     names selinux_cred_alloc_blank, selinux_cred_free,
#     selinux_cred_prepare, and selinux_cred_transfer, each of which matches
#     the substring "selinux_cred" without the conversion ever having been
#     applied. As a result the intended sed-based conversion never ran,
#     leaving dozens of call sites in hooks.c accessing cred->security
#     directly instead of going through selinux_cred(), even though
#     objsec.h already defines that wrapper. This was NOT a build-breaking
#     bug — selinux_cred() is a pure passthrough (`return cred->security;`)
#     so both forms are semantically identical — but it was fixed here for
#     consistency using precise, line-anchored substitutions (not a blanket
#     substring sed, to avoid touching the legitimate selinux_cred_* hook
#     function definitions).
#
#     UPSTREAM STATUS: gavdoc38 independently found and fixed the same
#     root cause upstream, changing the guard to
#     `grep -Eq 'selinux_cred\(.*\)'` (commit 7ad023015276b715261ae8f1230
#     fc9c562ba8f34 on gavdoc38/KernelSU-Next, confirmed to also exist
#     verbatim on official KernelSU-Next/KernelSU-Next's legacy branch, so
#     this was never gavdoc38-specific). That fix is a real, confirmed
#     improvement and is now baked into the gavdoc38 base this workflow
#     pins (see base_ref/ksu_commit below). This workflow's own step 10
#     hardening pass is KEPT regardless, for two reasons:
#       1. defense in depth — it does not depend on KSU-Next's Kbuild guard
#          at all, so a future upstream regression of the guard cannot
#          silently reintroduce this gap here.
#       2. it is NOT fully redundant even against the fixed upstream base.
#          Verified directly: 4 read sites remain unconverted in hooks.c
#          even with the corrected guard, all of the form
#          `rc = selinux_determine_inode_label(current_security(), ...)`
#          or `rc = selinux_determine_inode_label(old->security, ...)`.
#          The two original KSU-Next sed lines for these calls assume a
#          single-argument call (matching only if a closing paren
#          immediately follows current_security()/old->security), but the
#          real function always takes several arguments, so the literal
#          sed pattern never matches actual code. This is a second,
#          independent bug from the guard issue above, and — checked —
#          is likewise inherited verbatim from official
#          KernelSU-Next/KernelSU-Next legacy, not introduced by gavdoc38.
#     FIX: this workflow's step 10 patterns cover all of the original 13
#     substitution forms; the old->security variant's regex was corrected
#     to not require a trailing paren immediately after old->security
#     (mirroring the fix already applied, by design, to the
#     current_security() variant's pattern), so all 4 sites are now
#     actually converted here regardless of what upstream's own sed
#     patterns do or don't catch.
#
# [I] base_ref / ksu_commit pin — corrected, no longer claims an
#     unverified SHA pair
#     ---------------------------------------------------------------------
#     A prior draft of this comment claimed base_ref had been re-pinned to
#     4d8c9e7c675b77d8b00fa0080b2aa61474fd21c4 with KernelSU-Next at
#     8ff37831ecea3e5a00dd3940c0c658e81f27c202. Those SHAs do not match
#     this file's actual base_ref/ksu_commit input defaults
#     (73892fe0c3b2462195e7558737c2feab2416422a /
#     ffdff69a2cbea4378c09d915022fea9850a21696) and that claim is
#     withdrawn rather than carried forward unverified. gavdoc38 has
#     force-pushed lineage-23.2-ksun3-susfs2 at least once in the past, so
#     a pinned SHA going stale relative to the branch tip is expected
#     background risk, not a one-time event — this is exactly why the
#     "Detect base branch-tip drift" step exists and why it only logs,
#     never advances the pin.
#
#     PROCEDURAL RULE (still correct, kept regardless of which exact SHAs
#     are pinned): base_ref and ksu_commit must always be bumped together.
#     Updating one without the other means the KSU-Next submodule
#     re-pin step would force-checkout ksu_commit regardless of what the
#     base checkout brought in, silently discarding whichever half of an
#     upstream integration commit wasn't picked up.
#
# [H] Chimera device-specific overlay — verified content, wrong commit SHA
#     caught and corrected
#     ---------------------------------------------------------------------
#     Royd's request cited commit 1e5fcf05609a2d5cd5398900ebd61e057d407093
#     as the source of the kernel/sched/fair.c scheduler tuning. Verified
#     directly: that commit's actual diff touches
#     kernel/sched/cpufreq_schedutil.c (sugov rate limits), not fair.c. The
#     fair.c tuning (normalized_sysctl_sched_min_granularity: 750000ULL ->
#     5000000ULL, sysctl_sched_migration_cost: 500000UL -> 2000000UL) is
#     real — confirmed by a direct file diff against the gavdoc38 base —
#     just not from that SHA. Applied via the verified diff, not the
#     citation.
#
#     Two additional genuine gaps were found and confirmed by diffing
#     royd-jpg/Project_Chimera@chimera-mk8 against the gavdoc38 base file
#     by file:
#
#       - fs/proc/base.c: gavdoc38 has the SUS_MAP guard in the
#         /proc/pid/maps iteration path but is missing it in mem_rw()
#         (the /proc/pid/mem read/write path). Without it, a file hidden
#         from /proc/pid/maps via SUS_MAP remains fully readable/writable
#         through /proc/pid/mem — a real detection-bypass gap, not a
#         duplicate of the existing guard.
#
#       - fs/namei.c: gavdoc38 has the primary sus_path hooks
#         (lookup_dcache/__lookup_hash/lookup_fast/lookup_slow/lookup_open)
#         but is missing chimera-mk8's second sus_path re-check inserted
#         immediately after may_lookup() inside link_path_walk()'s main
#         loop. This is applied and verified here as defense-in-depth
#         only: no race between may_lookup()'s revalidation and the
#         primary sus_path checks has been demonstrated on this base. The
#         re-check is a low-cost second gate on the same condition, not a
#         fix for a confirmed exploitable window.
#
#     All five device-specific patches (UFC short-circuit, the two gaps
#     above, fair.c tuning, and the DTS board tuning) now live in
#     patches/apply_chimera_overlay_patches.sh, each anchored on the exact
#     verified upstream text and idempotent. A new post-overlay
#     verification step (11b) fails the build hard if any of the five
#     markers is missing, so the overlay can never silently drop out again.
#
#     A sixth, seventh, and eighth patch were added on request, all three
#     confirmed against their actual commit diffs:
#       - 1e5fcf05609a2d5cd5398900ebd61e057d407093: hardcodes
#         sugov_update_rate_limit_us()'s up_rate_limit_us=1500 /
#         down_rate_limit_us=16000.
#       - f21ae9c9c3b5b817724f71a21d2d1a9dbd03c0c5: moves
#         sugov_kthread_create()'s worker thread from
#         SCHED_FIFO/MAX_USER_RT_PRIO/2 to SCHED_RR/priority=1. (This
#         commit's diff also touches CONFIG_LOCALVERSION in the defconfig;
#         that part is NOT applied — LOCALVERSION is already fully owned
#         by the workflow's brand input.)
#       - 745fb40c25fcb18641f926fd616b642438b98b89: applies the same
#         up_rate_limit_us=1500/down_rate_limit_us=16000 pair a second
#         time, at sugov_init() (policy-init time) rather than only on
#         later updates.
#     Together these three fully replicate chimera-mk8's current
#     cpufreq_schedutil.c at all three sites — confirmed by diffing the
#     patched result against chimera-mk8's actual file after applying all
#     three (identical except for marker comments).
#
# ─────────────────────────────────────────────────────────────────────────────
# PACKAGING
#
# Image and DTBs are built and uploaded separately:
#
#   - chimera-mk9-Image-<profile>-<toolchain>
#   - chimera-mk9-dtb-<profile>-<toolchain>
#
# dtb.img is a raw concatenation of the built star2lte DTBs, matching the
# legacy Samsung DTB image format used by this device generation.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

concurrency:
  group: chimera-mk9-${{ github.event.inputs.profile }}-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.base_ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: cm9 (runtime SUSFS spoof) or cm9e (compile-time identity)"
        required: true
        type: choice
        options: [cm9, cm9e]
        default: cm9

      toolchain:
        description: "Toolchain: llvm22/llvm21/llvm20/aosp22/aosp21/aosp20/aosp19/neutron19/neutron23/zyc_stable"
        required: true
        type: choice
        options: [llvm22, llvm21, llvm20, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, zyc_stable]
        default: llvm22

      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force re-apply Chimera overlay patches even if markers present"
        required: false
        type: boolean
        default: false

      base_repo:
        description: "Canonical KSU-Next+SUSFS integration base (owner/repo)"
        required: false
        type: string
        default: "gavdoc38/android_kernel_samsung_exynos9810"

      base_ref:
        description: "Base ref: full 40-hex commit SHA only (not a branch name — see fix-log item [I]). Default is the current pin of record; the live branch tip is logged for drift but never substituted automatically."
        required: false
        type: string
        default: "4428629dc94ab9d55eba804dfda846d8563d56e5"

      ksu_commit:
        description: "KernelSU-Next exact commit SHA (full 40-hex, pin; overrides submodule-pinned commit if different) — must be bumped together with base_ref, see fix-log item [I]"
        required: false
        type: string
        default: "ffdff69a2cbea4378c09d915022fea9850a21696"

      base_branch_hint:
        description: "Branch name to compare base_ref against for drift logging ONLY — never used as the actual checkout ref"
        required: false
        type: string
        default: "lineage-23.2-ksun3-susfs2"

      susfs_note:
        description: "SUSFS provenance note only — SUSFS is vendored into the gavdoc38 base tree (branch suffix '-susfs2'), not a separate checkout"
        required: false
        type: string
        default: "vendored in base branch lineage-23.2-ksun3-susfs2"

      brand:
        description: "LOCALVERSION suffix (must start with '-')"
        required: false
        type: string
        default: "-Chimera_Mk9"

      build_user:
        description: "KBUILD_BUILD_USER"
        required: false
        type: string
        default: "GA"

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "CM9XNNNN"

      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        required: false
        type: string
        default: "1"

      build_date:
        description: "KBUILD_BUILD_TIMESTAMP (deterministic)"
        required: false
        type: string
        default: "Tue Aug 11 09:53:32 CEST 2026"

env:
  CHIMERA_REPO: "https://github.com/royd-jpg/Project_Chimera.git"
  CHIMERA_REF: "chimera-mk8"

  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  ANYKERNEL_DIR: "anykernel3"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"

  CCACHE_MAXSIZE: "3G"

  BRAND_DEFAULT: "-Chimera_Mk9"
  BUILD_USER_DEFAULT: "GA"
  BUILD_HOST_DEFAULT: "CM9XNNNN"
  BUILD_VERSION_DEFAULT: "1"
  KBUILD_BUILD_TIMESTAMP_DEFAULT: "Mon 1 Jan 00:00:00 UTC 2026"

  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  IDENTITY_ENGINE_ACTIVE: ${{ inputs.profile == 'cm9e' }}
  FORCE_REPATCH: ${{ inputs.force_repatch }}
  BASE_REPO: ${{ inputs.base_repo }}

jobs:
  build:
    name: Chimera Mk9 Merge Build — ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:

      # ── 0a. Validate inputs ───────────────────────────────────────────────────
      - name: Validate workflow inputs
        run: |
          set -Eeuo pipefail

          FAIL=0

          # profile / toolchain are `choice` type so the UI already
          # constrains them, but workflow_dispatch via the REST API can
          # pass an arbitrary string — validate explicitly rather than
          # trusting the UI constraint.
          case "${{ inputs.profile }}" in
            cm9|cm9e) : ;;
            *) echo "FATAL: profile must be 'cm9' or 'cm9e', got '${{ inputs.profile }}'" >&2; FAIL=1 ;;
          esac

          case "${{ inputs.toolchain }}" in
            llvm22|llvm21|llvm20|aosp22|aosp21|aosp20|aosp19|tron19|tron23|zyc_stable) : ;;
            *) echo "FATAL: unsupported toolchain '${{ inputs.toolchain }}'" >&2; FAIL=1 ;;
          esac

          # base_ref / ksu_commit must be exact 40-hex commit SHAs — this
          # workflow's determinism and drift-logging both depend on a
          # pinned commit, not a movable branch name.
          if ! [[ "${{ inputs.base_ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: base_ref must be a full 40-hex commit SHA, got '${{ inputs.base_ref }}'" >&2
            FAIL=1
          fi

          if ! [[ "${{ inputs.ksu_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: ksu_commit must be a full 40-hex commit SHA, got '${{ inputs.ksu_commit }}'" >&2
            FAIL=1
          fi

          if [[ -z "${{ inputs.base_repo }}" || "${{ inputs.base_repo }}" != */* ]]; then
            echo "FATAL: base_repo must be 'owner/repo', got '${{ inputs.base_repo }}'" >&2
            FAIL=1
          fi

          if [[ "${{ inputs.brand }}" != -* ]]; then
            echo "FATAL: brand must start with '-', got '${{ inputs.brand }}'" >&2
            FAIL=1
          fi

          if [[ -z "${{ inputs.build_date }}" ]]; then
            echo "FATAL: build_date must not be empty" >&2
            FAIL=1
          fi

          [[ "$FAIL" -eq 0 ]] || exit 1

          echo "PASS: all workflow_dispatch inputs valid"

      # ── 0b. Clean workspace before any checkout ───────────────────────────────
      - name: Clean workspace (prevent cross-run contamination)
        run: |
          set -Eeuo pipefail

          # ubuntu-24.04 GitHub-hosted runners are ephemeral, but
          # actions/checkout with clean:false (used below, deliberately, so
          # the kernel checkout doesn't fight the self-checkout for the same
          # directory) does not itself guarantee an empty $GITHUB_WORKSPACE.
          # Make that guarantee explicit and independent of runner reuse.
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          echo "Workspace clean: $(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 | wc -l) entries remain"

      # ── 1. Host dependencies ────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y --no-install-recommends \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            lzop \
            python3 \
            rsync \
            zstd \
            cpio \
            pahole \
            zip

          python3 --version
          curl --version | head -1

      # ── 2. Checkout Project_Chimera (workflow repo — overlay patches + Kconfig) ──
      # CHIMERA_REF is pinned here explicitly so it is actually enforced,
      # not merely declared as an env var — a prior revision of this
      # workflow defined CHIMERA_REF but never passed it to `ref:`, so the
      # self-checkout silently tracked whatever ref triggered the run
      # instead of the pinned branch.
      - name: Checkout Project_Chimera (workflow repo — overlay + Kconfig fragment)
        uses: actions/checkout@v4
        with:
          path: .
          ref: ${{ env.CHIMERA_REF }}
          fetch-depth: 1
          clean: false

      - name: Validate checked-out Project_Chimera revision
        run: |
          set -Eeuo pipefail

          ACTUAL_REF="$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo 'DETACHED')"
          ACTUAL_SHA="$(git rev-parse HEAD)"

          echo "CHIMERA_REF (pinned):      $CHIMERA_REF"
          echo "Checked-out branch/ref:    $ACTUAL_REF"
          echo "Checked-out commit:        $ACTUAL_SHA"

          echo "CHIMERA_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"

          if [[ "$ACTUAL_REF" != "$CHIMERA_REF" && "$ACTUAL_REF" != "DETACHED" ]]; then
            echo "FATAL: checked-out ref '$ACTUAL_REF' does not match pinned CHIMERA_REF '$CHIMERA_REF'" >&2
            exit 1
          fi

      - name: Verify required repo-local files
        run: |
          set -Eeuo pipefail

          MISSING=0

          for f in \
            patches/apply_chimera_overlay_patches.sh \
            chimera-ksu-susfs.cfg \
            chimera-device-specific.cfg; do

            if [[ ! -f "$GITHUB_WORKSPACE/$f" ]]; then
              echo "FATAL: required file missing: $f" >&2
              MISSING=1
            else
              echo "OK: $f"
            fi

          done

          if [[ -f "$GITHUB_WORKSPACE/patches/apply_chimera_overlay_patches.sh" ]]; then
            chmod +x "$GITHUB_WORKSPACE/patches/apply_chimera_overlay_patches.sh"
          fi

          [[ "$MISSING" -eq 0 ]] || exit 1

      # ── 3. Checkout gavdoc38 canonical base (KSU-Next + SUSFS pre-integrated) ──
      - name: Checkout gavdoc38 base (KernelSU-Next + SUSFS canonical integration)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          ref: ${{ inputs.base_ref }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1
          submodules: recursive
          clean: false

      # ── 3b. Detect base branch-tip drift (log only — never auto-advances pin) ──
      - name: Detect base branch-tip drift
        run: |
          set -Eeuo pipefail

          TIP="$(git ls-remote "https://github.com/${{ inputs.base_repo }}.git" \
            "refs/heads/${{ inputs.base_branch_hint }}" | cut -f1 || true)"

          echo "Pinned base_ref:                 ${{ inputs.base_ref }}"
          echo "Live tip of ${{ inputs.base_branch_hint }}: ${TIP:-<lookup failed>}"

          if [[ -z "$TIP" ]]; then
            echo "WARN: could not resolve live branch tip for drift comparison (non-fatal)"
          elif [[ "$TIP" != "${{ inputs.base_ref }}" ]]; then
            echo "::warning::base_ref (${{ inputs.base_ref }}) has drifted from the live tip of ${{ inputs.base_branch_hint }} ($TIP). Pin is NOT auto-advanced. Re-verify fix-log items before repinning."
          else
            echo "OK: base_ref matches the live branch tip — no drift"
          fi

      # ── 3c. Clone and configure AnyKernel3 for star2lte ──────────────────────
      # Mirrors the verified recipe already used in this repo's sibling
      # workflow (build_chimera_mk8_upstream.yml, steps "Clone AnyKernel3" /
      # "Configure AnyKernel3 for star2lte") rather than checking out a
      # separate pre-configured fork — this repo doesn't carry one.
      - name: Clone AnyKernel3
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 "$ANYKERNEL_REPO" "$ANYKERNEL_DIR"
          rm -rf "$ANYKERNEL_DIR/.git" "$ANYKERNEL_DIR/modules" "$ANYKERNEL_DIR/patch" "$ANYKERNEL_DIR/ramdisk"
          echo "AK3 cloned and stripped"
          echo "AK3_DIR=$GITHUB_WORKSPACE/$ANYKERNEL_DIR" >> "$GITHUB_ENV"

      - name: Configure AnyKernel3 for star2lte
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail
          cat > "$AK3_DIR/anykernel.sh" << 'AK3SH'
          # AnyKernel3 — Chimera Mk9
          # Device: Samsung Galaxy S9+ (star2lte / SM-G965x)
          # Platform: Exynos 9810 (UFS block node: 11120000.ufs)
          properties() { '
          kernel.string=Chimera Mk9 by AegisDevLabs
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star2lte
          device.name2=star2ltexx
          device.name3=SM-G965F
          device.name4=SM-G965U
          device.name5=SM-G965N
          supported.versions=9-16
          '; }

          # Named-partition mode: let ak3-core.sh resolve BOOT across
          # by-name / bootdevice/by-name / platform/*/by-name, rather than
          # hardcoding the UFS controller node id (which is not guaranteed
          # stable across kernel/TWRP builds on this device).
          block=boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          . tools/ak3-core.sh
          AK3SH
          echo "anykernel.sh written for star2lte"

      # ── 4. Workspace ─────────────────────────────────────────────────────────
      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR" >> "$GITHUB_ENV"
          echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR" >> "$GITHUB_ENV"
          echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang" >> "$GITHUB_ENV"

      - name: Resolve build identity
        run: |
          set -Eeuo pipefail

          BRAND="${{ inputs.brand }}"
          BRAND="${BRAND:-$BRAND_DEFAULT}"

          [[ "${BRAND:0:1}" == "-" ]] || {
            echo "FATAL: brand must start with '-'" >&2
            exit 1
          }

          BUILD_USER="${{ inputs.build_user }}"
          BUILD_USER="${BUILD_USER:-$BUILD_USER_DEFAULT}"

          BUILD_HOST="${{ inputs.build_host }}"
          BUILD_HOST="${BUILD_HOST:-$BUILD_HOST_DEFAULT}"

          BUILD_VER="${{ inputs.build_version }}"
          BUILD_VER="${BUILD_VER:-$BUILD_VERSION_DEFAULT}"

          BUILD_TS="${{ inputs.build_date }}"
          BUILD_TS="${BUILD_TS:-$KBUILD_BUILD_TIMESTAMP_DEFAULT}"

          UNAME_PREVIEW="Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VER} SMP PREEMPT"

          {
            echo "BRAND=$BRAND"
            echo "BUILD_USER=$BUILD_USER"
            echo "BUILD_HOST=$BUILD_HOST"
            echo "BUILD_VERSION=$BUILD_VER"
            echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TS"
            echo "UNAME_PREVIEW=$UNAME_PREVIEW"
          } >> "$GITHUB_ENV"

          {
            echo "profile=${{ inputs.profile }}"
            echo "toolchain=${{ inputs.toolchain }}"
            echo "brand=$BRAND"
            echo "uname_preview=$UNAME_PREVIEW"
          } > "$ABS_LOG/inputs.env"

      # ── 5. Validate base ─────────────────────────────────────────────────────
      - name: Preflight — verify base ref and clean worktree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          if [[ -n "$(git status --porcelain --ignore-submodules=none)" ]]; then
            echo "FATAL: base checkout is not clean" >&2
            git status --short
            exit 1
          fi

          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile \
            | head -3 \
            | tee "$ABS_LOG/kernel-version.log"

          VER_LINE="$(grep -E '^VERSION\s*=\s*4$' Makefile || true)"
          PATCH_LINE="$(grep -E '^PATCHLEVEL\s*=\s*9$' Makefile || true)"

          if [[ -z "$VER_LINE" || -z "$PATCH_LINE" ]]; then
            echo "FATAL: base is not the expected 4.9.x tree — refusing to proceed" >&2
            exit 1
          fi

          BASE_COMMIT="$(git rev-parse HEAD)"

          if [[ "$BASE_COMMIT" != "${{ inputs.base_ref }}" ]]; then
            echo "FATAL: checked-out HEAD ($BASE_COMMIT) does not match requested base_ref (${{ inputs.base_ref }})" >&2
            exit 1
          fi

          echo "$BASE_COMMIT" > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

          echo "Base repo:   ${{ inputs.base_repo }}"
          echo "Base commit: $BASE_COMMIT"

          [[ -f "$DEFCONFIG" ]] || {
            echo "FATAL: DEFCONFIG not found at $DEFCONFIG in base checkout" >&2
            exit 1
          }
          echo "OK: DEFCONFIG present at $DEFCONFIG"

      # ── 6. KernelSU-Next submodule pin verification ─────────────────────────
      - name: Verify / re-pin KernelSU-Next submodule commit
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          KSU_SUB="KernelSU-Next"
          WANT="${{ inputs.ksu_commit }}"

          [[ -d "$KSU_SUB/.git" || -f "$KSU_SUB/.git" ]] || {
            echo "FATAL: KernelSU-Next submodule not populated — checkout submodules:recursive failed?" >&2
            exit 1
          }

          ACTUAL="$(git -C "$KSU_SUB" rev-parse HEAD)"

          if [[ "$ACTUAL" != "$WANT" ]]; then
            echo "Submodule pinned to $ACTUAL, requested $WANT — re-checking out requested commit"

            git -C "$KSU_SUB" fetch --no-tags --depth=100 origin "$WANT"
            git -C "$KSU_SUB" checkout --detach "$WANT"

            ACTUAL="$(git -C "$KSU_SUB" rev-parse HEAD)"
          fi

          echo "$ACTUAL" > "$ABS_LOG/ksu-commit.txt"
          echo "KSU_GIT_VERSION=$(git -C "$KSU_SUB" rev-parse --short HEAD)" >> "$GITHUB_ENV"

          echo "KernelSU-Next commit: $ACTUAL"

      # ── 7. Verify canonical backports are present (replaces hand patches A–D) ──
      - name: Verify canonical KSU-Next backports (path_umount, seccomp, selinux, reboot)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          FAIL=0

          check() {
            local desc="$1"; local file="$2"; shift 2
            if grep -qE "$1" "$file" 2>/dev/null; then
              echo "OK:    $desc"
            else
              echo "FATAL: $desc — not found in $file"
              FAIL=1
            fi
          }

          # [C] path_umount / can_umount — full upstream semantics, not the
          # partial may_mount()-only version this workflow used to hand-roll.
          check "fs/namespace.c: can_umount() present"        fs/namespace.c '^static int can_umount\(' 
          check "fs/namespace.c: can_umount() checks check_mnt()" fs/namespace.c 'if \(!check_mnt\(mnt\)\)'
          check "fs/namespace.c: can_umount() checks MNT_LOCKED"  fs/namespace.c 'MNT_LOCKED'
          check "fs/namespace.c: can_umount() checks CAP_SYS_ADMIN on MNT_FORCE" fs/namespace.c 'MNT_FORCE.*capable\(CAP_SYS_ADMIN\)'
          check "fs/namespace.c: path_umount() present"        fs/namespace.c '^int path_umount\('
          check "fs/internal.h: path_umount() declared"        fs/internal.h 'int path_umount\(struct path \*path, int flags\);'

          # seccomp filter_count backport
          check "include/linux/seccomp.h: filter_count field" include/linux/seccomp.h 'atomic_t filter_count;'

          # selinux_inode/selinux_cred wrapper helpers
          check "objsec.h: selinux_inode() helper"  security/selinux/include/objsec.h 'selinux_inode\('
          check "objsec.h: selinux_cred() helper"   security/selinux/include/objsec.h 'selinux_cred\('
          check "selinuxfs.c: uses selinux_inode()" security/selinux/selinuxfs.c 'selinux_inode\(inode\)'
          check "xfrm.c: uses selinux_cred()"       security/selinux/xfrm.c 'selinux_cred\(current_cred\(\)\)'

          # [D] reboot hook
          check "kernel/reboot.c: ksu_handle_sys_reboot declared" kernel/reboot.c 'extern int ksu_handle_sys_reboot'
          check "kernel/reboot.c: ksu_handle_sys_reboot called"   kernel/reboot.c 'ksu_handle_sys_reboot\(magic1, magic2, cmd, &arg\)'

          # [B] AVC log-spoofing symbol — must be defined exactly once, in
          # avc.c, and only declared extern in fs/susfs.c. If a future base
          # regresses this (defines it nowhere, or defines it twice), fail
          # loudly instead of silently re-adding a duplicate definition.
          AVC_DEFS="$(grep -rn '^bool susfs_is_avc_log_spoofing_enabled = false;' security/selinux/avc.c fs/susfs.c 2>/dev/null | wc -l)"
          if [[ "$AVC_DEFS" -eq 1 ]] && grep -q '^bool susfs_is_avc_log_spoofing_enabled = false;' security/selinux/avc.c; then
            echo "OK:    susfs_is_avc_log_spoofing_enabled defined exactly once, in avc.c"
          else
            echo "FATAL: susfs_is_avc_log_spoofing_enabled definition count/location unexpected (found $AVC_DEFS definition(s) across avc.c/susfs.c)"
            FAIL=1
          fi

          if grep -q 'extern bool susfs_is_avc_log_spoofing_enabled;' fs/susfs.c; then
            echo "OK:    fs/susfs.c declares susfs_is_avc_log_spoofing_enabled extern (correct — do not define it here)"
          else
            echo "FATAL: fs/susfs.c missing expected extern declaration"
            FAIL=1
          fi

          [[ "$FAIL" -eq 0 ]] || {
            echo
            echo "One or more canonical backports expected from base_ref=${{ inputs.base_ref }} were not found."
            echo "This usually means base_ref points at a different commit/branch than the verified one."
            exit 1
          }

          echo
          echo "PASS: all canonical KSU-Next backports verified present from base — no hand patches required"

      # ── 8. Verify LSM-based setresuid path (replaces removed kernel/sys.c patch [A]) ──
      - name: Verify KSU-Next LSM task_fix_setuid hook (no kernel/sys.c patch used)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          KSU_SUB="KernelSU-Next"
          FAIL=0

          # Confirm the driver defines and registers the hook itself.
          grep -q 'ksu_task_fix_setuid' "$KSU_SUB/kernel/hook/lsm_hooks.c" || {
            echo "FATAL: ksu_task_fix_setuid not found in KernelSU-Next source" >&2
            FAIL=1
          }

          grep -q 'LSM_HOOK_INIT(task_fix_setuid, ksu_task_fix_setuid)' "$KSU_SUB/kernel/hook/lsm_hooks.c" || {
            echo "FATAL: task_fix_setuid LSM hook registration not found" >&2
            FAIL=1
          }

          grep -q 'ksu_handle_setresuid' "$KSU_SUB/kernel/hook/setuid_hook.c" || {
            echo "FATAL: ksu_handle_setresuid implementation not found" >&2
            FAIL=1
          }

          # Confirm we have NOT reintroduced the redundant kernel/sys.c patch.
          if grep -q 'ksu_handle_setresuid' kernel/sys.c 2>/dev/null; then
            echo "FATAL: kernel/sys.c calls ksu_handle_setresuid() directly." >&2
            echo "       This duplicates the LSM task_fix_setuid hook and will" >&2
            echo "       cause ksu_handle_setresuid() to run twice per credential" >&2
            echo "       transition (see fix-log item [A]). Remove this patch." >&2
            FAIL=1
          else
            echo "OK:    kernel/sys.c does not directly call ksu_handle_setresuid (correct)"
          fi

          [[ "$FAIL" -eq 0 ]] || exit 1

          echo "PASS: setresuid root-grant path goes through the LSM hook only"

      # ── 9. Pre-flight KSU-Next Kbuild self-patch guards (fixes race condition [F]) ──
      - name: Pre-verify all KernelSU-Next Kbuild self-patch guards resolve to no-op
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          # KernelSU-Next's kernel/Kbuild applies backports via $(shell sed -i ...)
          # at Makefile-parse time for the drivers/kernelsu sub-make. Under
          # recursive/parallel Kbuild there is no guaranteed ordering between
          # that sub-make and fs/'s or security/'s sub-makes, so relying on
          # those self-patches to land before dependent objects compile is
          # unsafe (this is exactly how the old path_umount undefined-reference
          # failure occurred). Since our base already carries every backport
          # KSU-Next's Kbuild would otherwise inject, we assert here that each
          # of its guard conditions is already satisfied — i.e. every self-patch
          # branch is a guaranteed no-op — so the race condition cannot fire.

          KB="KernelSU-Next/kernel/Kbuild"
          [[ -f "$KB" ]] || { echo "FATAL: $KB not found" >&2; exit 1; }

          FAIL=0

          assert_noop() {
            local desc="$1" pattern="$2" file="$3"
            if grep -Eq "$pattern" "$file"; then
              echo "OK:    guard already satisfied — $desc"
            else
              echo "FATAL: guard NOT satisfied — $desc (Kbuild self-patch would fire at build time)"
              FAIL=1
            fi
          }

          assert_noop "can_umount() defined"              '^static int can_umount' fs/namespace.c
          assert_noop "path_umount() defined (namespace.c)" '^int path_umount' fs/namespace.c
          assert_noop "path_umount() declared (internal.h)"  '^int path_umount' fs/internal.h
          assert_noop "seccomp filter_count field"          'atomic_t filter_count;' include/linux/seccomp.h
          assert_noop "selinux_inode() used in hooks.c"      'selinux_inode\(inode\)' security/selinux/hooks.c
          assert_noop "selinux_inode() used in selinuxfs.c"  'struct inode_security_struct \*\)inode->i_security|selinux_inode\(inode\)' security/selinux/selinuxfs.c
          assert_noop "selinux_cred() used in xfrm.c"        'selinux_cred\(current_cred\(\)\)' security/selinux/xfrm.c
          assert_noop "selinux_inode() declared in objsec.h" 'selinux_inode\(' security/selinux/include/objsec.h
          assert_noop "selinux_cred() declared in objsec.h"  'selinux_cred\(' security/selinux/include/objsec.h

          [[ "$FAIL" -eq 0 ]] || {
            echo
            echo "One or more Kbuild self-patch guards would still fire. Under a"
            echo "parallel/recursive build this is a race condition, not a fixed"
            echo "bug — it may build successfully in one run and fail with an"
            echo "'undefined reference' at final link in another. Fix the base"
            echo "or add the missing backport explicitly before building."
            exit 1
          }

          echo
          echo "PASS: every KSU-Next Kbuild self-patch branch is a guaranteed no-op"

      # ── 10. Fix hooks.c selinux_cred() consistency gap (item [G], non-fatal hardening) ──
      - name: Harden security/selinux/hooks.c — complete selinux_cred() conversion
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          # KSU-Next upstream has since fixed its own Kbuild guard for this
          # conversion (see fix-log item [G] for the full history — the
          # false-positive substring match on selinux_cred_alloc_blank/_free/
          # _prepare/_transfer is now avoided upstream, via
          # grep -Eq 'selinux_cred\(.*\)'). This step is kept as defense in
          # depth: it does not depend on KSU-Next's Kbuild guard at all, so
          # it cannot regress if upstream's guard ever does again.
          #
          # EXPECTED RESULT ON THE ACTUAL PINNED BASE: on the current
          # base_ref, this pattern set is expected to match zero sites (a
          # no-op) — the "4 read sites still left unconverted" claim from an
          # earlier draft of this workflow was not re-verified against the
          # exact SHA this file now pins and is not repeated here as fact.
          # A zero-match result is treated as success, not failure (see the
          # total==0 branch below), and is logged explicitly so a real "no
          # applicable sites" run is never confused with a silently-skipped
          # check. These substitutions only ever touch plain
          # cred->security/current_security() read sites in
          # security/selinux/hooks.c; they never match or modify Samsung
          # RKP/KDP credential-protection code (CONFIG_RKP_KDP/CONFIG_UH_RKP
          # are separately verified disabled in the "Guard pass" step).

          python3 << 'PYEOF'
          import re
          import sys
          from pathlib import Path

          MARKER = "CMK9_HOOKS_C_SELINUX_CRED_CONSISTENCY"

          p = Path("security/selinux/hooks.c")
          src = p.read_text()

          if MARKER in src:
              print("hooks.c: selinux_cred consistency pass already applied — skipping")
              sys.exit(0)

          # Precise, line-scoped substitutions. Each pattern requires the
          # exact assignment/return form seen upstream; it will not match
          # inside selinux_cred_alloc_blank/_free/_prepare/_transfer
          # (those assign to ->security, not read from it in this form).
          subs = [
              (r'\btsec = cred->security;', 'tsec = selinux_cred(cred);'),
              (r'const struct task_security_struct \*tsec = cred->security;',
               'const struct task_security_struct *tsec = selinux_cred(cred);'),
              (r'const struct task_security_struct \*tsec = current_security\(\);',
               'const struct task_security_struct *tsec = selinux_cred(current_cred());'),
              (r'rc = selinux_determine_inode_label\(current_security\(\)',
               'rc = selinux_determine_inode_label(selinux_cred(current_cred())'),
              (r'\bold_tsec = current_security\(\);', 'old_tsec = selinux_cred(current_cred());'),
              (r'\bnew_tsec = bprm->cred->security;', 'new_tsec = selinux_cred(bprm->cred);'),
              (r'rc = selinux_determine_inode_label\(old->security',
               'rc = selinux_determine_inode_label(selinux_cred(old)'),
              (r'\btsec = new->security;', 'tsec = selinux_cred(new);'),
              (r'\btsec = new_creds->security;', 'tsec = selinux_cred(new_creds);'),
              (r'\bold_tsec = old->security;', 'old_tsec = selinux_cred(old);'),
              (r'const struct task_security_struct \*old_tsec = old->security;',
               'const struct task_security_struct *old_tsec = selinux_cred(old);'),
              (r'struct task_security_struct \*tsec = new->security;',
               'struct task_security_struct *tsec = selinux_cred(new);'),
              (r'__tsec = current_security\(\);', '__tsec = selinux_cred(current_cred());'),
              (r'__tsec = __task_cred\(p\)->security;', '__tsec = selinux_cred(__task_cred(p));'),
          ]

          total = 0
          for pattern, repl in subs:
              new_src, n = re.subn(pattern, repl, src)
              if n:
                  print(f"  converted {n} site(s): {pattern}")
                  src = new_src
                  total += n

          if total == 0:
              print("hooks.c: no applicable sites; no repository modification performed.")
          else:
              src = f"/* {MARKER} */\n" + src
              p.write_text(src)
              print(f"hooks.c: converted {total} call site(s) to selinux_cred()")
          PYEOF

          # Sanity: the legitimate hook function definitions must be untouched.
          for fn in selinux_cred_alloc_blank selinux_cred_free selinux_cred_prepare selinux_cred_transfer; do
            grep -q "$fn" security/selinux/hooks.c || {
              echo "FATAL: $fn disappeared from hooks.c — consistency pass corrupted the file" >&2
              exit 1
            }
          done

          # Verify no raw call sites remain matching the two
          # selinux_determine_inode_label(...) forms on THIS tree, at
          # runtime — regardless of whether the count above was 0 (no
          # applicable sites) or nonzero (sites found and converted).
          REMAINING=$(grep -cE 'rc = selinux_determine_inode_label\((current_security\(\)|old->security)' security/selinux/hooks.c || true)
          if [[ "$REMAINING" -gt 0 ]]; then
            echo "FATAL: $REMAINING selinux_determine_inode_label(...) call site(s) still unconverted after patch" >&2
            exit 1
          fi

          echo "PASS: hooks.c selinux_cred consistency verified, hook functions intact, 0 selinux_determine_inode_label sites remain unconverted"

      # ── 11. Chimera overlay (verified device-specific patches — see script header) ──
      - name: Apply Chimera overlay
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          LOG="$ABS_LOG/overlay.log"

          echo "Chimera overlay started at $(date -u)" > "$LOG"

          sed -i \
            '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' \
            "$DEFCONFIG"

          printf \
            'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' \
            "$BRAND" \
            "$BUILD_HOST" \
            >> "$DEFCONFIG"

          printf \
            '#!/bin/sh\nprintf "%%s" "%s"\n' \
            "$BRAND" \
            > scripts/setlocalversion

          chmod +x scripts/setlocalversion

          echo "$BRAND" > localversion

          # fair.c scheduler tuning, mem_rw() SUS_MAP guard, namei.c
          # sus_path sub-path re-check, exynos-ufc.c UFC short-circuit, and
          # board DTS tuning all live in this script — not inline here —
          # so there is exactly one place that owns each anchor and one
          # place that fails loudly if an anchor drifts. This is mandatory,
          # not conditional: the earlier "Verify required repo-local files"
          # step already guarantees the script exists.
          bash "$GITHUB_WORKSPACE/patches/apply_chimera_overlay_patches.sh" \
            2>&1 | tee -a "$LOG"

          echo \
            "Overlay applied (profile=$PROFILE, brand=$BRAND)" \
            | tee -a "$LOG"

      # ── 11b. Verify Chimera overlay landed completely ────────────────────────
      - name: Verify Chimera overlay markers
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          FAIL=0

          check() {
            local desc="$1" marker="$2" file="$3"
            if grep -q "$marker" "$file" 2>/dev/null; then
              echo "OK:    $desc"
            else
              echo "FATAL: $desc — marker '$marker' not found in $file"
              FAIL=1
            fi
          }

          check "UFC short-circuit"            "CMK9_UFC_SHORT_CIRCUIT"        "drivers/cpufreq/exynos-ufc.c"
          check "mem_rw() SUS_MAP guard"       "CMK9_MEM_RW_SUS_MAP_GUARD"     "fs/proc/base.c"
          check "namei sus_path sub-path recheck" "CMK9_NAMEI_SUS_PATH_RECHECK" "fs/namei.c"
          check "board DTS tuning"             "CMK9_DTS_BOARD_TUNING"         "arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts"
          check "sugov rate limit tuning"       "CMK9_SUGOV_RATE_LIMIT"        "kernel/sched/cpufreq_schedutil.c"
          check "sugov kthread priority (SCHED_RR)" "CMK9_SUGOV_KTHREAD_PRIORITY" "kernel/sched/cpufreq_schedutil.c"
          check "sugov_init() rate limit"       "CMK9_SUGOV_INIT_RATE_LIMIT"   "kernel/sched/cpufreq_schedutil.c"

          grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c \
            && echo "OK:    fair.c min_granularity tuned" \
            || { echo "FATAL: fair.c min_granularity not tuned"; FAIL=1; }

          grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c \
            && echo "OK:    fair.c migration_cost tuned" \
            || { echo "FATAL: fair.c migration_cost not tuned"; FAIL=1; }

          [[ "$FAIL" -eq 0 ]] || {
            echo
            echo "One or more Chimera overlay patches did not land. This is a"
            echo "hard failure — the whole point of this workflow revision is"
            echo "that the Chimera overlay is present in every build, not"
            echo "silently dropped when a repo file goes missing or an anchor"
            echo "drifts."
            exit 1
          }

          echo
          echo "PASS: all Chimera overlay markers present"

      # ── 12. Kconfig fragment normalization ───────────────────────────────────
      - name: Validate Kconfig fragment
        run: |
          set -Eeuo pipefail

          CFG="$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg"

          grep -q '^CONFIG_KSU=y$' "$CFG"
          grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG"
          grep -q '^CONFIG_KSU_SUSFS=y$' "$CFG"

          # CONFIG_KSU_NON_KPROBE is not a real symbol (verified against
          # KernelSU-Next kernel/Kconfig — see fix-log [E]); fail if it
          # ever creeps back into the fragment.
          if grep -q '^CONFIG_KSU_NON_KPROBE' "$CFG"; then
            echo "FATAL: CONFIG_KSU_NON_KPROBE is not a valid KernelSU-Next symbol" >&2
            echo "       Use CONFIG_KSU_MANUAL_HOOK=y instead." >&2
            exit 1
          fi

          cat "$CFG"

      # ── 13. Merge Kconfig ────────────────────────────────────────────────────
      - name: Merge Kconfig fragment
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          cp \
            "$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg" \
            /tmp/chimera-ksu-susfs.cfg

          cp \
            "$GITHUB_WORKSPACE/chimera-device-specific.cfg" \
            /tmp/chimera-device-specific.cfg

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            "$(basename "$DEFCONFIG")" \
            | tee "$ABS_LOG/defconfig-base.log"

          scripts/kconfig/merge_config.sh \
            -m \
            -O "$ABS_OUT" \
            "$ABS_OUT/.config" \
            /tmp/chimera-ksu-susfs.cfg \
            /tmp/chimera-device-specific.cfg \
            | tee "$ABS_LOG/merge-config.log"

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            olddefconfig \
            | tee -a "$ABS_LOG/merge-config.log"

      # ── 14. Force KernelSU hook mode after Kconfig resolution ─────────────
      - name: Normalize KernelSU hook mode
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          CFG="$ABS_OUT/.config"

          echo "Forcing KernelSU manual hook mode"

          if [[ -x scripts/config ]]; then

            scripts/config \
              --file "$CFG" \
              -e CONFIG_KSU \
              -e CONFIG_KSU_MANUAL_HOOK \
              -d CONFIG_KSU_KPROBES_HOOK

          else

            echo "scripts/config unavailable, patching .config directly"

            sed -i \
              '/^CONFIG_KSU_KPROBES_HOOK=/d' \
              "$CFG"

            sed -i \
              '/^# CONFIG_KSU_KPROBES_HOOK is not set$/d' \
              "$CFG"

            echo "CONFIG_KSU_KPROBES_HOOK=n" >> "$CFG"

            grep -q '^CONFIG_KSU=y$' "$CFG" || \
              echo "CONFIG_KSU=y" >> "$CFG"

            grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG" || \
              echo "CONFIG_KSU_MANUAL_HOOK=y" >> "$CFG"

          fi

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            olddefconfig \
            | tee -a "$ABS_LOG/merge-config.log"


          echo
          echo "========== Final KernelSU mode =========="

          grep '^CONFIG_KSU' "$CFG" || true


          if grep -q '^CONFIG_KSU_KPROBES_HOOK=y$' "$CFG"; then
            echo "FATAL: CONFIG_KSU_KPROBES_HOOK still enabled"
            exit 1
          fi


          if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' "$CFG"; then
            echo "FATAL: CONFIG_KSU_MANUAL_HOOK missing"
            exit 1
          fi


          echo "PASS: KernelSU manual hook mode enforced"


          cp "$CFG" "$ABS_LOG/final.config"

      # ── 14b. Security/config guard — forbidden Samsung restrictions, required KSU/SUSFS ──
      - name: Guard pass — verify security restrictions disabled and KSU/SUSFS enabled
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          CFG="$ABS_OUT/.config"

          FORBIDDEN=(
            CONFIG_RKP_KDP
            CONFIG_UH_RKP
            CONFIG_TIMA
            CONFIG_TIMA_LKMAUTH
            CONFIG_FIVE
            CONFIG_SEC_RESTRICT_ROOTING
            CONFIG_SEC_RESTRICT_SETUID
            CONFIG_SECURITY_DEFEX
            CONFIG_KNOX_KAP
          )

          FAIL=0

          : > "$ABS_LOG/config-guard.log"

          for sym in "${FORBIDDEN[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "FATAL: $sym=y" | tee -a "$ABS_LOG/config-guard.log"
              FAIL=1
            else
              echo "OK: $sym disabled" | tee -a "$ABS_LOG/config-guard.log"
            fi
          done

          REQUIRED=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_HZ_300
            CONFIG_MFD_MADERA
            CONFIG_MFD_CS47L92
            CONFIG_TCP_CONG_ADVANCED
            CONFIG_TCP_CONG_BBR
            CONFIG_TCP_CONG_CUBIC
            CONFIG_DEFAULT_BBR
            CONFIG_NET_SCHED
            CONFIG_NET_SCH_FQ
            CONFIG_NET_SCH_FQ_CODEL
          )

          for sym in "${REQUIRED[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "OK: $sym=y" | tee -a "$ABS_LOG/config-guard.log"
            else
              echo "FATAL: $sym is not enabled" | tee -a "$ABS_LOG/config-guard.log"
              FAIL=1
            fi
          done

          [[ "$FAIL" -eq 0 ]] || exit 1

      # ── 15. Toolchain resolution ─────────────────────────────────────────────
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail

          TOOLCHAIN="${{ inputs.toolchain }}"

          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_LLVM_IAS="1"
          TC_USE_FULL_LLVM="true"

          case "$TOOLCHAIN" in

            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f60b8b55282f002f594f452ce22dfd6cf1fd7e3c/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;

            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;

            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;

            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;

            llvm20)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="korg-clang-20.1.8-ubuntu-24.04-v1"
              ;;

            llvm21)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-21.1.0-ubuntu-24.04-v1"
              ;;

            llvm22)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-22.1.7-ubuntu-24.04-v1"
              ;;

            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;

            neutron23)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30062026-ubuntu-24.04-v2"
              ;;

            zyc_stable)
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-v2"

              TC_URL=$(curl -fsSL \
                "https://raw.githubusercontent.com/ZyCromerZ/Clang/refs/heads/22.0.0git-20250928/Clang-main-link.txt" \
                || true)
              ;;

            *)
              echo \
                "ERROR: unsupported toolchain '$TOOLCHAIN'" \
                >&2
              exit 1
              ;;

          esac

          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_LLVM_IAS=$TC_LLVM_IAS"
            echo "TC_USE_FULL_LLVM=$TC_USE_FULL_LLVM"
          } >> "$GITHUB_ENV"

          echo \
            "TC_CACHE_KEY=$TC_CACHE_KEY" \
            >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          ARCHIVE="/tmp/clang_archive"

          if [[ -z "$TC_URL" ]]; then
            echo "FATAL: TC_URL is empty (zyc_stable's dynamic link lookup may have failed upstream)" >&2
            exit 1
          fi

          aria2c -x 16 -s 16 -k 1M -c \
            --max-tries=5 \
            --retry-wait=5 \
            --timeout=60 \
            --dir="/tmp" \
            --out="clang_archive" \
            "$TC_URL"

          if [[ ! -s "$ARCHIVE" ]]; then
            echo "FATAL: aria2c failed to download the toolchain archive, or it is empty." >&2
            exit 1
          fi

          rm -rf "$ABS_TC"
          mkdir -p "$ABS_TC"

          case "$TC_ARCHIVE_FMT" in
            tar.gz|tar)
              tar -C "$ABS_TC" -xzf "$ARCHIVE"
              ;;
            tar.xz)
              tar -C "$ABS_TC" -xJf "$ARCHIVE"
              ;;
            tar.zst)
              zstd -d "$ARCHIVE" -o /tmp/clang.tar --force
              tar -C "$ABS_TC" -xf /tmp/clang.tar
              ;;
            *)
              echo "FATAL: unrecognized TC_ARCHIVE_FMT '$TC_ARCHIVE_FMT' — cannot extract" >&2
              exit 1
              ;;
          esac

          if [[ -z "$(find "$ABS_TC" -type f -print -quit)" ]]; then
            echo "FATAL: extraction reported success but $ABS_TC contains no files" >&2
            exit 1
          fi

          echo "Toolchain archive extracted: $(find "$ABS_TC" -type f | wc -l) file(s)"

      - name: Configure toolchain PATH
        run: |
          set -Eeuo pipefail

          ACTUAL_BIN=$(find "$ABS_TC" -type d -name "bin" -printf "%d\t%p\n" | sort -n | cut -f2 | head -n 1)

          if [[ -z "$ACTUAL_BIN" || ! -d "$ACTUAL_BIN" ]]; then
            echo "FATAL: Could not find 'bin' directory inside extracted toolchain ($ABS_TC)."
            exit 1
          fi

          echo "Found toolchain bin: $ACTUAL_BIN"
          chmod +x "$ACTUAL_BIN"/* 2>/dev/null || true

          # Expose it globally to all subsequent workflow steps
          echo "$ACTUAL_BIN" >> "$GITHUB_PATH"

      # ── 15b. Validate compiler binaries/versions, capture real identity ──────
      - name: Verify Toolchain and capture compiler identity
        run: |
          set -Eeuo pipefail

          echo "Validating toolchain in PATH..."

          for bin in clang llvm-nm llvm-objdump llvm-ar llvm-objcopy llvm-strip ld.lld; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "FATAL: required toolchain binary '$bin' not found in PATH" >&2
              exit 1
            }
          done

          CLANG_VERSION="$(clang --version | head -1)"
          LLD_VERSION="$(ld.lld --version | head -1)"

          echo "$CLANG_VERSION"
          llvm-nm --version | head -1
          llvm-objdump --version | head -1
          echo "$LLD_VERSION"

          [[ -n "$CLANG_VERSION" ]] || { echo "FATAL: clang --version produced no output" >&2; exit 1; }

          # Real compiler identity, derived from the actual binary rather
          # than the requested TC_CACHE_KEY label — if a download silently
          # served the wrong archive, this differs from TC_CACHE_KEY and is
          # recorded in the manifest for that to be caught after the fact.
          TC_IDENTITY_HASH="$(printf '%s\n%s\n' "$CLANG_VERSION" "$LLD_VERSION" | sha256sum | cut -d' ' -f1 | head -c 16)"

          {
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "TC_IDENTITY_HASH=$TC_IDENTITY_HASH"
          } >> "$GITHUB_ENV"

          {
            echo "$CLANG_VERSION"
            echo "$LLD_VERSION"
          } > "$ABS_LOG/toolchain-identity.txt"

          test -n "$PATH"

      # ── 16. ccache ───────────────────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: >-
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-${{ github.sha }}

          restore-keys: |
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-

          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ── 17. Finalize config ───────────────────────────────────────────────────
      - name: Finalise kernel .config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          cp \
            "$ABS_OUT/.config" \
            "$ABS_LOG/config.built"

          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SEC_RESTRICT|CONFIG_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_LOCALVERSION)' \
            "$ABS_OUT/.config" \
            | tee "$ABS_LOG/config-summary.txt"

          FINAL_CONFIG_HASH="$(sha256sum "$ABS_OUT/.config" | cut -d' ' -f1)"
          echo "FINAL_CONFIG_HASH=$FINAL_CONFIG_HASH" >> "$GITHUB_ENV"
          echo "Final .config SHA-256: $FINAL_CONFIG_HASH"

      # ── 17b. EMS/sugov safety guard — reject unsafe overlay result ───────────
      # CMK9_SUGOV_RATE_LIMIT / CMK9_SUGOV_INIT_RATE_LIMIT /
      # CMK9_SUGOV_KTHREAD_PRIORITY hardcode
      # sugov_update_rate_limit_us()/sugov_init()'s rate limits and the
      # sugov kthread's scheduling class/priority unconditionally.
      # sugov_update_rate_limit_us() is also called by Samsung EMS, and
      # this defconfig enables CONFIG_FREQVAR_TUNE=y (per-frequency EMS
      # tuning). Hardcoding the rate limit disables that per-frequency
      # tuning path. No verified-safe bypass for this conflict exists, so
      # this workflow fails the build here rather than silently shipping
      # a kernel with EMS per-frequency tuning disabled. This is a
      # detection/rejection step only — it does not touch the overlay
      # script or kernel source; the fix, if one is wanted, belongs in
      # patches/apply_chimera_overlay_patches.sh (out of scope for this
      # workflow-only refactor).
      # - name: EMS/sugov safety guard — reject unsafe overlay result
      #  working-directory: ${{ env.KERNEL_DIR }}
      #  run: |
      #    set -Eeuo pipefail

      #    CFG="$ABS_OUT/.config"
      #    SUGOV_FILE="kernel/sched/cpufreq_schedutil.c"

      #    FREQVAR_ON=0
      #    if grep -qE '^CONFIG_FREQVAR_TUNE=y' "$CFG"; then
      #      FREQVAR_ON=1
      #    fi

      #    echo "CONFIG_FREQVAR_TUNE=y present in final config: $([[ $FREQVAR_ON -eq 1 ]] && echo yes || echo no)"

      #    UNSAFE=0
      #    UNSAFE_MARKERS=()

      #    for MARKER in CMK9_SUGOV_RATE_LIMIT CMK9_SUGOV_INIT_RATE_LIMIT CMK9_SUGOV_KTHREAD_PRIORITY; do
      #      if grep -q "$MARKER" "$SUGOV_FILE" 2>/dev/null; then
      #        UNSAFE_MARKERS+=("$MARKER")
      #      fi
      #    done

      #    if [[ "$FREQVAR_ON" -eq 1 && "${#UNSAFE_MARKERS[@]}" -gt 0 ]]; then
      #      UNSAFE=1
      #    fi

      #    if [[ "$UNSAFE" -eq 1 ]]; then
      #      echo "FATAL: unsafe sugov/EMS combination detected." >&2
      #      echo "       CONFIG_FREQVAR_TUNE=y is enabled (Samsung EMS per-frequency" >&2
      #      echo "       tuning calls sugov_update_rate_limit_us()) AND the following" >&2
      #      echo "       overlay marker(s) hardcode sugov rate limits/priority" >&2
      #      echo "       unconditionally, which disables that per-frequency tuning:" >&2
      #      for m in "${UNSAFE_MARKERS[@]}"; do echo "         - $m" >&2; done
      #      echo "       No verified-safe bypass exists for this conflict. Failing" >&2
      #      echo "       before build rather than shipping a kernel with EMS" >&2
      #      echo "       per-frequency tuning silently disabled." >&2
      #      exit 1
      #    fi

      #    echo "PASS: no unsafe sugov/EMS combination detected"

      # ── 18. Build Image and DTBs ──────────────────────────────────────────────
      - name: Build kernel Image and device DTBs
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: ${{ env.BUILD_USER }}
          KBUILD_BUILD_HOST: ${{ env.BUILD_HOST }}
          KBUILD_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          CC: clang
          LD: ld.lld
          AR: llvm-ar
          NM: llvm-nm
          OBJCOPY: llvm-objcopy
          OBJDUMP: llvm-objdump
          STRIP: llvm-strip
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -Eeuo pipefail
          
          JOBS="$(nproc)"
          MAKE_ARGS=(
            "O=$ABS_OUT"
            "ARCH=arm64"
            "CC=clang"
            "LLVM=1"
            "LLVM_IAS=1"
            "LD=ld.lld"
            "AR=llvm-ar"
            "NM=llvm-nm"
            "OBJCOPY=llvm-objcopy"
            "OBJDUMP=llvm-objdump"
            "STRIP=llvm-strip"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "CROSS_COMPILE=aarch64-linux-gnu-"
            "CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
            "-j${JOBS}"
            "LOCALVERSION=${BRAND}"
            "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error -Wno-error=frame-larger-than -Wno-error=unused-but-set-global -fuse-ld=lld"
          )
          
          make \
            "${MAKE_ARGS[@]}" \
            Image \
            vmlinux \
            dtbs \
            2>&1 \
            | tee "$ABS_LOG/build.log"

      # ── 19. vmlinux KSU/SUSFS symbol guard ────────────────────────────────────
      - name: Guard pass — verify KSU/SUSFS symbols
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          VMLINUX="$ABS_OUT/vmlinux"

          [[ -f "$VMLINUX" ]] || {
            echo "FATAL: vmlinux not found" >&2
            exit 1
          }

          if [[ -x "$ABS_TC/bin/llvm-nm" ]]; then
            NM="$ABS_TC/bin/llvm-nm"
          elif command -v llvm-nm >/dev/null 2>&1; then
            NM=llvm-nm
          else
            NM=nm
          fi

          "$NM" \
            "$VMLINUX" \
            > "$ABS_LOG/vmlinux-symbols.log" \
            2>&1 \
            || true

          # ksu_handle_setresuid is expected here because it is called from
          # the LSM task_fix_setuid hook (ksu_task_fix_setuid), not because
          # of a kernel/sys.c patch — see fix-log item [A]. ksu_lsm_hook_init
          # and ksu_task_fix_setuid are included to positively confirm the
          # LSM-hook-based path (rather than a syscall patch) is what's
          # actually compiled in.
          REQUIRED=(
            ksu_handle_execveat
            ksu_handle_faccessat
            ksu_handle_setresuid
            ksu_handle_sys_reboot
            ksu_lsm_hook_init
            ksu_task_fix_setuid
            susfs_is_inode_sus_path
          )

          FAIL=0

          for sym in "${REQUIRED[@]}"; do

            if grep -q \
              -E \
              "^[0-9a-fA-F]+ [A-Za-z] ${sym}$" \
              "$ABS_LOG/vmlinux-symbols.log"; then

              echo "OK: $sym"

            else

              echo "FATAL: missing symbol: $sym"

              FAIL=1

            fi

          done

          [[ "$FAIL" -eq 0 ]] || exit 1

      # ── 20. Assemble legacy Samsung dtb.img ──────────────────────────────────
      - name: Assemble dtb.img from star2lte device DTBs
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          ART_DIR="$GITHUB_WORKSPACE/artifacts"

          mkdir -p "$ART_DIR"

          DTB_SEARCH_DIR="$ABS_OUT/arch/arm64/boot/dts/exynos"

          mapfile -t DTB_FILES < <(
            find \
              "$DTB_SEARCH_DIR" \
              -maxdepth 1 \
              -iname "*star2lte*.dtb" \
              2>/dev/null \
              | sort
          )

          if [[ ${#DTB_FILES[@]} -eq 0 ]]; then

            echo \
              "WARN: no star2lte-specific .dtb found; falling back to all .dtb files" \
              | tee -a "$ABS_LOG/dtb-assemble.log"

            mapfile -t DTB_FILES < <(
              find \
                "$ABS_OUT/arch/arm64/boot/dts" \
                -iname "*.dtb" \
                2>/dev/null \
                | sort
            )

          fi

          if [[ ${#DTB_FILES[@]} -eq 0 ]]; then

            echo \
              "FATAL: no .dtb files produced under $ABS_OUT/arch/arm64/boot/dts" \
              >&2

            find \
              "$ABS_OUT/arch/arm64/boot/dts" \
              -type f \
              2>/dev/null \
              >&2 \
              || true

            exit 1

          fi

          echo \
            "DTB file(s) found:" \
            | tee -a "$ABS_LOG/dtb-assemble.log"

          printf \
            '  %s\n' \
            "${DTB_FILES[@]}" \
            | tee -a "$ABS_LOG/dtb-assemble.log"

          # Legacy Samsung dtb.img: raw concatenation, no mkdtimg header.
          cat \
            "${DTB_FILES[@]}" \
            > "$ART_DIR/dtb.img"

          if [[ ! -s "$ART_DIR/dtb.img" ]]; then

            echo \
              "FATAL: dtb.img was not created or is empty" \
              >&2

            exit 1

          fi

          echo \
            "dtb.img size: $(stat -c%s "$ART_DIR/dtb.img") bytes" \
            | tee -a "$ABS_LOG/dtb-assemble.log"

          cp \
            "${DTB_FILES[@]}" \
            "$ART_DIR/" \
            2>/dev/null \
            || true

          echo \
            "ART_DIR=$ART_DIR" \
            >> "$GITHUB_ENV"

      # ── 21. Package Image ─────────────────────────────────────────────────────
      - name: Package Image
        if: ${{ inputs.dry_run != true }}
        id: package-image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail

          ART_DIR="$GITHUB_WORKSPACE/artifacts"

          mkdir -p "$ART_DIR"

          IMG="$ABS_OUT/arch/arm64/boot/Image"

          [[ -f "$IMG" ]] || {
            echo "FATAL: Image not found at $IMG" >&2
            exit 1
          }

          cp \
            "$IMG" \
            "$ART_DIR/Image"

          BUILD_TAG="chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"

          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"
          echo "ART_DIR=$ART_DIR" >> "$GITHUB_ENV"

          echo \
            "image_path=$ART_DIR/Image" \
            >> "$GITHUB_OUTPUT"

          echo \
            "dtb_path=$ART_DIR/dtb.img" \
            >> "$GITHUB_OUTPUT"

      # ── 21b. Generate SHA-256 manifest ────────────────────────────────────────
      - name: Generate build manifest and SHA-256SUMS
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail

          ART_DIR="$GITHUB_WORKSPACE/artifacts"

          ( cd "$ART_DIR" && sha256sum Image dtb.img > SHA256SUMS )

          [[ -s "$ART_DIR/SHA256SUMS" ]] || {
            echo "FATAL: SHA256SUMS was not generated or is empty" >&2
            exit 1
          }

          IMAGE_SHA256="$(cd "$ART_DIR" && sha256sum Image | cut -d' ' -f1)"
          DTB_SHA256="$(cd "$ART_DIR" && sha256sum dtb.img | cut -d' ' -f1)"

          cat > "$ART_DIR/manifest.json" << JSONEOF
          {
            "build_tag": "${BUILD_TAG}",
            "run_id": "${{ github.run_id }}",
            "profile": "${{ inputs.profile }}",
            "toolchain": "${{ inputs.toolchain }}",
            "source": {
              "chimera_repo": "${{ env.CHIMERA_REPO }}",
              "chimera_ref": "${{ env.CHIMERA_REF }}",
              "chimera_sha": "${{ env.CHIMERA_SHA }}",
              "base_repo": "${{ inputs.base_repo }}",
              "base_ref_requested": "${{ inputs.base_ref }}",
              "base_commit_actual": "${BASE_COMMIT}",
              "ksu_commit_requested": "${{ inputs.ksu_commit }}",
              "ksu_commit_actual": "${KSU_GIT_VERSION}"
            },
            "toolchain_identity": {
              "requested": "${{ inputs.toolchain }}",
              "cache_key": "${TC_CACHE_KEY}",
              "clang_version": "${CLANG_VERSION}",
              "identity_hash": "${TC_IDENTITY_HASH}"
            },
            "config": {
              "final_config_sha256": "${FINAL_CONFIG_HASH}"
            },
            "artifacts": {
              "Image": "sha256:${IMAGE_SHA256}",
              "dtb.img": "sha256:${DTB_SHA256}"
            }
          }
          JSONEOF

          echo "Manifest:"
          cat "$ART_DIR/manifest.json"
          echo
          echo "SHA256SUMS:"
          cat "$ART_DIR/SHA256SUMS"

      # ── 21c. Package AnyKernel3 flashable ZIP ─────────────────────────────────
      - name: Package AnyKernel3 flashable ZIP
        if: ${{ inputs.dry_run != true }}
        id: package-anykernel
        run: |
          set -Eeuo pipefail
      
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          AK3_DIR="${AK3_DIR:?AK3_DIR not set}"
      
          [[ -d "$AK3_DIR" ]] || {
            echo "FATAL: AnyKernel3 directory not found at $AK3_DIR" >&2
            exit 1
          }
      
          [[ -f "$GITHUB_WORKSPACE/anykernel.sh" ]] || {
            echo "FATAL: anykernel.sh not found at repo root" >&2
            exit 1
          }
      
          cp "$GITHUB_WORKSPACE/anykernel.sh" "$AK3_DIR/anykernel.sh"
      
          ZIP_NAME="${BUILD_TAG}-AnyKernel3.zip"
          ZIP_PATH="$ART_DIR/$ZIP_NAME"
      
          rm -f "$AK3_DIR/Image" "$AK3_DIR/dtb" "$AK3_DIR/Image.gz-dtb" "$ZIP_PATH"
      
          COMBINED="$ABS_OUT/arch/arm64/boot/Image.gz-dtb"
          SPLIT_IMAGE="$ART_DIR/Image"
          SPLIT_DTB="$ART_DIR/dtb"
      
          if [[ -f "$COMBINED" ]]; then
            echo "Found combined kernel payload: $COMBINED"
            cp "$COMBINED" "$AK3_DIR/Image.gz-dtb"
            echo "ak3_kernel_payload=Image.gz-dtb" >> "$GITHUB_OUTPUT"
          elif [[ -f "$SPLIT_IMAGE" ]]; then
            echo "Found split kernel payload: $SPLIT_IMAGE"
            cp "$SPLIT_IMAGE" "$AK3_DIR/Image"
      
            if [[ -f "$SPLIT_DTB" ]]; then
              cp "$SPLIT_DTB" "$AK3_DIR/dtb"
              echo "ak3_kernel_payload=Image + dtb" >> "$GITHUB_OUTPUT"
            else
              echo "WARN: $SPLIT_DTB not present — packaging Image only" | tee -a "$ABS_LOG/anykernel-package.log"
              echo "ak3_kernel_payload=Image only" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "FATAL: No valid kernel payload found" >&2
            echo "Expected either:" >&2
            echo "  - $COMBINED" >&2
            echo "  - $SPLIT_IMAGE" >&2
            exit 1
          fi
      
          ( cd "$AK3_DIR" && zip -r9 "$ZIP_PATH" . -x ".git/*" ".github/*" )
      
          [[ -s "$ZIP_PATH" ]] || {
            echo "FATAL: $ZIP_PATH was not created or is empty" >&2
            exit 1
          }
      
          echo "AnyKernel3 zip: $ZIP_PATH ($(stat -c%s "$ZIP_PATH") bytes)"
          echo "anykernel_zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
    
      # ── 22. Upload Image artifact ─────────────────────────────────────────────
      - name: Upload Image artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-Image-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: ${{ steps.package-image.outputs.image_path }}
          if-no-files-found: error

      # ── 23. Upload DTB artifact ───────────────────────────────────────────────
      - name: Upload dtb artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-dtb-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: |
            ${{ env.ART_DIR }}/dtb.img
            ${{ env.ART_DIR }}/*.dtb
          if-no-files-found: error

      # ── 23b. Upload manifest artifact ─────────────────────────────────────────
      - name: Upload manifest artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-manifest-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: |
            ${{ env.ART_DIR }}/manifest.json
            ${{ env.ART_DIR }}/SHA256SUMS
          if-no-files-found: error

      # ── 23c. Upload AnyKernel3 flashable ZIP artifact ─────────────────────────
      - name: Upload AnyKernel3 flashable ZIP
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-AnyKernel3-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: ${{ steps.package-anykernel.outputs.anykernel_zip_path }}
          if-no-files-found: error

      # ── 24. Release ───────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.do_release == true && inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "Chimera Mk9 — ${{ inputs.profile }} / ${{ inputs.toolchain }}"
          body: |
            ## Chimera Mk9 — gavdoc38 Canonical Base Build

            | Field | Value |
            |---|---|
            | Base repo | `${{ inputs.base_repo }}` |
            | Base commit | `${{ env.BASE_COMMIT }}` |
            | KernelSU-Next | `${{ env.KSU_GIT_VERSION }}` |
            | Chimera ref/commit | `${{ env.CHIMERA_REF }}` / `${{ env.CHIMERA_SHA }}` |
            | Profile | `${{ inputs.profile }}` |
            | Toolchain | `${{ inputs.toolchain }}` |
            | Compiler | `${{ env.CLANG_VERSION }}` |
            | Final config SHA-256 | `${{ env.FINAL_CONFIG_HASH }}` |
            | uname | `${{ env.UNAME_PREVIEW }}` |

            KSU manual-hook symbols verified in vmlinux:
            - ksu_handle_execveat
            - ksu_handle_faccessat
            - ksu_handle_setresuid (invoked via LSM task_fix_setuid hook — no kernel/sys.c patch)
            - ksu_handle_sys_reboot
            - ksu_lsm_hook_init
            - ksu_task_fix_setuid

            Image and dtb.img are packaged and attached separately. See
            SHA256SUMS / manifest.json for exact artifact hashes and full
            build provenance.

          files: |
            ${{ steps.package-image.outputs.image_path }}
            ${{ steps.package-image.outputs.dtb_path }}
            ${{ steps.package-anykernel.outputs.anykernel_zip_path }}
            ${{ env.ART_DIR }}/manifest.json
            ${{ env.ART_DIR }}/SHA256SUMS

          draft: false
          prerelease: false

      # ── 25. Upload logs ───────────────────────────────────────────────────────
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-logs-${{ github.run_id }}
          path: ${{ env.ABS_LOG }}/**
          if-no-files-found: warn
