name: Project Chimera Mk9 — ExyHyperBrick Merge Build

# ─────────────────────────────────────────────────────────────────────────────
# ROOT-CAUSE FIX LOG (most recent first)
#
# 4) susfs_is_avc_log_spoofing_enabled — undefined symbol at final link
#    ------------------------------------------------------------------
#    VERIFIED against the live chimera-mk8 fs/susfs.c source:
#
#        /* susfs avc log spoofing */
#        extern bool susfs_is_avc_log_spoofing_enabled;
#
#        void susfs_set_avc_log_spoofing(void __user **user_info) {
#            ...
#            WRITE_ONCE(susfs_is_avc_log_spoofing_enabled, info.enabled);
#            ...
#        }
#
#    This is a VARIABLE declared extern, never defined anywhere in
#    fs/susfs.c. In the reference Chimera Mk8 kernel the definition lives
#    in a SELinux/AVC hook patch (security/selinux/avc.c or similar) that
#    this pipeline deliberately does NOT apply (SELinux internals are
#    explicitly out of scope / high risk per the integration rules).
#    Result: no definition exists anywhere in this tree -> undefined
#    symbol at the final vmlinux link.
#
#    A prior patch attempt searched for and rewrote
#    "susfs_is_avc_log_spoofing_enabled()" (function-call syntax) into a
#    bare identifier. The source never used call syntax to begin with
#    (WRITE_ONCE() already takes a bare lvalue), so that patch matched
#    nothing and silently changed nothing -- which is why the exact same
#    linker error reappeared afterward.
#
#    DEFINITIVE FIX: since AVC log spoofing requires SELinux avc.c
#    modification that we intentionally do not perform, we define the
#    variable locally (default false) instead of leaving it extern. This
#    satisfies the linker. susfs_set_avc_log_spoofing() (the userspace
#    toggle ioctl) continues to work exactly as before; the flag is
#    simply inert because nothing else in this tree reads it.
#
# 3) kernel/reboot.c missing ksu_handle_sys_reboot
#    gavdoc38/KernelSU-Next Kbuild:151 greps kernel/reboot.c for
#    "ksu_handle_sys_reboot" when CONFIG_KSU_MANUAL_HOOK=y and fails the
#    build if absent. Fixed by inserting the extern decl + call-site.
#
# 2) path_umount missing (KernelSU-Next drivers/kernelsu/*/adb_root.c)
#    Backported using existing do_umount()/mntput_no_expire() primitives.
#    Insertion anchor is do_umount()'s unique literal closing block
#    (NOT a balanced-brace scan -- this Samsung/RKP tree has #ifdef/#else
#    branches that each open a brace but share one closing brace, which
#    silently desyncs any preprocessor-unaware brace counter).
#
# 1) chimera-ksu-susfs.cfg used a non-existent CONFIG_KSU_NON_KPROBE
#    symbol; the real symbol in this KSU-Next fork is
#    CONFIG_KSU_MANUAL_HOOK. Fixed via a validation/normalization step.
#
# ─────────────────────────────────────────────────────────────────────────────
# PACKAGING CHANGE (this revision)
#
# Previous revisions built and packaged a single combined Image.gz-dtb.
# This revision builds Image and the device DTBs separately and uploads
# them as two distinct artifacts:
#   - chimera-mk9-Image-<profile>-<toolchain>      (arch/arm64/boot/Image)
#   - chimera-mk9-dtb-<profile>-<toolchain>         (dtb.img + raw .dtb files)
#
# dtb.img is a plain concatenation of the built star2lte .dtb blob(s) --
# this kernel/device generation uses the legacy Samsung dtb.img format
# (no mkdtimg header), consistent with the upstream Chimera Mk8 workflow.
# ─────────────────────────────────────────────────────────────────────────────

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: cm8 (runtime SUSFS spoof) or cm8e (compile-time identity)"
        required: true
        type: choice
        options: [cm8, cm8e]
        default: cm8

      toolchain:
        description: "Toolchain: aosp19/aosp20/aosp21/aosp22/neutron19/zyc_stable/clang21-eva-gcc"
        required: true
        type: choice
        options: [aosp19, aosp20, aosp21, aosp22, neutron19, zyc_stable, clang21-eva-gcc]
        default: neutron19

      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force re-apply KSU/SUSFS/Chimera patches even if markers present"
        required: false
        type: boolean
        default: false

      base_ref:
        description: "ExyHyperBrick base ref/branch/SHA (4.9.337 Exynos9810 BSP)"
        required: false
        type: string
        default: "lineage-23.2"

      ksu_repo:
        description: "KernelSU-Next git URL (https only)"
        required: false
        type: string
        default: "https://github.com/gavdoc38/KernelSU-Next.git"

      ksu_commit:
        description: "KernelSU exact commit SHA (pin)"
        required: false
        type: string
        default: "242f245b2c971eb5c1cc4a689e01dcdeaff4c939"

      susfs_repo:
        description: "SUSFS git URL — traceability only; core files pulled from Chimera Mk8 ref"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"

      susfs_ref:
        description: "SUSFS branch/tag/ref (traceability only)"
        required: false
        type: string
        default: "kernel-4.9"

      susfs_commit:
        description: "SUSFS exact commit SHA (optional pin, traceability only)"
        required: false
        type: string
        default: ""

      brand:
        description: "LOCALVERSION suffix (must start with '-')"
        required: false
        type: string
        default: "-Chimera_Mk9_Merge"

      build_user:
        description: "KBUILD_BUILD_USER"
        required: false
        type: string
        default: "C43L4N"

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"

      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        required: false
        type: string
        default: "1"

      build_date:
        description: "KBUILD_BUILD_TIMESTAMP (deterministic)"
        required: false
        type: string
        default: "Mon 1 Jan 00:00:00 UTC 2026"

env:
  BASE_REPO: "ExyHyperBrick/android_kernel_samsung_exynos9810"
  CHIMERA_REPO: "https://github.com/royd-jpg/Project_Chimera.git"
  CHIMERA_REF: "chimera-mk8"

  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"

  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"

  CCACHE_MAXSIZE: "3G"

  BRAND_DEFAULT: "-Chimera_Mk9_Merge"
  BUILD_USER_DEFAULT: "C43L4N"
  BUILD_HOST_DEFAULT: "AegisDevLabs"
  BUILD_VERSION_DEFAULT: "1"
  KBUILD_BUILD_TIMESTAMP_DEFAULT: "Mon 1 Jan 00:00:00 UTC 2026"

  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  IDENTITY_ENGINE_ACTIVE: ${{ inputs.profile == 'cm8e' }}
  FORCE_REPATCH: ${{ inputs.force_repatch }}

jobs:
  build:
    name: Chimera Mk9 Merge Build — ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:

      # ── 1. Host dependencies ────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            python3 \
            rsync \
            zstd \
            cpio \
            pahole \
            zip
          python3 --version

      - name: Install GCC cross-compiler (clang21-eva-gcc only)
        if: ${{ inputs.toolchain == 'clang21-eva-gcc' }}
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            binutils-arm-linux-gnueabi

      # ── 2. Checkout Project_Chimera ─────────────────────────────────────────
      - name: Checkout Project_Chimera (workflow repo — patches + Kconfig fragment)
        uses: actions/checkout@v4
        with:
          path: .
          fetch-depth: 1
          clean: false

      - name: Verify required repo-local files
        run: |
          set -Eeuo pipefail
          MISSING=0
          for f in \
            patches/apply_ksu_susfs_patches.sh \
            chimera-ksu-susfs.cfg; do
            if [[ ! -f "$GITHUB_WORKSPACE/$f" ]]; then
              echo "FATAL: required file missing: $f" >&2
              MISSING=1
            else
              echo "OK: $f"
            fi
          done
          if [[ -f "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh" ]]; then
            chmod +x "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"
          fi
          [[ "$MISSING" -eq 0 ]] || exit 1

      # ── 3. Checkout ExyHyperBrick base ──────────────────────────────────────
      - name: Checkout ExyHyperBrick base kernel
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BASE_REPO }}
          ref: ${{ inputs.base_ref }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0
          clean: false

      # ── 4. Workspace ─────────────────────────────────────────────────────────
      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR" \
            >> "$GITHUB_ENV"
          echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR" \
            >> "$GITHUB_ENV"
          echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR" \
            >> "$GITHUB_ENV"
          echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang" \
            >> "$GITHUB_ENV"

      - name: Resolve build identity
        run: |
          set -Eeuo pipefail
          BRAND="${{ inputs.brand }}"
          BRAND="${BRAND:-$BRAND_DEFAULT}"
          [[ "${BRAND:0:1}" == "-" ]] || {
            echo "FATAL: brand must start with '-'" >&2
            exit 1
          }
          BUILD_USER="${{ inputs.build_user }}"
          BUILD_USER="${BUILD_USER:-$BUILD_USER_DEFAULT}"
          BUILD_HOST="${{ inputs.build_host }}"
          BUILD_HOST="${BUILD_HOST:-$BUILD_HOST_DEFAULT}"
          BUILD_VER="${{ inputs.build_version }}"
          BUILD_VER="${BUILD_VER:-$BUILD_VERSION_DEFAULT}"
          BUILD_TS="${{ inputs.build_date }}"
          BUILD_TS="${BUILD_TS:-$KBUILD_BUILD_TIMESTAMP_DEFAULT}"
          UNAME_PREVIEW="Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VER} SMP PREEMPT"
          {
            echo "BRAND=$BRAND"
            echo "BUILD_USER=$BUILD_USER"
            echo "BUILD_HOST=$BUILD_HOST"
            echo "BUILD_VERSION=$BUILD_VER"
            echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TS"
            echo "UNAME_PREVIEW=$UNAME_PREVIEW"
          } >> "$GITHUB_ENV"
          {
            echo "profile=${{ inputs.profile }}"
            echo "toolchain=${{ inputs.toolchain }}"
            echo "brand=$BRAND"
            echo "uname_preview=$UNAME_PREVIEW"
          } > "$ABS_LOG/inputs.env"

      # ── 5. Validate base ─────────────────────────────────────────────────────
      - name: Preflight — verify base ref and clean worktree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          EXPECTED="${{ inputs.base_ref }}"
          CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD || true)"
          if [[ "$CURRENT_BRANCH" != "$EXPECTED" && "$CURRENT_BRANCH" != "HEAD" ]]; then
            echo "WARN: expected '$EXPECTED', got '$CURRENT_BRANCH'" \
              | tee -a "$ABS_LOG/preflight.log"
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "FATAL: base checkout is not clean" >&2
            git status --short
            exit 1
          fi
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile \
            | head -3 \
            | tee "$ABS_LOG/kernel-version.log"
          BASE_COMMIT="$(git rev-parse HEAD)"
          echo "$BASE_COMMIT" \
            > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" \
            >> "$GITHUB_ENV"

      # ── 6. Fetch Chimera Mk8 reference only ──────────────────────────────────
      - name: Fetch Chimera Mk8 reference
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          git remote add chimera "${{ env.CHIMERA_REPO }}" 2>/dev/null || true
          git fetch \
            --no-tags \
            --depth=1 \
            chimera \
            "${{ env.CHIMERA_REF }}"
          CHIMERA_TIP="$(git rev-parse "chimera/${{ env.CHIMERA_REF }}")"
          echo "$CHIMERA_TIP" \
            > "$ABS_LOG/chimera-reference.txt"
          echo "CHIMERA_COMMIT=$CHIMERA_TIP" \
            >> "$GITHUB_ENV"

      # ── 7. KernelSU-Next ─────────────────────────────────────────────────────
      - name: Initialise KernelSU-Next
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_COMMIT="${{ inputs.ksu_commit }}"
          KSU_SUB="KernelSU-Next"
          if [[ -f .gitmodules ]] && grep -q "$KSU_SUB" .gitmodules; then
            git config "submodule.$KSU_SUB.url" "$KSU_REPO"
            git submodule init "$KSU_SUB"
            git submodule update --depth=1 "$KSU_SUB" || {
              git -C "$KSU_SUB" fetch \
                --no-tags \
                --depth=100 \
                origin \
                "$KSU_COMMIT"
              git -C "$KSU_SUB" checkout --detach "$KSU_COMMIT"
            }
          else
            rm -rf "$KSU_SUB"
            git clone \
              --depth=100 \
              "$KSU_REPO" \
              "$KSU_SUB"
            git -C "$KSU_SUB" fetch \
              --no-tags \
              --depth=1 \
              origin \
              "$KSU_COMMIT" \
              || true
            git -C "$KSU_SUB" checkout --detach "$KSU_COMMIT"
          fi
          ACTUAL_KSU="$(git -C "$KSU_SUB" rev-parse HEAD)"
          echo "$ACTUAL_KSU" \
            > "$ABS_LOG/ksu-commit.txt"
          echo "KSU_GIT_VERSION=$(git -C "$KSU_SUB" rev-parse --short HEAD)" \
            >> "$GITHUB_ENV"

      - name: Record SUSFS traceability
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          {
            echo "susfs_repo=${{ inputs.susfs_repo }}"
            echo "susfs_ref=${{ inputs.susfs_ref }}"
            echo "susfs_commit=${{ inputs.susfs_commit }}"
            echo
            echo "SUSFS core source: Chimera Mk8 4.9.337 implementation"
          } > "$ABS_LOG/susfs-refs.txt"

      # ── 8. Apply KSU/SUSFS patch stack ───────────────────────────────────────
      - name: Apply curated KSU-Next + SUSFS patch stack
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          bash "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"

      # ── 9. KernelSU reboot hook (Kbuild:151 requirement) ─────────────────────
      - name: Patch kernel/reboot.c — add ksu_handle_sys_reboot
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path
          MARKER = "CMK9_REBOOT_KSU_HOOK"
          p = Path("kernel/reboot.c")
          src = p.read_text()
          if MARKER in src:
              print("kernel/reboot.c: already patched")
              sys.exit(0)
          old = (
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, "
              "unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n"
              "{"
          )
          new = (
              "#ifdef CONFIG_KSU /* " + MARKER + " */\n"
              "extern int ksu_handle_sys_reboot(int magic1, int magic2,\n"
              "\t\t\t\t unsigned int cmd, void __user **arg);\n"
              "#endif\n"
              "SYSCALL_DEFINE4(reboot, int, magic1, int, magic2, "
              "unsigned int, cmd,\n"
              "\t\tvoid __user *, arg)\n"
              "{"
          )
          if old not in src:
              print("FATAL: reboot syscall anchor not found", file=sys.stderr)
              sys.exit(1)
          src = src.replace(old, new, 1)
          anchor = (
              "\tret = reboot_pid_ns(pid_ns, cmd);\n"
              "\tif (ret)\n"
              "\t\treturn ret;\n"
              "\n"
              "\t/* Instead of trying to make the power_off code look like\n"
              "\t * halt when pm_power_off is not set do it the easy way.\n"
              "\t */\n"
              "\tif ((cmd == LINUX_REBOOT_CMD_POWER_OFF) && !pm_power_off)\n"
              "\t\tcmd = LINUX_REBOOT_CMD_HALT;\n"
              "\n"
              "\tmutex_lock(&reboot_mutex);"
          )
          replacement = (
              "\tret = reboot_pid_ns(pid_ns, cmd);\n"
              "\tif (ret)\n"
              "\t\treturn ret;\n"
              "\n"
              "\t/* Instead of trying to make the power_off code look like\n"
              "\t * halt when pm_power_off is not set do it the easy way.\n"
              "\t */\n"
              "\tif ((cmd == LINUX_REBOOT_CMD_POWER_OFF) && !pm_power_off)\n"
              "\t\tcmd = LINUX_REBOOT_CMD_HALT;\n"
              "\n"
              "#ifdef CONFIG_KSU\n"
              "\tksu_handle_sys_reboot(magic1, magic2, cmd, &arg);\n"
              "#endif\n"
              "\tmutex_lock(&reboot_mutex);"
          )
          if anchor not in src:
              print("FATAL: reboot hook call-site anchor not found", file=sys.stderr)
              sys.exit(1)
          src = src.replace(anchor, replacement, 1)
          p.write_text(src)
          print("kernel/reboot.c: KSU reboot hook applied")
          PYEOF

      # ── 10. Fix linker error — SUSFS AVC log spoofing symbol ─────────────────
      # ROOT CAUSE (verified against live chimera-mk8 fs/susfs.c):
      #   fs/susfs.c contains: extern bool susfs_is_avc_log_spoofing_enabled;
      #   This variable is NEVER DEFINED anywhere in this tree because its
      #   real definition lives in a SELinux avc.c patch that we deliberately
      #   do not apply (SELinux internals are out of scope / high risk).
      # FIX: define the variable locally (default false) instead of leaving
      #   it extern. susfs_set_avc_log_spoofing() keeps working as a no-op
      #   toggle; nothing else in this tree reads the flag.
      - name: Patch fs/susfs.c — define AVC log spoofing symbol
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path
          MARKER = "CMK9_AVC_LOG_SPOOF_SYMBOL_FIX"
          p = Path("fs/susfs.c")
          src = p.read_text()
          if MARKER in src:
              print("fs/susfs.c: AVC spoofing symbol fix already present — skipping")
              sys.exit(0)

          old = "extern bool susfs_is_avc_log_spoofing_enabled;"
          matches = src.count(old)
          if matches == 0:
              # Already fixed by an earlier (different-shaped) run, or the
              # upstream source dropped the symbol entirely. Either way this
              # is not fatal — just verify no bare extern remains below.
              print(
                  "WARN: extern declaration not found verbatim — "
                  "checking whether a definition already exists"
              )
          elif matches > 1:
              print(
                  f"FATAL: expected exactly one extern declaration, found {matches}",
                  file=sys.stderr
              )
              sys.exit(1)
          else:
              new = (
                  "/* " + MARKER + " — see workflow header for full root-cause"
                  " explanation. AVC log spoofing requires a SELinux avc.c"
                  " patch that this pipeline intentionally does not apply;"
                  " the variable is defined locally (inert) instead of left"
                  " extern so the linker resolves susfs_set_avc_log_spoofing()"
                  " cleanly. */\n"
                  "bool susfs_is_avc_log_spoofing_enabled = false;"
              )
              src = src.replace(old, new, 1)
              p.write_text(src)
              print("fs/susfs.c: defined susfs_is_avc_log_spoofing_enabled (was extern)")
          PYEOF

      # ── 11. Verify AVC spoofing fix landed correctly ─────────────────────────
      - name: Diagnostic — verify SUSFS AVC spoofing symbol is defined
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          python3 << 'PYEOF'
          import re
          import sys
          from pathlib import Path
          src = Path("fs/susfs.c").read_text()

          if re.search(
              r"^\s*extern\s+bool\s+susfs_is_avc_log_spoofing_enabled\s*;",
              src,
              re.MULTILINE,
          ):
              print(
                  "FATAL: susfs_is_avc_log_spoofing_enabled is still extern "
                  "(undefined) — patch step 10 did not apply",
                  file=sys.stderr,
              )
              sys.exit(1)

          if not re.search(
              r"^\s*bool\s+susfs_is_avc_log_spoofing_enabled\s*=\s*false\s*;",
              src,
              re.MULTILINE,
          ):
              print(
                  "FATAL: expected variable DEFINITION "
                  "'bool susfs_is_avc_log_spoofing_enabled = false;' not found",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("PASS: susfs_is_avc_log_spoofing_enabled is defined (not extern)")
          PYEOF
          grep -n \
            'susfs_is_avc_log_spoofing_enabled' \
            fs/susfs.c

      # ── 12. Definitive path_umount backport ──────────────────────────────────
      - name: Patch fs/namespace.c and fs/internal.h — add path_umount
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          python3 << 'PYEOF'
          import sys
          from pathlib import Path
          MARKER = "CMK9_PATH_UMOUNT_BACKPORT"
          ns = Path("fs/namespace.c")
          internal = Path("fs/internal.h")
          src = ns.read_text()
          if MARKER not in src:
              tail = (
                  "\tunlock_mount_hash();\n"
                  "\tnamespace_unlock();\n"
                  "\treturn retval;\n"
                  "}\n"
              )
              count = src.count(tail)
              if count != 1:
                  print(
                      "FATAL: expected exactly one do_umount() tail anchor; "
                      f"found {count}",
                      file=sys.stderr
                  )
                  sys.exit(1)
              backport = (
                  "\n\n"
                  "/* " + MARKER + " — KernelSU-Next 4.9.337 backport */\n"
                  "#ifdef CONFIG_KSU\n"
                  "\n"
                  "/*\n"
                  " * ExyHyperBrick defines may_mount() later in this file.\n"
                  " * This declaration is required before path_umount() calls it.\n"
                  " */\n"
                  "static inline bool may_mount(void);\n"
                  "\n"
                  "int path_umount(struct path *path, int flags)\n"
                  "{\n"
                  "\tstruct mount *mnt = real_mount(path->mnt);\n"
                  "\tint ret;\n"
                  "\n"
                  "\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n"
                  "\t\treturn -EINVAL;\n"
                  "\n"
                  "\tif (!may_mount())\n"
                  "\t\treturn -EPERM;\n"
                  "\n"
                  "\tret = do_umount(mnt, flags);\n"
                  "\n"
                  "\tdput(path->dentry);\n"
                  "\tmntput_no_expire(mnt);\n"
                  "\n"
                  "\treturn ret;\n"
                  "}\n"
                  "#endif\n"
              )
              src = src.replace(tail, tail + backport, 1)
              ns.write_text(src)
              print(
                  "fs/namespace.c: inserted may_mount() forward declaration "
                  "and path_umount()"
              )
          else:
              print(
                  "fs/namespace.c: path_umount backport marker already present"
              )
          h = internal.read_text()
          decl = "int path_umount(struct path *path, int flags);"
          if decl not in h:
              h += (
                  "\n\n"
                  "/* " + MARKER + " — KernelSU-Next 4.9.337 backport */\n"
                  "#ifdef CONFIG_KSU\n"
                  + decl +
                  "\n"
                  "#endif\n"
              )
              internal.write_text(h)
              print("fs/internal.h: path_umount declaration added")
          else:
              print("fs/internal.h: path_umount declaration already present")
          PYEOF

      # ── 13. Verify path_umount backport ordering ─────────────────────────────
      - name: Diagnostic — verify path_umount backport ordering
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          python3 << 'PYEOF'
          import re
          import sys
          from pathlib import Path
          src = Path("fs/namespace.c").read_text()
          if "CMK9_PATH_UMOUNT_BACKPORT" not in src:
              print("FATAL: path_umount marker missing", file=sys.stderr)
              sys.exit(1)
          forward_matches = list(re.finditer(
              r"static\s+inline\s+bool\s+may_mount\s*\(\s*void\s*\)\s*;",
              src
          ))
          definition_matches = list(re.finditer(
              r"static\s+inline\s+bool\s+may_mount\s*\(\s*void\s*\)\s*\{",
              src
          ))
          path_matches = list(re.finditer(
              r"\bint\s+path_umount\s*\(\s*struct\s+path\s*\*path\s*,\s*int\s+flags\s*\)\s*\{",
              src
          ))
          if len(forward_matches) != 1:
              print(
                  "FATAL: expected exactly one may_mount() forward declaration; "
                  f"found {len(forward_matches)}",
                  file=sys.stderr
              )
              sys.exit(1)
          if len(definition_matches) != 1:
              print(
                  "FATAL: expected exactly one may_mount() definition; "
                  f"found {len(definition_matches)}",
                  file=sys.stderr
              )
              sys.exit(1)
          if len(path_matches) != 1:
              print(
                  "FATAL: expected exactly one path_umount() definition; "
                  f"found {len(path_matches)}",
                  file=sys.stderr
              )
              sys.exit(1)
          declaration_pos = forward_matches[0].start()
          path_pos = path_matches[0].start()
          definition_pos = definition_matches[0].start()
          if not (
              declaration_pos < path_pos < definition_pos
          ):
              print(
                  "FATAL: expected order is declaration < path_umount < "
                  "may_mount definition",
                  file=sys.stderr
              )
              sys.exit(1)
          print("PASS: may_mount forward declaration precedes path_umount()")
          print("PASS: path_umount() precedes original may_mount() definition")
          PYEOF
          grep -n \
            -E \
            'CMK9_PATH_UMOUNT_BACKPORT|static inline bool may_mount|int path_umount' \
            fs/namespace.c
          grep -n \
            -E \
            'CMK9_PATH_UMOUNT_BACKPORT|int path_umount' \
            fs/internal.h

      # ── 14. Verify KSU reboot hook landed ────────────────────────────────────
      - name: Diagnostic — verify reboot hook symbol
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          grep -n \
            'ksu_handle_sys_reboot' \
            kernel/reboot.c

      # ── 15. Chimera overlay ──────────────────────────────────────────────────
      - name: Apply Chimera overlay
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          LOG="$ABS_LOG/overlay.log"
          echo "Chimera overlay started at $(date -u)" \
            > "$LOG"
          FAIR="kernel/sched/fair.c"
          if grep -q '750000ULL' "$FAIR"; then
            sed -i \
              's/\(normalized_sysctl_sched_min_granularity\s*=\s*\)750000ULL/\15000000ULL/' \
              "$FAIR"
          fi
          if grep -q '500000UL;' "$FAIR"; then
            sed -i \
              's/\(sysctl_sched_migration_cost\s*=\s*\)500000UL/\12000000UL/' \
              "$FAIR"
          fi
          sed -i \
            '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' \
            "$DEFCONFIG"
          printf \
            'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' \
            "$BRAND" \
            "$BUILD_HOST" \
            >> "$DEFCONFIG"
          printf \
            '#!/bin/sh\nprintf "%%s" "%s"\n' \
            "$BRAND" \
            > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "$BRAND" \
            > localversion
          echo \
            "Overlay applied (profile=$PROFILE, brand=$BRAND)" \
            | tee -a "$LOG"

      # ── 16. Kconfig fragment normalization ───────────────────────────────────
      - name: Validate Kconfig fragment
        run: |
          set -Eeuo pipefail
          CFG="$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg"
          if grep -q \
            '^CONFIG_KSU_NON_KPROBE=y' \
            "$CFG"; then
            sed -i \
              's/^CONFIG_KSU_NON_KPROBE=y/CONFIG_KSU_MANUAL_HOOK=y/' \
              "$CFG"
          fi
          grep -q \
            '^CONFIG_KSU_MANUAL_HOOK=y' \
            "$CFG" \
            || echo 'CONFIG_KSU_MANUAL_HOOK=y' >> "$CFG"
          sed -i \
            '/^# CONFIG_KSU_KPROBES_HOOK is not set/d' \
            "$CFG" \
            || true
          cat "$CFG"

      # ── 17. Merge Kconfig ────────────────────────────────────────────────────
      - name: Merge Kconfig fragment
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          export PATH="$ABS_TC/bin:$PATH"
          cp \
            "$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg" \
            /tmp/chimera-ksu-susfs.cfg
          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            "$(basename "$DEFCONFIG")" \
            | tee "$ABS_LOG/defconfig-base.log"
          scripts/kconfig/merge_config.sh \
            -m \
            -O "$ABS_OUT" \
            "$ABS_OUT/.config" \
            /tmp/chimera-ksu-susfs.cfg \
            | tee "$ABS_LOG/merge-config.log"
          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            olddefconfig \
            | tee -a "$ABS_LOG/merge-config.log"

      # ── 18. Security/config guard ─────────────────────────────────────────────
      - name: Guard pass — verify security restrictions remain disabled
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          CFG="$ABS_OUT/.config"
          FORBIDDEN=(
            CONFIG_RKP_KDP
            CONFIG_UH_RKP
            CONFIG_TIMA
            CONFIG_TIMA_LKMAUTH
            CONFIG_FIVE
            CONFIG_SEC_RESTRICT_ROOTING
            CONFIG_SEC_RESTRICT_SETUID
          )
          FAIL=0
          : > "$ABS_LOG/config-guard.log"
          for sym in "${FORBIDDEN[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "FATAL: $sym=y" \
                | tee -a "$ABS_LOG/config-guard.log"
              FAIL=1
            else
              echo "OK: $sym disabled" \
                | tee -a "$ABS_LOG/config-guard.log"
            fi
          done
          REQUIRED=(
            CONFIG_KSU
            CONFIG_KSU_MANUAL_HOOK
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_SUS_KSTAT
          )
          for sym in "${REQUIRED[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "OK: $sym=y" \
                | tee -a "$ABS_LOG/config-guard.log"
            else
              echo "FATAL: $sym is not enabled" \
                | tee -a "$ABS_LOG/config-guard.log"
              FAIL=1
            fi
          done
          [[ "$FAIL" -eq 0 ]] || exit 1

      # ── 19. Toolchain resolution ──────────────────────────────────────────────
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail
          TOOLCHAIN="${{ inputs.toolchain }}"
          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_LLVM_IAS="1"
          TC_USE_FULL_LLVM="true"
          case "$TOOLCHAIN" in
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f60b8b55282f002f594f452ce22dfd6cf1fd7e3c/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;
            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;
            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;
            zyc_stable)
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-v2"
              TC_URL=$(curl -fsSL \
                "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" \
                || true)
              ;;
            clang21-eva-gcc)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              TC_USE_FULL_LLVM="false"
              TC_LLVM_IAS="0"
              ;;
            *)
              echo "ERROR: unsupported toolchain '$TOOLCHAIN'" >&2
              exit 1
              ;;
          esac
          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_LLVM_IAS=$TC_LLVM_IAS"
            echo "TC_USE_FULL_LLVM=$TC_USE_FULL_LLVM"
          } >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=$TC_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          ARCHIVE="/tmp/clang_archive"
          aria2c \
            -x4 \
            -s4 \
            -q \
            -d /tmp \
            -o clang_archive \
            "$TC_URL" \
            || wget -O "$ARCHIVE" "$TC_URL"
          rm -rf toolchains/clang
          mkdir -p toolchains/clang
          case "$TC_ARCHIVE_FMT" in
            tar.gz|tar)
              tar -C toolchains/clang -xzf "$ARCHIVE"
              ;;
            tar.xz)
              tar -C toolchains/clang -xJf "$ARCHIVE"
              ;;
            tar.zst)
              zstd -d "$ARCHIVE" -o /tmp/clang.tar --force
              tar -C toolchains/clang -xf /tmp/clang.tar
              ;;
          esac
          chmod +x toolchains/clang/bin/* 2>/dev/null || true

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: >-
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ── 20. Finalize config ───────────────────────────────────────────────────
      - name: Finalise kernel .config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          export PATH="$ABS_TC/bin:$PATH"
          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig
          cp \
            "$ABS_OUT/.config" \
            "$ABS_LOG/config.built"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SEC_RESTRICT|CONFIG_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_LOCALVERSION)' \
            "$ABS_OUT/.config" \
            | tee "$ABS_LOG/config-summary.txt"

      # ── 21. Build — Image and DTBs as SEPARATE make targets ──────────────────
      # Changed from the combined `Image.gz-dtb` target to building `Image`
      # and `dtbs` independently, so they can be packaged as two distinct
      # artifacts rather than one merged blob.
      - name: Build kernel Image and device DTBs
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: ${{ env.BUILD_USER }}
          KBUILD_BUILD_HOST: ${{ env.BUILD_HOST }}
          KBUILD_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
        run: |
          set -Eeuo pipefail
          export PATH="$ABS_TC/bin:$PATH"
          JOBS="$(nproc)"
          MAKE_ARGS=(
            "O=$ABS_OUT"
            "ARCH=arm64"
            "CC=ccache clang"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "CROSS_COMPILE=aarch64-linux-gnu-"
            "CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
            "-j${JOBS}"
            "LOCALVERSION=${BRAND}"
          )
          if [[ "${{ inputs.toolchain }}" != "clang21-eva-gcc" ]]; then
            for tool in ar nm objcopy objdump strip; do
              ln -sf \
                "$ABS_TC/bin/llvm-${tool}" \
                "$ABS_TC/bin/aarch64-linux-gnu-${tool}" \
                || true
            done
            ln -sf \
              "$ABS_TC/bin/ld.lld" \
              "$ABS_TC/bin/aarch64-linux-gnu-ld" \
              || true
            MAKE_ARGS+=(
              "LLVM=1"
              "LLVM_IAS=1"
              "LD=ld.lld"
              "AR=llvm-ar"
              "NM=llvm-nm"
              "OBJCOPY=llvm-objcopy"
              "OBJDUMP=llvm-objdump"
              "STRIP=llvm-strip"
              "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error -fuse-ld=lld"
            )
          else
            MAKE_ARGS+=(
              "LLVM_IAS=0"
              "HOSTCC=gcc"
              "HOSTCXX=g++"
              "LD=aarch64-linux-gnu-ld"
              "AR=aarch64-linux-gnu-ar"
              "NM=aarch64-linux-gnu-nm"
              "OBJCOPY=aarch64-linux-gnu-objcopy"
              "OBJDUMP=aarch64-linux-gnu-objdump"
              "STRIP=aarch64-linux-gnu-strip"
              "KCFLAGS=-O2 -fcommon -fno-strict-aliasing -Wno-error"
            )
          fi
          make \
            "${MAKE_ARGS[@]}" \
            Image \
            dtbs \
            2>&1 \
            | tee "$ABS_LOG/build.log"

      # ── 22. nm guard ───────────────────────────────────────────────────────────
      - name: Guard pass — verify KSU/SUSFS symbols
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          VMLINUX="$ABS_OUT/vmlinux"
          [[ -f "$VMLINUX" ]] || {
            echo "FATAL: vmlinux not found" >&2
            exit 1
          }
          if command -v llvm-nm >/dev/null 2>&1; then
            NM=llvm-nm
          else
            NM=nm
          fi
          "$NM" \
            "$VMLINUX" \
            > "$ABS_LOG/vmlinux-symbols.log" \
            2>&1 \
            || true
          REQUIRED=(
            ksu_handle_execveat
            ksu_handle_faccessat
            ksu_handle_sys_reboot
            susfs_is_inode_sus_path
          )
          FAIL=0
          for sym in "${REQUIRED[@]}"; do
            if grep -q \
              -E \
              "^[0-9a-fA-F]+ [A-Za-z] ${sym}$" \
              "$ABS_LOG/vmlinux-symbols.log"; then
              echo "OK: $sym"
            else
              echo "FATAL: missing symbol: $sym"
              FAIL=1
            fi
          done
          [[ "$FAIL" -eq 0 ]] || exit 1

      # ── 23. Assemble dtb.img (legacy Samsung format, raw concatenation) ───────
      - name: Assemble dtb.img from star2lte device DTBs
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART_DIR"

          DTB_SEARCH_DIR="$ABS_OUT/arch/arm64/boot/dts/exynos"
          mapfile -t DTB_FILES < <(
            find "$DTB_SEARCH_DIR" -maxdepth 1 -iname "*star2lte*.dtb" 2>/dev/null | sort
          )

          if [[ ${#DTB_FILES[@]} -eq 0 ]]; then
            echo "WARN: no star2lte-specific .dtb found; falling back to all .dtb files" \
              | tee -a "$ABS_LOG/dtb-assemble.log"
            mapfile -t DTB_FILES < <(
              find "$ABS_OUT/arch/arm64/boot/dts" -iname "*.dtb" 2>/dev/null | sort
            )
          fi

          if [[ ${#DTB_FILES[@]} -eq 0 ]]; then
            echo "FATAL: no .dtb files produced under $ABS_OUT/arch/arm64/boot/dts" >&2
            find "$ABS_OUT/arch/arm64/boot/dts" -type f 2>/dev/null >&2 || true
            exit 1
          fi

          echo "DTB file(s) found:" | tee -a "$ABS_LOG/dtb-assemble.log"
          printf '  %s\n' "${DTB_FILES[@]}" | tee -a "$ABS_LOG/dtb-assemble.log"

          # Legacy Samsung dtb.img: raw concatenation, no mkdtimg header.
          cat "${DTB_FILES[@]}" > "$ART_DIR/dtb.img"

          if [[ ! -s "$ART_DIR/dtb.img" ]]; then
            echo "FATAL: dtb.img was not created or is empty" >&2
            exit 1
          fi

          echo "dtb.img size: $(stat -c%s "$ART_DIR/dtb.img") bytes" \
            | tee -a "$ABS_LOG/dtb-assemble.log"

          cp "${DTB_FILES[@]}" "$ART_DIR/" 2>/dev/null || true
          echo "ART_DIR=$ART_DIR" >> "$GITHUB_ENV"

      # ── 24. Package Image (separately from dtb) ───────────────────────────────
      - name: Package Image
        if: ${{ inputs.dry_run != true }}
        id: package-image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART_DIR"
          IMG="$ABS_OUT/arch/arm64/boot/Image"
          [[ -f "$IMG" ]] || {
            echo "FATAL: Image not found at $IMG" >&2
            exit 1
          }
          cp "$IMG" "$ART_DIR/Image"
          BUILD_TAG="chimera-mk9-${{ inputs.profile }}-${{ inputs.toolchain }}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"
          echo "ART_DIR=$ART_DIR" >> "$GITHUB_ENV"
          echo "image_path=$ART_DIR/Image" >> "$GITHUB_OUTPUT"
          echo "dtb_path=$ART_DIR/dtb.img" >> "$GITHUB_OUTPUT"

      # ── 25. Upload Image artifact ─────────────────────────────────────────────
      - name: Upload Image artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-Image-${{ inputs.profile }}-${{ inputs.toolchain }}
          path: ${{ steps.package-image.outputs.image_path }}
          if-no-files-found: error

      # ── 26. Upload dtb artifact (image + raw .dtb files) ─────────────────────
      - name: Upload dtb artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-dtb-${{ inputs.profile }}-${{ inputs.toolchain }}
          path: |
            ${{ env.ART_DIR }}/dtb.img
            ${{ env.ART_DIR }}/*.dtb
          if-no-files-found: error

      # ── 27. Release (attaches both Image and dtb.img) ────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.do_release == true && inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "Chimera Mk9 — ${{ inputs.profile }} / ${{ inputs.toolchain }}"
          body: |
            ## Chimera Mk9 — ExyHyperBrick Merge Build
            | Field | Value |
            |---|---|
            | Base | `${{ env.BASE_REPO }}` @ `${{ env.BASE_COMMIT }}` |
            | Chimera Mk8 ref | `${{ env.CHIMERA_COMMIT }}` |
            | KernelSU-Next | `${{ inputs.ksu_commit }}` |
            | Profile | `${{ inputs.profile }}` |
            | Toolchain | `${{ inputs.toolchain }}` |
            | uname | `${{ env.UNAME_PREVIEW }}` |

            Image and dtb.img are packaged and attached separately.
          files: |
            ${{ steps.package-image.outputs.image_path }}
            ${{ steps.package-image.outputs.dtb_path }}
          draft: false
          prerelease: false

      # ── 28. Upload logs ────────────────────────────────────────────────────────
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk9-logs-${{ github.run_id }}
          path: ${{ env.ABS_LOG }}/**
          if-no-files-found: warn
