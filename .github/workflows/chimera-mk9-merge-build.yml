#      "Entering directory"/"Leaving directory" around any -C-based
#      recursive invocation unless --no-print-directory is passed. Those
#      lines were captured into ACTUAL_RELEASE alongside the real release
#      string, and a plain `KEY=$VALUE` append of a multi-line value is
#      invalid for the GITHUB_ENV file command — this produced runner
#      errors "Unable to process file command 'env' successfully" /
#      "Invalid format '<release>'" and failed the run. Fixed by adding
#      --no-print-directory, piping through `tail -n1`, and failing fast
#      with an explicit check if the captured value ever contains a
