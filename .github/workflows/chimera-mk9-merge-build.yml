name: Project Chimera Mk9 — ExyHyperBrick Merge Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        required: true
        type: choice
        options:
          - cm8
          - cm8e
        default: cm8

      toolchain:
        description: "LLVM toolchain"
        required: true
        type: choice
        options:
          - aosp19
          - aosp20
          - aosp21
          - aosp22
          - neutron19
          - zyc_stable
          - clang21-eva-gcc
        default: neutron19

      dry_run:
        description: "Validate only"
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create release"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force patch reapplication"
        required: false
        type: boolean
        default: false

      base_ref:
        description: "ExyHyperBrick kernel branch/ref"
        required: false
        type: string
        default: lineage-23.2

      brand:
        description: "LOCALVERSION"
        required: false
        type: string
        default: "-Chimera_Mk9_Merge"

      ksu_repo:
        description: "KernelSU-Next repository"
        required: false
        type: string
        default: https://github.com/gavdoc38/KernelSU-Next.git

      ksu_commit:
        description: "KernelSU-Next commit"
        required: false
        type: string
        default: 242f245b2c971eb5c1cc4a689e01dcdeaff4c939


env:

  BASE_REPO:
    ExyHyperBrick/android_kernel_samsung_exynos9810

  CHIMERA_REPO:
    https://github.com/royd-jpg/Project_Chimera.git

  CHIMERA_REF:
    chimera-mk8

  KERNEL_DIR:
    kernel

  OUT_DIR:
    kernel-out

  LOG_DIR:
    logs

  DEFCONFIG:
    arch/arm64/configs/exynos9810-star2lte_defconfig

  CCACHE_MAXSIZE:
    3G


jobs:

  build:

    name:
      Chimera Mk9 ${{ inputs.profile }} ${{ inputs.toolchain }}

    runs-on:
      ubuntu-24.04


    defaults:

      run:

        shell:
          bash


    steps:


# ------------------------------------------------------------------
# Host dependencies
# ------------------------------------------------------------------

      - name: Install dependencies

        run: |

          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y \
            bc \
            bison \
            flex \
            build-essential \
            ccache \
            git \
            libelf-dev \
            libssl-dev \
            lz4 \
            lzop \
            python3 \
            rsync \
            zstd \
            cpio \
            pahole \
            zip \
            aria2


# ------------------------------------------------------------------
# Checkout workflow repository
# ------------------------------------------------------------------

      - name: Checkout Chimera workflow

        uses:
          actions/checkout@v4

        with:

          path:
            .

          fetch-depth:
            1

          clean:
            false


      - name: Verify Chimera patch inputs

        run: |

          set -Eeuo pipefail


          for f in \
            patches/apply_ksu_susfs_patches.sh \
            chimera-ksu-susfs.cfg

          do

            test -f "$f" || {

              echo "Missing required file: $f"

              exit 1

            }

          done


          chmod +x \
            patches/apply_ksu_susfs_patches.sh



# ------------------------------------------------------------------
# Checkout ExyHyperBrick base
# ------------------------------------------------------------------

      - name: Checkout kernel base

        uses:
          actions/checkout@v4

        with:

          repository:
            ${{ env.BASE_REPO }}

          ref:
            ${{ inputs.base_ref }}

          path:
            ${{ env.KERNEL_DIR }}

          fetch-depth:
            0



# ------------------------------------------------------------------
# Workspace setup
# ------------------------------------------------------------------

      - name: Prepare workspace

        run: |

          set -Eeuo pipefail


          mkdir -p \
            "$OUT_DIR" \
            "$LOG_DIR"


          echo \
            "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR" \
            >> "$GITHUB_ENV"


          echo \
            "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR" \
            >> "$GITHUB_ENV"


          echo \
            "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR" \
            >> "$GITHUB_ENV"


          echo \
            "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang" \
            >> "$GITHUB_ENV"



# ------------------------------------------------------------------
# Base validation
# ------------------------------------------------------------------

      - name: Validate kernel base

        working-directory:
          ${{ env.KERNEL_DIR }}

        run:

          set -Eeuo pipefail


          git status --short


          test -z "$(git status --porcelain)" || {

            echo "Kernel tree dirty"

            exit 1

          }


          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL)' \
            Makefile


          git rev-parse HEAD \
            > "$ABS_LOG/base-commit.txt"



# ------------------------------------------------------------------
# Fetch Chimera Mk8 reference
# ------------------------------------------------------------------

      - name: Fetch Chimera Mk8

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          git remote add chimera \
            "$CHIMERA_REPO" \
            2>/dev/null || true


          git fetch \
            --depth=1 \
            chimera \
            "$CHIMERA_REF"


          git rev-parse \
            "chimera/$CHIMERA_REF" \
            | tee "$ABS_LOG/chimera-commit.txt"

            # ------------------------------------------------------------------
# KernelSU-Next setup
# ------------------------------------------------------------------

      - name: Initialise KernelSU-Next

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          KSU_DIR=KernelSU-Next


          rm -rf "$KSU_DIR"


          git clone \
            --depth=100 \
            "${{ inputs.ksu_repo }}" \
            "$KSU_DIR"


          git -C "$KSU_DIR" fetch \
            --depth=1 \
            origin \
            "${{ inputs.ksu_commit }}"


          git -C "$KSU_DIR" checkout \
            --detach \
            "${{ inputs.ksu_commit }}"


          git -C "$KSU_DIR" rev-parse HEAD \
            | tee "$ABS_LOG/ksu-commit.txt"



# ------------------------------------------------------------------
# Apply KSU/SUSFS patch stack
# ------------------------------------------------------------------

      - name: Apply KSU SUSFS patches

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          bash \
            "$GITHUB_WORKSPACE/patches/apply_ksu_susfs_patches.sh"



      # ------------------------------------------------------------------
      # KSU reboot hook
      # ------------------------------------------------------------------

      - name: Patch reboot syscall hook

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path
          import sys


          p = Path("kernel/reboot.c")

          s = p.read_text()


          marker = "CMK9_KSU_REBOOT_HOOK"


          if marker in s:
              print("already patched")
              sys.exit(0)


          if "ksu_handle_sys_reboot" not in s:

              s = s.replace(

                  "SYSCALL_DEFINE4(reboot,",

                  """
          #ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(
                  int magic1,
                  int magic2,
                  unsigned int cmd,
                  void __user **arg);
          #endif


          SYSCALL_DEFINE4(reboot,
          """,

                  1
              )


          needle = "\tmutex_lock(&reboot_mutex);"


          replacement = """

          #ifdef CONFIG_KSU_MANUAL_HOOK
              ksu_handle_sys_reboot(
                  magic1,
                  magic2,
                  cmd,
                  &arg);
          #endif

              mutex_lock(&reboot_mutex);
          """


          if needle not in s:

              print(
                  "reboot anchor missing",
                  file=sys.stderr
              )

              sys.exit(1)


          s = s.replace(
              needle,
              replacement,
              1
          )


          s += "\n/* CMK9_KSU_REBOOT_HOOK */\n"


          p.write_text(s)


          print("kernel/reboot.c patched")

          PY


      # ------------------------------------------------------------------
      # SUSFS AVC symbol fix
      # ------------------------------------------------------------------

      - name: Fix SUSFS AVC symbol

        working-directory: ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail

          python3 <<'PY'
          from pathlib import Path


          p = Path("fs/susfs.c")

          s = p.read_text()


          if "CMK9_AVC_SYMBOL_FIX" not in s:


              old = "extern bool susfs_is_avc_log_spoofing_enabled;"


              if old in s:


                  s = s.replace(

                      old,

                      """
          /*
           * CMK9_AVC_SYMBOL_FIX
           *
           * Kernel 4.9 tree does not contain
           * SELinux avc.c spoofing patch.
           */
          bool susfs_is_avc_log_spoofing_enabled = false;
          """,

                      1
                  )


                  p.write_text(s)

                  print("SUSFS AVC symbol fixed")


              else:

                  print(
                      "SUSFS AVC extern already absent"
                  )


          PY


# ------------------------------------------------------------------
# setresuid manual hook
# ------------------------------------------------------------------

      - name: Patch setresuid manual hook

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          python3 <<'PY'

from pathlib import Path
import re,sys


p = Path("kernel/sys.c")

s = p.read_text()


marker="CMK9_KSU_SETRESUID_HOOK"


if marker in s:

    sys.exit(0)



m = re.search(

r"SYSCALL_DEFINE3\s*\(\s*setresuid.*?\n\}",

s,

re.S

)


if not m:

    print(
        "setresuid syscall missing",
        file=sys.stderr
    )

    sys.exit(1)


fn=m.group(0)



fn=fn.replace(

"{",

"""
{
#ifdef CONFIG_KSU_MANUAL_HOOK
\tksu_handle_setresuid(
\t\truid,
\t\teuid,
\t\tsuid);
#endif
""",

1

)


s=s[:m.start()]+fn+s[m.end():]


s += "\n/* CMK9_KSU_SETRESUID_HOOK */\n"


p.write_text(s)

PY



# ------------------------------------------------------------------
# Kconfig fragment validation
# ------------------------------------------------------------------

      - name: Validate KSU SUSFS config

        run: |

          set -Eeuo pipefail


          CFG=chimera-ksu-susfs.cfg


          grep \
            -q '^CONFIG_KSU=y$' \
            "$CFG"


          grep \
            -q '^CONFIG_KSU_MANUAL_HOOK=y$' \
            "$CFG"


          grep \
            -q '^CONFIG_KSU_SUSFS=y$' \
            "$CFG"



# ------------------------------------------------------------------
# Merge config
# ------------------------------------------------------------------

      - name: Merge kernel config

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            "$(basename "$DEFCONFIG")"



          scripts/kconfig/merge_config.sh \
            -m \
            -O "$ABS_OUT" \
            "$ABS_OUT/.config" \
            "$GITHUB_WORKSPACE/chimera-ksu-susfs.cfg"



          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            olddefconfig



# ------------------------------------------------------------------
# Force manual KSU mode
# ------------------------------------------------------------------

      - name: Force KernelSU manual hook mode

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          CFG="$ABS_OUT/.config"


          scripts/config \
            --file "$CFG" \
            -e CONFIG_KSU \
            -e CONFIG_KSU_MANUAL_HOOK \
            -d CONFIG_KSU_KPROBES_HOOK


          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            olddefconfig



# ------------------------------------------------------------------
# Toolchain
# ------------------------------------------------------------------

      - name: Setup clang

        run: |

          set -Eeuo pipefail


          mkdir -p toolchains/clang


          if [[ "${{ inputs.toolchain }}" == "neutron19" ]]; then


            wget -q \
              -O /tmp/clang.tar.zst \
              https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst


            zstd \
              -d \
              /tmp/clang.tar.zst \
              -o /tmp/clang.tar


            tar \
              -xf /tmp/clang.tar \
              -C toolchains/clang


          fi


          echo \
            "PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$PATH" \
            >> "$GITHUB_ENV"



# ------------------------------------------------------------------
# Build Image and DTBs
# ------------------------------------------------------------------

      - name: Build Image and DTBs

        if:
          ${{ inputs.dry_run != true }}

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          export PATH="$ABS_TC/bin:$PATH"


          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j"$(nproc)" \
            Image \
            dtbs


          test \
            -f "$ABS_OUT/arch/arm64/boot/Image"


          find \
            "$ABS_OUT/arch/arm64/boot/dts" \
            -name "*.dtb" \
            > "$ABS_LOG/dtb-list.txt"

            # ------------------------------------------------------------------
# vmlinux symbol verification
# ------------------------------------------------------------------

      - name: Verify KSU SUSFS symbols

        if:
          ${{ inputs.dry_run != true }}

        working-directory:
          ${{ env.KERNEL_DIR }}

        run: |

          set -Eeuo pipefail


          VMLINUX="$ABS_OUT/vmlinux"


          test -f "$VMLINUX"


          nm "$VMLINUX" \
            > "$ABS_LOG/vmlinux-symbols.txt" \
            2>&1 || true



          REQUIRED=(

            ksu_handle_execveat

            ksu_handle_faccessat

            ksu_handle_setresuid

            ksu_handle_sys_reboot

            susfs_is_inode_sus_path

          )


          for sym in "${REQUIRED[@]}"

          do

            grep \
              -q \
              "$sym" \
              "$ABS_LOG/vmlinux-symbols.txt" || {

                echo \
                  "Missing symbol: $sym"

                exit 1

              }


            echo \
              "OK: $sym"

          done



# ------------------------------------------------------------------
# Prepare artifact directory
# ------------------------------------------------------------------

      - name: Prepare kernel artifacts

        if:
          ${{ inputs.dry_run != true }}

        run: |

          set -Eeuo pipefail


          mkdir -p artifacts


          echo \
            "ART_DIR=$GITHUB_WORKSPACE/artifacts" \
            >> "$GITHUB_ENV"



# ------------------------------------------------------------------
# Package Image separately
# ------------------------------------------------------------------

      - name: Package Image artifact

        if:
          ${{ inputs.dry_run != true }}

        run: |

          set -Eeuo pipefail


          IMAGE="$ABS_OUT/arch/arm64/boot/Image"


          test \
            -f "$IMAGE"


          cp \
            "$IMAGE" \
            artifacts/Image



# ------------------------------------------------------------------
# Assemble Samsung legacy dtb.img
# ------------------------------------------------------------------

      - name: Build dtb.img

        if:
          ${{ inputs.dry_run != true }}

        run: |

          set -Eeuo pipefail


          DTB_DIR="$ABS_OUT/arch/arm64/boot/dts"


          mapfile -t DTBS < <(

            find \
              "$DTB_DIR" \
              -iname "*star2lte*.dtb" \
              | sort

          )



          if [[ "${#DTBS[@]}" -eq 0 ]]; then


            echo \
              "No star2lte DTB found, using all DTBs"


            mapfile -t DTBS < <(

              find \
                "$DTB_DIR" \
                -name "*.dtb" \
                | sort

            )

          fi



          test \
            "${#DTBS[@]}" \
            -gt 0



          cat \
            "${DTBS[@]}" \
            > artifacts/dtb.img



          cp \
            "${DTBS[@]}" \
            artifacts/



          test \
            -s artifacts/dtb.img



          stat \
            artifacts/dtb.img



# ------------------------------------------------------------------
# Package metadata
# ------------------------------------------------------------------

      - name: Generate build metadata

        if:
          ${{ inputs.dry_run != true }}

        run: |

          set -Eeuo pipefail


          cat > artifacts/build-info.txt <<EOF

Project Chimera Mk9

Profile:
${{ inputs.profile }}

Toolchain:
${{ inputs.toolchain }}

Base:
${{ env.BASE_REPO }}

Kernel commit:
$(cat "$ABS_LOG/base-commit.txt")

KernelSU:
${{ inputs.ksu_commit }}

Image:
Image

DTB:
dtb.img

EOF



# ------------------------------------------------------------------
# Upload Image artifact
# ------------------------------------------------------------------

      - name: Upload Image

        if:
          ${{ inputs.dry_run != true }}

        uses:
          actions/upload-artifact@v4

        with:

          name:
            chimera-mk9-Image-${{ inputs.profile }}-${{ inputs.toolchain }}

          path:

            artifacts/Image

          if-no-files-found:
            error



# ------------------------------------------------------------------
# Upload DTB artifact
# ------------------------------------------------------------------

      - name: Upload DTB

        if:
          ${{ inputs.dry_run != true }}

        uses:
          actions/upload-artifact@v4

        with:

          name:
            chimera-mk9-dtb-${{ inputs.profile }}-${{ inputs.toolchain }}

          path:

            |
              artifacts/dtb.img
              artifacts/*.dtb

          if-no-files-found:
            error



# ------------------------------------------------------------------
# GitHub Release
# ------------------------------------------------------------------

      - name: Create release

        if:
          ${{ inputs.do_release == true && inputs.dry_run != true }}

        uses:
          softprops/action-gh-release@v2

        with:

          tag_name:

            chimera-mk9-${{ github.run_number }}


          name:

            Chimera Mk9 Kernel Build ${{ github.run_number }}


          body:

            |
              ## Project Chimera Mk9

              Device:
              Samsung Exynos9810 star2lte

              Base:
              ${{ env.BASE_REPO }}

              Profile:
              ${{ inputs.profile }}

              Toolchain:
              ${{ inputs.toolchain }}

              KernelSU manual hooks verified:

              - ksu_handle_execveat
              - ksu_handle_faccessat
              - ksu_handle_setresuid
              - ksu_handle_sys_reboot

              Packaging:

              - Image
              - dtb.img

              Boot.img intentionally not generated.
              Flash through existing ROM boot chain.


          files:

            |
              artifacts/Image
              artifacts/dtb.img



# ------------------------------------------------------------------
# Logs
# ------------------------------------------------------------------

      - name: Upload logs

        if:
          always()

        uses:
          actions/upload-artifact@v4

        with:

          name:

            chimera-mk9-build-logs-${{ github.run_id }}


          path:

            |
              ${{ env.ABS_LOG }}/**


          if-no-files-found:

            warn
