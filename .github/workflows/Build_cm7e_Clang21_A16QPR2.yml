# ═══════════════════════════════════════════════════════════════════════════════
# Project Chimera Mk7e — LOS/AOSP Android 15/16 QPR2 / Exynos 9810 (star2lte)
# ───────────────────────────────────────────────────────────────────────────────
# Base      : royd-jpg/Project_Chimera @ chimera-mk6l
# KSU       : KernelSU-Next/KernelSU-Next @ legacy-susfs           [Δ10]
#             SUSFS is natively wired into KernelSU-Next/kernel/ on this branch.
# SUSFS     : simonpunk/susfs4ksu @ kernel-4.9 · v1.5.5            [Δ13]
# Clang     : AOSP Clang 21 (r563880c) — Tarball
# Target    : LOS/AOSP Android 15/16 QPR2 · Evolution X 11.8
# Branding  : 4.9.337-Chimera_Mk7e (X@AegisDevLabs)               [Δ14]
# ───────────────────────────────────────────────────────────────────────────────
# Changes from rev7 (build_CM6P_rev7.yml)
# [Δ1]  Target ROM changed to LOS/AOSP Android 15/16.
# [Δ2]  ALL CONFIG_KSU_SUSFS_* options enabled including SUS_MOUNT,
#       OPEN_REDIRECT, SPOOF_UNAME, ENABLE_LOG, HIDE_KSU_SUSFS_SYMBOLS,
#       SPOOF_CMDLINE_OR_BOOTCONFIG, and all AVC/SELinux spoof options.
# [Δ3]  BRAND changed to "-Chimera_Mk7".
# [Δ4]  KBUILD_BUILD_USER="X", KBUILD_BUILD_HOST="AegisDevLabs" (static).
#       uname will read: Linux version 4.9.337-Chimera_Mk7 (X@AegisDevLabs)
# [Δ5]  Artifact/release names updated throughout.
# [Δ6]  Toolchain switched from sparse-checkout r536225 to tarball r563880c.
# [Δ7]  Build hardening added for stricter Clang compatibility.
# [Δ8]  LLVM=1, LLVM_IAS=0, and KCFLAGS removed. LLVM=1 caused kbuild
#       to inject -fno-common via cc-option probes, producing separate
#       per-TU BSS copies of tentative globals in s5p_mfc / Exynos audio
#       DSP TUs, breaking MFC ioctl state consistency and causing Codec2
#       HIDL component lookup to deadlock on video playback. -Wno-error
#       was masking a real compile error in the same code path, producing
#       silently broken object code. Removing both restores correct
#       behaviour. See Brain Core V29.4 investigation.
# [Δ9]  KCFLAGS reinjected with "-O2 -fcommon -fno-strict-aliasing -Wno-error".
#       Optimized for low-latency UI responsiveness on Exynos 9810 running
#       heavy A15/16 frameworks, while explicitly fixing the MFC/Audio BSS
#       aliasing issue via the -fcommon directive.
# [Δ10] KSU source switched from sidex15/KernelSU-Next@legacy-susfs-v2 to
#       KernelSU-Next/KernelSU-Next@legacy-susfs (upstream canonical repo).
# [Δ11] AVC log spoofing disabled: CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF,
#       CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING, and CONFIG_KSU_SUSFS_AVC_LOG_SPOOF
#       switched from set_cfg to unset_cfg in Step 13. Eliminates SELinux
#       denial log suppression, which can mask genuine A16 vendor HAL AVC
#       denials that need investigation during bring-up on EvoX 11.8.
# [Δ12] A16 QPR2 / Evolution X 11.8 defconfig tuning block added (Step 13).
#       Strictly 4.9 BSP-safe. See inline comments for each symbol group.
#       Includes guarded LRU_GEN probe (no-op on stock Samsung 4.9 BSP).
# [Δ13] SUSFS downgraded from v2.1.0 to v1.5.5.
#       SUSFS_TARGET_VERSION env changed to "1.5.5". susfs_ref input default
#       set to "kernel-4.9" (the stable 4.9 branch of simonpunk/susfs4ksu).
#       Pin to exact v1.5.5 commit using the susfs_commit input at dispatch
#       time; the Step 4 version check will warn on mismatch without aborting.
#       Steps 8 and 9 are structurally unchanged — the 1.5.5 patch file name
#       (50_add_susfs_in_kernel-4.9.patch) and all kernel-tree source paths
#       (fs/susfs.c, fs/sus_su.c, include/linux/susfs*.h) are identical to
#       the 2.x layout. No path surgery or logic changes were required.
#       NOTE: SUSFS 1.5.5 does NOT export CONFIG_KSU_SUSFS_SUS_MAP,
#       CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL, or CONFIG_KSU_SUSFS_SPOOF_SELINUX
#       from its Kconfig; these symbols are guarded by source-tree probes in
#       Step 13 to prevent silent defconfig pollution on 1.5.5 trees.
# [Δ14] Branding updated to Mk7e: BRAND="-Chimera_Mk7e". All uname preview
#       strings, artifact names, step names, and release body updated
#       throughout to reflect "Linux version 4.9.337-Chimera_Mk7e".
# ───────────────────────────────────────────────────────────────────────────────
# A16 QPR2 "Safe-Boot" refactor (this revision)
# [Δ15] KSU source switched from KernelSU-Next/KernelSU-Next@legacy-susfs to
#       sidex15/KernelSU-Next@legacy-susfs-v2. ksu_repo/ksu_ref input
#       defaults and the Step 5 in-tree fallback ref are updated together so
#       a workflow_dispatch run with no overrides clones sidex15's
#       legacy-susfs-v2 tree. No other Step 5 logic changes — the clone/
#       checkout/Kconfig-probe/symlink flow is fully input-driven and was
#       already generic.
# [Δ16] AVC/SELinux spoof — HARD-DISABLED for A16 QPR2. A16's SELinux policy
#       loader was panicking on boot because it detected an active SELinux
#       identity spoof during early policy load. Step 13 previously set
#       CONFIG_KSU_SUSFS_SPOOF_SELINUX=y conditionally (via a Kconfig probe,
#       for SUSFS 2.x+ trees that export the symbol). That conditional SET
#       is now an UNCONDITIONAL unset_cfg call — the symbol is written as
#       "# CONFIG_KSU_SUSFS_SPOOF_SELINUX is not set" regardless of whether
#       the checked-out SUSFS Kconfig defines it, so no SUSFS-tree variation
#       can re-enable it. CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF (and its
#       sibling _SPOOFING / AVC_LOG_SPOOF symbols, already unset since Δ11)
#       remain hard-unset for the same reason — AVC log spoofing and the
#       SELinux identity spoof are part of the same "hide root" surface that
#       trips A16's policy-load integrity checks. All three are now
#       documented together as the Safe-Boot AVC/SELinux spoof block.
# [Δ17] A16 QPR2 boot-essential defconfig additions + diagnostics:
#       - CONFIG_NET_CLS_BPF=y added to the BPF Subsystem block (Step 13),
#         alongside the existing CONFIG_BPF_SYSCALL / CONFIG_CGROUP_BPF.
#         CONFIG_FUSE_FS, CONFIG_OVERLAY_FS, CONFIG_ANDROID_BINDER_IPC, and
#         CONFIG_ANDROID_BINDERFS were already enabled by [Δ12] and are
#         unchanged — verified still present/enabled for A16 QPR2.
#       - New Step 17b ("Diagnostic — print SUSFS and Binder CONFIG values")
#         greps the post-build $OUT_DIR/.config for the SUSFS feature set,
#         the [Δ16] spoof-disable symbols, Binder device-node config, and
#         the BPF/FUSE/OverlayFS symbols, writing them to
#         logs/safeboot-config-verify.log (uploaded with the existing
#         "Upload logs" artifact) so the active config can be inspected
#         directly in the CI run without downloading kernel-out/.config.
# ═══════════════════════════════════════════════════════════════════════════════
name: >-
  Project Chimera Mk7e — LOS/AOSP Android 15/16 QPR2 / Exynos 9810 (star2lte) -
  AOSP Clang 21.0 v6
'on':
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate only — skip build and package
        required: false
        type: boolean
        default: true
      do_release:
        description: Create a GitHub Release after successful build
        required: false
        type: boolean
        default: false
      force_repatch:
        description: Force re-apply KSU/SUSFS even if already present in tree
        required: false
        type: boolean
        default: false
      ksu_repo:
        description: KernelSU git URL (https only)
        required: false
        type: string
        default: 'https://github.com/sidex15/KernelSU-Next.git'
      ksu_ref:
        description: KernelSU branch/tag/ref
        required: false
        type: string
        default: legacy-susfs-v2
      ksu_commit:
        description: KernelSU exact commit SHA (leave blank to track ref tip)
        required: false
        type: string
        default: ''
      susfs_repo:
        description: SUSFS git URL (https only)
        required: false
        type: string
        default: 'https://gitlab.com/simonpunk/susfs4ksu.git'
      susfs_ref:
        description: SUSFS branch/tag/ref (kernel-4.9 branch targets v1.5.5 when pinned)
        required: false
        type: string
        default: kernel-4.9
      susfs_commit:
        description: SUSFS exact commit SHA for v1.5.5 pin (leave blank to track ref tip)
        required: false
        type: string
        default: ''
      brand:
        description: >-
          LOCALVERSION suffix (must start with '-'), e.g. -19611906 or
          -Chimera_Mk7e
        required: false
        type: string
        default: '-19611906'
      build_user:
        description: 'KBUILD_BUILD_USER — uname ''(user@host)'' left side, e.g. dpi'
        required: false
        type: string
        default: dpi
      build_host:
        description: 'KBUILD_BUILD_HOST — uname ''(user@host)'' right side, e.g. SWDD5605'
        required: false
        type: string
        default: SWDD5605
permissions:
  contents: write
jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk7e LOS/AOSP Android 15/16 QPR2
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      KERNEL_REPO: 'https://github.com/royd-jpg/Project_Chimera'
      KERNEL_BRANCH: chimera-mk6l
      SUSFS_TARGET_VERSION: 1.5.5
      KERNEL_DIR: kernel
      OUT_DIR: kernel-out
      LOG_DIR: logs
      AOSP_KEY: aosp-clang-r563880c-ubuntu-24.04-v1
      DEFCONFIG: arch/arm64/configs/exynos9810-star2lte_defconfig
      BRAND: '${{ inputs.brand }}'
      BUILD_USER: '${{ inputs.build_user }}'
      BUILD_HOST: '${{ inputs.build_host }}'
    steps:
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"
          # [Δ19] LOCALVERSION must start with '-' or kbuild concatenates it
          # directly onto the version number with no separator.
          [[ "$BRAND" == -* ]] \
            || { echo "ERROR: brand input must start with '-' (got: $BRAND)"; exit 1; }
          [[ -n "$BUILD_USER" && -n "$BUILD_HOST" ]] \
            || { echo "ERROR: build_user/build_host must not be empty"; exit 1; }
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "dry_run=${{ inputs.dry_run }}"
            echo "do_release=${{ inputs.do_release }}"
            echo "force_repatch=${{ inputs.force_repatch }}"
            echo "ksu_repo=${{ inputs.ksu_repo }}"
            echo "ksu_ref=${{ inputs.ksu_ref }}"
            echo "brand=$BRAND"
            echo "build_user=$BUILD_USER"
            echo "build_host=$BUILD_HOST"
            echo "uname_preview=Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST})"
          } | tee "$LOG_DIR/build-inputs.log"
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 \
            libssl-dev libelf-dev build-essential \
            zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Cache AOSP Clang 21.0 r563880c
        id: cache-clang19
        uses: actions/cache@v4
        with:
          path: aosp-clang
          key: '${{ env.AOSP_KEY }}'
      - name: Download AOSP Clang 21.0 r563880c (Tarball)
        if: steps.cache-clang19.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          echo "=== Fetching AOSP Clang r563880c tarball ==="
          mkdir -p aosp-clang
          wget -q \
            -O aosp-clang/clang-r563880c.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
          tar -xzf aosp-clang/clang-r563880c.tar.gz -C aosp-clang
          rm -f aosp-clang/clang-r563880c.tar.gz

          if [[ -x aosp-clang/bin/clang ]]; then
            :
          elif [[ -x aosp-clang/clang-r563880c/bin/clang ]]; then
            mv aosp-clang/clang-r563880c/* aosp-clang/
            rmdir aosp-clang/clang-r563880c
          fi

          test -x aosp-clang/bin/clang \
            || { echo "ERROR: clang binary missing after extract"; exit 1; }
          aosp-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"
      - name: Export Clang 21.0 PATH
        run: |
          echo "$GITHUB_WORKSPACE/aosp-clang/bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          echo "=== Verifying Compiler Binaries ==="
          clang --version
          ld.lld --version
      - name: Clone kernel tree
        run: >
          set -Eeuo pipefail

          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"

          git -C "$KERNEL_DIR" log --oneline -5 | tee
          "$LOG_DIR/kernel-revision.log"

          echo "OK: kernel tree cloned (branch: $KERNEL_BRANCH)"
      - name: Clone SUSFS (kernel-tree files; v1.5.5 pinned)
        run: >
          set -Eeuo pipefail

          SUSFS_URL="${{ inputs.susfs_repo }}"

          SUSFS_REF="${{ inputs.susfs_ref }}"

          SUSFS_COMMIT="${{ inputs.susfs_commit }}"

          [[ "$SUSFS_URL" =~ ^https:// ]] \
            || { echo "ERROR: SUSFS URL must use https://"; exit 1; }
          [[ "$SUSFS_URL" =~ [[:space:]] ]] \
            && { echo "ERROR: SUSFS URL contains whitespace"; exit 1; }
          if [[ -n "$SUSFS_COMMIT" && ! "$SUSFS_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]];
          then
            echo "ERROR: susfs_commit must be a full 40-char SHA"; exit 1
          fi

          git clone --filter=blob:none --no-tags "$SUSFS_URL" susfs4ksu

          if [[ -n "$SUSFS_COMMIT" ]]; then
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT"
            git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          else
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_REF"
            git -C susfs4ksu checkout --detach FETCH_HEAD
          fi

          RESOLVED="$(git -C susfs4ksu rev-parse HEAD)"

          {
            echo "SUSFS_URL=$SUSFS_URL"
            echo "SUSFS_REF=${SUSFS_REF:-none}"
            echo "SUSFS_COMMIT_INPUT=${SUSFS_COMMIT:-none}"
            echo "SUSFS_COMMIT_RESOLVED=$RESOLVED"
          } | tee "$LOG_DIR/susfs-revision.log"

          # [Δ13] Required file layout is identical between SUSFS 1.5.5 and 2.x

          # for the kernel-4.9 branch — same patch filename, same source paths.

          MISSING=0

          for f in \
            "kernel_patches/50_add_susfs_in_kernel-4.9.patch" \
            "kernel_patches/fs/susfs.c" \
            "kernel_patches/fs/sus_su.c" \
            "kernel_patches/include/linux/susfs.h" \
            "kernel_patches/include/linux/susfs_def.h" \
            "kernel_patches/include/linux/sus_su.h"; do
            [[ -f "susfs4ksu/$f" ]] || { echo "ERROR: susfs4ksu/$f missing"; MISSING=1; }
          done

          [[ "$MISSING" -eq 0 ]] || { echo "Aborting: required SUSFS files
          absent"; exit 1; }

          echo "OK: all required SUSFS kernel-tree files present"

          ACTUAL_VER="$(grep -oP 'SUSFS_VERSION\s+"\K[^"]+' \
            susfs4ksu/kernel_patches/include/linux/susfs.h 2>/dev/null || echo 'unknown')"
          echo "SUSFS_ACTUAL_VERSION=$ACTUAL_VER" | tee -a
          "$LOG_DIR/susfs-revision.log"

          if [[ "$ACTUAL_VER" == "$SUSFS_TARGET_VERSION" ]]; then
            echo "OK: SUSFS version confirmed: $ACTUAL_VER (target: $SUSFS_TARGET_VERSION)"
          else
            echo "WARN: SUSFS version is '$ACTUAL_VER', expected '$SUSFS_TARGET_VERSION'"
            echo "      Pin the exact v1.5.5 commit SHA via the susfs_commit input to fix."
            echo "      Continuing — version mismatch is non-fatal."
          fi
      - name: Set up KernelSU-Next (sidex15/legacy-susfs-v2)
        working-directory: kernel
        run: >
          set -Eeuo pipefail

          git rm -r --cached KernelSU-Next 2>/dev/null || true

          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu

          KSU_URL="${{ inputs.ksu_repo }}"

          KSU_REF="${{ inputs.ksu_ref }}"

          KSU_COMMIT="${{ inputs.ksu_commit }}"

          [[ "$KSU_URL" =~ ^https:// ]] \
            || { echo "ERROR: KSU URL must use https://"; exit 1; }
          [[ "$KSU_URL" =~ [[:space:]] ]] \
            && { echo "ERROR: KSU URL contains whitespace"; exit 1; }
          # [Δ15] Fallback ref updated to match new sidex15 default branch

          [[ -n "$KSU_REF" ]] || KSU_REF="legacy-susfs-v2"

          if [[ -n "$KSU_COMMIT" && ! "$KSU_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]];
          then
            echo "ERROR: ksu_commit must be a full 40-char SHA"; exit 1
          fi

          git clone --filter=blob:none --no-tags "$KSU_URL" KernelSU-Next

          if [[ -n "$KSU_COMMIT" ]]; then
            git -C KernelSU-Next fetch --depth=1 origin "$KSU_COMMIT"
            git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
          else
            git -C KernelSU-Next fetch --depth=1 origin "$KSU_REF"
            git -C KernelSU-Next checkout --detach FETCH_HEAD
          fi

          RESOLVED_KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"

          {
            echo "KSU_URL=$KSU_URL"
            echo "KSU_REF=${KSU_REF:-none}"
            echo "KSU_COMMIT_INPUT=${KSU_COMMIT:-none}"
            echo "KSU_COMMIT_RESOLVED=$RESOLVED_KSU_COMMIT"
          } | tee "../$LOG_DIR/ksu-submodule.log"

          test -f KernelSU-Next/kernel/Kconfig \
            || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }
          if grep -qE '^[[:space:]]*config[[:space:]]+KSU_SUSFS'
          KernelSU-Next/kernel/Kconfig; then
            echo "OK: SUSFS confirmed native in KernelSU-Next/kernel/Kconfig"
            echo "KSU_SUSFS_NATIVE=true" >> "$GITHUB_ENV"
          else
            echo "WARN: KernelSU-Next/kernel/Kconfig has no 'config KSU_SUSFS' entry."
            echo "KSU_SUSFS_NATIVE=false" >> "$GITHUB_ENV"
          fi

          git -C KernelSU-Next log --oneline -1 | tee -a
          "../$LOG_DIR/ksu-submodule.log"

          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

          test -f drivers/kernelsu/Kconfig \
            || { echo "ERROR: drivers/kernelsu/Kconfig symlink broken"; exit 1; }
          echo "OK: KernelSU-Next wired at drivers/kernelsu"
      - name: Fix syscall_fn_t typedef (Samsung 4.9 BSP pointer-type fix)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"
          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            echo "INFO: syscall_fn_t — nothing to fix"; exit 0
          fi
          printf '%s\n' \
            'from pathlib import Path' \
            'import re' \
            'path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")' \
            'if not path.exists(): raise SystemExit(0)' \
            'content = path.read_text()' \
            'typedef = (' \
            '    "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\n"' \
            '    "typedef long (*syscall_fn_t)(\n"' \
            '    "    unsigned long, unsigned long, unsigned long,\n"' \
            '    "    unsigned long, unsigned long, unsigned long\n"' \
            '    ");\n\n"' \
            ')' \
            'pos = 0' \
            'for m in re.finditer(r"^#(include|pragma|ifndef|define)[^\n]*\n", content, re.MULTILINE):' \
            '    pos = m.end()' \
            'if "typedef long (*syscall_fn_t)" not in content:' \
            '    path.write_text(content[:pos] + typedef + content[pos:])' \
            '    print("OK: syscall_fn_t typedef injected")' \
            'else:' \
            '    print("OK: syscall_fn_t already present (idempotent)")' \
            > /tmp/fix_syscall_fn_t.py
          python3 /tmp/fix_syscall_fn_t.py
      - name: Apply Manual Kernel Patches
        working-directory: kernel
        run: >
          set -Eeuo pipefail


          # 1. Disable the KSU-Next Kbuild auto-patcher

          # This prevents KSU from trying to inject its own path_umount logic

          sed -i '/ifneq ($(shell grep -Eq "^int path_umount"/,/endif/c\#
          KSU_NEXT auto-patcher disabled' KernelSU-Next/kernel/Kbuild


          # 2. Verify/Inject declaration into fs/internal.h

          # Only add the declaration if it's not already there

          if ! grep -q "extern int path_umount" fs/internal.h; then
              sed -i '/extern void __init mnt_init(void);/a extern int path_umount(struct path *path, int flags);' fs/internal.h
              echo "Surgery: Declared path_umount in fs/internal.h"
          else
              echo "Surgery: path_umount already declared in fs/internal.h"
          fi


          # 3. Skip appending to fs/namespace.c

          # The diagnostic confirmed it already exists at line 2022.

          echo "Surgery: path_umount already exists in fs/namespace.c.
          Skipping."


          echo "Surgery complete: Kbuild patched, internal.h verified."
      - name: 'Diagnostic: su_compat / kernel_umount hook wiring (BRENE)'
        working-directory: kernel
        run: |
          set +e
          LOG="../$LOG_DIR/brene-hook-diagnostic.log"
          {
            echo "════════════════════════════════════════════════════════"
            echo " BRENE su_compat / kernel_umount hook wiring diagnostic"
            echo " KernelSU-Next: ${{ inputs.ksu_repo }} @ ${{ inputs.ksu_ref }}"
            echo "════════════════════════════════════════════════════════"

            echo ""
            echo "── 1. CONFIG_KSU_KPROBES_HOOK in Kconfig (expect: absent or 'n' — manual hook mode) ──"
            grep -RnE 'KSU_KPROBES_HOOK' KernelSU-Next/kernel/Kconfig 2>/dev/null \
              || echo "INFO: CONFIG_KSU_KPROBES_HOOK not found in Kconfig"
            echo "── Our defconfig setting for it ──"
            grep -nE 'KSU_KPROBES_HOOK|KSU_MANUAL_HOOK' "$DEFCONFIG" 2>/dev/null \
              || echo "INFO: no KPROBES_HOOK/MANUAL_HOOK entries in $DEFCONFIG yet (pre-Step-13)"

            echo ""
            echo "── 2. ksu_su_compat_enabled: definition + usage sites ──"
            grep -RnE 'ksu_su_compat_enabled' KernelSU-Next/kernel 2>/dev/null \
              || echo "INFO: ksu_su_compat_enabled not found (su_compat may be a no-op on this fork)"

            echo ""
            echo "── 3. ksu_sucompat_init: definition + call site + guard ──"
            grep -RnE -B2 -A2 'ksu_sucompat_init' KernelSU-Next/kernel 2>/dev/null \
              || echo "INFO: ksu_sucompat_init not found"

            echo ""
            echo "── 4. sucompat.c: kprobe vs manual-hook gating ──"
            if [[ -f KernelSU-Next/kernel/sucompat.c ]]; then
              grep -nE 'CONFIG_KSU_KPROBES_HOOK|CONFIG_KSU_MANUAL_HOOK|register_kprobe|kallsyms_lookup_name' \
                KernelSU-Next/kernel/sucompat.c
            else
              echo "INFO: KernelSU-Next/kernel/sucompat.c not present in this tree"
            fi

            echo ""
            echo "── 5. \"feature set\" / kernel_umount handling in ksud / core_hook ──"
            grep -RnE -i 'kernel_umount|feature.*umount|umount.*feature' \
              KernelSU-Next/kernel KernelSU-Next/userspace 2>/dev/null \
              || echo "INFO: no kernel_umount references found in KernelSU-Next tree"

            echo ""
            echo "── 6. path_umount availability (required by native kernel_umount on <5.9) ──"
            echo "-- in KernelSU-Next tree --"
            grep -RnE 'path_umount' KernelSU-Next 2>/dev/null \
              || echo "INFO: KernelSU-Next does not reference path_umount"
            echo "-- in base kernel fs/namespace.c (this 4.9.337 tree) --"
            if [[ -f fs/namespace.c ]]; then
              grep -nE 'path_umount|SYSCALL_DEFINE2\(umount' fs/namespace.c \
                || echo "INFO: path_umount NOT DEFINED in fs/namespace.c (expected on stock 4.9 — would need backport)"
            else
              echo "INFO: fs/namespace.c not found at expected path"
            fi

            echo ""
            echo "════════════════════════════════════════════════════════"
            echo " Interpretation guide:"
            echo "  - If (1) shows KPROBES_HOOK absent/unset and (4) shows"
            echo "    sucompat.c gated on CONFIG_KSU_KPROBES_HOOK only, then"
            echo "    su_compat toggling is likely a SAFE no-op here."
            echo "  - If (2)/(3) show ksu_su_compat_enabled or"
            echo "    ksu_sucompat_init() reachable WITHOUT a KPROBES_HOOK"
            echo "    guard, su_compat=true from BRENE can activate"
            echo "    kprobe registration on a kernel where kprobes are"
            echo "    known-unstable -> panic risk."
            echo "  - If (6) shows path_umount missing from fs/namespace.c"
            echo "    but KernelSU-Next's kernel_umount path calls it"
            echo "    unconditionally, kernel_umount=true from BRENE is"
            echo "    UNSAFE without backporting path_umount (separate from"
            echo "    the existing CONFIG_KSU_SUSFS_TRY_UMOUNT, which is"
            echo "    SUSFS's own umount mechanism and unaffected)."
            echo "════════════════════════════════════════════════════════"
          } | tee "$LOG"
          true
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/preflight.log"
          echo "=== Preflight — Chimera Mk7e ===" | tee "$LOG"
          git status --short | tee -a "$LOG"
          echo "=== KSU/SUSFS markers ===" | tee -a "$LOG"
          grep -RsnE \
            'KernelSU|kernelsu|CONFIG_KSU|susfs_task_state|ksu_handle_faccessat' \
            fs include kernel arch/arm64/configs 2>/dev/null \
            | tee -a "$LOG" || true
          ALREADY_PATCHED=false
          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi
          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "$LOG"
          if [[ "$ALREADY_PATCHED" == "true" && \
                "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true"  >> "$GITHUB_ENV"
            echo "INFO: tree already has KSU/SUSFS markers — skipping patch application"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi
      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'obj-y += kernelsu/' drivers/Makefile \
            || echo 'obj-y += kernelsu/' >> drivers/Makefile
          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"
          [[ "$COUNT" -eq 1 ]] \
            || { echo "ERROR: Expected 1 Kconfig entry, found $COUNT"; exit 1; }
          echo "OK: KernelSU Kconfig wired (count=$COUNT)"
      - name: Apply SUSFS kernel patch (kernel-tree side only)
        if: '${{ env.SKIP_INTEGRATION == ''false'' }}'
        working-directory: kernel
        run: >
          set -Eeuo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          set +e

          git apply --reject --whitespace=fix "$PATCH" \
            > "../$LOG_DIR/susfs-apply.log" 2>&1
          RC=$?

          set -e

          find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log"
          || true

          echo "Apply RC=$RC" | tee -a "../$LOG_DIR/susfs-apply.log"

          [[ "$RC" -eq 0 ]] \
            && echo "OK: SUSFS kernel patch applied cleanly" \
            || echo "WARN: git apply had conflicts — step 9 will install files directly"
      - name: Guarantee SUSFS kernel-tree files present
        working-directory: kernel
        run: >
          set -Eeuo pipefail

          LOG="../$LOG_DIR/susfs-guarantee.log"

          echo "=== SUSFS file guarantee ===" | tee "$LOG"

          SRC="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"

          for pair in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do
            DST="${pair##*:}"; FROM="$SRC/${pair%%:*}"
            if [[ ! -f "$DST" ]]; then
              install -m 0644 "$FROM" "$DST"
              echo "OK: installed $DST" | tee -a "$LOG"
            else
              echo "INFO: $DST present ($(wc -l < "$DST") lines) — preserved" | tee -a "$LOG"
            fi
          done

          for hdr in \
            "include/linux/susfs.h" \
            "include/linux/susfs_def.h" \
            "include/linux/sus_su.h"; do
            if [[ ! -f "$hdr" ]]; then
              PATCH_SRC="$SRC/$hdr"
              if [[ -f "$PATCH_SRC" ]]; then
                install -m 0644 "$PATCH_SRC" "$hdr"
                echo "OK: installed $hdr" | tee -a "$LOG"
              else
                echo "FAIL: $hdr missing from patch source" | tee -a "$LOG"
              fi
            else
              echo "INFO: $hdr present ($(wc -l < "$hdr") lines) — preserved" | tee -a "$LOG"
            fi
          done

          grep -q 'susfs\.o'  fs/Makefile \
            || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o'  >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile \
            || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile
          sed -i '/ccflags-.*CONFIG_KSU_SUSFS.*selinux/d' fs/Makefile

          echo 'ccflags-$(CONFIG_KSU_SUSFS) += -Isecurity/selinux
          -Isecurity/selinux/include' \
            >> fs/Makefile
          echo "OK: fs/Makefile wired" | tee -a "$LOG"

          FAIL=0

          for f in \
            fs/susfs.c fs/sus_su.c \
            include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h; do
            [[ -f "$f" ]] \
              && echo "OK: $f" | tee -a "$LOG" \
              || { echo "FAIL: $f MISSING" | tee -a "$LOG"; FAIL=1; }
          done

          [[ "$FAIL" -eq 0 ]] \
            || { echo "ERROR: missing SUSFS files"; exit 1; }
      - name: KernelSU Header Surgery
        working-directory: kernel
        run: >
          set -Eeuo pipefail

          mkdir -p include/kernelsu

          # Surgery A — normalize SUSFS include paths

          find include fs -type f \( -name '*.h' -o -name '*.c' \) \
            -exec sed -i \
              -e 's|#include "../../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' \
              -e 's|#include "../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' \
            {} +
          echo "OK [Surgery A]: SUSFS include namespace normalized"

          # Surgery B — export real KernelSU public headers

          printf '%s\n' \
            'import sys' \
            'from pathlib import Path' \
            '' \
            'def export_header(name):' \
            '    matches = [p for p in Path("KernelSU-Next").rglob(name)' \
            '               if "/include/" not in str(p)]' \
            '    dst = Path("include/kernelsu") / name' \
            '    if not matches:' \
            '        print(f"WARN: {name} not found — generating fallback")' \
            '        dst.write_text(f"#pragma once\n/* Auto-generated fallback for {name} */\n")' \
            '        return' \
            '    src = matches[0]' \
            '    content = src.read_text()' \
            '    content = "\n".join(' \
            '        l for l in content.splitlines()' \
            '        if "drivers/kernelsu" not in l and "<kernelsu/" not in l' \
            '    )' \
            '    dst.write_text(content)' \
            '    print(f"OK [Surgery B]: exported {name}")' \
            '' \
            'for h in ("core_hook.h", "kernel_compat.h", "ksu.h", "sucompat.h"):' \
            '    export_header(h)' \
            > /tmp/export_headers.py
          python3 /tmp/export_headers.py

          # Surgery C — kernel-safe ksu.h shim

          printf '%s\n' \
            '#pragma once' \
            '/* Kernel-safe shim for Mk7e — replaces upstream ksu.h */' \
            '#include <linux/types.h>' \
            '#include <linux/cred.h>' \
            '#include <linux/sched.h>' \
            '#include <linux/uaccess.h>' \
            '' \
            'extern const struct cred *ksu_cred;' \
            > include/kernelsu/ksu.h
          echo "OK [Surgery C]: kernel-safe ksu.h installed"

          # Surgery D — ksu_cred extern in shared headers

          for hdr in \
            include/kernelsu/core_hook.h \
            include/kernelsu/kernel_compat.h; do
            if [[ -f "$hdr" ]] && ! grep -q 'ksu_cred' "$hdr"; then
              printf '\nextern const struct cred *ksu_cred;\n' >> "$hdr"
              echo "OK [Surgery D]: ksu_cred added to $hdr"
            fi
          done

          # Validation

          FAIL=0

          for f in \
            include/kernelsu/core_hook.h \
            include/kernelsu/kernel_compat.h \
            include/kernelsu/ksu.h; do
            [[ -f "$f" ]] && echo "OK: $f" || { echo "FAIL: missing $f"; FAIL=1; }
          done

          if grep -R '../../drivers/kernelsu' include fs 2>/dev/null; then
            echo "FAIL: stale relative KernelSU paths remain"; FAIL=1
          fi

          [[ "$FAIL" -eq 0 ]] || { echo "FATAL: KernelSU header surgery failed";
          exit 1; }

          echo "OK: KernelSU header surgery complete"
      - name: Inject SUSFS prctl bridge
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'import re, sys' \
            'from pathlib import Path' \
            'MARKER = "CHIMERA_MK6R9_SUSFS_PRCTL_BRIDGE"' \
            '' \
            'susfs_h   = Path("include/linux/susfs.h")' \
            'susfs_def = Path("include/linux/susfs_def.h")' \
            'if not susfs_h.exists():' \
            '    print("FAIL: include/linux/susfs.h missing"); sys.exit(1)' \
            '' \
            'scan_src = susfs_def.read_text() if susfs_def.exists() else susfs_h.read_text()' \
            'cmd_ids  = re.findall(' \
            '    r"#define\s+(CMD_SUSFS_\w+|SUSFS_CMD_\w+)\s+(0x[0-9a-fA-F]+|\d+)", scan_src)' \
            'if not cmd_ids:' \
            '    print("WARN: no CMD_SUSFS_* constants found — bridge skipped"); sys.exit(0)' \
            '' \
            'vals    = [int(v, 0) for _, v in cmd_ids]' \
            'cmd_min = min(vals); cmd_max = max(vals)' \
            'show_ver_fn  = next(' \
            '    (fn for fn in re.findall(r"(?:int|bool|void)\s+(susfs_\w+)\s*\(", susfs_h.read_text())' \
            '     if "version" in fn.lower()), None)' \
            'show_ver_cmd = next((c for c in cmd_ids if "SHOW_VERSION" in c[0]), None)' \
            'print(f"INFO: cmd range=[{hex(cmd_min)}, {hex(cmd_max)}] ShowVersion={show_ver_cmd}")' \
            '' \
            'dispatch = (' \
            '    f"\tif (option == {show_ver_cmd[1]}) {{\n"' \
            '    f"\t\t{show_ver_fn}((void __user *)arg2); return 0;\n\t}}\n"' \
            '    if (show_ver_cmd and show_ver_fn) else "\t/* show_version not resolved */\n"' \
            ')' \
            'bridge = (' \
            '    f"\n/* Chimera Mk7e SUSFS prctl bridge ({MARKER}) */\n"' \
            '    f"#ifndef {MARKER}\n#define {MARKER} 1\n#ifdef CONFIG_KSU_SUSFS\n"' \
            '    "int ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2,\n"' \
            '    "    unsigned long arg3, unsigned long arg4, unsigned long arg5)\n{\n"' \
            '    + dispatch +' \
            '    "\treturn -EINVAL;\n}\n"' \
            '    "EXPORT_SYMBOL_GPL(ksu_susfs_handle_prctl);\n"' \
            '    f"#endif\n#endif\n"' \
            ')' \
            '' \
            'susfs_c = Path("fs/susfs.c")' \
            'if susfs_c.exists():' \
            '    txt = susfs_c.read_text()' \
            '    if MARKER not in txt:' \
            '        susfs_c.write_text(txt + bridge)' \
            '        print("OK: bridge appended to fs/susfs.c")' \
            '    else:' \
            '        print("OK: bridge already present (idempotent)")' \
            '' \
            'sys_c = Path("kernel/sys.c")' \
            'if not sys_c.exists():' \
            '    print("WARN: kernel/sys.c not found — prctl injection skipped"); sys.exit(0)' \
            'txt = sys_c.read_text(errors="replace")' \
            'if MARKER in txt:' \
            '    print("OK: sys.c already injected (idempotent)"); sys.exit(0)' \
            '' \
            'm = re.search(r"(SYSCALL_DEFINE5\s*\(\s*prctl\b[^{]+\{)", txt, re.DOTALL)' \
            'if not m:' \
            '    print("WARN: SYSCALL_DEFINE5(prctl) not found"); sys.exit(0)' \
            '' \
            'insert_after = m.end()' \
            'logic = re.search(r"\n\s*(error\s*=|switch\s*\(|if\s*\(|return\b)", txt[insert_after:])' \
            'pos = insert_after + (logic.start() if logic else 0)' \
            'snippet = (' \
            '    f"\n\t/* Chimera Mk7e: SUSFS prctl bridge ({MARKER}) */\n"' \
            '    "#ifdef CONFIG_KSU_SUSFS\n"' \
            '    f"\tif ((unsigned long)option >= {hex(cmd_min)}UL &&\n"' \
            '    f"\t    (unsigned long)option <= {hex(cmd_max)}UL) {{\n"' \
            '    "\t\textern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"' \
            '    "\t\t    unsigned long, unsigned long, unsigned long);\n"' \
            '    "\t\tint __r = ksu_susfs_handle_prctl(\n"' \
            '    "\t\t    (unsigned long)option, (unsigned long)arg2,\n"' \
            '    "\t\t    (unsigned long)arg3, (unsigned long)arg4,\n"' \
            '    "\t\t    (unsigned long)arg5);\n"' \
            '    "\t\tif (__r != -EINVAL) return (long)__r;\n"' \
            '    "\t}\n#endif\n"' \
            ')' \
            'sys_c.write_text(txt[:pos] + snippet + txt[pos:])' \
            'print("OK: SUSFS dispatch injected into kernel/sys.c")' \
            '' \
            'DECL_MARKER = MARKER + "_DECL"' \
            'h_text = susfs_h.read_text()' \
            'if DECL_MARKER not in h_text:' \
            '    susfs_h.write_text(h_text + (' \
            '        f"\n#ifndef {DECL_MARKER}\n#define {DECL_MARKER} 1\n"' \
            '        "#ifdef CONFIG_KSU_SUSFS\n"' \
            '        "extern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"' \
            '        "    unsigned long, unsigned long, unsigned long);\n"' \
            '        f"#endif\n#endif\n"' \
            '    ))' \
            '    print("OK: extern declaration added to susfs.h")' \
            'print("Bridge injection complete.")' \
            > /tmp/inject_prctl_bridge.py
          python3 /tmp/inject_prctl_bridge.py
      - name: Inject weak symbol fallbacks into sus_su.c
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'from pathlib import Path' \
            'target = Path("fs/sus_su.c")' \
            'if not target.exists():' \
            '    print("INFO: fs/sus_su.c not found — skipping"); raise SystemExit(0)' \
            'content = target.read_text()' \
            'if "WEAK_SYMBOL_FALLBACK" in content:' \
            '    print("OK: weak fallbacks already present (idempotent)"); raise SystemExit(0)' \
            'fallback = (' \
            '    "\n/* === WEAK_SYMBOL_FALLBACK === */\n"' \
            '    "#include <linux/cred.h>\n"' \
            '    "#include <linux/uidgid.h>\n"' \
            '    "#include <linux/capability.h>\n\n"' \
            '    "#ifndef cap_set_full\n"' \
            '    "#define cap_set_full(c) do { (c) = CAP_FULL_SET; } while (0)\n"' \
            '    "#endif\n\n"' \
            '    "__attribute__((weak)) bool susfs_is_allow_su(void) { return false; }\n\n"' \
            '    "__attribute__((weak)) void ksu_escape_to_root(void) {\n"' \
            '    "    struct cred *nc = prepare_creds();\n"' \
            '    "    if (!nc) return;\n"' \
            '    "    nc->uid   = nc->euid  = nc->suid  = nc->fsuid = GLOBAL_ROOT_UID;\n"' \
            '    "    nc->gid   = nc->egid  = nc->sgid  = nc->fsgid = GLOBAL_ROOT_GID;\n"' \
            '    "    cap_set_full(nc->cap_inheritable);\n"' \
            '    "    cap_set_full(nc->cap_permitted);\n"' \
            '    "    cap_set_full(nc->cap_effective);\n"' \
            '    "    cap_set_full(nc->cap_bset);\n"' \
            '    "    commit_creds(nc);\n}\n"' \
            '    "/* ========================== */\n"' \
            ')' \
            'target.write_text(content + fallback)' \
            'print("OK: weak symbol fallbacks injected into fs/sus_su.c")' \
            > /tmp/inject_weak_fallbacks.py
          python3 /tmp/inject_weak_fallbacks.py
          
      - name: Apply defconfig tuning (FORTe Mode — hardened A16 QPR2 SUSFS profile)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
      
          test -f "$DEFCONFIG" || { echo "ERROR: $DEFCONFIG not found"; exit 1; }
      
          LOG="../$LOG_DIR/defconfig-forte.log"
          : > "$LOG"
      
          # ─────────────────────────────────────────────
          # CORE HELPERS (strict + idempotent)
          # ─────────────────────────────────────────────
          set_cfg() {
            local k="$1"
            local v="$2"
            sed -i "/^${k}=.*/d;/^# ${k} is not set/d" "$DEFCONFIG"
            echo "${k}=${v}" >> "$DEFCONFIG"
          }
      
          unset_cfg() {
            local k="$1"
            sed -i "/^${k}=.*/d;/^# ${k} is not set/d" "$DEFCONFIG"
            echo "# ${k} is not set" >> "$DEFCONFIG"
          }
      
          probe_kconfig() {
            grep -qE "^[[:space:]]*config[[:space:]]+${1#CONFIG_}[[:space:]]*$" \
              KernelSU-Next/kernel/Kconfig 2>/dev/null
          }
      
          echo "=== FORTe Mode: Defconfig tuning start ===" | tee -a "$LOG"
      
          # ─────────────────────────────────────────────
          # SCHEDULER (latency-stable profile)
          # ─────────────────────────────────────────────
          set_cfg CONFIG_PREEMPT y
          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY
      
          unset_cfg CONFIG_HZ_100
          unset_cfg CONFIG_HZ_250
          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300
      
          # ─────────────────────────────────────────────
          # TCP (AOSP-aligned stable throughput)
          # ─────────────────────────────────────────────
          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_TCP_CONG_CUBIC y
      
          sed -i '/CONFIG_DEFAULT_TCP_CONG/d' "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"
      
          # ─────────────────────────────────────────────
          # MEMORY / RUNTIME STABILITY
          # ─────────────────────────────────────────────
          set_cfg CONFIG_SCHED_DEBUG y
          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_CRYPTO_LZ4 y
          set_cfg CONFIG_CRYPTO_LZ4HC y

          # ─────────────────────────────────────────────

          # 🧠 CHIMERA SILENT CORE (defconfig-level gate)
          
          # ─────────────────────────────────────────────
          
          set_cfg CONFIG_PRINTK y
          
          set_cfg CONFIG_PRINTK_SAFE_LOG_BUF y
          
          set_cfg CONFIG_CONSOLE_LOGLEVEL_DEFAULT 3
          
          set_cfg CONFIG_MESSAGE_LOGLEVEL_DEFAULT 3
          
          set_cfg CONFIG_DEFAULT_MESSAGE_LOGLEVEL 3
          
          unset_cfg CONFIG_PRINTK_TIME
          
          unset_cfg CONFIG_PRINTK_CALLER
          
          # IMPORTANT: prevent debug infrastructure build
          
          unset_cfg CONFIG_DYNAMIC_DEBUG
          
          unset_cfg CONFIG_DYNAMIC_DEBUG_CORE
          
          unset_cfg CONFIG_DEBUG_FS
          
          # Reduce log buffer churn
          
          set_cfg CONFIG_LOG_BUF_SHIFT 18
      
          # ─────────────────────────────────────────────
          # CLANG STABILITY LAYER (IMPORTANT FOR 4.9 BSP)
          # ─────────────────────────────────────────────
          unset_cfg CONFIG_CC_STACKPROTECTOR_STRONG
          unset_cfg CONFIG_CC_STACKPROTECTOR_REGULAR
          set_cfg CONFIG_CC_STACKPROTECTOR_NONE y
      
          unset_cfg CONFIG_LOCALVERSION_AUTO
      
          # ─────────────────────────────────────────────
          # A16 QPR2 CORE SUBSYSTEMS (STRICT SET)
          # ─────────────────────────────────────────────
          set_cfg CONFIG_BPF_SYSCALL y
          set_cfg CONFIG_CGROUP_BPF y
          set_cfg CONFIG_NET_CLS_BPF y
      
          set_cfg CONFIG_FUSE_FS y
          set_cfg CONFIG_OVERLAY_FS y
      
          set_cfg CONFIG_ANDROID_BINDER_IPC y
          set_cfg CONFIG_ANDROID_BINDERFS y
      
          sed -i '/CONFIG_ANDROID_BINDER_DEVICES/d' "$DEFCONFIG"
          echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> "$DEFCONFIG"
      
          unset_cfg CONFIG_ANDROID_BINDER_IPC_SELFTEST
      
          set_cfg CONFIG_MEMCG y
          set_cfg CONFIG_MEMCG_SWAP y
          set_cfg CONFIG_PSI y
      
          set_cfg CONFIG_CGROUPS y
          set_cfg CONFIG_CGROUP_SCHED y
          set_cfg CONFIG_FAIR_GROUP_SCHED y
          set_cfg CONFIG_RT_GROUP_SCHED y
      
          set_cfg CONFIG_NET_CLS_CGROUP y
          set_cfg CONFIG_NETFILTER_XT_MATCH_CGROUP y
          set_cfg CONFIG_VETH y
      
          set_cfg CONFIG_IKCONFIG y
          set_cfg CONFIG_IKCONFIG_PROC y
      
          set_cfg CONFIG_PROC_EVENTS y
      
          # ─────────────────────────────────────────────
          # SUSFS SAFE MODE (NO ORPHAN CONFIG GENERATION)
          # ─────────────────────────────────────────────
          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
      
          if probe_kconfig CONFIG_KSU_SUSFS_SUS_MAP; then
            set_cfg CONFIG_KSU_SUSFS_SUS_MAP y
          else
            echo "SKIP: SUS_MAP not present in tree" | tee -a "$LOG"
          fi
      
          if probe_kconfig CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL; then
            set_cfg CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL y
          else
            echo "SKIP: HIDE_MAGISK_EVIL not present" | tee -a "$LOG"
          fi
      
          if probe_kconfig CONFIG_KSU_SUSFS_SPOOF_SELINUX; then
            unset_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX
          fi
      
          # ─────────────────────────────────────────────
          # OPTIONAL LRU GEN (SAFE PROBE ONLY)
          # ─────────────────────────────────────────────
          if grep -qr 'config LRU_GEN' mm/ 2>/dev/null; then
            set_cfg CONFIG_LRU_GEN y
            set_cfg CONFIG_LRU_GEN_ENABLED y
            set_cfg CONFIG_LRU_GEN_STATS y
            echo "INFO: MGLRU enabled" | tee -a "$LOG"
          fi

          # ─────────────────────────────────────────────
          # 🧩 CHIMERA SILENT GATE (Mk7e Kernel Layer - FIXED 4.9 BSP)
          # ─────────────────────────────────────────────
          
          mkdir -p kernel/chimera
          
          cat > kernel/chimera/silent_core.c << 'EOF'
          
          #include <linux/kernel.h>
          #include <linux/sysctl.h>
          #include <linux/init.h>
          #include <linux/printk.h>
          
          /*
           * Chimera Mk7e Silent Gate
           * 0 = normal logging
           * 1 = silent mode (WARN+ERROR only)
           */
          
          int chimera_silent_mode = 1;
          
          /* ───────────────────────────────────────
           * Log filter (numeric printk levels)
           * ─────────────────────────────────────── */
          static int chimera_should_silence(int level)
          {
              /*
               * printk levels:
               * 0 EMERG, 1 ALERT, 2 CRIT, 3 ERR,
               * 4 WARNING, 5 NOTICE, 6 INFO, 7 DEBUG
               */
          
              if (!chimera_silent_mode)
                  return 0;
          
              return level > 4;
          }
          
          /* ───────────────────────────────────────
           * SYSCTL INTERFACE
           * /proc/sys/chimera/silent
           * ─────────────────────────────────────── */
          
          static struct ctl_table chimera_table[] = {
              {
                  .procname     = "silent",
                  .data         = &chimera_silent_mode,
                  .maxlen       = sizeof(int),
                  .mode         = 0644,
                  .proc_handler = proc_dointvec,
              },
              { }
          };
          
          static struct ctl_table chimera_root[] = {
              {
                  .procname = "chimera",
                  .mode     = 0555,
                  .child    = chimera_table,
              },
              { }
          };
          
          static struct ctl_table_header *chimera_hdr;
          
          static int __init chimera_sysctl_init(void)
          {
              /* 4.9-compatible API */
              chimera_hdr = register_sysctl_table(chimera_root);
          
              pr_info("Chimera Mk7e: Silent Gate initialized (mode=%d)\n",
                      chimera_silent_mode);
          
              return 0;
          }
          
          subsys_initcall(chimera_sysctl_init);
          
          EOF
          
          echo "obj-y += chimera/silent_core.o" >> kernel/Makefile
      
          # ─────────────────────────────────────────────
          # FINAL VERIFICATION PASS (minimal noise)
          # ─────────────────────────────────────────────
          echo "=== FORTe Mode: Summary ===" | tee -a "$LOG"
      
          grep -E \
            "^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_PREEMPT|CONFIG_HZ|CONFIG_TCP_CONG|CONFIG_BPF|CONFIG_CGROUP|CONFIG_BINDER|CONFIG_MEMCG|CONFIG_PSI|CONFIG_NET_CLS|CONFIG_FUSE|CONFIG_OVERLAY)" \
            "$DEFCONFIG" | tee -a "$LOG"
      
          echo "=== FORTe Mode complete ===" | tee -a "$LOG"
          
      - name: Apply Samsung-stock-style branding
        working-directory: kernel
        run: >
          set -Eeuo pipefail

          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d'
          "$DEFCONFIG"

          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' \
            "$BRAND" "$BUILD_HOST" >> "$DEFCONFIG"
          # setlocalversion is authoritative on Samsung 4.9 BSP

          printf '#!/bin/sh\nprintf "%%s" "%s"\n' "$BRAND" >
          scripts/setlocalversion

          chmod +x scripts/setlocalversion

          echo "$BRAND" > localversion

          echo "CHIMERA_BRAND=$BRAND"       >> "$GITHUB_ENV"

          echo "KBUILD_HOST=$BUILD_HOST"    >> "$GITHUB_ENV"

          echo "KBUILD_USER=$BUILD_USER"    >> "$GITHUB_ENV"

          {
            echo "BRAND=$BRAND"
            echo "BUILD_USER=$BUILD_USER"
            echo "BUILD_HOST=$BUILD_HOST"
            echo "RUN=${GITHUB_RUN_NUMBER}"
            echo "UNAME_PREVIEW=Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST})"
          } | tee "../$LOG_DIR/branding.env"

          echo "=== setlocalversion ===" | tee "../$LOG_DIR/scm-dirty.log"

          cat scripts/setlocalversion       | tee -a "../$LOG_DIR/scm-dirty.log"

          echo "uname preview: Linux version 4.9.337${BRAND}
          (${BUILD_USER}@${BUILD_HOST})"
      - name: SUSFS pre-build sanity check
        working-directory: kernel
        run: >
          set -Eeuo pipefail

          LOG="../$LOG_DIR/susfs-sanity.log"

          echo "=== SUSFS pre-build sanity — Chimera Mk7e ===" | tee "$LOG"

          FAIL=0

          for f in \
            fs/susfs.c fs/sus_su.c \
            include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h; do
            [[ -f "$f" ]] \
              && echo "OK: $f ($(wc -l < "$f") lines)" | tee -a "$LOG" \
              || { echo "FAIL: $f MISSING" | tee -a "$LOG"; FAIL=1; }
          done

          VER="$(grep -oP 'SUSFS_VERSION\s+"\K[^"]+' include/linux/susfs.h
          2>/dev/null \
                 || echo unknown)"
          echo "SUSFS_VERSION_IN_TREE=$VER (target: $SUSFS_TARGET_VERSION)" |
          tee -a "$LOG"

          if grep -q 'CHIMERA_MK6R9_SUSFS_PRCTL_BRIDGE' kernel/sys.c
          2>/dev/null; then
            echo "OK: prctl bridge present in kernel/sys.c" | tee -a "$LOG"
          else
            echo "WARN: prctl bridge not found in kernel/sys.c" | tee -a "$LOG"
          fi

          if grep -q "^# CONFIG_SECURITY_SELINUX_DEVELOP is not set"
          "$DEFCONFIG"; then
            echo "OK: SELinux DEVELOP unset — enforcing locked" | tee -a "$LOG"
          else
            echo "WARN: CONFIG_SECURITY_SELINUX_DEVELOP may still be set" | tee -a "$LOG"
          fi

          MK="$(cat fs/Makefile)"

          [[ "$MK" == *"susfs.o"*  ]] \
            && echo "OK: fs/Makefile has susfs.o"  | tee -a "$LOG" \
            || { echo "FAIL: fs/Makefile missing susfs.o"  | tee -a "$LOG"; FAIL=1; }
          [[ "$MK" == *"sus_su.o"* ]] \
            && echo "OK: fs/Makefile has sus_su.o" | tee -a "$LOG" \
            || { echo "FAIL: fs/Makefile missing sus_su.o" | tee -a "$LOG"; FAIL=1; }
          # [Δ18] uname preview reflects current Samsung-stock-style branding

          echo "uname preview: Linux version 4.9.337${BRAND}
          (${KBUILD_USER}@${KBUILD_HOST})" \
            | tee -a "$LOG"
          [[ "$FAIL" -eq 0 ]] || { echo "ERROR: sanity check failed"; exit 1; }

          echo "=== Sanity check PASSED ===" | tee -a "$LOG"
      - name: Dry run summary
        if: '${{ inputs.dry_run == true }}'
        run: |
          echo "========================================"
          echo "  Chimera Mk7e — dry run PASSED"
          echo "  Target: LOS/AOSP Android 15/16 QPR2 (Evolution X 11.8)"
          echo "  SUSFS:  v${SUSFS_TARGET_VERSION} @ ${{ inputs.susfs_ref }}"
          echo "  KCFLAGS: -O2 -fcommon -fno-strict-aliasing -Wno-error [Δ9]"
          echo "========================================"
          echo "KSU  : ${{ inputs.ksu_repo }} @ ${{ inputs.ksu_ref }}"
          echo "SUSFS: ${{ inputs.susfs_repo }} @ ${{ inputs.susfs_ref }}"
          echo "Brand: ${BRAND}  User: ${BUILD_USER}@${BUILD_HOST}"
          echo "Re-run with dry_run=false to compile and package."
      - name: Build kernel
        if: '${{ inputs.dry_run == false }}'
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          export PATH="$GITHUB_WORKSPACE/aosp-clang/bin:$PATH"
          export KBUILD_BUILD_USER="$BUILD_USER"
          export KBUILD_BUILD_HOST="$BUILD_HOST"
          export KBUILD_BUILD_VERSION="${GITHUB_RUN_NUMBER:-1}"
          CLANG_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/clang"
          LD_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/ld.lld"
          AR_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-ar"
          NM_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-nm"
          OBJCOPY_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-objcopy"
          OBJDUMP_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-objdump"
          STRIP_BIN="$GITHUB_WORKSPACE/aosp-clang/bin/llvm-strip"
          echo "=== Toolchain sanity ==="
          which clang || true
          "$CLANG_BIN" --version
          MAKE=(
            make -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            LLVM=1
            LLVM_IAS=0
            CC="$CLANG_BIN"
            HOSTCC=gcc
            HOSTCXX=g++
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$LD_BIN"
            AR="$AR_BIN"
            NM="$NM_BIN"
            OBJCOPY="$OBJCOPY_BIN"
            OBJDUMP="$OBJDUMP_BIN"
            STRIP="$STRIP_BIN"
            LOCALVERSION="$BRAND"
            KBUILD_BUILD_USER="$BUILD_USER"
            KBUILD_BUILD_HOST="$BUILD_HOST"
            KCFLAGS="-O2 -fcommon -fno-strict-aliasing -Wno-error"
          )
          echo "=== Applying defconfig ==="
          "${MAKE[@]}" exynos9810-star2lte_defconfig
          cp \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/$LOG_DIR/final.config"
          echo "=== Stack protector verification ==="
          grep -E '^CONFIG_CC_STACKPROTECTOR' \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
          if grep -q '^CONFIG_CC_STACKPROTECTOR_NONE=y' \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config"; then
            echo "OK: stack protector disabled for clang compatibility" \
              | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
          else
            echo "ERROR: stack protector mode not NONE" \
              | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
            exit 1
          fi
          echo "=== Post-merge config verification ==="
          grep -E \
            "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SECURITY_SELINUX_DEVELOP|LOCALVERSION" \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
          echo "=== Building Image + DTBs ==="
          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log
          IMAGE="$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image"
          test -f "$IMAGE" || {
            echo "ERROR: Image not produced — check build.log"
            exit 1
          }
          du -h "$IMAGE" \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"
          echo "=== uname string verification ==="
          strings "$IMAGE" \
            | grep -E "Linux version 4\.9\." \
            | head -3 \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/uname-verify.log" || true
      - name: Diagnostic — print SUSFS and Binder CONFIG values
        if: '${{ inputs.dry_run == false }}'
        run: >
          set -Eeuo pipefail

          CONFIG_FILE="$GITHUB_WORKSPACE/$OUT_DIR/.config"

          DIAG_LOG="$GITHUB_WORKSPACE/$LOG_DIR/safeboot-config-verify.log"

          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found"; exit
          1; }

          {
            echo "════════════════════════════════════════════════════════"
            echo " Chimera Mk7e A16 QPR2 Safe-Boot — Active CONFIG values"
            echo "════════════════════════════════════════════════════════"
            echo ""
            echo "── SUSFS (CONFIG_KSU / CONFIG_KSU_SUSFS_*) ─────────────────"
            grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|# CONFIG_KSU_SUSFS)' "$CONFIG_FILE" || true
            echo ""
            echo "── AVC / SELinux spoof hard-disable [Δ16] ──────────────────"
            grep -E \
              '(CONFIG_KSU_SUSFS_SPOOF_SELINUX|CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF|CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING|CONFIG_KSU_SUSFS_AVC_LOG_SPOOF|CONFIG_SECURITY_SELINUX)' \
              "$CONFIG_FILE" || echo "INFO: no matching SUSFS spoof symbols in .config (expected on SUSFS 1.5.5)"
            echo ""
            echo "── Binder IPC (CONFIG_ANDROID_BINDER*) ─────────────────────"
            grep -E '^(CONFIG_ANDROID_BINDER|# CONFIG_ANDROID_BINDER)' "$CONFIG_FILE" || true
            echo ""
            echo "── BPF / FUSE / OverlayFS (A16 QPR2 boot-essential) ────────"
            grep -E '^(CONFIG_BPF_SYSCALL|CONFIG_CGROUP_BPF|CONFIG_NET_CLS_BPF|CONFIG_FUSE_FS|CONFIG_OVERLAY_FS|# CONFIG_BPF_SYSCALL|# CONFIG_CGROUP_BPF|# CONFIG_NET_CLS_BPF|# CONFIG_FUSE_FS|# CONFIG_OVERLAY_FS)' "$CONFIG_FILE" || true
            echo ""
            echo "════════════════════════════════════════════════════════"
          } | tee "$DIAG_LOG"
      - name: Package flashable zip
        if: '${{ inputs.dry_run == false }}'
        run: >
          set -Eeuo pipefail

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3


          printf '%s\n' \
            "properties() { '" \
            "kernel.string=Project Chimera Mk7e - LOS22/23 A15/16 QPR2 AOSP Clang 21 v6 / Exynos9810 star2lte" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=star2lte" \
            "device.name2=SM-G965F" \
            "device.name3=SM-G965U" \
            "device.name4=SM-G965N" \
            "device.name5=SM-G9650" \
            "'; }" \
            "" \
            "block=/dev/block/platform/11120000.ufs/by-name/BOOT;" \
            "is_slot_device=0;" \
            "ramdisk_compression=auto;" \
            "patch_vbmeta_flag=auto;" \
            "" \
            ". tools/ak3-core.sh;" \
            "" \
            "dump_boot;" \
            "write_boot;" \
            > AnyKernel3/anykernel.sh

          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/

          find "$OUT_DIR/arch/arm64/boot/dts/exynos" -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \; 2>/dev/null \
            || echo "INFO: no star2lte DTBs found"

          mkdir -p AnyKernel3/ramdisk/overlay/system/etc/init.d

          cp "$GITHUB_WORKSPACE/kernel/scripts/chimera_ems_tune.sh" \
            "AnyKernel3/ramdisk/overlay/system/etc/init.d/99chimera_ems" 2>/dev/null \
            || echo "INFO: EMS script not staged — skipping"
          ZIP="chimera-mk7e-AOSPClang21.0-$(date
          +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}.zip"

          ( cd AnyKernel3 && zip -r9 "../$ZIP" . -x '*.git*' )

          test -f "$ZIP" || { echo "ERROR: zip not produced"; exit 1; }

          echo "ZIP=$ZIP" >> "$LOG_DIR/branding.env"

          echo "ZIP_PATH=$ZIP" >> "$GITHUB_ENV"

          echo "OK: flashable zip ready: $ZIP"

          du -h "$ZIP"
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk7e-logs-${{ github.run_number }}'
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload flashable zip
        if: '${{ inputs.dry_run == false }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk7e-AOSPClang21.0-${{ github.run_number }}'
          path: chimera-mk7e-AOSPClang21.0-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        if: '${{ inputs.do_release == true && inputs.dry_run == false }}'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'chimera-mk7e-${{ github.run_number }}'
          name: >-
            Project Chimera Mk7e — LOS/AOSP Android 15/16 QPR2 Build #${{
            github.run_number }}
          body: >
            ## Project Chimera Mk7e — Exynos 9810 / star2lte

            **Base ROM compatibility:** `LOS/AOSP Android 15/16 QPR2 · Evolution
            X 11.8`

            **Kernel Source Base:** `royd-jpg/Project_Chimera @ chimera-mk6l`

            **Toolchain Engine:** AOSP Clang 21.0 — LLVM=1 retained, `-fcommon`
            [Δ8/Δ9]

            **Fix [Δ8]:** Codec2 HIDL video decoder deadlock — `-fno-common` BSS
            aliasing in s5p_mfc / Exynos audio DSP TUs (LLVM=1 + explicit
            `-fcommon` required)

            ### Feature Framework Set

            | Security / Feature Node | Status Config |

            |---|---|

            | **KernelSU-Next Core Engine** | ✅ `sidex15/KernelSU-Next @
            legacy-susfs-v2` [Δ15] |

            | **SUSFS VFS Guard Layer** | ✅ Native Tree Hook v${{
            env.SUSFS_TARGET_VERSION }} [Δ13] |

            | **AVC Log Spoofing** | ❌ Hard-disabled [Δ11/Δ16] — full AVC
            visibility for A16 bring-up |

            | **SELinux Identity Spoof (SPOOF_SELINUX)** | ❌ Hard-disabled [Δ16]
            — A16 SELinux policy-load panic fix |

            | **BPF Syscall + Cgroup BPF + NET_CLS_BPF** | ✅ Enabled [Δ12/Δ17] —
            A16 bpfloader / netd |

            | **FUSE + OverlayFS** | ✅ Enabled [Δ12] — A16 MediaStore + RRO |

            | **Binder (binder/hwbinder/vndbinder)** | ✅ Enabled [Δ12] — A16
            AIDL |

            | **PSI + MEMCG** | ✅ Enabled [Δ12] — A16 LMKD PSI eviction |

            | **Net Cgroup + VETH** | ✅ Enabled [Δ12] — A16 netd traffic control
            |

            | **SUS_MAP / HIDE_MAGISK_EVIL** | ⏭️ Kconfig-gated probe — skipped
            on v1.5.5 [Δ13] |

            | **LRU_GEN (MGLRU)** | ⏭️ Source-tree probe — no-op on 4.9 BSP
            [Δ12] |

            ### Safe-Boot Diagnostics [Δ17]

            Post-build CONFIG verification for SUSFS, AVC/SELinux spoof, Binder,

            and BPF/FUSE/OverlayFS is written to
            `logs/safeboot-config-verify.log`

            (see the "Upload logs" artifact for this run).

            ### uname String [Δ18]

            `Linux version 4.9.337${{ env.BRAND }} (${{ env.BUILD_USER }}@${{
            env.BUILD_HOST }})`

            Samsung-stock-style placeholder — replace
            `BRAND`/`BUILD_USER`/`BUILD_HOST`

            with values from a target firmware to mimic a specific build.

            ### Flash Instructions

            1. Boot into custom recovery (TWRP / OrangeFox)

            2. Flash zip — device check enforces `star2lte` / `SM-G965x`

            3. Wipe cache + dalvik, reboot
          files: '${{ env.ZIP_PATH }}'
