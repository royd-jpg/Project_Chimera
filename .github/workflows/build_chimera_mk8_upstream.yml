# Project Chimera Mk8 — Unified end-to-end kernel build workflow
# Produces a deterministic kernel build for Exynos9810 (star2lte) from chimera-mk8.
# Preserves Chimera-specific DTS, scheduler, defconfig flags, and driver enables.
# Selectively imports upstream-inspired SUSFS/KSU inputs only as build-time sources;
# never merges or rewrites Chimera git history.
#
# Modernization Updates:
#  - Removed legacy LLVM_TOOLS array; migrated to native LLVM=1 LLVM_IAS=1
#  - Implemented CLANG_TRIPLE=aarch64-linux-gnu- for Lineage AOSP compatibility
#  - Retained low-latency -O2 optimizations natively in KCFLAGS

name: Project Chimera Mk8 Unified — Build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: cm8 (runtime SUSFS spoof) or cm8e (compile-time identity)"
        required: true
        type: choice
        options: [cm8, cm8e]
        default: cm8
      toolchain:
        description: "Toolchain: aosp19/aosp20/aosp21/aosp22/neutron19/zyc_stable/clang21-eva-gcc"
        required: true
        type: choice
        options: [aosp19, aosp20, aosp21, aosp22, neutron19, zyc_stable, clang21-eva-gcc]
        default: aosp21
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: false
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS patches even if present"
        required: false
        type: boolean
        default: false
      ksu_repo:
        description: "KernelSU-Next git URL (https only)"
        required: false
        type: string
        default: "https://github.com/gavdoc38/KernelSU-Next.git"
      ksu_commit:
        description: "KernelSU exact commit SHA (pin)"
        required: false
        type: string
        default: "242f245b2c971eb5c1cc4a689e01dcdeaff4c939"
      susfs_repo:
        description: "SUSFS git URL (https only)"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_ref:
        description: "SUSFS branch/tag/ref"
        required: false
        type: string
        default: "kernel-4.9"
      susfs_commit:
        description: "SUSFS exact commit SHA (optional pin)"
        required: false
        type: string
        default: ""
      brand:
        description: "LOCALVERSION suffix (must start with '-')"
        required: false
        type: string
        default: "-Chimera_Mk8_Forte"
      build_user:
        description: "KBUILD_BUILD_USER"
        required: false
        type: string
        default: "_Terminal_Echo"
      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"
      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        required: false
        type: string
        default: "1"
      build_date:
        description: "KBUILD_BUILD_TIMESTAMP (deterministic)"
        required: false
        type: string
        default: "Mon 1 Jan 00:00:00 UTC 2026"

env:
  KERNEL_REPO: "https://github.com/gavdoc38/android_kernel_samsung_exynos9810"
  KERNEL_BRANCH: "lineage-23.2-ksun3-susfs2"
  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"
  SUSFS_TARGET_VERSION: "2.2.0"
  CCACHE_MAXSIZE: "3G"
  BRAND_DEFAULT: "-Chimera_Mk8_Forte"
  BUILD_USER_DEFAULT: "_Terminal_Echo"
  BUILD_HOST_DEFAULT: "AegisDevLabs"
  BUILD_VERSION_DEFAULT: "1"
  KBUILD_BUILD_TIMESTAMP_DEFAULT: "Mon 1 Jan 00:00:00 UTC 2026"

jobs:
  build:
    name: Chimera Mk8 Build — ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash

    steps:

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache flex \
            git libelf-dev libssl-dev lz4 python3 \
            rsync zstd cpio pahole
          python3 --version
          zstd --version | head -1

      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          echo "WS=$GITHUB_WORKSPACE"                             >> "$GITHUB_ENV"
          echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR"              >> "$GITHUB_ENV"
          echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR"              >> "$GITHUB_ENV"
          echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR"        >> "$GITHUB_ENV"
          echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang"       >> "$GITHUB_ENV"

      - name: Resolve build identity (runtime)
        run: |
          set -Eeuo pipefail
          BRAND="${{ inputs.brand }}"
          BRAND="${BRAND:-$BRAND_DEFAULT}"
          if [[ "${BRAND:0:1}" != "-" ]]; then
            echo "ERROR: brand must start with '-' (got: '$BRAND')" >&2
            exit 1
          fi
          BUILD_USER="${{ inputs.build_user }}"
          BUILD_USER="${BUILD_USER:-$BUILD_USER_DEFAULT}"
          BUILD_HOST="${{ inputs.build_host }}"
          BUILD_HOST="${BUILD_HOST:-$BUILD_HOST_DEFAULT}"
          BUILD_VER="${{ inputs.build_version }}"
          BUILD_VER="${BUILD_VER:-$BUILD_VERSION_DEFAULT}"
          BUILD_TS="${{ inputs.build_date }}"
          BUILD_TS="${BUILD_TS:-$KBUILD_BUILD_TIMESTAMP_DEFAULT}"

          echo "BRAND=$BRAND"                         >> "$GITHUB_ENV"
          echo "BUILD_USER=$BUILD_USER"               >> "$GITHUB_ENV"
          echo "BUILD_HOST=$BUILD_HOST"               >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$BUILD_VER"             >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TS"     >> "$GITHUB_ENV"

          echo "profile=${{ inputs.profile }}"        >> "$ABS_LOG/inputs.env"
          echo "toolchain=${{ inputs.toolchain }}"    >> "$ABS_LOG/inputs.env"
          echo "brand=$BRAND"                         >> "$ABS_LOG/inputs.env"
          echo "build_user=$BUILD_USER"               >> "$ABS_LOG/inputs.env"
          echo "build_host=$BUILD_HOST"               >> "$ABS_LOG/inputs.env"
          echo "build_ts=$BUILD_TS"                   >> "$ABS_LOG/inputs.env"
          echo "uname_preview=Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VER} SMP PREEMPT" \
               | tee -a "$ABS_LOG/inputs.env"

      - name: Checkout gavdoc38 kernel repo (lineage-23.2-ksun3-susfs2)
        uses: actions/checkout@v4
        with:
          repository: gavdoc38/android_kernel_samsung_exynos9810
          ref: lineage-23.2-ksun3-susfs2
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 0

      - name: Preflight — verify branch and clean state
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          current_branch=$(git rev-parse --abbrev-ref HEAD || true)
          if [[ "$current_branch" != "lineage-23.2-ksun3-susfs2" ]]; then
            echo "ERROR: expected lineage-23.2-ksun3-susfs2 branch, got '$current_branch'" >&2
            exit 1
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: repository has uncommitted changes; CI requires a clean checkout" >&2
            git status --porcelain
            exit 1
          fi
          BASE_COMMIT=$(git rev-parse HEAD)
          echo "$BASE_COMMIT"              > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"

      - name: Record Chimera reference commit (traceability only)
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          git remote add chimera https://github.com/royd-jpg/Project_Chimera.git || true
          git fetch --no-tags --depth=1 chimera chimera-mk8 || true
          if git rev-parse --verify --quiet chimera/chimera-mk8 >/dev/null 2>&1; then
            CHIMERA_TIP=$(git rev-parse chimera/chimera-mk8)
            echo "$CHIMERA_TIP"                    > "$ABS_LOG/chimera-reference.txt"
            echo "CHIMERA_COMMIT=$CHIMERA_TIP"    >> "$GITHUB_ENV"
          else
            echo "CHIMERA_COMMIT=unknown"          >> "$GITHUB_ENV"
          fi

      - name: Initialise KernelSU-Next submodule
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_COMMIT="${{ inputs.ksu_commit }}"
          KSU_SUB="KernelSU-Next"

          if [[ -n "$KSU_REPO" ]]; then
            git config "submodule.$KSU_SUB.url" "$KSU_REPO"
          fi

          git submodule init "$KSU_SUB"
          git submodule update --depth=1 "$KSU_SUB" || {
            git -C "$KSU_SUB" fetch --no-tags --depth=1 origin "$KSU_COMMIT" || \
            git -C "$KSU_SUB" fetch --no-tags --depth=100 origin "$KSU_COMMIT"
            git -C "$KSU_SUB" checkout --detach "$KSU_COMMIT"
          }

          ACTUAL_KSU=$(git -C "$KSU_SUB" rev-parse HEAD)
          echo "KSU-Next: $ACTUAL_KSU" > "$ABS_LOG/ksu-commit.txt"
          KSU_GIT_VERSION=$(git -C "$KSU_SUB" rev-parse --short HEAD)
          echo "KSU_GIT_VERSION=$KSU_GIT_VERSION" >> "$GITHUB_ENV"

      - name: Prepare SUSFS source
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          SUSFS_REPO="${{ inputs.susfs_repo }}"
          SUSFS_REF="${{ inputs.susfs_ref }}"
          SUSFS_DIR="external/susfs"

          if [[ -z "$SUSFS_REPO" ]]; then
            echo "No SUSFS repo provided; skipping"
            exit 0
          fi

          mkdir -p "$SUSFS_DIR"
          git -C "$SUSFS_DIR" init
          git -C "$SUSFS_DIR" remote add origin "$SUSFS_REPO"
          git -C "$SUSFS_DIR" fetch --no-tags --depth=1 origin "$SUSFS_REF" || \
            git -C "$SUSFS_DIR" fetch --no-tags --depth=100 origin "$SUSFS_REF"
          git -C "$SUSFS_DIR" checkout --detach FETCH_HEAD

          SUSFS_PIN="${{ inputs.susfs_commit }}"
          if [[ -n "$SUSFS_PIN" ]]; then
            git -C "$SUSFS_DIR" fetch --no-tags --depth=1 origin "$SUSFS_PIN" || true
            git -C "$SUSFS_DIR" checkout --detach "$SUSFS_PIN" || true
          fi

      - name: Apply Chimera overlay patches
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          LOG="$ABS_LOG/overlay.log"
          echo "Chimera overlay started at $(date -u)" > "$LOG"

          # Defconfig fragment
          cat > /tmp/chimera.config << 'DEFCFG'
          CONFIG_MFD_MADERA=y
          CONFIG_MFD_MADERA_SPI=y
          CONFIG_MFD_CS47L92=y
          CONFIG_PINCTRL_MADERA=y
          CONFIG_GPIO_MADERA=y
          CONFIG_MFD_CS47L92_GPIO=y
          CONFIG_REGULATOR_MADERA_LDO1=y
          CONFIG_REGULATOR_MADERA_MICSUPP=y
          CONFIG_SND_SOC_CS47L92=y
          CONFIG_EXTCON_MADERA=y
          CONFIG_EXTCON_MADERA_INPUT_EVENT=y
          CONFIG_HZ_300=y
          CONFIG_SCHED_DEBUG=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_CRC32_ARMV8_CRC=y
          CONFIG_NET_ACT_BPF=y
          DEFCFG

          make O="$ABS_OUT" ARCH=arm64 "$(basename "$DEFCONFIG")" >> "$LOG" 2>&1
          scripts/kconfig/merge_config.sh -m -O "$ABS_OUT" "$ABS_OUT/.config" /tmp/chimera.config >> "$LOG" 2>&1

          # Scheduler tuning
          FAIR="kernel/sched/fair.c"
          if grep -q '750000ULL' "$FAIR"; then
            sed -i 's/\(normalized_sysctl_sched_min_granularity\s*=\s*\)750000ULL/\15000000ULL/' "$FAIR"
          fi
          if grep -q '500000UL;' "$FAIR"; then
            sed -i 's/\(sysctl_sched_migration_cost\s*=\s*\)500000UL/\12000000UL/' "$FAIR"
          fi

          # UFC short-circuit
          python3 - << 'PYEOF'
          import re
          with open('drivers/cpufreq/exynos-ufc.c') as f:
              src = f.read()
          pattern = r'(static int __init exynos_ufc_init\(void\)\n\{)'
          replacement = r'\1\n\treturn 0;\n'
          new_src, n = re.subn(pattern, replacement, src, count=1)
          if n == 1:
              with open('drivers/cpufreq/exynos-ufc.c', 'w') as f:
                  f.write(new_src)
          PYEOF

          # proc/base.c SUS_MAP protection
          if ! grep -q 'CONFIG_KSU_SUSFS_SUS_MAP' fs/proc/base.c; then
            python3 - << 'PYEOF'
          import re
          with open('fs/proc/base.c') as f:
              src = f.read()
          decl_anchor = '\tunsigned int flags;\n'
          decl_insert = '\tunsigned int flags;\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\tstruct vm_area_struct *vma;\n#endif\n'
          if decl_anchor in src:
              src = src.replace(decl_anchor, decl_insert, 1)
          loop_anchor = '\t\tsize_t this_len = min_t(size_t, count, PAGE_SIZE);\n\t\tif (write && copy_from_user(page, buf, this_len)) {\n'
          loop_insert = '\t\tsize_t this_len = min_t(size_t, count, PAGE_SIZE);\n#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\t\tvma = find_vma(mm, addr);\n\t\tif (vma && vma->vm_file) {\n\t\t\tstruct inode *inode = file_inode(vma->vm_file);\n\t\t\tif (SUSFS_IS_INODE_SUS_MAP(inode)) {\n\t\t\t\tif (write) {\n\t\t\t\t\tcopied = -EFAULT;\n\t\t\t\t} else {\n\t\t\t\t\tcopied = -EIO;\n\t\t\t\t}\n\t\t\t\tbreak;\n\t\t\t}\n\t\t}\n#endif\n\t\tif (write && copy_from_user(page, buf, this_len)) {\n'
          if loop_anchor in src:
              src = src.replace(loop_anchor, loop_insert, 1)
          with open('fs/proc/base.c', 'w') as f:
              f.write(src)
          PYEOF
          fi

          # fs/namei.c sus_path second check
          if ! grep -q 'Chimera: sus_path second check' fs/namei.c; then
            python3 - << 'PYEOF'
          import re
          with open('fs/namei.c') as f:
              src = f.read()
          existing_block = '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\t\tstruct dentry *dentry = nd->path.dentry;\n\t\tif (dentry->d_inode && susfs_is_inode_sus_path(dentry->d_inode)) {\n\t\t\t// - No need to dput() here\n\t\t\t// - return -ENOENT here since it is walking the sub path of sus path\n\t\t\treturn -ENOENT;\n\t\t}\n#endif'
          replacement_block = '/* Chimera: forward declaration so dentry is visible to second check below */\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\t\tstruct dentry *dentry;\n#endif\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\t\tdentry = nd->path.dentry;\n\t\tif (dentry->d_inode && susfs_is_inode_sus_path(dentry->d_inode)) {\n\t\t\treturn -ENOENT;\n\t\t}\n#endif'
          if existing_block in src:
              src = src.replace(existing_block, replacement_block, 1)
          after_lookup_anchor = '\t\terr = may_lookup(nd);\n\t\tif (err)\n\t\t\treturn err;\n'
          after_lookup_insert = '\t\terr = may_lookup(nd);\n\t\tif (err)\n\t\t\treturn err;\n/* Chimera: sus_path second check — deny sub-path traversal after may_lookup */\n#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n\t\tdentry = nd->path.dentry;\n\t\tif (dentry->d_inode && susfs_is_inode_sus_path(dentry->d_inode)) {\n\t\t\treturn -ENOENT;\n\t\t}\n#endif\n'
          if after_lookup_anchor in src:
              src = src.replace(after_lookup_anchor, after_lookup_insert, 1)
          with open('fs/namei.c', 'w') as f:
              f.write(src)
          PYEOF
          fi

      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail
          TOOLCHAIN="${{ inputs.toolchain }}"

          TC_LABEL=""
          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_LLVM_IAS="1"
          TC_USE_FULL_LLVM="true"
          TC_NEEDS_EVA_GCC="false"
          TC_CROSS_COMPILE="aarch64-linux-gnu-"
          TC_CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          TC_HOSTCC="clang"

          case "$TOOLCHAIN" in
            aosp19)
              TC_LABEL="AOSP Clang 19"
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f60b8b55282f002f594f452ce22dfd6cf1fd7e3c/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            aosp20)
              TC_LABEL="AOSP Clang 20"
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;
            aosp21)
              TC_LABEL="AOSP Clang 21"
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;
            aosp22)
              TC_LABEL="AOSP Clang 22"
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            neutron19)
              TC_LABEL="Neutron Clang"
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;
            zyc_stable)
              TC_LABEL="ZyCromerZ Clang"
              TC_CACHE_KEY="zyc-clang-ubuntu-24.04-v2"
              ZYC_API="https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt"
              TC_URL=$(curl -fsSL "$ZYC_API" || true)
              TC_ARCHIVE_FMT="tar.gz"
              ;;
            *)
              echo "ERROR: unsupported toolchain fallback" >&2
              exit 1
              ;;
          esac

          {
            echo "TC_LABEL=$TC_LABEL"
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_LLVM_IAS=$TC_LLVM_IAS"
            echo "TC_USE_FULL_LLVM=$TC_USE_FULL_LLVM"
            echo "TC_CROSS_COMPILE=$TC_CROSS_COMPILE"
            echo "TC_CROSS_COMPILE_ARM32=$TC_CROSS_COMPILE_ARM32"
            echo "TC_HOSTCC=$TC_HOSTCC"
          } >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=$TC_CACHE_KEY" >> "$GITHUB_OUTPUT"

      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          TC_URL="${{ env.TC_URL }}"
          ARCHIVE_DIR="/tmp"
          ARCHIVE_BASE="clang_archive"
          ARCHIVE="$ARCHIVE_DIR/$ARCHIVE_BASE"

          aria2c -x4 -s4 -q -d "$ARCHIVE_DIR" -o "$ARCHIVE_BASE" "$TC_URL" || wget -O "$ARCHIVE" "$TC_URL"

          rm -rf toolchains/clang
          mkdir -p toolchains/clang

          FMT="${{ env.TC_ARCHIVE_FMT }}"
          case "$FMT" in
            tar.gz|tar) tar -C toolchains/clang -xzf "$ARCHIVE" --strip-components=1 ;;
            tar.xz) tar -C toolchains/clang -xJf "$ARCHIVE" --strip-components=1 ;;
            tar.zst) 
              zstd -d "$ARCHIVE" -o /tmp/clang.tar --force
              tar -C toolchains/clang -xf /tmp/clang.tar --strip-components=1
              ;;
          esac

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ github.sha }}
          restore-keys: |
            chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}
          verbose: 0

      - name: Finalise kernel .config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          ABS_OUT="${{ env.ABS_OUT }}"
          
          # Injecting LLVM=1 to olddefconfig directly natively
          make O="$ABS_OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          if [[ "${{ inputs.profile }}" == "cm8e" ]]; then
            cat >> "$ABS_OUT/.config" << 'CFGEOF'
          CONFIG_SUSFS_SPOOF_UNAME=n
          CONFIG_SUSFS_SPOOF_SELINUX=n
          CONFIG_KSU_SPOOF_AVC_LOG=n
          CFGEOF
            make O="$ABS_OUT" ARCH=arm64 LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          fi
          cp "$ABS_OUT/.config" "$ABS_LOG/config.built"

      - name: Build kernel
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: arm64
          KBUILD_BUILD_USER: "${{ env.BUILD_USER }}"
          KBUILD_BUILD_HOST: "${{ env.BUILD_HOST }}"
          KBUILD_BUILD_VERSION: "${{ env.BUILD_VERSION }}"
          KBUILD_BUILD_TIMESTAMP: "${{ env.KBUILD_BUILD_TIMESTAMP }}"
          KSU_GIT_VERSION: "${{ env.KSU_GIT_VERSION }}"
          CC: "ccache clang"
        run: |
          set -Eeuo pipefail
          ABS_OUT="${{ env.ABS_OUT }}"
          ABS_TC="${{ env.ABS_TC }}"
          
          # Prepend toolchain to strictly enforce clang visibility
          export PATH="$ABS_TC/bin:$PATH"

          JOBS=$(nproc || echo 2)
          echo "Building: O=$ABS_OUT ARCH=arm64 -j$JOBS LLVM=1 toolchain=$(basename $ABS_TC)"

          make O="$ABS_OUT" ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            -j"$JOBS" \
            LOCALVERSION="${{ env.BRAND }}" \
            KCFLAGS="-O2 -fcommon -fno-strict-aliasing -Wno-error" \
            2>&1 | tee "$ABS_LOG/build.log"

          echo "Kernel build completed successfully"

      - name: Smoke test build artifacts
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          set -Eeuo pipefail
          ABS_OUT="${{ env.ABS_OUT }}"
          LOG="$ABS_LOG/smoke.log"
          FAIL=0
          
          check() {
            if [[ "$2" == "OK" ]]; then echo "[OK] $1" >> "$LOG"; else echo "[FAIL] $1" >> "$LOG"; FAIL=1; fi
          }

          [[ -f "$ABS_OUT/arch/arm64/boot/Image" ]] && check "Image present" "OK" || check "Image present" "MISSING"

          [[ $FAIL -eq 0 ]] || { echo "Smoke checks failed" >&2; exit 1; }

      - name: Package artifacts
        if: ${{ inputs.dry_run != 'true' }}
        id: package
        run: |
          set -Eeuo pipefail
          ABS_OUT="${{ env.ABS_OUT }}"
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART_DIR"

          CHIMERA_SHORT="${BASE_COMMIT:0:8}"
          BUILD_TAG="chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-$(date -u +%Y%m%dT%H%M%SZ)-${CHIMERA_SHORT}"

          [[ -f "$ABS_OUT/arch/arm64/boot/Image" ]] && cp "$ABS_OUT/arch/arm64/boot/Image" "$ART_DIR/Image"
          
          TARFILE="$ABS_LOG/${BUILD_TAG}.tar.gz"
          tar --sort=name --mtime='2026-01-01T00:00:00Z' --owner=0 --group=0 -czf "$TARFILE" -C "$ART_DIR" .
          
          echo "artifact_name=${BUILD_TAG}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$TARFILE" >> "$GITHUB_OUTPUT"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"

      - name: Upload build artifact
        if: ${{ inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-kernel-${{ inputs.profile }}-${{ inputs.toolchain }}
          path: ${{ steps.package.outputs.artifact_path }}

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-build-logs-${{ github.run_id }}
          path: ${{ env.ABS_LOG }}/**
