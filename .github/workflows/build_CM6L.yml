name: Project Chimera Mk6 Light — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS even if already present in tree"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk6 Light
    runs-on: ubuntu-24.04

    defaults:  
      run:  
        shell: bash  

    env:  
      # Opt into Node.js 24 ahead of the June 2026 forced migration  
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  

      KERNEL_REPO:   "https://github.com/royd-jpg/Project_Chimera"  
      KERNEL_BRANCH: "chimera-mk6l"  
      SUSFS_REPO:    "https://gitlab.com/simonpunk/susfs4ksu.git"  
      SUSFS_BRANCH:  "kernel-4.9"  
      SUSFS_TARGET_VERSION: "v1.5.12"  
      KERNEL_DIR:    "kernel"  
      OUT_DIR:       "kernel-out"  
      LOG_DIR:       "logs"  
      NEUTRON_URL:   "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"  
      NEUTRON_KEY:   "neutron-clang-10032024-pinned-v1"  
      DEFCONFIG:     "arch/arm64/configs/exynos9810-star2lte_defconfig"  
      BRAND:         "-Chimera_Mk6Light"  

    steps:  

      # ── 0. Workspace ────────────────────────────────────────────────────────  
      - name: Prepare workspace  
        run: |  
          set -Eeuo pipefail  
          mkdir -p "$LOG_DIR" "$OUT_DIR"  
          {  
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"  
            echo "run_number=${GITHUB_RUN_NUMBER}"  
            echo "dry_run=${{ inputs.dry_run }}"  
            echo "do_release=${{ inputs.do_release }}"  
            echo "force_repatch=${{ inputs.force_repatch }}"  
          } | tee "$LOG_DIR/build-inputs.log"  

      # ── 1. Dependencies ─────────────────────────────────────────────────────  
      - name: Install build dependencies  
        run: |  
          set -Eeuo pipefail  
          sudo apt-get update -qq  
          sudo apt-get install -yqq \  
            git curl wget bc flex bison python3 \  
            libssl-dev libelf-dev build-essential \  
            zip unzip zstd lz4 \  
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi  

      # ── 2. Neutron Clang toolchain ───────────────────────────────────────────  
      - name: Cache Neutron Clang  
        id: cache-neutron  
        uses: actions/cache@v4  
        with:  
          path: neutron-clang  
          key: ${{ env.NEUTRON_KEY }}  

      - name: Download Neutron Clang  
        if: steps.cache-neutron.outputs.cache-hit != 'true'  
        run: |  
          set -Eeuo pipefail  
          mkdir -p neutron-clang  
          echo "Downloading: $NEUTRON_URL" | tee "$LOG_DIR/toolchain.log"  
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"  
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1  
          test -x neutron-clang/bin/clang \  
            || { echo "ERROR: clang binary missing after extract"; exit 1; }  
          neutron-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"  

      - name: Export toolchain PATH  
        run: echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"  

      # ── 3. Clone kernel tree ─────────────────────────────────────────────────  
      - name: Clone kernel tree  
        run: |  
          set -Eeuo pipefail  
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"  
          git -C "$KERNEL_DIR" log --oneline -5 | tee "$LOG_DIR/kernel-revision.log"  
          echo "OK: kernel tree cloned (branch: $KERNEL_BRANCH)"  

      # ── 4. Clone SUSFS and verify version ────────────────────────────────────  
      - name: Clone SUSFS and verify version  
        run: |  
          set -Eeuo pipefail  
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu  
          git -C susfs4ksu rev-parse HEAD | tee "$LOG_DIR/susfs-revision.log"  

          for f in \  
            "kernel_patches/50_add_susfs_in_kernel-4.9.patch" \  
            "kernel_patches/fs/susfs.c" \  
            "kernel_patches/fs/sus_su.c" \  
            "kernel_patches/include/linux/susfs.h" \  
            "kernel_patches/include/linux/susfs_def.h" \  
            "kernel_patches/include/linux/sus_su.h"; do  
            test -f "susfs4ksu/$f" \  
              || { echo "ERROR: susfs4ksu/$f missing — aborting"; exit 1; }  
          done  
          echo "OK: all required SUSFS patch files present"  

          ACTUAL_VER="$(grep -oP 'SUSFS_VERSION\s+"\K[^"]+' \  
            susfs4ksu/kernel_patches/include/linux/susfs.h 2>/dev/null || echo 'unknown')"  
          echo "SUSFS_ACTUAL_VERSION=$ACTUAL_VER" | tee -a "$LOG_DIR/susfs-revision.log"  
          if [[ "$ACTUAL_VER" == "$SUSFS_TARGET_VERSION" ]]; then  
            echo "OK: SUSFS version confirmed: $ACTUAL_VER"  
          else  
            echo "WARN: SUSFS version is '$ACTUAL_VER', expected '$SUSFS_TARGET_VERSION'"  
          fi  

      # ── 5. Set up KernelSU-Next ──────────────────────────────────────────────  
      - name: Set up KernelSU-Next (pinned submodule)  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          git rm -r --cached KernelSU-Next 2>/dev/null || true  
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu  

          KSU_URL="$(git config --file .gitmodules submodule.KernelSU-Next.url 2>/dev/null || true)"  
          KSU_COMMIT="$(git ls-tree HEAD KernelSU-Next 2>/dev/null | awk '{print $3}' || true)"  

          if [[ -n "$KSU_URL" && -n "$KSU_COMMIT" ]]; then  
            git clone "$KSU_URL" KernelSU-Next  
            git -C KernelSU-Next checkout "$KSU_COMMIT"  
          elif [[ -n "$KSU_URL" ]]; then  
            git clone --depth=1 "$KSU_URL" KernelSU-Next  
          else  
            echo "WARN: no submodule URL found — falling back to gavdoc38 fork"  
            git clone --depth=1 https://github.com/gavdoc38/KernelSU-Next.git KernelSU-Next  
          fi  

          test -f KernelSU-Next/kernel/Kconfig \  
            || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }  
          
          ln -s ../KernelSU-Next/kernel drivers/kernelsu  
          test -f drivers/kernelsu/Kconfig \  
            || { echo "ERROR: drivers/kernelsu/Kconfig symlink broken"; exit 1; }  
          echo "OK: KernelSU-Next wired at drivers/kernelsu"  

      # ── 5b. Fix syscall_fn_t typedef (Samsung 4.9 BSP) ──────────────────────  
      - name: Fix syscall_fn_t typedef  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"  
          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then  
            echo "INFO: syscall_fn_t — nothing to fix"; exit 0  
          fi  
          python3 - << 'PYEOF'  
          from pathlib import Path  
          import re  
          path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")  
          if not path.exists():  
              raise SystemExit(0)  
          content = path.read_text()  
          typedef = (  
              "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\n"  
              "typedef long (*syscall_fn_t)(\n"  
              "    unsigned long, unsigned long, unsigned long,\n"  
              "    unsigned long, unsigned long, unsigned long\n"  
              ");\n\n"  
          )  
          pos = 0  
          for m in re.finditer(r'^#(include|pragma|ifndef|define)[^\n]*\n', content, re.MULTILINE):  
              pos = m.end()  
          if "typedef long (*syscall_fn_t)" not in content:  
              path.write_text(content[:pos] + typedef + content[pos:])  
              print("OK: syscall_fn_t typedef injected")  
          else:  
              print("OK: syscall_fn_t already present")  
          PYEOF  

      # ── 6. Preflight: detect pre-integrated KSU/SUSFS ───────────────────────  
      - name: Preflight tree state  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          ALREADY_PATCHED=false  
          if grep -RqsE 'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' fs include kernel arch/arm64/configs 2>/dev/null; then  
            ALREADY_PATCHED=true  
          fi  
          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then  
            echo "SKIP_INTEGRATION=true"  >> "$GITHUB_ENV"  
          else  
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"  
          fi  

      # ── 7. Wire KernelSU Kconfig ─────────────────────────────────────────────  
      - name: Wire KernelSU Kconfig  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig  
          if ! grep -q '^endmenu' drivers/Kconfig; then  
            printf '\nendmenu\n' >> drivers/Kconfig  
          fi  
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig  

      # ── 8. Apply SUSFS kernel patch ──────────────────────────────────────────  
      - name: Apply SUSFS kernel patch  
        if: ${{ env.SKIP_INTEGRATION == 'false' }}  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"  
          set +e  
          git apply --reject --whitespace=fix "$PATCH" > "../$LOG_DIR/susfs-apply.log" 2>&1  
          RC=$?  
          set -e  
          if [[ "$RC" -ne 0 ]]; then  
            echo "WARN: git apply had conflicts (RC=$RC); step 9 will install files directly"  
          else  
            echo "OK: SUSFS patch applied cleanly"  
          fi  

      # ── 9. Guarantee all SUSFS files present ────────────────────────────────  
      - name: Guarantee SUSFS files present  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          SRC="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"  
          for pair in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do  
            DST="${pair##*:}"; FROM="$SRC/${pair%%:*}"  
            if [[ ! -f "$DST" ]]; then install -m 0644 "$FROM" "$DST"; fi  
          done  
          for hdr in "include/linux/susfs.h" "include/linux/susfs_def.h" "include/linux/sus_su.h"; do  
            if [[ ! -f "$hdr" && -f "$SRC/$hdr" ]]; then install -m 0644 "$SRC/$hdr" "$hdr"; fi  
          done  
          grep -q 'susfs\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile  
          grep -q 'sus_su\.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile  
          sed -i '/ccflags-.*CONFIG_KSU_SUSFS.*selinux/d' fs/Makefile  
          echo 'ccflags-$(CONFIG_KSU_SUSFS) += -Isecurity/selinux -Isecurity/selinux/include' >> fs/Makefile  

      # ── 10. KernelSU-Next kernel_compat.h shim ───────────────────────────────  
      - name: Create kernel_compat.h shim  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          python3 - << 'PYEOF'  
          from pathlib import Path  
          base = Path("drivers/kernelsu")  
          shim = base / "kernel_compat.h"  
          candidates = [base/"compat"/"kernel_compat.h", base/"hook"/"kernel_compat.h", base/"include"/"kernel_compat.h", base/"ksu"/"kernel_compat.h"]  
          target = next((c for c in candidates if c.exists()), None)  
          if target is None: raise SystemExit(0)  
          rel = target.relative_to(base)  
          if not shim.exists():  
              shim.write_text(f"/* Chimera Mk6 Light: kernel_compat.h shim */\n#include \"{rel.as_posix()}\"\n")  
          PYEOF  

      # ── 11. Inject minimal SUSFS prctl bridge ────────────────────────────────  
      - name: Inject SUSFS prctl bridge  
        working-directory: kernel  
        run: |  
          set -Eeuo pipefail  
          python3 - << 'PYEOF'  
          import re, sys  
          from pathlib import Path  
          MARKER = "CHIMERA_MK6LIGHT_SUSFS_PRCTL_BRIDGE"  
          
          # Read headers
          susfs_h = Path("include/linux/susfs.h")  
          susfs_def = Path("include/linux/susfs_def.h")  
          if not susfs_h.exists(): sys.exit(1)  
          scan_src = susfs_def.read_text() if susfs_def.exists() else susfs_h.read_text()  
          cmd_ids = re.findall(r'#define\s+(CMD_SUSFS_\w+|SUSFS_CMD_\w+)\s+(0x[0-9a-fA-F]+|\d+)', scan_src)  
          
          if not cmd_ids: sys.exit(0)  
          vals = [int(v, 0) for _, v in cmd_ids]  
          cmd_min, cmd_max = min(vals), max(vals)  
          show_ver_fn = next((fn for fn in re.findall(r'(?:int|bool|void)\s+(susfs_\w+)\s*\(', susfs_h.read_text()) if 'version' in fn.lower()), None)  
          show_ver_cmd = next((c for c in cmd_ids if 'SHOW_VERSION' in c[0]), None)  
          
          # Inject fs/susfs.c
          dispatch = f"\tif (option == {show_ver_cmd[1]}) {{\n\t\t{show_ver_fn}((void __user *)arg2); return 0;\n\t}}\n" if (show_ver_cmd and show_ver_fn) else ""  
          bridge = f"\n/* Bridge ({MARKER}) */\n#ifndef {MARKER}\n#define {MARKER} 1\n#ifdef CONFIG_KSU_SUSFS\nint ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2, unsigned long arg3, unsigned long arg4, unsigned long arg5) {{\n{dispatch}\treturn -EINVAL;\n}}\nEXPORT_SYMBOL_GPL(ksu_susfs_handle_prctl);\n#endif\n#endif\n"  
          
          susfs_c = Path("fs/susfs.c")  
          if susfs_c.exists() and MARKER not in susfs_c.read_text():  
              susfs_c.write_text(susfs_c.read_text() + bridge)  
          
          # Inject kernel/sys.c
          sys_c = Path("kernel/sys.c")  
          if not sys_c.exists(): sys.exit(0)  
          txt = sys_c.read_text(errors='replace')  
          if MARKER in txt: sys.exit(0)  
          
          m = re.search(r'(SYSCALL_DEFINE5\s*\(\s*prctl\b[^{]+\{)', txt, re.DOTALL)  
          if not m: sys.exit(0)  
          
          insert_after = m.end()  
          prctl_hook = (  
              f"\n\t/* Chimera Mk6 Light SUSFS bridge ({MARKER}) */\n"  
              f"\t#ifdef CONFIG_KSU_SUSFS\n"  
              f"\textern int ksu_susfs_handle_prctl(unsigned long, unsigned long, unsigned long, unsigned long, unsigned long);\n"  
              f"\tif (option >= {hex(cmd_min)} && option <= {hex(cmd_max)}) {{\n"  
              f"\t\tint ksu_ret = ksu_susfs_handle_prctl(option, arg2, arg3, arg4, arg5);\n"  
              f"\t\tif (ksu_ret == 0) return 0;\n"  
              f"\t}}\n\t#endif\n"  
          )  
          sys_c.write_text(txt[:insert_after] + prctl_hook + txt[insert_after:])  
          print("OK: prctl dispatch injected securely into kernel/sys.c")  
          PYEOF  

      # ── 12. Pre-Compile Stealth Configuration ────────────────────────────────
      - name: Configure Kernel Flags
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          # Enforce lightweight stealth profile directly in defconfig
          cat << 'EOF' >> ${{ env.DEFCONFIG }}
          CONFIG_KSU=y
          CONFIG_KSU_NEXT=y
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS_KSTAT_HOOK=y
          CONFIG_OVERLAY_FS=y
          # CONFIG_SUSFS_OPEN_REDIRECT is not set
          # CONFIG_SUSFS_SUS_MOUNT is not set
          # CONFIG_SUSFS_SPOOF_SELINUX is not set
          # CONFIG_SUSFS_SPOOF_UNAME is not set
          EOF
          
      # ── 13. Compile the Kernel ───────────────────────────────────────────────
      - name: Compile Exynos9810 Kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/neutron-clang/bin:$PATH"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"
          export CC="clang"
          
          # Maintain legacy compiler fallback safety for Samsung 4.9
          export KCFLAGS="-fcommon"
          
          make O=../$OUT_DIR clean
          make O=../$OUT_DIR ${DEFCONFIG##*/}
          make O=../$OUT_DIR -j$(nproc --all) \
               CC="clang" \
               CROSS_COMPILE="aarch64-linux-gnu-" \
               CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

      # ── 14. Package via AnyKernel3 ───────────────────────────────────────────
      - name: Package with AnyKernel3
        if: ${{ inputs.dry_run == false }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel
          
          # Transfer the raw boot image payload
          cp $OUT_DIR/arch/arm64/boot/Image.gz-dtb AnyKernel/Image.gz-dtb
          
          # Adjust AnyKernel3 variables for Samsung S9+ Exynos9810
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel/anykernel.sh
          sed -i 's|block=/dev/block/bootdevice/by-name/boot;|block=/dev/block/platform/11120000.ufs/by-name/BOOT;|g' AnyKernel/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=0;/g' AnyKernel/anykernel.sh
          sed -i 's/keep_fragments=false/keep_fragments=true/g' AnyKernel/anykernel.sh
          
          cd AnyKernel
          zip -r9 ../Chimera-Stealth-star2lte${BRAND}.zip *
          
      # ── 15. Upload Final Artifacts ───────────────────────────────────────────
      - name: Upload Kernel Zip
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: Chimera-Stealth-Kernel-star2lte
          path: Chimera-Stealth-star2lte${BRAND}.zip
