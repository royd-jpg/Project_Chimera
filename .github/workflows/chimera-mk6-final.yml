name: Project Chimera MK6 — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        type: boolean
        default: false
      force_repatch:
        description: "Allow patching even if KSU/SUSFS already present in tree"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO:   "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6"
      SUSFS_REPO:    "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH:  "kernel-4.9"
      KSU_REPO:      "https://github.com/gavdoc38/KernelSU-Next.git"
      KERNEL_DIR:    "kernel"
      OUT_DIR:       "kernel-out"
      LOG_DIR:       "logs"
      # Pinned asset — not "latest" to avoid mutable toolchain
      NEUTRON_URL:   "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY:   "neutron-clang-10032024-pinned-v1"

    steps:
      # ── 0. Workspace ─────────────────────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"

      # ── 1. Dependencies ───────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 \
            libssl-dev libelf-dev build-essential \
            zip zstd lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ── 2. Neutron Clang (pinned, not "latest") ───────────────────────────
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          mkdir -p neutron-clang
          echo "Downloading pinned Neutron Clang: $NEUTRON_URL" | tee "$LOG_DIR/toolchain.log"
          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"
          tar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1
          test -x neutron-clang/bin/clang || { echo "ERROR: clang binary missing after extract"; exit 1; }
          neutron-clang/bin/clang --version | tee -a "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: |
          set -Eeuo pipefail
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ── 3. Clone repos ────────────────────────────────────────────────────
      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log --oneline -3 | tee "$LOG_DIR/kernel-revision.log"

      - name: Clone SUSFS
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" susfs4ksu
          # Verify required patch and source files exist
          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h
          test -f susfs4ksu/kernel_patches/include/linux/susfs_def.h
          git -C susfs4ksu rev-parse HEAD | tee "$LOG_DIR/susfs-revision.log"

      # ── 4. Preflight — detect existing integration ─────────────────────────
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          echo "=== git status ===" | tee "../$LOG_DIR/preflight.log"
          git status --short | tee -a "../$LOG_DIR/preflight.log"

          echo "=== KSU/SUSFS markers ===" | tee -a "../$LOG_DIR/preflight.log"
          grep -RsnE \
            'KernelSU|kernelsu|CONFIG_KSU|KSU_SUSFS|ksu_handle_faccessat|susfs_task_state|susfs_is_inode_sus_path' \
            drivers fs include kernel arch/arm64/configs 2>/dev/null \
            | tee -a "../$LOG_DIR/preflight.log" || true

          ALREADY_PATCHED=false
          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            drivers fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi

          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "../$LOG_DIR/preflight.log"

          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo ""
            echo "INFO: KSU/SUSFS markers already present in chimera-mk6 tree."
            echo "INFO: Skipping re-integration (force_repatch=false)."
            echo "INFO: This is expected — the MK6 branch may already include these."
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ── 4b. Restore KernelSU driver symlink (unconditional) ──────────────
      # The chimera-mk6 branch already contains the Kconfig reference
      #   source "drivers/kernelsu/Kconfig"
      # but KernelSU-Next itself is never committed to the kernel repo —
      # it must always be cloned fresh and the symlink recreated.
      # When SKIP_INTEGRATION=true the integration steps below are all
      # skipped, so without this step kconfig blows up with
      #   "can't open file drivers/kernelsu/Kconfig"
      - name: Restore KernelSU driver symlink
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          # Only act when the Kconfig reference actually exists in the tree
          if ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then
            echo "No drivers/kernelsu/Kconfig reference found — nothing to restore."
            exit 0
          fi

          if [ -d drivers/kernelsu ] || [ -L drivers/kernelsu ]; then
            echo "drivers/kernelsu already present — symlink restore skipped."
            exit 0
          fi

          echo "Kconfig reference found but symlink missing — cloning KernelSU-Next..."
          git clone --depth=1 "$KSU_REPO" KernelSU-Next
          test -f KernelSU-Next/kernel/Kconfig || {
            echo "ERROR: KernelSU-Next/kernel/Kconfig missing after clone"
            exit 1
          }
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          echo "drivers/kernelsu symlink restored." | tee "../$LOG_DIR/ksu-symlink-restore.log"

      # ── 5. KernelSU Next ──────────────────────────────────────────────────
      - name: Integrate KernelSU Next
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          # Clean stale state
          rm -rf KernelSU-Next drivers/kernelsu
          git rm -r --cached KernelSU-Next 2>/dev/null || true
          rm -rf .git/modules/KernelSU-Next

          # Remove stale Kconfig refs
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig
          sed -i '/susfs\/Kconfig/d' fs/Kconfig

          # Clone
          git clone --depth=1 "$KSU_REPO" KernelSU-Next
          test -f KernelSU-Next/kernel/Kconfig || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }

          # Verify hook symbols exist in this fork
          if ! grep -Rqs 'ksu_handle_faccessat\|ksu_handle_execveat' KernelSU-Next/kernel; then
            echo "ERROR: ksu_handle_faccessat not found in gavdoc38/KernelSU-Next — wrong fork?"
            exit 1
          fi
          grep -Rsn 'ksu_handle_faccessat\|ksu_handle_execveat' KernelSU-Next/kernel \
            | tee "../$LOG_DIR/ksu-hooks.log"

          # Wire symlink
          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          # Add to Kconfig cleanly
          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          # Verify — exactly one reference
          COUNT=$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)
          [[ "$COUNT" -eq 1 ]] || { echo "ERROR: Expected 1 KSU Kconfig entry, found $COUNT"; exit 1; }

          echo "KernelSU Next (gavdoc38) integrated." | tee "../$LOG_DIR/ksu-integrate.log"

      # ── 6. SUSFS patch ────────────────────────────────────────────────────
      - name: Apply SUSFS patch
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          # Apply — rejects are expected for Samsung BSP divergence
          set +e
          git apply --reject --whitespace=fix "$PATCH" > "../$LOG_DIR/susfs-apply.log" 2>&1
          APPLY_RC=$?
          set -e

          # Collect reject list
          find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log" || true

          echo "Apply exit code: $APPLY_RC" | tee -a "../$LOG_DIR/susfs-apply.log"
          echo "Reject count: $(wc -l < ../logs/susfs-rejects.log)" \
            | tee -a "../$LOG_DIR/susfs-apply.log"

          # Copy actual SUSFS source files (required regardless of patch success)
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" fs/susfs.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" fs/sus_su.c
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" \
            include/linux/susfs_def.h
          install -m 0644 "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" \
            include/linux/sus_su.h

          # Wire Makefile
          grep -q 'susfs.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

          echo "SUSFS source files installed."

      # ── 7. Fix SUSFS rejected hunks ───────────────────────────────────────
      # Large Python written to a temp file to avoid YAML literal-block
      # indentation conflicts with inline heredoc content at column 0.
      - name: Fix SUSFS rejected hunks
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          cat > /tmp/fix_susfs_hunks.py << 'PYEOF'
          import os, re, sys

          def read(p):
              with open(p, encoding='utf-8', errors='replace') as f:
                  return f.read()

          def write(p, c):
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(c)
              print("  Fixed: " + p)

          def add_include_after(content, anchor, new_block):
              # Idempotent: check first line of new_block
              first = new_block.strip().split('\n')[0].strip()
              if first in content:
                  return content
              pos = content.rfind(anchor)
              if pos == -1:
                  print("  WARN: anchor not found: " + repr(anchor[:60]))
                  return content
              end = content.index('\n', pos) + 1
              return content[:end] + new_block + '\n' + content[end:]

          def insert_before(content, anchor, text):
              if text.strip().split('\n')[0].strip() in content:
                  return content
              pos = content.find(anchor)
              if pos == -1:
                  print("  WARN: anchor not found: " + repr(anchor[:60]))
                  return content
              return content[:pos] + text + content[pos:]

          def insert_after_str(content, anchor, text):
              if text.strip().split('\n')[0].strip() in content:
                  return content
              pos = content.find(anchor)
              if pos == -1:
                  print("  WARN: anchor not found: " + repr(anchor[:60]))
                  return content
              end = pos + len(anchor)
              return content[:end] + text + content[end:]

          # Detect SUSFS API style from copied headers
          susfs_def = read('include/linux/susfs_def.h') if os.path.exists('include/linux/susfs_def.h') else ''
          USE_FUNCTION_API = 'susfs_is_inode_sus_path' in susfs_def
          USE_FIELD_API    = 'INODE_STATE_SUS_PATH' in susfs_def

          print("SUSFS API: function_style=" + str(USE_FUNCTION_API) + " field_style=" + str(USE_FIELD_API))

          # ── fs/namei.c ─────────────────────────────────────────────────
          print("fs/namei.c...")
          c = read('fs/namei.c')
          c = add_include_after(c,
              '#include <asm/uaccess.h>',
              '#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n'
              '#include <linux/susfs_def.h>\n'
              '#endif')
          # Choose hook style based on detected API
          if USE_FUNCTION_API:
              sus_hook = (
                  '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
                  '\tif (!IS_ERR(dentry) && dentry->d_inode &&\n'
                  '\t\tsusfs_is_inode_sus_path(dentry->d_inode)) {\n'
                  '\t\tdput(dentry);\n'
                  '\t\treturn ERR_PTR(-ENOENT);\n'
                  '\t}\n'
                  '#endif\n'
              )
          elif USE_FIELD_API:
              sus_hook = (
                  '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
                  '\tif (!IS_ERR(dentry) && dentry->d_inode &&\n'
                  '\t\tunlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) &&\n'
                  '\t\tlikely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\n'
                  '\t\tdput(dentry);\n'
                  '\t\treturn ERR_PTR(-ENOENT);\n'
                  '\t}\n'
                  '#endif\n'
              )
          else:
              sus_hook = ''
              print("  WARN: Could not determine SUSFS API style for namei.c hook")
          if sus_hook:
              c = insert_before(c, '\nout:\n\tinode_unlock_shared(inode);', sus_hook)
          write('fs/namei.c', c)

          # ── fs/namespace.c ─────────────────────────────────────────────
          print("fs/namespace.c...")
          c = read('fs/namespace.c')
          c = add_include_after(c,
              '#include <linux/task_work.h>',
              '#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n'
              '#include <linux/susfs_def.h>\n'
              '#endif')
          write('fs/namespace.c', c)

          # ── fs/stat.c ──────────────────────────────────────────────────
          print("fs/stat.c...")
          c = read('fs/stat.c')
          c = add_include_after(c,
              '#include <linux/pagemap.h>',
              '#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MOUNT)\n'
              '#include <linux/susfs_def.h>\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n'
              'extern void susfs_sus_ino_for_generic_fillattr(unsigned long ino, struct kstat *stat);\n'
              '#endif')
          if USE_FIELD_API:
              c = insert_before(c,
                  '\tstat->dev = inode->i_sb->s_dev;\n\tstat->ino = inode->i_ino;',
                  '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\n'
                  '\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\n'
                  '\t\tunlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\n'
                  '\t\tsusfs_sus_ino_for_generic_fillattr(inode->i_ino, stat);\n'
                  '\t\tstat->mode  = inode->i_mode;\n'
                  '\t\tstat->rdev  = inode->i_rdev;\n'
                  '\t\tstat->uid   = inode->i_uid;\n'
                  '\t\tstat->gid   = inode->i_gid;\n'
                  '\t\treturn;\n'
                  '\t}\n'
                  '#endif\n')
          write('fs/stat.c', c)

          # ── include/linux/mount.h ──────────────────────────────────────
          print("include/linux/mount.h...")
          c = read('include/linux/mount.h')
          if 'susfs_mnt_id_backup' not in c:
              c = c.replace(
                  '\tint mnt_flags;\n\tvoid *data;\n};',
                  '\tint mnt_flags;\n\tvoid *data;\n'
                  '#ifdef CONFIG_KSU_SUSFS\n\tu64 susfs_mnt_id_backup;\n#endif\n};',
                  1)
          write('include/linux/mount.h', c)

          # ── include/linux/sched.h ──────────────────────────────────────
          print("include/linux/sched.h...")
          c = read('include/linux/sched.h')
          if 'susfs_task_state' not in c:
              c = c.replace(
                  '\tstruct thread_struct thread;',
                  '#ifdef CONFIG_KSU_SUSFS\n\tu32 susfs_task_state;\n#endif\n'
                  '\tstruct thread_struct thread;',
                  1)
          write('include/linux/sched.h', c)

          # ── fs/proc_namespace.c ────────────────────────────────────────
          print("fs/proc_namespace.c...")
          c = read('fs/proc_namespace.c')
          c = add_include_after(c,
              '#include "internal.h"',
              '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
              '#include <linux/susfs_def.h>\n'
              'extern int susfs_sus_mnt_for_show_mountinfo(struct mount *r);\n'
              '#endif')
          write('fs/proc_namespace.c', c)

          # ── fs/readdir.c ───────────────────────────────────────────────
          print("fs/readdir.c...")
          c = read('fs/readdir.c')
          c = add_include_after(c,
              '#include <linux/unistd.h>',
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '#include <linux/susfs_def.h>\n'
              'extern int susfs_sus_ino_for_filldir64(unsigned long ino);\n'
              '#endif')
          write('fs/readdir.c', c)

          # ── fs/proc/task_mmu.c ─────────────────────────────────────────
          print("fs/proc/task_mmu.c...")
          c = read('fs/proc/task_mmu.c')
          c = add_include_after(c,
              '#include <linux/mm_inline.h>',
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAPS\n'
              '#include <linux/susfs_def.h>\n'
              'extern int susfs_sus_ino_for_show_map_vma(unsigned long ino);\n'
              '#endif')
          write('fs/proc/task_mmu.c', c)

          # ── fs/proc/cmdline.c ──────────────────────────────────────────
          print("fs/proc/cmdline.c...")
          c = read('fs/proc/cmdline.c')
          if 'susfs_spoof_cmdline' not in c:
              c = insert_before(c,
                  'static int cmdline_proc_show',
                  '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE\n'
                  'extern void susfs_spoof_cmdline(struct seq_file *m);\n'
                  '#endif\n')
          write('fs/proc/cmdline.c', c)

          print("\nSUSFS rejected-hunk fixup complete.")
          PYEOF
          python3 /tmp/fix_susfs_hunks.py

      # ── 8. Manual KSU hooks (Samsung 4.9 BSP) ────────────────────────────
      # Python written to a temp file to avoid YAML literal-block indentation
      # conflicts. Determines exec hook prototype from cloned KSU source.
      - name: Inject manual KSU hooks
        if: env.SKIP_INTEGRATION == 'false'
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          cat > /tmp/inject_ksu_hooks.py << 'PYEOF'
          import re, os

          def read(p):
              with open(p, encoding='utf-8', errors='replace') as f:
                  return f.read()

          def write(p, c):
              with open(p, 'w', encoding='utf-8') as f:
                  f.write(c)
              print("  Patched: " + p)

          # ── Derive exec hook call site from do_execveat_common signature ─
          # In Samsung 4.9 BSP the hook uses function params, not bprm members.
          # do_execveat_common(int fd, struct filename *filename, ...)
          exec_c = read('fs/exec.c')

          if 'ksu_handle_execveat_sucompat' in exec_c:
              print("fs/exec.c already has KSU hook — skipping")
          else:
              include_end = 0
              for m in re.finditer(r'^#include\s+[<"]', exec_c, re.MULTILINE):
                  include_end = m.end()
              nl = exec_c.index('\n', include_end)

              # Check for do_execveat_common to determine call style
              if 'do_execveat_common' in exec_c:
                  # Use function-parameter style (Samsung 4.9 BSP)
                  extern_decl = (
                      '\nextern void ksu_handle_execveat_sucompat('
                      'int *fd, struct filename **filename_ptr, '
                      'void *argv, void *envp, int *flags);\n'
                  )
                  exec_c = exec_c[:nl+1] + extern_decl + exec_c[nl+1:]

                  # Insert before search_binary_handler using local scope vars
                  # (fd and filename are params of do_execveat_common, not bprm)
                  hook_call = (
                      '\tksu_handle_execveat_sucompat(&fd, (struct filename **)&filename, '
                      '(void *)argv, (void *)envp, &flags);\n\t'
                  )
                  exec_c = exec_c.replace(
                      '\tret = search_binary_handler(bprm);',
                      hook_call + 'ret = search_binary_handler(bprm);',
                      1
                  )
                  write('fs/exec.c', exec_c)
              else:
                  print("WARN: do_execveat_common not found in fs/exec.c — skipping exec hook")

          # ── faccessat hook ─────────────────────────────────────────────
          open_c = read('fs/open.c')

          if 'ksu_handle_faccessat' in open_c:
              print("fs/open.c already has KSU hook — skipping")
          else:
              include_end = 0
              for m in re.finditer(r'^#include\s+[<"]', open_c, re.MULTILINE):
                  include_end = m.end()
              nl = open_c.index('\n', include_end)

              extern_decl = (
                  '\nextern int ksu_handle_faccessat('
                  'int *dfd, const char __user **filename_user, int *mode, int *flags);\n'
              )
              open_c = open_c[:nl+1] + extern_decl + open_c[nl+1:]

              pattern = r'(SYSCALL_DEFINE3\(faccessat,\s*int,\s*dfd,.*?int,\s*mode\)\s*\{)'
              open_c = re.sub(
                  pattern,
                  lambda m: m.group(1) + '\n\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);',
                  open_c, count=1, flags=re.DOTALL
              )
              write('fs/open.c', open_c)

          print("KSU manual hooks done.")
          PYEOF
          python3 /tmp/inject_ksu_hooks.py

      # ── 9. Makefile + defconfig ───────────────────────────────────────────
      - name: Patch Makefile and defconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          # ── Clang 19 Makefile fixes ──────────────────────────────────────
          sed -i 's/-std=gnu89/-std=gnu11 -fcommon/g' Makefile
          sed -i 's/^HOSTCFLAGS[[:space:]]*:=.*/HOSTCFLAGS   := -std=gnu11 -fcommon/' Makefile

          # Warning suppressions — inserted after last -std= line
          END_LINE=$(grep -n '^\s*-std=gnu' Makefile | tail -1 | cut -d: -f1)
          if [[ -n "$END_LINE" ]]; then
            sed -i "${END_LINE}a KBUILD_CFLAGS += -Wno-address-of-packed-member -Wno-int-in-bool-context -Wno-asm-operand-widths" \
              Makefile
          fi

          # ── SchedUtil constants (idempotent) ─────────────────────────────
          SCHED_FILE="kernel/sched/cpufreq_schedutil.c"
          if ! grep -q 'CHIMERA_DEFINED' "$SCHED_FILE"; then
            cat > /tmp/sched_inject.py << 'PYEOF'
          import sys
          target = sys.argv[1]
          with open(target, encoding='utf-8', errors='replace') as f:
              content = f.read()
          block = (
              '/* Project Chimera: High-Response Scheduler Tunables */\n'
              '#ifndef CHIMERA_DEFINED\n'
              '#define CHIMERA_DEFINED\n'
              '#define CHIMERA_UP_RATE_LIMIT   500\n'
              '#define CHIMERA_DOWN_RATE_LIMIT 2000\n'
              '#endif\n'
          )
          if 'CHIMERA_DEFINED' not in content:
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(block + content)
              print("SchedUtil constants injected")
          else:
              print("SchedUtil constants already present")
          PYEOF
            python3 /tmp/sched_inject.py "$SCHED_FILE"
          fi

          # ── Defconfig normalization ───────────────────────────────────────
          F="arch/arm64/configs/exynos9810-star2lte_defconfig"
          test -f "$F"

          # Remove-then-set: avoids contradictory duplicate symbols
          set_cfg() {
            local key="$1" val="$2"
            sed -i "/^${key}[=[:space:]].*/d" "$F"
            sed -i "/^# ${key} is not set/d" "$F"
            echo "${key}=${val}" >> "$F"
          }
          unset_cfg() {
            local key="$1"
            sed -i "/^${key}[=[:space:]].*/d" "$F"
            sed -i "/^# ${key} is not set/d" "$F"
            echo "# ${key} is not set" >> "$F"
          }

          # Timer — remove ALL HZ variants first to avoid contradictions
          for hz in CONFIG_HZ_100 CONFIG_HZ_250 CONFIG_HZ_300 CONFIG_HZ_1000 CONFIG_HZ; do
            sed -i "/^${hz}[=[:space:]].*/d" "$F"
            sed -i "/^# ${hz} is not set/d" "$F"
          done
          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300

          # Preemption
          set_cfg CONFIG_PREEMPT y

          # KSU
          set_cfg CONFIG_KSU y
          set_cfg CONFIG_KSU_ALLOWLIST_WORKAROUND y
          set_cfg CONFIG_KPROBES y
          set_cfg CONFIG_KPROBE_EVENTS y

          # SUSFS — safe subset only
          # SUS_MOUNT + SPOOF_UNAME cause AVC boot panic on Android 16 QPR2
          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
          set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          set_cfg CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT y
          set_cfg CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT y
          unset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT
          unset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME

          # BPF — required for Android 16 / LOS 23.2
          set_cfg CONFIG_BPF y
          set_cfg CONFIG_BPF_SYSCALL y
          set_cfg CONFIG_BPF_JIT y
          set_cfg CONFIG_BPF_EVENTS y
          set_cfg CONFIG_CGROUP_BPF y

          # CMA
          set_cfg CONFIG_DMA_CMA y
          set_cfg CONFIG_CMA y
          set_cfg CONFIG_CMA_SIZE_MBYTES 768

          # Scheduler
          set_cfg CONFIG_SCHED_LATENCY_NS 500000
          set_cfg CONFIG_SCHED_WAKEUP_GRANULARITY_NS 2000000

          # ZRAM
          set_cfg CONFIG_ZRAM_SIZE_PERCENT 50

          # Crypto — avoid duplicate init_module linker errors
          sed -i 's/^CONFIG_CRYPTO_\(.*\)=m$/CONFIG_CRYPTO_\1=y/' "$F"

          git diff -- "$F" | tee "../$LOG_DIR/defconfig-diff.log"
          echo "Defconfig normalized."

      # ── 10. DTS patches ───────────────────────────────────────────────────
      - name: Patch DTS
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          # Audit confirmed: only .dts files exist — no exynos9810.dtsi
          DTS="arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts"
          test -f "$DTS" || { echo "ERROR: DTS not found: $DTS"; exit 1; }

          # Camera ION heap
          if grep -q 'size = <461373440>;' "$DTS"; then
            sed -i 's/size = <461373440>;/size = <603979776>;/' "$DTS"
            echo "Camera ION heap: 440MB -> 576MB"
          else
            echo "WARN: Camera ION heap anchor not found (may already be patched)"
          fi

          # CPU idle — in the monolithic DTS, not a separate dtsi
          if grep -q 'min-residency-us = <2000>' "$DTS"; then
            sed -i 's/min-residency-us = <2000>/min-residency-us = <400>/' "$DTS"
            echo "CPU idle min-residency tuned"
          else
            echo "WARN: idle residency anchor not found (may already be patched)"
          fi

          git diff -- "$DTS" | tee "../$LOG_DIR/dts-diff.log"

      # ── 11. Patch summary ─────────────────────────────────────────────────
      - name: Patch summary and validation
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          echo "=== git status ===" | tee "../$LOG_DIR/patch-summary.log"
          git status --short | tee -a "../$LOG_DIR/patch-summary.log"

          echo "=== diff stat ===" | tee -a "../$LOG_DIR/patch-summary.log"
          git diff --stat | tee -a "../$LOG_DIR/patch-summary.log"

          # Verify BPF not accidentally disabled
          F="arch/arm64/configs/exynos9810-star2lte_defconfig"
          for sym in CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_CGROUP_BPF; do
            grep -q "^${sym}=y" "$F" || { echo "ERROR: $sym missing from defconfig"; exit 1; }
          done
          echo "BPF symbols verified." | tee -a "../$LOG_DIR/patch-summary.log"

          # Verify panic-causing options are disabled
          for sym in CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SPOOF_UNAME; do
            if grep -q "^${sym}=y" "$F"; then
              echo "ERROR: $sym is enabled — this causes AVC boot panic on LOS 23.2"
              exit 1
            fi
          done
          echo "Boot-safe SUSFS config verified." | tee -a "../$LOG_DIR/patch-summary.log"

      # ── 12. Stop for dry run ──────────────────────────────────────────────
      - name: Dry run complete
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run finished. Review artifacts in logs/ before running a real build."
          echo "Re-run with dry_run=false when ready."

      # ── 13. Build ─────────────────────────────────────────────────────────
      - name: Build kernel
        if: ${{ !inputs.dry_run }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

          MAKE=(
            make
            -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            LD="$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld"
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            KCFLAGS="-fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type"
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig
          cp "$GITHUB_WORKSPACE/$OUT_DIR/.config" "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log

          test -f "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" || {
            echo "ERROR: Image not produced — check build.log"
            exit 1
          }
          du -h "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image" \
            | tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"

      # ── 14. Package ───────────────────────────────────────────────────────
      - name: Package flashable zip
        if: ${{ !inputs.dry_run }}
        run: |
          set -Eeuo pipefail

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          # Write anykernel.sh via bash heredoc (avoids Python/YAML quoting conflicts)
          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          properties() { '
          kernel.string=Project Chimera MK6 - Lineage 23.2 / star2lte
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star2lte
          device.name2=SM-G965F
          device.name3=SM-G965U
          device.name4=SM-G965N
          device.name5=SM-G9650
          '; }
          block=boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          AKEOF
          echo "anykernel.sh written"

          # Copy Image (Samsung uses raw Image, not Image.gz)
          cp "$OUT_DIR/arch/arm64/boot/Image" AnyKernel3/
          test -f AnyKernel3/Image || { echo "ERROR: Image missing from AnyKernel3"; exit 1; }

          # Copy only star2lte DTBs (not all Exynos DTBs)
          find "$OUT_DIR/arch/arm64/boot/dts/exynos" \
            -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \;

          ZIP="chimera-mk6-lineage23.2-$(date +%Y%m%d-%H%M).zip"
          cd AnyKernel3
          zip -r9 "../$ZIP" . -x '*.git*'
          cd ..

          test -f "$ZIP" || { echo "ERROR: ZIP not produced"; exit 1; }
          ls -lh "$ZIP"

      # ── 15. Upload artifacts (always) ─────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-logs-${{ github.run_number }}
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload flashable zip
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk6-${{ github.run_number }}
          path: chimera-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run && inputs.do_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6-${{ github.run_number }}
          name: "Project Chimera MK6 — Lineage 23.2 Build #${{ github.run_number }}"
          body: |
            ## Project Chimera MK6 — Exynos 9810 / star2lte
            Base: Project_Chimera @ chimera-mk6 (UV + BT hardening included)

            ### Integrated
            - KernelSU Next (gavdoc38 fork, manual hooks for Samsung 4.9 BSP)
            - SUSFS safe config (SUS_MOUNT + SPOOF_UNAME disabled — no boot panic)
            - BPF preserved (required for Android 16 / LOS 23.2)
            - SchedUtil: UP=500us, DOWN=2000us
            - Camera ION heap: 576MB (face auth for banking)
            - CMA: 768MB
            - HZ_300, PREEMPT

            ### Flash order
            1. Flash Lineage 23.2 + its recovery
            2. Sideload this zip via Lineage recovery
            3. Install KernelSU Next manager APK
            4. Install SUSFS module from KSU Manager
            5. Reboot
          files: chimera-*.zip
