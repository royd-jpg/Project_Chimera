name: 'Project Chimera MK6 — Lineage 23.2 Build'
'on':
    workflow_dispatch:
        inputs:
            dry_run: { description: 'Validate only — skip build and package', type: boolean, default: true }
            do_release: { description: 'Create a GitHub Release after successful build', type: boolean, default: false }
            force_repatch: { description: 'Allow patching even if KSU/SUSFS already present in tree', type: boolean, default: false }
jobs:
    build:
        runs-on: ubuntu-24.04
        defaults:
            run: { shell: bash }
        env:
            KERNEL_REPO: 'https://github.com/royd-jpg/Project_Chimera'
            KERNEL_BRANCH: chimera-mk6
            SUSFS_REPO: 'https://gitlab.com/simonpunk/susfs4ksu.git'
            SUSFS_BRANCH: kernel-4.9
            KSU_REPO: 'https://github.com/gavdoc38/KernelSU-Next.git'
            KERNEL_DIR: kernel
            OUT_DIR: kernel-out
            LOG_DIR: logs
            NEUTRON_URL: 'https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst'
            NEUTRON_KEY: neutron-clang-10032024-pinned-v1
        steps:
            - { name: 'Prepare workspace', run: "set -Eeuo pipefail\nmkdir -p \"$LOG_DIR\" \"$OUT_DIR\"\n" }
            - { name: 'Install dependencies', run: "set -Eeuo pipefail\nsudo apt-get update -qq\nsudo apt-get install -yqq \\\n  git curl wget bc flex bison python3 \\\n  libssl-dev libelf-dev build-essential \\\n  zip zstd lz4 \\\n  gcc-aarch64-linux-gnu \\\n  gcc-arm-linux-gnueabi\n" }
            - { name: 'Cache Neutron Clang', id: cache-neutron, uses: actions/cache@v4, with: { path: neutron-clang, key: '${{ env.NEUTRON_KEY }}' } }
            - { name: 'Download Neutron Clang', if: 'steps.cache-neutron.outputs.cache-hit != ''true''', run: "set -Eeuo pipefail\nmkdir -p neutron-clang\necho \"Downloading pinned Neutron Clang: $NEUTRON_URL\" | tee \"$LOG_DIR/toolchain.log\"\nwget -qO /tmp/neutron.tar.zst \"$NEUTRON_URL\"\ntar -xf /tmp/neutron.tar.zst -C neutron-clang --strip-components=1\ntest -x neutron-clang/bin/clang || { echo \"ERROR: clang binary missing after extract\"; exit 1; }\nneutron-clang/bin/clang --version | tee -a \"$LOG_DIR/toolchain.log\"\n" }
            - { name: 'Export toolchain PATH', run: "set -Eeuo pipefail\necho \"$GITHUB_WORKSPACE/neutron-clang/bin\" >> \"$GITHUB_PATH\"\n" }
            - { name: 'Clone kernel tree', run: "set -Eeuo pipefail\ngit clone --depth=1 -b \"$KERNEL_BRANCH\" \"$KERNEL_REPO\" \"$KERNEL_DIR\"\ngit -C \"$KERNEL_DIR\" log --oneline -3 | tee \"$LOG_DIR/kernel-revision.log\"\n" }
            - { name: 'Clone SUSFS', run: "set -Eeuo pipefail\ngit clone --depth=1 -b \"$SUSFS_BRANCH\" \"$SUSFS_REPO\" susfs4ksu\n# Verify required patch and source files exist\ntest -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch\ntest -f susfs4ksu/kernel_patches/fs/susfs.c\ntest -f susfs4ksu/kernel_patches/include/linux/susfs.h\ntest -f susfs4ksu/kernel_patches/include/linux/susfs_def.h\ngit -C susfs4ksu rev-parse HEAD | tee \"$LOG_DIR/susfs-revision.log\"\n" }
            - { name: 'Preflight tree state', working-directory: kernel, run: "set -Eeuo pipefail\n\necho \"=== git status ===\" | tee \"../$LOG_DIR/preflight.log\"\ngit status --short | tee -a \"../$LOG_DIR/preflight.log\"\n\necho \"=== KSU/SUSFS markers ===\" | tee -a \"../$LOG_DIR/preflight.log\"\ngrep -RsnE \\\n  'KernelSU|kernelsu|CONFIG_KSU|KSU_SUSFS|ksu_handle_faccessat|susfs_task_state|susfs_is_inode_sus_path' \\\n  drivers fs include kernel arch/arm64/configs 2>/dev/null \\\n  | tee -a \"../$LOG_DIR/preflight.log\" || true\n\nALREADY_PATCHED=false\nif grep -RqsE \\\n  'source \"drivers/kernelsu/Kconfig\"|ksu_handle_faccessat|susfs_task_state' \\\n  drivers fs include kernel arch/arm64/configs 2>/dev/null; then\n  ALREADY_PATCHED=true\nfi\n\necho \"ALREADY_PATCHED=$ALREADY_PATCHED\" | tee -a \"../$LOG_DIR/preflight.log\"\n\nif [[ \"$ALREADY_PATCHED\" == \"true\" && \"${{ inputs.force_repatch }}\" != \"true\" ]]; then\n  echo \"\"\n  echo \"INFO: KSU/SUSFS markers already present in chimera-mk6 tree.\"\n  echo \"INFO: Skipping re-integration (force_repatch=false).\"\n  echo \"INFO: This is expected — the MK6 branch may already include these.\"\n  echo \"SKIP_INTEGRATION=true\" >> \"$GITHUB_ENV\"\nelse\n  echo \"SKIP_INTEGRATION=false\" >> \"$GITHUB_ENV\"\nfi\n" }
            - { name: 'Restore KernelSU driver symlink', working-directory: kernel, run: "set -Eeuo pipefail\n\n# Only act when the Kconfig reference actually exists in the tree\nif ! grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig; then\n  echo \"No drivers/kernelsu/Kconfig reference found — nothing to restore.\"\n  exit 0\nfi\n\nif [ -d drivers/kernelsu ] || [ -L drivers/kernelsu ]; then\n  echo \"drivers/kernelsu already present — symlink restore skipped.\"\n  exit 0\nfi\n\necho \"Kconfig reference found but symlink missing — cloning KernelSU-Next...\"\ngit clone --depth=1 \"$KSU_REPO\" KernelSU-Next\ntest -f KernelSU-Next/kernel/Kconfig || {\n  echo \"ERROR: KernelSU-Next/kernel/Kconfig missing after clone\"\n  exit 1\n}\nln -s ../KernelSU-Next/kernel drivers/kernelsu\necho \"drivers/kernelsu symlink restored.\" | tee \"../$LOG_DIR/ksu-symlink-restore.log\"\n" }
            - { name: 'Integrate KernelSU Next', if: 'env.SKIP_INTEGRATION == ''false''', working-directory: kernel, run: "set -Eeuo pipefail\n\n# Clean stale state\nrm -rf KernelSU-Next drivers/kernelsu\ngit rm -r --cached KernelSU-Next 2>/dev/null || true\nrm -rf .git/modules/KernelSU-Next\n\n# Remove stale Kconfig refs\nsed -i '/source \"drivers\\/kernelsu\\/Kconfig\"/d' drivers/Kconfig\nsed -i '/kernelsu\\/Kconfig/d' drivers/Kconfig\nsed -i '/susfs\\/Kconfig/d' fs/Kconfig\n\n# Clone\ngit clone --depth=1 \"$KSU_REPO\" KernelSU-Next\ntest -f KernelSU-Next/kernel/Kconfig || { echo \"ERROR: KernelSU-Next/kernel/Kconfig missing\"; exit 1; }\n\n# Verify hook symbols exist in this fork\nif ! grep -Rqs 'ksu_handle_faccessat\\|ksu_handle_execveat' KernelSU-Next/kernel; then\n  echo \"ERROR: ksu_handle_faccessat not found in gavdoc38/KernelSU-Next — wrong fork?\"\n  exit 1\nfi\ngrep -Rsn 'ksu_handle_faccessat\\|ksu_handle_execveat' KernelSU-Next/kernel \\\n  | tee \"../$LOG_DIR/ksu-hooks.log\"\n\n# Wire symlink\nln -s ../KernelSU-Next/kernel drivers/kernelsu\n\n# Add to Kconfig cleanly\nif ! grep -q '^endmenu' drivers/Kconfig; then\n  printf '\\nendmenu\\n' >> drivers/Kconfig\nfi\nsed -i '/^endmenu/i source \"drivers/kernelsu/Kconfig\"' drivers/Kconfig\n\n# Verify — exactly one reference\nCOUNT=$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)\n[[ \"$COUNT\" -eq 1 ]] || { echo \"ERROR: Expected 1 KSU Kconfig entry, found $COUNT\"; exit 1; }\n\necho \"KernelSU Next (gavdoc38) integrated.\" | tee \"../$LOG_DIR/ksu-integrate.log\"\n" }
            - { name: 'Apply SUSFS patch', if: 'env.SKIP_INTEGRATION == ''false''', working-directory: kernel, run: "set -Eeuo pipefail\n\nPATCH=\"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch\"\n\n# Apply — rejects are expected for Samsung BSP divergence\nset +e\ngit apply --reject --whitespace=fix \"$PATCH\" > \"../$LOG_DIR/susfs-apply.log\" 2>&1\nAPPLY_RC=$?\nset -e\n\n# Collect reject list\nfind . -name '*.rej' -print | sort > \"../$LOG_DIR/susfs-rejects.log\" || true\n\necho \"Apply exit code: $APPLY_RC\" | tee -a \"../$LOG_DIR/susfs-apply.log\"\necho \"Reject count: $(wc -l < ../logs/susfs-rejects.log)\" \\\n  | tee -a \"../$LOG_DIR/susfs-apply.log\"\n\n# Copy actual SUSFS source files (required regardless of patch success)\ninstall -m 0644 \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c\" fs/susfs.c\ninstall -m 0644 \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c\" fs/sus_su.c\ninstall -m 0644 \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h\" \\\n  include/linux/susfs.h\ninstall -m 0644 \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h\" \\\n  include/linux/susfs_def.h\ninstall -m 0644 \"$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h\" \\\n  include/linux/sus_su.h\n\n# Wire Makefile\ngrep -q 'susfs.o' fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile\n\necho \"SUSFS source files installed.\"\n" }
            - { name: 'Fix SUSFS rejected hunks', if: 'env.SKIP_INTEGRATION == ''false''', working-directory: kernel, run: "set -Eeuo pipefail\ncat > /tmp/fix_susfs_hunks.py << 'PYEOF'\nimport os, re, sys\n\ndef read(p):\n    with open(p, encoding='utf-8', errors='replace') as f:\n        return f.read()\n\ndef write(p, c):\n    with open(p, 'w', encoding='utf-8') as f:\n        f.write(c)\n    print(\"  Fixed: \" + p)\n\ndef add_include_after(content, anchor, new_block):\n    # Idempotent: check first line of new_block\n    first = new_block.strip().split('\\n')[0].strip()\n    if first in content:\n        return content\n    pos = content.rfind(anchor)\n    if pos == -1:\n        print(\"  WARN: anchor not found: \" + repr(anchor[:60]))\n        return content\n    end = content.index('\\n', pos) + 1\n    return content[:end] + new_block + '\\n' + content[end:]\n\ndef insert_before(content, anchor, text):\n    if text.strip().split('\\n')[0].strip() in content:\n        return content\n    pos = content.find(anchor)\n    if pos == -1:\n        print(\"  WARN: anchor not found: \" + repr(anchor[:60]))\n        return content\n    return content[:pos] + text + content[pos:]\n\ndef insert_after_str(content, anchor, text):\n    if text.strip().split('\\n')[0].strip() in content:\n        return content\n    pos = content.find(anchor)\n    if pos == -1:\n        print(\"  WARN: anchor not found: \" + repr(anchor[:60]))\n        return content\n    end = pos + len(anchor)\n    return content[:end] + text + content[end:]\n\n# Detect SUSFS API style from copied headers\nsusfs_def = read('include/linux/susfs_def.h') if os.path.exists('include/linux/susfs_def.h') else ''\nUSE_FUNCTION_API = 'susfs_is_inode_sus_path' in susfs_def\nUSE_FIELD_API    = 'INODE_STATE_SUS_PATH' in susfs_def\n\nprint(\"SUSFS API: function_style=\" + str(USE_FUNCTION_API) + \" field_style=\" + str(USE_FIELD_API))\n\n# ── fs/namei.c ─────────────────────────────────────────────────\nprint(\"fs/namei.c...\")\nc = read('fs/namei.c')\nc = add_include_after(c,\n    '#include <asm/uaccess.h>',\n    '#if defined(CONFIG_KSU_SUSFS_SUS_PATH) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\\n'\n    '#include <linux/susfs_def.h>\\n'\n    '#endif')\n# Choose hook style based on detected API\nif USE_FUNCTION_API:\n    sus_hook = (\n        '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\\n'\n        '\\tif (!IS_ERR(dentry) && dentry->d_inode &&\\n'\n        '\\t\\tsusfs_is_inode_sus_path(dentry->d_inode)) {\\n'\n        '\\t\\tdput(dentry);\\n'\n        '\\t\\treturn ERR_PTR(-ENOENT);\\n'\n        '\\t}\\n'\n        '#endif\\n'\n    )\nelif USE_FIELD_API:\n    sus_hook = (\n        '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\\n'\n        '\\tif (!IS_ERR(dentry) && dentry->d_inode &&\\n'\n        '\\t\\tunlikely(dentry->d_inode->i_state & INODE_STATE_SUS_PATH) &&\\n'\n        '\\t\\tlikely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC)) {\\n'\n        '\\t\\tdput(dentry);\\n'\n        '\\t\\treturn ERR_PTR(-ENOENT);\\n'\n        '\\t}\\n'\n        '#endif\\n'\n    )\nelse:\n    sus_hook = ''\n    print(\"  WARN: Could not determine SUSFS API style for namei.c hook\")\nif sus_hook:\n    c = insert_before(c, '\\nout:\\n\\tinode_unlock_shared(inode);', sus_hook)\nwrite('fs/namei.c', c)\n\n# ── fs/namespace.c ─────────────────────────────────────────────\nprint(\"fs/namespace.c...\")\nc = read('fs/namespace.c')\nc = add_include_after(c,\n    '#include <linux/task_work.h>',\n    '#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\\n'\n    '#include <linux/susfs_def.h>\\n'\n    '#endif')\nwrite('fs/namespace.c', c)\n\n# ── fs/stat.c ──────────────────────────────────────────────────\nprint(\"fs/stat.c...\")\nc = read('fs/stat.c')\nc = add_include_after(c,\n    '#include <linux/pagemap.h>',\n    '#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MOUNT)\\n'\n    '#include <linux/susfs_def.h>\\n'\n    '#endif\\n'\n    '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\\n'\n    'extern void susfs_sus_ino_for_generic_fillattr(unsigned long ino, struct kstat *stat);\\n'\n    '#endif')\nif USE_FIELD_API:\n    c = insert_before(c,\n        '\\tstat->dev = inode->i_sb->s_dev;\\n\\tstat->ino = inode->i_ino;',\n        '#ifdef CONFIG_KSU_SUSFS_SUS_KSTAT\\n'\n        '\\tif (likely(current->susfs_task_state & TASK_STRUCT_NON_ROOT_USER_APP_PROC) &&\\n'\n        '\\t\\tunlikely(inode->i_state & INODE_STATE_SUS_KSTAT)) {\\n'\n        '\\t\\tsusfs_sus_ino_for_generic_fillattr(inode->i_ino, stat);\\n'\n        '\\t\\tstat->mode  = inode->i_mode;\\n'\n        '\\t\\tstat->rdev  = inode->i_rdev;\\n'\n        '\\t\\tstat->uid   = inode->i_uid;\\n'\n        '\\t\\tstat->gid   = inode->i_gid;\\n'\n        '\\t\\treturn;\\n'\n        '\\t}\\n'\n        '#endif\\n')\nwrite('fs/stat.c', c)\n\n# ── include/linux/mount.h ──────────────────────────────────────\nprint(\"include/linux/mount.h...\")\nc = read('include/linux/mount.h')\nif 'susfs_mnt_id_backup' not in c:\n    c = c.replace(\n        '\\tint mnt_flags;\\n\\tvoid *data;\\n};',\n        '\\tint mnt_flags;\\n\\tvoid *data;\\n'\n        '#ifdef CONFIG_KSU_SUSFS\\n\\tu64 susfs_mnt_id_backup;\\n#endif\\n};',\n        1)\nwrite('include/linux/mount.h', c)\n\n# ── include/linux/sched.h ──────────────────────────────────────\nprint(\"include/linux/sched.h...\")\nc = read('include/linux/sched.h')\nif 'susfs_task_state' not in c:\n    c = c.replace(\n        '\\tstruct thread_struct thread;',\n        '#ifdef CONFIG_KSU_SUSFS\\n\\tu64 susfs_task_state;\\n#endif\\n'\n        '\\tstruct thread_struct thread;',\n        1)\nwrite('include/linux/sched.h', c)\n\n# ── fs/proc_namespace.c ────────────────────────────────────────\nprint(\"fs/proc_namespace.c...\")\nc = read('fs/proc_namespace.c')\nc = add_include_after(c,\n    '#include \"internal.h\"',\n    '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\\n'\n    '#include <linux/susfs_def.h>\\n'\n    'extern int susfs_sus_mnt_for_show_mountinfo(struct mount *r);\\n'\n    '#endif')\nwrite('fs/proc_namespace.c', c)\n\n# ── fs/readdir.c ───────────────────────────────────────────────\nprint(\"fs/readdir.c...\")\nc = read('fs/readdir.c')\nc = add_include_after(c,\n    '#include <linux/unistd.h>',\n    '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\\n'\n    '#include <linux/susfs_def.h>\\n'\n    'extern int susfs_sus_ino_for_filldir64(unsigned long ino);\\n'\n    '#endif')\nwrite('fs/readdir.c', c)\n\n# ── fs/proc/task_mmu.c ─────────────────────────────────────────\nprint(\"fs/proc/task_mmu.c...\")\nc = read('fs/proc/task_mmu.c')\nc = add_include_after(c,\n    '#include <linux/mm_inline.h>',\n    '#ifdef CONFIG_KSU_SUSFS_SUS_MAPS\\n'\n    '#include <linux/susfs_def.h>\\n'\n    'extern int susfs_sus_ino_for_show_map_vma(unsigned long ino);\\n'\n    '#endif')\nwrite('fs/proc/task_mmu.c', c)\n\n# ── fs/proc/cmdline.c ──────────────────────────────────────────\nprint(\"fs/proc/cmdline.c...\")\nc = read('fs/proc/cmdline.c')\n# Symbol renamed in SUSFS v2: SPOOF_CMDLINE → SPOOF_CMDLINE_OR_BOOTCONFIG\nif 'susfs_spoof_cmdline' not in c and 'SPOOF_CMDLINE' not in c:\n    c = insert_before(c,\n        'static int cmdline_proc_show',\n        '#ifdef CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG\\n'\n        'extern void susfs_spoof_cmdline(struct seq_file *m);\\n'\n        '#endif\\n')\nwrite('fs/proc/cmdline.c', c)\n\nprint(\"\\nSUSFS rejected-hunk fixup complete.\")\nPYEOF\npython3 /tmp/fix_susfs_hunks.py\n" }
            - { name: 'Inject manual KSU hooks', if: 'env.SKIP_INTEGRATION == ''false''', working-directory: kernel, run: "set -Eeuo pipefail\ncat > /tmp/inject_ksu_hooks.py << 'PYEOF'\nimport re, os\n\ndef read(p):\n    with open(p, encoding='utf-8', errors='replace') as f:\n        return f.read()\n\ndef write(p, c):\n    with open(p, 'w', encoding='utf-8') as f:\n        f.write(c)\n    print(\"  Patched: \" + p)\n\n# ── Derive exec hook call site from do_execveat_common signature ─\n# In Samsung 4.9 BSP the hook uses function params, not bprm members.\n# do_execveat_common(int fd, struct filename *filename, ...)\nexec_c = read('fs/exec.c')\n\nif 'ksu_handle_execveat_sucompat' in exec_c:\n    print(\"fs/exec.c already has KSU hook — skipping\")\nelse:\n    include_end = 0\n    for m in re.finditer(r'^#include\\s+[<\"]', exec_c, re.MULTILINE):\n        include_end = m.end()\n    nl = exec_c.index('\\n', include_end)\n\n    # Check for do_execveat_common to determine call style\n    if 'do_execveat_common' in exec_c:\n        # Use function-parameter style (Samsung 4.9 BSP)\n        extern_decl = (\n            '\\nextern void ksu_handle_execveat_sucompat('\n            'int *fd, struct filename **filename_ptr, '\n            'void *argv, void *envp, int *flags);\\n'\n        )\n        exec_c = exec_c[:nl+1] + extern_decl + exec_c[nl+1:]\n\n        # Insert before search_binary_handler using local scope vars\n        # (fd and filename are params of do_execveat_common, not bprm)\n        hook_call = (\n            '\\tksu_handle_execveat_sucompat(&fd, (struct filename **)&filename, '\n            '(void *)argv, (void *)envp, &flags);\\n\\t'\n        )\n        exec_c = exec_c.replace(\n            '\\tret = search_binary_handler(bprm);',\n            hook_call + 'ret = search_binary_handler(bprm);',\n            1\n        )\n        write('fs/exec.c', exec_c)\n    else:\n        print(\"WARN: do_execveat_common not found in fs/exec.c — skipping exec hook\")\n\n# ── faccessat hook ─────────────────────────────────────────────\nopen_c = read('fs/open.c')\n\nif 'ksu_handle_faccessat' in open_c:\n    print(\"fs/open.c already has KSU hook — skipping\")\nelse:\n    include_end = 0\n    for m in re.finditer(r'^#include\\s+[<\"]', open_c, re.MULTILINE):\n        include_end = m.end()\n    nl = open_c.index('\\n', include_end)\n\n    extern_decl = (\n        '\\nextern int ksu_handle_faccessat('\n        'int *dfd, const char __user **filename_user, int *mode, int *flags);\\n'\n    )\n    open_c = open_c[:nl+1] + extern_decl + open_c[nl+1:]\n\n    pattern = r'(SYSCALL_DEFINE3\\(faccessat,\\s*int,\\s*dfd,.*?int,\\s*mode\\)\\s*\\{)'\n    open_c = re.sub(\n        pattern,\n        lambda m: m.group(1) + '\\n\\tksu_handle_faccessat(&dfd, &filename, &mode, NULL);',\n        open_c, count=1, flags=re.DOTALL\n    )\n    write('fs/open.c', open_c)\n\nprint(\"KSU manual hooks done.\")\nPYEOF\npython3 /tmp/inject_ksu_hooks.py\n" }
            - { name: 'Patch Makefile and defconfig', working-directory: kernel, run: "set -Eeuo pipefail\n\n# ── Clang 19 Makefile fixes ──────────────────────────────────────\nsed -i 's/-std=gnu89/-std=gnu11 -fcommon/g' Makefile\nsed -i 's/^HOSTCFLAGS[[:space:]]*:=.*/HOSTCFLAGS   := -std=gnu11 -fcommon/' Makefile\n\n# Warning suppressions — inserted after last -std= line\nEND_LINE=$(grep -n '^\\s*-std=gnu' Makefile | tail -1 | cut -d: -f1)\nif [[ -n \"$END_LINE\" ]]; then\n  sed -i \"${END_LINE}a KBUILD_CFLAGS += -Wno-address-of-packed-member -Wno-int-in-bool-context -Wno-asm-operand-widths\" \\\n    Makefile\nfi\n\n# ── SchedUtil constants (idempotent) ─────────────────────────────\nSCHED_FILE=\"kernel/sched/cpufreq_schedutil.c\"\nif ! grep -q 'CHIMERA_DEFINED' \"$SCHED_FILE\"; then\n  cat > /tmp/sched_inject.py << 'PYEOF'\nimport sys\ntarget = sys.argv[1]\nwith open(target, encoding='utf-8', errors='replace') as f:\n    content = f.read()\nblock = (\n    '/* Project Chimera: High-Response Scheduler Tunables */\\n'\n    '#ifndef CHIMERA_DEFINED\\n'\n    '#define CHIMERA_DEFINED\\n'\n    '#define CHIMERA_UP_RATE_LIMIT   500\\n'\n    '#define CHIMERA_DOWN_RATE_LIMIT 2000\\n'\n    '#endif\\n'\n)\nif 'CHIMERA_DEFINED' not in content:\n    with open(target, 'w', encoding='utf-8') as f:\n        f.write(block + content)\n    print(\"SchedUtil constants injected\")\nelse:\n    print(\"SchedUtil constants already present\")\nPYEOF\n  python3 /tmp/sched_inject.py \"$SCHED_FILE\"\nfi\n\n# ── Defconfig normalization ───────────────────────────────────────\nF=\"arch/arm64/configs/exynos9810-star2lte_defconfig\"\ntest -f \"$F\"\n\n# Remove-then-set: avoids contradictory duplicate symbols\nset_cfg() {\n  local key=\"$1\" val=\"$2\"\n  sed -i \"/^${key}[=[:space:]].*/d\" \"$F\"\n  sed -i \"/^# ${key} is not set/d\" \"$F\"\n  echo \"${key}=${val}\" >> \"$F\"\n}\nunset_cfg() {\n  local key=\"$1\"\n  sed -i \"/^${key}[=[:space:]].*/d\" \"$F\"\n  sed -i \"/^# ${key} is not set/d\" \"$F\"\n  echo \"# ${key} is not set\" >> \"$F\"\n}\n\n# Timer — remove ALL HZ variants first to avoid contradictions\nfor hz in CONFIG_HZ_100 CONFIG_HZ_250 CONFIG_HZ_300 CONFIG_HZ_1000 CONFIG_HZ; do\n  sed -i \"/^${hz}[=[:space:]].*/d\" \"$F\"\n  sed -i \"/^# ${hz} is not set/d\" \"$F\"\ndone\nset_cfg CONFIG_HZ_300 y\nset_cfg CONFIG_HZ 300\n\n# Preemption\nset_cfg CONFIG_PREEMPT y\n\n# KSU\nset_cfg CONFIG_KSU y\nset_cfg CONFIG_KSU_ALLOWLIST_WORKAROUND y\nset_cfg CONFIG_KPROBES y\nset_cfg CONFIG_KPROBE_EVENTS y\n\n# SUSFS — safe subset + v2 features already wired in chimera-mk6 tree\n# SUS_MOUNT + SPOOF_UNAME cause AVC boot panic on Android 16 QPR2\nset_cfg CONFIG_KSU_SUSFS y\nset_cfg CONFIG_KSU_SUSFS_SUS_PATH y\nset_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y\nset_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y\nset_cfg CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT y\nset_cfg CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT y\n# SUSFS v2 features confirmed wired in tree (safe on LOS 23.2)\nset_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y\nset_cfg CONFIG_KSU_SUSFS_ENABLE_LOG y\nset_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y\n# Keep off — SUS_MOUNT causes AVC panic; SUS_MAP needs per-app testing\nunset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT\nunset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME\nunset_cfg CONFIG_KSU_SUSFS_SUS_MAP\n\n# BPF — required for Android 16 / LOS 23.2\nset_cfg CONFIG_BPF y\nset_cfg CONFIG_BPF_SYSCALL y\nset_cfg CONFIG_BPF_JIT y\nset_cfg CONFIG_BPF_EVENTS y\nset_cfg CONFIG_CGROUP_BPF y\n\n# CMA\nset_cfg CONFIG_DMA_CMA y\nset_cfg CONFIG_CMA y\nset_cfg CONFIG_CMA_SIZE_MBYTES 768\n\n# Scheduler\nset_cfg CONFIG_SCHED_LATENCY_NS 500000\nset_cfg CONFIG_SCHED_WAKEUP_GRANULARITY_NS 2000000\n\n# ZRAM\nset_cfg CONFIG_ZRAM_SIZE_PERCENT 50\n\n# Crypto — avoid duplicate init_module linker errors\nsed -i 's/^CONFIG_CRYPTO_\\(.*\\)=m$/CONFIG_CRYPTO_\\1=y/' \"$F\"\n\ngit diff -- \"$F\" | tee \"../$LOG_DIR/defconfig-diff.log\"\necho \"Defconfig normalized.\"\n" }
            - { name: 'Patch DTS', working-directory: kernel, run: "set -Eeuo pipefail\n\n# Audit confirmed: only .dts files exist — no exynos9810.dtsi\nDTS=\"arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts\"\ntest -f \"$DTS\" || { echo \"ERROR: DTS not found: $DTS\"; exit 1; }\n\n# Camera ION heap\nif grep -q 'size = <461373440>;' \"$DTS\"; then\n  sed -i 's/size = <461373440>;/size = <603979776>;/' \"$DTS\"\n  echo \"Camera ION heap: 440MB -> 576MB\"\nelse\n  echo \"WARN: Camera ION heap anchor not found (may already be patched)\"\nfi\n\n# CPU idle — in the monolithic DTS, not a separate dtsi\nif grep -q 'min-residency-us = <2000>' \"$DTS\"; then\n  sed -i 's/min-residency-us = <2000>/min-residency-us = <400>/' \"$DTS\"\n  echo \"CPU idle min-residency tuned\"\nelse\n  echo \"WARN: idle residency anchor not found (may already be patched)\"\nfi\n\ngit diff -- \"$DTS\" | tee \"../$LOG_DIR/dts-diff.log\"\n" }
            - { name: 'Patch summary and validation', working-directory: kernel, run: "set -Eeuo pipefail\n\necho \"=== git status ===\" | tee \"../$LOG_DIR/patch-summary.log\"\ngit status --short | tee -a \"../$LOG_DIR/patch-summary.log\"\n\necho \"=== diff stat ===\" | tee -a \"../$LOG_DIR/patch-summary.log\"\ngit diff --stat | tee -a \"../$LOG_DIR/patch-summary.log\"\n\n# Verify BPF not accidentally disabled\nF=\"arch/arm64/configs/exynos9810-star2lte_defconfig\"\nfor sym in CONFIG_BPF CONFIG_BPF_SYSCALL CONFIG_BPF_JIT CONFIG_CGROUP_BPF; do\n  grep -q \"^${sym}=y\" \"$F\" || { echo \"ERROR: $sym missing from defconfig\"; exit 1; }\ndone\necho \"BPF symbols verified.\" | tee -a \"../$LOG_DIR/patch-summary.log\"\n\n# Verify panic-causing options are disabled\nfor sym in CONFIG_KSU_SUSFS_SUS_MOUNT CONFIG_KSU_SUSFS_SPOOF_UNAME; do\n  if grep -q \"^${sym}=y\" \"$F\"; then\n    echo \"ERROR: $sym is enabled — this causes AVC boot panic on LOS 23.2\"\n    exit 1\n  fi\ndone\necho \"Boot-safe SUSFS config verified.\" | tee -a \"../$LOG_DIR/patch-summary.log\"\n\n# Verify SUSFS v2 symbols are enabled\nfor sym in CONFIG_KSU_SUSFS_OPEN_REDIRECT CONFIG_KSU_SUSFS_ENABLE_LOG CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS; do\n  grep -q \"^${sym}=y\" \"$F\" || { echo \"ERROR: $sym missing from defconfig\"; exit 1; }\ndone\necho \"SUSFS v2 symbols verified.\" | tee -a \"../$LOG_DIR/patch-summary.log\"\n" }
            - { name: 'Dry run complete', if: '${{ inputs.dry_run }}', run: "echo \"Dry run finished. Review artifacts in logs/ before running a real build.\"\necho \"Re-run with dry_run=false when ready.\"\n" }
            - { name: 'Build kernel', if: '${{ !inputs.dry_run }}', working-directory: kernel, run: "set -Eeuo pipefail\n\nmkdir -p \"$GITHUB_WORKSPACE/$OUT_DIR\"\n\nMAKE=(\n  make\n  -j\"$(nproc)\"\n  O=\"$GITHUB_WORKSPACE/$OUT_DIR\"\n  ARCH=arm64\n  SUBARCH=arm64\n  CC=clang\n  CLANG_TRIPLE=aarch64-linux-gnu-\n  CROSS_COMPILE=aarch64-linux-gnu-\n  CROSS_COMPILE_ARM32=arm-linux-gnueabi-\n  LD=\"$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld\"\n  AR=llvm-ar\n  NM=llvm-nm\n  OBJCOPY=llvm-objcopy\n  OBJDUMP=llvm-objdump\n  STRIP=llvm-strip\n  KCFLAGS=\"-fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type\"\n)\n\n\"${MAKE[@]}\" exynos9810-star2lte_defconfig\ncp \"$GITHUB_WORKSPACE/$OUT_DIR/.config\" \"$GITHUB_WORKSPACE/$LOG_DIR/final.config\"\n\n\"${MAKE[@]}\" Image dtbs 2>&1 | tee build.log\n\ntest -f \"$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image\" || {\n  echo \"ERROR: Image not produced — check build.log\"\n  exit 1\n}\ndu -h \"$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image\" \\\n  | tee \"$GITHUB_WORKSPACE/$LOG_DIR/image-size.log\"\n" }
            - { name: 'Package flashable zip', if: '${{ !inputs.dry_run }}', run: "set -Eeuo pipefail\n\ngit clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3\n\n# Write anykernel.sh via bash heredoc (avoids Python/YAML quoting conflicts)\ncat > AnyKernel3/anykernel.sh << 'AKEOF'\nproperties() { '\nkernel.string=Project Chimera MK6 - Lineage 23.2 / star2lte\ndo.devicecheck=1\ndo.modules=0\ndo.cleanup=1\ndo.cleanuponabort=0\ndevice.name1=star2lte\ndevice.name2=SM-G965F\ndevice.name3=SM-G965U\ndevice.name4=SM-G965N\ndevice.name5=SM-G9650\n'; }\nblock=boot;\nis_slot_device=0;\nramdisk_compression=auto;\npatch_vbmeta_flag=auto;\n. tools/ak3-core.sh;\ndump_boot;\nwrite_boot;\nAKEOF\necho \"anykernel.sh written\"\n\n# Copy Image (Samsung uses raw Image, not Image.gz)\ncp \"$OUT_DIR/arch/arm64/boot/Image\" AnyKernel3/\ntest -f AnyKernel3/Image || { echo \"ERROR: Image missing from AnyKernel3\"; exit 1; }\n\n# Copy only star2lte DTBs (not all Exynos DTBs)\nfind \"$OUT_DIR/arch/arm64/boot/dts/exynos\" \\\n  -name '*star2lte*.dtb' \\\n  -exec cp {} AnyKernel3/ \\;\n\nZIP=\"chimera-mk6-lineage23.2-$(date +%Y%m%d-%H%M).zip\"\ncd AnyKernel3\nzip -r9 \"../$ZIP\" . -x '*.git*'\ncd ..\n\ntest -f \"$ZIP\" || { echo \"ERROR: ZIP not produced\"; exit 1; }\nls -lh \"$ZIP\"\n" }
            - { name: 'Upload logs', if: always(), uses: actions/upload-artifact@v4, with: { name: 'chimera-logs-${{ github.run_number }}', path: "logs/\nkernel/build.log\nkernel-out/.config\n", if-no-files-found: ignore, retention-days: 14 } }
            - { name: 'Upload flashable zip', if: '${{ !inputs.dry_run }}', uses: actions/upload-artifact@v4, with: { name: 'chimera-mk6-${{ github.run_number }}', path: 'chimera-*.zip', if-no-files-found: error, retention-days: 30 } }
            - { name: 'Create GitHub Release', if: '${{ !inputs.dry_run && inputs.do_release }}', uses: softprops/action-gh-release@v2, with: { tag_name: 'chimera-mk6-${{ github.run_number }}', name: 'Project Chimera MK6 — Lineage 23.2 Build #${{ github.run_number }}', body: "## Project Chimera MK6 — Exynos 9810 / star2lte\nBase: Project_Chimera @ chimera-mk6 (UV + BT hardening included)\n\n### Integrated\n- KernelSU Next (gavdoc38 fork, manual hooks for Samsung 4.9 BSP)\n- SUSFS v2 safe config (SUS_MOUNT + SPOOF_UNAME disabled — no boot panic)\n- SUSFS v2 features enabled: OPEN_REDIRECT, ENABLE_LOG, HIDE_KSU_SUSFS_SYMBOLS\n- BPF preserved (required for Android 16 / LOS 23.2)\n- SchedUtil: UP=500us, DOWN=2000us\n- Camera ION heap: 576MB (face auth for banking)\n- CMA: 768MB\n- HZ_300, PREEMPT\n\n### Flash order\n1. Flash Lineage 23.2 + its recovery\n2. Sideload this zip via Lineage recovery\n3. Install KernelSU Next manager APK\n4. Install SUSFS module from KSU Manager\n5. Reboot\n", files: 'chimera-*.zip' } }
