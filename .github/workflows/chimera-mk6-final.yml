name: Project Chimera MK6 — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true

      do_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force SUSFS reintegration"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build Exynos9810 Kernel
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO: "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6"

      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.9"

      KERNEL_DIR: "kernel"
      OUT_DIR: "kernel-out"
      LOG_DIR: "logs"

      NEUTRON_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY: "neutron-clang-10032024-pinned-v3"

      BUILD_NUMBER: "003"

    steps:

      # ════════════════════════════════════════════════
      # 0. Workspace
      # ════════════════════════════════════════════════

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail

          mkdir -p "$LOG_DIR"
          mkdir -p "$OUT_DIR"

      # ════════════════════════════════════════════════
      # 1. Dependencies
      # ════════════════════════════════════════════════

      - name: Install dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -yqq \
            git \
            curl \
            wget \
            bc \
            flex \
            bison \
            python3 \
            python3-pip \
            libssl-dev \
            libelf-dev \
            build-essential \
            zip \
            unzip \
            zstd \
            lz4 \
            ccache \
            rsync \
            jq \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      # ════════════════════════════════════════════════
      # 2. Neutron Toolchain
      # ════════════════════════════════════════════════

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: ${{ env.NEUTRON_KEY }}

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          mkdir -p neutron-clang

          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"

          tar \
            --use-compress-program=unzstd \
            -xf /tmp/neutron.tar.zst \
            -C neutron-clang \
            --strip-components=1

          test -x neutron-clang/bin/clang

          neutron-clang/bin/clang --version \
            | tee "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: |
          set -Eeuo pipefail

          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ════════════════════════════════════════════════
      # 3. Clone Kernel
      # ════════════════════════════════════════════════

      - name: Clone kernel source
        run: |
          set -Eeuo pipefail

          git clone \
            --recursive \
            --depth=1 \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          git -C "$KERNEL_DIR" log --oneline -3 \
            | tee "$LOG_DIR/kernel_revision.log"

      # ════════════════════════════════════════════════
      # 4. Apply UV + BT commit
      # ════════════════════════════════════════════════

      - name: Apply UV + BT tuning commit
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          UVBT_COMMIT="d1cbf4acc0e3f3a8e918470fb1bcff4464a07d3d"

          if git cat-file -e "${UVBT_COMMIT}^{commit}" 2>/dev/null; then
            echo "UV/BT commit object already available"
          else
            echo "Fetching UV/BT commit object"
            git fetch --depth=1 origin "$UVBT_COMMIT"
          fi

          if git merge-base --is-ancestor "$UVBT_COMMIT" HEAD; then
            echo "UV/BT commit already integrated"
            exit 0
          fi

          git cherry-pick -x "$UVBT_COMMIT" || {
            echo "Cherry-pick conflict detected"
            git cherry-pick --abort || true
            exit 1
          }

          echo "UV/BT tuning commit applied successfully"

      # ════════════════════════════════════════════════
      # 5. Clone SUSFS
      # ════════════════════════════════════════════════

      - name: Clone SUSFS
        run: |
          set -Eeuo pipefail

          git clone \
            --depth=1 \
            -b "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

          test -f susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          test -f susfs4ksu/kernel_patches/fs/susfs.c
          test -f susfs4ksu/kernel_patches/include/linux/susfs.h

      # ════════════════════════════════════════════════
      # 6. Setup KernelSU-Next
      # ════════════════════════════════════════════════

      - name: Setup KernelSU-Next
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          git clone \
            --depth=1 \
            https://github.com/gavdoc38/KernelSU-Next.git \
            KernelSU-Next

          ln -sf ../KernelSU-Next/kernel drivers/kernelsu

          test -f drivers/kernelsu/Kconfig

      # ════════════════════════════════════════════════
      # 7. Samsung syscall_fn_t ABI Fix
      # ════════════════════════════════════════════════

      - name: Apply syscall ABI fix
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          HOOK_FILE="KernelSU-Next/kernel/hook/syscall_hook.h"

          if grep -q 'typedef long (\*syscall_fn_t)' "$HOOK_FILE"; then
            echo "ABI fix already present"
            exit 0
          fi

          cat > /tmp/chimera_abi_fix.py <<'PYEOF'
          from pathlib import Path
          import re

          path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")

          text = path.read_text()

          block = """
          /* Samsung 4.9 BSP ABI compatibility */
          typedef long (*syscall_fn_t)(
              unsigned long,
              unsigned long,
              unsigned long,
              unsigned long,
              unsigned long,
              unsigned long
          );
          """

          pos = 0

          for match in re.finditer(r'^#.*\n', text, re.MULTILINE):
              pos = match.end()

          text = text[:pos] + block + text[pos:]

          path.write_text(text)

          print("ABI compatibility typedef injected")
          PYEOF

          python3 /tmp/chimera_abi_fix.py

      # ════════════════════════════════════════════════
      # 8. Wire KernelSU
      # ════════════════════════════════════════════════

      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          sed -i '/drivers\/kernelsu\/Kconfig/d' drivers/Kconfig

          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi

          sed -i \
            '/^endmenu/i source "drivers/kernelsu/Kconfig"' \
            drivers/Kconfig

          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig)"

          if [ "$COUNT" -ne 1 ]; then
            echo "KernelSU Kconfig wiring invalid"
            exit 1
          fi

      # ════════════════════════════════════════════════
      # 9. Apply SUSFS
      # ════════════════════════════════════════════════

      - name: Apply SUSFS
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          git apply \
            --reject \
            --whitespace=fix \
            "$PATCH" || true

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" \
            fs/susfs.c

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" \
            fs/sus_su.c

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" \
            include/linux/susfs_def.h

          install -m 0644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" \
            include/linux/sus_su.h

          grep -q 'susfs.o' fs/Makefile || \
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

      # ════════════════════════════════════════════════
      # 10. Chimera Branding
      # ════════════════════════════════════════════════

      - name: Apply Chimera uname branding
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          cat > scripts/setlocalversion <<'EOF'
          #!/bin/sh

          echo "-Chimera_MK6r2"
          exit 0
          EOF

          chmod +x scripts/setlocalversion

      # ════════════════════════════════════════════════
      # 11. Remove dirty state
      # ════════════════════════════════════════════════

      - name: Remove git dirty state
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          git config --global user.email "chimera@local"
          git config --global user.name "Project Chimera"

          git add .

          git commit -m "Project Chimera integrated tree" || true

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: tree still dirty"
            git status --short
            exit 1
          fi

      # ════════════════════════════════════════════════
      # 12. Dry Run Exit
      # ════════════════════════════════════════════════

      - name: Dry run complete
        if: inputs.dry_run == true
        run: |
          echo "Dry run successful"

      # ════════════════════════════════════════════════
      # 13. Build Kernel
      # ════════════════════════════════════════════════

      - name: Build kernel
        if: inputs.dry_run == false
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export CC=clang
          export LD=ld.lld

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export KCFLAGS="-fcommon"

          MAKE=(
            make
            -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            CC=clang
            LD=ld.lld
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            KCFLAGS="-fcommon"
            LOCALVERSION=
            KBUILD_BUILD_USER=Chimera
            KBUILD_BUILD_HOST=AegisLab
          )

          "${MAKE[@]}" exynos9810-star2lte_defconfig

          scripts/config \
            --file "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            -e KSU \
            -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT \
            -e KSU_SUSFS_SUS_PATH \
            -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
            -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG \
            -e OVERLAY_FS \
            -e TMPFS \
            -e BPF \
            -e BPF_SYSCALL

          "${MAKE[@]}" olddefconfig

          cp \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" \
            "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log

          test -f \
            "$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image"

      # ════════════════════════════════════════════════
      # 14. Verify uname cleanliness
      # ════════════════════════════════════════════════

      - name: Verify clean uname
        if: inputs.dry_run == false
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          COMPILE_H="$GITHUB_WORKSPACE/$OUT_DIR/include/generated/compile.h"

          test -f "$COMPILE_H"

          grep -q 'Chimera_MK6r2' "$COMPILE_H" || {
            echo "Branding missing"
            exit 1
          }

          if grep -q 'dirty' "$COMPILE_H"; then
            echo "ERROR: dirty suffix still present"
            exit 1
          fi

      # ════════════════════════════════════════════════
      # 15. Package AnyKernel3
      # ════════════════════════════════════════════════

      - name: Package AnyKernel3
        if: inputs.dry_run == false
        run: |
          set -Eeuo pipefail

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3

          cp \
            "$OUT_DIR/arch/arm64/boot/Image" \
            AnyKernel3/

          find \
            "$OUT_DIR/arch/arm64/boot/dts/exynos" \
            -name '*star2lte*.dtb' \
            -exec cp {} AnyKernel3/ \;

          ZIP="chimera-mk6-$(date +%Y%m%d-%H%M).zip"

          (
            cd AnyKernel3
            zip -r9 "../$ZIP" . -x '*.git*'
          )

          test -f "$ZIP"

      # ════════════════════════════════════════════════
      # 16. Upload Artifacts
      # ════════════════════════════════════════════════

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-logs-${{ github.run_number }}
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload flashable zip
        if: inputs.dry_run == false
        uses: actions/upload-artifact@v4
        with:
          name: chimera-kernel-${{ github.run_number }}
          path: chimera-*.zip
          retention-days: 30

      # ════════════════════════════════════════════════
      # 17. GitHub Release
      # ════════════════════════════════════════════════

      - name: Create GitHub Release
        if: inputs.dry_run == false && inputs.do_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-mk6-${{ github.run_number }}

          name: >
            Project Chimera MK6 —
            LineageOS 23.2 Build #${{ github.run_number }}

          body: |
            ## Project Chimera MK6

            ### Device
            - Samsung Galaxy S9+
            - Exynos9810
            - star2lte

            ### Integrated
            - KernelSU Next
            - SUSFS
            - Samsung 4.9 ABI fix
            - UV tuning
            - Bluetooth tuning
            - Chimera uname branding
            - Clean non-dirty kernel string
            - BPF enabled
            - AVC-safe SUSFS configuration

            ### Flashing
            1. Flash ROM
            2. Flash kernel zip
            3. Install KernelSU manager
            4. Install SUSFS module
            5. Reboot

          files: chimera-*.zip
