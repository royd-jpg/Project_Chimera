name: Project Chimera MK6 — Lineage 23.2 Build
'on':
  workflow_dispatch:
    inputs:
      do_release:
        description: Create a GitHub Release
        type: boolean
        default: false
env:
  CLANG_CACHE_KEY: clang-neutron-latest
  CLANG_FALLBACK_URL: 'https://example.com/prebuilts/clang-neutron-latest.tar.xz'
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: >
          sudo apt-get update -qq

          sudo apt-get install -yqq git curl wget bc flex bison python3
          libssl-dev libelf-dev build-essential zip zstd lz4
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: '${{ env.CLANG_CACHE_KEY }}'
      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          mkdir -p neutron-clang

          echo "Downloading pinned Neutron Clang: $NEUTRON_URL" \
            | tee "$LOG_DIR/toolchain.log"

          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"

          tar -xf /tmp/neutron.tar.zst \
            -C neutron-clang \
            --strip-components=1

          test -x neutron-clang/bin/clang || {
            echo "ERROR: clang binary missing after extract"
            exit 1
          }

          echo "Clang version:" \
            | tee -a "$LOG_DIR/toolchain.log"

          neutron-clang/bin/clang --version \
            | head -1 \
            | tee -a "$LOG_DIR/toolchain.log"
      - name: Export toolchain PATH
        run: echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"
      - name: Clone kernel tree
        run: >-
          git clone --depth=1 -b chimera-mk6
          https://github.com/royd-jpg/Project_Chimera kernel
      - name: Clone SUSFS
        run: >-
          git clone --depth=1 -b kernel-4.9
          https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu
      - name: Apply SUSFS + KernelSU + ZeroMount VFS
        working-directory: kernel
        run: >
          set -e

          # Clean previous KernelSU state

          git rm -r --cached KernelSU-Next 2>/dev/null || true

          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu

          sed -i '/kernelsu\/Kconfig/d' drivers/Kconfig

          sed -i '/susfs\/Kconfig/d' fs/Kconfig


          # Clone KernelSU Next

          git clone --depth=1 https://github.com/gavdoc38/KernelSU-Next.git
          KernelSU-Next

          ln -s ../KernelSU-Next/kernel drivers/kernelsu

          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig

          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig


          # Apply SUSFS patch + copy files

          git apply --reject --whitespace=fix
          $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch
          || true

          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c

          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c fs/sus_su.c

          cp $GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs*.h
          include/linux/


          # Backport ZeroMount VFS edits (Makefile, namei.c, namespace.c,
          stat.c, mount.h, sched.h, proc/*)

          python3 $GITHUB_WORKSPACE/scripts/zeromount_backport.py
      - name: Inject manual KSU hooks
        working-directory: kernel
        run: |
          python3 $GITHUB_WORKSPACE/scripts/ksu_manual_hooks.py
      - name: Patch Makefile and defconfig
        working-directory: kernel
        run: |
          python3 $GITHUB_WORKSPACE/scripts/chimera_defconfig.py
      - name: Patch DTS
        working-directory: kernel
        run: |
          python3 $GITHUB_WORKSPACE/scripts/dts_patch.py
      - name: Build kernel
        working-directory: kernel
        run: |
          make -j"$(nproc)" ARCH=arm64 SUBARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=$GITHUB_WORKSPACE/neutron-clang/bin/ld.lld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            KCFLAGS="-std=gnu11 -fcommon -Wno-implicit-function-declaration -Wno-implicit-int -Wno-return-type" \
            exynos9810-star2lte_defconfig
          make -j"$(nproc)" ARCH=arm64 SUBARCH=arm64 Image dtbs
      - name: Package flashable zip
        run: >
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          cp kernel/arch/arm64/boot/Image AnyKernel3/

          cp kernel/arch/arm64/boot/dts/exynos/*.dtb AnyKernel3/ 2>/dev/null ||
          true

          cd AnyKernel3

          zip -r9 "../chimera-mk6-lineage23.2-$(date +%Y%m%d-%H%M).zip" . -x
          "*.git*"

          cd ..
      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk6-${{ github.run_number }}'
          path: chimera-*.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'build-log-${{ github.run_number }}'
          path: kernel/build.log
          retention-days: 7
      - name: Create GitHub Release
        if: '${{ inputs.do_release }}'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'chimera-mk6-${{ github.run_number }}'
          name: 'Project Chimera MK6 — Lineage 23.2 Build #${{ github.run_number }}'
          body: |
            ## Project Chimera MK6 — Exynos 9810 / star2lte
            Base: Project_Chimera @ chimera-mk6 (UV + BT hardening included)

            ### Integrated
            - KernelSU Next (gavdoc38 fork)
            - SUSFS (safe config)
            - ZeroMount VFS (backported)
            - BPF preserved
            - SchedUtil UP/DOWN=500/2000µs
            - Camera ION heap 576MB
            - CMA 768MB
            - CPU idle tuning
          files: chimera-*.zip
