# ═══════════════════════════════════════════════════════════════════════════════
# Project Chimera Mk8 UNIFIED — LOS/AOSP Android 16 QPR2 / Exynos 9810 (star2lte)
# ───────────────────────────────────────────────────────────────────────────────
# Base       : royd-jpg/Project_Chimera @ chimera-mk8
# KSU        : gavdoc38/KernelSU-Next @ 242f245 (default; overridable)
# SUSFS      : simonpunk/susfs4ksu @ kernel-4.9 · v2.1.0
# Toolchains : AOSP Clang 19 / 20 / 21 / 22, Neutron Clang, ZyCromerZ Clang,
#              AOSP Clang 21 + Eva GCC cross-support, AOSP Clang 22.0.2 + Eva GCC cross-support (selectable)
# Profiles   : cm8 (runtime SUSFS spoofing) / cm8e (compile-time identity, spoof OFF)
# ───────────────────────────────────────────────────────────────────────────────
# This workflow merges build_cm8_Forte_Clang21.yml and build_cm8e_Forte.yml into
# a single dispatchable pipeline with two new selectors:
#
#   profile   — cm8  : SUSFS runtime spoofing enabled (SPOOF_UNAME, SPOOF_SELINUX,
#                       ENABLE_AVC_LOG_SPOOF), probe-gated per Kconfig availability.
#               cm8e : all SUSFS spoof symbols unconditionally hard-disabled;
#                       compensates via the Compile-Time ROM Identity Engine
#                       (step "Profile & Identity Injection"), which patches
#                       scripts/mkcompile_h directly so LINUX_COMPILE_BY/HOST/
#                       TIME/VERSION (and therefore linux_banner / UTS_VERSION)
#                       are deterministic and never fall back to runner metadata
#                       (whoami/hostname/git-describe), regardless of how kbuild's
#                       own env-var pickup behaves on this heavily patched tree.
#
#   toolchain — aosp19 / aosp20 / aosp21 / aosp22 / neutron19 / zyc_stable /
#               clang21-eva-gcc / clang22-eva-gcc
#               Resolved by a single case-block step ("Resolve toolchain
#               configuration") that exports CC/LD/AR/NM/OBJCOPY/OBJDUMP/STRIP,
#               archive format, download URL, cache key, LLVM_IAS policy, and
#               cross-compile target prefixes via TC_* env vars.
#               See that step's inline comments for the per-toolchain rationale.
#
#               clang21-eva-gcc specifics
#               ─────────────────────────
#               Primary compiler : AOSP Clang 21.0 r563880c (CC, LD/AR/NM/etc.
#                                  all from the same Clang 21 tarball — full LLVM).
#               Support path     : Eva GCC (mvaisakh/gcc-arm64 + mvaisakh/gcc-arm),
#                                  cloned separately from GitHub and placed on PATH
#                                  as a pure assembler-backend support toolchain.
#                                  Eva GCC is NOT the primary compiler — it is only
#                                  invoked as ${CROSS_COMPILE}as when the kernel
#                                  build system shells out for GNU-style assembly.
#               LLVM_IAS=0       : Same AOSP r563880c binary as aosp21; the Samsung
#                                  4.9 BSP inline-asm incompatibilities that force
#                                  IAS=0 on aosp21 apply equally here. With IAS=0,
#                                  Clang emits textual asm and delegates to
#                                  ${CROSS_COMPILE}as — resolved to Eva GCC's
#                                  aarch64-elf-as on PATH. This is what makes
#                                  clang21-eva-gcc distinct from pure aosp21.
#               GCC_TOOLCHAIN    : Set to the Eva GCC arm64 sysroot directory and
#                                  passed explicitly as a make argument. Clang picks
#                                  it up via scripts/Makefile.clang as
#                                  --gcc-toolchain=<path>, providing a full GNU
#                                  compatibility layer without making GCC the active
#                                  compiler. Only used when the tree or a build step
#                                  needs explicit GNU-style sysroot discovery.
#               CROSS_COMPILE    : aarch64-elf-  (Eva GCC target prefix, arm64)
#               CROSS_COMPILE_ARM32: arm-eabi-   (Eva GCC target prefix, arm32)
#               HOSTCC           : clang          (host-tool compilation via Clang 21)
#
# Both profiles run on the identical merged chimera-mk8 QPR2 base, share the
# identical surgical patching pipeline (Surgery A-D, prctl bridge, weak symbol
# fallbacks, syscall_fn_t fix, namei.c dedup fix), and both unconditionally get
# the Chimera Silent Engine. Packaging is unified to a single raw Image artifact
# per the Step 6 spec (AnyKernel3 zip packaging from the original cm8 workflow
# is intentionally dropped here — inject the Image into your own boot.img with
# magiskboot/AIK locally, exactly as cm8e already did).
# ═══════════════════════════════════════════════════════════════════════════════

name: Project Chimera Mk8 Unified — Multi-Toolchain / Multi-Profile — Exynos 9810 (star2lte)

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      # ── Profile / Toolchain selectors ───────────────────────────────────────
      profile:
        description: "Build profile: cm8 (runtime SUSFS spoof) or cm8e (compile-time identity, spoof OFF)"
        required: true
        type: choice
        options: [cm8, cm8e]
        default: cm8
      toolchain:
        description: >-
          Compiler toolchain: aosp19/20/21/22 (full LLVM, IAS=0), neutron19 (GNU binutils, IAS=1),
          zyc_stable (ZyCromerZ latest, IAS=0), clang21-eva-gcc (Clang 21 primary + Eva GCC assembler backend, IAS=0), clang22-eva-gcc (Clang 22.0.2 primary + Eva GCC assembler backend, IAS=0)
        required: true
        type: choice
        options: [aosp19, aosp20, aosp21, aosp22, neutron19, zyc_stable, clang21-eva-gcc, clang22-eva-gcc]
        default: aosp21
      zycromerz_url:
        description: 'Custom ZyCromerZ Tarball URL (Leave blank for default)'
        required: false
        type: string
        default: ''
      # ── Existing controls ────────────────────────────────────────────────────
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true
      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false
      force_repatch:
        description: "Force re-apply KSU/SUSFS even if already present in tree"
        required: false
        type: boolean
        default: false

      ksu_repo:
        description: "KernelSU git URL (https only)"
        required: false
        type: string
        default: "https://github.com/gavdoc38/KernelSU-Next.git"
      ksu_ref:
        description: "KernelSU branch/tag/ref (leave blank when relying on ksu_commit — at least one of ksu_ref / ksu_commit must be non-blank)"
        required: false
        type: string
        default: ""
      ksu_commit:
        description: "KernelSU exact commit SHA (gavdoc38 Exynos-optimized pin; leave blank to track ksu_ref tip instead)"
        required: false
        type: string
        default: "ee36c9b1749583b1a8522af395bd555a793d2e84"

      susfs_repo:
        description: "SUSFS git URL (https only)"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"
      susfs_ref:
        description: "SUSFS branch/tag/ref"
        required: false
        type: string
        default: "kernel-4.9"
      susfs_commit:
        description: "SUSFS exact commit SHA (leave blank to track ref tip)"
        required: false
        type: string
        default: ""

      # ── Branding / Identity ──────────────────────────────────────────────────
      brand:
        description: "LOCALVERSION suffix (must start with '-')"
        required: false
        type: string
        default: "-Chimera_Mk8_Forte"
      build_user:
        description: "KBUILD_BUILD_USER — uname '(user@host)' left side"
        required: false
        type: string
        default: "_Terminal_Echo"
      build_host:
        description: "KBUILD_BUILD_HOST — uname '(user@host)' right side"
        required: false
        type: string
        default: "AegisDevLabs"
      build_version:
        description: 'KBUILD_BUILD_VERSION — the "#N" token in the uname string'
        required: false
        type: string
        default: "1"
      build_date:
        description: "KBUILD_BUILD_TIMESTAMP — date/time for the version string (static; keep deterministic)"
        required: false
        type: string
        default: "Mon 1 Jan 00:00:00 UTC 2026"

jobs:
  build:
    name: >-
      Chimera Mk8 [${{ inputs.profile }}] — ${{ inputs.toolchain }} — Exynos9810 star2lte
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    defaults:
      run:
        shell: bash

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      KERNEL_REPO:          "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH:        "chimera-mk8"
      SUSFS_TARGET_VERSION: "2.2.0"
      KERNEL_DIR:           "kernel"
      OUT_DIR:              "kernel-out"
      LOG_DIR:              "logs"
      DEFCONFIG:            "arch/arm64/configs/exynos9810-star2lte_defconfig"

      PROFILE:   "${{ inputs.profile }}"
      TOOLCHAIN: "${{ inputs.toolchain }}"

      BRAND:                  "${{ inputs.brand }}"
      BUILD_USER:              "${{ inputs.build_user }}"
      BUILD_HOST:              "${{ inputs.build_host }}"
      BUILD_VERSION:           "${{ inputs.build_version }}"
      KBUILD_BUILD_TIMESTAMP:  "${{ inputs.build_date }}"

      CCACHE_MAXSIZE: "3G"

    steps:

      # ── 0. Workspace & input validation ───────────────────────────────────────
      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          mkdir -p "$LOG_DIR" "$OUT_DIR"

          [[ "$BRAND" == -* ]] \
            || { echo "ERROR: brand input must start with '-' (got: $BRAND)"; exit 1; }
          [[ -n "$BUILD_USER" && -n "$BUILD_HOST" ]] \
            || { echo "ERROR: build_user/build_host must not be empty"; exit 1; }
          [[ -n "$BUILD_VERSION" ]] \
            || { echo "ERROR: build_version must not be empty"; exit 1; }
          case "$PROFILE" in
            cm8|cm8e) ;;
            *) echo "ERROR: unknown profile '$PROFILE'"; exit 1 ;;
          esac
          # ── [CHANGED] clang21-eva-gcc and clang22-eva-gcc added to valid toolchain set ────────────
          case "$TOOLCHAIN" in
            aosp19|aosp20|aosp21|aosp22|neutron19|zyc_stable|clang21-eva-gcc|clang22-eva-gcc) ;;
            *) echo "ERROR: unknown toolchain '$TOOLCHAIN'"; exit 1 ;;
          esac

          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "profile=$PROFILE"
            echo "toolchain=$TOOLCHAIN"
            echo "dry_run=${{ inputs.dry_run }}"
            echo "do_release=${{ inputs.do_release }}"
            echo "force_repatch=${{ inputs.force_repatch }}"
            echo "ksu_repo=${{ inputs.ksu_repo }}"
            echo "ksu_ref=${{ inputs.ksu_ref }}"
            echo "ksu_commit=${{ inputs.ksu_commit }}"
            echo "brand=$BRAND"
            echo "build_user=$BUILD_USER"
            echo "build_host=$BUILD_HOST"
            echo "build_version=$BUILD_VERSION"
            echo "uname_preview=Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VERSION} SMP PREEMPT"
          } | tee "$LOG_DIR/build-inputs.log"

      # ── 1. Dependencies ───────────────────────────────────────────────────────
      # zstd + xz-utils added: Neutron ships .tar.zst, kernel.org Clang 20 ships
      # .tar.xz; both must be extractable regardless of which toolchain is picked.
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            git curl wget aria2 bc flex bison python3 \
            libssl-dev libelf-dev build-essential \
            zip unzip zstd xz-utils lz4 jq \
            ccache \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # ── 1b. ccache setup ──────────────────────────────────────────────────────
      # Cache key includes profile+toolchain — a cm8/aosp21 cache must never be
      # reused for a cm8e/neutron19 build (different CC binary => guaranteed
      # ccache misses anyway, but keeping keys separate avoids cache bloat from
      # one combination evicting another's entries under the shared 3G budget).
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ runner.os }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}
          verbose: 0

      # ── 2. Toolchain Configuration Mapping ────────────────────────────────────
      # Single source of truth for all toolchains. Exports everything the
      # download/extract/build steps need via $GITHUB_ENV so later steps stay
      # toolchain-agnostic (they just read $TC_* / $CC_BIN / etc).
      #
      # Per-toolchain rationale:
      #   aosp19/20/21/22 — Full LLVM=1 (CC/LD/AR/NM/OBJCOPY/OBJDUMP/STRIP all
      #                     from the same AOSP tarball). LLVM_IAS=0: Clang's
      #                     integrated assembler has known incompatibilities with
      #                     inline asm patterns in the Samsung 4.9 BSP tree, so we
      #                     force Clang to emit textual asm and shell out to GNU `as`
      #                     for assembly.
      #   neutron19      — CC from the Neutron tarball, but LD/AR/NM/OBJCOPY/STRIP
      #                     deliberately left on system GNU binutils (aarch64-linux-
      #                     gnu-*), per Project Chimera's original toolchain policy
      #                     (Neutron Clang + system GNU binutils as preferred combo).
      #                     LLVM_IAS=1: Neutron's LLVM 18+ base has a materially
      #                     more mature integrated assembler than AOSP r563880c;
      #                     the 4.9 BSP asm incompatibilities that force IAS=0 on
      #                     AOSP Clang are already patched upstream in Neutron.
      #   zyc_stable     — Mirrors the reference ZyCromerZ sample exactly: CC=clang
      #                     only, full GNU binutils (no LD/AR/NM/OBJCOPY/STRIP
      #                     override — CROSS_COMPILE prefix resolves them).
      #                     LLVM_IAS=0 (same 4.9 BSP asm rationale as AOSP; ZyC has
      #                     no documented IAS fix unlike Neutron). ZyCromerZ/Clang
      #                     publishes rolling dated per-major-version releases with
      #                     no fixed "stable" tag, so the exact tarball URL is
      #                     resolved at runtime via the GitHub Releases API in the
      #                     download step rather than hardcoded here.
      #   clang21-eva-gcc — [NEW] Primary compiler is AOSP Clang 21.0 r563880c
      #                     (same binary as aosp21; distinct TC_CACHE_KEY to prevent
      #                     ccache cross-contamination). Eva GCC (mvaisakh/gcc-arm64
      #                     + mvaisakh/gcc-arm) is a support toolchain downloaded
      #                     separately in step 2d-eva2. TC_USE_FULL_LLVM=true: all
      #                     LD/AR/NM/OBJCOPY/STRIP resolved from the Clang 21
      #                     tarball, not from Eva GCC. LLVM_IAS=0: same 4.9 BSP asm
      #                     incompatibilities as aosp21; with IAS=0, Clang emits
      #                     textual asm and delegates to ${CROSS_COMPILE}as, which
      #                     resolves to Eva GCC's aarch64-elf-as on PATH. This is
      #                     what makes the combo distinct from pure aosp21. Eva GCC
      #                     is NEVER the primary compiler — it only provides the GNU
      #                     assembler and GCC_TOOLCHAIN sysroot compatibility path.
      #                     To extend this pattern to a future Clang 22 + Eva GCC
      #                     combo, duplicate this case, update TC_URL/TC_CACHE_KEY,
      #                     and leave all Eva GCC handling (TC_NEEDS_EVA_GCC, the
      #                     TC_CROSS_COMPILE override) intact in the new case.
      #
      # Cross-compile target prefix exports (TC_CROSS_COMPILE, TC_CROSS_COMPILE_ARM32,
      # TC_CLANG_TRIPLE, TC_NEEDS_EVA_GCC, TC_HOSTCC) are set at the end of this
      # step via post-case defaults. Only clang21-eva-gcc overrides the defaults in
      # its case block; all other cases inherit the standard linux-gnu- prefixes with
      # no changes to their existing case bodies.
      - name: Resolve toolchain configuration
        run: |
          set -Eeuo pipefail
          case "$TOOLCHAIN" in

            aosp19)
              echo "TC_LABEL=AOSP Clang 19 r596125"                                  >> "$GITHUB_ENV"
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/f60b8b55282f002f594f452ce22dfd6cf1fd7e3c/clang-r596125.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                           >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=clang-r596125.tar.gz"                            >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=aosp-clang-r596125-ubuntu-24.04-v1-susfs220"                 >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT=clang-r596125"                                 >> "$GITHUB_ENV"
              echo "TC_USE_FULL_LLVM=true"                                           >> "$GITHUB_ENV"
              echo "TC_LLVM_IAS=0"                                                   >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                        >> "$GITHUB_ENV"
              ;;

            aosp20)
              echo "TC_LABEL=AOSP Clang 20 r547379"                                      >> "$GITHUB_ENV"
              echo "TC_URL=https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                           >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=r547379-master.tar.gz"                       >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=aosp-clang-r547379-ubuntu-24.04-v1"                  >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT=clang-r547379"                            >> "$GITHUB_ENV"
              echo "TC_USE_FULL_LLVM=true"                                           >> "$GITHUB_ENV"
              echo "TC_LLVM_IAS=0"                                                   >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                        >> "$GITHUB_ENV"
              ;;

            aosp21)
              echo "TC_LABEL=AOSP Clang 21.0 r563880c"                               >> "$GITHUB_ENV"
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                           >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=clang-r563880c.tar.gz"                           >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=aosp-clang-r563880c-ubuntu-24.04-v2-susfs220"                >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT=clang-r563880c"                                >> "$GITHUB_ENV"
              echo "TC_USE_FULL_LLVM=true"                                           >> "$GITHUB_ENV"
              echo "TC_LLVM_IAS=0"                                                   >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                        >> "$GITHUB_ENV"
              ;;

            aosp22)
              echo "TC_LABEL=AOSP Clang 22.0.2 r596125 (Build ID: 15071444)"                               >> "$GITHUB_ENV"
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                           >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=clang-r596125.tar.gz"                           >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=aosp-clang-r596125-ubuntu-24.04-v2-susfs220"                >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT=clang-r596125"                                >> "$GITHUB_ENV"
              echo "TC_USE_FULL_LLVM=true"                                           >> "$GITHUB_ENV"
              echo "TC_LLVM_IAS=0"                                                   >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                        >> "$GITHUB_ENV"
              ;;

            neutron19)
              echo "TC_LABEL=Neutron Clang (10032024 catalogue build)"               >> "$GITHUB_ENV"
              echo "TC_URL=https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.zst"                                          >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=neutron-clang-10032024.tar.zst"                  >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=neutron-clang-10032024-ubuntu-24.04-v1-susfs220"             >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT="                                              >> "$GITHUB_ENV"
              # [Neutron-specific] Full-LLVM off: CC only, GNU binutils retained
              echo "TC_USE_FULL_LLVM=false"                                          >> "$GITHUB_ENV"
              echo "TC_LLVM_IAS=1"                                                   >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                        >> "$GITHUB_ENV"
              ;;

            zyc_stable)
              echo "TC_LABEL=ZyCromerZ Clang (latest published release)"             >> "$GITHUB_ENV"
              # Resolved at runtime — see "Resolve ZyCromerZ latest release" step
              echo "TC_URL="                                                         >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                           >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=zyc-clang.tar.gz"                                >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY_PREFIX=zyc-clang-ubuntu-24.04-v1-susfs220"                   >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT="                                              >> "$GITHUB_ENV"
              echo "TC_USE_FULL_LLVM=false"                                          >> "$GITHUB_ENV"
              echo "TC_LLVM_IAS=0"                                                   >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=true"                                         >> "$GITHUB_ENV"
              ;;

            # ── [NEW] clang21-eva-gcc ──────────────────────────────────────────
            # Primary compiler  : AOSP Clang 21.0 r563880c (CC + all LLVM tools).
            # Support toolchain : Eva GCC (mvaisakh/gcc-arm64 + mvaisakh/gcc-arm).
            #   Eva GCC is downloaded in step 2d-eva2 and placed on PATH. It serves
            #   exclusively as the GNU assembler backend (aarch64-elf-as / arm-eabi-as)
            #   when Clang shells out for assembly under LLVM_IAS=0. It is also
            #   provided to Clang via the GCC_TOOLCHAIN make arg (→ --gcc-toolchain
            #   flag), giving Clang access to the Eva GCC sysroot for any GNU
            #   compatibility the Samsung 4.9 BSP headers may require.
            # TC_CACHE_KEY      : Distinct from aosp21 to prevent ccache collision.
            # TC_CROSS_COMPILE  : aarch64-elf- (Eva GCC arm64 target prefix)
            # TC_CROSS_COMPILE_ARM32: arm-eabi- (Eva GCC arm32 target prefix)
            # TC_HOSTCC         : clang — host-side kernel tool compilation via
            #                     Clang 21 rather than system GCC. If host-build
            #                     issues arise, set TC_HOSTCC=gcc in this case.
            # Extending to a future Clang N + Eva GCC combo: duplicate this case,
            # update TC_URL and TC_CACHE_KEY, leave all TC_NEEDS_EVA_GCC / Eva GCC
            # TC_CROSS_COMPILE overrides unchanged.
            clang21-eva-gcc)
              echo "TC_LABEL=AOSP Clang 21.0 r563880c + Eva GCC (mvaisakh aarch64-elf-/arm-eabi-)" >> "$GITHUB_ENV"
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                                >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=clang-r563880c.tar.gz"                               >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=aosp-clang-r563880c-eva-gcc-ubuntu-24.04-v1-susfs220"  >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT=clang-r563880c"                                    >> "$GITHUB_ENV"
              # Full LLVM for LD/AR/NM/OBJCOPY/STRIP — all from the Clang 21 tarball.
              # Eva GCC provides ONLY the assembler backend; it does not own these tools.
              echo "TC_USE_FULL_LLVM=true"                                               >> "$GITHUB_ENV"
              # IAS=0: same Clang r563880c binary as aosp21 → same 4.9 BSP inline asm
              # incompatibilities. With IAS=0, ${CROSS_COMPILE}as (Eva GCC aarch64-elf-as)
              # is the active assembler. Setting IAS=1 here would make Eva GCC redundant.
              echo "TC_LLVM_IAS=0"                                                       >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                            >> "$GITHUB_ENV"
              # Signal steps 2d-eva1/2d-eva2/2e-eva to download and wire Eva GCC.
              # All other toolchains default to false (set in post-case block below).
              TC_NEEDS_EVA_GCC=true
              # Eva GCC target prefixes — override the default linux-gnu- values
              # used by all other toolchains. Set as shell vars here so the post-case
              # default block below can apply ${VAR:-default} for all other cases.
              TC_CROSS_COMPILE=aarch64-elf-
              TC_CROSS_COMPILE_ARM32=arm-eabi-
              # Use Clang 21 as the host-side tool compiler for this toolchain.
              TC_HOSTCC=clang
              ;;

            *)
              echo "ERROR: unhandled toolchain '$TOOLCHAIN' in resolution matrix"; exit 1
              ;;
          esac

            # ── [NEW] clang22-eva-gcc ──────────────────────────────────────────
            # Primary compiler  : AOSP Clang 22.0.2 r596125 (CC + all LLVM tools).
            # Support toolchain : Eva GCC (mvaisakh/gcc-arm64 + mvaisakh/gcc-arm).
            #   Eva GCC is downloaded in step 2d-eva2 and placed on PATH. It serves
            #   exclusively as the GNU assembler backend (aarch64-elf-as / arm-eabi-as)
            #   when Clang shells out for assembly under LLVM_IAS=0. It is also
            #   provided to Clang via the GCC_TOOLCHAIN make arg (→ --gcc-toolchain
            #   flag), giving Clang access to the Eva GCC sysroot for any GNU
            #   compatibility the Samsung 4.9 BSP headers may require.
            # TC_CACHE_KEY      : Distinct from aosp22 to prevent ccache collision.
            # TC_CROSS_COMPILE  : aarch64-elf- (Eva GCC arm64 target prefix)
            # TC_CROSS_COMPILE_ARM32: arm-eabi- (Eva GCC arm32 target prefix)
            # TC_HOSTCC         : clang — host-side kernel tool compilation via
            #                     Clang 22 rather than system GCC. If host-build
            #                     issues arise, set TC_HOSTCC=gcc in this case.
            # Extending to a future Clang N + Eva GCC combo: duplicate this case,
            # update TC_URL and TC_CACHE_KEY, leave all TC_NEEDS_EVA_GCC / Eva GCC
            # TC_CROSS_COMPILE overrides unchanged.
            clang22-eva-gcc)
              echo "TC_LABEL=AOSP Clang 22.0.2 r596125 + Eva GCC (mvaisakh aarch64-elf-/arm-eabi-)" >> "$GITHUB_ENV"
              echo "TC_URL=https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz" >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_FMT=tar.gz"                                                >> "$GITHUB_ENV"
              echo "TC_ARCHIVE_NAME=clang-r596125.tar.gz"                               >> "$GITHUB_ENV"
              echo "TC_CACHE_KEY=aosp-clang-r596125-eva-gcc-ubuntu-24.04-v1-susfs220"  >> "$GITHUB_ENV"
              echo "TC_FLAT_ROOT_HINT=clang-r596125"                                    >> "$GITHUB_ENV"
              # Full LLVM for LD/AR/NM/OBJCOPY/STRIP — all from the Clang 21 tarball.
              # Eva GCC provides ONLY the assembler backend; it does not own these tools.
              echo "TC_USE_FULL_LLVM=true"                                               >> "$GITHUB_ENV"
              # IAS=0: same Clang r596125 binary as aosp21 → same 4.9 BSP inline asm
              # incompatibilities. With IAS=0, ${CROSS_COMPILE}as (Eva GCC aarch64-elf-as)
              # is the active assembler. Setting IAS=1 here would make Eva GCC redundant.
              echo "TC_LLVM_IAS=0"                                                       >> "$GITHUB_ENV"
              echo "TC_DYNAMIC_RESOLVE=false"                                            >> "$GITHUB_ENV"
              # Signal steps 2d-eva1/2d-eva2/2e-eva to download and wire Eva GCC.
              # All other toolchains default to false (set in post-case block below).
              TC_NEEDS_EVA_GCC=true
              # Eva GCC target prefixes — override the default linux-gnu- values
              # used by all other toolchains. Set as shell vars here so the post-case
              # default block below can apply ${VAR:-default} for all other cases.
              TC_CROSS_COMPILE=aarch64-elf-
              TC_CROSS_COMPILE_ARM32=arm-eabi-
              # Use Clang 22 as the host-side tool compiler for this toolchain.
              TC_HOSTCC=clang
              ;;

            *)
              echo "ERROR: unhandled toolchain '$TOOLCHAIN' in resolution matrix"; exit 1
              ;;
          esac

          # ── Unified post-case exports ──────────────────────────────────────────
          # These apply defaults for all vars that the per-toolchain case blocks above
          # do NOT explicitly set. clang21-eva-gcc sets the shell vars TC_NEEDS_EVA_GCC,
          # TC_CROSS_COMPILE, TC_CROSS_COMPILE_ARM32, and TC_HOSTCC above; every other
          # toolchain leaves them unset, and the ${VAR:-default} expansion provides
          # backward-compatible values without touching any existing case body.
          echo "TC_CROSS_COMPILE=${TC_CROSS_COMPILE:-aarch64-linux-gnu-}"             >> "$GITHUB_ENV"
          echo "TC_CROSS_COMPILE_ARM32=${TC_CROSS_COMPILE_ARM32:-arm-linux-gnueabi-}" >> "$GITHUB_ENV"
          echo "TC_CLANG_TRIPLE=${TC_CLANG_TRIPLE:-aarch64-linux-gnu-}"               >> "$GITHUB_ENV"
          echo "TC_NEEDS_EVA_GCC=${TC_NEEDS_EVA_GCC:-false}"                          >> "$GITHUB_ENV"
          echo "TC_HOSTCC=${TC_HOSTCC:-gcc}"                                           >> "$GITHUB_ENV"
          echo "TC_DIR=toolchain" >> "$GITHUB_ENV"
          echo "OK: toolchain configuration resolved for '$TOOLCHAIN'"

      # ── 2b. Dynamic resolution for rolling-release toolchains (ZyC only) ──────
      - name: Resolve ZyCromerZ release (Dynamic or Custom)
        if: ${{ env.TC_DYNAMIC_RESOLVE == 'true' }}
        run: |
          set -Eeuo pipefail

          CUSTOM_URL="${{ inputs.zycromerz_url }}"

          if [[ -n "$CUSTOM_URL" ]]; then
            echo ">> Override active: Resolving custom ZyCromerZ tarball..."
            ASSET_URL="$CUSTOM_URL"
            ASSET_NAME="${ASSET_URL##*/}"

            URL_FINGERPRINT="$(echo -n "$CUSTOM_URL" | md5sum | awk '{print $1}' | cut -c1-8)"
            TAG="custom-${URL_FINGERPRINT}"

            [[ -n "$ASSET_NAME" ]] || { echo "ERROR: could not parse filename from URL"; exit 1; }
          else
            echo ">> Standard protocol: Resolving latest ZyCromerZ release via API..."
            API="https://api.github.com/repos/ZyCromerZ/Clang/releases/latest"
            RESP="$(curl -fsSL -H "Accept: application/vnd.github+json" "$API")"

            RAW_TAG="$(echo "$RESP" | jq -r '.tag_name')"
            ASSET_URL="$(echo "$RESP" | jq -r '[.assets[] | select(.name | endswith(".tar.gz"))][0].browser_download_url')"
            ASSET_NAME="$(echo "$RESP" | jq -r '[.assets[] | select(.name | endswith(".tar.gz"))][0].name')"
            ASSET_ID="$(echo "$RESP" | jq -r '[.assets[] | select(.name | endswith(".tar.gz"))][0].id')"

            [[ -n "$RAW_TAG" && "$RAW_TAG" != "null" ]]     || { echo "ERROR: could not resolve ZyC latest tag"; exit 1; }
            [[ -n "$ASSET_URL" && "$ASSET_URL" != "null" ]] || { echo "ERROR: could not resolve ZyC .tar.gz asset URL"; exit 1; }
            [[ -n "$ASSET_ID" && "$ASSET_ID" != "null" ]]   || { echo "ERROR: could not resolve ZyC asset ID"; exit 1; }

            TAG="${RAW_TAG}-id${ASSET_ID}"
          fi

          echo "TC_URL=$ASSET_URL"                          >> "$GITHUB_ENV"
          echo "TC_ARCHIVE_NAME=$ASSET_NAME"                >> "$GITHUB_ENV"
          echo "TC_LABEL=ZyCromerZ Clang ($TAG)"            >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=${TC_CACHE_KEY_PREFIX}-${TAG}" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=string:${TAG}"         >> "$GITHUB_ENV"

          {
            echo "ZYC_RESOLVED_TAG=$TAG"
            echo "ZYC_RESOLVED_URL=$ASSET_URL"
          } | tee -a "$LOG_DIR/toolchain.log"

      # ── 2c. Cache toolchain (Clang tarball) ───────────────────────────────────
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TC_DIR }}
          key: ${{ env.TC_CACHE_KEY }}

      # ── 2d. Download & extract toolchain (Clang) ──────────────────────────────
      # Archive-format branch handles: .tar.gz (AOSP, ZyC), .tar.xz (korg Clang 20),
      # .tar.zst (Neutron). For clang21-eva-gcc, this step downloads only the Clang
      # 21 tarball. Eva GCC is handled in the dedicated steps 2d-eva1/2d-eva2 below.
      - name: Download & extract toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          [[ -n "$TC_URL" ]] || { echo "ERROR: TC_URL is empty — resolution step did not run or failed"; exit 1; }
          echo "=== Fetching $TC_LABEL ==="
          mkdir -p "$TC_DIR"
          ARCHIVE="$TC_DIR/$TC_ARCHIVE_NAME"

          aria2c -x 16 -s 16 -k 1M --console-log-level=warn -d "$TC_DIR" -o "$TC_ARCHIVE_NAME" "$TC_URL"

          test -s "$ARCHIVE" || { echo "ERROR: downloaded archive is empty: $ARCHIVE"; exit 1; }

          case "$TC_ARCHIVE_FMT" in
            tar.gz)  tar -xzf "$ARCHIVE" -C "$TC_DIR" ;;
            tar.xz)  tar -xJf "$ARCHIVE" -C "$TC_DIR" ;;
            tar.zst) tar --zstd -xf "$ARCHIVE" -C "$TC_DIR" ;;
            *) echo "ERROR: unhandled archive format $TC_ARCHIVE_FMT"; exit 1 ;;
          esac
          rm -f "$ARCHIVE"

          # Flatten one level if the archive extracted into a versioned subdirectory
          # rather than directly into $TC_DIR (AOSP tarballs sometimes do this).
          if [[ ! -x "$TC_DIR/bin/clang" ]]; then
            if [[ -n "$TC_FLAT_ROOT_HINT" && -x "$TC_DIR/$TC_FLAT_ROOT_HINT/bin/clang" ]]; then
              shopt -s dotglob
              mv "$TC_DIR/$TC_FLAT_ROOT_HINT"/* "$TC_DIR/"
              shopt -u dotglob
              rm -rf "$TC_DIR/$TC_FLAT_ROOT_HINT"
            else
              CAND="$(find "$TC_DIR" -mindepth 2 -maxdepth 3 -type f -name clang -path '*/bin/clang' | head -1)"
              if [[ -n "$CAND" ]]; then
                SRC_ROOT="$(dirname "$(dirname "$CAND")")"
                if [[ "$SRC_ROOT" != "$TC_DIR" ]]; then
                  shopt -s dotglob
                  mv "$SRC_ROOT"/* "$TC_DIR/"
                  shopt -u dotglob
                  rm -rf "$SRC_ROOT"
                fi
              fi
            fi
          fi

          test -x "$TC_DIR/bin/clang" \
            || { echo "ERROR: clang binary missing after extract — archive layout unrecognized"; find "$TC_DIR" -maxdepth 3 | head -40; exit 1; }
          "$TC_DIR/bin/clang" --version | tee -a "$LOG_DIR/toolchain.log"
          echo "OK: $TC_LABEL extracted to $TC_DIR/"

      # ── 2d-eva1. [NEW] Cache Eva GCC toolchains (clang21-eva-gcc only) ─────────
      # Caches both the arm64 and arm32 Eva GCC shallow clones together under
      # eva-gcc/. Cache key is fixed and bumped manually (eva-gcc repos are
      # infrequently updated; shallow clones are small enough that a full re-clone
      # on a miss is fast). Bump the v1 suffix to force a fresh clone when a new
      # Eva GCC revision is needed.
      - name: Cache Eva GCC toolchains (clang21/22-eva-gcc only)
        if: ${{ env.TC_NEEDS_EVA_GCC == 'true' }}
        id: cache-eva-gcc
        uses: actions/cache@v4
        with:
          path: eva-gcc
          key: eva-gcc-mvaisakh-arm64arm-ubuntu-24.04-v1

      # ── 2d-eva2. [NEW] Download Eva GCC toolchains (clang21-eva-gcc only) ──────
      # Shallow-clones mvaisakh/gcc-arm64 (aarch64-elf-) and mvaisakh/gcc-arm
      # (arm-eabi-) from GitHub. These are the Eva GCC support toolchains and are
      # used ONLY as:
      #   1. The assembler backend (aarch64-elf-as / arm-eabi-as) when Clang calls
      #      out via ${CROSS_COMPILE}as under LLVM_IAS=0.
      #   2. The GCC_TOOLCHAIN sysroot for Clang's --gcc-toolchain= flag, enabling
      #      GNU-style compatibility discovery without Eva GCC acting as CC.
      # Eva GCC binaries are NOT used for compilation. Clang 21 is the compiler.
      - name: Download Eva GCC toolchains (clang21/22-eva-gcc only)
        if: ${{ env.TC_NEEDS_EVA_GCC == 'true' && steps.cache-eva-gcc.outputs.cache-hit != 'true' }}
        run: |
          set -Eeuo pipefail
          mkdir -p eva-gcc

          echo "=== Cloning Eva GCC arm64 (mvaisakh/gcc-arm64 → aarch64-elf-) ==="
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm64.git eva-gcc/arm64 \
            2>&1 | tail -5

          echo "=== Cloning Eva GCC arm32 (mvaisakh/gcc-arm → arm-eabi-) ==="
          git clone --depth=1 https://github.com/mvaisakh/gcc-arm.git eva-gcc/arm \
            2>&1 | tail -5

          # Sanity: verify expected binaries are present at the known prefix paths.
          test -x eva-gcc/arm64/bin/aarch64-elf-gcc \
            || { echo "ERROR: aarch64-elf-gcc not found — check mvaisakh/gcc-arm64 layout:"; \
                 find eva-gcc/arm64/bin -maxdepth 1 | sort | head -20; exit 1; }
          test -x eva-gcc/arm/bin/arm-eabi-gcc \
            || { echo "ERROR: arm-eabi-gcc not found — check mvaisakh/gcc-arm layout:"; \
                 find eva-gcc/arm/bin -maxdepth 1 | sort | head -20; exit 1; }

          {
            echo "EVA_GCC_ARM64_COMMIT=$(git -C eva-gcc/arm64 rev-parse HEAD)"
            echo "EVA_GCC_ARM32_COMMIT=$(git -C eva-gcc/arm  rev-parse HEAD)"
          } | tee -a "$LOG_DIR/toolchain.log"

          eva-gcc/arm64/bin/aarch64-elf-gcc --version | head -1 | tee -a "$LOG_DIR/toolchain.log"
          eva-gcc/arm/bin/arm-eabi-gcc      --version | head -1 | tee -a "$LOG_DIR/toolchain.log"
          echo "OK: Eva GCC toolchains ready"

      # ── 2e. Export toolchain PATH & resolve tool binary paths ─────────────────
      # Exports CC_BIN/LD_BIN/AR_BIN/NM_BIN/OBJCOPY_BIN/OBJDUMP_BIN/STRIP_BIN as
      # concrete absolute paths so the build step never has to branch on $TOOLCHAIN
      # again — it just uses these variables uniformly. For clang21-eva-gcc, this
      # step handles the Clang 21 binaries only. Eva GCC paths are appended to
      # GITHUB_PATH in the immediately following step 2e-eva.
      - name: Export toolchain PATH & resolve tool binaries
        run: |
          set -Eeuo pipefail
          TC_ABS="$GITHUB_WORKSPACE/$TC_DIR"
          echo "$TC_ABS/bin" >> "$GITHUB_PATH"
          export PATH="$TC_ABS/bin:$PATH"

          echo "CC_BIN=$TC_ABS/bin/clang" >> "$GITHUB_ENV"

          if [[ "$TC_USE_FULL_LLVM" == "true" ]]; then
            # AOSP 19/20/21/22 and clang21-eva-gcc: full LLVM toolchain,
            # all binutils from the Clang tarball.
            echo "LD_BIN=$TC_ABS/bin/ld.lld"          >> "$GITHUB_ENV"
            echo "AR_BIN=$TC_ABS/bin/llvm-ar"          >> "$GITHUB_ENV"
            echo "NM_BIN=$TC_ABS/bin/llvm-nm"          >> "$GITHUB_ENV"
            echo "OBJCOPY_BIN=$TC_ABS/bin/llvm-objcopy" >> "$GITHUB_ENV"
            echo "OBJDUMP_BIN=$TC_ABS/bin/llvm-objdump" >> "$GITHUB_ENV"
            echo "STRIP_BIN=$TC_ABS/bin/llvm-strip"    >> "$GITHUB_ENV"
            echo "MAKE_LLVM_FLAG=1"                    >> "$GITHUB_ENV"
          else
            # neutron19 / zyc_stable: CC from tarball, binutils from system GNU
            # cross-toolchain installed in step 1 (gcc-aarch64-linux-gnu package
            # provides aarch64-linux-gnu-{ld,ar,nm,objcopy,objdump,strip}).
            echo "LD_BIN=aarch64-linux-gnu-ld"          >> "$GITHUB_ENV"
            echo "AR_BIN=aarch64-linux-gnu-ar"           >> "$GITHUB_ENV"
            echo "NM_BIN=aarch64-linux-gnu-nm"           >> "$GITHUB_ENV"
            echo "OBJCOPY_BIN=aarch64-linux-gnu-objcopy" >> "$GITHUB_ENV"
            echo "OBJDUMP_BIN=aarch64-linux-gnu-objdump" >> "$GITHUB_ENV"
            echo "STRIP_BIN=aarch64-linux-gnu-strip"     >> "$GITHUB_ENV"
            echo "MAKE_LLVM_FLAG=0"                      >> "$GITHUB_ENV"
          fi
          echo "LLVM_IAS_VALUE=$TC_LLVM_IAS" >> "$GITHUB_ENV"

          echo "=== Verifying Compiler Binaries — $TC_LABEL ==="
          clang --version
          "$TC_ABS/bin/clang" --version
          if [[ "$TC_USE_FULL_LLVM" == "true" ]]; then
            ld.lld --version || true
          else
            aarch64-linux-gnu-ld --version | head -1 || true
          fi
          echo "=== ccache wrap check ==="
          ccache --version | head -1
          ccache "$TC_ABS/bin/clang" --version | head -1
          ccache --show-stats || true
          {
            echo "toolchain=$TC_LABEL"
            echo "full_llvm=$TC_USE_FULL_LLVM"
            echo "llvm_ias=$TC_LLVM_IAS"
            echo "cross_compile=$TC_CROSS_COMPILE"
            echo "cross_compile_arm32=$TC_CROSS_COMPILE_ARM32"
            echo "hostcc=$TC_HOSTCC"
          } | tee -a "$LOG_DIR/toolchain.log"

      # ── 2e-eva. [NEW] Export Eva GCC paths and set GCC_TOOLCHAIN ──────────────
      # Adds Eva GCC arm64 and arm32 bin directories to GITHUB_PATH and exports
      # GCC_TOOLCHAIN (arm64 sysroot dir) for the build step's make array.
      # GCC_TOOLCHAIN is passed explicitly as a make argument → Clang picks it up
      # in scripts/Makefile.clang as --gcc-toolchain=<path>.
      # This step runs only for clang21-eva-gcc; for all other toolchains
      # GCC_TOOLCHAIN remains unset and the make array appends nothing.
      - name: Export Eva GCC paths and set GCC_TOOLCHAIN (clang21-eva-gcc only)
        if: ${{ env.TC_NEEDS_EVA_GCC == 'true' }}
        run: |
          set -Eeuo pipefail
          EVA64="$GITHUB_WORKSPACE/eva-gcc/arm64"
          EVA32="$GITHUB_WORKSPACE/eva-gcc/arm"

          test -d "$EVA64/bin" \
            || { echo "ERROR: eva-gcc/arm64/bin missing — was download step skipped or cache broken?"; exit 1; }
          test -d "$EVA32/bin" \
            || { echo "ERROR: eva-gcc/arm/bin missing — was download step skipped or cache broken?"; exit 1; }

          # Add both Eva GCC bin dirs to PATH. They come after the Clang 21 bin dir
          # (already on PATH from step 2e), so ${CROSS_COMPILE}clang would resolve to
          # the Clang binary (not Eva GCC's gcc) if something mistakenly calls it.
          echo "$EVA64/bin" >> "$GITHUB_PATH"
          echo "$EVA32/bin" >> "$GITHUB_PATH"

          # GCC_TOOLCHAIN: points to the arm64 Eva GCC sysroot. Passed as a make
          # argument in step 10 to supply Clang's --gcc-toolchain= flag.
          # GCC_TOOLCHAIN_ARM32 is informational only — kbuild resolves the arm32
          # assembler via ${CROSS_COMPILE_ARM32}as on PATH without a separate var.
          echo "GCC_TOOLCHAIN=$EVA64"      >> "$GITHUB_ENV"
          echo "GCC_TOOLCHAIN_ARM32=$EVA32" >> "$GITHUB_ENV"

          echo "=== Eva GCC path verification ==="
          export PATH="$EVA64/bin:$EVA32/bin:$PATH"

          which aarch64-elf-gcc   || { echo "ERROR: aarch64-elf-gcc not on PATH"; exit 1; }
          which aarch64-elf-as    || { echo "ERROR: aarch64-elf-as  not on PATH"; exit 1; }
          which arm-eabi-gcc      || { echo "ERROR: arm-eabi-gcc     not on PATH"; exit 1; }
          which arm-eabi-as       || { echo "ERROR: arm-eabi-as      not on PATH"; exit 1; }

          aarch64-elf-gcc --version | head -1
          arm-eabi-gcc    --version | head -1

          {
            echo "GCC_TOOLCHAIN=$EVA64"
            echo "GCC_TOOLCHAIN_ARM32=$EVA32"
            echo "EVA_GCC_AS_ARM64=$(which aarch64-elf-as)"
            echo "EVA_GCC_AS_ARM32=$(which arm-eabi-as)"
          } | tee -a "$LOG_DIR/toolchain.log"
          echo "OK: Eva GCC paths exported and verified"

      # ── 3. Source Assembly: Clone kernel tree ─────────────────────────────────
      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" "$KERNEL_DIR"
          git -C "$KERNEL_DIR" log --oneline -5 | tee "$LOG_DIR/kernel-revision.log"
          echo "OK: kernel tree cloned (branch: $KERNEL_BRANCH)"

      # ── 3b. Source Assembly: Clone SUSFS (kernel-tree files only) ─────────────
      - name: Clone SUSFS (kernel-tree files; pinned)
        run: |
          set -Eeuo pipefail
          SUSFS_URL="${{ inputs.susfs_repo }}"
          SUSFS_REF="${{ inputs.susfs_ref }}"
          SUSFS_COMMIT="${{ inputs.susfs_commit }}"
          [[ "$SUSFS_URL" =~ ^https:// ]] \
            || { echo "ERROR: SUSFS URL must use https://"; exit 1; }
          [[ "$SUSFS_URL" =~ [[:space:]] ]] \
            && { echo "ERROR: SUSFS URL contains whitespace"; exit 1; }
          if [[ -n "$SUSFS_COMMIT" && ! "$SUSFS_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: susfs_commit must be a full 40-char SHA"; exit 1
          fi
          git clone --filter=blob:none --no-tags "$SUSFS_URL" susfs4ksu
          if [[ -n "$SUSFS_COMMIT" ]]; then
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_COMMIT"
            git -C susfs4ksu checkout --detach "$SUSFS_COMMIT"
          else
            git -C susfs4ksu fetch --depth=1 origin "$SUSFS_REF"
            git -C susfs4ksu checkout --detach FETCH_HEAD
          fi
          RESOLVED="$(git -C susfs4ksu rev-parse HEAD)"
          {
            echo "SUSFS_URL=$SUSFS_URL"
            echo "SUSFS_REF=${SUSFS_REF:-none}"
            echo "SUSFS_COMMIT_INPUT=${SUSFS_COMMIT:-none}"
            echo "SUSFS_COMMIT_RESOLVED=$RESOLVED"
          } | tee "$LOG_DIR/susfs-revision.log"
          MISSING=0
          for f in \
            "kernel_patches/50_add_susfs_in_kernel-4.9.patch" \
            "kernel_patches/fs/susfs.c" \
            "kernel_patches/fs/sus_su.c" \
            "kernel_patches/include/linux/susfs.h" \
            "kernel_patches/include/linux/susfs_def.h" \
            "kernel_patches/include/linux/sus_su.h"; do
            [[ -f "susfs4ksu/$f" ]] || { echo "ERROR: susfs4ksu/$f missing"; MISSING=1; }
          done
          [[ "$MISSING" -eq 0 ]] || { echo "Aborting: required SUSFS files absent"; exit 1; }
          echo "OK: all required SUSFS kernel-tree files present"
          ACTUAL_VER="$(grep -oP 'SUSFS_VERSION\s+"\K[^"]+' \
            susfs4ksu/kernel_patches/include/linux/susfs.h 2>/dev/null || echo 'unknown')"
          echo "SUSFS_ACTUAL_VERSION=$ACTUAL_VER" | tee -a "$LOG_DIR/susfs-revision.log"
          if [[ "$ACTUAL_VER" == "$SUSFS_TARGET_VERSION" ]]; then
            echo "OK: SUSFS version confirmed: $ACTUAL_VER"
          else
            echo "WARN: SUSFS version is '$ACTUAL_VER', expected '$SUSFS_TARGET_VERSION' — continuing"
          fi

      # ── 3c. Source Assembly: Set up KernelSU-Next (pinned) ────────────────────
      - name: Set up KernelSU-Next (pinned)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          git rm -r --cached KernelSU-Next 2>/dev/null || true
          rm -rf .git/modules/KernelSU-Next KernelSU-Next drivers/kernelsu
          KSU_URL="${{ inputs.ksu_repo }}"
          KSU_REF="${{ inputs.ksu_ref }}"
          KSU_COMMIT="${{ inputs.ksu_commit }}"
          [[ "$KSU_URL" =~ ^https:// ]] \
            || { echo "ERROR: KSU URL must use https://"; exit 1; }
          [[ "$KSU_URL" =~ [[:space:]] ]] \
            && { echo "ERROR: KSU URL contains whitespace"; exit 1; }
          if [[ -z "$KSU_COMMIT" && -z "$KSU_REF" ]]; then
            echo "ERROR: both ksu_commit and ksu_ref are blank — provide at least one"; exit 1
          fi
          if [[ -n "$KSU_COMMIT" && ! "$KSU_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: ksu_commit must be a full 40-char SHA"; exit 1
          fi
          git clone --filter=blob:none --no-tags "$KSU_URL" KernelSU-Next
          if [[ -n "$KSU_COMMIT" ]]; then
            git -C KernelSU-Next fetch --depth=1 origin "$KSU_COMMIT"
            git -C KernelSU-Next checkout --detach "$KSU_COMMIT"
            echo "INFO: KSU pinned to commit $KSU_COMMIT"
          else
            git -C KernelSU-Next fetch --depth=1 origin "$KSU_REF"
            git -C KernelSU-Next checkout --detach FETCH_HEAD
            echo "WARN: KSU tracking ref tip of $KSU_REF — not reproducible"
          fi
          RESOLVED_KSU_COMMIT="$(git -C KernelSU-Next rev-parse HEAD)"
          {
            echo "KSU_URL=$KSU_URL"
            echo "KSU_REF=${KSU_REF:-none}"
            echo "KSU_COMMIT_INPUT=${KSU_COMMIT:-none}"
            echo "KSU_COMMIT_RESOLVED=$RESOLVED_KSU_COMMIT"
          } | tee "../$LOG_DIR/ksu-submodule.log"
          test -f KernelSU-Next/kernel/Kconfig \
            || { echo "ERROR: KernelSU-Next/kernel/Kconfig missing"; exit 1; }
          if grep -qE '^[[:space:]]*config[[:space:]]+KSU_SUSFS' KernelSU-Next/kernel/Kconfig; then
            echo "OK: SUSFS confirmed native in KernelSU-Next/kernel/Kconfig"
            echo "KSU_SUSFS_NATIVE=true" >> "$GITHUB_ENV"
          else
            echo "WARN: KernelSU-Next/kernel/Kconfig has no 'config KSU_SUSFS' entry."
            echo "KSU_SUSFS_NATIVE=false" >> "$GITHUB_ENV"
          fi
          git -C KernelSU-Next log --oneline -1 | tee -a "../$LOG_DIR/ksu-submodule.log"
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          test -f drivers/kernelsu/Kconfig \
            || { echo "ERROR: drivers/kernelsu/Kconfig symlink broken"; exit 1; }
          echo "OK: KernelSU-Next wired at drivers/kernelsu"

      # ── 3d. Samsung 4.9 BSP fix: syscall_fn_t typedef ─────────────────────────
      - name: Fix syscall_fn_t typedef (Samsung 4.9 BSP pointer-type fix)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          HOOK_H="KernelSU-Next/kernel/hook/syscall_hook.h"
          if [[ ! -f "$HOOK_H" ]] || ! grep -q 'syscall_fn_t' "$HOOK_H"; then
            echo "INFO: syscall_fn_t — nothing to fix (KSU source may have pre-applied)"; exit 0
          fi
          printf '%s\n' \
            'from pathlib import Path' \
            'import re' \
            'path = Path("KernelSU-Next/kernel/hook/syscall_hook.h")' \
            'if not path.exists(): raise SystemExit(0)' \
            'content = path.read_text()' \
            'typedef = (' \
            '    "/* syscall_fn_t: Samsung 4.9 BSP compatibility */\n"' \
            '    "typedef long (*syscall_fn_t)(\n"' \
            '    "    unsigned long, unsigned long, unsigned long,\n"' \
            '    "    unsigned long, unsigned long, unsigned long\n"' \
            '    ");\n\n"' \
            ')' \
            'pos = 0' \
            'for m in re.finditer(r"^#(include|pragma|ifndef|define)[^\n]*\n", content, re.MULTILINE):' \
            '    pos = m.end()' \
            'if "typedef long (*syscall_fn_t)" not in content:' \
            '    path.write_text(content[:pos] + typedef + content[pos:])' \
            '    print("OK: syscall_fn_t typedef injected")' \
            'else:' \
            '    print("OK: syscall_fn_t already present (idempotent)")' \
            > /tmp/fix_syscall_fn_t.py
          python3 /tmp/fix_syscall_fn_t.py

      # ── 3e-pre. Guard sus_memfd in supercall.c ─────────────────────────────────
      - name: Guard sus_memfd in supercall.c (excluded feature stub-out)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          SUPERCALL="KernelSU-Next/kernel/supercall/supercall.c"
          if [[ ! -f "$SUPERCALL" ]]; then
            echo "INFO: $SUPERCALL not found — skipping"; exit 0
          fi
          if ! grep -q 'CMD_SUSFS_ADD_SUS_MEMFD' "$SUPERCALL"; then
            echo "INFO: CMD_SUSFS_ADD_SUS_MEMFD not present — no guard needed"; exit 0
          fi
          echo "" | base64 -d > /tmp/guard_sus_memfd.py
          python3 /tmp/guard_sus_memfd.py

      # ── 3e. Preflight: detect pre-integrated KSU/SUSFS ────────────────────────
      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/preflight.log"
          echo "=== Preflight — Chimera Mk8 [$PROFILE / $TOOLCHAIN] ===" | tee "$LOG"
          git status --short | tee -a "$LOG"
          echo "=== KSU/SUSFS markers ===" | tee -a "$LOG"
          grep -RsnE \
            'KernelSU|kernelsu|CONFIG_KSU|susfs_task_state|ksu_handle_faccessat' \
            fs include kernel arch/arm64/configs 2>/dev/null \
            | tee -a "$LOG" || true
          ALREADY_PATCHED=false
          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|ksu_handle_faccessat|susfs_task_state' \
            fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi
          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "$LOG"
          if [[ "$ALREADY_PATCHED" == "true" && \
                "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true"  >> "$GITHUB_ENV"
            echo "INFO: tree already has KSU/SUSFS markers — skipping patch application"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi

      # ── 4. Surgical Patching: Wire KernelSU Kconfig ───────────────────────────
      - name: Wire KernelSU Kconfig
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          sed -i '/source "drivers\/kernelsu\/Kconfig"/d' drivers/Kconfig
          if ! grep -q '^endmenu' drivers/Kconfig; then
            printf '\nendmenu\n' >> drivers/Kconfig
          fi
          sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'obj-y += kernelsu/' drivers/Makefile \
            || echo 'obj-y += kernelsu/' >> drivers/Makefile
          COUNT="$(grep -c 'drivers/kernelsu/Kconfig' drivers/Kconfig || true)"
          [[ "$COUNT" -eq 1 ]] \
            || { echo "ERROR: Expected 1 Kconfig entry, found $COUNT"; exit 1; }
          echo "OK: KernelSU Kconfig wired (count=$COUNT)"

      # ── 4b. Surgical Patching: Apply SUSFS kernel patch ───────────────────────
      - name: Apply SUSFS kernel patch (kernel-tree side only)
        if: ${{ env.SKIP_INTEGRATION == 'false' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"
          set +e
          git apply --reject --whitespace=fix "$PATCH" \
            > "../$LOG_DIR/susfs-apply.log" 2>&1
          RC=$?
          set -e
          find . -name '*.rej' -print | sort > "../$LOG_DIR/susfs-rejects.log" || true
          echo "Apply RC=$RC" | tee -a "../$LOG_DIR/susfs-apply.log"
          [[ "$RC" -eq 0 ]] \
            && echo "OK: SUSFS kernel patch applied cleanly" \
            || echo "WARN: git apply had conflicts — step 4c will install files directly"

      # ── 4c. Surgical Patching: Guarantee SUSFS kernel-tree files present ──────
      - name: Guarantee SUSFS kernel-tree files present
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-guarantee.log"
          echo "=== SUSFS file guarantee ===" | tee "$LOG"
          SRC="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches"
          for pair in "fs/susfs.c:fs/susfs.c" "fs/sus_su.c:fs/sus_su.c"; do
            DST="${pair##*:}"; FROM="$SRC/${pair%%:*}"
            if [[ ! -f "$DST" ]]; then
              install -m 0644 "$FROM" "$DST"
              echo "OK: installed $DST" | tee -a "$LOG"
            else
              echo "INFO: $DST present ($(wc -l < "$DST") lines) — preserved" | tee -a "$LOG"
            fi
          done
          for hdr in \
            "include/linux/susfs.h" \
            "include/linux/susfs_def.h" \
            "include/linux/sus_su.h"; do
            if [[ ! -f "$hdr" ]]; then
              PATCH_SRC="$SRC/$hdr"
              if [[ -f "$PATCH_SRC" ]]; then
                install -m 0644 "$PATCH_SRC" "$hdr"
                echo "OK: installed $hdr" | tee -a "$LOG"
              else
                echo "FAIL: $hdr missing from patch source" | tee -a "$LOG"
              fi
            else
              echo "INFO: $hdr present ($(wc -l < "$hdr") lines) — preserved" | tee -a "$LOG"
            fi
          done
          grep -q 'susfs\.o'  fs/Makefile \
            || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o'  >> fs/Makefile
          grep -q 'sus_su\.o' fs/Makefile \
            || echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile
          sed -i '/ccflags-.*CONFIG_KSU_SUSFS.*selinux/d' fs/Makefile
          echo 'ccflags-$(CONFIG_KSU_SUSFS) += -Isecurity/selinux -Isecurity/selinux/include' \
            >> fs/Makefile
          echo "OK: fs/Makefile wired" | tee -a "$LOG"
          FAIL=0
          for f in \
            fs/susfs.c fs/sus_su.c \
            include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h; do
            [[ -f "$f" ]] \
              && echo "OK: $f" | tee -a "$LOG" \
              || { echo "FAIL: $f MISSING" | tee -a "$LOG"; FAIL=1; }
          done
          [[ "$FAIL" -eq 0 ]] \
            || { echo "ERROR: missing SUSFS files"; exit 1; }

      # ── 4d. Surgical Patching: KernelSU Header Surgery ────────────────────────
      - name: KernelSU Header Surgery
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p include/kernelsu
          # Surgery A — normalize SUSFS include paths
          find include fs -type f \( -name '*.h' -o -name '*.c' \) \
            -exec sed -i \
              -e 's|#include "../../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' \
              -e 's|#include "../drivers/kernelsu/\(.*\)"|#include <kernelsu/\1>|g' \
            {} +
          echo "OK [Surgery A]: SUSFS include namespace normalized"
          # Surgery B — export real KernelSU public headers
          printf '%s\n' \
            'import sys' \
            'from pathlib import Path' \
            '' \
            'def export_header(name):' \
            '    matches = [p for p in Path("KernelSU-Next").rglob(name)' \
            '               if "/include/" not in str(p)]' \
            '    dst = Path("include/kernelsu") / name' \
            '    if not matches:' \
            '        print(f"WARN: {name} not found — generating fallback")' \
            '        dst.write_text(f"#pragma once\n/* Auto-generated fallback for {name} */\n")' \
            '        return' \
            '    src = matches[0]' \
            '    content = src.read_text()' \
            '    content = "\n".join(' \
            '        l for l in content.splitlines()' \
            '        if "drivers/kernelsu" not in l and "<kernelsu/" not in l' \
            '    )' \
            '    dst.write_text(content)' \
            '    print(f"OK [Surgery B]: exported {name}")' \
            '' \
            'for h in ("core_hook.h", "kernel_compat.h", "ksu.h", "sucompat.h"):' \
            '    export_header(h)' \
            > /tmp/export_headers.py
          python3 /tmp/export_headers.py
          # Surgery C — kernel-safe ksu.h shim
          printf '%s\n' \
            '#pragma once' \
            '/* Kernel-safe shim for Mk8 Unified — replaces upstream ksu.h */' \
            '#include <linux/types.h>' \
            '#include <linux/cred.h>' \
            '#include <linux/sched.h>' \
            '#include <linux/uaccess.h>' \
            '' \
            'extern const struct cred *ksu_cred;' \
            > include/kernelsu/ksu.h
          echo "OK [Surgery C]: kernel-safe ksu.h installed"
          # Surgery D — ksu_cred extern in shared headers
          for hdr in \
            include/kernelsu/core_hook.h \
            include/kernelsu/kernel_compat.h; do
            if [[ -f "$hdr" ]] && ! grep -q 'ksu_cred' "$hdr"; then
              printf '\nextern const struct cred *ksu_cred;\n' >> "$hdr"
              echo "OK [Surgery D]: ksu_cred added to $hdr"
            fi
          done
          # Validation
          FAIL=0
          for f in \
            include/kernelsu/core_hook.h \
            include/kernelsu/kernel_compat.h \
            include/kernelsu/ksu.h; do
            [[ -f "$f" ]] && echo "OK: $f" || { echo "FAIL: missing $f"; FAIL=1; }
          done
          if grep -R '../../drivers/kernelsu' include fs 2>/dev/null; then
            echo "FAIL: stale relative KernelSU paths remain"; FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || { echo "FATAL: KernelSU header surgery failed"; exit 1; }
          echo "OK: KernelSU header surgery complete"

      # ── 4e. Surgical Patching: Inject SUSFS prctl bridge ──────────────────────
      - name: Inject SUSFS prctl bridge
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'import re, sys' \
            'from pathlib import Path' \
            'MARKER = "CHIMERA_MK8_UNIFIED_SUSFS_PRCTL_BRIDGE"' \
            '' \
            'susfs_h   = Path("include/linux/susfs.h")' \
            'susfs_def = Path("include/linux/susfs_def.h")' \
            'if not susfs_h.exists():' \
            '    print("FAIL: include/linux/susfs.h missing"); sys.exit(1)' \
            '' \
            'scan_src = susfs_def.read_text() if susfs_def.exists() else susfs_h.read_text()' \
            'cmd_ids  = re.findall(' \
            '    r"#define\s+(CMD_SUSFS_\w+|SUSFS_CMD_\w+)\s+(0x[0-9a-fA-F]+|\d+)", scan_src)' \
            'if not cmd_ids:' \
            '    print("WARN: no CMD_SUSFS_* constants found — bridge skipped"); sys.exit(0)' \
            '' \
            'vals    = [int(v, 0) for _, v in cmd_ids]' \
            'cmd_min = min(vals); cmd_max = max(vals)' \
            'show_ver_fn  = next(' \
            '    (fn for fn in re.findall(r"(?:int|bool|void)\s+(susfs_\w+)\s*\(", susfs_h.read_text())' \
            '     if "version" in fn.lower()), None)' \
            'show_ver_cmd = next((c for c in cmd_ids if "SHOW_VERSION" in c[0]), None)' \
            'print(f"INFO: cmd range=[{hex(cmd_min)}, {hex(cmd_max)}] ShowVersion={show_ver_cmd}")' \
            '' \
            'dispatch = (' \
            '    f"\tif (option == {show_ver_cmd[1]}) {{\n"' \
            '    f"\t\t{show_ver_fn}((void __user *)arg2); return 0;\n\t}}\n"' \
            '    if (show_ver_cmd and show_ver_fn) else "\t/* show_version not resolved */\n"' \
            ')' \
            'bridge = (' \
            '    f"\n/* Chimera Mk8 Unified SUSFS prctl bridge ({MARKER}) */\n"' \
            '    f"#ifndef {MARKER}\n#define {MARKER} 1\n#ifdef CONFIG_KSU_SUSFS\n"' \
            '    "int ksu_susfs_handle_prctl(unsigned long option, unsigned long arg2,\n"' \
            '    "    unsigned long arg3, unsigned long arg4, unsigned long arg5)\n{\n"' \
            '    + dispatch +' \
            '    "\treturn -EINVAL;\n}\n"' \
            '    "EXPORT_SYMBOL_GPL(ksu_susfs_handle_prctl);\n"' \
            '    f"#endif\n#endif\n"' \
            ')' \
            '' \
            'susfs_c = Path("fs/susfs.c")' \
            'if susfs_c.exists():' \
            '    txt = susfs_c.read_text()' \
            '    if MARKER not in txt:' \
            '        susfs_c.write_text(txt + bridge)' \
            '        print("OK: bridge appended to fs/susfs.c")' \
            '    else:' \
            '        print("OK: bridge already present (idempotent)")' \
            '' \
            'sys_c = Path("kernel/sys.c")' \
            'if not sys_c.exists():' \
            '    print("WARN: kernel/sys.c not found — prctl injection skipped"); sys.exit(0)' \
            'txt = sys_c.read_text(errors="replace")' \
            'if MARKER in txt:' \
            '    print("OK: sys.c already injected (idempotent)"); sys.exit(0)' \
            '' \
            'm = re.search(r"(SYSCALL_DEFINE5\s*\(\s*prctl\b[^{]+\{)", txt, re.DOTALL)' \
            'if not m:' \
            '    print("WARN: SYSCALL_DEFINE5(prctl) not found"); sys.exit(0)' \
            '' \
            'insert_after = m.end()' \
            'logic = re.search(r"\n\s*(error\s*=|switch\s*\(|if\s*\(|return\b)", txt[insert_after:])' \
            'pos = insert_after + (logic.start() if logic else 0)' \
            'snippet = (' \
            '    f"\n\t/* Chimera Mk8 Unified: SUSFS prctl bridge ({MARKER}) */\n"' \
            '    "#ifdef CONFIG_KSU_SUSFS\n"' \
            '    f"\tif ((unsigned long)option >= {hex(cmd_min)}UL &&\n"' \
            '    f"\t    (unsigned long)option <= {hex(cmd_max)}UL) {{\n"' \
            '    "\t\textern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"' \
            '    "\t\t    unsigned long, unsigned long, unsigned long);\n"' \
            '    "\t\tint __r = ksu_susfs_handle_prctl(\n"' \
            '    "\t\t    (unsigned long)option, (unsigned long)arg2,\n"' \
            '    "\t\t    (unsigned long)arg3, (unsigned long)arg4,\n"' \
            '    "\t\t    (unsigned long)arg5);\n"' \
            '    "\t\tif (__r != -EINVAL) return (long)__r;\n"' \
            '    "\t}\n#endif\n"' \
            ')' \
            'sys_c.write_text(txt[:pos] + snippet + txt[pos:])' \
            'print("OK: SUSFS dispatch injected into kernel/sys.c")' \
            '' \
            'DECL_MARKER = MARKER + "_DECL"' \
            'h_text = susfs_h.read_text()' \
            'if DECL_MARKER not in h_text:' \
            '    susfs_h.write_text(h_text + (' \
            '        f"\n#ifndef {DECL_MARKER}\n#define {DECL_MARKER} 1\n"' \
            '        "#ifdef CONFIG_KSU_SUSFS\n"' \
            '        "extern int ksu_susfs_handle_prctl(unsigned long, unsigned long,\n"' \
            '        "    unsigned long, unsigned long, unsigned long);\n"' \
            '        f"#endif\n#endif\n"' \
            '    ))' \
            '    print("OK: extern declaration added to susfs.h")' \
            'print("Bridge injection complete.")' \
            > /tmp/inject_prctl_bridge.py
          python3 /tmp/inject_prctl_bridge.py

      # ── 4f. Surgical Patching: Weak symbol fallbacks for sus_su.c ─────────────
      - name: Inject weak symbol fallbacks into sus_su.c
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          printf '%s\n' \
            'from pathlib import Path' \
            'target = Path("fs/sus_su.c")' \
            'if not target.exists():' \
            '    print("INFO: fs/sus_su.c not found — skipping"); raise SystemExit(0)' \
            'content = target.read_text()' \
            'if "WEAK_SYMBOL_FALLBACK" in content:' \
            '    print("OK: weak fallbacks already present (idempotent)"); raise SystemExit(0)' \
            'fallback = (' \
            '    "\n/* === WEAK_SYMBOL_FALLBACK === */\n"' \
            '    "#include <linux/cred.h>\n"' \
            '    "#include <linux/uidgid.h>\n"' \
            '    "#include <linux/capability.h>\n\n"' \
            '    "#ifndef cap_set_full\n"' \
            '    "#define cap_set_full(c) do { (c) = CAP_FULL_SET; } while (0)\n"' \
            '    "#endif\n\n"' \
            '    "__attribute__((weak)) bool susfs_is_allow_su(void) { return false; }\n\n"' \
            '    "__attribute__((weak)) void ksu_escape_to_root(void) {\n"' \
            '    "    struct cred *nc = prepare_creds();\n"' \
            '    "    if (!nc) return;\n"' \
            '    "    nc->uid   = nc->euid  = nc->suid  = nc->fsuid = GLOBAL_ROOT_UID;\n"' \
            '    "    nc->gid   = nc->egid  = nc->sgid  = nc->fsgid = GLOBAL_ROOT_GID;\n"' \
            '    "    cap_set_full(nc->cap_inheritable);\n"' \
            '    "    cap_set_full(nc->cap_permitted);\n"' \
            '    "    cap_set_full(nc->cap_effective);\n"' \
            '    "    cap_set_full(nc->cap_bset);\n"' \
            '    "    commit_creds(nc);\n}\n"' \
            '    "/* ========================== */\n"' \
            ')' \
            'target.write_text(content + fallback)' \
            'print("OK: weak symbol fallbacks injected into fs/sus_su.c")' \
            > /tmp/inject_weak_fallbacks.py
          python3 /tmp/inject_weak_fallbacks.py

      # ── 4g. Surgical Patching: namei.c dentry redefinition ────────────────────
      - name: Fix namei.c dentry redefinition (SUSFS/QPR2 merge collision)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          FILE="fs/namei.c"
          LINE=2234
          CONTENT="$(sed -n "${LINE}p" "$FILE")"
          if [[ "$CONTENT" =~ ^[[:space:]]*struct[[:space:]]+dentry[[:space:]]*\*dentry\;[[:space:]]*$ ]]; then
            sed -i "${LINE}s|^|// |" "$FILE"
            echo "OK: commented out redundant bare 'dentry' decl at $FILE:$LINE"
          else
            echo "WARN: $FILE:$LINE content unexpected — skipping blind-patch"
            echo "  got: '$CONTENT'"
            echo "  This likely means the duplicate moved, was fixed upstream, or"
            echo "  never existed on this tree revision. Not treated as fatal."
          fi
          sed -n '2230,2242p' "$FILE" | tee -a "../$LOG_DIR/namei-fix.log" || true

      # ── 5. Profile & Identity Injection: shared FORTe defconfig baseline ──────
      - name: Apply defconfig tuning (FORTe Mode — shared baseline)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          test -f "$DEFCONFIG" || { echo "ERROR: $DEFCONFIG not found"; exit 1; }
          LOG="../$LOG_DIR/defconfig-forte.log"
          : > "$LOG"

          set_cfg() {
            local k="$1"; local v="$2"
            sed -i "/^${k}=.*/d;/^# ${k} is not set/d" "$DEFCONFIG"
            echo "${k}=${v}" >> "$DEFCONFIG"
          }
          unset_cfg() {
            local k="$1"
            sed -i "/^${k}=.*/d;/^# ${k} is not set/d" "$DEFCONFIG"
            echo "# ${k} is not set" >> "$DEFCONFIG"
          }
          probe_kconfig() {
            grep -qE "^[[:space:]]*config[[:space:]]+${1#CONFIG_}[[:space:]]*$" \
              KernelSU-Next/kernel/Kconfig 2>/dev/null
          }

          echo "=== FORTe Mode: shared baseline start [$PROFILE] ===" | tee -a "$LOG"

          set_cfg CONFIG_PREEMPT y
          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY
          unset_cfg CONFIG_HZ_100
          unset_cfg CONFIG_HZ_250
          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300

          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_TCP_CONG_CUBIC y
          sed -i '/CONFIG_DEFAULT_TCP_CONG/d' "$DEFCONFIG"
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> "$DEFCONFIG"

          set_cfg CONFIG_SCHED_DEBUG y
          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y
          set_cfg CONFIG_CRYPTO_LZ4 y
          set_cfg CONFIG_CRYPTO_LZ4HC y

          set_cfg CONFIG_PRINTK y
          set_cfg CONFIG_PRINTK_SAFE_LOG_BUF y
          set_cfg CONFIG_CONSOLE_LOGLEVEL_DEFAULT 3
          set_cfg CONFIG_MESSAGE_LOGLEVEL_DEFAULT 3
          set_cfg CONFIG_DEFAULT_MESSAGE_LOGLEVEL 3
          unset_cfg CONFIG_PRINTK_TIME
          unset_cfg CONFIG_PRINTK_CALLER
          unset_cfg CONFIG_DYNAMIC_DEBUG
          unset_cfg CONFIG_DYNAMIC_DEBUG_CORE
          unset_cfg CONFIG_DEBUG_FS
          set_cfg CONFIG_LOG_BUF_SHIFT 18

          unset_cfg CONFIG_CC_STACKPROTECTOR_STRONG
          unset_cfg CONFIG_CC_STACKPROTECTOR_REGULAR
          set_cfg CONFIG_CC_STACKPROTECTOR_NONE y
          unset_cfg CONFIG_LOCALVERSION_AUTO

          set_cfg CONFIG_BPF_SYSCALL y
          set_cfg CONFIG_CGROUP_BPF y
          set_cfg CONFIG_NET_CLS_BPF y
          set_cfg CONFIG_FUSE_FS y
          set_cfg CONFIG_OVERLAY_FS y
          set_cfg CONFIG_ANDROID_BINDER_IPC y
          set_cfg CONFIG_ANDROID_BINDERFS y
          sed -i '/CONFIG_ANDROID_BINDER_DEVICES/d' "$DEFCONFIG"
          echo 'CONFIG_ANDROID_BINDER_DEVICES="binder,hwbinder,vndbinder"' >> "$DEFCONFIG"
          unset_cfg CONFIG_ANDROID_BINDER_IPC_SELFTEST
          set_cfg CONFIG_MEMCG y
          set_cfg CONFIG_MEMCG_SWAP y
          set_cfg CONFIG_PSI y
          set_cfg CONFIG_CGROUPS y
          set_cfg CONFIG_CGROUP_SCHED y
          set_cfg CONFIG_FAIR_GROUP_SCHED y
          set_cfg CONFIG_RT_GROUP_SCHED y
          set_cfg CONFIG_NET_CLS_CGROUP y
          set_cfg CONFIG_NETFILTER_XT_MATCH_CGROUP y
          set_cfg CONFIG_VETH y
          set_cfg CONFIG_IKCONFIG y
          set_cfg CONFIG_IKCONFIG_PROC y
          set_cfg CONFIG_PROC_EVENTS y

          set_cfg CONFIG_SECURITY_SELINUX_DEVELOP y
          set_cfg CONFIG_SECURITY_SELINUX_BOOTPARAM y

          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          unset_cfg CONFIG_KSU_SUSFS_SUS_MEMFD

          if probe_kconfig CONFIG_KSU_SUSFS_SUS_MAP; then
            set_cfg CONFIG_KSU_SUSFS_SUS_MAP y
          else
            echo "SKIP: SUS_MAP not present in tree" | tee -a "$LOG"
          fi
          if probe_kconfig CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL; then
            set_cfg CONFIG_KSU_SUSFS_HIDE_MAGISK_EVIL y
          else
            echo "SKIP: HIDE_MAGISK_EVIL not present" | tee -a "$LOG"
          fi
          if grep -qr 'config LRU_GEN' mm/ 2>/dev/null; then
            set_cfg CONFIG_LRU_GEN y
            set_cfg CONFIG_LRU_GEN_ENABLED y
            set_cfg CONFIG_LRU_GEN_STATS y
            echo "INFO: MGLRU enabled" | tee -a "$LOG"
          fi

          echo "=== FORTe Mode: shared baseline complete ===" | tee -a "$LOG"
          grep -E \
            "^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_PREEMPT|CONFIG_HZ|CONFIG_TCP_CONG|CONFIG_BPF|CONFIG_CGROUP|CONFIG_BINDER|CONFIG_MEMCG|CONFIG_PSI|CONFIG_NET_CLS|CONFIG_FUSE|CONFIG_OVERLAY)" \
            "$DEFCONFIG" | tee -a "$LOG"

      # ── 5b. Profile & Identity Injection: profile-specific policy branch ──────
      - name: Apply profile policy — SUSFS spoof (cm8) or hard-disable + Identity Engine (cm8e)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/profile-policy.log"
          : > "$LOG"

          set_cfg() {
            local k="$1"; local v="$2"
            sed -i "/^${k}=.*/d;/^# ${k} is not set/d" "$DEFCONFIG"
            echo "${k}=${v}" >> "$DEFCONFIG"
          }
          unset_cfg() {
            local k="$1"
            sed -i "/^${k}=.*/d;/^# ${k} is not set/d" "$DEFCONFIG"
            echo "# ${k} is not set" >> "$DEFCONFIG"
          }
          probe_kconfig() {
            grep -qE "^[[:space:]]*config[[:space:]]+${1#CONFIG_}[[:space:]]*$" \
              KernelSU-Next/kernel/Kconfig 2>/dev/null
          }

          echo "=== Profile policy: $PROFILE ===" | tee -a "$LOG"

          if [[ "$PROFILE" == "cm8" ]]; then
            echo "--- cm8: enabling runtime SUSFS spoofing (probe-gated) ---" | tee -a "$LOG"

            if probe_kconfig CONFIG_KSU_SUSFS_SPOOF_UNAME; then
              set_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME y
              echo "ENABLED: CONFIG_KSU_SUSFS_SPOOF_UNAME" | tee -a "$LOG"
            else
              echo "SKIP: SPOOF_UNAME not present in tree" | tee -a "$LOG"
            fi

            if probe_kconfig CONFIG_KSU_SUSFS_SPOOF_SELINUX; then
              set_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX y
              echo "ENABLED: CONFIG_KSU_SUSFS_SPOOF_SELINUX" | tee -a "$LOG"
            else
              echo "SKIP: SPOOF_SELINUX not present in tree" | tee -a "$LOG"
            fi

            if probe_kconfig CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF; then
              set_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF y
              echo "ENABLED: CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF" | tee -a "$LOG"
            else
              echo "SKIP: ENABLE_AVC_LOG_SPOOF not present in tree" | tee -a "$LOG"
            fi

            echo "PROFILE_SPOOF_STATE=enabled" >> "$GITHUB_ENV"
            echo "IDENTITY_ENGINE_ACTIVE=false" >> "$GITHUB_ENV"

          elif [[ "$PROFILE" == "cm8e" ]]; then
            echo "--- cm8e: hard-disabling all SUSFS spoof symbols ---" | tee -a "$LOG"

            unset_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME
            unset_cfg CONFIG_KSU_SUSFS_SPOOF_SELINUX
            unset_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF
            unset_cfg CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING
            unset_cfg CONFIG_KSU_SUSFS_AVC_LOG_SPOOF

            SPOOF_FAIL=0
            for sym in \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_SPOOF_SELINUX \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING \
              CONFIG_KSU_SUSFS_AVC_LOG_SPOOF; do
              if grep -qE "^${sym}=y" "$DEFCONFIG"; then
                echo "FATAL: ${sym} still set=y after hard-disable — aborting" | tee -a "$LOG"
                SPOOF_FAIL=1
              else
                echo "VERIFIED not set: ${sym}" | tee -a "$LOG"
              fi
            done
            [[ "$SPOOF_FAIL" -eq 0 ]] \
              || { echo "ERROR: cm8e spoof hard-disable verification failed"; exit 1; }

            echo "PROFILE_SPOOF_STATE=hard-disabled" >> "$GITHUB_ENV"
            echo "IDENTITY_ENGINE_ACTIVE=true"        >> "$GITHUB_ENV"
          fi

          echo "=== Profile policy applied: $PROFILE ===" | tee -a "$LOG"

      # ── 5c. Compile-Time ROM Identity Engine (cm8e only) ───────────────────────
      - name: Compile-Time ROM Identity Engine (cm8e)
        if: ${{ env.IDENTITY_ENGINE_ACTIVE == 'true' }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          MKC="scripts/mkcompile_h"
          test -f "$MKC" || { echo "ERROR: $MKC not found — cannot patch identity engine"; exit 1; }
          cp "$MKC" "../$LOG_DIR/mkcompile_h.orig"

          printf '%s\n' \
            'import re' \
            'from pathlib import Path' \
            'import os' \
            '' \
            'path = Path("scripts/mkcompile_h")' \
            'content = path.read_text()' \
            'MARKER = "CHIMERA_MK8E_IDENTITY_ENGINE"' \
            'if MARKER in content:' \
            '    print("OK: identity engine already patched (idempotent)")' \
            '    raise SystemExit(0)' \
            '' \
            'build_user = os.environ["BUILD_USER"]' \
            'build_host = os.environ["BUILD_HOST"]' \
            'build_version = os.environ["BUILD_VERSION"]' \
            'build_date = os.environ["KBUILD_BUILD_TIMESTAMP"]' \
            '' \
            'def esc(s):' \
            '    return s.replace("\\\\", "\\\\\\\\").replace(\'"\', \'\\\\"\')' \
            '' \
            'override_block = f\'\'\'' \
            '# {MARKER} — unconditional compile-time identity override.' \
            'LINUX_COMPILE_BY="{esc(build_user)}"' \
            'LINUX_COMPILE_HOST="{esc(build_host)}"' \
            'LINUX_COMPILE_TIME="{esc(build_date)}"' \
            'CHIMERA_UTS_VERSION_OVERRIDE="#{esc(build_version)} SMP PREEMPT {esc(build_date)}"' \
            '\'\'\'' \
            '' \
            'lines = content.splitlines(keepends=True)' \
            'insert_at = 1' \
            'for i, l in enumerate(lines[:5]):' \
            '    if l.startswith("#!"):' \
            '        insert_at = i + 1' \
            'patched = "".join(lines[:insert_at]) + override_block + "".join(lines[insert_at:])' \
            '' \
            'patched = re.sub(' \
            '    r"UTS_VERSION=.*",' \
            '    "UTS_VERSION=\\"$CHIMERA_UTS_VERSION_OVERRIDE\\"",' \
            '    patched' \
            ')' \
            '' \
            'path.write_text(patched)' \
            'print("OK: scripts/mkcompile_h patched with static identity override")' \
            > /tmp/patch_mkcompile_h.py
          python3 /tmp/patch_mkcompile_h.py

          echo "=== Patched mkcompile_h diff ===" | tee "../$LOG_DIR/identity-engine.log"
          diff -u "../$LOG_DIR/mkcompile_h.orig" "$MKC" | tee -a "../$LOG_DIR/identity-engine.log" || true

          sh -n "$MKC" || { echo "ERROR: patched mkcompile_h failed syntax check"; exit 1; }
          echo "OK: patched mkcompile_h passes shell syntax check" | tee -a "../$LOG_DIR/identity-engine.log"

          {
            echo "IDENTITY_ENGINE=applied"
            echo "IDENTITY_BUILD_USER=$BUILD_USER"
            echo "IDENTITY_BUILD_HOST=$BUILD_HOST"
            echo "IDENTITY_BUILD_VERSION=$BUILD_VERSION"
            echo "IDENTITY_BUILD_DATE=$KBUILD_BUILD_TIMESTAMP"
          } | tee -a "../$LOG_DIR/identity-engine.log"

      # ── 6. Chimera Silent Engine ───────────────────────────────────────────────
      - name: Apply Chimera Silent Engine (Runtime Policy Layer — all profiles)
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p kernel/chimera
          cat > kernel/chimera/silent_core.c << 'EOF'
          #include <linux/kernel.h>
          #include <linux/sysctl.h>
          #include <linux/init.h>
          #include <linux/printk.h>

          /*
           * Chimera Mk8 Unified Silent Engine
           * WARN+ERROR only gate (non-invasive policy layer)
           * Injected regardless of build profile (cm8 / cm8e).
           */

          int chimera_silent_mode = 1;

          static int __maybe_unused chimera_should_silence(int level)
          {
              if (!chimera_silent_mode)
                  return 0;
              return level > 4;
          }

          static struct ctl_table chimera_table[] = {
              {
                  .procname     = "silent",
                  .data         = &chimera_silent_mode,
                  .maxlen       = sizeof(int),
                  .mode         = 0644,
                  .proc_handler = proc_dointvec,
              },
              { }
          };

          static struct ctl_table chimera_root[] = {
              {
                  .procname = "chimera",
                  .mode     = 0555,
                  .child    = chimera_table,
              },
              { }
          };

          static int __init chimera_init(void)
          {
              register_sysctl_table(chimera_root);
              pr_info("Chimera Mk8 Unified Silent Engine initialized (mode=%d)\n",
                      chimera_silent_mode);
              return 0;
          }

          subsys_initcall(chimera_init);
          EOF

          grep -q "chimera/silent_core.o" kernel/Makefile || \
            echo "obj-y += chimera/silent_core.o" >> kernel/Makefile
          echo "Chimera Silent Engine injected successfully (profile=$PROFILE)"

      # ── 7. Samsung-stock-style branding ────────────────────────────────────────
      - name: Apply Samsung-stock-style branding
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          sed -i '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d' "$DEFCONFIG"
          printf 'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n' "$BRAND" "$BUILD_HOST" >> "$DEFCONFIG"
          printf '#!/bin/sh\nprintf "%%s" "%s"\n' "$BRAND" > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "$BRAND" > localversion
          echo "CHIMERA_BRAND=$BRAND"          >> "$GITHUB_ENV"
          echo "KBUILD_HOST=$BUILD_HOST"       >> "$GITHUB_ENV"
          echo "KBUILD_USER=$BUILD_USER"       >> "$GITHUB_ENV"
          echo "KBUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_ENV"
          {
            echo "BRAND=$BRAND"
            echo "BUILD_USER=$BUILD_USER"
            echo "BUILD_HOST=$BUILD_HOST"
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "PROFILE=$PROFILE"
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "RUN=${GITHUB_RUN_NUMBER}"
            echo "UNAME_PREVIEW=Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VERSION} SMP PREEMPT"
          } | tee "../$LOG_DIR/branding.env"
          echo "=== setlocalversion ===" | tee "../$LOG_DIR/scm-dirty.log"
          cat scripts/setlocalversion | tee -a "../$LOG_DIR/scm-dirty.log"
          echo "uname preview: Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VERSION} SMP PREEMPT"

      # ── 8. Pre-build sanity check (profile-aware) ──────────────────────────────
      - name: SUSFS + profile pre-build sanity check
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/susfs-sanity.log"
          echo "=== Pre-build sanity — Chimera Mk8 Unified [$PROFILE / $TOOLCHAIN] ===" | tee "$LOG"
          FAIL=0
          for f in fs/susfs.c fs/sus_su.c include/linux/susfs.h include/linux/susfs_def.h include/linux/sus_su.h; do
            [[ -f "$f" ]] \
              && echo "OK: $f ($(wc -l < "$f") lines)" | tee -a "$LOG" \
              || { echo "FAIL: $f MISSING" | tee -a "$LOG"; FAIL=1; }
          done
          VER="$(grep -oP 'SUSFS_VERSION\s+"\K[^"]+' include/linux/susfs.h 2>/dev/null || echo unknown)"
          echo "SUSFS_VERSION_IN_TREE=$VER (target: $SUSFS_TARGET_VERSION)" | tee -a "$LOG"

          if grep -q 'CHIMERA_MK8_UNIFIED_SUSFS_PRCTL_BRIDGE' kernel/sys.c 2>/dev/null; then
            echo "OK: prctl bridge present in kernel/sys.c" | tee -a "$LOG"
          else
            echo "WARN: prctl bridge not found in kernel/sys.c" | tee -a "$LOG"
          fi

          echo "=== Profile-specific spoof verification [$PROFILE] ===" | tee -a "$LOG"
          if [[ "$PROFILE" == "cm8" ]]; then
            for sym in CONFIG_KSU_SUSFS_SPOOF_UNAME CONFIG_KSU_SUSFS_SPOOF_SELINUX CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF; do
              result="$(grep -E "(^${sym}=|^# ${sym} is not set)" "$DEFCONFIG" || true)"
              if [[ -z "$result" ]]; then
                echo "  INFO: ${sym} absent from tree (symbol not defined in this SUSFS source)" | tee -a "$LOG"
              else
                echo "  $result" | tee -a "$LOG"
              fi
            done
          else
            SPOOF_FAIL=0
            for sym in \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_SPOOF_SELINUX \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING \
              CONFIG_KSU_SUSFS_AVC_LOG_SPOOF; do
              if grep -qE "^${sym}=y" "$DEFCONFIG"; then
                echo "FATAL [cm8e]: ${sym}=y still present — this WILL leak spoof behavior" | tee -a "$LOG"
                SPOOF_FAIL=1
              else
                echo "OK [cm8e]: ${sym} confirmed not set" | tee -a "$LOG"
              fi
            done
            [[ "$SPOOF_FAIL" -eq 0 ]] \
              || { echo "ERROR: cm8e spoof sanity failed — aborting build"; exit 1; }

            if grep -q 'CHIMERA_MK8E_IDENTITY_ENGINE' scripts/mkcompile_h 2>/dev/null; then
              echo "OK [cm8e]: Compile-Time ROM Identity Engine patch present in mkcompile_h" | tee -a "$LOG"
            else
              echo "ERROR [cm8e]: Identity Engine marker missing from mkcompile_h — aborting" | tee -a "$LOG"
              FAIL=1
            fi
          fi

          if grep -q "^# CONFIG_SECURITY_SELINUX_DEVELOP is not set" "$DEFCONFIG"; then
            echo "OK: SELinux DEVELOP unset — enforcing locked" | tee -a "$LOG"
          else
            echo "WARN: CONFIG_SECURITY_SELINUX_DEVELOP may still be set" | tee -a "$LOG"
          fi

          MK="$(cat fs/Makefile)"
          [[ "$MK" == *"susfs.o"* ]]  && echo "OK: fs/Makefile has susfs.o"  | tee -a "$LOG" || { echo "FAIL: fs/Makefile missing susfs.o"  | tee -a "$LOG"; FAIL=1; }
          [[ "$MK" == *"sus_su.o"* ]] && echo "OK: fs/Makefile has sus_su.o" | tee -a "$LOG" || { echo "FAIL: fs/Makefile missing sus_su.o" | tee -a "$LOG"; FAIL=1; }

          echo "uname preview: Linux version 4.9.337${BRAND} (${KBUILD_USER}@${KBUILD_HOST}) #${KBUILD_VERSION} SMP PREEMPT" | tee -a "$LOG"
          [[ "$FAIL" -eq 0 ]] || { echo "ERROR: sanity check failed"; exit 1; }
          echo "=== Sanity check PASSED [$PROFILE / $TOOLCHAIN] ===" | tee -a "$LOG"

      # ── 9. Dry run summary ──────────────────────────────────────────────────────
      - name: Dry run summary
        if: '${{ inputs.dry_run == true }}'
        run: |
          echo "========================================"
          echo "  Chimera Mk8 Unified — dry run PASSED"
          echo "  Profile:   $PROFILE  (spoof: ${PROFILE_SPOOF_STATE:-unknown})"
          echo "  Toolchain: $TOOLCHAIN  ($TC_LABEL)"
          echo "  Target:    LOS/AOSP Android 16 QPR2"
          echo "  KSU  : ${{ inputs.ksu_repo }} @ ${{ inputs.ksu_commit }}${{ inputs.ksu_ref }}"
          echo "  SUSFS: v${SUSFS_TARGET_VERSION} @ ${{ inputs.susfs_ref }}"
          echo "  Identity Engine active: ${IDENTITY_ENGINE_ACTIVE:-false}"
          echo "  Eva GCC active: ${TC_NEEDS_EVA_GCC}"
          echo "  CROSS_COMPILE: ${TC_CROSS_COMPILE}"
          echo "  CROSS_COMPILE_ARM32: ${TC_CROSS_COMPILE_ARM32}"
          echo "  HOSTCC: ${TC_HOSTCC}"
          echo "  GCC_TOOLCHAIN: ${GCC_TOOLCHAIN:-(not set — non-Eva toolchain)}"
          echo "  KCFLAGS: -O2 -fcommon -fno-strict-aliasing -Wno-error"
          echo "  ccache: enabled (${CCACHE_MAXSIZE} budget)"
          echo "  uname preview: Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VERSION} SMP PREEMPT"
          echo "========================================"
          echo "Re-run with dry_run=false to compile and package."

      # ── 9b. Pre-build warning suppression ────────────────────────────────────
      - name: Pre-build warning suppression
        if: '${{ inputs.dry_run == false }}'
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          LOG="../$LOG_DIR/warning-suppression.log"
          echo "=== Chimera Mk8 Unified — Pre-build warning suppression [$PROFILE/$TOOLCHAIN] ===" | tee "$LOG"

          if grep -q 'struct inode \*inode;' fs/proc/base.c 2>/dev/null && \
             ! grep -q 'struct inode __maybe_unused \*inode' fs/proc/base.c 2>/dev/null; then
            sed -i 's/\bstruct inode \*inode;/struct inode __maybe_unused *inode;/g' fs/proc/base.c
            echo "Fix 1 applied: inode __maybe_unused in fs/proc/base.c" | tee -a "$LOG"
          else
            echo "Fix 1: fs/proc/base.c inode already suppressed or absent" | tee -a "$LOG"
          fi

          PANEL_MK="drivers/video/fbdev/exynos/panel/Makefile"
          if [[ -f "$PANEL_MK" ]] && ! grep -q 'CFLAGS_copr' "$PANEL_MK"; then
            echo 'CFLAGS_copr.o += -Wno-unused-variable' >> "$PANEL_MK"
            echo "Fix 2 applied: CFLAGS_copr.o += -Wno-unused-variable in $PANEL_MK" | tee -a "$LOG"
          else
            echo "Fix 2: copr.o suppression already present or panel Makefile absent" | tee -a "$LOG"
          fi

          if grep -q '^struct work_struct susfs_extra_works;' fs/susfs.c 2>/dev/null; then
            sed -i 's/^struct work_struct susfs_extra_works;$/struct work_struct susfs_extra_works = {};/' fs/susfs.c
            echo "Fix 3a applied: susfs_extra_works = {} (work_struct) in fs/susfs.c" | tee -a "$LOG"
          elif grep -q '^int susfs_extra_works;' fs/susfs.c 2>/dev/null; then
            sed -i 's/^int susfs_extra_works;$/int susfs_extra_works = 0;/' fs/susfs.c
            echo "Fix 3a applied: susfs_extra_works = 0 (int fallback) in fs/susfs.c" | tee -a "$LOG"
          else
            echo "Fix 3a: susfs_extra_works already initialised or absent" | tee -a "$LOG"
          fi

          KSU_CRED_SRC=""
          for candidate in \
            drivers/kernelsu/ksu.c \
            drivers/kernelsu/core_hook.c \
            KernelSU-Next/kernel/ksu.c \
            KernelSU-Next/kernel/core_hook.c; do
            if [[ -f "$candidate" ]] && grep -q '^struct cred \*ksu_cred;' "$candidate" 2>/dev/null; then
              KSU_CRED_SRC="$candidate"; break
            fi
          done
          if [[ -n "$KSU_CRED_SRC" ]]; then
            sed -i 's/^struct cred \*ksu_cred;$/struct cred *ksu_cred = NULL;/' "$KSU_CRED_SRC"
            echo "Fix 3b applied: ksu_cred = NULL in $KSU_CRED_SRC" | tee -a "$LOG"
          else
            echo "Fix 3b: ksu_cred bare declaration not found (may already be initialised)" | tee -a "$LOG"
          fi

          echo "=== Warning suppression complete ===" | tee -a "$LOG"

      # ── 10. Compilation ────────────────────────────────────────────────────────
      # Uses only the toolchain-agnostic TC_* variables exported in steps 2 and
      # 2e/2e-eva — this step never branches on $TOOLCHAIN directly.
      #
      # Key variables consumed here:
      #   CC_BIN          — absolute path to clang (all toolchains)
      #   LD/AR/NM/…_BIN  — LLVM tools or aarch64-linux-gnu-* depending on TC_USE_FULL_LLVM
      #   MAKE_LLVM_FLAG  — 1 (full LLVM) or 0 (GNU binutils)
      #   LLVM_IAS_VALUE  — 0 or 1 per-toolchain (0 for clang21-eva-gcc: Eva GCC as backend)
      #   TC_CLANG_TRIPLE — always aarch64-linux-gnu- across all toolchains
      #   TC_CROSS_COMPILE — aarch64-linux-gnu- (default) or aarch64-elf- (clang21-eva-gcc)
      #   TC_CROSS_COMPILE_ARM32 — arm-linux-gnueabi- (default) or arm-eabi- (clang21-eva-gcc)
      #   TC_HOSTCC       — gcc (default) or clang (clang21-eva-gcc)
      #   GCC_TOOLCHAIN   — unset for all toolchains except clang21-eva-gcc, where it is
      #                     the Eva GCC arm64 sysroot. Conditionally appended to MAKE
      #                     array below; kbuild passes it to Clang as --gcc-toolchain=.
      - name: Build kernel
        if: '${{ inputs.dry_run == false }}'
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          export PATH="$GITHUB_WORKSPACE/$TC_DIR/bin:$PATH"
          export KBUILD_BUILD_USER="$BUILD_USER"
          export KBUILD_BUILD_HOST="$BUILD_HOST"
          export KBUILD_BUILD_VERSION="$BUILD_VERSION"
          export KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP"

          export CCACHE_DIR="$HOME/.ccache"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_COMPILERCHECK="content"
          export CCACHE_SLOPPINESS="file_stat_matches,include_file_mtime,include_file_ctime,time_macros,pch_defines"
          export USE_CCACHE=1

          echo "=== Toolchain sanity — $TC_LABEL ($TOOLCHAIN) ==="
          "$CC_BIN" --version
          echo "  CC:       $CC_BIN (ccache-wrapped)"
          echo "  LD:       $LD_BIN"
          echo "  AR:       $AR_BIN"
          echo "  NM:       $NM_BIN"
          echo "  OBJCOPY:  $OBJCOPY_BIN"
          echo "  OBJDUMP:  $OBJDUMP_BIN"
          echo "  STRIP:    $STRIP_BIN"
          echo "  LLVM=$MAKE_LLVM_FLAG  LLVM_IAS=$LLVM_IAS_VALUE"
          echo "  CLANG_TRIPLE=$TC_CLANG_TRIPLE"
          echo "  CROSS_COMPILE=$TC_CROSS_COMPILE"
          echo "  CROSS_COMPILE_ARM32=$TC_CROSS_COMPILE_ARM32"
          echo "  HOSTCC=$TC_HOSTCC"
          echo "  GCC_TOOLCHAIN=${GCC_TOOLCHAIN:-(not set)}"
          echo "=== ccache status (pre-build) ==="
          ccache --show-stats | head -10 || true

          # ── [CHANGED] CLANG_TRIPLE/CROSS_COMPILE/CROSS_COMPILE_ARM32/HOSTCC ──
          # Now driven by TC_* env vars rather than hardcoded strings.
          # For all existing toolchains (aosp*, neutron19, zyc_stable) these
          # resolve to the same aarch64-linux-gnu- / arm-linux-gnueabi- values
          # as before. For clang21-eva-gcc they resolve to aarch64-elf- / arm-eabi-.
          MAKE=(
            make -j"$(nproc)"
            O="$GITHUB_WORKSPACE/$OUT_DIR"
            ARCH=arm64
            SUBARCH=arm64
            LLVM="$MAKE_LLVM_FLAG"
            LLVM_IAS="$LLVM_IAS_VALUE"
            CC="ccache $CC_BIN"
            HOSTCC="$TC_HOSTCC"
            HOSTCXX=g++
            CLANG_TRIPLE="$TC_CLANG_TRIPLE"
            CROSS_COMPILE="$TC_CROSS_COMPILE"
            CROSS_COMPILE_ARM32="$TC_CROSS_COMPILE_ARM32"
            LD="$LD_BIN"
            AR="$AR_BIN"
            NM="$NM_BIN"
            OBJCOPY="$OBJCOPY_BIN"
            OBJDUMP="$OBJDUMP_BIN"
            STRIP="$STRIP_BIN"
            LOCALVERSION="$BRAND"
            KBUILD_BUILD_USER="$BUILD_USER"
            KBUILD_BUILD_HOST="$BUILD_HOST"
            KBUILD_BUILD_VERSION="$BUILD_VERSION"
            KCFLAGS="-O2 -fcommon -fno-strict-aliasing -Wno-error"
            DTC_FLAGS="-Wno-unit_address_vs_reg"
          )

          # ── [NEW] Conditionally append GCC_TOOLCHAIN for clang21-eva-gcc and clang22-eva-gcc ──────
          # GCC_TOOLCHAIN is unset for all other toolchains, so this block is a
          # no-op for them. When set, kbuild's scripts/Makefile.clang translates it
          # to Clang's --gcc-toolchain=<path> flag, giving Clang access to the Eva
          # GCC sysroot for GNU compatibility discovery. Eva GCC is still NOT the
          # compiler — it only provides the sysroot and assembler backend.
          if [[ -n "${GCC_TOOLCHAIN:-}" ]]; then
            MAKE+=("GCC_TOOLCHAIN=$GCC_TOOLCHAIN")
            echo "INFO: GCC_TOOLCHAIN=$GCC_TOOLCHAIN appended to make args"
          fi

          echo "=== Applying defconfig ==="
          "${MAKE[@]}" exynos9810-star2lte_defconfig
          cp "$GITHUB_WORKSPACE/$OUT_DIR/.config" "$GITHUB_WORKSPACE/$LOG_DIR/final.config"

          echo "=== Stack protector verification ==="
          grep -E '^CONFIG_CC_STACKPROTECTOR' "$GITHUB_WORKSPACE/$OUT_DIR/.config" | tee "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
          if grep -q '^CONFIG_CC_STACKPROTECTOR_NONE=y' "$GITHUB_WORKSPACE/$OUT_DIR/.config"; then
            echo "OK: stack protector disabled for clang compatibility" \
              | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
          else
            echo "ERROR: stack protector mode not NONE" \
              | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
            exit 1
          fi

          echo "=== Post-defconfig config verification ==="
          grep -E "CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SECURITY_SELINUX_DEVELOP|LOCALVERSION" \
            "$GITHUB_WORKSPACE/$OUT_DIR/.config" | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"

          echo "=== Post-defconfig profile spoof verification [$PROFILE] ==="
          if [[ "$PROFILE" == "cm8e" ]]; then
            SPOOF_FAIL=0
            for sym in \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_SPOOF_SELINUX \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING \
              CONFIG_KSU_SUSFS_AVC_LOG_SPOOF; do
              if grep -qE "^${sym}=y" "$GITHUB_WORKSPACE/$OUT_DIR/.config"; then
                echo "FATAL [cm8e]: ${sym}=y present in final .config — Kconfig merge re-enabled it" \
                  | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
                SPOOF_FAIL=1
              else
                echo "OK [cm8e]: ${sym} not set in final .config" \
                  | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
              fi
            done
            [[ "$SPOOF_FAIL" -eq 0 ]] || { echo "ERROR: cm8e spoof re-enabled by Kconfig merge — aborting"; exit 1; }
          else
            echo "INFO [cm8]: spoof verification skipped — runtime spoofing is intended for this profile" \
              | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/config-verify.log"
          fi

          echo "=== Building Image + DTBs ==="
          set -o pipefail
          "${MAKE[@]}" Image dtbs 2>&1 | tee build.log

          IMAGE="$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image"
          test -f "$IMAGE" || { echo "ERROR: Image not produced — check build.log"; exit 1; }
          du -h "$IMAGE" | tee "$GITHUB_WORKSPACE/$LOG_DIR/image-size.log"

          echo "=== uname string verification ==="
          strings "$IMAGE" | grep -E "Linux version 4\.9\." | head -3 | tee "$GITHUB_WORKSPACE/$LOG_DIR/uname-verify.log" || true

          if [[ "$PROFILE" == "cm8e" ]]; then
            echo "=== [cm8e] Identity Engine leak check ==="
            LEAK=0
            for pattern in "runner@fv-az" "@fv-az" "ip-10-" "ubuntu@" "root@buildkitsandbox"; do
              if strings "$IMAGE" | grep -qF "$pattern"; then
                echo "WARN: possible runner-metadata leak pattern found: '$pattern'" \
                  | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/identity-engine.log"
                LEAK=1
              fi
            done
            [[ "$LEAK" -eq 0 ]] && echo "OK: no known runner-metadata leak patterns found in Image" \
              | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/identity-engine.log"
            if strings "$IMAGE" | grep -qF "${BUILD_USER}@${BUILD_HOST}"; then
              echo "OK: Image contains expected identity string '${BUILD_USER}@${BUILD_HOST}'" \
                | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/identity-engine.log"
            else
              echo "WARN: expected identity string '${BUILD_USER}@${BUILD_HOST}' not found in Image strings" \
                | tee -a "$GITHUB_WORKSPACE/$LOG_DIR/identity-engine.log"
            fi
          fi

          echo "=== ccache stats (post-build) ==="
          ccache --show-stats | tee "$GITHUB_WORKSPACE/$LOG_DIR/ccache-stats.log" || true

      # ── 11. Post-build validation logs ────────────────────────────────────────
      - name: Diagnostic — print SUSFS, Binder, and profile-policy CONFIG values
        if: '${{ inputs.dry_run == false }}'
        run: |
          set -Eeuo pipefail
          CONFIG_FILE="$GITHUB_WORKSPACE/$OUT_DIR/.config"
          DIAG_LOG="$GITHUB_WORKSPACE/$LOG_DIR/safeboot-config-verify.log"
          test -f "$CONFIG_FILE" || { echo "ERROR: $CONFIG_FILE not found"; exit 1; }
          {
            echo "════════════════════════════════════════════════════════"
            echo " Chimera Mk8 Unified — Active CONFIG values"
            echo " Profile: $PROFILE   Toolchain: $TOOLCHAIN ($TC_LABEL)"
            echo "════════════════════════════════════════════════════════"
            echo ""
            echo "── SUSFS (CONFIG_KSU / CONFIG_KSU_SUSFS_*) ─────────────────"
            grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|# CONFIG_KSU_SUSFS)' "$CONFIG_FILE" || true
            echo ""
            echo "── Profile spoof policy [$PROFILE] ─────────────────────────"
            for sym in \
              CONFIG_KSU_SUSFS_SPOOF_UNAME \
              CONFIG_KSU_SUSFS_SPOOF_SELINUX \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOF \
              CONFIG_KSU_SUSFS_ENABLE_AVC_LOG_SPOOFING \
              CONFIG_KSU_SUSFS_AVC_LOG_SPOOF; do
              result="$(grep -E "(^${sym}=|^# ${sym} is not set)" "$CONFIG_FILE" || true)"
              [[ -n "$result" ]] && echo "  $result" || echo "  ${sym}: absent from .config (symbol not defined in this SUSFS tree)"
            done
            echo ""
            echo "── SELinux enforcement ──────────────────────────────────────"
            grep -E '(CONFIG_SECURITY_SELINUX)' "$CONFIG_FILE" || true
            echo ""
            echo "── Binder IPC (CONFIG_ANDROID_BINDER*) ─────────────────────"
            grep -E '^(CONFIG_ANDROID_BINDER|# CONFIG_ANDROID_BINDER)' "$CONFIG_FILE" || true
            echo ""
            echo "── BPF / FUSE / OverlayFS (A16 QPR2 boot-essential) ────────"
            grep -E '^(CONFIG_BPF_SYSCALL|CONFIG_CGROUP_BPF|CONFIG_NET_CLS_BPF|CONFIG_FUSE_FS|CONFIG_OVERLAY_FS|# CONFIG_BPF_SYSCALL|# CONFIG_CGROUP_BPF|# CONFIG_NET_CLS_BPF|# CONFIG_FUSE_FS|# CONFIG_OVERLAY_FS)' "$CONFIG_FILE" || true
            echo ""
            echo "── TCP Congestion (BBR must be present) ────────────────────"
            grep -E '^(CONFIG_TCP_CONG|CONFIG_DEFAULT_TCP_CONG)' "$CONFIG_FILE" || true
            echo ""
            echo "── Toolchain used ───────────────────────────────────────────"
            echo "  $TC_LABEL — LLVM=$MAKE_LLVM_FLAG LLVM_IAS=$LLVM_IAS_VALUE"
            echo "  CROSS_COMPILE=$TC_CROSS_COMPILE  HOSTCC=$TC_HOSTCC"
            echo "  GCC_TOOLCHAIN=${GCC_TOOLCHAIN:-(not set)}"
            echo ""
            echo "════════════════════════════════════════════════════════"
          } | tee "$DIAG_LOG"

      # ── 12. Packaging: raw kernel Image ───────────────────────────────────────
      - name: Stage final Image artifact
        if: '${{ inputs.dry_run == false }}'
        run: |
          set -Eeuo pipefail
          NEW_IMAGE="$GITHUB_WORKSPACE/$OUT_DIR/arch/arm64/boot/Image"
          test -f "$NEW_IMAGE" || { echo "ERROR: built Image not found at $NEW_IMAGE"; exit 1; }
          OUT_NAME="chimera-mk8-${PROFILE}-${TOOLCHAIN}-$(date +%Y%m%d-%H%M)-r${GITHUB_RUN_NUMBER}-Image"
          cp "$NEW_IMAGE" "$GITHUB_WORKSPACE/$OUT_NAME"
          test -f "$GITHUB_WORKSPACE/$OUT_NAME" || { echo "ERROR: staged Image missing"; exit 1; }
          echo "BUILT_IMAGE=$OUT_NAME"      >> "$LOG_DIR/branding.env"
          echo "BUILT_IMAGE_PATH=$OUT_NAME" >> "$GITHUB_ENV"
          echo "OK: final Image staged: $OUT_NAME"
          du -h "$GITHUB_WORKSPACE/$OUT_NAME"
          sha256sum "$GITHUB_WORKSPACE/$OUT_NAME" | tee "$LOG_DIR/image-sha256.log"

      # ── 13. Upload logs ────────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-logs-${{ github.run_number }}'
          path: |
            logs/
            kernel/build.log
            kernel-out/.config
          if-no-files-found: ignore
          retention-days: 14

      # ── 14. Upload built Image ────────────────────────────────────────────────
      - name: Upload built Image
        if: '${{ inputs.dry_run == false }}'
        uses: actions/upload-artifact@v4
        with:
          name: 'chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_number }}'
          path: chimera-mk8-*-Image
          if-no-files-found: error
          retention-days: 30

      # ── 15. Create GitHub Release ──────────────────────────────────────────────
      - name: Create GitHub Release
        if: '${{ inputs.do_release == true && inputs.dry_run == false }}'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 'chimera-mk8-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_number }}'
          name: >-
            Project Chimera Mk8 [${{ inputs.profile }} / ${{ inputs.toolchain }}] — Build #${{ github.run_number }}
          body: |
            ## Project Chimera Mk8 Unified — Exynos 9810 / star2lte
            **Profile:** `${{ inputs.profile }}`  **Toolchain:** `${{ inputs.toolchain }}` (${{ env.TC_LABEL }})
            **Base ROM compatibility:** `LOS/AOSP Android 16 QPR2`
            **Kernel Source Base:** `royd-jpg/Project_Chimera @ chimera-mk8`
            **KernelSU-Next:** `${{ inputs.ksu_repo }}` @ `${{ inputs.ksu_commit }}${{ inputs.ksu_ref }}`
            **SUSFS target:** `v${{ env.SUSFS_TARGET_VERSION }}`
            **Packaging:** raw kernel `Image` (no AnyKernel3 zip, no boot.img injection)

            ### Profile Policy
            | Profile | SUSFS Runtime Spoof | Identity Mechanism |
            |---|---|---|
            | `cm8`  | ✅ Enabled (probe-gated: SPOOF_UNAME, SPOOF_SELINUX, ENABLE_AVC_LOG_SPOOF) | Runtime kernel spoofing |
            | `cm8e` | ❌ Hard-disabled (all 5 spoof-family symbols, unconditional, build-verified) | Compile-Time ROM Identity Engine (`scripts/mkcompile_h` patched) |

            This build used profile **`${{ inputs.profile }}`**.

            ### Toolchain Matrix (all options)
            | Toolchain | Primary Compiler | Linker / Binutils | Assembler Backend | LLVM_IAS |
            |---|---|---|---|---|
            | `aosp19` | AOSP Clang 19 r596125 | Full LLVM (tarball) | Clang integrated | 0 (GNU `as` via CROSS_COMPILE) |
            | `aosp20` | korg Clang 20.1.8 | Full LLVM (tarball) | Clang integrated | 0 (GNU `as` via CROSS_COMPILE) |
            | `aosp21` | AOSP Clang 21 r563880c | Full LLVM (tarball) | Clang integrated | 0 (GNU `as` via CROSS_COMPILE) |
            | `aosp22` | AOSP Clang 22.0 r596125 | Full LLVM (tarball) | Clang integrated | 0 (GNU `as` via CROSS_COMPILE) |
            | `neutron19` | Neutron Clang (catalogue) | System GNU binutils | Clang IAS | 1 |
            | `zyc_stable` | ZyCromerZ Clang (latest) | System GNU binutils | Clang integrated | 0 (GNU `as` via CROSS_COMPILE) |
            | `clang21-eva-gcc` | **AOSP Clang 21 r563880c** | **Full LLVM (tarball)** | **Eva GCC `aarch64-elf-as`** | **0 — Eva GCC provides GNU `as` backend** |
            | `clang22-eva-gcc` | **AOSP Clang 22.0.2 r596125** | **Full LLVM (tarball)** | **Eva GCC `aarch64-elf-as`** | **0 — Eva GCC provides GNU `as` backend** |

            #### `clang21-eva-gcc` detail
            - **Primary compiler:** AOSP Clang 21.0 r563880c — all C/C++ compilation, linking (lld), and archiving (llvm-ar/nm/objcopy/strip).
            - **Support toolchain:** Eva GCC (mvaisakh/gcc-arm64 `aarch64-elf-` + mvaisakh/gcc-arm `arm-eabi-`) — provides the GNU assembler backend (`aarch64-elf-as`) invoked by Clang when LLVM_IAS=0, and the GCC sysroot referenced via `--gcc-toolchain` for GNU compatibility. Eva GCC is **not** the compiler.
            - **HOSTCC:** `clang` (host-side kernel tool compilation via Clang 21 rather than system gcc).
            - **GCC_TOOLCHAIN:** `eva-gcc/arm64` — passed as a make argument; surfaces to Clang as `--gcc-toolchain=<path>` via `scripts/Makefile.clang`.

            #### `clang22-eva-gcc` detail
            - **Primary compiler:** AOSP Clang 22.0.2 r596125 — all C/C++ compilation, linking (lld), and archiving (llvm-ar/nm/objcopy/strip).
            - **Support toolchain:** Eva GCC (mvaisakh/gcc-arm64 `aarch64-elf-` + mvaisakh/gcc-arm `arm-eabi-`) — provides the GNU assembler backend (`aarch64-elf-as`) invoked by Clang when LLVM_IAS=0, and the GCC sysroot referenced via `--gcc-toolchain` for GNU compatibility. Eva GCC is **not** the compiler.
            - **HOSTCC:** `clang` (host-side kernel tool compilation via Clang 21 rather than system gcc).
            - **GCC_TOOLCHAIN:** `eva-gcc/arm64` — passed as a make argument; surfaces to Clang as `--gcc-toolchain=<path>` via `scripts/Makefile.clang`.

            This build used toolchain **`${{ inputs.toolchain }}`** (${{ env.TC_LABEL }}).

            ### Feature Framework Set
            | Security / Feature Node | Status |
            |---|---|
            | **KernelSU-Next Core Engine** | ✅ pinned per `ksu_repo`/`ksu_commit` inputs |
            | **SUSFS VFS Guard Layer** | ✅ Native Tree Hook v${{ env.SUSFS_TARGET_VERSION }} |
            | **BPF Syscall + Cgroup BPF + NET_CLS_BPF** | ✅ Enabled — A16 QPR2 bpfloader / netd |
            | **FUSE + OverlayFS** | ✅ Enabled — A16 QPR2 MediaStore + RRO |
            | **Binder (binder/hwbinder/vndbinder)** | ✅ Enabled — A16 QPR2 AIDL |
            | **PSI + MEMCG** | ✅ Enabled — A16 QPR2 LMKD PSI eviction |
            | **BBR TCP** | ✅ Enabled |
            | **Chimera Silent Engine** | ✅ Injected unconditionally (both profiles) |

            ### Safe-Boot Diagnostics
            Post-build CONFIG verification (SUSFS, profile spoof policy, Binder, BPF/FUSE/OverlayFS,
            toolchain, cross-compile prefixes, GCC_TOOLCHAIN) is written to
            `logs/safeboot-config-verify.log`. For `cm8e`, the build aborts if any spoof symbol is
            found set=y after Kconfig merge, or if the Identity Engine marker is missing from
            `scripts/mkcompile_h`. For `clang21-eva-gcc`, the Eva GCC download step verifies
            `aarch64-elf-gcc` and `arm-eabi-gcc` binary presence before the build proceeds.

            ### uname String
            `Linux version 4.9.337${{ env.BRAND }} (${{ env.BUILD_USER }}@${{ env.BUILD_HOST }}) #${{ env.BUILD_VERSION }} SMP PREEMPT`

            ### Output
            This release ships the raw kernel `Image` only. Unpack your device's stock/current
            boot.img with magiskboot/AIK (or your tool of choice), swap in this `Image` as the
            kernel section, then repack and flash.
          files: '${{ env.BUILT_IMAGE_PATH }}'
