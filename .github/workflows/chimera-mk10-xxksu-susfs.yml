# ============================================================================
# CHIMERA MK10 — xxksu v3.3.0 + SUSFS v2.3.0 build
# Samsung Exynos 9810 (star2lte), Linux 4.9.337, LineageOS 24 / Android 17
# Derived from: chimera-mk9-merge-build.yml — step order/names kept so the two
# files diff cleanly.
#
# WHAT THIS BUILDS
#   A flashable AnyKernel3 zip (plus Image, dtb.img, manifest.json, SHA256SUMS)
#   from gavdoc38's xxksu + SUSFS kernel base with the Chimera overlay applied.
#
# TWO-REPO LAYOUT (nothing is copied between the two trees)
#   $GITHUB_WORKSPACE/kernel/           gavdoc38/android_kernel_samsung_exynos9810
#                                       @ base_ref (pinned SHA), KernelSU
#                                       submodule @ ksu_commit. This is what is
#                                       compiled.
#   $GITHUB_WORKSPACE/chimera_overlay/  royd-jpg/Project_Chimera @ chimera_ref
#                                       (pinned SHA). SPARSE checkout of only
#                                       /patches/ and /chimera-*.cfg, because
#                                       every Project_Chimera branch is a FULL
#                                       kernel tree (~61k files), not an
#                                       overlay-only repo. Supplies:
#                                         patches/apply_chimera_overlay_patches.sh
#                                         patches/0001-mfd-madera-core-...patch
#                                         chimera-xxksu-susfs.cfg
#                                         chimera-device-specific.cfg
#   The overlay script runs with cwd = kernel/ and edits it in place. The two
#   Kconfig fragments are merged from chimera_overlay/ (comment-stripped copies
#   are written to logs/fragments/ — see "Validate Kconfig fragments").
#
# KEY DIFFERENCES FROM MK9 (KernelSU-Next -> xxksu)
#   * Base: gavdoc38 lineage-24.0-xxksu3-susfs2; KernelSU submodule is
#     gavdoc38/KernelSU.git (xxksu), a different codebase from KernelSU-Next.
#   * xxksu installs its hooks at runtime (device_initcall(kernelsu_init);
#     sys_call_table rewrite via CONFIG_KSU_TAMPER_SYSCALL_TABLE, LSM
#     security_hook_heads rewrite via CONFIG_KSU_LSM_SECURITY_HOOKS). There are
#     no manual call sites in fs/exec.c, fs/open.c, fs/stat.c, ... so Mk9's
#     steps 7/7b/8/9 and 14 (hook-mode normalisation) are gone.
#     CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_KPROBES_HOOK do not exist in xxksu.
#   * The Kconfig fragment is chimera-xxksu-susfs.cfg (not chimera-ksu-susfs.cfg).
#   * The vmlinux symbol guard checks xxksu symbols that survive -O2 (see the
#     comment on that step). Mk9's ksu_handle_* names do not exist here.
#   * xxksu is built as ONE translation unit (kernel/ksu.c #includes hook/*.c),
#     so a static function with a single caller is inlined and has no symbol.
#
# SOURCE FACTS CHECKED WHEN WRITING THIS FILE (git clone of the branches below,
# plus the CI log of run 35862553362 for the same base_ref)
#   * royd-jpg/Project_Chimera@lineage-24.0-xxksu3-susfs2 = gavdoc38 base
#     d6c6d8b + 4 commits (this workflow, chimera-xxksu-susfs.cfg, a copy-step
#     workaround). It has NO patches/ and NO chimera-device-specific.cfg.
#   * royd-jpg/Project_Chimera@lineage-23.2-ksun3-susfs2 carries patches/,
#     chimera-device-specific.cfg and a chimera-xxksu-susfs.cfg byte-identical
#     to the one on the 24.0 branch. The overlay script applied all 9 sections
#     to the d6c6d8b tree in CI and every marker check passed.
#   * patches/apply_chimera_overlay_patches.sh has exactly one reference to
#     $GITHUB_WORKSPACE (the madera patch path); the overlay step scopes that
#     variable to chimera_overlay/ for that one command.
#
# OVERLAY REF STATUS — ACTION REQUIRED (not fixable from this file)
#   chimera_ref defaults to the tip of lineage-23.2-ksun3-susfs2 (immutable
#   SHA) because it is the only ref verified to contain all four overlay files.
#   To move the overlay to the 24.0 branch, commit patches/ and
#   chimera-device-specific.cfg there, then change the chimera_ref default:
#       git checkout lineage-24.0-xxksu3-susfs2
#       git checkout origin/lineage-23.2-ksun3-susfs2 -- patches chimera-device-specific.cfg
#       git commit -m "Add Chimera overlay patches + device cfg" && git push
#   Note the SHA of a branch that also contains this workflow moves on every
#   workflow edit; a dedicated overlay tag/branch is a steadier pin.
#
# UNVERIFIED — REQUIRES CONFIRMATION
#   * Warn-only guard symbols (ksu_inode_rename, ksu_bprm_committing_creds,
#     ksu_syscall_table_restore) were chosen from source (address-taken static
#     functions cannot be inlined away) but not observed in a built vmlinux;
#     only kernelsu_init, susfs_is_inode_sus_path and ksu_task_fix_setuid are
#     fatal.
#   * Whether the toolchain matrix meets any LOS24 / Android 17 minimum
#     compiler requirement (no star2lte BoardConfig or AOSP Clang pin was
#     available to diff against).
#   * device.name* / supported.versions / BLOCK in anykernel.sh (copied from
#     Mk9; not re-verified against the star2lte boot layout).
#   * CI log shows two "LLVM ERROR: IO failure on output stream: Broken pipe"
#     lines during the kernel build. The build continued past them; source not
#     investigated.
#   * aosp23 toolchain entry (added below): the archive URL was supplied
#     directly by the user, not discovered/verified by this workflow's usual
#     audit process. android.googlesource.com is unreachable from the sandbox
#     that maintains this file (blocked by robots.txt for the fetch tool, and
#     not present in the sandbox's outbound network allowlist), so — unlike
#     weebx's pinned SHA-256 in the Mk9 dossier — NONE of the following were
#     checked: archive downloads/extracts cleanly, its internal layout matches
#     the "find a bin/ dir" logic in "Configure toolchain PATH", it actually
#     reports as Clang 23.0.1, or its cross binutils prefixes match
#     CROSS_COMPILE/CROSS_COMPILE_ARM32. No TC_SHA256 pin is set for this
#     entry (unlike weebx) because no checksum was ever computed. Treat the
#     first CI run on aosp23 as the real validation, same caveat this file
#     already carries for weebx.
# ============================================================================

permissions:
  contents: write

concurrency:
  group: chimera-mk10-${{ github.event.inputs.profile }}-${{ github.event.inputs.toolchain }}-${{ github.event.inputs.base_ref }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile: cm9 (runtime SUSFS spoof) or cm9e (compile-time identity)"
        required: true
        type: choice
        options: [cm9, cm9e]
        default: cm9

      toolchain:
        description: "Toolchain: llvm22/llvm21/llvm20/aosp23/aosp22/aosp21/aosp20/aosp19/neutron19/neutron23/neutron24/zyc_stable/weebx (weebx = Clang 20.0.0git snapshot, frozen since 2024-12-06; proton removed — unmaintained since 2021-05-22, frozen at Clang 13.0.0; aosp23 = Clang r614150 (23.0.1) per user-supplied archive URL — UNVERIFIED, see header). UNVERIFIED whether this matrix satisfies an LOS24/A17 minimum compiler requirement (see header)."
        required: true
        type: choice
        options: [llvm22, llvm21, llvm20, aosp23, aosp22, aosp21, aosp20, aosp19, neutron19, neutron23, neutron24, zyc_stable, weebx]
        default: llvm22

      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: false

      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force re-apply Chimera overlay patches even if markers present"
        required: false
        type: boolean
        default: false

      chimera_repo:
        description: "Chimera overlay repo (owner/repo) — sparse-checked-out to chimera_overlay/ for patches/ and chimera-*.cfg"
        required: false
        type: string
        default: "royd-jpg/Project_Chimera"

      chimera_ref:
        description: "Chimera overlay ref: full 40-hex commit SHA only. Default = tip of lineage-23.2-ksun3-susfs2, the only ref verified to carry patches/, chimera-xxksu-susfs.cfg AND chimera-device-specific.cfg (lineage-24.0-xxksu3-susfs2 currently lacks patches/ and the device cfg — see header)."
        required: false
        type: string
        default: "0b73f89888824c3be2e55ec1c65e3803b05590db"

      base_repo:
        description: "xxksu + SUSFS integration base (owner/repo)"
        required: false
        type: string
        default: "gavdoc38/android_kernel_samsung_exynos9810"

      base_ref:
        description: "Base ref: full 40-hex commit SHA only. Default = tip of gavdoc38 lineage-24.0-xxksu3-susfs2 (4140f60, verified with git ls-remote)."
        required: false
        type: string
        default: "4140f60361c1196ea8d500c265fb171d4627e15c"

      ksu_commit:
        description: "xxksu (gavdoc38/KernelSU.git) exact commit SHA — this is a DIFFERENT fork from KernelSU-Next, not a newer pin of it. Must be bumped together with base_ref."
        required: false
        type: string
        default: "f7d5ee64d3591b9158129774814d0629707dc7ac"

      base_branch_hint:
        description: "Branch name to compare base_ref against for drift logging ONLY — never used as the actual checkout ref"
        required: false
        type: string
        default: "lineage-24.0-xxksu3-susfs2"

      susfs_note:
        description: "SUSFS provenance note only — SUSFS v2.3.0 is vendored into the gavdoc38 base tree (fs/susfs.c, include/linux/susfs.h), not a separate checkout"
        required: false
        type: string
        default: "vendored in base branch lineage-24.0-xxksu3-susfs2"

      brand:
        description: "LOCALVERSION suffix (must start with '-'). '-c10x[git7]' resolves to '-c10x' + first 7 hex chars of base_ref. Pick 'Other' to type a custom value."
        required: true
        type: choice
        options:
          - "-Chimera_Mk10"
          - "-24463729"
          - "-c10x[git7]"
          - "Other"
        default: "-Chimera_Mk10"
      custom_brand:
        description: "Custom brand — only used if 'brand' above is set to 'Other' (must start with '-')"
        required: false
        type: string

      build_user:
        description: "KBUILD_BUILD_USER. Pick 'Other' to type a custom value."
        required: true
        type: choice
        options:
          - "MTRXX"
          - "EVOXV"
          - "EVOXG"
          - "DRPFST"
          - "HLCYN"
          - "LOS"
          - "GA"
          - "RC0"
          - "Other"
        default: "Other"
      custom_build_user: 
        description: "Custom build user — only used if 'build_user' above is set to 'Other'"
        required: false
        type: string

      build_host:
        description: "KBUILD_BUILD_HOST"
        required: false
        type: string
        default: "AegisDevLabs"

      build_version:
        description: "KBUILD_BUILD_VERSION (#N token)"
        required: false
        type: string
        default: "1"

      build_date:
        description: "KBUILD_BUILD_TIMESTAMP — ROM label shown for reference only, stripped before use. Pick 'Other' to type a custom value."
        required: true
        type: choice
        options:
          - "MTRXX: Wed Aug 19 03:26:19 UTC 2026"
          - "LOS232: Sat Sep 12 23:46:37 CEST 2026"
          - "LOS24: Fri Sep 25 23:58:24 CEST 2026"
          - "EVOXV: Tue Aug 11 10:23:04 UTC 2026"
          - "EVOXGMS: Tue Aug 11 13:18:57 UTC 2026"
          - "HLCYN: Tue Aug 18 13:16:25 UTC 2026"
          - "DRPFST: Tue Aug 11 07:06:26 UTC 2026"
          - "EVOX18: Tue Sep 22 01:04:29 UTC 2026"
          - "Other"
        default: "LOS24: Fri Sep 25 23:58:24 CEST 2026"
      custom_build_date:
        description: "Custom build timestamp — only used if 'build_date' above is set to 'Other' (no ROM prefix needed here)"
        required: false
        type: string

env:
  # Two-repo layout — see header. Both trees live directly under the workspace.
  #   kernel/           = base repo (compiled)
  #   chimera_overlay/  = overlay repo, sparse (patches/ + chimera-*.cfg)
  CHIMERA_REPO: "https://github.com/${{ inputs.chimera_repo }}.git"
  CHIMERA_REF: ${{ inputs.chimera_ref }}
  OVERLAY_DIR: "chimera_overlay"
  ABS_OVERLAY: ${{ github.workspace }}/chimera_overlay

  KERNEL_DIR: "kernel"
  OUT_DIR: "kernel-out"
  LOG_DIR: "logs"
  ANYKERNEL_DIR: "anykernel3"
  ANYKERNEL_REPO: "https://github.com/osm0sis/AnyKernel3.git"

  DEFCONFIG: "arch/arm64/configs/exynos9810-star2lte_defconfig"

  CCACHE_MAXSIZE: "3G"

  BRAND_DEFAULT: "-Chimera_Mk10"
  BUILD_USER_DEFAULT: "GA"
  BUILD_HOST_DEFAULT: "CM10XNNNN"
  BUILD_VERSION_DEFAULT: "1"
  KBUILD_BUILD_TIMESTAMP_DEFAULT: "Mon 1 Jan 00:00:00 UTC 2026"

  KERNEL_VERSION: "4.9.337"
  KERNEL_NAME: "Chimera Mk10"
  KERNEL_DEVICE: "star2lte"
  KERNEL_PLATFORM: "Exynos 9810"

  PROFILE: ${{ inputs.profile }}
  TOOLCHAIN: ${{ inputs.toolchain }}
  IDENTITY_ENGINE_ACTIVE: ${{ inputs.profile == 'cm9e' }}
  FORCE_REPATCH: ${{ inputs.force_repatch }}
  BASE_REPO: ${{ inputs.base_repo }}

  CHIMERA_KCFLAGS: -O2 -fcommon -fno-strict-aliasing -Wno-error -Wno-error=unused-but-set-global -Wno-unknown-warning-option -fuse-ld=lld
  CHIMERA_KBUILD_LDFLAGS: "-fuse-ld=lld"

jobs:
  build:
    name: Chimera Mk10 xxksu+SUSFS Build — ${{ inputs.profile }} / ${{ inputs.toolchain }}
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    steps:

      # ── 0a. Validate inputs ───────────────────────────────────────────────────
      - name: Validate workflow inputs
        run: |
          set -Eeuo pipefail
          FAIL=0
          case "${{ inputs.profile }}" in
            cm9|cm9e) : ;;
            *) echo "FATAL: profile must be 'cm9' or 'cm9e', got '${{ inputs.profile }}'" >&2; FAIL=1 ;;
          esac
          case "${{ inputs.toolchain }}" in
            llvm22|llvm21|llvm20|aosp23|aosp22|aosp21|aosp20|aosp19|neutron19|neutron23|neutron24|zyc_stable|weebx) : ;;
            *) echo "FATAL: unsupported toolchain '${{ inputs.toolchain }}'" >&2; FAIL=1 ;;
          esac
          if ! [[ "${{ inputs.base_ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: base_ref must be a full 40-hex commit SHA, got '${{ inputs.base_ref }}'" >&2
            FAIL=1
          fi
          if ! [[ "${{ inputs.ksu_commit }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: ksu_commit must be a full 40-hex commit SHA, got '${{ inputs.ksu_commit }}'" >&2
            FAIL=1
          fi
          if ! [[ "${{ inputs.chimera_ref }}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: chimera_ref must be a full 40-hex commit SHA, got '${{ inputs.chimera_ref }}'" >&2
            FAIL=1
          fi
          if [[ -z "${{ inputs.chimera_repo }}" || "${{ inputs.chimera_repo }}" != */* ]]; then
            echo "FATAL: chimera_repo must be 'owner/repo', got '${{ inputs.chimera_repo }}'" >&2
            FAIL=1
          fi
          if [[ -z "${{ inputs.base_repo }}" || "${{ inputs.base_repo }}" != */* ]]; then
            echo "FATAL: base_repo must be 'owner/repo', got '${{ inputs.base_repo }}'" >&2
            FAIL=1
          fi
          # brand dash-prefix check intentionally NOT done here — see
          # "Resolve build identity inputs" below (unchanged from Mk9).
          if [[ -z "${{ inputs.build_date }}" ]]; then
            echo "FATAL: build_date must not be empty" >&2
            FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
          echo "PASS: all workflow_dispatch inputs valid"
      # ── 0a2. Coalesce Other/dropdown inputs into final values ───────────────
      - name: Resolve build identity inputs (choice + Other + ROM-prefix strip)
        run: |
          set -Eeuo pipefail
          if [[ "${{ inputs.brand }}" == "Other" ]]; then
            FINAL_BRAND="${{ inputs.custom_brand }}"
          elif [[ "${{ inputs.brand }}" == "-c10x[git7]" ]]; then
            BASE_REF_FULL="${{ inputs.base_ref }}"
            [[ "$BASE_REF_FULL" =~ ^[0-9a-f]{40}$ ]] || {
              echo "FATAL: cannot derive -c10x[git7] brand — base_ref is not a 40-hex SHA: '$BASE_REF_FULL'" >&2
              exit 1
            }
            FINAL_BRAND="-c10x${BASE_REF_FULL:0:7}"
          else
            FINAL_BRAND="${{ inputs.brand }}"
          fi
          [[ "$FINAL_BRAND" == -* ]] || {
            echo "FATAL: resolved brand must start with '-', got '$FINAL_BRAND'" >&2
            exit 1
          }
          if [[ "${{ inputs.build_user }}" == "Other" ]]; then
            FINAL_BUILD_USER="${{ inputs.custom_build_user }}"
          else
            FINAL_BUILD_USER="${{ inputs.build_user }}"
          fi
          FINAL_BUILD_HOST="${{ inputs.build_host }}"
          FINAL_BUILD_VERSION="${{ inputs.build_version }}"
          if [[ "${{ inputs.build_date }}" == "Other" ]]; then
            FINAL_BUILD_DATE="${{ inputs.custom_build_date }}"
          else
            RAW_DATE="${{ inputs.build_date }}"
            FINAL_BUILD_DATE="${RAW_DATE#*: }"
          fi
          for name in FINAL_BRAND FINAL_BUILD_USER FINAL_BUILD_HOST FINAL_BUILD_VERSION FINAL_BUILD_DATE; do
            [[ -n "${!name}" ]] || {
              echo "FATAL: $name resolved empty — 'Other' selected with an empty custom_* field?" >&2
              exit 1
            }
          done
          {
            echo "FINAL_BRAND=$FINAL_BRAND"
            echo "FINAL_BUILD_USER=$FINAL_BUILD_USER"
            echo "FINAL_BUILD_HOST=$FINAL_BUILD_HOST"
            echo "FINAL_BUILD_VERSION=$FINAL_BUILD_VERSION"
            echo "FINAL_BUILD_DATE=$FINAL_BUILD_DATE"
          } >> "$GITHUB_ENV"
          echo "Resolved brand:         $FINAL_BRAND"
          echo "Resolved build_user:    $FINAL_BUILD_USER"
          echo "Resolved build_host:    $FINAL_BUILD_HOST"
          echo "Resolved build_version: $FINAL_BUILD_VERSION"
          echo "Resolved build_date:    $FINAL_BUILD_DATE"
      # ── 0b. Clean workspace before any checkout ───────────────────────────────
      - name: Clean workspace (prevent cross-run contamination)
        run: |
          set -Eeuo pipefail
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          echo "Workspace clean: $(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 | wc -l) entries remain"
      # ── 1. Host dependencies ────────────────────────────────────────────────
      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            aria2 bc bison build-essential ccache curl flex git \
            libelf-dev libssl-dev lz4 lzop python3 rsync zstd cpio pahole zip
          python3 --version
          curl --version | head -1
      # ── 2. Checkout Chimera overlay (sparse) → chimera_overlay/ ──────────────
      # Only /patches/ and /chimera-*.cfg are materialised (~116 KB instead of a
      # ~61k-file kernel tree). See header for why the overlay repo is sparse.
      - name: Checkout Chimera overlay (sparse — patches/ + chimera-*.cfg)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.chimera_repo }}
          ref: ${{ inputs.chimera_ref }}
          path: ${{ env.OVERLAY_DIR }}
          fetch-depth: 1
          sparse-checkout: |
            /patches/
            /chimera-*.cfg
          sparse-checkout-cone-mode: false
          clean: false

      - name: Validate checked-out Chimera overlay revision
        working-directory: ${{ env.OVERLAY_DIR }}
        run: |
          set -Eeuo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Overlay repo:              $CHIMERA_REPO"
          echo "CHIMERA_REF (pinned SHA):  $CHIMERA_REF"
          echo "Checked-out commit:        $ACTUAL_SHA"
          if [[ "$ACTUAL_SHA" != "$CHIMERA_REF" ]]; then
            echo "FATAL: checked-out overlay commit '$ACTUAL_SHA' does not match pinned chimera_ref '$CHIMERA_REF'" >&2
            exit 1
          fi
          echo "CHIMERA_SHA=$ACTUAL_SHA" >> "$GITHUB_ENV"
      - name: Verify required overlay files (two-repo layout)
        run: |
          set -Eeuo pipefail
          MISSING=0
          for f in \
            patches/apply_chimera_overlay_patches.sh \
            patches/0001-mfd-madera-core-settle-delay-after-reset-release.patch \
            chimera-xxksu-susfs.cfg \
            chimera-device-specific.cfg; do
            if [[ -f "$ABS_OVERLAY/$f" ]]; then
              echo "OK: $OVERLAY_DIR/$f"
            else
              echo "FATAL: required overlay file missing: $OVERLAY_DIR/$f" >&2
              MISSING=1
            fi
          done
          if [[ "$MISSING" -ne 0 ]]; then
            echo >&2
            echo "Files present in the sparse overlay checkout of ${CHIMERA_REPO} @ ${CHIMERA_REF}:" >&2
            ( cd "$ABS_OVERLAY" && find . -path ./.git -prune -o -type f -print | sort ) >&2 || true
            echo >&2
            echo "The chimera_ref commit does not carry the overlay files. Either pass a chimera_ref that does," >&2
            echo "or commit patches/ and chimera-device-specific.cfg to that branch (see workflow header)." >&2
            exit 1
          fi
          SCRIPT="$ABS_OVERLAY/patches/apply_chimera_overlay_patches.sh"
          chmod +x "$SCRIPT"
          # The overlay step scopes GITHUB_WORKSPACE to chimera_overlay/ when it runs
          # the script, which is only correct while the script's sole use of that
          # variable is "$GITHUB_WORKSPACE/patches/...". Fail early if that changes.
          BAD="$(grep -n 'GITHUB_WORKSPACE' "$SCRIPT" | grep -v 'GITHUB_WORKSPACE/patches/' || true)"
          if [[ -n "$BAD" ]]; then
            echo "FATAL: $SCRIPT references GITHUB_WORKSPACE outside patches/ — review its layout assumptions:" >&2
            echo "$BAD" >&2
            exit 1
          fi
          echo "PASS: overlay files present; overlay script's GITHUB_WORKSPACE use is patches/-only"
      # ── 3. Checkout gavdoc38 xxksu+SUSFS base → kernel/ ───────────────────────
      - name: Checkout gavdoc38 base (xxksu + SUSFS v2.3.0 integration)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          ref: ${{ inputs.base_ref }}
          path: ${{ env.KERNEL_DIR }}
          fetch-depth: 1
          submodules: recursive
          clean: false

      # ── 3b. Detect base branch-tip drift (log only) ─────────────────────────
      - name: Detect base branch-tip drift
        run: |
          set -Eeuo pipefail
          TIP="$(git ls-remote "https://github.com/${{ inputs.base_repo }}.git" \
            "refs/heads/${{ inputs.base_branch_hint }}" | cut -f1 || true)"
          echo "Pinned base_ref:                 ${{ inputs.base_ref }}"
          echo "Live tip of ${{ inputs.base_branch_hint }}: ${TIP:-<lookup failed>}"
          if [[ -z "$TIP" ]]; then
            echo "WARN: could not resolve live branch tip for drift comparison (non-fatal)"
          elif [[ "$TIP" != "${{ inputs.base_ref }}" ]]; then
            echo "::warning::base_ref (${{ inputs.base_ref }}) has drifted from the live tip of ${{ inputs.base_branch_hint }} ($TIP). Pin is NOT auto-advanced. Re-run the source audit (build wiring + hook-symbol checks) before repinning — this branch is young (top commit added the xxksu+SUSFS submodule itself) and may still be moving fast."
          else
            echo "OK: base_ref matches the live branch tip — no drift"
          fi
      # ── 3c. Clone AnyKernel3 ─────────────────────────────────────────────────
      - name: Clone AnyKernel3
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail
          git clone --depth=1 "$ANYKERNEL_REPO" "$ANYKERNEL_DIR"
          rm -rf "$ANYKERNEL_DIR/.git" "$ANYKERNEL_DIR/modules" "$ANYKERNEL_DIR/patch" "$ANYKERNEL_DIR/ramdisk"
          echo "AK3 cloned and stripped"
          echo "AK3_DIR=$GITHUB_WORKSPACE/$ANYKERNEL_DIR" >> "$GITHUB_ENV"
      # ── 4. Workspace ─────────────────────────────────────────────────────────
      - name: Prepare workspace directories
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/$LOG_DIR"
          mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"
          echo "ABS_LOG=$GITHUB_WORKSPACE/$LOG_DIR" >> "$GITHUB_ENV"
          echo "ABS_OUT=$GITHUB_WORKSPACE/$OUT_DIR" >> "$GITHUB_ENV"
          echo "ABS_KERNEL=$GITHUB_WORKSPACE/$KERNEL_DIR" >> "$GITHUB_ENV"
          echo "ABS_TC=$GITHUB_WORKSPACE/toolchains/clang" >> "$GITHUB_ENV"
      - name: Resolve build identity
        run: |
          set -Eeuo pipefail
          BRAND="$FINAL_BRAND"
          [[ "${BRAND:0:1}" == "-" ]] || {
            echo "FATAL: brand must start with '-'" >&2
            exit 1
          }
          BUILD_USER="$FINAL_BUILD_USER"
          BUILD_HOST="$FINAL_BUILD_HOST"
          BUILD_VER="$FINAL_BUILD_VERSION"
          BUILD_TS="$FINAL_BUILD_DATE"
          UNAME_PREVIEW="Linux version 4.9.337${BRAND} (${BUILD_USER}@${BUILD_HOST}) #${BUILD_VER} SMP PREEMPT"
          {
            echo "BRAND=$BRAND"
            echo "BUILD_USER=$BUILD_USER"
            echo "BUILD_HOST=$BUILD_HOST"
            echo "BUILD_VERSION=$BUILD_VER"
            echo "KBUILD_BUILD_TIMESTAMP=$BUILD_TS"
            echo "UNAME_PREVIEW=$UNAME_PREVIEW"
          } >> "$GITHUB_ENV"
          {
            echo "profile=${{ inputs.profile }}"
            echo "toolchain=${{ inputs.toolchain }}"
            echo "brand=$BRAND"
            echo "uname_preview=$UNAME_PREVIEW"
          } > "$ABS_LOG/inputs.env"
      # ── 4a2. Guard — required Chimera build-flag env vars present ───────────
      - name: Guard — required Chimera build-flag env vars present
        run: |
          set -Eeuo pipefail
          : "${CHIMERA_KCFLAGS:?CHIMERA_KCFLAGS is empty/unset — check the env: block, not a step-local $KCFLAGS reference}"
          : "${CHIMERA_KBUILD_LDFLAGS:?CHIMERA_KBUILD_LDFLAGS is empty/unset — check the env: block, not a step-local $KBUILD_LDFLAGS reference}"
          case " $CHIMERA_KCFLAGS " in
            *" -fuse-ld=lld "*) : ;;
            *)
              echo "FATAL: -fuse-ld=lld missing from CHIMERA_KCFLAGS." >&2
              exit 1
              ;;
          esac
          echo "OK: CHIMERA_KCFLAGS=$CHIMERA_KCFLAGS"
          echo "OK: CHIMERA_KBUILD_LDFLAGS=$CHIMERA_KBUILD_LDFLAGS"
      # ── 4b. Resolve KCFLAGS hash / kernel identity string ────────────────────
      - name: Generate kernel identity and hash flags
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail
          KCFLAGS_HASH="$(printf '%s\n' "$CHIMERA_KCFLAGS" | sha256sum | cut -d' ' -f1)"
          KERNEL_RELEASE="${KERNEL_VERSION}${BRAND}"
          KERNEL_IDENTITY="chimera-mk10/${PROFILE}/${TOOLCHAIN}/${KERNEL_RELEASE}"
          {
            echo "KCFLAGS_HASH=$KCFLAGS_HASH"
            echo "KERNEL_RELEASE=$KERNEL_RELEASE"
            echo "KERNEL_IDENTITY=$KERNEL_IDENTITY"
          } >> "$GITHUB_ENV"
          {
            echo "kernel_name=$KERNEL_NAME"
            echo "kernel_version=$KERNEL_VERSION"
            echo "kernel_release=$KERNEL_RELEASE"
            echo "device=$KERNEL_DEVICE"
            echo "platform=$KERNEL_PLATFORM"
            echo "profile=$PROFILE"
            echo "toolchain=$TOOLCHAIN"
            echo "kcflags=$CHIMERA_KCFLAGS"
            echo "kbuild_ldflags=$CHIMERA_KBUILD_LDFLAGS"
            echo "kcflags_sha256=$KCFLAGS_HASH"
            echo "identity=$KERNEL_IDENTITY"
          } > "$ABS_LOG/kernel-identity.txt"
          echo "Kernel identity: $KERNEL_IDENTITY"
          echo "KCFLAGS: $CHIMERA_KCFLAGS"
          echo "KCFLAGS SHA-256: $KCFLAGS_HASH"
      # ── 5. Validate base ─────────────────────────────────────────────────────
      - name: Preflight — verify base ref and clean worktree
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          if [[ -n "$(git status --porcelain --ignore-submodules=none)" ]]; then
            echo "FATAL: base checkout is not clean" >&2
            git status --short
            exit 1
          fi
          grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL)' Makefile \
            | head -3 \
            | tee "$ABS_LOG/kernel-version.log"
          VER_LINE="$(grep -E '^VERSION\s*=\s*4$' Makefile || true)"
          PATCH_LINE="$(grep -E '^PATCHLEVEL\s*=\s*9$' Makefile || true)"
          if [[ -z "$VER_LINE" || -z "$PATCH_LINE" ]]; then
            echo "FATAL: base is not the expected 4.9.x tree — refusing to proceed" >&2
            exit 1
          fi
          BASE_COMMIT="$(git rev-parse HEAD)"
          if [[ "$BASE_COMMIT" != "${{ inputs.base_ref }}" ]]; then
            echo "FATAL: checked-out HEAD ($BASE_COMMIT) does not match requested base_ref (${{ inputs.base_ref }})" >&2
            exit 1
          fi
          echo "$BASE_COMMIT" > "$ABS_LOG/base-commit.txt"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"
          echo "Base repo:   ${{ inputs.base_repo }}"
          echo "Base commit: $BASE_COMMIT"
          [[ -f "$DEFCONFIG" ]] || {
            echo "FATAL: DEFCONFIG not found at $DEFCONFIG in base checkout" >&2
            exit 1
          }
          echo "OK: DEFCONFIG present at $DEFCONFIG"
      # ── 6. xxksu submodule pin verification ─────────────────────────────────
      - name: Verify / re-pin xxksu (KernelSU) submodule commit
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          KSU_SUB="KernelSU"
          WANT="${{ inputs.ksu_commit }}"
          [[ -d "$KSU_SUB/.git" || -f "$KSU_SUB/.git" ]] || {
            echo "FATAL: KernelSU submodule not populated — checkout submodules:recursive failed?" >&2
            exit 1
          }
          ACTUAL="$(git -C "$KSU_SUB" rev-parse HEAD)"
          if [[ "$ACTUAL" != "$WANT" ]]; then
            echo "Submodule pinned to $ACTUAL, requested $WANT — re-checking out requested commit"
            git -C "$KSU_SUB" fetch --no-tags --depth=100 origin "$WANT"
            git -C "$KSU_SUB" checkout --detach "$WANT"
            ACTUAL="$(git -C "$KSU_SUB" rev-parse HEAD)"
          fi
          echo "$ACTUAL" > "$ABS_LOG/ksu-commit.txt"
          echo "KSU_GIT_VERSION=$(git -C "$KSU_SUB" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "xxksu (KernelSU) commit: $ACTUAL"
      # ── 7. Verify xxksu build-system wiring (REPLACES Mk9 steps 7/7b/8/9) ───
      # xxksu self-registers all its hooks at runtime (sys_call_table +
      # security_hook_heads pointer rewrite via device_initcall) — there is
      # no manual call site in fs/exec.c, fs/open.c, fs/stat.c, kernel/sys.c,
      # etc. to verify, unlike KernelSU-Next. What CAN silently break for
      # this fork is the Kconfig/Makefile plumbing that connects the
      # submodule into the build, so that is what this step checks. All paths
      # are relative to kernel/ (the base repo); nothing here looks at
      # chimera_overlay/.
      - name: Verify xxksu build-system wiring
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          FAIL=0
          check() {
            local desc="$1" pattern="$2" file="$3"
            if grep -qE "$pattern" "$file" 2>/dev/null; then
              echo "OK:    $desc"
            else
              echo "FATAL: $desc — not found in $file"
              FAIL=1
            fi
          }
          check "drivers/Kconfig sources drivers/kernelsu/Kconfig" \
            'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          check "drivers/Makefile builds kernelsu/ under CONFIG_KSU" \
            'obj-\$\(CONFIG_KSU\) \+= kernelsu/' drivers/Makefile
          check "fs/Makefile builds susfs.o under CONFIG_KSU_SUSFS" \
            'obj-\$\(CONFIG_KSU_SUSFS\) \+= susfs.o' fs/Makefile
          check ".gitmodules maps KernelSU to gavdoc38/KernelSU (xxksu)" \
            'url = https://github.com/gavdoc38/KernelSU(\.git)?$' .gitmodules
          if [[ -L drivers/kernelsu ]]; then
            LINK_TARGET="$(readlink drivers/kernelsu)"
            echo "OK:    drivers/kernelsu is a symlink -> $LINK_TARGET"
            if [[ -d drivers/kernelsu ]]; then
              echo "OK:    drivers/kernelsu resolves to an existing directory (submodule populated)"
            else
              echo "FATAL: drivers/kernelsu symlink target does not resolve — submodule not populated or path moved" >&2
              FAIL=1
            fi
          else
            echo "FATAL: drivers/kernelsu is not a symlink (expected -> ../KernelSU/kernel) — layout may have changed upstream" >&2
            FAIL=1
          fi
          for f in KernelSU/kernel/ksu.c KernelSU/kernel/Kconfig KernelSU/kernel/hook/lsm_hooks_list.c KernelSU/kernel/hook/syscall_table_hook_arm64.c; do
            if [[ -f "$f" ]]; then
              echo "OK:    $f"
            else
              echo "FATAL: $f not found — submodule content missing or xxksu layout changed" >&2
              FAIL=1
            fi
          done
          grep -qE 'device_initcall\(kernelsu_init\)' KernelSU/kernel/ksu.c || {
            echo "FATAL: kernelsu_init is not registered via device_initcall — xxksu's self-hooking entry point may have moved" >&2
            FAIL=1
          }
          [[ "$FAIL" -eq 0 ]] || {
            echo
            echo "One or more xxksu build-wiring connections expected from base_ref=${{ inputs.base_ref }} were not found."
            exit 1
          }
          echo
          echo "PASS: xxksu build-system wiring intact — no manual hook call-sites required for this fork"
      # ── 11. Chimera overlay ───────────────────────────────────────────────────
      # Runs chimera_overlay/patches/apply_chimera_overlay_patches.sh with
      # cwd = kernel/. The script's single $GITHUB_WORKSPACE reference is the
      # madera patch path ("$GITHUB_WORKSPACE/patches/..."); scoping the
      # variable to the overlay checkout for this one command (VAR=x cmd, not
      # exported) makes that resolve to chimera_overlay/patches/ without
      # copying or symlinking anything. Coupling is guarded in step 2.
      - name: Apply Chimera overlay
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          LOG="$ABS_LOG/overlay.log"
          echo "Chimera overlay started at $(date -u)" > "$LOG"
          echo "Overlay source: $CHIMERA_REPO @ $CHIMERA_SHA" | tee -a "$LOG"
          sed -i \
            '/^CONFIG_LOCALVERSION=/d;/^CONFIG_DEFAULT_HOSTNAME=/d;/^CONFIG_CC_STACKPROTECTOR_STRONG=/d;/^CONFIG_CC_STACKPROTECTOR=/d' \
            "$DEFCONFIG"
          printf \
            'CONFIG_LOCALVERSION="%s"\nCONFIG_DEFAULT_HOSTNAME="%s"\n# CONFIG_CC_STACKPROTECTOR_STRONG is not set\nCONFIG_CC_STACKPROTECTOR=y\n' \
            "$BRAND" \
            "$BUILD_HOST" \
            >> "$DEFCONFIG"
          printf \
            '#!/bin/sh\nprintf "%%s" "%s"\n' \
            "$BRAND" \
            > scripts/setlocalversion
          chmod +x scripts/setlocalversion
          echo "$BRAND" > localversion
          GITHUB_WORKSPACE="$ABS_OVERLAY" \
            bash "$ABS_OVERLAY/patches/apply_chimera_overlay_patches.sh" \
            2>&1 | tee -a "$LOG"
          echo \
            "Overlay applied (profile=$PROFILE, brand=$BRAND)" \
            | tee -a "$LOG"
      # ── 11b. Verify Chimera overlay landed completely ────────────────────────
      # Markers/paths unchanged from Mk9. All of them were observed passing on
      # the d6c6d8b base in CI run 35862553362.
      - name: Verify Chimera overlay markers
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          FAIL=0
          check() {
            local desc="$1" marker="$2" file="$3"
            if grep -q "$marker" "$file" 2>/dev/null; then
              echo "OK:    $desc"
            else
              echo "FATAL: $desc — marker '$marker' not found in $file"
              FAIL=1
            fi
          }
          check "UFC short-circuit"            "CMK9_UFC_SHORT_CIRCUIT"        "drivers/cpufreq/exynos-ufc.c"
          check "mem_rw() SUS_MAP guard"       "CMK9_MEM_RW_SUS_MAP_GUARD"     "fs/proc/base.c"
          check "namei sus_path sub-path recheck" "CMK9_NAMEI_SUS_PATH_RECHECK" "fs/namei.c"
          check "board DTS tuning"             "CMK9_DTS_BOARD_TUNING"         "arch/arm64/boot/dts/exynos/exynos9810-star2lte_eur_open_26.dts"
          check "sugov rate limit tuning"       "CMK9_SUGOV_RATE_LIMIT"        "kernel/sched/cpufreq_schedutil.c"
          check "sugov kthread priority (SCHED_RR)" "CMK9_SUGOV_KTHREAD_PRIORITY" "kernel/sched/cpufreq_schedutil.c"
          check "sugov_init() rate limit"       "CMK9_SUGOV_INIT_RATE_LIMIT"   "kernel/sched/cpufreq_schedutil.c"
          grep -q 'normalized_sysctl_sched_min_granularity = 5000000ULL' kernel/sched/fair.c \
            && echo "OK:    fair.c min_granularity tuned" \
            || { echo "FATAL: fair.c min_granularity not tuned"; FAIL=1; }
          grep -q 'sysctl_sched_migration_cost = 2000000UL' kernel/sched/fair.c \
            && echo "OK:    fair.c migration_cost tuned" \
            || { echo "FATAL: fair.c migration_cost not tuned"; FAIL=1; }
          [[ "$FAIL" -eq 0 ]] || {
            exit 1
          }
          echo
          echo "PASS: all Chimera overlay markers present"
      # ── 11c. Toolchain resolution ────────────────────────────────────────────
      # aosp23 added per user-supplied URL — UNVERIFIED, see header.
      - name: Resolve toolchain configuration
        id: tc-resolve
        run: |
          set -Eeuo pipefail
          TOOLCHAIN="${{ inputs.toolchain }}"
          TC_URL=""
          TC_ARCHIVE_FMT="tar.gz"
          TC_CACHE_KEY=""
          TC_LLVM_IAS="1"
          TC_USE_FULL_LLVM="true"
          TC_HOSTLDFLAGS=""
          TC_SHA256=""
          case "$TOOLCHAIN" in
            aosp19)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-15.0.0_r10/clang-r536225.tar.gz"
              TC_CACHE_KEY="aosp-clang-r536225-ubuntu-24.04-v2"
              ;;
            aosp20)
              TC_URL="https://gitlab.com/kei-space/clang/r547379/-/archive/master/r547379-master.tar.gz"
              TC_CACHE_KEY="aosp-clang-r547379-ubuntu-24.04-v2"
              ;;
            aosp21)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/21b19c041de1f1df9b97fd9902ae5405c6cf8eb9/clang-r563880c.tar.gz"
              TC_CACHE_KEY="aosp-clang-r563880c-ubuntu-24.04-v2"
              ;;
            aosp22)
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/mirror-goog-main-llvm-toolchain-source/clang-r596125.tar.gz"
              TC_CACHE_KEY="aosp-clang-r596125-ubuntu-24.04-v2"
              ;;
            aosp23)
              # AOSP Clang r614150 (reported as Clang 23.0.1) — archive URL
              # supplied directly by the user, NOT discovered/verified by this
              # workflow's usual source-audit process. android.googlesource.com
              # was unreachable from the environment that edited this file
              # (blocked by robots.txt for its fetch tool, and not present in
              # its sandboxed outbound network allowlist), so none of the
              # following were checked: the archive downloads/extracts, its
              # internal layout has a bin/ dir the "Configure toolchain PATH"
              # step's shallowest-match logic can find, it actually reports as
              # Clang 23.0.1, or its bundled binutils prefixes match
              # CROSS_COMPILE/CROSS_COMPILE_ARM32 below. No TC_SHA256 is pinned
              # here (unlike weebx) because no checksum was computed — treat
              # the first CI run on this entry as the real validation.
              TC_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/28337064939c0b4bb5804cddf35fb03d860edcf6/clang-r614150.tar.gz"
              TC_CACHE_KEY="aosp-clang-r614150-ubuntu-24.04-v1"
              ;;
            llvm20)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-20.1.8-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="korg-clang-20.1.8-ubuntu-24.04-v1"
              ;;
            llvm21)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-21.1.0-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-21.1.0-ubuntu-24.04-v1"
              ;;
            llvm22)
              TC_URL="https://mirrors.edge.kernel.org/pub/tools/llvm/files/llvm-22.1.7-x86_64.tar.xz"
              TC_ARCHIVE_FMT="tar.xz"
              TC_CACHE_KEY="llvm-clang-22.1.7-ubuntu-24.04-v1"
              ;;
            neutron19)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-10032024-ubuntu-24.04-v2"
              ;;
            neutron23)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30062026/neutron-clang-30062026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30062026-ubuntu-24.04-v2"
              ;;
            neutron24)
              TC_URL="https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/30072026/neutron-clang-30072026.tar.zst"
              TC_ARCHIVE_FMT="tar.zst"
              TC_CACHE_KEY="neutron-clang-30072026-ubuntu-24.04-v2"
              ;;
            zyc_stable)
              TC_URL=$(curl -fsSL \
                "https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt" \
                || true)
              if [[ -n "$TC_URL" ]]; then
                TC_CACHE_KEY="zyc-clang-ubuntu-24.04-$(printf '%s' "$TC_URL" | sha256sum | cut -c1-16)"
              else
                TC_CACHE_KEY="zyc-clang-ubuntu-24.04-lookup-failed"
              fi
              ;;
            weebx)
              TC_URL="https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-20.0.0git-release/WeebX-Clang-20.0.0git.tar.gz"
              TC_ARCHIVE_FMT="tar.gz"
              TC_CACHE_KEY="weebx-clang-20.0.0git-20241206-ubuntu-24.04-v1"
              TC_SHA256="a2ac878d7f26fc1ac7d90d1330e4e34b62676d3a2326673b78b7799e1d8a0a7c"
              ;;
            *)
              echo "ERROR: unsupported toolchain '$TOOLCHAIN'" >&2
              exit 1
              ;;
          esac
          {
            echo "TC_URL=$TC_URL"
            echo "TC_ARCHIVE_FMT=$TC_ARCHIVE_FMT"
            echo "TC_CACHE_KEY=$TC_CACHE_KEY"
            echo "TC_LLVM_IAS=$TC_LLVM_IAS"
            echo "TC_USE_FULL_LLVM=$TC_USE_FULL_LLVM"
            echo "TC_HOSTLDFLAGS=$TC_HOSTLDFLAGS"
            echo "TC_SHA256=$TC_SHA256"
          } >> "$GITHUB_ENV"
          echo "TC_CACHE_KEY=$TC_CACHE_KEY" >> "$GITHUB_OUTPUT"
      - name: Cache toolchain
        uses: actions/cache@v4
        id: tc-cache
        with:
          path: toolchains/clang
          key: ${{ env.TC_CACHE_KEY }}

      - name: Download and extract toolchain
        if: steps.tc-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          rm -rf "$ABS_TC"
          mkdir -p "$ABS_TC"
          ARCHIVE="/tmp/clang_archive"
          if [[ -z "$TC_URL" ]]; then
            echo "FATAL: TC_URL is empty (zyc_stable's dynamic link lookup may have failed upstream)" >&2
            exit 1
          fi
          DL_HOST="$(printf '%s' "$TC_URL" | sed -E 's#^[a-z]+://([^/]+)/.*#\1#')"
          if [[ "$DL_HOST" == "android.googlesource.com" ]]; then
            # android.googlesource.com's +archive endpoint returns 503 under
            # aria2's default 16-connection range-request mode (observed:
            # run aborted with "response status is not successful. status=503"
            # after exhausting aria2's 5-try budget). UNVERIFIED root cause —
            # inferred from the 503 pattern, not confirmed with Google; this
            # sandbox cannot reach the host to test. Fall back to a single
            # connection with its own longer backoff.
            echo "android.googlesource.com detected — using single-connection curl (see comment)"
            for attempt in $(seq 1 8); do
              if curl -fL --connect-timeout 30 --max-time 300 -o "$ARCHIVE" "$TC_URL"; then
                break
              fi
              echo "curl attempt $attempt/8 failed (likely 503 throttle); backing off $((attempt * 10))s" >&2
              rm -f "$ARCHIVE"
              sleep $((attempt * 10))
            done
          else
            aria2c -x 16 -s 16 -k 1M -c \
              --max-tries=5 --retry-wait=5 --timeout=60 \
              --dir="/tmp" --out="clang_archive" \
              "$TC_URL"
          fi
          if [[ ! -s "$ARCHIVE" ]]; then
            echo "FATAL: failed to download the toolchain archive (host: ${DL_HOST:-unknown}), or it is empty." >&2
            exit 1
          fi
          if [[ -n "${TC_SHA256:-}" ]]; then
            ACTUAL_TC_SHA256="$(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
            if [[ "$ACTUAL_TC_SHA256" != "$TC_SHA256" ]]; then
              echo "FATAL: toolchain archive SHA-256 mismatch (expected $TC_SHA256, got $ACTUAL_TC_SHA256)" >&2
              exit 1
            fi
            echo "OK: toolchain archive SHA-256 verified ($TC_SHA256)"
          fi
          case "$TC_ARCHIVE_FMT" in
            tar.gz|tar) tar -C "$ABS_TC" -xzf "$ARCHIVE" ;;
            tar.xz)     tar -C "$ABS_TC" -xJf "$ARCHIVE" ;;
            tar.zst)    zstd -d "$ARCHIVE" -o /tmp/clang.tar --force && tar -C "$ABS_TC" -xf /tmp/clang.tar ;;
            *) echo "FATAL: unrecognized TC_ARCHIVE_FMT '$TC_ARCHIVE_FMT'" >&2; exit 1 ;;
          esac
          if [[ -z "$(find "$ABS_TC" -type f -print -quit)" ]]; then
            echo "FATAL: extraction reported success but $ABS_TC contains no files" >&2
            exit 1
          fi
          echo "Toolchain ready: $(find "$ABS_TC" -type f | wc -l) file(s)"
          
      - name: Configure toolchain PATH
        run: |
          set -Eeuo pipefail
          ACTUAL_BIN=$(find "$ABS_TC" -type d -name "bin" -printf "%d\t%p\n" | sort -n | cut -f2 | head -n 1)
          if [[ -z "$ACTUAL_BIN" || ! -d "$ACTUAL_BIN" ]]; then
            echo "FATAL: Could not find 'bin' directory inside extracted toolchain ($ABS_TC)."
            exit 1
          fi
          echo "Found toolchain bin: $ACTUAL_BIN"
          chmod +x "$ACTUAL_BIN"/* 2>/dev/null || true
          echo "$ACTUAL_BIN" >> "$GITHUB_PATH"
      - name: Verify Toolchain and capture compiler identity
        run: |
          set -Eeuo pipefail
          for bin in clang llvm-nm llvm-objdump llvm-ar llvm-objcopy llvm-strip ld.lld; do
            command -v "$bin" >/dev/null 2>&1 || {
              echo "FATAL: required toolchain binary '$bin' not found in PATH" >&2
              exit 1
            }
          done
          CLANG_VERSION="$(clang --version | head -1)"
          LLD_VERSION="$(ld.lld --version | head -1)"
          echo "$CLANG_VERSION"
          llvm-nm --version | head -1
          llvm-objdump --version | head -1
          echo "$LLD_VERSION"
          [[ -n "$CLANG_VERSION" ]] || { echo "FATAL: clang --version produced no output" >&2; exit 1; }
          TC_IDENTITY_HASH="$(printf '%s\n%s\n' "$CLANG_VERSION" "$LLD_VERSION" | sha256sum | cut -d' ' -f1 | head -c 16)"
          {
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "TC_IDENTITY_HASH=$TC_IDENTITY_HASH"
          } >> "$GITHUB_ENV"
          {
            echo "$CLANG_VERSION"
            echo "$LLD_VERSION"
          } > "$ABS_LOG/toolchain-identity.txt"
      # ── 12. Kconfig fragments: sanitize + validate ───────────────────────────
      # Sources: chimera_overlay/chimera-xxksu-susfs.cfg and
      #          chimera_overlay/chimera-device-specific.cfg.
      # merge_config.sh (this 4.9 tree's copy) finds symbols with `grep -w`, so
      # a COMMENT that merely mentions "CONFIG_KSU_TAMPER_SYSCALL_TABLE" is
      # treated as a redefinition and appended to .config as junk (the CI log
      # showed "Value of CONFIG_KSU is redefined ... New value: # symbol names
      # overlap (CONFIG_KSU ..." and ~80 stray comment lines land in .config).
      # Final values were still right, but that is luck. So the merge consumes
      # comment-stripped copies (only `CONFIG_X=...` and `# CONFIG_X is not set`
      # lines are kept) written to logs/fragments/ for audit. The overlay files
      # themselves are never modified.
      - name: Validate Kconfig fragments (sanitize, symbol-check)
        run: |
          set -Eeuo pipefail
          FRAG_DIR="$ABS_LOG/fragments"
          mkdir -p "$FRAG_DIR"
          sanitize_frag() {
            grep -E '^(CONFIG_[A-Za-z0-9_]+=.*|# CONFIG_[A-Za-z0-9_]+ is not set)[[:space:]]*$' "$1" \
              | sed 's/[[:space:]]*$//' || true
          }
          for name in chimera-xxksu-susfs chimera-device-specific; do
            SRC="$ABS_OVERLAY/$name.cfg"
            [[ -s "$SRC" ]] || { echo "FATAL: $SRC missing or empty" >&2; exit 1; }
            sanitize_frag "$SRC" > "$FRAG_DIR/$name.cfg"
            [[ -s "$FRAG_DIR/$name.cfg" ]] || { echo "FATAL: $name.cfg has no CONFIG_ lines after sanitizing" >&2; exit 1; }
            echo "$name.cfg: kept $(wc -l < "$FRAG_DIR/$name.cfg") of $(wc -l < "$SRC") lines"
          done
          echo "FRAG_DIR=$FRAG_DIR" >> "$GITHUB_ENV"
          CFG="$FRAG_DIR/chimera-xxksu-susfs.cfg"
          grep -qx 'CONFIG_KSU=y' "$CFG"      || { echo "FATAL: CONFIG_KSU=y missing from chimera-xxksu-susfs.cfg" >&2; exit 1; }
          grep -qx 'CONFIG_KSU_SUSFS=y' "$CFG" || { echo "FATAL: CONFIG_KSU_SUSFS=y missing from chimera-xxksu-susfs.cfg" >&2; exit 1; }
          # xxksu hook-mode symbols (no MANUAL_HOOK/KPROBES_HOOK equivalents exist
          # in this fork's Kconfig):
          if ! grep -qxE 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y|CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$CFG"; then
            echo "FATAL: neither CONFIG_KSU_TAMPER_SYSCALL_TABLE nor CONFIG_KSU_LSM_SECURITY_HOOKS is set — xxksu would have no active hook path" >&2
            exit 1
          fi
          if grep -qhE 'CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_KPROBES_HOOK' "$FRAG_DIR"/*.cfg; then
            echo "FATAL: CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_KPROBES_HOOK are KernelSU-Next symbols, not valid in xxksu's Kconfig — remove from the overlay fragments" >&2
            exit 1
          fi
          # Every CONFIG_KSU* symbol a fragment sets must exist in the pinned
          # xxksu Kconfig; otherwise Kconfig silently drops it (the failure mode
          # of pasting a KernelSU-Next fragment onto xxksu).
          KSU_KCONFIGS="$ABS_KERNEL/KernelSU/kernel"
          FAIL=0
          while IFS= read -r sym; do
            if grep -rqE "^(menu)?config ${sym#CONFIG_}[[:space:]]*$" "$KSU_KCONFIGS" --include='Kconfig*'; then
              echo "OK:    $sym defined in xxksu Kconfig"
            else
              echo "FATAL: $sym is set by a fragment but not defined in KernelSU/kernel Kconfig*" >&2
              FAIL=1
            fi
          done < <(grep -ohE '^(# )?CONFIG_KSU[A-Za-z0-9_]*' "$FRAG_DIR"/*.cfg | sed 's/^# //' | sort -u)
          [[ "$FAIL" -eq 0 ]] || exit 1
          cat "$CFG"
      # ── 13. Merge Kconfig ────────────────────────────────────────────────────
      # Mk9 step 14 ("Normalize KernelSU hook mode") is intentionally absent:
      # xxksu has no CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_KPROBES_HOOK, and
      # merge_config -m already makes the fragment authoritative. Instead, after
      # olddefconfig, every symbol the fragments set is compared with the final
      # .config and any drift is reported (warning-only; the hard guards are the
      # next step and the vmlinux symbol guard).
      - name: Merge Kconfig fragments
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            "$(basename "$DEFCONFIG")" \
            | tee "$ABS_LOG/defconfig-base.log"
          scripts/kconfig/merge_config.sh \
            -m \
            -O "$ABS_OUT" \
            "$ABS_OUT/.config" \
            "$FRAG_DIR/chimera-xxksu-susfs.cfg" \
            "$FRAG_DIR/chimera-device-specific.cfg" \
            | tee "$ABS_LOG/merge-config.log"
          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            olddefconfig \
            | tee -a "$ABS_LOG/merge-config.log"
          echo
          echo "========== xxksu hook-mode symbols after merge+olddefconfig =========="
          grep '^CONFIG_KSU' "$ABS_OUT/.config" || true
          cp "$ABS_OUT/.config" "$ABS_LOG/post-merge.config"
          # Fragment intent vs final .config (warning-only).
          DRIFT=0
          : > "$ABS_LOG/fragment-drift.log"
          re_unset='^# (CONFIG_[A-Za-z0-9_]+) is not set$'
          re_set='^(CONFIG_[A-Za-z0-9_]+)=(.*)$'
          for frag in "$FRAG_DIR/chimera-xxksu-susfs.cfg" "$FRAG_DIR/chimera-device-specific.cfg"; do
            while IFS= read -r line; do
              if [[ "$line" =~ $re_set ]]; then
                sym="${BASH_REMATCH[1]}"; want="${BASH_REMATCH[2]}"
              elif [[ "$line" =~ $re_unset ]]; then
                sym="${BASH_REMATCH[1]}"; want="n"
              else
                continue
              fi
              if [[ "$want" == "n" ]]; then
                if grep -qE "^${sym}=[ym]$" "$ABS_OUT/.config"; then
                  echo "DRIFT: $(basename "$frag") wants ${sym} off, final .config has it on" | tee -a "$ABS_LOG/fragment-drift.log"
                  DRIFT=$((DRIFT + 1))
                fi
              elif ! grep -qxF "${sym}=${want}" "$ABS_OUT/.config"; then
                echo "DRIFT: $(basename "$frag") wants ${sym}=${want}, final .config has: $(grep -E "^(# )?${sym}[= ]" "$ABS_OUT/.config" | head -1 || true)" | tee -a "$ABS_LOG/fragment-drift.log"
                DRIFT=$((DRIFT + 1))
              fi
            done < "$frag"
          done
          if [[ "$DRIFT" -gt 0 ]]; then
            echo "::warning::$DRIFT fragment symbol(s) did not survive olddefconfig — see logs/fragment-drift.log (missing dependency or symbol not in this tree's Kconfig)"
          else
            echo "OK: every fragment symbol is present in the final .config as requested"
          fi
      # ── 14b. Security/config guard ────────────────────────────────────────────
      # REQUIRED array: CONFIG_KSU_MANUAL_HOOK removed (not a real symbol in
      # xxksu). FORBIDDEN array unchanged from Mk9; none of those symbols are
      # forced =y by this base's defconfig, and this guard passed on the
      # d6c6d8b tree in CI run 35862553362.
      - name: Guard pass — verify security restrictions disabled and KSU/SUSFS enabled
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          CFG="$ABS_OUT/.config"
          FORBIDDEN=(
            CONFIG_RKP_KDP
            CONFIG_UH_RKP
            CONFIG_TIMA
            CONFIG_TIMA_LKMAUTH
            CONFIG_FIVE
            CONFIG_SEC_RESTRICT_ROOTING
            CONFIG_SEC_RESTRICT_SETUID
            CONFIG_SECURITY_DEFEX
            CONFIG_KNOX_KAP
          )
          FAIL=0
          : > "$ABS_LOG/config-guard.log"
          for sym in "${FORBIDDEN[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "FATAL: $sym=y" | tee -a "$ABS_LOG/config-guard.log"
              FAIL=1
            else
              echo "OK: $sym disabled" | tee -a "$ABS_LOG/config-guard.log"
            fi
          done
          REQUIRED=(
            CONFIG_KSU
            CONFIG_KSU_SUSFS
            CONFIG_KSU_SUSFS_SUS_PATH
            CONFIG_KSU_SUSFS_SUS_MAP
            CONFIG_KSU_SUSFS_SUS_KSTAT
            CONFIG_HZ_300
            CONFIG_TCP_CONG_ADVANCED
            CONFIG_TCP_CONG_BBR
            CONFIG_TCP_CONG_CUBIC
            CONFIG_DEFAULT_BBR
            CONFIG_NET_SCHED
            CONFIG_NET_SCH_FQ
            CONFIG_NET_SCH_FQ_CODEL
          )
          for sym in "${REQUIRED[@]}"; do
            if grep -qE "^${sym}=y" "$CFG"; then
              echo "OK: $sym=y" | tee -a "$ABS_LOG/config-guard.log"
            else
              echo "FATAL: $sym is not enabled" | tee -a "$ABS_LOG/config-guard.log"
              FAIL=1
            fi
          done
          # At least one real xxksu hook-mode symbol must be active.
          if ! grep -qE '^CONFIG_KSU_TAMPER_SYSCALL_TABLE=y|^CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$CFG"; then
            echo "FATAL: no xxksu hook-mode symbol enabled in final .config" | tee -a "$ABS_LOG/config-guard.log"
            FAIL=1
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
      # ── 16. ccache ───────────────────────────────────────────────────────────
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: >-
            chimera-mk10-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-${{ github.sha }}
          restore-keys: |
            chimera-mk10-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ env.TC_CACHE_KEY }}-${{ env.TC_IDENTITY_HASH }}-
          max-size: ${{ env.CCACHE_MAXSIZE }}

      # ── 17. Finalize config ───────────────────────────────────────────────────
      - name: Finalise kernel .config
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          make \
            O="$ABS_OUT" \
            ARCH=arm64 \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            HOSTLDFLAGS="$TC_HOSTLDFLAGS" \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig
          cp \
            "$ABS_OUT/.config" \
            "$ABS_LOG/config.built"
          grep -E \
            '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SEC_RESTRICT|CONFIG_RKP|CONFIG_TIMA|CONFIG_FIVE|CONFIG_LOCALVERSION)' \
            "$ABS_OUT/.config" \
            | tee "$ABS_LOG/config-summary.txt"
          FINAL_CONFIG_HASH="$(sha256sum "$ABS_OUT/.config" | cut -d' ' -f1)"
          echo "FINAL_CONFIG_HASH=$FINAL_CONFIG_HASH" >> "$GITHUB_ENV"
          echo "Final .config SHA-256: $FINAL_CONFIG_HASH"
      # ── 18. Build Image and DTBs ──────────────────────────────────────────────
      - name: Build kernel Image and device DTBs
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        env:
          ARCH: arm64
          SUBARCH: arm64
          KBUILD_BUILD_USER: ${{ env.BUILD_USER }}
          KBUILD_BUILD_HOST: ${{ env.BUILD_HOST }}
          KBUILD_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          CC: ccache clang
          LD: ld.lld
          AR: llvm-ar
          NM: llvm-nm
          OBJCOPY: llvm-objcopy
          OBJDUMP: llvm-objdump
          STRIP: llvm-strip
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -Eeuo pipefail
          JOBS="$(nproc)"
          MAKE_ARGS=(
            "O=$ABS_OUT"
            "ARCH=arm64"
            "CC=ccache clang"
            "LLVM=1"
            "LLVM_IAS=1"
            "HOSTLDFLAGS=${TC_HOSTLDFLAGS}"
            "LD=ld.lld"
            "AR=llvm-ar"
            "NM=llvm-nm"
            "OBJCOPY=llvm-objcopy"
            "OBJDUMP=llvm-objdump"
            "STRIP=llvm-strip"
            "CLANG_TRIPLE=aarch64-linux-gnu-"
            "CROSS_COMPILE=aarch64-linux-gnu-"
            "CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
            "-j${JOBS}"
            "LOCALVERSION=${BRAND}"
            "KCFLAGS=${CHIMERA_KCFLAGS}"
            "KBUILD_LDFLAGS=${CHIMERA_KBUILD_LDFLAGS}"
          )
          make \
            "${MAKE_ARGS[@]}" \
            Image \
            vmlinux \
            dtbs \
            2>&1 \
            | tee "$ABS_LOG/build.log"
          {
            echo "Build identity: $KERNEL_IDENTITY"
            echo "Kernel release: $KERNEL_RELEASE"
            echo "KCFLAGS: $CHIMERA_KCFLAGS"
            echo "KCFLAGS SHA-256: $KCFLAGS_HASH"
            echo "KBUILD_LDFLAGS: $CHIMERA_KBUILD_LDFLAGS"
          } | tee "$ABS_LOG/build-flags.txt"
      # ── 18b. Verify KCFLAGS actually reached the build unmodified ───────────
      - name: Verify build identity and KCFLAGS
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          [[ -n "$CHIMERA_KCFLAGS" ]] || { echo "FATAL: KCFLAGS is empty" >&2; exit 1; }
          [[ -n "$KCFLAGS_HASH" ]] || { echo "FATAL: KCFLAGS_HASH is empty" >&2; exit 1; }
          ACTUAL_HASH="$(printf '%s\n' "$CHIMERA_KCFLAGS" | sha256sum | cut -d' ' -f1)"
          if [[ "$ACTUAL_HASH" != "$KCFLAGS_HASH" ]]; then
            echo "FATAL: KCFLAGS hash mismatch (expected $KCFLAGS_HASH, got $ACTUAL_HASH)" >&2
            exit 1
          fi
          grep -Fq "KCFLAGS: $CHIMERA_KCFLAGS" "$ABS_LOG/build-flags.txt" || {
            echo "FATAL: build log does not contain the expected KCFLAGS" >&2
            exit 1
          }
          grep -Fq "Build identity: $KERNEL_IDENTITY" "$ABS_LOG/build-flags.txt" || {
            echo "FATAL: build identity missing from build metadata" >&2
            exit 1
          }
          echo "PASS: kernel identity and KCFLAGS verified"
          echo "Identity: $KERNEL_IDENTITY"
          echo "KCFLAGS: $CHIMERA_KCFLAGS"
          echo "KCFLAGS SHA-256: $KCFLAGS_HASH"
      # ── 19. vmlinux xxksu/SUSFS symbol guard ─────────────────────────────────
      # Why the Mk9 / first-Mk10 list failed: xxksu is one translation unit
      # (kernel/ksu.c #includes hook/*.c). ksu_lsm_hook_init() is
      # `static __init` with a single caller (ksu_core_init(), itself static,
      # single caller kernelsu_init()), so Clang -O2 inlines it and no symbol is
      # emitted — CI run 35862553362 failed here with "missing symbol:
      # ksu_lsm_hook_init" while the other three passed.
      # Symbols below cannot be inlined away because their address is taken
      # (stored into an LSM slot, passed to kthread_run, or placed in the
      # initcall table), each gated on the config that compiles it:
      #   FATAL if missing (observed in CI run 35862553362):
      #     kernelsu_init             device_initcall entry
      #     susfs_is_inode_sus_path   fs/susfs.c
      #     ksu_task_fix_setuid       LSM_HACK_INIT arg (LSM_SECURITY_HOOKS=y)
      #   WARN only (chosen from source, NOT yet observed in a built vmlinux —
      #   UNVERIFIED, REQUIRES CONFIRMATION; promote to REQUIRED once a CI run
      #   shows them):
      #     ksu_inode_rename          LSM_HACK_INIT arg (LSM_SECURITY_HOOKS=y)
      #     ksu_bprm_committing_creds LSM_HACK_INIT arg (+ KSU_FEATURE_SULOG=y)
      #     ksu_syscall_table_restore kthread_run arg (TAMPER_SYSCALL_TABLE=y)
      # On any miss the step prints every ksu_/susfs_/kernelsu symbol found so
      # the list can be corrected. Name matching tolerates an LTO-style
      # ".llvm.<n>" suffix.
      - name: Guard pass — verify xxksu/SUSFS symbols
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          VMLINUX="$ABS_OUT/vmlinux"
          CFG="$ABS_OUT/.config"
          [[ -f "$VMLINUX" ]] || {
            echo "FATAL: vmlinux not found" >&2
            exit 1
          }
          if [[ -x "$ABS_TC/bin/llvm-nm" ]]; then
            NM="$ABS_TC/bin/llvm-nm"
          elif command -v llvm-nm >/dev/null 2>&1; then
            NM=llvm-nm
          else
            NM=nm
          fi
          "$NM" \
            "$VMLINUX" \
            > "$ABS_LOG/vmlinux-symbols.log" \
            2>&1 \
            || true
          REQUIRED=(
            kernelsu_init
            susfs_is_inode_sus_path
          )
          EXPECTED=()   # warn-only until observed in a real build
          if grep -qx 'CONFIG_KSU_LSM_SECURITY_HOOKS=y' "$CFG"; then
            REQUIRED+=(ksu_task_fix_setuid)
            EXPECTED+=(ksu_inode_rename)
            if grep -qx 'CONFIG_KSU_FEATURE_SULOG=y' "$CFG"; then
              EXPECTED+=(ksu_bprm_committing_creds)
            fi
          fi
          if grep -qx 'CONFIG_KSU_TAMPER_SYSCALL_TABLE=y' "$CFG"; then
            EXPECTED+=(ksu_syscall_table_restore)
          fi
          have_sym() {
            grep -qE "^[0-9a-fA-F]+ [A-Za-z] ${1}(\.llvm\.[0-9]+)?$" "$ABS_LOG/vmlinux-symbols.log"
          }
          FAIL=0
          WARN=0
          for sym in "${REQUIRED[@]}"; do
            if have_sym "$sym"; then
              echo "OK: $sym"
            else
              echo "FATAL: missing symbol: $sym"
              FAIL=1
            fi
          done
          for sym in "${EXPECTED[@]}"; do
            if have_sym "$sym"; then
              echo "OK (observed): $sym"
            else
              echo "::warning::expected symbol not found in vmlinux: $sym (UNVERIFIED guard entry — check the symbol list below)"
              WARN=1
            fi
          done
          if [[ "$FAIL" -ne 0 || "$WARN" -ne 0 ]]; then
            echo
            echo "ksu_/susfs_/kernelsu symbols actually present in vmlinux:"
            grep -E ' (ksu_|susfs_|kernelsu)' "$ABS_LOG/vmlinux-symbols.log" | head -80 || true
          fi
          [[ "$FAIL" -eq 0 ]] || exit 1
      # ── 20. Assemble legacy Samsung dtb.img ──────────────────────────────────
      - name: Assemble dtb.img from star2lte device DTBs
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART_DIR"
          DTB_SEARCH_DIR="$ABS_OUT/arch/arm64/boot/dts/exynos"
          mapfile -t DTB_FILES < <(
            find "$DTB_SEARCH_DIR" -maxdepth 1 -iname "*star2lte*.dtb" 2>/dev/null | sort
          )
          if [[ ${#DTB_FILES[@]} -eq 0 ]]; then
            echo "WARN: no star2lte-specific .dtb found; falling back to all .dtb files" \
              | tee -a "$ABS_LOG/dtb-assemble.log"
            mapfile -t DTB_FILES < <(
              find "$ABS_OUT/arch/arm64/boot/dts" -iname "*.dtb" 2>/dev/null | sort
            )
          fi
          if [[ ${#DTB_FILES[@]} -eq 0 ]]; then
            echo "FATAL: no .dtb files produced under $ABS_OUT/arch/arm64/boot/dts" >&2
            find "$ABS_OUT/arch/arm64/boot/dts" -type f 2>/dev/null >&2 || true
            exit 1
          fi
          echo "DTB file(s) found:" | tee -a "$ABS_LOG/dtb-assemble.log"
          printf '  %s\n' "${DTB_FILES[@]}" | tee -a "$ABS_LOG/dtb-assemble.log"
          cat "${DTB_FILES[@]}" > "$ART_DIR/dtb.img"
          if [[ ! -s "$ART_DIR/dtb.img" ]]; then
            echo "FATAL: dtb.img was not created or is empty" >&2
            exit 1
          fi
          echo "dtb.img size: $(stat -c%s "$ART_DIR/dtb.img") bytes" | tee -a "$ABS_LOG/dtb-assemble.log"
          cp "${DTB_FILES[@]}" "$ART_DIR/" 2>/dev/null || true
          echo "ART_DIR=$ART_DIR" >> "$GITHUB_ENV"
      # ── 20a. Capture actual kernel release ────────────────────────────────────
      - name: Capture actual kernel release
        if: ${{ inputs.dry_run != true }}
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          ACTUAL_RELEASE="$(
            make \
              --no-print-directory \
              O="$ABS_OUT" \
              ARCH=arm64 \
              CC=clang \
              LLVM=1 \
              LLVM_IAS=1 \
              HOSTLDFLAGS="$TC_HOSTLDFLAGS" \
              kernelrelease \
              | tail -n1
          )"
          [[ -n "$ACTUAL_RELEASE" ]] || {
            echo "FATAL: kernelrelease returned empty output" >&2
            exit 1
          }
          if [[ "$ACTUAL_RELEASE" == *$'\n'* ]]; then
            echo "FATAL: kernelrelease output still contains embedded newlines" >&2
            printf '%s\n' "$ACTUAL_RELEASE" >&2
            exit 1
          fi
          echo "ACTUAL_KERNEL_RELEASE=$ACTUAL_RELEASE" >> "$GITHUB_ENV"
          echo "Actual kernel release: $ACTUAL_RELEASE"
      # ── 20b. Generate identity-aware anykernel.sh ─────────────────────────────
      # Symbol list mirrors the vmlinux guard (step 19).
      - name: Generate identity-aware anykernel.sh
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail
          cat > "$GITHUB_WORKSPACE/anykernel.sh" <<AK3SH
          #!/usr/bin/env bash
          #
          # AnyKernel3 — Project Chimera Mk10 (xxksu + SUSFS v2.3.0)
          #
          # Kernel identity:
          #   Name:                    ${KERNEL_NAME}
          #   Version:                 ${KERNEL_VERSION}
          #   Kernel release (expected / actual): ${KERNEL_RELEASE} / ${ACTUAL_KERNEL_RELEASE}
          #   Device:                  ${KERNEL_DEVICE}
          #   Platform:                ${KERNEL_PLATFORM}
          #   Profile:                 ${PROFILE}
          #   Toolchain:               ${TOOLCHAIN}
          #   Compiler:                ${CLANG_VERSION}
          #   uname:                   ${UNAME_PREVIEW}
          #   Identity string:         ${KERNEL_IDENTITY}
          #
          # Source provenance:
          #   Base repo:               ${BASE_REPO}
          #   Base commit:             ${BASE_COMMIT}
          #   xxksu (KernelSU) commit: ${KSU_GIT_VERSION}
          #   Chimera overlay:         ${CHIMERA_REPO} @ ${CHIMERA_SHA}
          #
          # Build:
          #   Timestamp:               ${KBUILD_BUILD_TIMESTAMP}
          #   KCFLAGS:                 ${CHIMERA_KCFLAGS}
          #   KBUILD_LDFLAGS:          ${CHIMERA_KBUILD_LDFLAGS}
          #   KCFLAGS SHA-256:         ${KCFLAGS_HASH}
          #   Final config SHA-256:    ${FINAL_CONFIG_HASH}
          #
          # xxksu/SUSFS symbols verified present in vmlinux (self-hooking
          # fork — no manual call-site patches applied to fs/exec.c et al.):
          #   kernelsu_init (device_initcall entry point)
          #   susfs_is_inode_sus_path
          #   ksu_task_fix_setuid
          #
          properties() { '
          kernel.string=${UNAME_PREVIEW} ${KERNEL_IDENTITY} by AegisDevLabs | compiler=${CLANG_VERSION} | cfg_sha256=${FINAL_CONFIG_HASH:0:12} | base=${BASE_COMMIT:0:8} | ksu=${KSU_GIT_VERSION}
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=star2lte
          device.name2=star2ltexx
          device.name3=SM-G965F
          device.name4=SM-G965U
          device.name5=SM-G965N
          supported.versions=9-17
          '; }
          BLOCK=/dev/block/by-name/BOOT
          IS_SLOT_DEVICE=0
          RAMDISK_COMPRESSION=auto
          PATCH_VBMETA_FLAG=auto
          
          . tools/ak3-core.sh
          
          dump_boot
          write_boot
          AK3SH
          chmod +x "$GITHUB_WORKSPACE/anykernel.sh"
          {
            echo "AnyKernel3 identity:"
            sed -n '1,40p' "$GITHUB_WORKSPACE/anykernel.sh"
          } | tee "$ABS_LOG/anykernel-identity.txt"
      # ── 21. Package Image ─────────────────────────────────────────────────────
      - name: Package Image
        if: ${{ inputs.dry_run != true }}
        id: package-image
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -Eeuo pipefail
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ART_DIR"
          IMG="$ABS_OUT/arch/arm64/boot/Image"
          [[ -f "$IMG" ]] || {
            echo "FATAL: Image not found at $IMG" >&2
            exit 1
          }
          cp "$IMG" "$ART_DIR/Image"
          BUILD_TAG="chimera-mk10-${{ inputs.profile }}-${{ inputs.toolchain }}-$(date -u +%Y%m%dT%H%M%SZ)-${BASE_COMMIT:0:8}"
          echo "BUILD_TAG=$BUILD_TAG" >> "$GITHUB_ENV"
          echo "ART_DIR=$ART_DIR" >> "$GITHUB_ENV"
          echo "image_path=$ART_DIR/Image" >> "$GITHUB_OUTPUT"
          echo "dtb_path=$ART_DIR/dtb.img" >> "$GITHUB_OUTPUT"
      # ── 21b. Generate SHA-256 manifest ────────────────────────────────────────
      - name: Generate build manifest and SHA-256SUMS
        if: ${{ inputs.dry_run != true }}
        run: |
          set -Eeuo pipefail
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          ( cd "$ART_DIR" && sha256sum Image dtb.img > SHA256SUMS )
          [[ -s "$ART_DIR/SHA256SUMS" ]] || {
            echo "FATAL: SHA256SUMS was not generated or is empty" >&2
            exit 1
          }
          IMAGE_SHA256="$(cd "$ART_DIR" && sha256sum Image | cut -d' ' -f1)"
          DTB_SHA256="$(cd "$ART_DIR" && sha256sum dtb.img | cut -d' ' -f1)"
          cat > "$ART_DIR/manifest.json" << JSONEOF
          {
            "build_tag": "${BUILD_TAG}",
            "run_id": "${{ github.run_id }}",
            "profile": "${{ inputs.profile }}",
            "toolchain": "${{ inputs.toolchain }}",
            "source": {
              "chimera_repo": "${{ env.CHIMERA_REPO }}",
              "chimera_ref": "${{ env.CHIMERA_REF }}",
              "chimera_sha": "${{ env.CHIMERA_SHA }}",
              "base_repo": "${{ inputs.base_repo }}",
              "base_ref_requested": "${{ inputs.base_ref }}",
              "base_commit_actual": "${BASE_COMMIT}",
              "ksu_commit_requested": "${{ inputs.ksu_commit }}",
              "ksu_commit_actual": "${KSU_GIT_VERSION}",
              "ksu_fork": "xxksu (gavdoc38/KernelSU.git) v3.3.0"
            },
            "toolchain_identity": {
              "requested": "${{ inputs.toolchain }}",
              "cache_key": "${TC_CACHE_KEY}",
              "clang_version": "${CLANG_VERSION}",
              "identity_hash": "${TC_IDENTITY_HASH}"
            },
            "kernel_identity": {
              "name": "${KERNEL_NAME}",
              "version": "${KERNEL_VERSION}",
              "expected_release": "${KERNEL_RELEASE}",
              "actual_release": "${ACTUAL_KERNEL_RELEASE}",
              "device": "${KERNEL_DEVICE}",
              "platform": "${KERNEL_PLATFORM}",
              "uname_preview": "${UNAME_PREVIEW}",
              "kcflags": "${CHIMERA_KCFLAGS}",
              "kbuild_ldflags": "${CHIMERA_KBUILD_LDFLAGS}",
              "kcflags_sha256": "${KCFLAGS_HASH}",
              "identity_string": "${KERNEL_IDENTITY}"
            },
            "config": {
              "final_config_sha256": "${FINAL_CONFIG_HASH}"
            },
            "artifacts": {
              "Image": "sha256:${IMAGE_SHA256}",
              "dtb.img": "sha256:${DTB_SHA256}"
            }
          }
          JSONEOF
          echo "Manifest:"
          cat "$ART_DIR/manifest.json"
          echo
          echo "SHA256SUMS:"
          cat "$ART_DIR/SHA256SUMS"
      # ── 21c. Package AnyKernel3 flashable ZIP ─────────────────────────────────
      - name: Package AnyKernel3 flashable ZIP
        if: ${{ inputs.dry_run != true }}
        id: package-anykernel
        run: |
          set -Eeuo pipefail
          ART_DIR="$GITHUB_WORKSPACE/artifacts"
          AK3_DIR="${AK3_DIR:?AK3_DIR not set}"
          [[ -d "$AK3_DIR" ]] || {
            echo "FATAL: AnyKernel3 directory not found at $AK3_DIR" >&2
            exit 1
          }
          [[ -f "$GITHUB_WORKSPACE/anykernel.sh" ]] || {
            echo "FATAL: anykernel.sh not found at repo root" >&2
            exit 1
          }
          cp "$GITHUB_WORKSPACE/anykernel.sh" "$AK3_DIR/anykernel.sh"
          ZIP_NAME="${BUILD_TAG}-AnyKernel3.zip"
          ZIP_PATH="$ART_DIR/$ZIP_NAME"
          rm -f "$AK3_DIR/Image" "$AK3_DIR/dtb" "$AK3_DIR/Image.gz-dtb" "$ZIP_PATH"
          COMBINED="$ABS_OUT/arch/arm64/boot/Image.gz-dtb"
          SPLIT_IMAGE="$ART_DIR/Image"
          SPLIT_DTB="$ART_DIR/dtb.img"
          if [[ -f "$COMBINED" ]]; then
            echo "Found combined kernel payload: $COMBINED"
            cp "$COMBINED" "$AK3_DIR/Image.gz-dtb"
            echo "ak3_kernel_payload=Image.gz-dtb" >> "$GITHUB_OUTPUT"
          elif [[ -f "$SPLIT_IMAGE" ]]; then
            echo "Found split kernel payload: $SPLIT_IMAGE"
            cp "$SPLIT_IMAGE" "$AK3_DIR/Image"
            if [[ -f "$SPLIT_DTB" ]]; then
              cp "$SPLIT_DTB" "$AK3_DIR/dtb"
              echo "ak3_kernel_payload=Image + dtb" >> "$GITHUB_OUTPUT"
            else
              echo "WARN: $SPLIT_DTB not present — packaging Image only" | tee -a "$ABS_LOG/anykernel-package.log"
              echo "ak3_kernel_payload=Image only" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "FATAL: No valid kernel payload found" >&2
            exit 1
          fi
          ( cd "$AK3_DIR" && zip -r9 "$ZIP_PATH" . -x ".git/*" ".github/*" )
          [[ -s "$ZIP_PATH" ]] || {
            echo "FATAL: $ZIP_PATH was not created or is empty" >&2
            exit 1
          }
          echo "AnyKernel3 zip: $ZIP_PATH ($(stat -c%s "$ZIP_PATH") bytes)"
          echo "anykernel_zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
      # ── 22-23c. Upload artifacts — UNCHANGED from Mk9, name prefix mk10 ──────
      - name: Upload Image artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk10-Image-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: ${{ steps.package-image.outputs.image_path }}
          if-no-files-found: error

      - name: Upload dtb artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk10-dtb-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: |
            ${{ env.ART_DIR }}/dtb.img
            ${{ env.ART_DIR }}/*.dtb
          if-no-files-found: error

      - name: Upload manifest artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk10-manifest-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: |
            ${{ env.ART_DIR }}/manifest.json
            ${{ env.ART_DIR }}/SHA256SUMS
          if-no-files-found: error

      - name: Upload AnyKernel3 flashable ZIP
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk10-AnyKernel3-${{ inputs.profile }}-${{ inputs.toolchain }}-${{ github.run_id }}
          path: ${{ steps.package-anykernel.outputs.anykernel_zip_path }}
          if-no-files-found: error

      # ── 24. Release ───────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: ${{ inputs.do_release == true && inputs.dry_run != true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: "Chimera Mk10 — ${{ inputs.profile }} / ${{ inputs.toolchain }}"
          body: |
            ## Chimera Mk10 — gavdoc38 xxksu + SUSFS v2.3.0 Base Build
            | Field | Value |
            |---|---|
            | Base repo | `${{ inputs.base_repo }}` |
            | Base commit | `${{ env.BASE_COMMIT }}` |
            | xxksu (KernelSU) | `${{ env.KSU_GIT_VERSION }}` |
            | Chimera overlay | `${{ inputs.chimera_repo }}` @ `${{ env.CHIMERA_SHA }}` |
            | Profile | `${{ inputs.profile }}` |
            | Toolchain | `${{ inputs.toolchain }}` |
            | Compiler | `${{ env.CLANG_VERSION }}` |
            | Final config SHA-256 | `${{ env.FINAL_CONFIG_HASH }}` |
            | Kernel identity | `${{ env.KERNEL_IDENTITY }}` |
            | Kernel release (expected / actual) | `${{ env.KERNEL_RELEASE }}` / `${{ env.ACTUAL_KERNEL_RELEASE }}` |
            | KCFLAGS | `${{ env.CHIMERA_KCFLAGS }}` |
            | KBUILD_LDFLAGS | `${{ env.CHIMERA_KBUILD_LDFLAGS }}` |
            | KCFLAGS SHA-256 | `${{ env.KCFLAGS_HASH }}` |
            | uname | `${{ env.UNAME_PREVIEW }}` |
            xxksu/SUSFS symbols verified in vmlinux (self-hooking fork —
            no manual patches to fs/exec.c/fs/open.c/fs/stat.c/kernel/sys.c):
            - kernelsu_init
            - susfs_is_inode_sus_path
            - ksu_task_fix_setuid
            Image and dtb.img are packaged and attached separately. See
            SHA256SUMS / manifest.json for exact artifact hashes and full
            build provenance.
          files: |
            ${{ steps.package-image.outputs.image_path }}
            ${{ steps.package-image.outputs.dtb_path }}
            ${{ steps.package-anykernel.outputs.anykernel_zip_path }}
            ${{ env.ART_DIR }}/manifest.json
            ${{ env.ART_DIR }}/SHA256SUMS
          draft: false
          prerelease: false

      # ── 25. Upload logs ───────────────────────────────────────────────────────
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-mk10-logs-${{ github.run_id }}
          path: ${{ env.ABS_LOG }}/**
          if-no-files-found: warn
