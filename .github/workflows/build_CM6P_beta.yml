name: Project Chimera Mk6 Plus — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build"
        required: false
        type: boolean
        default: true

      do_release:
        description: "Create GitHub Release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      KERNEL_REPO: "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6l"

      #
      # sidex15 legacy-susfs-v2 already contains
      # native SUSFS integration glue.
      #
      # External susfs4ksu repo is only needed
      # for kernel patch payload/files.
      #

      KSU_REPO: "https://github.com/sidex15/KernelSU-Next.git"
      KSU_BRANCH: "legacy-susfs-v2"

      SUSFS_REPO: "https://gitlab.com/simonpunk/susfs4ksu.git"
      SUSFS_BRANCH: "kernel-4.9"

      KERNEL_DIR: "kernel"
      OUT_DIR: "out"
      LOG_DIR: "logs"

      DEFCONFIG: "exynos9810-star2lte_defconfig"

      NEUTRON_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"

    steps:

      # ─────────────────────────────────────────────
      # Workspace
      # ─────────────────────────────────────────────

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail

          mkdir -p \
            "$LOG_DIR" \
            "$OUT_DIR"

      # ─────────────────────────────────────────────
      # Dependencies
      # ─────────────────────────────────────────────

      - name: Install dependencies
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq

          sudo apt-get install -yqq \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            wget \
            zip \
            zstd

      # ─────────────────────────────────────────────
      # ccache
      # ─────────────────────────────────────────────

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: chimera-ccache-${{ github.ref_name }}
          restore-keys: |
            chimera-ccache-

      # ─────────────────────────────────────────────
      # Toolchain Cache
      # ─────────────────────────────────────────────

      - name: Cache Neutron Clang
        id: neutron-cache
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: neutron-clang-10032024

      - name: Download Neutron Clang
        if: steps.neutron-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail

          rm -rf neutron-clang
          mkdir -p neutron-clang

          wget -qO /tmp/neutron.tar.zst \
            "$NEUTRON_URL"

          tar \
            --zstd \
            -xf /tmp/neutron.tar.zst \
            -C neutron-clang \
            --strip-components=1

          test -x neutron-clang/bin/clang

          neutron-clang/bin/clang --version

      - name: Export toolchain
        run: |
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      # ─────────────────────────────────────────────
      # Clone Kernel
      # ─────────────────────────────────────────────

      - name: Clone kernel
        run: |
          set -Eeuo pipefail

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

      # ─────────────────────────────────────────────
      # Clone KernelSU-Next
      # ─────────────────────────────────────────────

      - name: Clone KernelSU-Next
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          rm -rf \
            KernelSU-Next \
            drivers/kernelsu

          git clone \
            --depth=1 \
            -b "$KSU_BRANCH" \
            "$KSU_REPO" \
            KernelSU-Next

          ln -sf \
            ../KernelSU-Next/kernel \
            drivers/kernelsu

          test -f drivers/kernelsu/Kconfig

      # ─────────────────────────────────────────────
      # Clone SUSFS
      # ─────────────────────────────────────────────

      - name: Clone SUSFS
        run: |
          set -Eeuo pipefail

          rm -rf susfs4ksu

          git clone \
            --depth=1 \
            -b "$SUSFS_BRANCH" \
            "$SUSFS_REPO" \
            susfs4ksu

      # ─────────────────────────────────────────────
      # Wire KernelSU
      # ─────────────────────────────────────────────

      - name: Wire KernelSU
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          sed -i \
            '/drivers\/kernelsu\/Kconfig/d' \
            drivers/Kconfig

          printf '\nsource "drivers/kernelsu/Kconfig"\n' \
            >> drivers/Kconfig

          grep -q 'obj-y += kernelsu/' drivers/Makefile || \
            echo 'obj-y += kernelsu/' >> drivers/Makefile

      # ─────────────────────────────────────────────
      # SUSFS Integration
      # ─────────────────────────────────────────────

      - name: Apply SUSFS integration
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          apply_patch_safe() {
            local patch="$1"

            if git apply --check "$patch" >/dev/null 2>&1; then
              git apply --whitespace=fix "$patch"
              echo "Applied: $patch"
            else
              echo "Skipped already-applied patch: $patch"
            fi
          }

          PATCH="$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.9.patch"

          apply_patch_safe "$PATCH"

          install -m644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/susfs.c" \
            fs/susfs.c

          install -m644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/fs/sus_su.c" \
            fs/sus_su.c

          install -m644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs.h" \
            include/linux/susfs.h

          install -m644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/susfs_def.h" \
            include/linux/susfs_def.h

          install -m644 \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/include/linux/sus_su.h" \
            include/linux/sus_su.h

          grep -q 'susfs.o' fs/Makefile || \
            echo 'obj-$(CONFIG_KSU_SUSFS) += susfs.o' >> fs/Makefile

          grep -q 'sus_su.o' fs/Makefile || \
            echo 'obj-$(CONFIG_KSU_SUSFS) += sus_su.o' >> fs/Makefile

      # ─────────────────────────────────────────────
      # Samsung 4.9 Compatibility Surgery
      # ─────────────────────────────────────────────

      - name: Samsung 4.9 compatibility fixes
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          #
          # Samsung 4.9 BSP compatibility
          #

          TARGET="KernelSU-Next/kernel/core_hook.c"

          if [[ -f "$TARGET" ]]; then

            printf '%s\n' \
              '#ifndef __KSU_SYSCALL_FN_T' \
              '#define __KSU_SYSCALL_FN_T' \
              'typedef long (*syscall_fn_t)(' \
              'unsigned long,' \
              'unsigned long,' \
              'unsigned long,' \
              'unsigned long,' \
              'unsigned long,' \
              'unsigned long);' \
              '#endif' \
              > /tmp/syscall_fix.h

            grep -q '__KSU_SYSCALL_FN_T' "$TARGET" || \
              cat /tmp/syscall_fix.h "$TARGET" > /tmp/core_hook.c

            if [[ -f /tmp/core_hook.c ]]; then
              mv /tmp/core_hook.c "$TARGET"
            fi

          fi

          #
          # Old Samsung trees may fail on warnings
          #

          find KernelSU-Next \
            -type f \
            \( -name '*.c' -o -name '*.h' \) \
            -exec sed -i 's/-Werror//g' {} +

      # ─────────────────────────────────────────────
      # Configure Kernel
      # ─────────────────────────────────────────────

      - name: Configure kernel
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          CFG="arch/arm64/configs/$DEFCONFIG"

          set_cfg() {
            sed -i "/^$1=/d;/^# $1 is not set/d" "$CFG"
            printf '%s=%s\n' "$1" "$2" >> "$CFG"
          }

          unset_cfg() {
            sed -i "/^$1=/d;/^# $1 is not set/d" "$CFG"
            printf '# %s is not set\n' "$1" >> "$CFG"
          }

          #
          # KernelSU
          #

          set_cfg CONFIG_KSU y

          #
          # SUSFS
          #

          set_cfg CONFIG_KSU_SUSFS y
          set_cfg CONFIG_KSU_SUSFS_SUS_PATH y
          set_cfg CONFIG_KSU_SUSFS_SUS_KSTAT y
          set_cfg CONFIG_KSU_SUSFS_TRY_UMOUNT y
          set_cfg CONFIG_KSU_SUSFS_SUS_MAP y

          #
          # Stable options
          #

          set_cfg CONFIG_KSU_SUSFS_OPEN_REDIRECT y
          set_cfg CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS y
          set_cfg CONFIG_KSU_SUSFS_SPOOF_UNAME y

          #
          # Unstable on Samsung 4.9
          #

          unset_cfg CONFIG_KSU_SUSFS_SUS_MOUNT

          #
          # SELinux hardening
          #

          unset_cfg CONFIG_SECURITY_SELINUX_DEVELOP
          unset_cfg CONFIG_SECURITY_SELINUX_BOOTPARAM
          unset_cfg CONFIG_SECURITY_SELINUX_DISABLE

          #
          # Scheduler
          #

          set_cfg CONFIG_PREEMPT y

          unset_cfg CONFIG_PREEMPT_NONE
          unset_cfg CONFIG_PREEMPT_VOLUNTARY

          set_cfg CONFIG_HZ_300 y
          set_cfg CONFIG_HZ 300

          #
          # Memory
          #

          set_cfg CONFIG_ZRAM y
          set_cfg CONFIG_ZSMALLOC y

          set_cfg CONFIG_CRYPTO_LZ4 y
          set_cfg CONFIG_CRYPTO_LZ4HC y

          #
          # Networking
          #

          set_cfg CONFIG_TCP_CONG_ADVANCED y
          set_cfg CONFIG_TCP_CONG_BBR y
          set_cfg CONFIG_TCP_CONG_CUBIC y

          sed -i \
            '/^CONFIG_DEFAULT_TCP_CONG=/d;/^# CONFIG_DEFAULT_TCP_CONG is not set/d' \
            "$CFG"

          printf 'CONFIG_DEFAULT_TCP_CONG="bbr"\n' >> "$CFG"

          #
          # Debugging
          #

          set_cfg CONFIG_SCHED_DEBUG y

          #
          # Clean localversion
          #

          unset_cfg CONFIG_LOCALVERSION_AUTO

      # ─────────────────────────────────────────────
      # Dry Run
      # ─────────────────────────────────────────────

      - name: Dry run
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "Dry run successful"

      # ─────────────────────────────────────────────
      # Build
      # ─────────────────────────────────────────────

      - name: Build kernel
        if: ${{ inputs.dry_run == false }}
        working-directory: kernel
        run: |
          set -Eeuo pipefail

          export ARCH=arm64
          export SUBARCH=arm64

          export KBUILD_BUILD_USER=REC
          export KBUILD_BUILD_HOST=CHIMERA

          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          export CCACHE_COMPRESS=1
          export CCACHE_DIR="$HOME/.ccache"
          export USE_CCACHE=1

          make \
            O=../$OUT_DIR \
            "$DEFCONFIG"

          make -j"$(nproc)" \
            O=../$OUT_DIR \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            KCFLAGS="-fcommon" \
            2>&1 | tee ../$LOG_DIR/build.log

          test -f \
            ../$OUT_DIR/arch/arm64/boot/Image

      # ─────────────────────────────────────────────
      # AnyKernel3 Packaging
      # ─────────────────────────────────────────────

      - name: Package AnyKernel3
        if: ${{ inputs.dry_run == false }}
        run: |
          set -Eeuo pipefail

          rm -rf AnyKernel3

          git clone \
            --depth=1 \
            https://github.com/osm0sis/AnyKernel3

          cp \
            out/arch/arm64/boot/Image \
            AnyKernel3/

          find \
            out/arch/arm64/boot/dts \
            -name '*.dtb' \
            -exec cp {} AnyKernel3/ \;

          cat > AnyKernel3/anykernel.sh <<'EOF'
          properties() { '
          kernel.string=Project Chimera Mk6 Plus
          do.devicecheck=1
          do.modules=0
          do.cleanup=1
          device.name1=star2lte
          '; }

          block=/dev/block/platform/11120000.ufs/by-name/BOOT;
          is_slot_device=0;
          ramdisk_compression=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          ZIP_NAME="chimera-mk6plus-${GITHUB_RUN_NUMBER}.zip"

          (
            cd AnyKernel3
            zip -r9 "../$ZIP_NAME" . -x '*.git*'
          )

          test -f "$ZIP_NAME"

      # ─────────────────────────────────────────────
      # Upload Logs
      # ─────────────────────────────────────────────

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chimera-logs
          path: |
            logs/
            out/.config

      # ─────────────────────────────────────────────
      # Upload Flashable ZIP
      # ─────────────────────────────────────────────

      - name: Upload flashable zip
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-artifact@v4
        with:
          name: chimera-kernel
          path: chimera-mk6plus-*.zip

      # ─────────────────────────────────────────────
      # GitHub Release
      # ─────────────────────────────────────────────

      - name: Create GitHub Release
        if: ${{ inputs.do_release == true && inputs.dry_run == false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: chimera-${{ github.run_number }}

          name: |
            Project Chimera Mk6 Plus
            Build #${{ github.run_number }}

          files: |
            chimera-mk6plus-*.zip

          body: |
            Project Chimera Mk6 Plus

            Device:
            - Exynos9810
            - star2lte

            Components:
            - KernelSU-Next legacy-susfs-v2
            - SUSFS kernel-4.9
            - Neutron Clang 10032024
