name: Project Chimera Mk6 Plus — Lineage 23.2 Build

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate only — skip build and package"
        required: false
        type: boolean
        default: true

      do_release:
        description: "Create a GitHub Release after successful build"
        required: false
        type: boolean
        default: false

      force_repatch:
        description: "Force re-apply KSU/SUSFS even if already present in tree"
        required: false
        type: boolean
        default: false

      ksu_repo:
        description: "KernelSU git URL (https only)"
        required: false
        type: string
        default: "https://github.com/sidex15/KernelSU-Next.git"

      ksu_ref:
        description: "KernelSU branch/tag/ref (used if ksu_commit is empty)"
        required: false
        type: string
        default: "legacy-susfs-v2"

      ksu_commit:
        description: "KernelSU exact commit SHA to pin (recommended)"
        required: false
        type: string
        default: ""

      susfs_repo:
        description: "SUSFS git URL (https only)"
        required: false
        type: string
        default: "https://gitlab.com/simonpunk/susfs4ksu.git"

      susfs_ref:
        description: "SUSFS branch/tag/ref (used if susfs_commit is empty)"
        required: false
        type: string
        default: "kernel-4.9"

      susfs_commit:
        description: "SUSFS exact commit SHA to pin (recommended)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Exynos9810 Kernel — Chimera Mk6 Plus
    runs-on: ubuntu-24.04

    defaults:
      run:
        shell: bash

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

      KERNEL_REPO: "https://github.com/royd-jpg/Project_Chimera"
      KERNEL_BRANCH: "chimera-mk6l"

      KERNEL_DIR: kernel
      OUT_DIR: kernel-out
      LOG_DIR: logs

      NEUTRON_URL: "https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst"
      NEUTRON_KEY: neutron-clang-10032024

      DEFCONFIG: arch/arm64/configs/exynos9810-star2lte_defconfig

      BRAND: "-6988168"
      SUSFS_TARGET_VERSION: "1.5.5"

    steps:

      - name: Prepare workspace
        run: |
          set -Eeuo pipefail
          trap 'echo "[ERR] ${BASH_SOURCE[0]}:${LINENO} command failed: ${BASH_COMMAND}" >&2' ERR

          mkdir -p "$LOG_DIR" "$OUT_DIR"

          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run_number=${GITHUB_RUN_NUMBER}"
            echo "dry_run=${{ inputs.dry_run }}"
            echo "do_release=${{ inputs.do_release }}"
            echo "force_repatch=${{ inputs.force_repatch }}"
          } | tee "$LOG_DIR/build-inputs.log"

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          trap 'echo "[ERR] ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          sudo apt-get update -qq

          sudo apt-get install -yqq \
            git curl wget bc flex bison python3 \
            libssl-dev libelf-dev build-essential \
            zip unzip zstd lz4 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi

      - name: Cache Neutron Clang
        id: cache-neutron
        uses: actions/cache@v4
        with:
          path: neutron-clang
          key: "${{ runner.os }}-${{ env.NEUTRON_KEY }}-${{ env.NEUTRON_URL }}"

      - name: Download Neutron Clang
        if: steps.cache-neutron.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          trap 'echo "[ERR] ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          rm -rf neutron-clang
          mkdir -p neutron-clang

          wget -qO /tmp/neutron.tar.zst "$NEUTRON_URL"

          tar -xf /tmp/neutron.tar.zst \
            -C neutron-clang \
            --strip-components=1

          test -x neutron-clang/bin/clang

          neutron-clang/bin/clang --version | tee "$LOG_DIR/toolchain.log"

      - name: Export toolchain PATH
        run: |
          set -Eeuo pipefail
          echo "$GITHUB_WORKSPACE/neutron-clang/bin" >> "$GITHUB_PATH"

      - name: Clone kernel tree
        run: |
          set -Eeuo pipefail
          trap 'echo "[ERR] ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          rm -rf "$KERNEL_DIR"

          git clone \
            --depth=1 \
            -b "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          git -C "$KERNEL_DIR" log --oneline -5 \
            | tee "$LOG_DIR/kernel-revision.log"

      - name: Preflight tree state
        working-directory: kernel
        run: |
          set -Eeuo pipefail
          trap 'echo "[ERR] ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          LOG="../$LOG_DIR/preflight.log"

          grep -RsnE \
            'source "drivers/kernelsu/Kconfig"|susfs_task_state|ksu_handle_faccessat' \
            fs include kernel arch/arm64/configs \
            2>/dev/null | tee -a "$LOG" || true

          ALREADY_PATCHED=false

          if grep -RqsE \
            'source "drivers/kernelsu/Kconfig"|susfs_task_state|ksu_handle_faccessat' \
            fs include kernel arch/arm64/configs 2>/dev/null; then
            ALREADY_PATCHED=true
          fi

          echo "ALREADY_PATCHED=$ALREADY_PATCHED" | tee -a "$LOG"

          if [[ "$ALREADY_PATCHED" == "true" && "${{ inputs.force_repatch }}" != "true" ]]; then
            echo "SKIP_INTEGRATION=true" >> "$GITHUB_ENV"
          else
            echo "SKIP_INTEGRATION=false" >> "$GITHUB_ENV"
          fi
