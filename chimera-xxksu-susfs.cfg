# ─────────────────────────────────────────────────────────────────────────────
# chimera-xxksu-susfs.cfg
#
# Every symbol below was read directly from:
#   KernelSU/kernel/Kconfig  @ f7d5ee64d3591b9158129774814d0629707dc7ac
#     (gavdoc38/KernelSU.git, submodule pin on
#      lineage-24.0-xxksu3-susfs2 @ d6c6d8b40231931d9054c60bc3d8dd55fc81e2c4)
#
# This is NOT KernelSU-Next. Do not merge this with a KernelSU-Next fragment —
# symbol names overlap (CONFIG_KSU, CONFIG_KSU_SUSFS) but semantics differ:
# this fork has no CONFIG_KSU_MANUAL_HOOK / CONFIG_KSU_KPROBES_HOOK symbols at
# all. Hook mode here is selected by CONFIG_KSU_TAMPER_SYSCALL_TABLE /
# CONFIG_KSU_HACK_ARM64_BRANCH_LINK / CONFIG_KSU_LSM_SECURITY_HOOKS /
# CONFIG_KSU_KPROBES_KSUD, which are mutually-exclusive-ish (see Kconfig
# `depends on !X` chains) rather than a single hook-mode switch.
#
# Dependency check performed against this base tree (not assumed):
#   - KSU_SUSFS depends on THREAD_INFO_IN_TASK -> arch/arm64/Kconfig:117
#     unconditionally `select`s this for arm64. Satisfied, no action needed.
#   - KSU depends on SECURITY_SELINUX -> already CONFIG_SECURITY_SELINUX=y
#     in arch/arm64/configs/exynos9810-star2lte_defconfig:764. Satisfied.
#   - KSU `select`s SECCOMP itself -> no manual SECCOMP= line needed.
#   - CONFIG_KALLSYMS is NOT set in the base star2lte defconfig. Not a hard
#     dependency for the default (non-LKM) hook path used below, but if a
#     future edit turns on CONFIG_KSU_HACK_ARM64_BRANCH_LINK or builds KSU=m,
#     re-check: KSU_HACK_ARM64_BRANCH_LINK `depends on ARM64 && KALLSYMS`.
#
# Built in-tree (bool, not module) -> KSU=y, not KSU=m. The `#ifndef MODULE`
# branch in kernel/ksu.c's top-of-file MODULE-only forcing block does NOT
# apply to this build; every symbol below must be set explicitly.
# ─────────────────────────────────────────────────────────────────────────────

# --- Core ---
CONFIG_KSU=y

# --- Hook mode: default combination this fork ships (verified in Kconfig) ---
# TAMPER_SYSCALL_TABLE: patches sys_call_table entries for sucompat + sys_reboot
# at runtime (sys_reboot, sys_execve, sys_newfstatat, sys_faccessat,
# sys_newfstat) — no source hook required in fs/exec.c/fs/open.c/fs/stat.c.
CONFIG_KSU_TAMPER_SYSCALL_TABLE=y

# LSM_SECURITY_HOOKS: on this kernel (4.9.337, LINUX_VERSION_CODE >= 4.2.0,
# < 6.8.0) compiles kernel/hook/lsm_hooks_list.c — a runtime pointer-rewrite
# of security_hook_heads slots (task_fix_setuid, inode_rename, setprocattr,
# bprm_committing_creds). Also self-registering; no manual security.c edit.
CONFIG_KSU_LSM_SECURITY_HOOKS=y

# Leave OFF (mutually exclusive with TAMPER_SYSCALL_TABLE per Kconfig
# `depends on !KSU_TAMPER_SYSCALL_TABLE`, and default n for KSU=y builtin):
# CONFIG_KSU_HACK_ARM64_BRANCH_LINK is not set
# CONFIG_KSU_KPROBES_KSUD is not set

# --- SUSFS v2.3.0 ---
CONFIG_KSU_SUSFS=y
CONFIG_KSU_SUSFS_SUS_PATH=y
CONFIG_KSU_SUSFS_SUS_MOUNT=y
CONFIG_KSU_SUSFS_SUS_KSTAT=y
CONFIG_KSU_SUSFS_TRY_UMOUNT=y
CONFIG_KSU_SUSFS_SPOOF_UNAME=y
CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
CONFIG_KSU_SUSFS_SUS_MAP=y
CONFIG_KSU_SUSFS_SUS_MEMFD=y

# Enable during bring-up/validation; consider disabling (n) for a release
# build once behavior is confirmed, per the symbol's own help text (kernel
# log noise vs. clean dmesg). Not disabled by default here — bring-up
# priority per your objectives.
CONFIG_KSU_SUSFS_ENABLE_LOG=y

# --- Optional KSU features (defaults, made explicit for auditability) ---
CONFIG_KSU_FEATURE_SULOG=y
CONFIG_KSU_FEATURE_ADBROOT=y

# --- Left at non-default / off deliberately ---
# Full UID checks validate every non-root UID against the allowlist instead
# of only shell (2000). Off = better performance, on = tighter security on
# permissive-SELinux/seccomp-disabled setups. UNVERIFIED which posture you
# want here — defaulting to the Kconfig default (n, performance).
# CONFIG_KSU_ENABLE_FULL_UID_CHECKS is not set

# /system/etc/hosts kernel-level redirect — only relevant if you're pairing
# with bindhosts mode 3. Off by default; enable explicitly if needed.
# CONFIG_KSU_HOSTSREDIRECT is not set
# ─────────────────────────────────────────────────────────────────────────────
